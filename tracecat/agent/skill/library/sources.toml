[groups.AWS]
summary = "IAM review and incident response for AWS"
description = "Amazon Web Services. Skills for securing and investigating AWS accounts: accurate IAM policy and trust reasoning, plus incident response for leaked credentials, STS session abuse, and API compromise."

[groups.Feedly]
summary = "Turn threat intelligence into detections and reports"
description = "Threat intelligence platform. Skills that turn intelligence into action: Sigma detections drafted from reports, OWASP-scored risk reduction reports, and structured intelligence requirements for CTI teams."

[groups."Google SecOps"]
summary = "Triage, investigate, hunt, and detect in SecOps"
description = "Google's SIEM and SOAR platform. Skills for the SOC workflow in SecOps: alert triage, deep entity investigation, proactive threat hunting, and YARA-L detection engineering."

