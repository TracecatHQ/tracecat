title: Potential Scheduled Task Abuse Via Suspicious Parent - Explicit Brackets
id: 9d5a3b21-7c8e-4fa2-b304-1e6f7c8d9b02
status: experimental
description: |
    Minimal reproduction of the Splunk OR-under-AND bracketing question. The selection is a
    list of maps, meaning an OR of two AND groups, and it sits under an AND with the
    logsource condition and a NOT filter.
references:
    - https://example.com/minimal-repro
author: fixture
date: 2026-08-24
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1053.005
    - stp.3
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        - ParentImage|endswith: '\svchost.exe'
          ParentCommandLine|contains: '-s Schedule'
        - ParentImage|endswith: '\taskeng.exe'
          Image|contains: '\AppData\Local\'
    filter_main_onedrive:
        Image|endswith: '\OneDriveSetup.exe'   # sourced: confirmed event, Microsoft signed updater
    condition: (selection) and not (filter_main_onedrive)
level: medium
