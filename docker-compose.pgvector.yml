# Compatibility file for deployments already using this override.
# New setups set TRACECAT__PGVECTOR_IMAGE in .env; base Compose files read it.
# Build from the deployed base with scripts/postgres/build-pgvector-image.sh.
# Set the resulting image before layering this file onto the base configuration.
services:
  postgres_db:
    image: ${TRACECAT__PGVECTOR_IMAGE:?Set TRACECAT__PGVECTOR_IMAGE to the derived image}
