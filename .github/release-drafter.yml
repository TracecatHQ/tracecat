# Release Drafter configuration.
#
# GENERATED SHAPE: the autolabeler and replacer regexes below are derived from
# .github/commit-conventions.toml. Edit that file, not these patterns, and let
# tests/unit/test_commit_conventions.py catch the two drifting apart.
#
# The pipeline in one line:
#   type -> type label, scope -> area label, first matching category -> section.
#
# - Every category label below must exist in the repo (`gh label list`).
#   A missing label silently drops its category, and the PRs it would have
#   held render at the top of the notes with no heading.
# - The autolabeler guarantees each PR receives at least one category label
#   derived from its conventional-commit type, so nothing renders headerless.
# - Categories are matched in order: each PR lands in the first category that
#   matches one of its labels.
#
# The autolabeler is deliberately more forgiving than
# scripts/check_pr_title.py. The checker only accepts canonical types and
# scopes so new titles converge; the autolabeler also understands every
# historical spelling so the already-merged backlog still categorizes.

name-template: Tracecat $RESOLVED_VERSION
tag-template: $RESOLVED_VERSION

change-template: "- $TITLE (#$NUMBER)"
change-title-escapes: '\<*_&'

exclude-labels:
  - release
  - skip changelog

# Category order is three tiers:
#   1-3   act on this: a breaking change, a security fix, a deprecation.
#   4-16  product areas, so a reader can find the part of Tracecat they use.
#   17-22 by kind, for everything no area claimed.
#
# Inside tier 2, features come before catalogs. A compound scope matches the
# first category it hits, so `feat(cases+actions)` lands in Case management
# rather than Core actions: the reader cares that case management gained
# something, not which package it was built from.
#
# Dependencies sits above Features and Fixes on purpose: `fix(deps)` carries
# both `deps` and `fix`, and first-match would otherwise file a dependency
# bump under Fixes.
categories:
  # 1
  - title: Breaking changes
    labels:
      - breaking

  # 2
  - title: Security
    labels:
      - security
      - audit

  # 3
  - title: Deprecations
    labels:
      - deprecation

  # 4
  - title: Case management
    labels:
      - cases

  # 5
  - title: Tables
    labels:
      - tables

  # 6
  - title: Agents
    labels:
      - agents
      - skills

  # 7
  - title: Tracecat MCP
    labels:
      - mcp

  # 8
  - title: Core actions
    labels:
      - actions

  # 9
  - title: Functions
    labels:
      - functions

  # 10
  - title: Integrations
    labels:
      - integrations

  # 11
  - title: Engine
    labels:
      - engine

  # 12
  - title: API
    labels:
      - api
      - rbac
      - enterprise

  # 13
  - title: User interface
    labels:
      - ui

  # 14
  - title: Infrastructure
    labels:
      - infra
      - self-hosted
      - migration
      - cicd

  # 15
  - title: Observability
    labels:
      - logging

  # 16
  - title: Documentation
    labels:
      - docs

  # 17
  - title: Performance
    labels:
      - perf

  # 18
  - title: Dependencies
    labels:
      - deps

  # 19
  - title: Features
    labels:
      - feat

  # 20
  - title: Fixes
    labels:
      - fix

  # 21
  - title: Build system
    labels:
      - build

  # 22
  - title: Other changes
    labels:
      - chore
      - refactor
      - tests
      - revert

autolabeler:
  # Two tiers:
  # - Tier A maps the conventional-commit type to a category label. Every
  #   well-formed title matches exactly one type rule, which is what
  #   guarantees no PR renders uncategorized.
  # - Tier B maps the (scope) to an area label so the PR lands in the most
  #   specific section, e.g. Integrations instead of Features.
  # All rules tolerate an optional bracketed bot prefix such as "[codex] "
  # and a compound scope such as (ui+api).

  # Tier A: type -> label

  # Example: build(deps): bump base images
  - label: build
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:build)(\([^)]*\))?!?: /'

  # Example: chore: update release drafter configuration
  - label: chore
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:chore)(\([^)]*\))?!?: /'

  # Example: ci(workflows): pin actions to immutable SHAs
  - label: cicd
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:ci)(\([^)]*\))?!?: /'

  # Example: deprecation(integrations): tools.x.list_signals in favour of tools.x.search_alerts
  - label: deprecation
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:deprecation|depr)(\([^)]*\))?!?: /'

  # Example: chore(deps): bump orjson
  - label: deps
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:deps)(\([^)]*\))?!?: /'

  # Example: docs: clarify secret environment use cases
  - label: docs
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:docs|doc)(\([^)]*\))?!?: /'

  # Example: feat(integrations): add 1Password SDK and Events API
  - label: feat
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:feat)(\([^)]*\))?!?: /'

  # Example: fix(agents): preserve runtime error attribution
  - label: fix
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:fix)(\([^)]*\))?!?: /'

  # Example: infra(fargate): raise executor memory limits
  - label: infra
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:infra|helm)(\([^)]*\))?!?: /'

  # Example: perf(engine): batch workflow event writes
  - label: perf
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:perf)(\([^)]*\))?!?: /'

  # Example: refactor(api): split the workspace router
  - label: refactor
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:refactor)(\([^)]*\))?!?: /'

  # Example: release: 1.0.0-beta.49
  - label: release
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:release)(\([^)]*\))?!?: /'

  # Example: revert(ui): restore the preset button
  - label: revert
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:revert)(\([^)]*\))?!?: /'

  # Example: security(deps): patch an unauthenticated RCE
  - label: security
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:security)(\([^)]*\))?!?: /'

  # Example: test(engine): cover retry backoff
  - label: tests
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?:tests|test)(\([^)]*\))?!?: /'

  # Example: feat(api)!: drop the v1 webhook payload
  - label: breaking
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+(\([^)]*\))?!: /'

  # GitHub's own revert titles carry no conventional-commit prefix.
  # Example: Revert "feat(mcp): add internal OIDC issuer"
  - label: chore
    title:
      - '/^Revert "/'

  # Tier B: scope -> area label

  # Example: fix(agents): preserve runtime error attribution
  - label: agents
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:agent-harness|artifacts|prompts|agents|claude|agent|inbox|tools|chat)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: fix(api): return 404 for missing workspaces
  - label: api
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:organization|invitations|pagination|workspaces|workspace|settings|webhooks|secrets|admin|auth|saml|api|cli|org)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: build(admin-cli): ship the operator CLI wheel
  - label: build
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:admin-cli|build)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(cases): add case duplication
  - label: cases
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:case-triggers|cases|case)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(actions): add a table lookup action
  - label: actions
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:core-actions|actions|core|udfs|udf)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: fix(functions): regex_extract corner case
  - label: functions
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*functions(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: build(deps): patch dependabot alerts
  - label: deps
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:deps)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: fix(docs): repair broken anchors
  - label: docs
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:playbooks|playbook|docs)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: fix(engine): retry transient action failures
  - label: engine
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:expressions|approvals|scheduler|executor|temporal|workflow|runtime|sandbox|workers|engine|worker|dsl)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(enterprise): gate SAML behind a tier
  - label: enterprise
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:enterprise|tiers|ee)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: fix(infra): wire LiteLLM URL into managed AI runtimes
  - label: infra
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:deployments|migration|terraform|cluster|fargate|storage|deploy|docker|chart|infra|helm|aws|cdk|eks|k8s|db)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(integrations): add Jira issue search
  - label: integrations
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:integrations|integration|registry|sync|git|vcs)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(audit): stream audit logs via webhook
  - label: audit
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:audit)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: fix(logging): redact secrets in executor logs
  - label: logging
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:observability|logging)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(mcp): add server health checks
  - label: mcp
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:mcp)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(rbac): add workspace-scoped roles
  - label: rbac
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:authz|rbac)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(skills): add a triage skill
  - label: skills
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:skills)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(tables): add unique indexes
  - label: tables
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:tables|table)(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(ui): replace preset button with @ mentions
  - label: ui
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*(?:frontend|canvas|ui|ux)(?:\+[a-z0-9_-]+)*\)!?: /'

  # `workflows` is the one scope whose area depends on the type:
  # ci(workflows) is GitHub Actions, feat(workflows) is the product engine.
  # Example: ci(workflows): pin actions to immutable SHAs
  - label: cicd
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?ci\((?:[a-z0-9_-]+\+)*workflows(?:\+[a-z0-9_-]+)*\)!?: /'

  # Example: feat(workflows): add a workflow alias resolver
  - label: engine
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?(?!ci\()[a-z]+\((?:[a-z0-9_-]+\+)*workflows(?:\+[a-z0-9_-]+)*\)!?: /'

  # Vendor absorption. Any scope that is neither canonical, an alias, nor on
  # the ambiguous list is read as a vendor name and filed under Integrations,
  # which is where the 69 long-tail scopes in history (jira, splunk, scc,
  # elastic_security, ...) belong. scripts/check_pr_title.py rejects these
  # instead: going forward the vendor goes in the description, not the scope.
  # Example: feat(splunk): add saved search export
  - label: integrations
    title:
      - '/^(\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?!(?:agent-harness|case-triggers|observability|core-actions|integrations|organization|deployments|expressions|integration|invitations|enterprise|pagination|workspaces|admin-cli|approvals|artifacts|functions|migration|playbooks|scheduler|terraform|workflows|workspace|executor|frontend|playbook|registry|settings|temporal|tracecat|webhooks|workflow|actions|cluster|fargate|logging|prompts|runtime|sandbox|secrets|service|storage|workers|agents|canvas|claude|config|deploy|docker|engine|skills|tables|worker|admin|agent|audit|authz|build|cases|chart|inbox|infra|table|tiers|tools|auth|case|chat|core|deps|docs|helm|rbac|saml|sync|udfs|api|app|aws|cdk|cli|dev|dsl|eks|git|k8s|mcp|org|udf|vcs|ai|db|ee|ui|ux)\))[a-z0-9_-]+\)!?: /'

# Presentation. Two passes: rewrite historical scope spellings to canonical
# ones so a release reads with one vocabulary, then capitalize each
# description. The type prefix stays visible and stays lowercase: it is the
# fastest signal a reader has for what kind of change a line is.
# A scope alias is rewritten wherever it appears in a compound scope.
replacers:
  # Normalise the prefix before anything else reads it.
  #
  # These sit at the top of the block on purpose. Every rule below matches a
  # lowercase type, so a title that never presented one -- `feat+fix(ui)`,
  # `Feat!(engine)`, `fix(mcp) ` with no colon -- slips past the scope aliases,
  # past `chore(deps)`, and reaches the capitalizer with nothing it recognises
  # as a prefix. The capitalizer then capitalizes the type instead of the
  # description, which is where `Feat+fix(ui): ...` in the published notes comes
  # from. Fixing the prefix first makes all three behave.

  # Trailing whitespace on a change line. Everything here is anchored on `$`,
  # and one stray space at the end of a pull request title silently defeats all
  # of it -- including `- $TITLE (#$NUMBER)`, which is how the line got here.
  - search: '/^(- .*?)[ \t]+$/gm'
    replace: '$1'
  # Leading whitespace, same cause: a title that opens on a space pushes the
  # description out of the capitalizer's reach.
  - search: '/^- [ \t]+(?=\S)/gm'
    replace: '- '
  # The doubled space a trailing space in the title leaves in front of `(#N)`.
  - search: '/^(- .*\S)[ \t]{2,}(\(#\d+\))$/gm'
    replace: '$1 $2'

  # A compound type. Only the first component survives: `feat+fix(ui)` is a
  # feature that also fixed something, and the section it belongs in is
  # Features.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?([a-z]+)(?:\+[a-z]+)+(\([^)\n]*\))?(!?): /gm'
    replace: '- $1$2$3$4: '

  # The same, capitalised, plus a bare `Feat:`. JavaScript has no case-folding
  # escape in a replacement string, so this is one rule per type, as with the
  # capitalizer below. The lookahead is `[(!:]` and deliberately not `\s`: a
  # prose bullet that opens on `Fix mouse scrolling ...` must be left alone.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Build(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1build'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Chore(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1chore'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Ci(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1ci'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Deprecation(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1deprecation'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Docs(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1docs'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Feat(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1feat'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Fix(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1fix'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Infra(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1infra'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Perf(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1perf'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Refactor(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1refactor'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Release(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1release'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Revert(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1revert'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Security(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1security'
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?Test(?:\+[A-Za-z]+)*(?=[(!:])/gm'
    replace: '- $1test'

  # A bang in front of the scope. `feat!(engine)` is what a writer reaches for
  # when the type feels like the breaking part; the legal position is after the
  # closing paren.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?([a-z]+)!(\([^)\n]*\)): /gm'
    replace: '- $1$2$3!: '

  # A Linear ticket id in front of the type. It names the issue, not the
  # change, and the pull request number is already at the other end of the line.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?[A-Z]{2,}-\d+[ \t]+(?=[a-z]+(?:\([^)\n]*\))?!?: )/gm'
    replace: '- $1'
  # The same id wedged between the scope and the colon. This is the shape
  # check_pr_title.py names in its own error text: with no colon after the
  # scope, nothing downstream sees a prefix at all.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?([a-z]+(?:\([^)\n]*\))?!?)[ \t]+[A-Z]{2,}-\d+: /gm'
    replace: '- $1$2: '
  # A missing colon after the scope. Must stay below the two ticket rules:
  # without them `feat(cases) ENG-1597: x` would gain a second colon rather
  # than lose the ticket.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?([a-z]+\([^)\n]*\)!?)[ \t]+(?=[A-Za-z0-9`\[])/gm'
    replace: '- $1$2: '
  # A doubled colon.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?([a-z]+(?:\([^)\n]*\))?!?):{2,}[ \t]/gm'
    replace: '- $1$2: '
  # More than one space after the colon, which hides the description from the
  # capitalizer entirely.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?([a-z]+(?:\([^)\n]*\))?!?:)[ \t]{2,}/gm'
    replace: '- $1$2 '

  # Retired type spellings. `[legacy_types]` in commit-conventions.toml already
  # declares what each one should have been, and the checker names that
  # replacement in its error text; these rules make the rendered line agree.
  # `deps(ui)` keeps the scope by folding it into a compound rather than
  # dropping it, so no information is lost.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?deps\(([a-z0-9_+-]+)\)(!?): /gm'
    replace: '- $1build(deps+$2)$3: '
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?deps(!?): /gm'
    replace: '- $1build(deps)$2: '
  # `tests` must not match `test`, and `doc` must not match `docs`: both need
  # the character after the type to be `(`, `!` or `:`, which the trailing
  # groups already require.
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?tests(\([^)\n]*\))?(!?): /gm'
    replace: '- $1test$2$3: '
  - search: '/^- (\[[A-Za-z0-9._-]+\]\s+)?doc(\([^)\n]*\))?(!?): /gm'
    replace: '- $1docs$2$3: '

  # Scope aliases. The alias must be a whole `+`-delimited component, so
  # `feat(ui+ee)` becomes `feat(ui+enterprise)` and `feat(github)` is left
  # alone. Same shape as the Tier B autolabeler rules above: complete
  # components before the alias, complete components after it, and the closing
  # paren. Two things that shape buys, both of which a bare `\b` would get
  # wrong: `integration` does not fire inside `integrations`, and `admin` does
  # not fire inside `admin-cli`, which is a `build` scope and would otherwise
  # be half-rewritten to `api-cli` before the `build` rule ever sees it.
  #
  # Known limitation: every rule here is `^`-anchored, so with the `g` flag it
  # can match at most once per line. A scope carrying two aliases from the SAME
  # group -- `feat(registry+git)`, both of them `integrations` -- gets only the
  # last one rewritten, leaving `feat(registry+integrations)`. Zero occurrences
  # in history, and the regex that fixed it would be worse than the defect.
  # Aliases from different groups are unaffected: each rule is its own pass,
  # so `feat(ux+ee)` still lands on `feat(ui+enterprise)`.
  # -> (actions)
  - search: '/^(- (?:\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*)(?:core-actions|core|udfs|udf)((?:\+[a-z0-9_-]+)*\)!?: )/gm'
    replace: '$1actions$2'
  # -> (agents)
  - search: '/^(- (?:\[[A-Za-z0-9._-]+\]\s+)?[a-z]+\((?:[a-z0-9_-]+\+)*)(?:agent-harness|artifacts|prompts|claude|agent|inbox|tools|chat)((?:\+[a-z0-9_-]+)*\)!?: )/gm'
    replace: '$1agents$2'
  # -> (api)
