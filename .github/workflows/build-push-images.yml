name: Publish images

on:
  push:
    branches: ["staging", "preview"]
    tags:
      - "*.*.*"
      - "nightly-*"
  schedule:
    - cron: "0 0 * * *"  # Nightly at midnight UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example: 1.2.3 or nightly-20250101)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      latest: ${{ steps.release.outputs.latest }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Validate image tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag=''
          latest=false
          release=false
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            # Manual rebuilds must use the existing tag as their checkout ref.
            if [[ "$REF_TYPE" != 'tag' || "$INPUT_TAG" != "$REF_NAME" ]]; then
              echo 'Dispatch from the matching tag ref, with tag set to that tag.' >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          elif [[ "$EVENT_NAME" == 'push' && "$REF_TYPE" == 'tag' ]]; then
            tag="$REF_NAME"
          fi

          if [[ -n "$tag" ]]; then
            stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
            if [[ "$tag" =~ ^${stable}$ ]]; then
              latest=true
              release=true
            elif [[ "$tag" =~ ^${stable}-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
              release=true
            elif ! [[ "$tag" =~ ^nightly-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
              echo "Unsupported image tag: $tag" >&2
              exit 1
            fi
            if (( ${#tag} > 128 )); then
              echo 'Image tags must be at most 128 characters.' >&2
              exit 1
            fi
          fi
          {
            echo "tag=$tag"
            echo "latest=$latest"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build-and-push-api:
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2404
            platform: linux/amd64
            platform_tag: linux-amd64
          - runner: blacksmith-8vcpu-ubuntu-2404-arm
            platform: linux/arm64
            platform_tag: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # The platform registry keys sync rows and S3 artifacts on
      # tracecat_registry.__version__, and reuses an existing artifact for a
      # known version. Non-release builds keep the release line's version, so
      # give each commit its own: .post<commit time> sorts above the base (an
      # upgrade, not a refused downgrade) and is the same on both platforms
      # and on any rebuild of the commit.
      - name: Stamp registry version on non-release builds
        if: needs.validate.outputs.release == 'false'
        shell: bash
        run: |
          set -euo pipefail
          init=packages/tracecat-registry/tracecat_registry/__init__.py
          suffix=".post$(git log -1 --format=%ct)"
          sed -i -E "s/^(__(pep440_)?version__ = \"[^\"]+)\"$/\1${suffix}\"/" "$init"
          stamped=$(grep -cF "${suffix}\"" "$init" || true)
          if [[ "$stamped" != 2 ]]; then
            echo "Expected 2 stamped version lines in $init, found $stamped." >&2
            exit 1
          fi
          grep -E '^__(pep440_)?version__ = ' "$init"

      - name: Disable IPv6 (Blacksmith VMs lack IPv6 routing)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Log in to Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/tracecathq/tracecat
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Layers and cache mounts persist on a Blacksmith sticky disk, so there
      # is no registry cache to import or export. Do not add
      # docker/setup-buildx-action to this job: its buildkitd makes this step
      # fall back to an uncached local builder.
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: Dockerfile-${{ matrix.platform_tag }}

      - name: Build and push by digest
        id: build
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/tracecathq/tracecat,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.platform_tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-api:
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    needs: [validate, build-and-push-api]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Disable IPv6 (Blacksmith VMs lack IPv6 routing)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/tracecathq/tracecat
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("ghcr.io/tracecathq/tracecat@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/tracecathq/tracecat:${{ steps.meta.outputs.version }}

  build-and-push-tunnel-gateway:
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2404
            platform: linux/amd64
            platform_tag: linux-amd64
          - runner: blacksmith-8vcpu-ubuntu-2404-arm
            platform: linux/arm64
            platform_tag: linux-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Disable IPv6 (Blacksmith VMs lack IPv6 routing)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Log in to Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/tracecathq/tracecat-tunnel-gateway
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Layers and cache mounts persist on a Blacksmith sticky disk, so there
      # is no registry cache to import or export. Do not add
      # docker/setup-buildx-action to this job: its buildkitd makes this step
      # fall back to an uncached local builder.
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: Dockerfile.tunnel-gateway-${{ matrix.platform_tag }}

      - name: Build and push by digest
        id: build
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: Dockerfile.tunnel-gateway
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/tracecathq/tracecat-tunnel-gateway,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/tunnel-gateway-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/tunnel-gateway-digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tunnel-gateway-digests-${{ matrix.platform_tag }}
          path: /tmp/tunnel-gateway-digests/*
          if-no-files-found: error
          retention-days: 1

  merge-tunnel-gateway:
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    needs: [validate, build-and-push-tunnel-gateway]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/tunnel-gateway-digests
          pattern: tunnel-gateway-digests-*
          merge-multiple: true

      - name: Disable IPv6 (Blacksmith VMs lack IPv6 routing)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/tracecathq/tracecat-tunnel-gateway
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create manifest list and push
        working-directory: /tmp/tunnel-gateway-digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("ghcr.io/tracecathq/tracecat-tunnel-gateway@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/tracecathq/tracecat-tunnel-gateway:${{ steps.meta.outputs.version }}

  build-and-push-ui:
    needs: validate
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.actor == 'github-actions[bot]' ||
      contains(
        fromJSON(vars.TRUSTED_CI_ACTORS_JSON || '[]'),
        github.triggering_actor || github.actor
      )
    # The Next.js bundle is platform independent, so one amd64 runner compiles
    # it once (see frontend/Dockerfile.prod) and only the small runner stage is
    # built per platform. arm64 runner-stage steps run under QEMU.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Disable IPv6 (Blacksmith VMs lack IPv6 routing)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      # Register arm64 emulation before the builder starts its buildkitd.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Log in to Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/tracecathq/tracecat-ui
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.event_name == 'schedule' }}
            type=match,pattern=nightly-(.*),group=0
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Do not add docker/setup-buildx-action to this job: its buildkitd makes
      # this step fall back to an uncached local builder.
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: frontend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64

      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_SERVER_API_URL: http://localhost:8000
          NODE_ENV: production
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_ENV=${{ env.NEXT_PUBLIC_APP_ENV }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_SERVER_API_URL=${{ env.NEXT_SERVER_API_URL }}
            NODE_ENV=${{ env.NODE_ENV }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true

  promote-latest:
    needs: [validate, merge-api, build-and-push-ui, merge-tunnel-gateway]
    if: needs.validate.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Hold one lock across both updates, including releases from other trains.
    concurrency:
      group: publish-images-latest
      queue: max
      cancel-in-progress: false
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote both stable manifests to latest
        env:
          VERSION: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # latest only moves forward, so an older train's patch leaves it alone.
          latest=ghcr.io/tracecathq/tracecat:latest
          current=''
          # --raw reads only the tag's own manifest, so "not found" here means
          # the tag is absent (the first promotion), not missing child content.
          if ! root=$(docker buildx imagetools inspect --raw "$latest" 2>&1); then
            if [[ "$root" != *"$latest: not found"* ]]; then
              echo "$root" >&2
              exit 1
            fi
          else
            # Any failure reading the label stops the job.
            current=$(docker buildx imagetools inspect "$latest" \
              --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.version" }}')
            if [[ -z "$current" ]]; then
              echo 'Could not read the version label on latest.' >&2
              exit 1
            fi
          fi
          if [[ -n "$current" && "$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "latest is $current, newer than $VERSION; leaving it unchanged."
            exit 0
          fi
          for image in tracecat tracecat-ui tracecat-tunnel-gateway; do
            docker buildx imagetools create \
              --tag "ghcr.io/tracecathq/$image:latest" \
              "ghcr.io/tracecathq/$image:$VERSION"
          done
