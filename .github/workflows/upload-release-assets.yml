name: Upload release assets

# Attach the Docker Compose install files to each published release, so the
# docs can link to releases/latest/download/<file> and
# releases/download/<version>/<file>.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: upload-release-assets-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if ! [[ "$TAG" =~ ^${stable}$ || "$TAG" =~ ^${stable}-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi
          if (( ${#TAG} > 128 )); then
            echo 'Release tags must be at most 128 characters.' >&2
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            docker-compose.yml
            docker-compose.sandbox.yml
            .env.example
            env.sh
            env-migration.sh
            Caddyfile
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing release asset at $TAG: $asset" >&2
              exit 1
            fi
          done
          gh release upload "$TAG" "${assets[@]}" --clobber -R "$GITHUB_REPOSITORY"
