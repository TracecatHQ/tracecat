# Shared infrastructure, started once per machine and reused by every
# standalone stack. Driven by `scripts/cluster` as its own Compose project
# (tracecat-shared-infra); it is not meant to be run by hand.
#
# Each service publishes a `tracecat-shared-*` network alias. Stacks address
# infra by those aliases, never by host port, so the published ports below can
# move without touching any stack.
#
# Published ports are the dev-cluster bases + 10. `scripts/cluster` allocates
# dev clusters on a stride of 100 from those same bases, so +10 can never
# collide with any cluster number.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=128MB"]
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${TRACECAT__POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TRACECAT__POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${TC_SHARED_PG_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      default:
        aliases:
          - tracecat-shared-postgres

  temporal:
    image: temporalio/temporal:1.8.0
    restart: unless-stopped
    # The image runs as uid 1000 (temporal), but a fresh named volume mounted
    # at /data is root-owned, so the dev server cannot create its SQLite file.
    user: root
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "127.0.0.1:${TC_SHARED_TEMPORAL_PORT:-7243}:7233"
      - "127.0.0.1:${TC_SHARED_TEMPORAL_UI_PORT:-8243}:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "localhost:7233",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      default:
        aliases:
          - tracecat-shared-temporal

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "127.0.0.1:${TC_SHARED_MINIO_PORT:-9010}:9000"
      - "127.0.0.1:${TC_SHARED_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - tracecat-shared-minio

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${TC_SHARED_REDIS_PORT:-6389}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - tracecat-shared-redis

networks:
  default:
    name: tracecat-shared-infra

volumes:
  postgres-data:
  temporal-data:
  minio-data:
  redis-data:
