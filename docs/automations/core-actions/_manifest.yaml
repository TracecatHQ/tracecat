  - slug: memory-actions/tables
    title: Tables
    info: |
      Tables are the built-in structured data store behind `core.table.*`.
      Use them when your workflows need durable, queryable records such as asset inventories, user allowlists, enrichment results, or investigation evidence.

      ## Common workflow pattern

      1. Create the table once with a schema that fits your data and a unique index on the upsert column.
      2. Insert or upsert rows as new events arrive.
      3. Look up, search, or export rows later from another workflow step.

      ```yaml
      - ref: ensure_inventory_table
        action: core.table.create_table
        args:
          name: asset_inventory
          columns:
            - name: hostname
              type: TEXT
            - name: owner
              type: TEXT
            - name: last_seen
              type: TIMESTAMPTZ
          raise_on_duplicate: false
      - ref: inventory_metadata
        action: core.table.get_table_metadata
        depends_on:
          - ensure_inventory_table
        args:
          name: asset_inventory
      - ref: index_hostname
        action: core.table.update_column
        depends_on:
          - inventory_metadata
        run_if: ${{ FN.length(ACTIONS.inventory_metadata.result.columns[?(@.is_index == true)]) == 0 }}
        args:
          table: asset_inventory
          column: hostname
          update:
            is_index: true
      - ref: upsert_asset
        action: core.table.insert_row
        depends_on:
          - inventory_metadata
          - index_hostname
        join_strategy: any
        args:
          table: asset_inventory
          upsert: true
          row_data:
            hostname: ${{ TRIGGER.hostname }}
            owner: ${{ TRIGGER.owner }}
            last_seen: ${{ FN.now() }}
      - ref: find_asset
        action: core.table.lookup
        depends_on:
          - upsert_asset
        args:
          table: asset_inventory
          column: hostname
          value: ${{ TRIGGER.hostname }}
      ```

      ## Column schema

      `core.table.create_table` takes `columns` as a JSON array of column objects.
      This is the same schema you use for tables that you later link to cases.

      - `name`: Required string. Use letters, numbers, and underscores, and start with a letter or underscore.
      - `type`: Required uppercase string. Use `TEXT`, `INTEGER`, `NUMERIC`, `BOOLEAN`, `DATE`, `TIMESTAMPTZ`, `JSONB`, `SELECT`, or `MULTI_SELECT`.
      - `nullable`: Optional boolean. Defaults to `true`.
      - `default`: Optional value. It must match the column type.
      - `options`: Optional array of strings. Required for `SELECT` and `MULTI_SELECT`, and invalid for other types.

      The documented `type` values match the custom tables picker, and case custom fields use the same storage types.
      The case field picker surfaces raw `JSONB` through the `URL` kind and layers `Long text` on top of `TEXT`.

      Create a table with a `SELECT` column:

      ```yaml
      - ref: create_table
        action: core.table.create_table
        args:
          name: asset_inventory
          columns:
            - name: hostname
              type: TEXT
            - name: first_seen_at
              type: TIMESTAMPTZ
            - name: owner_team
              type: SELECT
              options:
                - secops
                - platform
                - it
      ```

      ## Reading rows

      - Use `lookup` or `is_in` when you already know the column and value you need.
      - Use `search_rows` when you need broader text search or paginated results.
      - Use `download` when you want to export rows as JSON, NDJSON, CSV, or Markdown.

      ## FAQ

      <AccordionGroup>
        <Accordion title="How do I insert more than 1000 rows into a table?">
          Split large imports into batches upstream, then run one `insert_rows` action per batch.

          ```yaml
          - ref: insert_batch
            action: core.table.insert_rows
            for_each: ${{ for var.batch in TRIGGER.row_batches }}
            args:
              table: asset_inventory
              rows_data: ${{ var.batch }}
          ```

          Keep each `var.batch` within your chosen batch size.
        </Accordion>
      </AccordionGroup>
    actions:
      - id: core.table.create_table
        info: |
          <Info>
            `columns` takes the column objects described in
            [Column schema](#column-schema).
          </Info>
        examples:
          - tables-admin
      - id: core.table.list_tables
        examples:
          - tables-admin
      - id: core.table.get_table_metadata
        examples:
          - tables-admin
      - id: core.table.update_table
        examples:
          - tables-rename
      - id: core.table.create_column
        examples:
          - tables-schema
      - id: core.table.update_column
        info: |
          Set `update: {is_index: true}` to create the table's unique index on
          the column; `core.table.insert_row` with `upsert: true` uses it to
          deduplicate writes. A table can have one single-column unique index:
          creation fails if the column already contains duplicate values, and a
          second `is_index: true` call raises `Table cannot have multiple
          unique indexes`.

          Guard the step when a workflow repeats it; see
          [Tables](/automations/tables#index-and-upsert).
        examples:
          - tables-unique-index
      - id: core.table.delete_column
        examples:
          - tables-drop-column
      - id: core.table.lookup
        examples:
          - tables-lookup
      - id: core.table.is_in
        examples:
          - tables-lookup
      - id: core.table.lookup_many
        examples:
          - tables-lookup
      - id: core.table.search_rows
        examples:
          - tables-search
      - id: core.table.insert_row
        examples:
          - tables-write
      - id: core.table.insert_rows
        examples:
          - tables-write
      - id: core.table.update_row
        examples:
          - tables-write
      - id: core.table.delete_row
        examples:
          - tables-write
      - id: core.table.download
        examples:
