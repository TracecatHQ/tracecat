      ## FAQ

      <AccordionGroup>
        <Accordion title="Why does inline lambda not work inside expressions?">
          Python lambda functions are not part of the expression language; pass them as strings to `core.transform.apply`, `core.transform.filter`, or `core.transform.map`.

          Use `FN.*` for short inline transforms, and use `core.transform.*` when you need Python-style per-item logic.

          ```yaml
          - ref: extract_ids
            action: core.transform.map
            args:
              items: ${{ TRIGGER.findings }}
              python_lambda: "lambda finding: finding.get('id')"
          ```
        </Accordion>

        <Accordion title="How do I inspect the shape of API results before using map, filter, or for_each?">
          Read `ACTIONS.<ref>.result_typename` for the Python type name of an action's result (`dict`, `list`, `str`, ...).
          Pair it with a small debug reshape step to confirm the count and the field path you plan to iterate over.

          ```yaml
          - ref: inspect_findings
            action: core.transform.reshape
            args:
              value:
                result_type: ${{ ACTIONS.fetch_findings.result_typename }}
                findings_count: ${{ FN.length(ACTIONS.fetch_findings.result.findings) if ACTIONS.fetch_findings.result != None else 0 }}
          ```
        </Accordion>
      </AccordionGroup>

