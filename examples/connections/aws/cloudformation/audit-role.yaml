AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  EntryRoleArns:
    Type: CommaDelimitedList
Resources:
  AuditRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: TracecatSecOpsAuditRole
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref EntryRoleArns
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
