# Optional local sandbox privileges for nsjail and SquashFS registry mounts.
# Usage:
#   TRACECAT__DISABLE_NSJAIL=false docker compose \
#     -f docker-compose.dev.yml -f docker-compose.sandbox.yml up
#   just cluster --sandbox up -d

services:
  executor:
    environment:
      TRACECAT__DISABLE_NSJAIL: ${TRACECAT__DISABLE_NSJAIL:-false}
    # Hard cap on total processes (incl. all jails and their children):
    # in-jail RLIMIT_NPROC is bypassable via nested user namespaces (fresh
    # per-userns fork counter), so the container cgroup pids limit is the
    # reliable fork-bomb bound. Verify headroom when adding jail workloads.
    pids_limit: 1024
    # Required for nsjail sandbox execution.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    # SquashFS registry artifact mounts additionally need loop-device access;
    # Docker's device cgroup blocks /dev/loop* with SYS_ADMIN alone.
    privileged: true

  agent-executor:
    # Same fork-bomb bound as executor (nested userns bypasses in-jail caps).
    pids_limit: 1024
    # Required for nsjail sandbox execution.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
