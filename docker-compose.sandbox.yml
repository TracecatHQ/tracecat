# Optional local sandbox privileges for nsjail and SquashFS registry mounts.
# Usage:
#   docker compose -f docker-compose.dev.yml -f docker-compose.sandbox.yml up
#   just cluster --sandbox up -d

services:
  executor:
    # Required for nsjail sandbox execution.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    # SquashFS registry artifact mounts additionally need loop-device access;
    # Docker's device cgroup blocks /dev/loop* with SYS_ADMIN alone.
    privileged: true

  agent-executor:
    # Required for nsjail sandbox execution.
    cap_add:
      - SYS_ADMIN
    # Start the entrypoint as root so it can delegate the container's cgroup
    # v2 subtree to apiuser for per-sandbox memory limits; it drops privileges
    # before the worker starts. The flag is coupled to user "0:0" — override
    # neither independently.
    user: "0:0"
    environment:
      TRACECAT__ENTRYPOINT_CGROUP_DELEGATE: "true"
      TRACECAT__AGENT_SANDBOX_MEMORY_MB: ${TRACECAT__AGENT_SANDBOX_MEMORY_MB:-4096}
      TRACECAT__AGENT_SANDBOX_CGROUP_ENABLED: ${TRACECAT__AGENT_SANDBOX_CGROUP_ENABLED:-true}
      TRACECAT__AGENT_EXECUTOR_MEMORY_RESERVE_MB: ${TRACECAT__AGENT_EXECUTOR_MEMORY_RESERVE_MB:-4096}
      TRACECAT__AGENT_EXECUTOR_READY_FILE: ${TRACECAT__AGENT_EXECUTOR_READY_FILE:-/var/run/tracecat/agent-executor-ready}
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "test", "-f", "${TRACECAT__AGENT_EXECUTOR_READY_FILE:-/var/run/tracecat/agent-executor-ready}"]
      interval: 30s
      retries: 3
      start_period: 120s
