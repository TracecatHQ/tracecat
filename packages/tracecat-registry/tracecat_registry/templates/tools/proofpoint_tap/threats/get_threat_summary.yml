type: action
definition:
  title: "Get threat summary"
  description: "Get a summary of a threat, including its type, status, severity, classification, and associated campaigns and actors, with GET /v2/threat/summary/{threatId}."
  display_group: Proofpoint TAP
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Threat_API
  namespace: tools.proofpoint_tap
  name: get_threat_summary
  secrets:
    - name: proofpoint_tap
      keys: ["PROOFPOINT_TAP_SERVICE_PRINCIPAL", "PROOFPOINT_TAP_SERVICE_SECRET"]
  expects:
    threatId:
      type: str
      description: "Threat ID."
    base_url:
      type: str | None
      description: "Proofpoint TAP API base URL. Defaults to https://tap-api-v2.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_tap.base_url || "https://tap-api-v2.proofpoint.com" }}/v2/threat/summary/${{ FN.url_encode(inputs.threatId) }}
        method: GET
        auth:
          username: ${{ SECRETS.proofpoint_tap.PROOFPOINT_TAP_SERVICE_PRINCIPAL }}
          password: ${{ SECRETS.proofpoint_tap.PROOFPOINT_TAP_SERVICE_SECRET }}
  returns: ${{ steps.request.result }}
