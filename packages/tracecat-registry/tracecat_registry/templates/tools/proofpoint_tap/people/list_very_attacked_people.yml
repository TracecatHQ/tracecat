type: action
definition:
  title: "List very attacked people"
  description: "List Very Attacked People (VAPs) in the organization ranked by attack index over a time window with GET /v2/people/vap."
  display_group: Proofpoint TAP
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/People_API
  namespace: tools.proofpoint_tap
  name: list_very_attacked_people
  secrets:
    - name: proofpoint_tap
      keys: ["PROOFPOINT_TAP_SERVICE_PRINCIPAL", "PROOFPOINT_TAP_SERVICE_SECRET"]
  expects:
    window:
      type: int
      description: "Number of days to report on. Valid values: 14, 30, 90."
    size:
      type: int | None
      description: "Maximum number of people per page. Defaults to 1000."
      default: null
    page:
      type: int | None
      description: "Page of results to return, starting at 1. Defaults to 1."
      default: null
    base_url:
      type: str | None
      description: "Proofpoint TAP API base URL. Defaults to https://tap-api-v2.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_tap.base_url || "https://tap-api-v2.proofpoint.com" }}/v2/people/vap
        method: GET
        params:
          window: ${{ inputs.window }}
          size: ${{ inputs.size }}
          page: ${{ inputs.page }}
        auth:
          username: ${{ SECRETS.proofpoint_tap.PROOFPOINT_TAP_SERVICE_PRINCIPAL }}
          password: ${{ SECRETS.proofpoint_tap.PROOFPOINT_TAP_SERVICE_SECRET }}
  returns: ${{ steps.request.result }}
