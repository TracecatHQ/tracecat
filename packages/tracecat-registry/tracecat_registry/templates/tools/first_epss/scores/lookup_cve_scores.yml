type: action
definition:
  title: Lookup CVE scores
  description: >-
    Look up CVE scores. Calls GET /data/v1/epss directly for one or more CVE identifiers.
  display_group: FIRST EPSS
  doc_url: https://api.first.org/epss/
  namespace: tools.first_epss
  name: lookup_cve_scores
  expects:
    cve:
      type: str
      description: Filters by EPSS CVE ID. Multiple values are supported separated by commas. The maximum size accepted for this parameter is 2000 characters (including commas).
    date:
      type: str | None
      description: Date in the format YYYY-MM-DD (since April 14, 2021), shows the historic values for epss and percentile attributes.
      default: null
    offset:
      type: int | None
      description: Offsets the list of records by this number. The first item is 0.
      default: null
    limit:
      type: int | None
      description: Limits the maximun number of records to be shown. Should be an integer number between 0 and 10,000.
      default: null
    base_url:
      type: str | None
      description: Base URL of the FIRST API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.first_epss.base_url || "https://api.first.org" }}/data/v1/epss
        method: GET
        headers:
          Accept: application/json
        params:
          cve: ${{ inputs.cve }}
          date: ${{ inputs.date }}
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.request.result }}
