type: action
definition:
  title: Get time series
  description: >-
    Get an EPSS time series. Calls GET /data/v1/epss directly with scope=time-series for one CVE.
  display_group: FIRST EPSS
  doc_url: https://api.first.org/epss/
  namespace: tools.first_epss
  name: get_time_series
  expects:
    cve:
      type: str
      description: CVE identifier to retrieve as a time series.
    params:
      type: dict[str, Any] | None
      description: Additional API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the FIRST API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.first_epss.base_url || "https://api.first.org" }}/data/v1/epss
        method: GET
        headers:
          Accept: application/json
        params: '${{ FN.merge([inputs.params || {}, {"cve": inputs.cve, "scope": "time-series"}]) }}'
  returns: ${{ steps.request.result }}
