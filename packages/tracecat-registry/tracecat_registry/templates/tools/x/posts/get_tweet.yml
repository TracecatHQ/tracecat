type: action
definition:
  title: Get tweet
  description: Get a post. Calls GET /2/tweets/{tweet_id} directly.
  display_group: X
  doc_url: https://docs.x.com/x-api/posts/get-post-by-id
  namespace: tools.x
  name: get_tweet
  secrets:
    - name: x
      keys: ["X_APP_ONLY_TOKEN"]
  expects:
    tweet_id:
      type: str
      description: X post ID.
    tweet_fields:
      type: str | None
      description: A comma separated list of Post fields to display.
      default: null
    expansions:
      type: str | None
      description: A comma separated list of fields to expand.
      default: null
    user_fields:
      type: str | None
      description: A comma separated list of User fields to display.
      default: null
    media_fields:
      type: str | None
      description: A comma separated list of Media fields to display.
      default: null
    poll_fields:
      type: str | None
      description: A comma separated list of Poll fields to display.
      default: null
    place_fields:
      type: str | None
      description: A comma separated list of Place fields to display.
      default: null
    base_url:
      type: str | None
      description: Base URL of the X API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.x.base_url || "https://api.x.com" }}/2/tweets/${{ FN.url_encode(inputs.tweet_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.x.X_APP_ONLY_TOKEN }}
          Accept: application/json
        params:
          "tweet.fields": ${{ inputs.tweet_fields }}
          expansions: ${{ inputs.expansions }}
          "user.fields": ${{ inputs.user_fields }}
          "media.fields": ${{ inputs.media_fields }}
          "poll.fields": ${{ inputs.poll_fields }}
          "place.fields": ${{ inputs.place_fields }}
  returns: ${{ steps.request.result }}
