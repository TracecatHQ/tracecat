type: action
definition:
  title: Get user
  description: Get a user. Calls GET /2/users/{user_id} directly.
  display_group: X
  doc_url: https://docs.x.com/x-api/users/get-user-by-id
  namespace: tools.x
  name: get_user
  secrets:
    - name: x
      keys: ["X_APP_ONLY_TOKEN"]
  expects:
    user_id:
      type: str
      description: X user ID.
    user_fields:
      type: str | None
      description: A comma separated list of User fields to display.
      default: null
    expansions:
      type: str | None
      description: A comma separated list of fields to expand.
      default: null
    tweet_fields:
      type: str | None
      description: A comma separated list of Post fields to display.
      default: null
    base_url:
      type: str | None
      description: Base URL of the X API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.x.base_url || "https://api.x.com" }}/2/users/${{ FN.url_encode(inputs.user_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.x.X_APP_ONLY_TOKEN }}
          Accept: application/json
        params:
          "user.fields": ${{ inputs.user_fields }}
          expansions: ${{ inputs.expansions }}
          "tweet.fields": ${{ inputs.tweet_fields }}
  returns: ${{ steps.request.result }}
