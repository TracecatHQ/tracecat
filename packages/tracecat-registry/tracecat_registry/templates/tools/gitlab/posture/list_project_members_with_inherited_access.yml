type: action
definition:
  title: List project members with inherited access
  description: >-
    List project members with inherited access. Calls GET /projects/{project_id}/members/all directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: list_project_members_with_inherited_access
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    query:
      type: str | None
      description: Filters results based on a given name, email, or username. Use partial values to widen the scope of the query.
      default: null
    user_ids:
      type: str | None
      description: Filter the results on the given user IDs, as a comma-separated list.
      default: null
    show_seat_info:
      type: bool | None
      description: Show seat information for users.
      default: null
    state:
      type: str | None
      description: Filter results by member state, one of `awaiting` or `active`. Premium and Ultimate only.
      default: null
    page:
      type: int | None
      description: "Page number (default: `1`)."
      default: null
    per_page:
      type: int | None
      description: "Number of items to list per page (default: `20`, max: `100`)."
      default: null
    base_url:
      type: str
      description: GitLab API v4 base URL. Set this input to a workspace variable for a reusable self-managed host.
      default: https://gitlab.com/api/v4
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/projects/${{ FN.url_encode(inputs.project_id) }}/members/all
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        params:
          query: ${{ inputs.query }}
          user_ids: ${{ inputs.user_ids }}
          show_seat_info: ${{ inputs.show_seat_info }}
          state: ${{ inputs.state }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
  returns: ${{ steps.request.result }}
