type: action
definition:
  title: Get Merge Request Approval State
  description: >-
    Get Merge Request Approval State. Calls GET /projects/{project_id}/merge_requests/{merge_request_iid}/approval_state directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: get_merge_request_approval_state
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    merge_request_iid:
      type: int
      description: GitLab API path value for merge_request_iid.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    base_url:
      type: str | None
      description: GitLab API v4 base URL. Falls back to `VARS.gitlab.base_url`.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.gitlab.base_url }}/projects/${{ FN.url_encode_component(inputs.project_id) }}/merge_requests/${{ FN.url_encode_component(inputs.merge_request_iid) }}/approval_state
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
