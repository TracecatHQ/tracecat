type: action
definition:
  title: Create merge request note
  description: >-
    Create merge request note. Calls POST /projects/{project_id}/merge_requests/{merge_request_iid}/notes directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: create_merge_request_note
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    merge_request_iid:
      type: int
      description: GitLab API path value for merge_request_iid.
    payload:
      # Generic: this endpoint rejects an explicit null on optional body fields,
      # and a literal payload map cannot omit an unset optional.
      type: dict[str, Any] | None
      description: >-
        API-native request body. Documented fields: body (required), created_at, internal, merge_request_diff_head_sha.
      default: null
    base_url:
      type: str
      description: GitLab API v4 base URL. Set this input to a workspace variable for a reusable self-managed host.
      default: https://gitlab.com/api/v4
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/projects/${{ FN.url_encode(inputs.project_id) }}/merge_requests/${{ FN.url_encode(inputs.merge_request_iid) }}/notes
        method: POST
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
