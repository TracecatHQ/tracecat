type: action
definition:
  title: Get Repository File Raw
  description: >-
    Get Repository File Raw. Calls GET /projects/{project_id}/repository/files/{file_path}/raw directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: get_repository_file_raw
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_BASE_URL
        - GITLAB_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    file_path:
      type: str
      description: GitLab API path value for file_path.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ SECRETS.gitlab.GITLAB_API_BASE_URL }}/projects/${{ FN.url_encode_component(inputs.project_id) }}/repository/files/${{ FN.url_encode_component(inputs.file_path) }}/raw
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_TOKEN }}
          Accept: application/octet-stream
        params: ${{ inputs.params }}
        follow_redirects: true
        base64_encode_data: true
  returns: ${{ steps.request.result }}
