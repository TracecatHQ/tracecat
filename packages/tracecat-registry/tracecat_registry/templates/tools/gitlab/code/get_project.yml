type: action
definition:
  title: Get project
  description: >-
    Get project. Calls GET /projects/{project_id} directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: get_project
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    license:
      type: bool | None
      description: Include project license data.
      default: null
    statistics:
      type: bool | None
      description: Include project statistics. Available only to users with the Reporter, Developer, Maintainer, or Owner role.
      default: null
    with_custom_attributes:
      type: bool | None
      description: Include custom attributes in response. Administrator access.
      default: null
    base_url:
      type: str
      description: GitLab API v4 base URL. Set this input to a workspace variable for a reusable self-managed host.
      default: https://gitlab.com/api/v4
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/projects/${{ FN.url_encode(inputs.project_id) }}
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        params:
          license: ${{ inputs.license }}
          statistics: ${{ inputs.statistics }}
          with_custom_attributes: ${{ inputs.with_custom_attributes }}
  returns: ${{ steps.request.result }}
