type: action
definition:
  title: Get Current User
  description: >-
    Get Current User. Calls GET /user directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: get_current_user
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    base_url:
      type: str | None
      description: GitLab API v4 base URL. Falls back to `VARS.gitlab.base_url`.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.gitlab.base_url }}/user
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
