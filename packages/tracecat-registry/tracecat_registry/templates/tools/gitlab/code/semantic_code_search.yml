type: action
definition:
  title: Semantic Code Search
  description: >-
    Semantic Code Search. Calls GET /projects/{project_id}/search/semantic directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version. Requires GitLab Duo and a GitLab version that supports the REST semantic search endpoint.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: semantic_code_search
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_BASE_URL
        - GITLAB_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ SECRETS.gitlab.GITLAB_API_BASE_URL }}/projects/${{ FN.url_encode_component(inputs.project_id) }}/search/semantic
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_TOKEN }}
          Accept: application/json
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
