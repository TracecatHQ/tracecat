type: action
definition:
  title: Create project dependency list export and wait
  description: >-
    Creates a project dependency list export with POST /projects/{project_id}/dependency_list_exports, then polls GET /dependency_list_exports/{export_id} while GitLab returns 202. Uses an api-scoped GitLab project access token. Required project role, Ultimate tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version. Polling is bounded and returns GitLab's terminal response unchanged.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/dependency_list_export/
  namespace: tools.gitlab
  name: create_project_dependency_list_export_and_wait
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: Numeric project ID or namespaced project path.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    payload:
      type: dict[str, Any] | None
      description: API-native dependency list export request body.
      default: null
    poll_interval:
      type: float | None
      description: Seconds between polling attempts; exponential backoff when omitted.
      default: null
    base_url:
      type: str
      description: GitLab API v4 base URL. `VARS.gitlab.base_url` overrides this value.
      default: https://gitlab.com/api/v4
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ VARS.gitlab.base_url || inputs.base_url }}/projects/${{ FN.url_encode(inputs.project_id) }}/dependency_list_exports
        method: POST
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        params: ${{ inputs.params }}
        payload: ${{ inputs.payload }}
    - ref: poll
      action: core.http_poll
      args:
        url: ${{ VARS.gitlab.base_url || inputs.base_url }}/dependency_list_exports/${{ FN.url_encode(steps.request.result.data.id) }}
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        poll_condition: "lambda response: response.get('status_code') != 202"
        poll_interval: ${{ inputs.poll_interval }}
        poll_max_attempts: 10
  returns: ${{ steps.poll.result }}
