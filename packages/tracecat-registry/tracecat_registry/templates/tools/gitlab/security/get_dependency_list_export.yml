type: action
definition:
  title: Get dependency list export
  description: >-
    Get dependency list export. Calls GET /dependency_list_exports/{export_id} directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: get_dependency_list_export
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    export_id:
      type: int
      description: GitLab API path value for export_id.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    base_url:
      type: str
      description: GitLab API v4 base URL. `VARS.gitlab.base_url` overrides this value.
      default: https://gitlab.com/api/v4
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ VARS.gitlab.base_url || inputs.base_url }}/dependency_list_exports/${{ FN.url_encode(inputs.export_id) }}
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
