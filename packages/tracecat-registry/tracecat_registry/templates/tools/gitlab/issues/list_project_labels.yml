type: action
definition:
  title: List project labels
  description: >-
    List project labels. Calls GET /projects/{project_id}/labels directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: list_project_labels
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    with_counts:
      type: bool | None
      description: Whether or not to include issue and merge request counts. Defaults to `false`.
      default: null
    include_ancestor_groups:
      type: bool | None
      description: Include ancestor groups. Defaults to `true`.
      default: null
    search:
      type: str | None
      description: Keyword to filter labels by.
      default: null
    archived:
      type: bool | None
      description: If `true`, returns only archived labels. If unset, returns all labels.
      default: null
    page:
      type: int | None
      description: "Page number (default: `1`)."
      default: null
    per_page:
      type: int | None
      description: "Number of items to list per page (default: `20`, max: `100`)."
      default: null
    base_url:
      type: str
      description: GitLab API v4 base URL. Set this input to a workspace variable for a reusable self-managed host.
      default: https://gitlab.com/api/v4
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/projects/${{ FN.url_encode(inputs.project_id) }}/labels
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        params:
          with_counts: ${{ inputs.with_counts }}
          include_ancestor_groups: ${{ inputs.include_ancestor_groups }}
          search: ${{ inputs.search }}
          archived: ${{ inputs.archived }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
  returns: ${{ steps.request.result }}
