type: action
definition:
  title: List issue notes
  description: >-
    List issue notes. Calls GET /projects/{project_id}/issues/{issue_iid}/notes directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: list_issue_notes
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    issue_iid:
      type: int
      description: GitLab API path value for issue_iid.
    activity_filter:
      type: str | None
      description: "Filter notes by activity type. Valid values: `all_notes`, `only_comments`, `only_activity`. Default is `all_notes`."
      default: null
    sort:
      type: str | None
      description: Return issue notes sorted in `asc` or `desc` order. Default is `desc`.
      default: null
    order_by:
      type: str | None
      description: Return issue notes ordered by `created_at` or `updated_at` fields. Default is `created_at`.
      default: null
    page:
      type: int | None
      description: "Page number (default: `1`)."
      default: null
    per_page:
      type: int | None
      description: "Number of items to list per page (default: `20`, max: `100`)."
      default: null
    base_url:
      type: str
      description: GitLab API v4 base URL. Set this input to a workspace variable for a reusable self-managed host.
      default: https://gitlab.com/api/v4
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/projects/${{ FN.url_encode(inputs.project_id) }}/issues/${{ FN.url_encode(inputs.issue_iid) }}/notes
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
        params:
          activity_filter: ${{ inputs.activity_filter }}
          sort: ${{ inputs.sort }}
          order_by: ${{ inputs.order_by }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
  returns: ${{ steps.request.result }}
