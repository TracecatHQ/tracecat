type: action
definition:
  title: Get job trace
  description: >-
    Get job trace. Calls GET /projects/{project_id}/jobs/{job_id}/trace directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: get_job_trace
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    job_id:
      type: int
      description: GitLab API path value for job_id.
    byte_offset:
      type: int | None
      description: Byte offset to start reading from.
      default: null
    byte_limit:
      type: int | None
      description: Maximum number of bytes to return.
      default: null
    base_url:
      type: str
      description: GitLab API v4 base URL. Set this input to a workspace variable for a reusable self-managed host.
      default: https://gitlab.com/api/v4
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/projects/${{ FN.url_encode(inputs.project_id) }}/jobs/${{ FN.url_encode(inputs.job_id) }}/trace
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: text/plain
        params:
          byte_offset: ${{ inputs.byte_offset }}
          byte_limit: ${{ inputs.byte_limit }}
        follow_redirects: true
  returns: ${{ steps.request.result }}
