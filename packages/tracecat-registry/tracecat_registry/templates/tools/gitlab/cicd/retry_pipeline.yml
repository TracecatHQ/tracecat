type: action
definition:
  title: Retry pipeline
  description: >-
    Retry pipeline. Calls POST /projects/{project_id}/pipelines/{pipeline_id}/retry directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: retry_pipeline
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    pipeline_id:
      type: int
      description: GitLab API path value for pipeline_id.
    base_url:
      type: str
      description: GitLab API v4 base URL. Set this input to a workspace variable for a reusable self-managed host.
      default: https://gitlab.com/api/v4
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/projects/${{ FN.url_encode(inputs.project_id) }}/pipelines/${{ FN.url_encode(inputs.pipeline_id) }}/retry
        method: POST
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/json
  returns: ${{ steps.request.result }}
