type: action
definition:
  title: Download Job Artifacts
  description: >-
    Download Job Artifacts. Calls GET /projects/{project_id}/jobs/{job_id}/artifacts directly with an api-scoped GitLab project access token. Required project role, tier, and GitLab version are enforced by GitLab; GitLab Self-Managed availability depends on the installed version.
  display_group: GitLab
  doc_url: https://docs.gitlab.com/api/api_resources/
  namespace: tools.gitlab
  name: download_job_artifacts
  secrets:
    - name: gitlab
      keys:
        - GITLAB_API_TOKEN
  expects:
    project_id:
      type: str
      description: GitLab API path value for project_id.
    job_id:
      type: int
      description: GitLab API path value for job_id.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    base_url:
      type: str | None
      description: GitLab API v4 base URL. Falls back to `VARS.gitlab.base_url`.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.gitlab.base_url }}/projects/${{ FN.url_encode_component(inputs.project_id) }}/jobs/${{ FN.url_encode_component(inputs.job_id) }}/artifacts
        method: GET
        headers:
          PRIVATE-TOKEN: ${{ SECRETS.gitlab.GITLAB_API_TOKEN }}
          Accept: application/octet-stream
        params: ${{ inputs.params }}
        follow_redirects: true
        base64_encode_data: true
  returns: ${{ steps.request.result }}
