type: action
definition:
  title: List monitor alerts
  description: List alerts generated by OpenSearch Alerting monitors for SOAR ingestion and triage.
  display_group: OpenSearch
  doc_url: https://docs.opensearch.org/latest/observing-your-data/alerting/api/
  namespace: tools.opensearch
  name: list_monitor_alerts
  secrets:
    - name: opensearch
      keys: ["OPENSEARCH_USERNAME", "OPENSEARCH_PASSWORD"]
  expects:
    params:
      type: dict[str, Any] | None
      description: Optional native monitor alert filters and pagination parameters.
      default: null
    base_url:
      type: str | None
      description: OpenSearch base URL (e.g. https://localhost:9200).
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.opensearch.base_url }}/_plugins/_alerting/monitors/alerts
        method: GET
        params: ${{ inputs.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: Basic ${{ FN.to_base64(SECRETS.opensearch.OPENSEARCH_USERNAME + ":" + SECRETS.opensearch.OPENSEARCH_PASSWORD) }}
  returns: ${{ steps.request.result.data }}
