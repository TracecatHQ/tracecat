type: action
definition:
  title: Count events
  description: Count OpenSearch events matching an API-native query DSL request body.
  display_group: OpenSearch
  doc_url: https://docs.opensearch.org/latest/api-reference/search-apis/count/
  namespace: tools.opensearch
  name: count_events
  secrets:
    - name: opensearch
      keys: ["OPENSEARCH_USERNAME", "OPENSEARCH_PASSWORD"]
  expects:
    payload:
      type: dict[str, Any]
      description: API-native count request body.
    index:
      type: str | None
      description: Optional index name or pattern. If omitted, counts across all indexes.
      default: null
    params:
      type: dict[str, Any] | None
      description: Optional native count query parameters.
      default: null
    base_url:
      type: str | None
      description: OpenSearch base URL (e.g. https://localhost:9200).
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          index: ${{ inputs.index }}
        script: |
          from urllib.parse import quote

          def main(index):
              if index:
                  return f"/{quote(index, safe='*,-_')}/_count"
              return "/_count"
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.opensearch.base_url }}${{ steps.build_path.result }}
        method: POST
        params: ${{ inputs.params }}
        payload: ${{ inputs.payload }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: Basic ${{ FN.to_base64(SECRETS.opensearch.OPENSEARCH_USERNAME + ":" + SECRETS.opensearch.OPENSEARCH_PASSWORD) }}
          Content-Type: application/json
  returns: ${{ steps.request.result.data }}
