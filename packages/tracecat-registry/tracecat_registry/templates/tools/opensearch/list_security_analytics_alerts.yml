type: action
definition:
  title: List Security Analytics alerts
  description: List OpenSearch Security Analytics alerts for triage and workflow ingestion.
  display_group: OpenSearch
  doc_url: https://docs.opensearch.org/latest/security-analytics/api-tools/alert-finding-api/
  namespace: tools.opensearch
  name: list_security_analytics_alerts
  secrets:
    - name: opensearch
      keys: ["OPENSEARCH_USERNAME", "OPENSEARCH_PASSWORD"]
  expects:
    params:
      type: dict[str, Any] | None
      description: Native alert filters and pagination parameters, including detector_id or detectorType.
      default: null
    base_url:
      type: str | None
      description: OpenSearch base URL (e.g. https://localhost:9200).
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.opensearch.base_url }}/_plugins/_security_analytics/alerts
        method: GET
        params: ${{ inputs.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: Basic ${{ FN.to_base64(SECRETS.opensearch.OPENSEARCH_USERNAME + ":" + SECRETS.opensearch.OPENSEARCH_PASSWORD) }}
  returns: ${{ steps.request.result.data }}
