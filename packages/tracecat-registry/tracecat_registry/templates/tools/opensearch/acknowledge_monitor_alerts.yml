type: action
definition:
  title: Acknowledge monitor alerts
  description: Acknowledge one or more alerts generated by an OpenSearch Alerting monitor.
  display_group: OpenSearch
  doc_url: https://docs.opensearch.org/latest/observing-your-data/alerting/api/
  namespace: tools.opensearch
  name: acknowledge_monitor_alerts
  secrets:
    - name: opensearch
      keys: ["OPENSEARCH_USERNAME", "OPENSEARCH_PASSWORD"]
  expects:
    monitor_id:
      type: str
      description: Alerting monitor ID.
    alert_ids:
      type: list[str]
      description: Alert IDs to acknowledge.
    base_url:
      type: str | None
      description: OpenSearch base URL (e.g. https://localhost:9200).
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.opensearch.base_url }}/_plugins/_alerting/monitors/${{ FN.url_encode(inputs.monitor_id) }}/_acknowledge/alerts
        method: POST
        payload:
          alerts: ${{ inputs.alert_ids }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: Basic ${{ FN.to_base64(SECRETS.opensearch.OPENSEARCH_USERNAME + ":" + SECRETS.opensearch.OPENSEARCH_PASSWORD) }}
          Content-Type: application/json
  returns: ${{ steps.request.result.data }}
