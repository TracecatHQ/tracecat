type: action
definition:
  title: Get mapping
  description: Get field mappings for an OpenSearch index or index pattern.
  display_group: OpenSearch
  doc_url: https://docs.opensearch.org/latest/api-reference/index-apis/get-mapping/
  namespace: tools.opensearch
  name: get_mapping
  secrets:
    - name: opensearch
      keys: ["OPENSEARCH_USERNAME", "OPENSEARCH_PASSWORD"]
  expects:
    index:
      type: str
      description: Index name or pattern.
    params:
      type: dict[str, Any] | None
      description: Optional native get mapping query parameters.
      default: null
    base_url:
      type: str | None
      description: OpenSearch base URL (e.g. https://localhost:9200).
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          index: ${{ inputs.index }}
        script: |
          from urllib.parse import quote

          def main(index):
              return f"/{quote(index, safe='*,-_')}/_mapping"
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.opensearch.base_url }}${{ steps.build_path.result }}
        method: GET
        params: ${{ inputs.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: Basic ${{ FN.to_base64(SECRETS.opensearch.OPENSEARCH_USERNAME + ":" + SECRETS.opensearch.OPENSEARCH_PASSWORD) }}
  returns: ${{ steps.request.result.data }}
