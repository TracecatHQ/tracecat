type: action
definition:
  title: Run multiple searches
  description: Run multiple OpenSearch searches in one API-native NDJSON request.
  display_group: OpenSearch
  doc_url: https://docs.opensearch.org/latest/api-reference/search-apis/multi-search/
  namespace: tools.opensearch
  name: multi_search
  secrets:
    - name: opensearch
      keys: ["OPENSEARCH_USERNAME", "OPENSEARCH_PASSWORD"]
  expects:
    ndjson:
      type: str
      description: API-native multi-search NDJSON containing alternating metadata and query lines.
    index:
      type: str | None
      description: Optional default index name or pattern for searches in the request.
      default: null
    params:
      type: dict[str, Any] | None
      description: Optional native multi-search query parameters.
      default: null
    base_url:
      type: str | None
      description: OpenSearch base URL (e.g. https://localhost:9200).
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          index: ${{ inputs.index }}
        script: |
          from urllib.parse import quote

          def main(index):
              if index:
                  return f"/{quote(index, safe='*,-_')}/_msearch"
              return "/_msearch"
    - ref: normalize_ndjson
      action: core.script.run_python
      args:
        inputs:
          ndjson: ${{ inputs.ndjson }}
        script: |
          def main(ndjson):
              if ndjson.endswith("\n"):
                  return ndjson
              return ndjson + "\n"
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.opensearch.base_url }}${{ steps.build_path.result }}
        method: POST
        params: ${{ inputs.params }}
        content: ${{ steps.normalize_ndjson.result }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: Basic ${{ FN.to_base64(SECRETS.opensearch.OPENSEARCH_USERNAME + ":" + SECRETS.opensearch.OPENSEARCH_PASSWORD) }}
          Content-Type: application/x-ndjson
  returns: ${{ steps.request.result.data }}
