type: action
definition:
  title: Check domain health
  description: Check domain health. Calls GET /v1/health directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs/health
  namespace: tools.domscan
  name: check_domain_health
  secrets:
    - name: domscan
      keys: ["DOMSCAN_API_KEY"]
  expects:
    domain:
      type: str
      description: Domain or subdomain to analyze (e.g. example.com or blog.example.com).
    details:
      type: bool | None
      description: Include detailed breakdown. DomScan defaults to true.
      default: null
    base_url:
      type: str | None
      description: Base URL of the DomScan API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.domscan.base_url || "https://domscan.net" }}/v1/health
        method: GET
        headers:
          x-api-key: ${{ SECRETS.domscan.DOMSCAN_API_KEY }}
        params:
          domain: ${{ inputs.domain }}
          details: ${{ inputs.details }}
  returns: ${{ steps.request.result }}
