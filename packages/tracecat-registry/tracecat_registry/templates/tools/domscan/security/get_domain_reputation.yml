type: action
definition:
  title: Get domain reputation
  description: Get domain reputation. Calls GET /v1/reputation directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs/reputation
  namespace: tools.domscan
  name: get_domain_reputation
  secrets:
    - name: domscan
      keys: ["DOMSCAN_API_KEY"]
  expects:
    domain:
      type: str
      description: Domain to score for reputation.
    base_url:
      type: str | None
      description: Base URL of the DomScan API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.domscan.base_url || "https://domscan.net" }}/v1/reputation
        method: GET
        headers:
          x-api-key: ${{ SECRETS.domscan.DOMSCAN_API_KEY }}
        params:
          domain: ${{ inputs.domain }}
  returns: ${{ steps.request.result }}
