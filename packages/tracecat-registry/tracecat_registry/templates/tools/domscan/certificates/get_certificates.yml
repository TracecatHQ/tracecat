type: action
definition:
  title: Get certificates
  description: Get certificates. Calls GET /v1/certificates directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs/ssl-certificates
  namespace: tools.domscan
  name: get_certificates
  secrets:
    - name: domscan
      keys: ["DOMSCAN_API_KEY"]
  expects:
    domain:
      type: str
      description: Domain to search certificate transparency logs for.
    include_subdomains:
      type: bool | None
      description: Include certificates issued for subdomains of the requested domain. DomScan defaults to true.
      default: null
    include_expired:
      type: bool | None
      description: Include certificates that have already expired.
      default: null
    limit:
      type: int | None
      description: Maximum certificates to return on this page. DomScan defaults to 100.
      default: null
    cursor:
      type: str | None
      description: Offset cursor from pagination.next_cursor in the previous page.
      default: null
    base_url:
      type: str | None
      description: Base URL of the DomScan API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.domscan.base_url || "https://domscan.net" }}/v1/certificates
        method: GET
        headers:
          x-api-key: ${{ SECRETS.domscan.DOMSCAN_API_KEY }}
        params:
          domain: ${{ inputs.domain }}
          include_subdomains: ${{ inputs.include_subdomains }}
          include_expired: ${{ inputs.include_expired }}
          limit: ${{ inputs.limit }}
          cursor: ${{ inputs.cursor }}
  returns: ${{ steps.request.result }}
