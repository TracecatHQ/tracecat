type: action
definition:
  title: Check domain availability
  description: Check domain availability. Calls GET /v1/status directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs/check-availability
  namespace: tools.domscan
  name: check_domain_availability
  secrets:
    - name: domscan
      keys: ["DOMSCAN_API_KEY"]
  expects:
    name:
      type: str | None
      description: Domain name without TLD. Use together with tlds (e.g., "example" for example.com).
      default: null
    tlds:
      type: str | None
      description: Comma-separated list of TLDs to check (max 50). Use together with name.
      default: null
    domain:
      type: str | None
      description: Single-domain shortcut for one TLD, for example "mycompany.com".
      default: null
    prefer_cache:
      type: bool | None
      description: Return cached results if available (faster).
      default: null
    base_url:
      type: str | None
      description: Base URL of the DomScan API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.domscan.base_url || "https://domscan.net" }}/v1/status
        method: GET
        headers:
          x-api-key: ${{ SECRETS.domscan.DOMSCAN_API_KEY }}
        params:
          name: ${{ inputs.name }}
          tlds: ${{ inputs.tlds }}
          domain: ${{ inputs.domain }}
          prefer_cache: ${{ inputs.prefer_cache }}
  returns: ${{ steps.request.result }}
