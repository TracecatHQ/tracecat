type: action
definition:
  title: Get coverage
  description: Get coverage. Calls GET /v1/coverage directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs/coverage
  namespace: tools.domscan
  name: get_coverage
  expects:
    base_url:
      type: str | None
      description: Base URL of the DomScan API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.domscan.base_url || "https://domscan.net" }}/v1/coverage
        method: GET
  returns: ${{ steps.request.result }}
