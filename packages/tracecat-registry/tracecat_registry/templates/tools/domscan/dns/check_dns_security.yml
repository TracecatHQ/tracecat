type: action
definition:
  title: Check DNS security
  description: Check DNS security. Calls GET /v1/dns/security directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs/dns-security
  namespace: tools.domscan
  name: check_dns_security
  secrets:
    - name: domscan
      keys: ["DOMSCAN_API_KEY"]
  expects:
    domain:
      type: str
      description: Domain to analyze.
  steps:
    - ref: request
      action: core.http_request
      args:
        url: https://domscan.net/v1/dns/security
        method: GET
        headers:
          x-api-key: ${{ SECRETS.domscan.DOMSCAN_API_KEY }}
        params:
          domain: ${{ inputs.domain }}
  returns: ${{ steps.request.result }}
