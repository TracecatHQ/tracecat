type: action
definition:
  title: Get DNS records
  description: Get DNS records. Calls GET /v1/dns directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs/dns-lookup
  namespace: tools.domscan
  name: get_dns_records
  secrets:
    - name: domscan
      keys: ["DOMSCAN_API_KEY"]
  expects:
    domain:
      type: str
      description: Domain to query DNS records for.
    type:
      type: str | None
      description: DNS record type to query, one of A, AAAA, MX, NS, TXT, SOA, CNAME, CAA, PTR, or SRV. DomScan defaults to A.
      default: null
    base_url:
      type: str | None
      description: Base URL of the DomScan API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.domscan.base_url || "https://domscan.net" }}/v1/dns
        method: GET
        headers:
          x-api-key: ${{ SECRETS.domscan.DOMSCAN_API_KEY }}
        params:
          domain: ${{ inputs.domain }}
          type: ${{ inputs.type }}
  returns: ${{ steps.request.result }}
