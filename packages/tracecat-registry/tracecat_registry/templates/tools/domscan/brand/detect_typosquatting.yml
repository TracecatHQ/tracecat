type: action
definition:
  title: Detect typosquatting
  description: Detect typosquatting. Calls GET /v1/typos directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs/typosquatting
  namespace: tools.domscan
  name: detect_typosquatting
  secrets:
    - name: domscan
      keys: ["DOMSCAN_API_KEY"]
  expects:
    domain:
      type: str
      description: Domain to analyze for typosquatting risks.
    check_registered:
      type: bool | None
      description: Check if generated typos are actually registered. Disabled by default and capped for faster responses.
      default: null
    limit:
      type: int | None
      description: Maximum permutations to generate and check. DomScan defaults to 100.
      default: null
    include_tld_swap:
      type: bool | None
      description: Include TLD variation permutations (e.g., .co instead of .com). DomScan defaults to true.
      default: null
    base_url:
      type: str | None
      description: Base URL of the DomScan API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.domscan.base_url || "https://domscan.net" }}/v1/typos
        method: GET
        headers:
          x-api-key: ${{ SECRETS.domscan.DOMSCAN_API_KEY }}
        params:
          domain: ${{ inputs.domain }}
          check_registered: ${{ inputs.check_registered }}
          limit: ${{ inputs.limit }}
          include_tld_swap: ${{ inputs.include_tld_swap }}
  returns: ${{ steps.request.result }}
