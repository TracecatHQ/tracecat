type: action
definition:
  title: Check social handles
  description: Check social handles. Calls GET /v1/social directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs/social
  namespace: tools.domscan
  name: check_social_handles
  secrets:
    - name: domscan
      keys: ["DOMSCAN_API_KEY"]
  expects:
    handle:
      type: str
      description: Social handle to check, without a leading @.
    platforms:
      type: str | None
      description: Comma-separated platforms to check. Defaults to all known social platforms. Aliases listed by GET /v1/social/info are accepted.
      default: null
    resources:
      type: str | None
      description: Optional comma-separated resource types. If platforms is omitted, the request checks only these resources. Aliases listed by GET /v1/social/info are accepted.
      default: null
    base_url:
      type: str | None
      description: Base URL of the DomScan API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.domscan.base_url || "https://domscan.net" }}/v1/social
        method: GET
        headers:
          x-api-key: ${{ SECRETS.domscan.DOMSCAN_API_KEY }}
        params:
          handle: ${{ inputs.handle }}
          platforms: ${{ inputs.platforms }}
          resources: ${{ inputs.resources }}
  returns: ${{ steps.request.result }}
