type: action
definition:
  title: Get domain overview
  description: Get a domain overview. Calls GET /v1/overview directly.
  display_group: DomScan
  doc_url: https://domscan.net/docs
  namespace: tools.domscan
  name: get_domain_overview
  secrets:
    - name: domscan
      keys: ["DOMSCAN_API_KEY"]
  expects:
    domain:
      type: str
      description: Domain to analyze.
  steps:
    - ref: request
      action: core.http_request
      args:
        url: https://domscan.net/v1/overview
        method: GET
        headers:
          x-api-key: ${{ SECRETS.domscan.DOMSCAN_API_KEY }}
        params:
          domain: ${{ inputs.domain }}
  returns: ${{ steps.request.result }}
