type: action
definition:
  title: Get lookup content
  description: "Get rows from the specified Lookup file as JSON. Calls GET /system/lookups/{id}/content."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-stream/#operations-Lookups-getLookupFileContentById
  namespace: tools.cribl
  name: get_lookup_content
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    group:
      type: str
      description: "The id of the Worker Group or Edge Fleet whose configuration to use."
      default: default
    id:
      type: str
      description: "The id of the Lookup whose file content to get."
    limit:
      type: int | None
      description: "Maximum number of Lookup rows to return in the response for this request. Use with offset to paginate the response into manageable batches."
      default: null
    offset:
      type: int | None
      description: "Starting point from which to retrieve results for this request. Use with limit to paginate the response into manageable batches."
      default: null
    q:
      type: str | None
      description: "Case-insensitive wildcard filter applied to each Lookup row. Matching uses the stringified row values."
      default: null
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/m/${{ FN.url_encode(inputs.group) }}/system/lookups/${{ FN.url_encode(inputs.id) }}/content
        method: GET
        params:
          limit: ${{ inputs.limit }}
          offset: ${{ inputs.offset }}
          q: ${{ inputs.q }}
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
