type: action
definition:
  title: List lookups
  description: "Get a list of all Lookups. Calls GET /system/lookups."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-stream/#operations-Lookups-getLookupFile
  namespace: tools.cribl
  name: list_lookups
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    group:
      type: str
      description: "The id of the Worker Group or Edge Fleet whose configuration to use."
      default: default
    ext:
      type: str | None
      description: "Limit the response to Lookups whose underlying Lookup files have the specified file extension."
      default: null
    offset:
      type: int | None
      description: "Pagination offset."
      default: null
    limit:
      type: int | None
      description: "Maximum number of items to return."
      default: null
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/m/${{ FN.url_encode(inputs.group) }}/system/lookups
        method: GET
        params:
          ext: ${{ inputs.ext }}
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
