type: action
definition:
  title: Get version control status
  description: "Get the status of the current working tree of the Git repository used for Cribl configuration, including modified, staged, untracked, and conflicted files. Calls GET /version/status."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-stream/#operations-Version_Control-getVersionStatus
  namespace: tools.cribl
  name: get_version_status
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/version/status
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
