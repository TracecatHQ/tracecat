type: action
definition:
  title: Get health
  description: "Get the current health status of the server (Leader or Worker Node). Calls GET /health."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-core/#operations-Health-getHealth
  namespace: tools.cribl
  name: get_health
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/health
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
