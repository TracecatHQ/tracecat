type: action
definition:
  title: List search jobs
  description: "Get a list of all search jobs (Cribl.Cloud only). Supports filtering, sorting, and pagination. Calls GET /search/jobs."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-search/#operations-Jobs-getSearchJob
  namespace: tools.cribl
  name: list_search_jobs
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    output:
      type: str | None
      description: "Output format. Use short to return abbreviated job information."
      default: null
    id:
      type: list[str] | None
      description: "Filter by job IDs. Can specify multiple IDs."
      default: null
    earliest:
      type: str | None
      description: "Filter jobs by earliest time."
      default: null
    latest:
      type: str | None
      description: "Filter jobs by latest time."
      default: null
    type:
      type: str | None
      description: "Filter by job type."
      default: null
    sortExp:
      type: str | None
      description: "Sorting expression to evaluate against jobs to specify the sort order."
      default: null
    sortDir:
      type: str | None
      description: "Sort direction. Use asc or desc. Defaults to asc."
      default: null
    limit:
      type: int | None
      description: "Maximum number of jobs to return. Use with offset to paginate results."
      default: null
    offset:
      type: int | None
      description: "Starting point from which to retrieve results. Use with limit to paginate results."
      default: null
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/m/default_search/search/jobs
        method: GET
        params:
          output: ${{ inputs.output }}
          id: ${{ inputs.id }}
          earliest: ${{ inputs.earliest }}
          latest: ${{ inputs.latest }}
          type: ${{ inputs.type }}
          sortExp: ${{ inputs.sortExp }}
          sortDir: ${{ inputs.sortDir }}
          limit: ${{ inputs.limit }}
          offset: ${{ inputs.offset }}
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
