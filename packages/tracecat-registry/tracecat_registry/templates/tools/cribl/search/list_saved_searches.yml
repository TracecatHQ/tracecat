type: action
definition:
  title: List saved searches
  description: "Get a list of all Saved Searches (Cribl.Cloud only). Calls GET /search/saved."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-search/#operations-Saved_Searches-getSavedQuery
  namespace: tools.cribl
  name: list_saved_searches
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    datasetIds:
      type: list[str] | None
      description: "Return only Saved Searches associated with any of the listed Dataset IDs (maximum 10)."
      default: null
    offset:
      type: int | None
      description: "Starting point from which to retrieve results for this request. Use with limit to paginate the response into manageable batches."
      default: null
    limit:
      type: int | None
      description: "Maximum number of Saved Searches to return in the response for this request. Use with offset to paginate the response into manageable batches."
      default: null
    output:
      type: str | None
      description: "Pass short to receive a compact response containing only list-view fields."
      default: null
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/m/default_search/search/saved
        method: GET
        params:
          datasetIds: ${{ inputs.datasetIds }}
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
          output: ${{ inputs.output }}
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
