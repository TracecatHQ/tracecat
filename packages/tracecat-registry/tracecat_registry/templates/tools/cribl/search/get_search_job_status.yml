type: action
definition:
  title: Get search job status
  description: "Get execution status details for the specified search job (Cribl.Cloud only). Calls GET /search/jobs/{id}/status."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-search/#operations-Jobs-getSearchJobStatusById
  namespace: tools.cribl
  name: get_search_job_status
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    id:
      type: str
      description: "The id of the search job to get status for."
    advanced:
      type: bool | None
      description: "If true, include stage-level details, ingestion metrics, and object filter statistics in the response."
      default: null
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/m/default_search/search/jobs/${{ FN.url_encode(inputs.id) }}/status
        method: GET
        params:
          advanced: ${{ inputs.advanced }}
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
