type: action
definition:
  title: Cancel search job
  description: "Cancel the specified search job (Cribl.Cloud only). Calls POST /search/jobs/{id}/cancel."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-search/#operations-Jobs-createSearchJobCancelById
  namespace: tools.cribl
  name: cancel_search_job
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    id:
      type: str
      description: "The id of the search job to cancel."
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/m/default_search/search/jobs/${{ FN.url_encode(inputs.id) }}/cancel
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
