type: action
definition:
  title: Update source
  description: "Update the specified Source. Provide a complete representation of the Source that you want to update in the request body. This endpoint does not support partial updates. Cribl removes any omitted fields when updating the Source. Calls PATCH /system/inputs/{id}."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-stream/#operations-Sources-updateInputById
  namespace: tools.cribl
  name: update_source
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    group:
      type: str
      description: "The id of the Worker Group or Edge Fleet whose configuration to use."
      default: default
    id:
      type: str
      description: "The id of the Source to update."
    payload:
      # Generic: the Cribl Input body is a discriminated union keyed by type, so there is no single field set to name.
      type: dict[str, Any]
      description: "Complete Input object. Documented fields include id (required), type (required, the Source type such as syslog, splunk_hec, or http), and the type-specific settings of the Input schema for that Source type."
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/m/${{ FN.url_encode(inputs.group) }}/system/inputs/${{ FN.url_encode(inputs.id) }}
        method: PATCH
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
