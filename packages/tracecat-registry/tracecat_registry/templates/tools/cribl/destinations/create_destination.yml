type: action
definition:
  title: Create destination
  description: "Create a new Destination. Calls POST /system/outputs."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-stream/#operations-Destinations-createOutput
  namespace: tools.cribl
  name: create_destination
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    group:
      type: str
      description: "The id of the Worker Group or Edge Fleet whose configuration to use."
      default: default
    payload:
      # Generic: the Cribl Output body is a discriminated union keyed by type, so there is no single field set to name.
      type: dict[str, Any]
      description: "Output object. Documented fields include id (required), type (required, the Destination type such as splunk, s3, or webhook), and the type-specific settings of the Output schema for that Destination type."
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/m/${{ FN.url_encode(inputs.group) }}/system/outputs
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
