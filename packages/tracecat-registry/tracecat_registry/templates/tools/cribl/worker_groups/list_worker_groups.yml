type: action
definition:
  title: List worker groups
  description: "Get a list of all Worker Groups, Outpost Groups, or Edge Fleets for the specified Cribl product. Calls GET /products/{product}/groups."
  display_group: Cribl
  doc_url: https://docs.cribl.io/cribl-as-code/api-reference/control-plane/cribl-stream/#operations-Worker_Groups_and_Outpost_Groups-getProductsGroupsByProduct
  namespace: tools.cribl
  name: list_worker_groups
  secrets:
    - type: oauth
      provider_id: cribl
      grant_type: client_credentials
  expects:
    product:
      type: str
      description: "Name of the Cribl product. Valid values: stream, edge, outpost."
    fields:
      type: str | None
      description: "Comma-separated list of additional properties to include in the response. Available values are git.commit, git.localChanges, and git.log."
      default: null
    limit:
      type: int | None
      description: "Maximum number of Worker Groups, Outpost Groups, or Edge Fleets to return in the response for this request. Use with offset to paginate the response into manageable batches."
      default: null
    offset:
      type: int | None
      description: "Starting point from which to retrieve results for this request. Use with limit to paginate the response into manageable batches."
      default: null
    base_url:
      type: str | None
      description: "Cribl deployment URL, without /api/v1. For example, https://<workspace>-<organization>.cribl.cloud, or the cribl-gov.cloud equivalent for Cribl.Cloud Government."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.cribl.base_url }}/api/v1/products/${{ FN.url_encode(inputs.product) }}/groups
        method: GET
        params:
          fields: ${{ inputs.fields }}
          limit: ${{ inputs.limit }}
          offset: ${{ inputs.offset }}
        headers:
          Authorization: Bearer ${{ SECRETS.cribl_oauth.CRIBL_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
