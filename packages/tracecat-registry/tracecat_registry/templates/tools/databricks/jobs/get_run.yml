type: action
definition:
  title: Get job run
  description: Retrieve metadata for a job run.
  display_group: Databricks
  doc_url: https://databricks-sdk-py.readthedocs.io/en/latest/workspace/jobs/jobs.html#databricks.sdk.service.jobs.JobsExt.get_run
  namespace: tools.databricks
  name: get_run
  expects:
    run_id:
      type: int
      description: Canonical identifier of the run.
    include_history:
      type: bool | None
      description: Whether to include the repair history in the response.
      default: null
    include_resolved_values:
      type: bool | None
      description: Whether to include resolved parameter values.
      default: null
    page_token:
      type: str | None
      description: Token for a subsequent page of run arrays.
      default: null
  steps:
    - ref: get_run
      action: tools.databricks_sdk.call_method
      args:
        service: jobs
        method_name: get_run
        params:
          run_id: ${{ inputs.run_id }}
          include_history: ${{ inputs.include_history }}
          include_resolved_values: ${{ inputs.include_resolved_values }}
          page_token: ${{ inputs.page_token }}
  returns: ${{ steps.get_run.result }}
