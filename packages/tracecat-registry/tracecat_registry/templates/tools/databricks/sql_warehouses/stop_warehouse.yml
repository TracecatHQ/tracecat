type: action
definition:
  title: Stop SQL warehouse
  description: Stop a SQL warehouse.
  display_group: Databricks
  doc_url: https://databricks-sdk-py.readthedocs.io/en/latest/workspace/sql/warehouses.html#databricks.sdk.service.sql.WarehousesAPI.stop
  namespace: tools.databricks
  name: stop_warehouse
  expects:
    base_url:
      type: str | None
      description: Databricks workspace URL.
      default: null
    id:
      type: str
      description: Identifier of the SQL warehouse to stop.
  steps:
    - ref: stop_warehouse
      action: tools.databricks_sdk.call_method
      args:
        base_url: ${{ inputs.base_url || VARS.databricks.base_url }}
        service: warehouses
        method_name: stop
        params:
          id: ${{ inputs.id }}
  returns: ${{ steps.stop_warehouse.result }}
