type: action
definition:
  title: Start cluster
  description: Start a terminated all-purpose cluster.
  display_group: Databricks
  doc_url: https://databricks-sdk-py.readthedocs.io/en/latest/workspace/compute/clusters.html#databricks.sdk.service.compute.ClustersExt.start
  namespace: tools.databricks
  name: start_cluster
  expects:
    cluster_id:
      type: str
      description: Cluster to start.
  steps:
    - ref: start_cluster
      action: tools.databricks_sdk.call_method
      args:
        service: clusters
        method_name: start
        params:
          cluster_id: ${{ inputs.cluster_id }}
  returns: ${{ steps.start_cluster.result }}
