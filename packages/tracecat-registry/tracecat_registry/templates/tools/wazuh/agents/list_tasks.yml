type: action
definition:
  name: list_tasks
  namespace: tools.wazuh
  title: List tasks
  description: "List Wazuh tasks (e.g. agent upgrades) and their status."
  display_group: Wazuh
  doc_url: https://documentation.wazuh.com/current/user-manual/api/reference.html#operation/api.controllers.task_controller.get_tasks_status
  secrets:
    - name: wazuh_wui
      keys: ["WAZUH_WUI_USERNAME", "WAZUH_WUI_PASSWORD"]
  expects:
    agents_list:
      type: list[str] | None
      description: "Filter by agent IDs."
      default: null
    tasks_list:
      type: list[str] | None
      description: "Filter by task IDs."
      default: null
    command:
      type: str | None
      description: "Filter by command (e.g. `upgrade`)."
      default: null
    module:
      type: str | None
      description: "Filter by module (e.g. `upgrade_module`)."
      default: null
    status:
      type: str | None
      description: "Filter by status (e.g. `In progress`, `Done`, `Failed`)."
      default: null
    q:
      type: str | None
      description: "Wazuh query to filter results by (e.g. `status=active;os.platform=ubuntu`)."
      default: null
    search:
      type: str | None
      description: "Look for elements containing the specified string. Prefix with `-` for a complementary search."
      default: null
    select:
      type: list[str] | None
      description: "Fields to return. Use `.` for nested fields (e.g. `os.name`)."
      default: null
    sort:
      type: str | None
      description: "Fields to sort by, comma separated. Prefix with `+` or `-` for ascending or descending order."
      default: null
    limit:
      type: int
      description: "Maximum number of elements to return (up to 100000; Wazuh recommends 500 or fewer)."
      default: 500
    offset:
      type: int
      description: "First element to return in the collection."
      default: 0
    base_url:
      type: str | None
      description: "Wazuh server API URL (e.g. https://wazuh-manager:55000). Defaults to the `wazuh.base_url` variable."
      default: null
    verify_ssl:
      type: bool
      description: "If false, disables SSL verification for internal networks."
      default: true
  steps:
    - ref: get_access_token
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.wazuh.base_url }}/security/user/authenticate
        method: POST
        headers:
          Authorization: Basic ${{ FN.to_base64(SECRETS.wazuh_wui.WAZUH_WUI_USERNAME + ":" + SECRETS.wazuh_wui.WAZUH_WUI_PASSWORD) }}
        verify_ssl: ${{ inputs.verify_ssl }}
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.wazuh.base_url }}/tasks/status
        method: GET
        headers:
          Authorization: Bearer ${{ steps.get_access_token.result.data.data.token }}
        params:
          agents_list: ${{ FN.join(inputs.agents_list, ",") if inputs.agents_list else None }}
          tasks_list: ${{ FN.join(inputs.tasks_list, ",") if inputs.tasks_list else None }}
          command: ${{ inputs.command }}
          module: ${{ inputs.module }}
          status: ${{ inputs.status }}
          q: ${{ inputs.q }}
          search: ${{ inputs.search }}
          select: ${{ FN.join(inputs.select, ",") if inputs.select else None }}
          sort: ${{ inputs.sort }}
          limit: ${{ inputs.limit }}
          offset: ${{ inputs.offset }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.request.result.data }}
