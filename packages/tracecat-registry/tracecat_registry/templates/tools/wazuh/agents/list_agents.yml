type: action
definition:
  name: list_agents
  namespace: tools.wazuh
  title: List agents
  description: "List Wazuh agents and filter them by ID, status, name, IP, group, OS, or version."
  display_group: Wazuh
  doc_url: https://documentation.wazuh.com/current/user-manual/api/reference.html#operation/api.controllers.agent_controller.get_agents
  secrets:
    - name: wazuh_wui
      keys: ["WAZUH_WUI_USERNAME", "WAZUH_WUI_PASSWORD"]
  expects:
    agents_list:
      type: list[str] | None
      description: "Agent IDs to return. All agents are returned if not specified."
      default: null
    status:
      type: list[str] | None
      description: "Filter by agent status: `active`, `pending`, `never_connected`, `disconnected`."
      default: null
    name:
      type: str | None
      description: "Filter by agent name."
      default: null
    ip:
      type: str | None
      description: "Filter by the IP the agent uses to communicate with the manager."
      default: null
    group:
      type: str | None
      description: "Filter by agent group."
      default: null
    os_platform:
      type: str | None
      description: "Filter by OS platform (e.g. `ubuntu`, `windows`, `darwin`)."
      default: null
    version:
      type: str | None
      description: "Filter by agent version (e.g. `4.13.1`)."
      default: null
    older_than:
      type: str | None
      description: "Filter out agents whose last keep alive is more recent than this (e.g. `1h`, `7d`)."
      default: null
    q:
      type: str | None
      description: "Wazuh query to filter results by (e.g. `status=active;os.platform=ubuntu`)."
      default: null
    search:
      type: str | None
      description: "Look for elements containing the specified string. Prefix with `-` for a complementary search."
      default: null
    select:
      type: list[str] | None
      description: "Fields to return. Use `.` for nested fields (e.g. `os.name`)."
      default: null
    sort:
      type: str | None
      description: "Fields to sort by, comma separated. Prefix with `+` or `-` for ascending or descending order."
      default: null
    limit:
      type: int
      description: "Maximum number of elements to return (up to 100000; Wazuh recommends 500 or fewer)."
      default: 500
    offset:
      type: int
      description: "First element to return in the collection."
      default: 0
    base_url:
      type: str | None
      description: "Wazuh server API URL (e.g. https://wazuh-manager:55000). Defaults to the `wazuh.base_url` variable."
      default: null
    verify_ssl:
      type: bool
      description: "If false, disables SSL verification for internal networks."
      default: true
  steps:
    - ref: get_access_token
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.wazuh.base_url }}/security/user/authenticate
        method: POST
        headers:
          Authorization: Basic ${{ FN.to_base64(SECRETS.wazuh_wui.WAZUH_WUI_USERNAME + ":" + SECRETS.wazuh_wui.WAZUH_WUI_PASSWORD) }}
        verify_ssl: ${{ inputs.verify_ssl }}
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.wazuh.base_url }}/agents
        method: GET
        headers:
          Authorization: Bearer ${{ steps.get_access_token.result.data.data.token }}
        params:
          agents_list: ${{ FN.join(inputs.agents_list, ",") if inputs.agents_list else None }}
          status: ${{ FN.join(inputs.status, ",") if inputs.status else None }}
          name: ${{ inputs.name }}
          ip: ${{ inputs.ip }}
          group: ${{ inputs.group }}
          "os.platform": ${{ inputs.os_platform }}
          version: ${{ inputs.version }}
          older_than: ${{ inputs.older_than }}
          q: ${{ inputs.q }}
          search: ${{ inputs.search }}
          select: ${{ FN.join(inputs.select, ",") if inputs.select else None }}
          sort: ${{ inputs.sort }}
          limit: ${{ inputs.limit }}
          offset: ${{ inputs.offset }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.request.result.data }}
