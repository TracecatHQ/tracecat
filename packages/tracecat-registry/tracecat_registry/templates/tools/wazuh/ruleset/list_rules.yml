type: action
definition:
  name: list_rules
  namespace: tools.wazuh
  title: List rules
  description: "List detection rules filtered by ID, level, group, MITRE technique, compliance requirement, or file."
  display_group: Wazuh
  doc_url: https://documentation.wazuh.com/current/user-manual/api/reference.html#operation/api.controllers.rule_controller.get_rules
  secrets:
    - name: wazuh_wui
      keys: ["WAZUH_WUI_USERNAME", "WAZUH_WUI_PASSWORD"]
  expects:
    rule_ids:
      type: list[str] | None
      description: "Rule IDs to return."
      default: null
    level:
      type: str | None
      description: "Filter by rule level, either a single level (`10`) or a range (`10-15`)."
      default: null
    group:
      type: str | None
      description: "Filter by rule group (e.g. `authentication_failed`)."
      default: null
    mitre:
      type: str | None
      description: "Filter by MITRE ATT&CK technique ID (e.g. `T1110`)."
      default: null
    pci_dss:
      type: str | None
      description: "Filter by PCI DSS requirement."
      default: null
    filename:
      type: list[str] | None
      description: "Filter by rule file name."
      default: null
    status:
      type: enum['enabled', 'disabled', 'all'] | None
      description: "Filter by rule status."
      default: null
    q:
      type: str | None
      description: "Wazuh query to filter results by (e.g. `status=active;os.platform=ubuntu`)."
      default: null
    search:
      type: str | None
      description: "Look for elements containing the specified string. Prefix with `-` for a complementary search."
      default: null
    select:
      type: list[str] | None
      description: "Fields to return. Use `.` for nested fields (e.g. `os.name`)."
      default: null
    sort:
      type: str | None
      description: "Fields to sort by, comma separated. Prefix with `+` or `-` for ascending or descending order."
      default: null
    limit:
      type: int
      description: "Maximum number of elements to return (up to 100000; Wazuh recommends 500 or fewer)."
      default: 500
    offset:
      type: int
      description: "First element to return in the collection."
      default: 0
    base_url:
      type: str | None
      description: "Wazuh server API URL (e.g. https://wazuh-manager:55000). Defaults to the `wazuh.base_url` variable."
      default: null
    verify_ssl:
      type: bool
      description: "If false, disables SSL verification for internal networks."
      default: true
  steps:
    - ref: get_access_token
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.wazuh.base_url }}/security/user/authenticate
        method: POST
        headers:
          Authorization: Basic ${{ FN.to_base64(SECRETS.wazuh_wui.WAZUH_WUI_USERNAME + ":" + SECRETS.wazuh_wui.WAZUH_WUI_PASSWORD) }}
        verify_ssl: ${{ inputs.verify_ssl }}
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.wazuh.base_url }}/rules
        method: GET
        headers:
          Authorization: Bearer ${{ steps.get_access_token.result.data.data.token }}
        params:
          rule_ids: ${{ FN.join(inputs.rule_ids, ",") if inputs.rule_ids else None }}
          level: ${{ inputs.level }}
          group: ${{ inputs.group }}
          mitre: ${{ inputs.mitre }}
          pci_dss: ${{ inputs.pci_dss }}
          filename: ${{ FN.join(inputs.filename, ",") if inputs.filename else None }}
          status: ${{ inputs.status }}
          q: ${{ inputs.q }}
          search: ${{ inputs.search }}
          select: ${{ FN.join(inputs.select, ",") if inputs.select else None }}
          sort: ${{ inputs.sort }}
          limit: ${{ inputs.limit }}
          offset: ${{ inputs.offset }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.request.result.data }}
