type: action
definition:
  title: List mobile devices
  description: List Jamf Pro mobile devices in the standard paged response envelope.
  display_group: Jamf Pro
  doc_url: https://developer.jamf.com/jamf-pro/reference/get_v2-mobile-devices
  namespace: tools.jamf
  name: list_mobile_devices
  secrets:
    - type: oauth
      provider_id: jamf
      grant_type: client_credentials
      optional: true
    - name: jamf
      keys: ["JAMF_API_TOKEN"]
      optional: true
  expects:
    base_url:
      type: str | None
      description: Jamf Pro base URL (e.g. https://acme.jamfcloud.com).
      default: null
    page:
      type: int | None
      description: Zero-indexed page number.
      default: null
    page_size:
      type: int | None
      description: Number of results per page.
      default: null
    sort:
      type: list[str] | None
      description: Sort expressions in property:asc or property:desc format. Defaults to id:asc.
      default: null
    filter:
      type: str | None
      description: RSQL filter expression. See https://developer.jamf.com/jamf-pro/docs/filtering-with-rsql.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            page: ${{ inputs.page }}
            page-size: ${{ inputs.page_size }}
            sort: ${{ inputs.sort }}
            filter: ${{ inputs.filter }}
        script: |
          def main(params):
              return {k: v for k, v in params.items() if v is not None}
    - ref: list_mobile_devices
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jamf.base_url }}/api/v2/mobile-devices
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.jamf_oauth.JAMF_SERVICE_TOKEN || SECRETS.jamf.JAMF_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_mobile_devices.result }}
