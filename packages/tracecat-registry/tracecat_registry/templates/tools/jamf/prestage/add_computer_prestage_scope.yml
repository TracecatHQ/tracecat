type: action
definition:
  title: Add serial numbers to computer PreStage scope
  description: Add serial numbers to a computer PreStage scope; a 409 is an optimistic-locking conflict, so refetch the scope for the current versionLock and retry.
  display_group: Jamf Pro
  doc_url: https://developer.jamf.com/jamf-pro/reference/post_v2-computer-prestages-id-scope
  namespace: tools.jamf
  name: add_computer_prestage_scope
  secrets:
    - type: oauth
      provider_id: jamf
      grant_type: client_credentials
      optional: true
    - name: jamf
      keys: ["JAMF_API_TOKEN"]
      optional: true
  expects:
    base_url:
      type: str | None
      description: Jamf Pro base URL (e.g. https://acme.jamfcloud.com).
      default: null
    prestage_id:
      type: str
      description: Computer PreStage enrollment ID.
    serial_numbers:
      type: list[str]
      description: Serial numbers to add to the PreStage scope.
    version_lock:
      type: int
      description: Current optimistic-lock version from the PreStage scope.
  steps:
    - ref: add_computer_prestage_scope
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jamf.base_url }}/api/v2/computer-prestages/${{ FN.url_encode(inputs.prestage_id) }}/scope
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.jamf_oauth.JAMF_SERVICE_TOKEN || SECRETS.jamf.JAMF_API_TOKEN }}
          Content-Type: application/json
        payload:
          serialNumbers: ${{ inputs.serial_numbers }}
          versionLock: ${{ inputs.version_lock }}
  returns: ${{ steps.add_computer_prestage_scope.result }}
