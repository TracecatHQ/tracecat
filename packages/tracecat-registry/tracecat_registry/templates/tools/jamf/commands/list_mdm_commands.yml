type: action
definition:
  title: List MDM commands
  description: List Jamf Pro MDM commands matching a required RSQL filter.
  display_group: Jamf Pro
  doc_url: https://developer.jamf.com/jamf-pro/reference/get_v2-mdm-commands
  namespace: tools.jamf
  name: list_mdm_commands
  secrets:
    - type: oauth
      provider_id: jamf
      grant_type: client_credentials
      optional: true
    - name: jamf
      keys: ["JAMF_API_TOKEN"]
      optional: true
  expects:
    base_url:
      type: str | None
      description: Jamf Pro base URL (e.g. https://acme.jamfcloud.com).
      default: null
    filter:
      type: str
      description: >-
        Required RSQL filter. Filterable fields: uuid, clientManagementId,
        command, status, clientType, dateSent, validAfter, dateCompleted,
        profileId, profileIdentifier, active. See
        https://developer.jamf.com/jamf-pro/docs/filtering-with-rsql.
    page:
      type: int | None
      description: Zero-indexed page number.
      default: null
    page_size:
      type: int | None
      description: Number of results per page.
      default: null
    sort:
      type: list[str] | None
      description: Sort expressions in property:asc or property:desc format. Defaults to dateSent:asc.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            filter: ${{ inputs.filter }}
            page: ${{ inputs.page }}
            page-size: ${{ inputs.page_size }}
            sort: ${{ inputs.sort }}
        script: |
          def main(params):
              query = {}
              for key, value in params.items():
                  if value is None:
                      continue
                  if key == "sort" and isinstance(value, list):
                      value = ",".join(str(item) for item in value)
                  query[key] = value
              return query
    - ref: list_mdm_commands
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jamf.base_url }}/api/v2/mdm/commands
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.jamf_oauth.JAMF_SERVICE_TOKEN || SECRETS.jamf.JAMF_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_mdm_commands.result }}
