type: action
definition:
  title: List computer inventory
  description: Search Jamf Pro computer inventory. Use section to choose which detail sections are returned.
  display_group: Jamf Pro
  doc_url: https://developer.jamf.com/jamf-pro/reference/get_v4-computers-inventory
  namespace: tools.jamf
  name: list_computer_inventory
  secrets:
    - type: oauth
      provider_id: jamf
      grant_type: client_credentials
      optional: true
    - name: jamf
      keys: ["JAMF_API_TOKEN"]
      optional: true
  expects:
    base_url:
      type: str | None
      description: Jamf Pro base URL (e.g. https://acme.jamfcloud.com).
      default: null
    section:
      type: list[str] | None
      description: >-
        Inventory sections to return. Defaults to GENERAL when omitted. Accepted
        values: GENERAL, DISK_ENCRYPTION, PURCHASING, APPLICATIONS, STORAGE,
        USER_AND_LOCATION, CONFIGURATION_PROFILES, PRINTERS, SERVICES, HARDWARE,
        LOCAL_USER_ACCOUNTS, CERTIFICATES, ATTACHMENTS, PACKAGE_RECEIPTS,
        SECURITY, OPERATING_SYSTEM, LICENSED_SOFTWARE, IBEACONS,
        SOFTWARE_UPDATES, EXTENSION_ATTRIBUTES, CONTENT_CACHING,
        GROUP_MEMBERSHIPS.
      default: null
    page:
      type: int | None
      description: Zero-indexed page number.
      default: null
    page_size:
      type: int | None
      description: Number of results per page.
      default: null
    sort:
      type: list[str] | None
      description: Sort expressions in property:asc or property:desc format.
      default: null
    filter:
      type: str | None
      description: RSQL filter expression. See https://developer.jamf.com/jamf-pro/docs/filtering-with-rsql.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            section: ${{ inputs.section }}
            page: ${{ inputs.page }}
            page-size: ${{ inputs.page_size }}
            sort: ${{ inputs.sort }}
            filter: ${{ inputs.filter }}
        script: |
          def main(params):
              query = {}
              for key, value in params.items():
                  if value is None:
                      continue
                  if key == "sort" and isinstance(value, list):
                      value = ",".join(str(item) for item in value)
                  query[key] = value
              return query
    - ref: list_computer_inventory
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jamf.base_url }}/api/v4/computers-inventory
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.jamf_oauth.JAMF_SERVICE_TOKEN || SECRETS.jamf.JAMF_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_computer_inventory.result }}
