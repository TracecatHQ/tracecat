type: action
definition:
  title: Get field capabilities
  description: "Get the type and searchable/aggregatable capabilities of fields across indices."
  display_group: Elasticsearch
  doc_url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-field-caps
  namespace: tools.elasticsearch
  name: get_field_capabilities
  secrets:
    - name: elasticsearch
      keys: ["ELASTIC_API_KEY"]
  expects:
    index:
      type: str
      description: "Comma-separated index, data stream, or alias names. Use `_all` or `*` for all."
    fields:
      type: str
      description: "Comma-separated field names or wildcard patterns (e.g. `*`)."
    payload:
      # Free-form: the body is Elasticsearch Query DSL / API-native JSON.
      type: dict[str, Any] | None
      description: "Optional JSON request body, e.g. `index_filter` or `runtime_mappings`."
      default: null
    base_url:
      type: str | None
      description: "Elasticsearch base URL (e.g. https://localhost:9200)."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elasticsearch.base_url }}/${{ FN.url_encode(inputs.index) }}/_field_caps
        method: POST
        params:
          fields: ${{ inputs.fields }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elasticsearch.ELASTIC_API_KEY }}
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
