type: action
definition:
  title: Run ES|QL query
  description: Run an API-native ES|QL query for security investigation and threat hunting.
  display_group: Elasticsearch
  doc_url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-esql-query
  namespace: tools.elasticsearch
  name: esql
  secrets:
    - name: elasticsearch
      keys: ["ELASTIC_API_KEY"]
  expects:
    payload:
      type: dict[str, Any]
      description: API-native ES|QL JSON request body, including the query string.
    params:
      type: dict[str, Any] | None
      description: Optional native ES|QL query parameters, such as response format.
      default: null
    base_url:
      type: str | None
      description: Elasticsearch base URL (e.g. https://localhost:9200).
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elasticsearch.base_url }}/_query
        method: POST
        params: ${{ inputs.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elasticsearch.ELASTIC_API_KEY }}
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
