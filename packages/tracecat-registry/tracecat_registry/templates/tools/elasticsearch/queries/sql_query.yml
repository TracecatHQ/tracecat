type: action
definition:
  title: SQL query
  description: "Run an Elasticsearch SQL query. Pass `cursor` from a previous response to fetch the next page."
  display_group: Elasticsearch
  doc_url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-sql-query
  namespace: tools.elasticsearch
  name: sql_query
  secrets:
    - name: elasticsearch
      keys: ["ELASTIC_API_KEY"]
  expects:
    payload:
      # Free-form: the body is Elasticsearch Query DSL / API-native JSON.
      type: dict[str, Any]
      description: "API-native JSON request body, e.g. `query`, `fetch_size`, `filter`, `params`, `time_zone`, or `cursor`."
    params:
      type: dict[str, Any] | None
      description: "Optional native Elasticsearch query parameters."
      default: null
    base_url:
      type: str | None
      description: "Elasticsearch base URL (e.g. https://localhost:9200)."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elasticsearch.base_url }}/_sql
        method: POST
        params: ${{ inputs.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elasticsearch.ELASTIC_API_KEY }}
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
