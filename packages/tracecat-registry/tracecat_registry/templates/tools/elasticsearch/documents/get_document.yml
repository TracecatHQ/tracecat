type: action
definition:
  title: Get document
  description: Get an Elasticsearch document by ID.
  display_group: Elasticsearch
  doc_url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-get
  namespace: tools.elasticsearch
  name: get_document
  secrets:
    - name: elasticsearch
      keys: ["ELASTIC_API_KEY"]
  expects:
    index:
      type: str
      description: Index name.
    document_id:
      type: str
      description: Document ID.
    params:
      type: dict[str, Any] | None
      description: Optional native Elasticsearch query parameters.
      default: null
    base_url:
      type: str | None
      description: Elasticsearch base URL (e.g. https://localhost:9200).
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elasticsearch.base_url }}/${{ FN.url_encode(inputs.index) }}/_doc/${{ FN.url_encode(inputs.document_id) }}
        method: GET
        params: ${{ inputs.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elasticsearch.ELASTIC_API_KEY }}
  returns: ${{ steps.request.result.data }}
