type: action
definition:
  title: Update document
  description: "Partially update an Elasticsearch document by ID (`doc`), with a script, or as an upsert."
  display_group: Elasticsearch
  doc_url: https://www.elastic.co/docs/api/doc/elasticsearch/operation/operation-update
  namespace: tools.elasticsearch
  name: update_document
  secrets:
    - name: elasticsearch
      keys: ["ELASTIC_API_KEY"]
  expects:
    index:
      type: str
      description: "Index, data stream, or alias name."
    document_id:
      type: str
      description: "Document ID."
    payload:
      # Free-form: the body is a oneOf of partial-doc, script, and upsert forms.
      type: dict[str, Any]
      description: "API-native JSON request body, e.g. `doc` (partial document), `script`, `upsert`, `doc_as_upsert`, `detect_noop`."
    params:
      type: dict[str, Any] | None
      description: "Optional native Elasticsearch query parameters."
      default: null
    base_url:
      type: str | None
      description: "Elasticsearch base URL (e.g. https://localhost:9200)."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elasticsearch.base_url }}/${{ FN.url_encode(inputs.index) }}/_update/${{ FN.url_encode(inputs.document_id) }}
        method: POST
        params: ${{ inputs.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elasticsearch.ELASTIC_API_KEY }}
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
