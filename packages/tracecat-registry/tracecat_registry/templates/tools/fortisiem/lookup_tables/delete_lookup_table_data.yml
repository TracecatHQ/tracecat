type: action
definition:
  title: Delete lookup table data
  description: Delete lookup table items identified by their primary keys.
  display_group: Fortinet FortiSIEM
  doc_url: https://docs.fortinet.com/document/fortisiem/7.5.1/integration-api-guide/516391/lookup-table-integration#put-pub-lookuptable-lookuptableid-data-delete
  namespace: tools.fortisiem
  name: delete_lookup_table_data
  secrets:
    - name: fortisiem
      keys:
        - FORTISIEM_USERNAME
        - FORTISIEM_PASSWORD
  expects:
    lookupTableId:
      type: int
      description: Lookup table ID.
    keys:
      type: list[dict[str, Any]]
      description: 'List of primary key and value maps, e.g. [{"url": "http://example.com"}].'
    base_url:
      type: str | None
      description: FortiSIEM Supervisor URL, e.g. https://fortisiem.example.com. Falls back to the workspace variable fortisiem.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the Supervisor TLS certificate.
      default: true
  steps:
    - ref: call_api
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fortisiem.base_url }}/phoenix/rest/pub/lookupTable/${{ inputs.lookupTableId }}/data/delete
        method: PUT
        payload: ${{ inputs.keys }}
        auth:
          username: ${{ SECRETS.fortisiem.FORTISIEM_USERNAME }}
          password: ${{ SECRETS.fortisiem.FORTISIEM_PASSWORD }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.call_api.result }}
