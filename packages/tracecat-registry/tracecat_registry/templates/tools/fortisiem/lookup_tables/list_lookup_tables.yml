type: action
definition:
  title: List lookup tables
  description: Retrieve the list of lookup table definitions.
  display_group: Fortinet FortiSIEM
  doc_url: https://docs.fortinet.com/document/fortisiem/7.5.1/integration-api-guide/516391/lookup-table-integration#get-pub-lookup-table
  namespace: tools.fortisiem
  name: list_lookup_tables
  secrets:
    - name: fortisiem
      keys:
        - FORTISIEM_USERNAME
        - FORTISIEM_PASSWORD
  expects:
    start:
      type: int | None
      description: Offset the list of returned results by this amount. Default is zero.
      default: null
    size:
      type: int | None
      description: Number of items to retrieve. Default is 25, maximum is 1000.
      default: null
    base_url:
      type: str | None
      description: FortiSIEM Supervisor URL, e.g. https://fortisiem.example.com. Falls back to the workspace variable fortisiem.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the Supervisor TLS certificate.
      default: true
  steps:
    - ref: call_api
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fortisiem.base_url }}/phoenix/rest/pub/lookupTable
        method: GET
        params:
          start: ${{ inputs.start }}
          size: ${{ inputs.size }}
        auth:
          username: ${{ SECRETS.fortisiem.FORTISIEM_USERNAME }}
          password: ${{ SECRETS.fortisiem.FORTISIEM_PASSWORD }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.call_api.result }}
