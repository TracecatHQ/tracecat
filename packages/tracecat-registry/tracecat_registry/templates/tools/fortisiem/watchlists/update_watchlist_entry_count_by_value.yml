type: action
definition:
  title: Update watch list entry count by value
  description: Update the occurrence count of a watch list entry identified by its value within a watch list.
  display_group: Fortinet FortiSIEM
  doc_url: https://docs.fortinet.com/document/fortisiem/7.5.1/integration-api-guide/893786/watchlist-integration#update-count-of-watch-list-entry-by-watch-list-entry-value
  namespace: tools.fortisiem
  name: update_watchlist_entry_count_by_value
  secrets:
    - name: fortisiem
      keys:
        - FORTISIEM_USERNAME
        - FORTISIEM_PASSWORD
  expects:
    watchlistId:
      type: int
      description: Watch list ID.
    value:
      type: str
      description: Entry value of watch list entry.
    count:
      type: int
      description: Count of watch list entry occurrence.
    custId:
      type: int | None
      description: Customer ID.
      default: null
    base_url:
      type: str | None
      description: FortiSIEM Supervisor URL, e.g. https://fortisiem.example.com. Falls back to the workspace variable fortisiem.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the Supervisor TLS certificate.
      default: true
  steps:
    - ref: call_api
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fortisiem.base_url }}/phoenix/rest/watchlist/entry/count
        method: POST
        params:
          custId: ${{ inputs.custId }}
          watchlistId: ${{ inputs.watchlistId }}
          value: ${{ inputs.value }}
          count: ${{ inputs.count }}
        auth:
          username: ${{ SECRETS.fortisiem.FORTISIEM_USERNAME }}
          password: ${{ SECRETS.fortisiem.FORTISIEM_PASSWORD }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.call_api.result }}
