type: action
definition:
  title: Save watch list
  description: Save a watch list group, with its watch list entries, to the FortiSIEM database.
  display_group: Fortinet FortiSIEM
  doc_url: https://docs.fortinet.com/document/fortisiem/7.5.1/integration-api-guide/893786/watchlist-integration#save-watch-list-groups-with-watch-list-entry-s
  namespace: tools.fortisiem
  name: save_watchlist
  secrets:
    - name: fortisiem
      keys:
        - FORTISIEM_USERNAME
        - FORTISIEM_PASSWORD
  expects:
    watchlist:
      type: dict[str, Any]
      description: 'Watch list JSON object. Fields: displayName (required), type (required, e.g. DyWatchList), description, isCaseSensitive, dataCreationType (SYSTEM or USER), topGroup, valuePattern (IP, IPRANGE or CIDR), valueType (e.g. STRING or IP), ageOut, custId, entries (array of watch list entry objects with fields entryValue (required), description, inclusive, count, custId, triggeringRules, ageOut, disableAgeout, firstSeen, lastSeen, expiredTime, state, dataCreationType (SYSTEM or USER)).'
    base_url:
      type: str | None
      description: FortiSIEM Supervisor URL, e.g. https://fortisiem.example.com. Falls back to the workspace variable fortisiem.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the Supervisor TLS certificate.
      default: true
  steps:
    - ref: call_api
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fortisiem.base_url }}/phoenix/rest/watchlist/save
        method: POST
        payload: ${{ inputs.watchlist }}
        auth:
          username: ${{ SECRETS.fortisiem.FORTISIEM_USERNAME }}
          password: ${{ SECRETS.fortisiem.FORTISIEM_PASSWORD }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.call_api.result }}
