type: action
definition:
  title: Add watch list entries
  description: Add one or more entries to a watch list group.
  display_group: Fortinet FortiSIEM
  doc_url: https://docs.fortinet.com/document/fortisiem/7.5.1/integration-api-guide/893786/watchlist-integration#add-watch-list-entry-s-to-watch-list-groups
  namespace: tools.fortisiem
  name: add_watchlist_entries
  secrets:
    - name: fortisiem
      keys:
        - FORTISIEM_USERNAME
        - FORTISIEM_PASSWORD
  expects:
    watchlistId:
      type: int
      description: Watch list ID.
    entries:
      type: list[dict[str, Any]]
      description: 'Array of watch list entry objects. Watch list entry fields: entryValue (required), description, inclusive, count, custId, triggeringRules, ageOut, disableAgeout, firstSeen, lastSeen, expiredTime, state, dataCreationType (SYSTEM or USER).'
    base_url:
      type: str | None
      description: FortiSIEM Supervisor URL, e.g. https://fortisiem.example.com. Falls back to the workspace variable fortisiem.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the Supervisor TLS certificate.
      default: true
  steps:
    - ref: call_api
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fortisiem.base_url }}/phoenix/rest/watchlist/addTo
        method: POST
        params:
          watchlistId: ${{ inputs.watchlistId }}
        payload: ${{ inputs.entries }}
        auth:
          username: ${{ SECRETS.fortisiem.FORTISIEM_USERNAME }}
          password: ${{ SECRETS.fortisiem.FORTISIEM_PASSWORD }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.call_api.result }}
