type: action
definition:
  title: Get watch lists by entry value
  description: Retrieve the watch lists that contain an entry with the given value.
  display_group: Fortinet FortiSIEM
  doc_url: https://docs.fortinet.com/document/fortisiem/7.5.1/integration-api-guide/893786/watchlist-integration#get-watch-list-by-watch-list-entry-value
  namespace: tools.fortisiem
  name: get_watchlist_by_entry_value
  secrets:
    - name: fortisiem
      keys:
        - FORTISIEM_USERNAME
        - FORTISIEM_PASSWORD
  expects:
    entryValue:
      type: str
      description: Entry value of watch list entry.
    base_url:
      type: str | None
      description: FortiSIEM Supervisor URL, e.g. https://fortisiem.example.com. Falls back to the workspace variable fortisiem.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the Supervisor TLS certificate.
      default: true
  steps:
    - ref: call_api
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fortisiem.base_url }}/phoenix/rest/watchlist/value
        method: GET
        params:
          entryValue: ${{ inputs.entryValue }}
        auth:
          username: ${{ SECRETS.fortisiem.FORTISIEM_USERNAME }}
          password: ${{ SECRETS.fortisiem.FORTISIEM_PASSWORD }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.call_api.result }}
