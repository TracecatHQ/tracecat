type: action
definition:
  title: Get agent status
  description: Get the Linux or Windows agent status (type, agent status, policy ID, heartbeat and last event receive time) for a host. Returns XML.
  display_group: Fortinet FortiSIEM
  doc_url: https://docs.fortinet.com/document/fortisiem/7.5.1/integration-api-guide/656582/get-agent-status-for-a-specific-host
  namespace: tools.fortisiem
  name: get_agent_status
  secrets:
    - name: fortisiem
      keys:
        - FORTISIEM_USERNAME
        - FORTISIEM_PASSWORD
  expects:
    request:
      type: str
      description: Organization ID and host name separated by a comma, e.g. 2000,centos7.
    base_url:
      type: str | None
      description: FortiSIEM Supervisor URL, e.g. https://fortisiem.example.com. Falls back to the workspace variable fortisiem.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the Supervisor TLS certificate.
      default: true
  steps:
    - ref: call_api
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fortisiem.base_url }}/phoenix/rest/agentStatus/all
        method: GET
        params:
          request: ${{ inputs.request }}
        auth:
          username: ${{ SECRETS.fortisiem.FORTISIEM_USERNAME }}
          password: ${{ SECRETS.fortisiem.FORTISIEM_PASSWORD }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.call_api.result }}
