type: action
definition:
  title: List device apps
  description: List applications installed on a device.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#f8cd9733-89b6-40f0-a7ca-76829c6974df
  namespace: tools.iru
  name: list_device_apps
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    device_id:
      type: str
      description: Device UUID.
  steps:
    - ref: list_device_apps
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/devices/${{ FN.url_encode(inputs.device_id) }}/apps
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
  returns: ${{ steps.list_device_apps.result }}
