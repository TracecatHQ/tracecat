type: action
definition:
  title: Get device
  description: Get a device record by UUID.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#10a56208-b230-455a-a835-32b6cfb2803d
  namespace: tools.iru
  name: get_device
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    device_id:
      type: str
      description: Device UUID.
  steps:
    - ref: get_device
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/devices/${{ FN.url_encode(inputs.device_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
  returns: ${{ steps.get_device.result }}
