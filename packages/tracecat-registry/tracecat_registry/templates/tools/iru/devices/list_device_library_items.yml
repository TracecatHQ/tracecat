type: action
definition:
  title: List device library items
  description: List Library Items assigned to a device.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#005bf79f-3458-4834-9c2f-4e0c792069f4
  namespace: tools.iru
  name: list_device_library_items
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    device_id:
      type: str
      description: Device UUID.
  steps:
    - ref: list_device_library_items
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/devices/${{ FN.url_encode(inputs.device_id) }}/library-items
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
  returns: ${{ steps.list_device_library_items.result }}
