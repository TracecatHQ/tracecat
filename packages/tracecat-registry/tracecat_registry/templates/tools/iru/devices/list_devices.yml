type: action
definition:
  title: List devices
  description: List devices in the tenant. Returns a bare JSON array rather than a paged envelope, and extra fields appear when Windows or Android management is enabled.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#78209960-31a7-4e3b-a2c0-95c7e65bb5f9
  namespace: tools.iru
  name: list_devices
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    asset_tag:
      type: str | None
      description: Asset tag to filter by.
      default: null
    blueprint_id:
      type: str | None
      description: Blueprint UUID to filter by.
      default: null
    device_id:
      type: str | None
      description: Device UUID to filter by.
      default: null
    device_name:
      type: str | None
      description: Device name to filter by.
      default: null
    filevault_enabled:
      type: bool | None
      description: Whether to filter for devices with FileVault enabled or disabled.
      default: null
    mac_address:
      type: str | None
      description: MAC address to filter by.
      default: null
    model:
      type: str | None
      description: Device model to filter by.
      default: null
    ordering:
      type: str | None
      description: Field to order results by; prefix with - to reverse the order.
      default: null
    os_version:
      type: str | None
      description: Operating system version to filter by.
      default: null
    platform:
      type: str | None
      description: Platform to filter by, such as Mac, iPad, iPhone, AppleTV, or Android.
      default: null
    serial_number:
      type: str | None
      description: Serial number to filter by.
      default: null
    tag_id:
      type: str | None
      description: Tag UUID to filter by.
      default: null
    tag_name_in:
      type: str | None
      description: Tag names to filter by, separated by commas. Case sensitive.
      default: null
    tag_id_in:
      type: str | None
      description: Tag IDs to filter by, separated by commas. Case sensitive.
      default: null
    user_email_exact:
      type: str | None
      description: Exact match on the assigned user's email address.
      default: null
    tag_name:
      type: str | None
      description: Tag name to filter by.
      default: null
    user:
      type: str | None
      description: Assigned user to filter by.
      default: null
    user_email:
      type: str | None
      description: Assigned user email to filter by.
      default: null
    user_id:
      type: str | None
      description: Assigned user UUID to filter by.
      default: null
    user_name:
      type: str | None
      description: Assigned user name to filter by.
      default: null
    limit:
      type: int | None
      description: Results per page. Maximum 300.
      default: null
    offset:
      type: int | None
      description: Number of results to skip.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            asset_tag: ${{ inputs.asset_tag }}
            blueprint_id: ${{ inputs.blueprint_id }}
            device_id: ${{ inputs.device_id }}
            device_name: ${{ inputs.device_name }}
            filevault_enabled: ${{ inputs.filevault_enabled }}
            mac_address: ${{ inputs.mac_address }}
            model: ${{ inputs.model }}
            ordering: ${{ inputs.ordering }}
            os_version: ${{ inputs.os_version }}
            platform: ${{ inputs.platform }}
            serial_number: ${{ inputs.serial_number }}
            tag_id: ${{ inputs.tag_id }}
            tag_name: ${{ inputs.tag_name }}
            tag_name_in: ${{ inputs.tag_name_in }}
            tag_id_in: ${{ inputs.tag_id_in }}
            user_email_exact: ${{ inputs.user_email_exact }}
            user: ${{ inputs.user }}
            user_email: ${{ inputs.user_email }}
            user_id: ${{ inputs.user_id }}
            user_name: ${{ inputs.user_name }}
            limit: ${{ inputs.limit }}
            offset: ${{ inputs.offset }}
        script: |
          def main(params):
              return {k: v for k, v in params.items() if v is not None}
    - ref: list_devices
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/devices
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_devices.result }}
