type: action
definition:
  title: Delete device
  description: Delete a device. Removes the device record, unenrolls the device from MDM, and causes the Iru agent to uninstall itself at next check-in. This cannot be undone.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#97deb582-d86c-444a-aa3b-3528b9a8478f
  namespace: tools.iru
  name: delete_device
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    device_id:
      type: str
      description: Device UUID.
  steps:
    - ref: delete_device
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/devices/${{ FN.url_encode(inputs.device_id) }}
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
  returns: ${{ steps.delete_device.result }}
