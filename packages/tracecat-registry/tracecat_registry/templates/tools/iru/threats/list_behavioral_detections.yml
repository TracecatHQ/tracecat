type: action
definition:
  title: List behavioral detections
  description: Lists EDR behavioral detections. Threat state is read-only through the API; there is no endpoint to release a detection from quarantine, and released is only a filter value.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#f376b345-8dc2-4ac6-97fd-0d81748e130f
  namespace: tools.iru
  name: list_behavioral_detections
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    threat_id:
      type: str | None
      description: Threat UUID to filter by.
      default: null
    classification:
      type: str | None
      description: Detection classification to filter by.
      default: null
    status:
      type: str | None
      description: Detection status to filter by.
      default: null
    date_range:
      type: int | None
      description: Number of days to include.
      default: null
    detection_date_from:
      type: str | None
      description: Earliest detection date to include.
      default: null
    detection_date_to:
      type: str | None
      description: Latest detection date to include.
      default: null
    device_id:
      type: str | None
      description: Device UUID to filter by.
      default: null
    malware_family:
      type: str | None
      description: Malware family to filter by.
      default: null
    parent_process_name:
      type: str | None
      description: Parent process name to filter by.
      default: null
    target_process_name:
      type: str | None
      description: Target process name to filter by.
      default: null
    informational_tags:
      type: str | None
      description: Informational tags to filter by.
      default: null
    term:
      type: str | None
      description: Free-text search term.
      default: null
    sort_by:
      type: str | None
      description: Field to sort results by.
      default: null
    limit:
      type: int | None
      description: Results per page. Maximum 1000.
      default: null
    offset:
      type: int | None
      description: Number of results to skip.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            threat_id: ${{ inputs.threat_id }}
            classification: ${{ inputs.classification }}
            status: ${{ inputs.status }}
            date_range: ${{ inputs.date_range }}
            detection_date_from: ${{ inputs.detection_date_from }}
            detection_date_to: ${{ inputs.detection_date_to }}
            device_id: ${{ inputs.device_id }}
            malware_family: ${{ inputs.malware_family }}
            parent_process_name: ${{ inputs.parent_process_name }}
            target_process_name: ${{ inputs.target_process_name }}
            informational_tags: ${{ inputs.informational_tags }}
            term: ${{ inputs.term }}
            sort_by: ${{ inputs.sort_by }}
            limit: ${{ inputs.limit }}
            offset: ${{ inputs.offset }}
        script: |
          def main(params):
              return {k: v for k, v in params.items() if v is not None}
    - ref: list_behavioral_detections
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/behavioral-detections
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_behavioral_detections.result }}
