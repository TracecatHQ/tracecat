type: action
definition:
  title: List threat details
  description: List malware and potentially unwanted program detections. Threat state is read-only through the API; there is no endpoint to release a detection from quarantine.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#d041043a-ea47-47d5-b6f1-234ef422494d
  namespace: tools.iru
  name: list_threat_details
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    classification:
      type: str | None
      description: Detection classification, such as malware or pup.
      default: null
    date_range:
      type: int | None
      description: Number of days to include.
      default: null
    device_id:
      type: str | None
      description: Device UUID to filter by.
      default: null
    status:
      type: str | None
      description: Detection status, such as quarantined, not_quarantined, or released.
      default: null
    sort_by:
      type: str | None
      description: Field to sort results by.
      default: null
    term:
      type: str | None
      description: Free-text search across device name and file hash.
      default: null
    limit:
      type: int | None
      description: Results per page. Maximum 1000.
      default: null
    offset:
      type: int | None
      description: Number of results to skip.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            classification: ${{ inputs.classification }}
            date_range: ${{ inputs.date_range }}
            device_id: ${{ inputs.device_id }}
            status: ${{ inputs.status }}
            sort_by: ${{ inputs.sort_by }}
            term: ${{ inputs.term }}
            limit: ${{ inputs.limit }}
            offset: ${{ inputs.offset }}
        script: |
          def main(params):
              return {k: v for k, v in params.items() if v is not None}
    - ref: list_threat_details
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/threat-details
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_threat_details.result }}
