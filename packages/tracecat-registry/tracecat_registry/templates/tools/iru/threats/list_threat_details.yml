type: action
definition:
  title: List threat details
  description: List malware and potentially unwanted program detections. Threat state is read-only through the API; there is no endpoint to release a detection from quarantine.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#92ff98c7-c048-4f1e-9ac2-3b65ea9af5dd
  namespace: tools.iru
  name: list_threat_details
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru base URL (e.g. https://acme.api.kandji.io).
      default: null
    statuses:
      type: str
      description: Required. Threat statuses to return, such as quarantined, not_quarantined, or released.
    device_id:
      type: str | None
      description: Return detections for a single device UUID.
      default: null
    classification:
      type: str | None
      description: Threat classification to filter by, such as malware or pup.
      default: null
    severities:
      type: str | None
      description: Severity levels to filter by.
      default: null
    management_state:
      type: str | None
      description: Management states to filter by.
      default: null
    tags:
      type: str | None
      description: Tags to filter by.
      default: null
    term:
      type: str | None
      description: Search term matched against fields such as device name and file hash.
      default: null
    date_range:
      type: int | None
      description: Return records from the last N days.
      default: null
    detection_date_from:
      type: str | None
      description: Earliest detection timestamp in UTC (e.g. 2026-01-21T16:08:00.0).
      default: null
    detection_date_to:
      type: str | None
      description: Latest detection timestamp in UTC (e.g. 2026-01-21T16:08:00.0).
      default: null
    sort_by:
      type: str | None
      description: Field to sort by; prefix with - to reverse the order.
      default: null
    limit:
      type: int | None
      description: Results per page. Maximum 1000.
      default: null
    offset:
      type: int | None
      description: Number of results to skip.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            statuses: ${{ inputs.statuses }}
            device_id: ${{ inputs.device_id }}
            classification: ${{ inputs.classification }}
            severities: ${{ inputs.severities }}
            management_state: ${{ inputs.management_state }}
            tags: ${{ inputs.tags }}
            term: ${{ inputs.term }}
            date_range: ${{ inputs.date_range }}
            detection_date_from: ${{ inputs.detection_date_from }}
            detection_date_to: ${{ inputs.detection_date_to }}
            sort_by: ${{ inputs.sort_by }}
            limit: ${{ inputs.limit }}
            offset: ${{ inputs.offset }}
        script: |
          def main(params):
              return {k: v for k, v in params.items() if v is not None}
    - ref: list_threat_details
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v2/threat/threat-details
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_threat_details.result }}
