type: action
definition:
  title: List device behavioral detections
  description: List EDR behavioral detection events for a single device. The v2 endpoint is device-scoped, so a device UUID is required and fleet-wide sweeps are not available. Threat state is read-only through the API.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#39bfcf91-086a-4907-a69d-b5bca6a1a1a8
  namespace: tools.iru
  name: list_device_behavioral_detections
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru base URL (e.g. https://acme.api.kandji.io).
      default: null
    device_id:
      type: str
      description: Required. Device UUID to return detection events for.
    classifications:
      type: str | None
      description: Detection classifications to filter by.
      default: null
    statuses:
      type: str | None
      description: Detection statuses to filter by.
      default: null
    severities:
      type: str | None
      description: Severity levels to filter by.
      default: null
    management_state:
      type: str | None
      description: Management states to filter by.
      default: null
    tags:
      type: str | None
      description: Tags to filter by.
      default: null
    search_term:
      type: str | None
      description: Search term to filter results.
      default: null
    detection_from:
      type: str | None
      description: Earliest detection timestamp in UTC (e.g. 2026-01-21T16:08:00.0).
      default: null
    detection_to:
      type: str | None
      description: Latest detection timestamp in UTC (e.g. 2026-01-21T16:08:00.0).
      default: null
    sort_by:
      type: str | None
      description: Field to sort by; prefix with - to reverse the order.
      default: null
    limit:
      type: int | None
      description: Results per page. Maximum 1000.
      default: null
    offset:
      type: int | None
      description: Number of results to skip.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            device_id: ${{ inputs.device_id }}
            classifications: ${{ inputs.classifications }}
            statuses: ${{ inputs.statuses }}
            severities: ${{ inputs.severities }}
            management_state: ${{ inputs.management_state }}
            tags: ${{ inputs.tags }}
            search_term: ${{ inputs.search_term }}
            detection_from: ${{ inputs.detection_from }}
            detection_to: ${{ inputs.detection_to }}
            sort_by: ${{ inputs.sort_by }}
            limit: ${{ inputs.limit }}
            offset: ${{ inputs.offset }}
        script: |
          def main(params):
              return {k: v for k, v in params.items() if v is not None}
    - ref: list_device_behavioral_detections
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v2/threat/behavioral-detections/events
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_device_behavioral_detections.result }}
