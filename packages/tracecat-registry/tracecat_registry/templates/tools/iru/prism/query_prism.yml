type: action
definition:
  title: Query Prism inventory
  description: Query a fleet-wide Prism inventory category.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#d538b34f-5343-416e-be53-2ba108c51dfa
  namespace: tools.iru
  name: query_prism
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    category:
      type: str
      description: Prism category, such as activation_lock, application_firewall, apps, cellular, certificates, desktop_and_screensaver, device_information, filevault, gatekeeper_and_xprotect, installed_profiles, kernel_extensions, launch_agents_and_daemons, local_users, startup_settings, system_extensions, or transparency_database.
    blueprint_ids:
      type: list[str] | None
      description: Blueprint UUIDs to filter by.
      default: null
    device_families:
      type: list[str] | None
      description: Device families to filter by.
      default: null
    filter:
      type: dict[str, Any] | None
      description: Provider-native Prism filter object.
      default: null
    sort_by:
      type: str | None
      description: Field to sort by; prefix with - to reverse the order.
      default: null
    limit:
      type: int | None
      description: Results per page. Maximum 300.
      default: null
    offset:
      type: int | None
      description: Number of results to skip.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            blueprint_ids: ${{ inputs.blueprint_ids }}
            device_families: ${{ inputs.device_families }}
            filter: ${{ inputs.filter }}
            sort_by: ${{ inputs.sort_by }}
            limit: ${{ inputs.limit }}
            offset: ${{ inputs.offset }}
        script: |
          import json

          CSV_PARAMS = ("blueprint_ids", "device_families")

          def main(params):
              query = {}
              for key, value in params.items():
                  if value is None:
                      continue
                  if key in CSV_PARAMS and isinstance(value, list):
                      value = ",".join(str(item) for item in value)
                  elif key == "filter" and not isinstance(value, str):
                      value = json.dumps(value, separators=(",", ":"))
                  query[key] = value
              return query
    - ref: query_prism
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/prism/${{ FN.url_encode(inputs.category) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.query_prism.result }}
