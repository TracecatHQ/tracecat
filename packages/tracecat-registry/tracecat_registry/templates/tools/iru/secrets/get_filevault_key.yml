type: action
definition:
  title: Get FileVault recovery key
  description: Gets a device's FileVault recovery key. Retrieval is recorded in the Iru audit log, and the key should be escrowed before any destructive offboarding step.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#1577d0da-7b69-4c2b-a322-32bf1cfffee2
  namespace: tools.iru
  name: get_filevault_key
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    device_id:
      type: str
      description: Device UUID.
  steps:
    - ref: get_filevault_key
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/devices/${{ FN.url_encode(inputs.device_id) }}/secrets/filevaultkey
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
  returns: ${{ steps.get_filevault_key.result }}
