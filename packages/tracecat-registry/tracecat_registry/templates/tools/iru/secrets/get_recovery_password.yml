type: action
definition:
  title: Get recovery lock password
  description: Gets a device's recovery lock password. Retrieval is recorded in the Iru audit log, and the password should be escrowed before any destructive offboarding step.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#a0c3f9a9-485b-46ec-922c-fc5f0e9a48d9
  namespace: tools.iru
  name: get_recovery_password
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    device_id:
      type: str
      description: Device UUID.
  steps:
    - ref: get_recovery_password
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/devices/${{ FN.url_encode(inputs.device_id) }}/secrets/recoverypassword
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
  returns: ${{ steps.get_recovery_password.result }}
