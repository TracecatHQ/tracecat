type: action
definition:
  title: Get Activation Lock bypass code
  description: Get a device's Activation Lock bypass code. Retrieval is recorded in the Iru audit log. Escrow the code before any destructive offboarding step.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#f593744e-eedc-4d4d-ac0d-45d54860bbc5
  namespace: tools.iru
  name: get_activation_lock_bypass_code
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    device_id:
      type: str
      description: Device UUID.
  steps:
    - ref: get_activation_lock_bypass_code
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/devices/${{ FN.url_encode(inputs.device_id) }}/secrets/bypasscode
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
  returns: ${{ steps.get_activation_lock_bypass_code.result }}
