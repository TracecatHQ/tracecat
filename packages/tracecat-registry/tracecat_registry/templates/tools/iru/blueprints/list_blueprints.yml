type: action
definition:
  title: List blueprints
  description: Lists tenant Blueprints with optional filtering and pagination.
  display_group: Iru (Kandji)
  doc_url: https://api-docs.iru.com/#44d3765c-ef17-4226-9104-47e5cef1d370
  namespace: tools.iru
  name: list_blueprints
  secrets:
    - name: iru
      keys: ["IRU_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Iru (Kandji) API base URL (e.g. https://acme.api.kandji.io).
      default: null
    id:
      type: str | None
      description: Blueprint UUID to filter by.
      default: null
    id__in:
      type: str | None
      description: Comma-separated Blueprint UUIDs to include.
      default: null
    name:
      type: str | None
      description: Blueprint name substring to match.
      default: null
    limit:
      type: int | None
      description: Results per page. Maximum 300.
      default: null
    offset:
      type: int | None
      description: Number of results to skip.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            id: ${{ inputs.id }}
            id__in: ${{ inputs.id__in }}
            name: ${{ inputs.name }}
            limit: ${{ inputs.limit }}
            offset: ${{ inputs.offset }}
        script: |
          def main(params):
              return {k: v for k, v in params.items() if v is not None}
    - ref: list_blueprints
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.iru.base_url }}/api/v1/blueprints
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.iru.IRU_API_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_blueprints.result }}
