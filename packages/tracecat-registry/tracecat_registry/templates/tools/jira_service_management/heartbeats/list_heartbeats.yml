type: action
definition:
  title: List heartbeats
  description: >-
    Retrieve the heartbeats configured for a team. Use this to discover
    heartbeat names and inspect their status, interval, and last ping time.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk-ops/rest/v2/api-group-heartbeats/#api-v1-teams-teamid-heartbeats-get
  namespace: tools.jira_service_management
  name: list_heartbeats
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
    team_id:
      type: str
      description: Identifier of the team that owns the heartbeats.
  steps:
    - ref: list_heartbeats
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/jsm/ops/api/v1/teams/${{ inputs.team_id }}/heartbeats
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
  returns: ${{ steps.list_heartbeats.result.data }}
