type: action
definition:
  title: Delete heartbeat
  description: Delete a heartbeat monitor from a team, identified by name.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk-ops/rest/v2/api-group-heartbeats/#api-v1-teams-teamid-heartbeats-delete
  namespace: tools.jira_service_management
  name: delete_heartbeat
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
    team_id:
      type: str
      description: Identifier of the team that owns the heartbeat.
    name:
      type: str
      description: Name of the heartbeat to delete.
  steps:
    - ref: delete_heartbeat
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/jsm/ops/api/v1/teams/${{ inputs.team_id }}/heartbeats
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
        params:
          name: ${{ inputs.name }}
  returns: ${{ steps.delete_heartbeat.result.data }}
