type: action
definition:
  title: Add request participants
  description: Add participants to a service request.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-issueidorkey-participant-post
  namespace: tools.jira_service_management
  name: add_request_participants
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    issueIdOrKey:
      type: str
      description: >-
        The ID or key of the customer request to have participants added.
    accountIds:
      type: list[str]
      description: >-
        Account IDs of the users to add as participants.
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
  steps:
    - ref: add_request_participants
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/servicedeskapi/request/${{ FN.url_encode(inputs.issueIdOrKey) }}/participant
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
        payload:
          accountIds: ${{ inputs.accountIds }}
  returns: ${{ steps.add_request_participants.result }}
