type: action
definition:
  title: List request approvals
  description: Get the approvals on a service request.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk/rest/api-group-request/#api-rest-servicedeskapi-request-issueidorkey-approval-get
  namespace: tools.jira_service_management
  name: list_request_approvals
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    start:
      type: int | None
      description: >-
        The starting index of the returned objects. Base index: 0. See the
        Pagination section for more details.
      default: null
    limit:
      type: int | None
      description: >-
        The maximum number of approvals to return per page. Default: 50. See the
        Pagination section for more details.
      default: null
    issueIdOrKey:
      type: str
      description: >-
        The ID or key of the customer request to be queried for its approvals.
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
  steps:
    - ref: list_request_approvals
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/servicedeskapi/request/${{ FN.url_encode(inputs.issueIdOrKey) }}/approval
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
        params:
          start: ${{ inputs.start }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.list_request_approvals.result }}
