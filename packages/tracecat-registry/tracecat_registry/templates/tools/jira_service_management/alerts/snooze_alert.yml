type: action
definition:
  title: Snooze alert
  description: Temporarily silence an alert for a specified period, preventing notifications.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk-ops/rest/v2/api-group-alerts/#api-rest-v1-alerts-id-snooze-post
  namespace: tools.jira_service_management
  name: snooze_alert
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
    alert_id:
      type: str
      description: Identifier of the alert.
    end_time:
      type: str
      description: Snooze end time in ISO 8601 format.
    note:
      type: str | None
      description: Additional note to add.
      default: null
    source:
      type: str | None
      description: Display name of the request source.
      default: null
    user:
      type: str | None
      description: Display name of the request owner.
      default: null
  steps:
    - ref: build_payload
      action: core.transform.reshape
      args:
        value:
          endTime: ${{ inputs.end_time }}
          note: ${{ inputs.note }}
          source: ${{ inputs.source }}
          user: ${{ inputs.user }}
    - ref: snooze_alert
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/jsm/ops/api/v1/alerts/${{ inputs.alert_id }}/snooze
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.snooze_alert.result.data }}
