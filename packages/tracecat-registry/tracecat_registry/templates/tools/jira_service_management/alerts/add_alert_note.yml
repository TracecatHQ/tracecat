type: action
definition:
  title: Add alert note
  description: Add a note to an existing alert.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk-ops/rest/v2/api-group-alerts/#api-rest-v1-alerts-id-notes-post
  namespace: tools.jira_service_management
  name: add_alert_note
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
    alert_id:
      type: str
      description: Identifier of the alert.
    note:
      type: str
      description: Note text to add to the alert (max 25,000 chars).
    source:
      type: str | None
      description: Display name of the request source.
      default: null
    user:
      type: str | None
      description: Display name of the request owner.
      default: null
  steps:
    - ref: build_payload
      action: core.transform.reshape
      args:
        value:
          note: ${{ inputs.note }}
          source: ${{ inputs.source }}
          user: ${{ inputs.user }}
    - ref: add_alert_note
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/jsm/ops/api/v1/alerts/${{ inputs.alert_id }}/notes
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.add_alert_note.result.data }}
