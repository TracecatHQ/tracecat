type: action
definition:
  title: Delete alert note
  description: Remove a specific note from an alert.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk-ops/rest/v2/api-group-alerts/#api-rest-v1-alerts-alertid-notes-id-delete
  namespace: tools.jira_service_management
  name: delete_alert_note
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
    alert_id:
      type: str
      description: Identifier of the alert.
    note_id:
      type: str
      description: Identifier of the note to delete.
  steps:
    - ref: delete_alert_note
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/jsm/ops/api/v1/alerts/${{ inputs.alert_id }}/notes/${{ inputs.note_id }}
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
  returns: ${{ steps.delete_alert_note.result.data }}
