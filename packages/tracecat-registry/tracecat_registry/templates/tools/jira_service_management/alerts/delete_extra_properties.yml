type: action
definition:
  title: Delete extra properties from alert
  description: Remove specified extra properties from an alert.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk-ops/rest/v2/api-group-alerts/#api-rest-v1-alerts-id-extra-properties-delete
  namespace: tools.jira_service_management
  name: delete_extra_properties
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
    alert_id:
      type: str
      description: Identifier of the alert.
    keys:
      type: list[str]
      description: List of extra property keys to remove.
    note:
      type: str | None
      description: Additional note to add.
      default: null
    source:
      type: str | None
      description: Display name of the request source.
      default: null
    user:
      type: str | None
      description: Display name of the request owner.
      default: null
  steps:
    - ref: build_payload
      action: core.transform.reshape
      args:
        value:
          keys: ${{ inputs.keys }}
          note: ${{ inputs.note }}
          source: ${{ inputs.source }}
          user: ${{ inputs.user }}
    - ref: delete_extra_properties
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/jsm/ops/api/v1/alerts/${{ inputs.alert_id }}/extra-properties
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.delete_extra_properties.result.data }}
