type: action
definition:
  title: Acknowledge alert
  description: >-
    Mark an alert as acknowledged, indicating it has been received and is being
    acted upon.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk-ops/rest/v2/api-group-alerts/#api-rest-v1-alerts-id-acknowledge-post
  namespace: tools.jira_service_management
  name: acknowledge_alert
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
    alert_id:
      type: str
      description: Identifier of the alert.
    note:
      type: str | None
      description: Additional note to add.
      default: null
    source:
      type: str | None
      description: Display name of the request source.
      default: null
    user:
      type: str | None
      description: Display name of the request owner.
      default: null
  steps:
    - ref: build_payload
      action: core.transform.reshape
      args:
        value:
          note: ${{ inputs.note }}
          source: ${{ inputs.source }}
          user: ${{ inputs.user }}
    - ref: acknowledge_alert
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/jsm/ops/api/v1/alerts/${{ inputs.alert_id }}/acknowledge
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.acknowledge_alert.result.data }}
