type: action
definition:
  title: Execute custom action on alert
  description: Execute a custom action on an alert, including integrations with external systems.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk-ops/rest/v2/api-group-alerts/#api-rest-v1-alerts-id-action-post
  namespace: tools.jira_service_management
  name: execute_custom_action
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
    alert_id:
      type: str
      description: Identifier of the alert.
    action_name:
      type: str
      description: Name of the custom action to execute.
    note:
      type: str | None
      description: Additional note to add.
      default: null
    source:
      type: str | None
      description: Display name of the request source.
      default: null
    user:
      type: str | None
      description: Display name of the request owner.
      default: null
  steps:
    - ref: build_payload
      action: core.transform.reshape
      args:
        value:
          actionName: ${{ inputs.action_name }}
          note: ${{ inputs.note }}
          source: ${{ inputs.source }}
          user: ${{ inputs.user }}
    - ref: execute_custom_action
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/jsm/ops/api/v1/alerts/${{ inputs.alert_id }}/action
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.execute_custom_action.result.data }}
