type: action
definition:
  title: Update alert message
  description: Update the message of an alert to keep it accurate and current.
  display_group: Jira Service Management
  doc_url: https://developer.atlassian.com/cloud/jira/service-desk-ops/rest/v2/api-group-alerts/#api-rest-v1-alerts-id-message-patch
  namespace: tools.jira_service_management
  name: update_alert_message
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
  expects:
    base_url:
      type: str | None
      description: >-
        Atlassian API URL for the Jira site
        (e.g. https://api.atlassian.com/ex/jira/{cloudId}).
      default: null
    alert_id:
      type: str
      description: Identifier of the alert.
    message:
      type: str
      description: New alert message (max 130 characters).
  steps:
    - ref: update_alert_message
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/jsm/ops/api/v1/alerts/${{ inputs.alert_id }}/message
        method: PATCH
        headers:
          Authorization: Bearer ${{ SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN }}
        payload:
          message: ${{ inputs.message }}
  returns: ${{ steps.update_alert_message.result.data }}
