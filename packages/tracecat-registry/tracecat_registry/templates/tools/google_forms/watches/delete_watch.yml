type: action
definition:
  title: Delete watch
  description: Delete a watch.
  display_group: Google Forms
  doc_url: https://developers.google.com/workspace/forms/api/reference/rest/v1/forms.watches/delete
  namespace: tools.google_forms
  name: delete_watch
  secrets:
    - type: oauth
      provider_id: google_forms
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_forms
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    form_id:
      type: str
      description: Required. The ID of the Form.
    watch_id:
      type: str
      description: Required. The ID of the Watch to delete.
  steps:
    - ref: delete_watch
      action: tools.google_api.call_api
      args:
        service_name: forms
        version: v1
        resource: forms.watches
        method_name: delete
        access_token: ${{ SECRETS.google_forms_oauth.GOOGLE_FORMS_USER_TOKEN || SECRETS.google_forms_oauth.GOOGLE_FORMS_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/forms.body.readonly"]
        params:
          formId: ${{ inputs.form_id }}
          watchId: ${{ inputs.watch_id }}
  returns: ${{ steps.delete_watch.result }}
