type: action
definition:
  title: List watches
  description: >-
    Return a list of the watches owned by the invoking project. The maximum number of
    watches is two: for each invoker, the limit is one for each event type per form.
  display_group: Google Forms
  doc_url: https://developers.google.com/workspace/forms/api/reference/rest/v1/forms.watches/list
  namespace: tools.google_forms
  name: list_watches
  secrets:
    - type: oauth
      provider_id: google_forms
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_forms
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    form_id:
      type: str
      description: Required. ID of the Form whose watches to list.
  steps:
    - ref: list_watches
      action: tools.google_api.call_api
      args:
        service_name: forms
        version: v1
        resource: forms.watches
        method_name: list
        access_token: ${{ SECRETS.google_forms_oauth.GOOGLE_FORMS_USER_TOKEN || SECRETS.google_forms_oauth.GOOGLE_FORMS_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/forms.body.readonly"]
        params:
          formId: ${{ inputs.form_id }}
  returns: ${{ steps.list_watches.result }}
