type: action
definition:
  title: Batch update form
  description: Change the form with a batch of updates.
  display_group: Google Forms
  doc_url: https://developers.google.com/workspace/forms/api/reference/rest/v1/forms/batchUpdate
  namespace: tools.google_forms
  name: batch_update_form
  secrets:
    - type: oauth
      provider_id: google_forms
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_forms
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    form_id:
      type: str
      description: Required. The form ID.
    requests:
      # Generic: the vendor documents each Request as a union where exactly one field
      # is required, so there is no single field set to name.
      type: list[dict[str, Any]]
      description: >-
        The update requests of this batch. Each Request sets exactly one of the union
        fields documented at
        https://developers.google.com/workspace/forms/api/reference/rest/v1/forms/batchUpdate#Request
        (updateFormInfo, updateSettings, createItem, moveItem, deleteItem, updateItem).
    include_form_in_response:
      type: bool | None
      description: Whether to return an updated version of the model in the response.
      default: null
    write_control:
      # Generic: the vendor documents WriteControl as a free-form object whose fields are
      # mutually exclusive revision selectors.
      type: dict[str, Any] | None
      description: >-
        Provides control over how write requests are executed. Documented fields:
        requiredRevisionId, targetRevisionId.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          form_id: ${{ inputs.form_id }}
          requests: ${{ inputs.requests }}
          include_form_in_response: ${{ inputs.include_form_in_response }}
          write_control: ${{ inputs.write_control }}
        script: |
          def main(form_id, requests, include_form_in_response, write_control):
              # Values inside `body` are not pruned, and Forms rejects a null on these
              # optional body fields.
              body = {"requests": requests}
              if include_form_in_response is not None:
                  body["includeFormInResponse"] = include_form_in_response
              if write_control is not None:
                  body["writeControl"] = write_control
              return {"formId": form_id, "body": body}
    - ref: batch_update_form
      action: tools.google_api.call_api
      args:
        service_name: forms
        version: v1
        resource: forms
        method_name: batchUpdate
        access_token: ${{ SECRETS.google_forms_oauth.GOOGLE_FORMS_USER_TOKEN || SECRETS.google_forms_oauth.GOOGLE_FORMS_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/forms.body"]
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.batch_update_form.result }}
