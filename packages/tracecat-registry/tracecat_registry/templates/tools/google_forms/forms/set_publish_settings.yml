type: action
definition:
  title: Set publish settings
  description: Updates the publish settings of a form.
  display_group: Google Forms
  doc_url: https://developers.google.com/workspace/forms/api/reference/rest/v1/forms/setPublishSettings
  namespace: tools.google_forms
  name: set_publish_settings
  secrets:
    - type: oauth
      provider_id: google_forms
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_forms
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    form_id:
      type: str
      description: >-
        Required. The ID of the form. You can get the id from `Form.form_id` field.
    is_published:
      type: bool
      description: Required. Whether the form is published and visible to others.
    is_accepting_responses:
      type: bool
      description: >-
        Required. Whether the form accepts responses. If `is_published` is set to
        `false`, this field is forced to `false`.
    update_mask:
      type: str | None
      description: >-
        Optional. The `publishSettings` fields to update. This field mask accepts the
        following values: `publishState` updates or replaces all `publishState`
        settings; `*` updates or replaces all `publishSettings` fields.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          form_id: ${{ inputs.form_id }}
          is_published: ${{ inputs.is_published }}
          is_accepting_responses: ${{ inputs.is_accepting_responses }}
          update_mask: ${{ inputs.update_mask }}
        script: |
          def main(form_id, is_published, is_accepting_responses, update_mask):
              # Values inside `body` are not pruned, and Forms rejects a null updateMask.
              body = {
                  "publishSettings": {
                      "publishState": {
                          "isPublished": is_published,
                          "isAcceptingResponses": is_accepting_responses,
                      }
                  }
              }
              if update_mask is not None:
                  body["updateMask"] = update_mask
              return {"formId": form_id, "body": body}
    - ref: set_publish_settings
      action: tools.google_api.call_api
      args:
        service_name: forms
        version: v1
        resource: forms
        method_name: setPublishSettings
        access_token: ${{ SECRETS.google_forms_oauth.GOOGLE_FORMS_USER_TOKEN || SECRETS.google_forms_oauth.GOOGLE_FORMS_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/forms.body"]
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.set_publish_settings.result }}
