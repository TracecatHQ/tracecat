type: action
definition:
  title: Create form
  description: Create a new form using the title given in the provided form message in the request.
  display_group: Google Forms
  doc_url: https://developers.google.com/workspace/forms/api/reference/rest/v1/forms/create
  namespace: tools.google_forms
  name: create_form
  secrets:
    - type: oauth
      provider_id: google_forms
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_forms
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    body:
      # Generic: the vendor documents a free-form Form resource as the request body.
      type: dict[str, Any]
      description: >-
        The Form resource to create, documented at
        https://developers.google.com/workspace/forms/api/reference/rest/v1/forms.
        Only `info.title` and `info.documentTitle` are settable on create; the form
        description, items and settings are disallowed here and must be added with a
        subsequent batchUpdate call.
    unpublished:
      type: bool | None
      description: >-
        Whether the form is unpublished. If set to `true`, the form doesn't accept
        responses. If set to `false` or unset, the form is published and accepts
        responses.
      default: null
  steps:
    - ref: create_form
      action: tools.google_api.call_api
      args:
        service_name: forms
        version: v1
        resource: forms
        method_name: create
        access_token: ${{ SECRETS.google_forms_oauth.GOOGLE_FORMS_USER_TOKEN || SECRETS.google_forms_oauth.GOOGLE_FORMS_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/forms.body"]
        params:
          body: ${{ inputs.body }}
          unpublished: ${{ inputs.unpublished }}
  returns: ${{ steps.create_form.result }}
