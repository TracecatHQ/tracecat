type: action
definition:
  title: Get response
  description: Get one response from the form.
  display_group: Google Forms
  doc_url: https://developers.google.com/workspace/forms/api/reference/rest/v1/forms.responses/get
  namespace: tools.google_forms
  name: get_response
  secrets:
    - type: oauth
      provider_id: google_forms
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_forms
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    form_id:
      type: str
      description: Required. The form ID.
    response_id:
      type: str
      description: Required. The response ID within the form.
  steps:
    - ref: get_response
      action: tools.google_api.call_api
      args:
        service_name: forms
        version: v1
        resource: forms.responses
        method_name: get
        access_token: ${{ SECRETS.google_forms_oauth.GOOGLE_FORMS_USER_TOKEN || SECRETS.google_forms_oauth.GOOGLE_FORMS_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/forms.responses.readonly"]
        params:
          formId: ${{ inputs.form_id }}
          responseId: ${{ inputs.response_id }}
  returns: ${{ steps.get_response.result }}
