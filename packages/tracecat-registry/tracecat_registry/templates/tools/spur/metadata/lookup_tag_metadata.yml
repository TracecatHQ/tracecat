type: action
definition:
  title: Lookup tag metadata
  description: >-
    Retrieve the Spur Tag Metadata Object (summary, metrics and attributes) for a service tag such
    as OXYLABS_PROXY or PROTON_VPN. Calls GET /v2/metadata/tags/{tag} directly.
  display_group: Spur (Context API)
  doc_url: https://docs.spur.us/context-api/endpoints#lookup-tag-metadata
  namespace: tools.spur
  name: lookup_tag_metadata
  secrets:
    - name: spur
      keys: ["SPUR_TOKEN"]
  expects:
    tag:
      type: str
      description: >-
        Service tag to look up, e.g. a tunnel operator or proxy tag returned in an IP Context
        Object (OXYLABS_PROXY, PROTON_VPN).
    base_url:
      type: str | None
      description: Spur API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.spur.base_url || "https://api.spur.us" }}/v2/metadata/tags/${{ FN.url_encode(inputs.tag) }}
        method: GET
        headers:
          Token: ${{ SECRETS.spur.SPUR_TOKEN }}
          Accept: application/json
  returns: ${{ steps.request.result }}
