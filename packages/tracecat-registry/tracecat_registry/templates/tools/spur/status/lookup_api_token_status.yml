type: action
definition:
  title: Lookup API token status
  description: >-
    Retrieve the Spur API token's status, the number of queries it can still make, and the
    service tier. Does not use a query. Calls GET /status directly.
  display_group: Spur (Context API)
  doc_url: https://docs.spur.us/context-api/endpoints#lookup-api-token-status
  namespace: tools.spur
  name: lookup_api_token_status
  secrets:
    - name: spur
      keys: ["SPUR_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Spur API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.spur.base_url || "https://api.spur.us" }}/status
        method: GET
        headers:
          Token: ${{ SECRETS.spur.SPUR_TOKEN }}
          Accept: application/json
  returns: ${{ steps.request.result }}
