type: action
definition:
  title: List entitlements
  description: >-
    List entitlements. Calls GET /entitlements/ directly. Reports which API entitlements the
    company has, so a workflow can branch before calling an entitlement-gated action. Required
    scope: entitlements.read.
  display_group: Rippling
  doc_url: https://developer.rippling.com/documentation/rest-api/reference/list-entitlements
  namespace: tools.rippling
  name: list_entitlements
  secrets:
    - name: rippling
      keys: ["RIPPLING_API_KEY"]
  expects: {}
  steps:
    - ref: request
      action: core.http_request
      args:
        url: https://rest.ripplingapis.com/entitlements/
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.rippling.RIPPLING_API_KEY }}
          Accept: application/json
          Rippling-Api-Version: '2024-08-01'
  returns: ${{ steps.request.result }}
