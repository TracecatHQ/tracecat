type: action
definition:
  title: Get SSO me
  description: >-
    Get SSO me. Calls GET /sso-me/ directly. Returns a single object, not a paginated
    collection, despite Rippling naming the endpoint list-sso-me. Cheapest call for verifying
    that the configured API token is valid: a 401 means the token is revoked or expired and a
    403 means a scope is missing. Required scope: sso-me.read.
  display_group: Rippling
  doc_url: https://developer.rippling.com/documentation/rest-api/reference/list-sso-me
  namespace: tools.rippling
  name: get_sso_me
  secrets:
    - name: rippling
      keys: ["RIPPLING_API_KEY"]
  expects:
    expand:
      type: str | None
      description: >-
        Fields in a response can represent objects themselves. Instead of making an additional API
        call, you can expand field(s) in a response using the `expand` query parameter. Use commas
        to specify multiple fields to expand. Use dot notation (.) to recursively expand. The API
        supports two levels of expansion and up to ten expanded fields per request. Expandable
        fields: `company`.
      default: null
    cursor:
      type: str | None
      description: >-
        `cursor` is used to fetch the next page of results. Start with a request without cursor,
        read the `next_link` value from the response, and continue until `next_link` is `null`.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Rippling REST API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rippling.base_url || "https://rest.ripplingapis.com" }}/sso-me/
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.rippling.RIPPLING_API_KEY }}
          Accept: application/json
          Rippling-Api-Version: '2024-08-01'
        params:
          expand: ${{ inputs.expand }}
          cursor: ${{ inputs.cursor }}
  returns: ${{ steps.request.result }}
