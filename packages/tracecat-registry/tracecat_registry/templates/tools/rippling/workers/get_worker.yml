type: action
definition:
  title: Get worker
  description: >-
    Get worker. Calls GET /workers/{id}/ directly. Fetches a single worker by Rippling worker id,
    for when you already have that id from list_workers or an upstream event. Required scope:
    workers.read.
  display_group: Rippling
  doc_url: https://developer.rippling.com/documentation/rest-api/reference/get-workers
  namespace: tools.rippling
  name: get_worker
  secrets:
    - name: rippling
      keys: ["RIPPLING_API_KEY"]
  expects:
    id:
      type: str
      description: Rippling API path value for id.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Rippling REST API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rippling.base_url || "https://rest.ripplingapis.com" }}/workers/${{ FN.url_encode(inputs.id) }}/
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.rippling.RIPPLING_API_KEY }}
          Accept: application/json
          Rippling-Api-Version: '2024-08-01'
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
