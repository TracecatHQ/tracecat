type: action
definition:
  title: Update leave request
  description: >-
    Update leave request. Calls PATCH /leave-requests/{id}/ directly. Set status in the request
    body to approve, reject, or cancel a request. Required scope: leave-requests.read-write.
  display_group: Rippling
  doc_url: https://developer.rippling.com/documentation/rest-api/reference/update-leave-requests
  namespace: tools.rippling
  name: update_leave_request
  secrets:
    - name: rippling
      keys: ["RIPPLING_API_KEY"]
  expects:
    id:
      type: str
      description: Rippling API path value for id.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    payload:
      type: dict[str, Any] | None
      description: API-native request body passed through without validation.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Rippling REST API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rippling.base_url || "https://rest.ripplingapis.com" }}/leave-requests/${{ FN.url_encode(inputs.id) }}/
        method: PATCH
        headers:
          Authorization: Bearer ${{ SECRETS.rippling.RIPPLING_API_KEY }}
          Accept: application/json
          Rippling-Api-Version: '2024-08-01'
        params: ${{ inputs.params }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
