type: action
definition:
  title: Create draft hires
  description: >-
    Create draft hires. Calls POST /draft-hires/ directly. Bulk onboarding entry point. The
    request body takes a draft_hires array. Required scope: draft-hires.read-write.
  display_group: Rippling
  doc_url: https://developer.rippling.com/documentation/rest-api/reference/create-draft-hires
  namespace: tools.rippling
  name: create_draft_hires
  secrets:
    - name: rippling
      keys: ["RIPPLING_API_KEY"]
  expects:
    draft_hires:
      # Documented object shape; the `expects` grammar has no nested-object type,
      # so the vendor's sub-keys are named in the description instead.
      type: list[dict[str, Any]]
      description: >-
        List of draft hires. Each draft hire requires `personal_info`, `employment_info`, and
        `work_location_info`, and optionally accepts `custom_fields`, `headcount_info`, and
        `documents`.
    base_url:
      type: str | None
      description: Base URL of the Rippling REST API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rippling.base_url || "https://rest.ripplingapis.com" }}/draft-hires/
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.rippling.RIPPLING_API_KEY }}
          Accept: application/json
          Rippling-Api-Version: '2024-08-01'
        payload:
          draft_hires: ${{ inputs.draft_hires }}
  returns: ${{ steps.request.result }}
