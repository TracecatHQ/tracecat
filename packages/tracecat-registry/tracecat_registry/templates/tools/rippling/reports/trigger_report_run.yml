type: action
definition:
  title: Trigger report run
  description: >-
    Trigger report run. Calls POST /report-runs/ directly. Starts an asynchronous run of a saved
    Rippling report. Poll get_report_run with the returned run id to collect results. Requires
    the Reports API entitlement. Required scope: report-runs.read-write.
  display_group: Rippling
  doc_url: https://developer.rippling.com/documentation/rest-api/reference/trigger-report-runs
  namespace: tools.rippling
  name: trigger_report_run
  secrets:
    - name: rippling
      keys: ["RIPPLING_API_KEY"]
  expects:
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    payload:
      type: dict[str, Any] | None
      description: API-native request body passed through without validation.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Rippling REST API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rippling.base_url || "https://rest.ripplingapis.com" }}/report-runs/
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.rippling.RIPPLING_API_KEY }}
          Accept: application/json
          Rippling-Api-Version: '2024-08-01'
        params: ${{ inputs.params }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
