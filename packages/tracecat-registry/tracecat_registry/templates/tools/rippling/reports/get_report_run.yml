type: action
definition:
  title: Get report run
  description: >-
    Get report run. Calls GET /report-runs/{run_id}/ directly. Retrieves the status and, once
    complete, the output of a report run started by trigger_report_run. Requires the Reports API
    entitlement. Required scope: report-runs.read.
  display_group: Rippling
  doc_url: https://developer.rippling.com/documentation/rest-api/reference/get-report-runs
  namespace: tools.rippling
  name: get_report_run
  secrets:
    - name: rippling
      keys: ["RIPPLING_API_KEY"]
  expects:
    run_id:
      type: str
      description: Rippling API path value for run_id.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Rippling REST API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rippling.base_url || "https://rest.ripplingapis.com" }}/report-runs/${{ FN.url_encode(inputs.run_id) }}/
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.rippling.RIPPLING_API_KEY }}
          Accept: application/json
          Rippling-Api-Version: '2024-08-01'
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
