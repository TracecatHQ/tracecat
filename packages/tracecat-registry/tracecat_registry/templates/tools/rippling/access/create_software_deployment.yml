type: action
definition:
  title: Create software deployment
  description: >-
    Create software deployment. Calls POST /software-deployments/ directly. Deploys a SaaS app
    to a group or device group. Required scope: software-deployments.read-write.
  display_group: Rippling
  doc_url: https://developer.rippling.com/documentation/rest-api/reference/create-software-deployments
  namespace: tools.rippling
  name: create_software_deployment
  secrets:
    - name: rippling
      keys: ["RIPPLING_API_KEY"]
  expects:
    payload:
      # Generic: this endpoint rejects an explicit null on optional body fields,
      # and a literal payload map cannot omit an unset optional.
      type: dict[str, Any] | None
      description: >-
        API-native request body. Documented fields: software_id (required), active_group_type, group_id, ma_device_group_id.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Rippling REST API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rippling.base_url || "https://rest.ripplingapis.com" }}/software-deployments/
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.rippling.RIPPLING_API_KEY }}
          Accept: application/json
          Rippling-Api-Version: '2024-08-01'
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
