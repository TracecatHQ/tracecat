type: action
definition:
  title: List triage contexts
  description: Lookup all available risk contexts. Calls GET /soar/v3/triage/contexts directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/soar-get-contexts
  namespace: tools.recorded_future
  name: list_triage_contexts
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/soar/v3/triage/contexts
        method: GET
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
  returns: ${{ steps.request.result }}
