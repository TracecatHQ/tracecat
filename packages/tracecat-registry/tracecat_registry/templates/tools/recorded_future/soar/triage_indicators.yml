type: action
definition:
  title: Triage indicators
  description: Triage multiple IOC entities for a specific context with up to 1000 IOCs per request. Calls POST /soar/v3/triage/contexts/{context_name} directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/soar-triage-batch
  namespace: tools.recorded_future
  name: triage_indicators
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    context_name:
      type: str
      description: The context in which to evaluate the given entities. Available contexts can be fetched using the separate endpoint.
    ip:
      type: list[str] | None
      description: IP addresses to enrich.
      default: null
    domain:
      type: list[str] | None
      description: Domains to enrich.
      default: null
    url:
      type: list[str] | None
      description: URLs to enrich.
      default: null
    hash:
      type: list[str] | None
      description: Hashes to enrich.
      default: null
    vulnerability:
      type: list[str] | None
      description: Vulnerabilities to enrich.
      default: null
    companybydomain:
      type: list[str] | None
      description: Company domains to enrich.
      default: null
    threshold:
      type: int | None
      description: Determines which risk score should be used to deem an entity risky. Each context has its own default value and depends on the context. Allowed values are 0 to 99.
      default: null
    threshold_type:
      type: str | None
      description: Determines if the set of entities are deemed risky if a single entity is above the threshold (max) or if all entities have to be above the threshold (min). The default is specified by the context but is max for all contexts currently defined.
      default: null
    format:
      type: str | None
      description: Allows for an output format suitable for Splunk SOAR (previously Phantom) when set to phantom. If no value is given, the default format (used in the Enrichment endpoint) will be used.
      default: null
    metadata:
      type: bool | None
      description: Annotates the response with additional metadata explaining the response data elements.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/soar/v3/triage/contexts/${{ FN.url_encode(inputs.context_name) }}
        method: POST
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
          Content-Type: application/json
        params:
          threshold: ${{ inputs.threshold }}
          threshold_type: ${{ inputs.threshold_type }}
          format: ${{ inputs.format }}
          metadata: ${{ inputs.metadata }}
        payload:
          ip: ${{ inputs.ip }}
          domain: ${{ inputs.domain }}
          url: ${{ inputs.url }}
          hash: ${{ inputs.hash }}
          vulnerability: ${{ inputs.vulnerability }}
          companybydomain: ${{ inputs.companybydomain }}
  returns: ${{ steps.request.result }}
