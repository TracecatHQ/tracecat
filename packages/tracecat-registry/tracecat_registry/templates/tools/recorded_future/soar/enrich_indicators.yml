type: action
definition:
  title: Enrich indicators
  description: Returns risk score and risk rules for the submitted indicators. Handles both individual and batch lookups up to 1000 IOCs per request. Calls POST /soar/v3/enrichment directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/soar-enrich
  namespace: tools.recorded_future
  name: enrich_indicators
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    ip:
      type: list[str] | None
      description: IP addresses to enrich.
      default: null
    domain:
      type: list[str] | None
      description: Domains to enrich.
      default: null
    url:
      type: list[str] | None
      description: URLs to enrich.
      default: null
    hash:
      type: list[str] | None
      description: Hashes to enrich.
      default: null
    vulnerability:
      type: list[str] | None
      description: Vulnerabilities to enrich.
      default: null
    companybydomain:
      type: list[str] | None
      description: Company domains to enrich.
      default: null
    metadata:
      type: bool | None
      description: Annotates the response with additional metadata explaining the response data elements.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/soar/v3/enrichment
        method: POST
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
          Content-Type: application/json
        params:
          metadata: ${{ inputs.metadata }}
        payload:
          ip: ${{ inputs.ip }}
          domain: ${{ inputs.domain }}
          url: ${{ inputs.url }}
          hash: ${{ inputs.hash }}
          vulnerability: ${{ inputs.vulnerability }}
          companybydomain: ${{ inputs.companybydomain }}
  returns: ${{ steps.request.result }}
