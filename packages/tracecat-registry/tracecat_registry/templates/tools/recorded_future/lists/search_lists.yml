type: action
definition:
  title: Search lists
  description: Find lists based on a query. Calls POST /list/search directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/lists-search
  namespace: tools.recorded_future
  name: search_lists
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    name:
      type: str | None
      description: Search string to match against list names.
      default: null
    type:
      type: str | None
      description: Type of list to search for. Allowed values are entity, source, text, custom, ip, domain, tech_stack, industry, brand, partner, industry_peer, location, supplier, vulnerability, company, hash, operation, attacker, target, method and executive. Recorded Future defaults to entity.
      default: null
    limit:
      type: int | None
      description: Maximum number of lists to return. The maximum is 100 and Recorded Future defaults to 25.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/list/search
        method: POST
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
          Content-Type: application/json
        payload:
          name: ${{ inputs.name }}
          type: ${{ inputs.type }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.request.result }}
