type: action
definition:
  title: List alert hits
  description: Returns only a flat array of all hits (the Intelligence Cloud data that caused the alert to trigger) for one or several alerts. Calls GET /alert/v3/hits directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/alerts-get-hits
  namespace: tools.recorded_future
  name: list_alert_hits
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    ids:
      type: str
      description: Alert ids separated by comma.
    taggedText:
      type: bool | None
      description: Include text tags.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/alert/v3/hits
        method: GET
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
        params:
          ids: ${{ inputs.ids }}
          taggedText: ${{ inputs.taggedText }}
  returns: ${{ steps.request.result }}
