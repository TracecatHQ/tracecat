type: action
definition:
  title: Search alert rules
  description: Search for alert rules based on a set of filters. Calls GET /alert/v2/rule directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/alerts-search-rules
  namespace: tools.recorded_future
  name: search_alert_rules
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    freetext:
      type: str | None
      description: Filter by any text.
      default: null
    limit:
      type: int | None
      description: Maximum number of items to include. The maximum is 1000 and Recorded Future defaults to 10.
      default: null
    taggedText:
      type: bool | None
      description: Include text tags.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/alert/v2/rule
        method: GET
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
        params:
          freetext: ${{ inputs.freetext }}
          limit: ${{ inputs.limit }}
          taggedText: ${{ inputs.taggedText }}
  returns: ${{ steps.request.result }}
