type: action
definition:
  title: Search analyst notes
  description: Search for published analyst notes, either from within the enterprise or from Insikt Group. Calls POST /analyst-note/search directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/analyst-note-search
  namespace: tools.recorded_future
  name: search_analyst_notes
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    published:
      type: str | None
      description: Notes published after this date, absolute like 2024-01-01 or relative like -3d.
      default: null
    entity:
      type: str | None
      description: Entity id.
      default: null
    topic:
      type: str | None
      description: Topic entity id, see https://docs.recordedfuture.com/reference/analyst-note-available-topics for available ones.
      default: null
    title:
      type: str | None
      description: Search string to match against note titles.
      default: null
    label:
      type: str | None
      description: Search string to match against note labels.
      default: null
    source:
      type: str | None
      description: Entity id for note source.
      default: null
    tagged_text:
      type: bool | None
      description: Determines if the <entity></entity> tags should be inline with entities in the note title and text.
      default: null
    tagged_text_format:
      type: str | None
      description: Output format for inline tags when tagged_text is true. Allowed values are html and markdown. Recorded Future defaults to html.
      default: null
    escape_html:
      type: bool | None
      description: Determines if HTML tags are escaped, applied only when tagged_text is true and tagged_text_format is html.
      default: null
    serialization:
      type: str | None
      description: Entity serialization level. When set to id, only the entity id will be included. Setting it to min leads to the id and name being included and setting it to full means that each entity will have the id, name, type, isThreatActor flag and possibly a description included in the response. Allowed values are id, min and full.
      default: null
    limit:
      type: int | None
      description: Maximum number of references from which notes are fetched, at most 1000. Recorded Future defaults to 10.
      default: null
    from:
      type: str | None
      description: Offset the result based on next_offset from a previous search response.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/analyst-note/search
        method: POST
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
          Content-Type: application/json
        payload:
          published: ${{ inputs.published }}
          entity: ${{ inputs.entity }}
          topic: ${{ inputs.topic }}
          title: ${{ inputs.title }}
          label: ${{ inputs.label }}
          source: ${{ inputs.source }}
          tagged_text: ${{ inputs.tagged_text }}
          tagged_text_format: ${{ inputs.tagged_text_format }}
          escape_html: ${{ inputs.escape_html }}
          serialization: ${{ inputs.serialization }}
          limit: ${{ inputs.limit }}
          from: ${{ inputs.from }}
  returns: ${{ steps.request.result }}
