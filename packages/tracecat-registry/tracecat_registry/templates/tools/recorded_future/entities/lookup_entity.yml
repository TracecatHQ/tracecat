type: action
definition:
  title: Lookup entity
  description: Lookup entity by its ID. Calls GET /entity-match/entity/{id} directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/entity-lookup
  namespace: tools.recorded_future
  name: lookup_entity
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    id:
      type: str
      description: Entity ID.
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/entity-match/entity/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
  returns: ${{ steps.request.result }}
