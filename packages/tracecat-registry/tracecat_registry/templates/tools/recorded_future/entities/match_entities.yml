type: action
definition:
  title: Match entities
  description: Match entities by name and (optionally) type. Calls POST /entity-match/match directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/entity-match
  namespace: tools.recorded_future
  name: match_entities
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    name:
      type: str
      description: Entity name to match for.
    type:
      type: list[str] | None
      description: Entity types to match for.
      default: null
    limit:
      type: int | None
      description: Number of entities to include in the response. The maximum is 100 and Recorded Future defaults to 10.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/entity-match/match
        method: POST
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
          Content-Type: application/json
        payload:
          name: ${{ inputs.name }}
          type: ${{ inputs.type }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.request.result }}
