type: action
definition:
  title: Get playbook alert
  description: Returns a Playbook Alert representation containing only properties shared between all alert types. Calls GET /playbook-alert/common/{playbook_alert_id} directly.
  display_group: Recorded Future
  doc_url: https://docs.recordedfuture.com/reference/playbook-alerts-preview
  namespace: tools.recorded_future
  name: get_playbook_alert
  secrets:
    - name: recorded_future
      keys: ["RECORDED_FUTURE_API_KEY"]
  expects:
    playbook_alert_id:
      type: str
      description: The unique id of a specific Playbook Alert.
    base_url:
      type: str | None
      description: Base URL of the Recorded Future API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.recorded_future.base_url || "https://api.recordedfuture.com" }}/playbook-alert/common/${{ FN.url_encode(inputs.playbook_alert_id) }}
        method: GET
        headers:
          Accept: application/json
          X-RFToken: ${{ SECRETS.recorded_future.RECORDED_FUTURE_API_KEY }}
  returns: ${{ steps.request.result }}
