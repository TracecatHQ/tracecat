type: action
definition:
  title: Add work item comment
  description: "Add a comment to a work item."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/wit/comments/add?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: add_work_item_comment
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    work_item_id:
      type: int
      description: "Work item ID."
    text:
      type: str
      description: "Comment text (HTML supported)."
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          fields:
            text: ${{ inputs.text }}
        script: |
          def main(fields):
              return {k: v for k, v in fields.items() if v is not None}
    - ref: add_work_item_comment
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/wit/workItems/${{ FN.url_encode(inputs.work_item_id) }}/comments
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
          Content-Type: application/json
        params:
          api-version: "7.2-preview.4"
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.add_work_item_comment.result }}
