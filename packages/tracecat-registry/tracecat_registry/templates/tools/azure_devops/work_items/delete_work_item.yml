type: action
definition:
  title: Delete work item
  description: "Delete a work item (moves it to the recycle bin unless `destroy` is true)."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/wit/work-items/delete?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: delete_work_item
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    id:
      type: int
      description: "Work item ID."
    destroy:
      type: bool | None
      description: "Permanently delete the work item instead of moving it to the recycle bin."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            destroy: ${{ inputs.destroy }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.3"
              return query
    - ref: delete_work_item
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/wit/workitems/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.delete_work_item.result }}
