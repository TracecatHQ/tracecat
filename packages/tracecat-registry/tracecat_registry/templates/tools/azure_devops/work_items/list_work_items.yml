type: action
definition:
  title: List work items
  description: "Get a batch of work items by IDs (maximum 200)."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/wit/work-items/list?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: list_work_items
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    ids:
      type: str
      description: "Comma-separated list of work item IDs (maximum 200)."
    fields:
      type: str | None
      description: "Comma-separated list of field reference names to return. Cannot be combined with `expand`."
      default: null
    as_of:
      type: str | None
      description: "Return the work items as of this UTC date time (ISO 8601)."
      default: null
    expand:
      type: str | None
      description: "Expand parameters for work item attributes. One of `none`, `relations`, `fields`, `links`, `all`."
      default: null
    error_policy:
      type: str | None
      description: "Behavior when a work item is not found. One of `fail`, `omit`."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            ids: ${{ inputs.ids }}
            fields: ${{ inputs.fields }}
            asOf: ${{ inputs.as_of }}
            $expand: ${{ inputs.expand }}
            errorPolicy: ${{ inputs.error_policy }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.3"
              return query
    - ref: list_work_items
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/wit/workitems
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_work_items.result }}
