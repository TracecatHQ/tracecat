type: action
definition:
  title: Create pull request
  description: "Create a pull request in a repository."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/git/pull-requests/create?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: create_pull_request
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    repository_id:
      type: str
      description: "Repository ID or name."
    source_ref_name:
      type: str
      description: "Source branch ref, e.g. `refs/heads/feature`."
    target_ref_name:
      type: str
      description: "Target branch ref, e.g. `refs/heads/main`."
    title:
      type: str
      description: "Pull request title."
    description:
      type: str | None
      description: "Pull request description (Markdown)."
      default: null
    is_draft:
      type: bool | None
      description: "Create the pull request as a draft."
      default: null
    reviewers:
      type: list[dict[str, Any]] | None
      description: "Reviewers to add, each as `{\"id\": \"<identity id>\"}`."
      default: null
    labels:
      type: list[dict[str, Any]] | None
      description: "Labels (tags) to apply, each as `{\"name\": \"<label>\"}`."
      default: null
    supports_iterations:
      type: bool | None
      description: "Track pushes to the source branch as iterations."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            supportsIterations: ${{ inputs.supports_iterations }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.2"
              return query
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          fields:
            sourceRefName: ${{ inputs.source_ref_name }}
            targetRefName: ${{ inputs.target_ref_name }}
            title: ${{ inputs.title }}
            description: ${{ inputs.description }}
            isDraft: ${{ inputs.is_draft }}
            reviewers: ${{ inputs.reviewers }}
            labels: ${{ inputs.labels }}
        script: |
          def main(fields):
              return {k: v for k, v in fields.items() if v is not None}
    - ref: create_pull_request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/git/repositories/${{ FN.url_encode(inputs.repository_id) }}/pullrequests
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
          Content-Type: application/json
        params: ${{ steps.build_params.result }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.create_pull_request.result }}
