type: action
definition:
  title: List refs
  description: "List branches and tags in a repository. Returns one page; pass `continuation_token` to fetch the next page."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/git/refs/list?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: list_refs
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    repository_id:
      type: str
      description: "Repository ID or name."
    filter:
      type: str | None
      description: "Prefix filter, e.g. `heads/` for branches or `tags/` for tags."
      default: null
    filter_contains:
      type: str | None
      description: "Return refs whose name contains this value."
      default: null
    include_statuses:
      type: bool | None
      description: "Include up to the first 1000 commit statuses for each ref."
      default: null
    include_my_branches:
      type: bool | None
      description: "Include only branches the user owns, favorites, or most recently pushed to."
      default: null
    latest_statuses_only:
      type: bool | None
      description: "Include only the tip commit status for each ref."
      default: null
    peel_tags:
      type: bool | None
      description: "Populate `peeledObjectId` for annotated tags."
      default: null
    top:
      type: int | None
      description: "Maximum number of refs to return."
      default: null
    continuation_token:
      type: str | None
      description: "Continuation token from the previous page."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            filter: ${{ inputs.filter }}
            filterContains: ${{ inputs.filter_contains }}
            includeStatuses: ${{ inputs.include_statuses }}
            includeMyBranches: ${{ inputs.include_my_branches }}
            latestStatusesOnly: ${{ inputs.latest_statuses_only }}
            peelTags: ${{ inputs.peel_tags }}
            $top: ${{ inputs.top }}
            continuationToken: ${{ inputs.continuation_token }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.2"
              return query
    - ref: list_refs
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/git/repositories/${{ FN.url_encode(inputs.repository_id) }}/refs
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_refs.result }}
