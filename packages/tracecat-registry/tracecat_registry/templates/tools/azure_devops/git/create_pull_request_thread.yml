type: action
definition:
  title: Create pull request comment thread
  description: "Create a comment thread on a pull request."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/git/pull-request-threads/create?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: create_pull_request_thread
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    repository_id:
      type: str
      description: "Repository ID or name."
    pull_request_id:
      type: int
      description: "Pull request ID."
    comments:
      type: list[dict[str, Any]]
      description: "Comments in the thread, each as `{\"content\": \"...\", \"commentType\": \"text\"}`."
    status:
      type: str | None
      description: "Thread status. One of `active`, `fixed`, `wontFix`, `closed`, `byDesign`, `pending`."
      default: null
    thread_context:
      type: dict[str, Any] | None
      description: "File/line context, e.g. `{\"filePath\": \"/src/app.py\", \"rightFileStart\": {\"line\": 1, \"offset\": 1}, \"rightFileEnd\": {\"line\": 1, \"offset\": 1}}`."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          fields:
            comments: ${{ inputs.comments }}
            status: ${{ inputs.status }}
            threadContext: ${{ inputs.thread_context }}
        script: |
          def main(fields):
              return {k: v for k, v in fields.items() if v is not None}
    - ref: create_pull_request_thread
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/git/repositories/${{ FN.url_encode(inputs.repository_id) }}/pullRequests/${{ FN.url_encode(inputs.pull_request_id) }}/threads
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
          Content-Type: application/json
        params:
          api-version: "7.2-preview.1"
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.create_pull_request_thread.result }}
