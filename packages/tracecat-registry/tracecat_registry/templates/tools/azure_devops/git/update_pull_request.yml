type: action
definition:
  title: Update pull request
  description: "Update a pull request, e.g. change its title/description, abandon it, or set auto-complete."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/git/pull-requests/update?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: update_pull_request
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    repository_id:
      type: str
      description: "Repository ID or name."
    pull_request_id:
      type: int
      description: "Pull request ID."
    title:
      type: str | None
      description: "New title."
      default: null
    description:
      type: str | None
      description: "New description."
      default: null
    status:
      type: str | None
      description: "New status. One of `active`, `abandoned`, `completed`."
      default: null
    target_ref_name:
      type: str | None
      description: "New target branch ref."
      default: null
    is_draft:
      type: bool | None
      description: "Set or clear the draft flag."
      default: null
    auto_complete_set_by:
      type: dict[str, Any] | None
      description: "Identity that enables auto-complete, as `{\"id\": \"<identity id>\"}`."
      default: null
    completion_options:
      type: dict[str, Any] | None
      description: "Completion options such as `{\"deleteSourceBranch\": true, \"mergeStrategy\": \"squash\"}`."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          fields:
            title: ${{ inputs.title }}
            description: ${{ inputs.description }}
            status: ${{ inputs.status }}
            targetRefName: ${{ inputs.target_ref_name }}
            isDraft: ${{ inputs.is_draft }}
            autoCompleteSetBy: ${{ inputs.auto_complete_set_by }}
            completionOptions: ${{ inputs.completion_options }}
        script: |
          def main(fields):
              return {k: v for k, v in fields.items() if v is not None}
    - ref: update_pull_request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/git/repositories/${{ FN.url_encode(inputs.repository_id) }}/pullrequests/${{ FN.url_encode(inputs.pull_request_id) }}
        method: PATCH
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
          Content-Type: application/json
        params:
          api-version: "7.2-preview.2"
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.update_pull_request.result }}
