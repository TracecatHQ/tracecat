type: action
definition:
  title: List commits
  description: "List commits in a repository matching optional search criteria."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/git/commits/get-commits?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: list_commits
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    repository_id:
      type: str
      description: "Repository ID or name."
    branch:
      type: str | None
      description: "Branch or tag name to list commits from (e.g. `main`)."
      default: null
    author:
      type: str | None
      description: "Filter by commit author."
      default: null
    user:
      type: str | None
      description: "Filter by commit committer."
      default: null
    from_date:
      type: str | None
      description: "Only commits after this date (ISO 8601)."
      default: null
    to_date:
      type: str | None
      description: "Only commits before this date (ISO 8601)."
      default: null
    from_commit_id:
      type: str | None
      description: "Only commits after this commit ID."
      default: null
    to_commit_id:
      type: str | None
      description: "Only commits up to this commit ID."
      default: null
    item_path:
      type: str | None
      description: "Only commits that changed this path."
      default: null
    include_work_items:
      type: bool | None
      description: "Include linked work items."
      default: null
    include_push_data:
      type: bool | None
      description: "Include push information."
      default: null
    top:
      type: int | None
      description: "Maximum number of commits to return."
      default: null
    skip:
      type: int | None
      description: "Number of commits to skip."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            searchCriteria.itemVersion.version: ${{ inputs.branch }}
            searchCriteria.author: ${{ inputs.author }}
            searchCriteria.user: ${{ inputs.user }}
            searchCriteria.fromDate: ${{ inputs.from_date }}
            searchCriteria.toDate: ${{ inputs.to_date }}
            searchCriteria.fromCommitId: ${{ inputs.from_commit_id }}
            searchCriteria.toCommitId: ${{ inputs.to_commit_id }}
            searchCriteria.itemPath: ${{ inputs.item_path }}
            searchCriteria.includeWorkItems: ${{ inputs.include_work_items }}
            searchCriteria.includePushData: ${{ inputs.include_push_data }}
            searchCriteria.$top: ${{ inputs.top }}
            searchCriteria.$skip: ${{ inputs.skip }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.2"
              return query
    - ref: list_commits
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/git/repositories/${{ FN.url_encode(inputs.repository_id) }}/commits
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_commits.result }}
