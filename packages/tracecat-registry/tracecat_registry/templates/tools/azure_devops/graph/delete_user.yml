type: action
definition:
  title: Delete user
  description: "Disable a user and remove them from all groups in the organization."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/graph/users/delete?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: delete_user
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    user_descriptor:
      type: str
      description: "Graph descriptor of the user."
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://vssps.dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: delete_user
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.graph_base_url || "https://vssps.dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/_apis/graph/users/${{ FN.url_encode(inputs.user_descriptor) }}
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params:
          api-version: "7.2-preview.1"
  returns: ${{ steps.delete_user.result }}
