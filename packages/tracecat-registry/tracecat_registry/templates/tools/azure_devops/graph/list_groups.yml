type: action
definition:
  title: List groups
  description: "List groups in the organization via the Graph API. Returns one page; pass `continuation_token` to fetch the next page."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/graph/groups/list?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: list_groups
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    scope_descriptor:
      type: str | None
      description: "Scope descriptor to limit results to a project."
      default: null
    subject_types:
      type: str | None
      description: "Comma-separated subject types to include (e.g. `vssgp`, `aadgp`)."
      default: null
    continuation_token:
      type: str | None
      description: "Continuation token from the previous page."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://vssps.dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            scopeDescriptor: ${{ inputs.scope_descriptor }}
            subjectTypes: ${{ inputs.subject_types }}
            continuationToken: ${{ inputs.continuation_token }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.1"
              return query
    - ref: list_groups
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.graph_base_url || "https://vssps.dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/_apis/graph/groups
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_groups.result }}
