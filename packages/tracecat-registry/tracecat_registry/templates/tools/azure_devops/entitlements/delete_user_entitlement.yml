type: action
definition:
  title: Delete user entitlement
  description: "Remove a user from the organization, deleting their license and group memberships."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/memberentitlementmanagement/user-entitlements/delete?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: delete_user_entitlement
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    user_id:
      type: str
      description: "User entitlement ID (the user's identity GUID)."
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://vsaex.dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: delete_user_entitlement
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.entitlements_base_url || "https://vsaex.dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/_apis/userentitlements/${{ FN.url_encode(inputs.user_id) }}
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params:
          api-version: "7.2-preview.5"
  returns: ${{ steps.delete_user_entitlement.result }}
