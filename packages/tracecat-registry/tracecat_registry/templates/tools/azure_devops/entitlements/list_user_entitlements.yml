type: action
definition:
  title: List user entitlements
  description: "Search user entitlements (licenses and access levels) in the organization. Returns one page; pass `continuation_token` to fetch the next page."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/memberentitlementmanagement/user-entitlements/search-user-entitlements?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: list_user_entitlements
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    filter:
      type: str | None
      description: "Filter expression, e.g. `name eq 'jane@example.com'` or `licenseId eq 'Account-Stakeholder'`."
      default: null
    order_by:
      type: str | None
      description: "Sort expression, e.g. `name Ascending`."
      default: null
    select:
      type: str | None
      description: "Comma-separated properties to include (e.g. `Projects,Extensions,GroupRules`)."
      default: null
    continuation_token:
      type: str | None
      description: "Continuation token from the previous page."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://vsaex.dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            $filter: ${{ inputs.filter }}
            $orderBy: ${{ inputs.order_by }}
            select: ${{ inputs.select }}
            continuationToken: ${{ inputs.continuation_token }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.5"
              return query
    - ref: list_user_entitlements
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.entitlements_base_url || "https://vsaex.dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/_apis/userentitlements
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_user_entitlements.result }}
