type: action
definition:
  title: List projects
  description: "List projects in an Azure DevOps organization. Returns one page; pass `continuation_token` to fetch the next page."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/core/projects/list?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: list_projects
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    state_filter:
      type: str | None
      description: "Filter on team project state. One of `all`, `createPending`, `deleted`, `deleting`, `new`, `unchanged`, `wellFormed`."
      default: null
    top:
      type: int | None
      description: "Maximum number of projects to return."
      default: null
    skip:
      type: int | None
      description: "Number of projects to skip."
      default: null
    continuation_token:
      type: int | None
      description: "Continuation token (number of projects already fetched) from the previous page."
      default: null
    get_default_team_image_url:
      type: bool | None
      description: "Include the default team image URL."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            stateFilter: ${{ inputs.state_filter }}
            $top: ${{ inputs.top }}
            $skip: ${{ inputs.skip }}
            continuationToken: ${{ inputs.continuation_token }}
            getDefaultTeamImageUrl: ${{ inputs.get_default_team_image_url }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.4"
              return query
    - ref: list_projects
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/_apis/projects
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.list_projects.result }}
