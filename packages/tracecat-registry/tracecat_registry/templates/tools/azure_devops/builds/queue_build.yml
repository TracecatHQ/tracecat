type: action
definition:
  title: Queue build
  description: "Queue a build for a build definition (classic or YAML). Prefer `run_pipeline` for YAML pipelines when template parameters are needed."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/build/builds/queue?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: queue_build
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    definition_id:
      type: int
      description: "Build definition ID."
    source_branch:
      type: str | None
      description: "Branch ref to build (e.g. `refs/heads/main`)."
      default: null
    source_version:
      type: str | None
      description: "Commit SHA to build."
      default: null
    parameters:
      type: str | None
      description: "JSON-encoded string of build variables, e.g. `{\"var1\": \"value\"}`."
      default: null
    reason:
      type: str | None
      description: "Build reason (e.g. `manual`)."
      default: null
    ignore_warnings:
      type: bool | None
      description: "Queue even if the definition has warnings."
      default: null
    check_in_ticket:
      type: str | None
      description: "Check-in ticket for gated builds."
      default: null
    source_build_id:
      type: int | None
      description: "Source build ID."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            ignoreWarnings: ${{ inputs.ignore_warnings }}
            checkInTicket: ${{ inputs.check_in_ticket }}
            sourceBuildId: ${{ inputs.source_build_id }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.8"
              return query
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          fields:
            definition:
              id: ${{ inputs.definition_id }}
            sourceBranch: ${{ inputs.source_branch }}
            sourceVersion: ${{ inputs.source_version }}
            parameters: ${{ inputs.parameters }}
            reason: ${{ inputs.reason }}
        script: |
          def main(fields):
              return {k: v for k, v in fields.items() if v is not None}
    - ref: queue_build
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.base_url || "https://dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/build/builds
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
          Content-Type: application/json
        params: ${{ steps.build_params.result }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.queue_build.result }}
