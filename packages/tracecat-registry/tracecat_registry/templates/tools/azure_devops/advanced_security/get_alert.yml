type: action
definition:
  title: Get Advanced Security alert
  description: "Get a GitHub Advanced Security for Azure DevOps alert by ID."
  display_group: Azure DevOps
  doc_url: https://learn.microsoft.com/en-us/rest/api/azure/devops/advancedsecurity/alerts/get?view=azure-devops-rest-7.2
  namespace: tools.azure_devops
  name: get_alert
  secrets:
    - type: oauth
      provider_id: azure_devops
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: azure_devops
      grant_type: client_credentials
      optional: true
  expects:
    organization:
      type: str
      description: "Azure DevOps organization name."
    project:
      type: str
      description: "Project ID or project name."
    repository_id:
      type: str
      description: "Repository ID or name."
    alert_id:
      type: int
      description: "Alert ID."
    ref:
      type: str | None
      description: "Branch ref the alert is on (e.g. `refs/heads/main`)."
      default: null
    base_url:
      type: str | None
      description: "Azure DevOps base URL. Defaults to `https://advsec.dev.azure.com` (Azure DevOps Services). For Azure DevOps Server, set this to the collection URL."
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          params:
            ref: ${{ inputs.ref }}
        script: |
          def main(params):
              query = {k: v for k, v in params.items() if v is not None}
              query["api-version"] = "7.2-preview.1"
              return query
    - ref: get_alert
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.azure_devops.advanced_security_base_url || "https://advsec.dev.azure.com" }}/${{ FN.url_encode(inputs.organization) }}/${{ FN.url_encode(inputs.project) }}/_apis/alert/repositories/${{ FN.url_encode(inputs.repository_id) }}/alerts/${{ FN.url_encode(inputs.alert_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.azure_devops_oauth.AZURE_DEVOPS_USER_TOKEN || SECRETS.azure_devops_oauth.AZURE_DEVOPS_SERVICE_TOKEN }}
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.get_alert.result }}
