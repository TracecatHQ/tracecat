type: action
definition:
  title: Delete label
  description: >-
    Immediately and permanently deletes the specified label and removes it from any
    messages and threads that it is applied to.
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.labels/delete
  namespace: tools.gmail
  name: delete_label
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    id:
      type: str
      description: The ID of the label to delete.
    user_id:
      type: str
      description: >-
        The user's email address. The special value `me` can be used to indicate the
        authenticated user.
      default: me
  steps:
    - ref: delete_label
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.labels
        method_name: delete
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.labels"]
        params:
          userId: ${{ inputs.user_id }}
          id: ${{ inputs.id }}
  returns: ${{ steps.delete_label.result }}
