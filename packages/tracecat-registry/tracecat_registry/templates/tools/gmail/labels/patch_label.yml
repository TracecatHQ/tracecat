type: action
definition:
  title: Patch label
  description: Patch the specified label.
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.labels/patch
  namespace: tools.gmail
  name: patch_label
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    id:
      type: str
      description: The ID of the label to update.
    body:
      # Generic: the vendor rejects null on optional body fields of the Label
      # resource, and a literal params map cannot omit an unset optional.
      type: dict[str, Any]
      description: >-
        Label resource. See
        https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.labels.
        Fields: name (the display name of the label), labelListVisibility (the
        visibility of the label in the label list in the Gmail web interface: labelShow,
        labelShowIfUnread, labelHide), messageListVisibility (the visibility of messages
        with this label in the message list in the Gmail web interface: show, hide), and
        color (an object with textColor and backgroundColor, settable on user labels
        only).
    user_id:
      type: str
      description: >-
        The user's email address. The special value `me` can be used to indicate the
        authenticated user.
      default: me
  steps:
    - ref: patch_label
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.labels
        method_name: patch
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.labels"]
        params:
          userId: ${{ inputs.user_id }}
          id: ${{ inputs.id }}
          body: ${{ inputs.body }}
  returns: ${{ steps.patch_label.result }}
