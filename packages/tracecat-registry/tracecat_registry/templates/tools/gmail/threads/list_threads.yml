type: action
definition:
  title: List threads
  description: Lists the threads in the user's mailbox.
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.threads/list
  namespace: tools.gmail
  name: list_threads
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    q:
      type: str | None
      description: >-
        Only return threads matching the specified query. Supports the same query format
        as the Gmail search box.
      default: null
    max_results:
      type: int | None
      description: >-
        Maximum number of threads to return. This field defaults to 100. The maximum
        allowed value for this field is 500.
      default: null
    page_token:
      type: str | None
      description: Page token to retrieve a specific page of results in the list.
      default: null
    label_ids:
      type: list[str] | None
      description: Only return threads with labels that match all of the specified label IDs.
      default: null
    include_spam_trash:
      type: bool | None
      description: Include threads from SPAM and TRASH in the results.
      default: null
    user_id:
      type: str
      description: >-
        The user's email address. The special value `me` can be used to indicate the
        authenticated user.
      default: me
  steps:
    - ref: list_threads
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.threads
        method_name: list
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
        params:
          userId: ${{ inputs.user_id }}
          q: ${{ inputs.q }}
          maxResults: ${{ inputs.max_results }}
          pageToken: ${{ inputs.page_token }}
          labelIds: ${{ inputs.label_ids }}
          includeSpamTrash: ${{ inputs.include_spam_trash }}
  returns: ${{ steps.list_threads.result }}
