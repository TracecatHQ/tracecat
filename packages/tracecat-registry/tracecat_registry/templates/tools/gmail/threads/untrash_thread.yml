type: action
definition:
  title: Untrash thread
  description: >-
    Removes the specified thread from the trash. Any messages that belong to the thread
    are also removed from the trash.
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.threads/untrash
  namespace: tools.gmail
  name: untrash_thread
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    id:
      type: str
      description: The ID of the thread to remove from Trash.
    user_id:
      type: str
      description: >-
        The user's email address. The special value `me` can be used to indicate the
        authenticated user.
      default: me
  steps:
    - ref: untrash_thread
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.threads
        method_name: untrash
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.modify"]
        params:
          userId: ${{ inputs.user_id }}
          id: ${{ inputs.id }}
  returns: ${{ steps.untrash_thread.result }}
