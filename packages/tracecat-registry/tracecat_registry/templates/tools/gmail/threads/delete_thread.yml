type: action
definition:
  title: Delete thread
  description: >-
    Immediately and permanently deletes the specified thread. Any messages that belong
    to the thread are also deleted. This operation cannot be undone. Prefer
    threads.trash instead. Requires the `https://mail.google.com/` scope, which is not
    in the Gmail provider defaults: add it to the integration's scopes before
    connecting, or delegate it to the service account.
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.threads/delete
  namespace: tools.gmail
  name: delete_thread
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    id:
      type: str
      description: ID of the Thread to delete.
    user_id:
      type: str
      description: >-
        The user's email address. The special value `me` can be used to indicate the
        authenticated user.
      default: me
    auth_mode:
      type: enum["auto", "delegated", "application"]
      description: >-
        OAuth connection to use. `delegated` uses the user token, `application`
        uses the service token, and `auto` uses whichever is connected, trying
        delegated first, then application.
      default: auto
  steps:
    - ref: delete_thread
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.threads
        method_name: delete
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN if inputs.auth_mode == "delegated" else SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN if inputs.auth_mode == "application" else SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://mail.google.com/"]
        params:
          userId: ${{ inputs.user_id }}
          id: ${{ inputs.id }}
  returns: ${{ steps.delete_thread.result }}
