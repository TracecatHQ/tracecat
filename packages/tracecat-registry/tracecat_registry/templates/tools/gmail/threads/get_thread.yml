type: action
definition:
  title: Get Gmail thread
  description: Get all messages in an email thread
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.threads/get
  namespace: tools.gmail
  name: get_thread
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    thread_id:
      type: str
      description: The thread ID to retrieve
    user_id:
      type: str
      description: User ID or 'me' for authenticated user
      default: me
    format:
      type: str
      description: >-
        Format: 'full' (complete), 'metadata' (headers only), 'minimal' (IDs only)
      default: full
  steps:
    - ref: get_thread
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.threads
        method_name: get
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
        params:
          userId: ${{ inputs.user_id }}
          id: ${{ inputs.thread_id }}
          format: ${{ inputs.format }}
  returns: ${{ steps.get_thread.result }}
