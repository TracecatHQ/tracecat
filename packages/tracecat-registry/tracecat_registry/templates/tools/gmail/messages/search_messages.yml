type: action
definition:
  title: Search Gmail messages
  description: Search Gmail messages using Gmail's powerful query syntax
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.messages/list
  namespace: tools.gmail
  name: search_messages
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  # Legacy: ported from the tools.gmail Python UDF. Inputs and output shape are a
  # published contract; do not rename or reshape them. Not a pattern for new actions.
  expects:
    query:
      type: str
      description: Gmail search query (e.g., 'from:suspicious@evil.com has:attachment')
    max_results:
      type: int
      description: Maximum number of results to return. The maximum allowed value for this field is 500.
      default: 10
    user_id:
      type: str
      description: User ID or 'me' for authenticated user
      default: me
    page_token:
      type: str | None
      description: Page token for pagination
      default: null
  steps:
    - ref: search_messages
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.messages
        method_name: list
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
        params:
          userId: ${{ inputs.user_id }}
          q: ${{ inputs.query }}
          maxResults: ${{ inputs.max_results }}
          pageToken: ${{ inputs.page_token }}
  returns: ${{ steps.search_messages.result }}
