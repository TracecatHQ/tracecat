type: action
definition:
  title: Get Gmail message
  description: Get full content of a Gmail message by ID
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.messages/get
  namespace: tools.gmail
  name: get_message
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  # Legacy: ported from the tools.gmail Python UDF. Inputs and output shape are a
  # published contract; do not rename or reshape them. Not a pattern for new actions.
  expects:
    message_id:
      type: str
      description: The message ID to retrieve
    user_id:
      type: str
      description: User ID or 'me' for authenticated user
      default: me
    format:
      type: str
      description: >-
        Format: 'full' (complete), 'metadata' (headers only), 'minimal' (IDs only),
        'raw' (RFC 2822)
      default: full
  steps:
    - ref: get_message
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.messages
        method_name: get
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
        params:
          userId: ${{ inputs.user_id }}
          id: ${{ inputs.message_id }}
          format: ${{ inputs.format }}
  returns: ${{ steps.get_message.result }}
