type: action
definition:
  title: Untrash message
  description: Removes the specified message from the trash.
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.messages/untrash
  namespace: tools.gmail
  name: untrash_message
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    id:
      type: str
      description: The ID of the message to remove from Trash.
    user_id:
      type: str
      description: >-
        The user's email address. The special value `me` can be used to indicate the
        authenticated user.
      default: me
    auth_mode:
      type: enum["auto", "delegated", "application"]
      description: >-
        OAuth connection to use. `delegated` uses the user token, `application`
        uses the service token, and `auto` uses whichever is connected, trying
        delegated first, then application.
      default: auto
  steps:
    - ref: untrash_message
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.messages
        method_name: untrash
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN if inputs.auth_mode == "delegated" else SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN if inputs.auth_mode == "application" else SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.modify"]
        params:
          userId: ${{ inputs.user_id }}
          id: ${{ inputs.id }}
  returns: ${{ steps.untrash_message.result }}
