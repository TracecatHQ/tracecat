type: action
definition:
  title: Get Gmail message headers
  description: Get only headers of a Gmail message (faster than full message)
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.messages/get
  namespace: tools.gmail
  name: get_message_headers
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    message_id:
      type: str
      description: The message ID to retrieve headers for
    user_id:
      type: str
      description: User ID or 'me' for authenticated user
      default: me
    metadata_headers:
      type: list[str] | None
      description: >-
        Specific headers to return (e.g., ['From', 'To', 'Subject']). If not specified,
        returns all headers.
      default: null
  steps:
    - ref: get_message_headers
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.messages
        method_name: get
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
        params:
          userId: ${{ inputs.user_id }}
          id: ${{ inputs.message_id }}
          format: metadata
          metadataHeaders: ${{ inputs.metadata_headers }}
  returns: ${{ steps.get_message_headers.result }}
