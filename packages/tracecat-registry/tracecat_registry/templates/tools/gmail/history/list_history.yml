type: action
definition:
  title: List history
  description: >-
    Lists the history of all changes to the given mailbox. History results are returned
    in chronological order (increasing historyId).
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.history/list
  namespace: tools.gmail
  name: list_history
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    start_history_id:
      type: str
      description: >-
        Returns history records after the specified startHistoryId. The supplied
        startHistoryId should be obtained from the historyId of a message, thread, or
        previous list response. History IDs increase chronologically but are not
        contiguous with random gaps in between valid IDs. Supplying an invalid or out of
        date startHistoryId typically returns an HTTP 404 error code. A historyId is
        typically valid for at least a week, but in some rare circumstances may be valid
        for only a few hours.
    history_types:
      type: list[str] | None
      description: >-
        History types to be returned by the function. Allowed values: messageAdded,
        messageDeleted, labelAdded, labelRemoved.
      default: null
    label_id:
      type: str | None
      description: Only return messages with a label matching the ID.
      default: null
    max_results:
      type: int | None
      description: >-
        Maximum number of history records to return. This field defaults to 100. The
        maximum allowed value for this field is 500.
      default: null
    page_token:
      type: str | None
      description: Page token to retrieve a specific page of results in the list.
      default: null
    user_id:
      type: str
      description: >-
        The user's email address. The special value `me` can be used to indicate the
        authenticated user.
      default: me
  steps:
    - ref: list_history
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.history
        method_name: list
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
        params:
          userId: ${{ inputs.user_id }}
          startHistoryId: ${{ inputs.start_history_id }}
          historyTypes: ${{ inputs.history_types }}
          labelId: ${{ inputs.label_id }}
          maxResults: ${{ inputs.max_results }}
          pageToken: ${{ inputs.page_token }}
  returns: ${{ steps.list_history.result }}
