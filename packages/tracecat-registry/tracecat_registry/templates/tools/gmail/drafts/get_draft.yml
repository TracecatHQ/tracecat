type: action
definition:
  title: Get draft
  description: Gets the specified draft.
  display_group: Gmail
  doc_url: https://developers.google.com/workspace/gmail/api/reference/rest/v1/users.drafts/get
  namespace: tools.gmail
  name: get_draft
  secrets:
    - type: oauth
      provider_id: google_gmail
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_gmail
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    id:
      type: str
      description: The ID of the draft to retrieve.
    format:
      type: str | None
      description: >-
        The format to return the draft in. Allowed values: minimal (only the message ID
        and labels), full (the full message data with the body parsed in the payload
        field), raw (the full message data with the body in the raw field as a base64url
        encoded string), metadata (only the message ID, labels, and headers). Defaults
        to full.
      default: null
    user_id:
      type: str
      description: >-
        The user's email address. The special value `me` can be used to indicate the
        authenticated user.
      default: me
  steps:
    - ref: get_draft
      action: tools.google_api.call_api
      args:
        service_name: gmail
        version: v1
        resource: users.drafts
        method_name: get
        access_token: ${{ SECRETS.google_gmail_oauth.GOOGLE_GMAIL_USER_TOKEN || SECRETS.google_gmail_oauth.GOOGLE_GMAIL_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/gmail.compose"]
        params:
          userId: ${{ inputs.user_id }}
          id: ${{ inputs.id }}
          format: ${{ inputs.format }}
  returns: ${{ steps.get_draft.result }}
