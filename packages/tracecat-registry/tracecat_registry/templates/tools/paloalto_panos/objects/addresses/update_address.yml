type: action
definition:
  title: Update address
  description: Update a address object in the candidate configuration. Reads it with GET /restapi/{version}/Objects/Addresses?name=, applies only the provided fields, and writes it with PUT. Commit to apply the change.
  display_group: Palo Alto PAN-OS (NGFW and Panorama)
  doc_url: https://pan.dev/panos/docs/restapi/
  namespace: tools.paloalto_panos
  name: update_address
  secrets:
    - name: paloalto_panos
      keys:
        - PANOS_API_KEY
  expects:
    name:
      type: str
      description: Name of the address object.
    ip_netmask:
      type: str | None
      description: IP address with or without CIDR mask, e.g. 203.0.113.10 or 10.0.0.0/24.
      default: null
    ip_range:
      type: str | None
      description: IP range, e.g. 10.0.0.1-10.0.0.20.
      default: null
    ip_wildcard:
      type: str | None
      description: IP wildcard mask, e.g. 10.20.1.0/0.0.248.255.
      default: null
    fqdn:
      type: str | None
      description: Fully qualified domain name.
      default: null
    description:
      type: str | None
      description: New description.
      default: null
    tags:
      type: list[str] | None
      description: Replacement tag list.
      default: null
    location:
      type: enum["vsys", "shared", "device-group"]
      description: Configuration location. Use vsys on firewalls, device-group or shared on Panorama.
      default: vsys
    vsys:
      type: str
      description: Virtual system when location is vsys.
      default: vsys1
    device_group:
      type: str | None
      description: Panorama device group when location is device-group.
      default: null
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable paloalto_panos.base_url.
      default: null
    api_version:
      type: str | None
      description: PAN-OS REST API version, e.g. v11.1 or v10.2. Falls back to the workspace variable paloalto_panos.api_version, then v11.1.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: get
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_panos.base_url }}/restapi/${{ inputs.api_version || VARS.paloalto_panos.api_version || "v11.1" }}/Objects/Addresses
        method: GET
        headers:
          X-PAN-KEY: ${{ SECRETS.paloalto_panos.PANOS_API_KEY }}
          Accept: application/json
        params:
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys if inputs.location == "vsys" else None }}
          device-group: ${{ inputs.device_group if inputs.location == "device-group" else None }}
          name: ${{ inputs.name }}
        verify_ssl: ${{ inputs.verify_ssl }}
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.get.result }}
          ip_netmask: ${{ inputs.ip_netmask }}
          ip_range: ${{ inputs.ip_range }}
          ip_wildcard: ${{ inputs.ip_wildcard }}
          fqdn: ${{ inputs.fqdn }}
          description: ${{ inputs.description }}
          tags: ${{ inputs.tags }}
        script: |
          def _entries(response):
              data = response.get("data") if isinstance(response, dict) else None
              if not isinstance(data, dict) or response.get("status_code") == 404:
                  return []
              entries = (data.get("result") or {}).get("entry") or []
              return entries if isinstance(entries, list) else [entries]

          def _sanitize(entry):
              # Location attributes are read-only metadata; keep only @name and config.
              body = {key: value for key, value in entry.items() if not key.startswith("@")}
              body["@name"] = entry["@name"]
              return body

          TYPES = {"ip_netmask": "ip-netmask", "ip_range": "ip-range", "ip_wildcard": "ip-wildcard", "fqdn": "fqdn"}

          def _values(ip_netmask, ip_range, ip_wildcard, fqdn):
              given = dict(zip(TYPES.values(), (ip_netmask, ip_range, ip_wildcard, fqdn)))
              return {key: value for key, value in given.items() if value}


          def main(response, ip_netmask, ip_range, ip_wildcard, fqdn, description, tags):
              entries = _entries(response)
              if not entries:
                  raise ValueError(f"Address not found: {response.get('data')}")
              body = _sanitize(entries[0])
              values = _values(ip_netmask, ip_range, ip_wildcard, fqdn)
              if len(values) > 1:
                  raise ValueError("Provide at most one of ip_netmask, ip_range, ip_wildcard, or fqdn.")
              if values:
                  for key in TYPES.values():
                      body.pop(key, None)
                  body.update(values)
              if description is not None:
                  body["description"] = description
              if tags is not None:
                  body["tag"] = {"member": tags}
              return {"entry": body}
    - ref: update
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_panos.base_url }}/restapi/${{ inputs.api_version || VARS.paloalto_panos.api_version || "v11.1" }}/Objects/Addresses
        method: PUT
        headers:
          X-PAN-KEY: ${{ SECRETS.paloalto_panos.PANOS_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys if inputs.location == "vsys" else None }}
          device-group: ${{ inputs.device_group if inputs.location == "device-group" else None }}
          name: ${{ inputs.name }}
        verify_ssl: ${{ inputs.verify_ssl }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.update.result.data }}
