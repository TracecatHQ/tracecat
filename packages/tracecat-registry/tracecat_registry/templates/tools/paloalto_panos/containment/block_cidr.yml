type: action
definition:
  title: Block CIDR
  description: Block a CIDR range by adding an address object to a static address group referenced by a deny rule. Looks up the address object by name, creates it with POST /restapi/{version}/Objects/Addresses if missing, then adds it to the group with PUT /restapi/{version}/Objects/AddressGroups if it is not already a member, so repeated calls do not create duplicates. Changes stay in the candidate configuration; run commit (and commit_all on Panorama) to enforce them. For temporary blocks without a commit, use register_ip_tags with a dynamic address group.
  display_group: Palo Alto PAN-OS (NGFW and Panorama)
  doc_url: https://pan.dev/panos/docs/restapi/
  namespace: tools.paloalto_panos
  name: block_cidr
  secrets:
    - name: paloalto_panos
      keys:
        - PANOS_API_KEY
  expects:
    value:
      type: str
      description: IPv4 or IPv6 network in CIDR notation to block.
    address_group:
      type: str
      description: Static address group that a deny rule references, e.g. tracecat-blocklist.
    name_prefix:
      type: str
      description: Prefix for generated address object names.
      default: tc-block-
    address_name:
      type: str | None
      description: Address object name to use instead of the generated name.
      default: null
    location:
      type: enum["vsys", "shared", "device-group"]
      description: Configuration location. Use vsys on firewalls, device-group or shared on Panorama.
      default: vsys
    vsys:
      type: str
      description: Virtual system when location is vsys.
      default: vsys1
    device_group:
      type: str | None
      description: Panorama device group when location is device-group.
      default: null
    description:
      type: str | None
      description: Description for a newly created address object, e.g. the case ID.
      default: null
    tags:
      type: list[str] | None
      description: Tags for a newly created address object.
      default: null
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable paloalto_panos.base_url.
      default: null
    api_version:
      type: str | None
      description: PAN-OS REST API version, e.g. v11.1 or v10.2. Falls back to the workspace variable paloalto_panos.api_version, then v11.1.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: plan
      action: core.script.run_python
      args:
        inputs:
          kind: cidr
          value: ${{ inputs.value }}
          name_prefix: ${{ inputs.name_prefix }}
          address_name: ${{ inputs.address_name }}
          address_group: ${{ inputs.address_group }}
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys }}
          device_group: ${{ inputs.device_group }}
        script: |
          import ipaddress
          import re

          FQDN_RE = re.compile(r"^(?=.{1,253}$)(\*\.)?([A-Za-z0-9_](?:[A-Za-z0-9_-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}\.?$")

          def _indicator(kind, value, name_prefix, address_name):
              value = value.strip()
              if kind == "ip":
                  ip = ipaddress.ip_address(value)
                  field, normalized = "ip_netmask", f"{ip}/{ip.max_prefixlen}"
                  label = str(ip)
              elif kind == "cidr":
                  net = ipaddress.ip_network(value, strict=False)
                  field, normalized = "ip_netmask", str(net)
                  label = str(net) if net.prefixlen != net.max_prefixlen else str(net.network_address)
              elif kind == "ip_or_cidr":
                  return _indicator("cidr" if "/" in value else "ip", value, name_prefix, address_name)
              else:
                  if not FQDN_RE.match(value):
                      raise ValueError(f"Invalid FQDN: {value}")
                  field, normalized = "fqdn", value.rstrip(".").lower()
                  label = normalized
              name = address_name or name_prefix + label.replace(":", "-").replace("/", "_").replace("*", "wildcard")
              if len(name) > 63:
                  raise ValueError(f"Address name {name} exceeds 63 characters; set address_name.")
              return {"field": field, "value": normalized, "name": name}

          def _location(location, vsys, device_group):
              if location == "vsys":
                  return {"location": "vsys", "vsys": vsys or "vsys1"}
              if location == "device-group":
                  if not device_group:
                      raise ValueError("device_group is required when location is device-group.")
                  return {"location": "device-group", "device-group": device_group}
              if location == "shared":
                  return {"location": "shared"}
              raise ValueError(f"Unsupported location: {location}")


          FIELDS = {"ip_netmask": "ip-netmask", "fqdn": "fqdn"}

          def main(kind, value, name_prefix, address_name, address_group, location, vsys, device_group):
              loc = _location(location, vsys, device_group)
              indicator = _indicator(kind, value, name_prefix, address_name)
              indicator["field"] = FIELDS[indicator["field"]]
              return {
                  "indicator": indicator,
                  "address_params": {**loc, "name": indicator["name"]},
                  "group_params": {**loc, "name": address_group},
              }
    - ref: lookup_address
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_panos.base_url }}/restapi/${{ inputs.api_version || VARS.paloalto_panos.api_version || "v11.1" }}/Objects/Addresses
        method: GET
        headers: &id001
          X-PAN-KEY: ${{ SECRETS.paloalto_panos.PANOS_API_KEY }}
          Accept: application/json
        params: ${{ steps.plan.result.address_params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        ignore_status_codes:
          - 404
    - ref: plan_address
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.lookup_address.result }}
          indicator: ${{ steps.plan.result.indicator }}
          address_params: ${{ steps.plan.result.address_params }}
          description: ${{ inputs.description }}
          tags: ${{ inputs.tags }}
        script: |
          def _entries(response):
              data = response.get("data") if isinstance(response, dict) else None
              if not isinstance(data, dict) or response.get("status_code") == 404:
                  return []
              entries = (data.get("result") or {}).get("entry") or []
              return entries if isinstance(entries, list) else [entries]


          def main(response, indicator, address_params, description, tags):
              entries = _entries(response)
              if entries:
                  current = entries[0].get(indicator["field"])
                  if current not in (indicator["value"], indicator["value"].split("/")[0]):
                      raise ValueError(
                          f"Address {indicator['name']} already exists with {indicator['field']}={current}, "
                          f"not {indicator['value']}. Set address_name to use a different object."
                      )
                  return {"method": "GET", "payload": None, "created": False}
              entry = {"@name": indicator["name"], indicator["field"]: indicator["value"]}
              if description:
                  entry["description"] = description
              if tags:
                  entry["tag"] = {"member": tags}
              return {"method": "POST", "payload": {"entry": entry}, "created": True}
    - ref: upsert_address
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_panos.base_url }}/restapi/${{ inputs.api_version || VARS.paloalto_panos.api_version || "v11.1" }}/Objects/Addresses
        method: ${{ steps.plan_address.result.method }}
        headers: &id002
          X-PAN-KEY: ${{ SECRETS.paloalto_panos.PANOS_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params: ${{ steps.plan.result.address_params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        payload: ${{ steps.plan_address.result.payload }}
    - ref: lookup_group
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_panos.base_url }}/restapi/${{ inputs.api_version || VARS.paloalto_panos.api_version || "v11.1" }}/Objects/AddressGroups
        method: GET
        headers: *id001
        params: ${{ steps.plan.result.group_params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        ignore_status_codes:
          - 404
    - ref: plan_group
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.lookup_group.result }}
          group_name: ${{ inputs.address_group }}
          address_name: ${{ steps.plan.result.indicator.name }}
          address_created: ${{ steps.plan_address.result.created }}
        script: |
          def _entries(response):
              data = response.get("data") if isinstance(response, dict) else None
              if not isinstance(data, dict) or response.get("status_code") == 404:
                  return []
              entries = (data.get("result") or {}).get("entry") or []
              return entries if isinstance(entries, list) else [entries]

          def _sanitize(entry):
              # PAN-OS REST docs build PUT bodies from the GET entry, including the
              # @name/@location/@vsys/@device-group attributes that match the query.
              return dict(entry)

          def _members(entry):
              members = (entry.get("static") or {}).get("member") or []
              return members if isinstance(members, list) else [members]


          def main(response, group_name, address_name, address_created):
              entries = _entries(response)
              if not entries:
                  raise ValueError(
                      f"Address group {group_name} not found: {response.get('data')}. Create a static "
                      "address group that is referenced by a deny rule before using it for containment."
                  )
              group = entries[0]
              if "static" not in group:
                  raise ValueError(f"Address group {group_name} is dynamic; use a static address group.")
              members = _members(group)
              if address_name in members:
                  return {"method": "GET", "payload": None, "changed": False, "already_blocked": not address_created}
              body = _sanitize(group)
              body["static"] = {"member": members + [address_name]}
              return {"method": "PUT", "payload": {"entry": body}, "changed": True, "already_blocked": False}
    - ref: update_group
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_panos.base_url }}/restapi/${{ inputs.api_version || VARS.paloalto_panos.api_version || "v11.1" }}/Objects/AddressGroups
        method: ${{ steps.plan_group.result.method }}
        headers: *id002
        params: ${{ steps.plan.result.group_params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        payload: ${{ steps.plan_group.result.payload }}
  returns:
    value: ${{ steps.plan.result.indicator.value }}
    address_name: ${{ steps.plan.result.indicator.name }}
    address_group: ${{ inputs.address_group }}
    address_created: ${{ steps.plan_address.result.created }}
    group_updated: ${{ steps.plan_group.result.changed }}
    already_blocked: ${{ steps.plan_group.result.already_blocked }}
