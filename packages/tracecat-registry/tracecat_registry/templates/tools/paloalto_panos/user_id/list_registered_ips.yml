type: action
definition:
  title: List registered IPs
  description: List IP addresses registered with tags for dynamic address groups with the XML API operational command show object registered-ip, optionally filtered by IP or tag.
  display_group: Palo Alto PAN-OS (NGFW and Panorama)
  doc_url: https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-panorama-api/pan-os-xml-api-request-types/run-operational-mode-commands-api
  namespace: tools.paloalto_panos
  name: list_registered_ips
  secrets:
    - name: paloalto_panos
      keys:
        - PANOS_API_KEY
  expects:
    ip:
      type: str | None
      description: Filter by IP address.
      default: null
    tag:
      type: str | None
      description: Filter by tag.
      default: null
    vsys:
      type: str | None
      description: Virtual system on multi-vsys firewalls.
      default: null
    target:
      type: str | None
      description: Managed firewall serial number when calling through Panorama.
      default: null
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable paloalto_panos.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: build_command
      action: core.script.run_python
      args:
        inputs:
          ip: ${{ inputs.ip }}
          tag: ${{ inputs.tag }}
          vsys: ${{ inputs.vsys }}
          target: ${{ inputs.target }}
        script: |
          def _form(form, vsys=None, target=None):
              if vsys:
                  form["vsys"] = vsys
              if target:
                  form["target"] = target
              return form

          from xml.sax.saxutils import escape, quoteattr

          def main(ip, tag, vsys, target):
              if ip and tag:
                  raise ValueError("Filter by ip or tag, not both.")
              if ip:
                  selector = f"<ip>{escape(ip)}</ip>"
              elif tag:
                  selector = f"<tag><entry name={quoteattr(tag)}/></tag>"
              else:
                  selector = "<all/>"
              cmd = f"<show><object><registered-ip>{selector}</registered-ip></object></show>"
              return _form({"type": "op", "cmd": cmd}, vsys, target)
    - ref: list
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_panos.base_url }}/api/
        method: POST
        headers:
          X-PAN-KEY: ${{ SECRETS.paloalto_panos.PANOS_API_KEY }}
        form_data: ${{ steps.build_command.result }}
        verify_ssl: ${{ inputs.verify_ssl }}
    - ref: parse
      action: core.script.run_python
      args:
        inputs:
          text: ${{ steps.list.result.data }}
        script: |
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape, quoteattr

          def _to_dict(element):
              node = {f"@{key}": value for key, value in element.attrib.items()}
              children = list(element)
              text = (element.text or "").strip()
              if not children:
                  if not node:
                      return text
                  if text:
                      node["#text"] = text
                  return node
              for child in children:
                  value = _to_dict(child)
                  if child.tag in node:
                      if not isinstance(node[child.tag], list):
                          node[child.tag] = [node[child.tag]]
                      node[child.tag].append(value)
                  else:
                      node[child.tag] = value
              return node

          def _parse(text):
              root = ET.fromstring(text)
              if root.get("status") != "success":
                  detail = ET.tostring(root, encoding="unicode")[:2000]
                  raise ValueError(f"PAN-OS XML API error (code {root.get('code')}): {detail}")
              return root

          def _lines(element):
              if element is None:
                  return []
              return [line.strip() for line in element.itertext() if line.strip()]


          def main(text):
              root = _parse(text)
              entries = []
              for entry in root.findall("./result/entry"):
                  entries.append({
                      "ip": entry.get("ip"),
                      "persistent": entry.get("persistent") == "1",
                      "from_agent": entry.get("from_agent"),
                      "tags": [member.text for member in entry.findall("./tag/member") if member.text],
                  })
              return entries
  returns: ${{ steps.parse.result }}
