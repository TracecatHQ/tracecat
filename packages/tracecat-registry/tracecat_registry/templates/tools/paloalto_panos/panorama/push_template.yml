type: action
definition:
  title: Push template
  description: Push template configuration from Panorama to its firewalls with the XML API (type=commit, action=all, commit-all template). Optionally limit the push to specific firewall serial numbers. Commit on Panorama first. Returns the job ID; use wait_for_job to wait for completion.
  display_group: Palo Alto PAN-OS (NGFW and Panorama)
  doc_url: https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-panorama-api/pan-os-xml-api-request-types/commit-configuration-api
  namespace: tools.paloalto_panos
  name: push_template
  secrets:
    - name: paloalto_panos
      keys:
        - PANOS_API_KEY
  expects:
    name:
      type: str
      description: Template name.
    devices:
      type: list[str] | None
      description: Limit the push to these firewall serial numbers.
      default: null
    description:
      type: str | None
      description: Push description, e.g. the case or incident ID.
      default: null
    force_template_values:
      type: bool
      description: Overwrite local firewall values with template values.
      default: false
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable paloalto_panos.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: build_command
      action: core.script.run_python
      args:
        inputs:
          tag: template
          name: ${{ inputs.name }}
          devices: ${{ inputs.devices }}
          description: ${{ inputs.description }}
          force_template_values: ${{ inputs.force_template_values }}
        script: |
          from xml.sax.saxutils import escape

          def main(tag, name, devices, description, force_template_values):
              parts = [f"<name>{escape(name)}</name>"]
              if description:
                  parts.append(f"<description>{escape(description)}</description>")
              if force_template_values:
                  parts.append("<force-template-values>yes</force-template-values>")
              if devices:
                  members = "".join(f"<member>{escape(serial)}</member>" for serial in devices)
                  parts.append(f"<device>{members}</device>")
              cmd = f"<commit-all><{tag}>{''.join(parts)}</{tag}></commit-all>"
              return {"type": "commit", "action": "all", "cmd": cmd}
    - ref: commit
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_panos.base_url }}/api/
        method: POST
        headers:
          X-PAN-KEY: ${{ SECRETS.paloalto_panos.PANOS_API_KEY }}
        form_data: ${{ steps.build_command.result }}
        verify_ssl: ${{ inputs.verify_ssl }}
        timeout: 60
    - ref: parse
      action: core.script.run_python
      args:
        inputs:
          text: ${{ steps.commit.result.data }}
        script: |
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape, quoteattr

          def _to_dict(element):
              node = {f"@{key}": value for key, value in element.attrib.items()}
              children = list(element)
              text = (element.text or "").strip()
              if not children:
                  if not node:
                      return text
                  if text:
                      node["#text"] = text
                  return node
              for child in children:
                  value = _to_dict(child)
                  if child.tag in node:
                      if not isinstance(node[child.tag], list):
                          node[child.tag] = [node[child.tag]]
                      node[child.tag].append(value)
                  else:
                      node[child.tag] = value
              return node

          def _parse(text):
              root = ET.fromstring(text)
              if root.get("status") != "success":
                  detail = ET.tostring(root, encoding="unicode")[:2000]
                  raise ValueError(f"PAN-OS XML API error (code {root.get('code')}): {detail}")
              return root

          def _lines(element):
              if element is None:
                  return []
              return [line.strip() for line in element.itertext() if line.strip()]


          def main(text):
              root = _parse(text)
              return {
                  "job_id": root.findtext("./result/job"),
                  "message": " ".join(_lines(root.find("./result/msg")) or _lines(root.find("./msg"))),
                  "response": _to_dict(root),
              }
  returns: ${{ steps.parse.result }}
