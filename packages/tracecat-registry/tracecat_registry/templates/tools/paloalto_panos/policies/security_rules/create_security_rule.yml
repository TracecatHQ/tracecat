type: action
definition:
  title: Create security rule
  description: Create a security rule in the candidate configuration with POST /restapi/{version}/Policies/SecurityRules?name= (SecurityPreRules or SecurityPostRules on Panorama). The rule is added at the bottom; use move_security_rule to place it. Commit to apply the change.
  display_group: Palo Alto PAN-OS (NGFW and Panorama)
  doc_url: https://pan.dev/panos/docs/restapi/
  namespace: tools.paloalto_panos
  name: create_security_rule
  secrets:
    - name: paloalto_panos
      keys:
        - PANOS_API_KEY
  expects:
    name:
      type: str
      description: Security rule name.
    action:
      type: enum["allow", "deny", "drop", "reset-client", "reset-server", "reset-both"]
      description: Action to take when the rule matches.
    from_zones:
      type: list[str]
      description: Source zones. Defaults to any.
      default:
        - any
    to_zones:
      type: list[str]
      description: Destination zones. Defaults to any.
      default:
        - any
    source:
      type: list[str]
      description: Source addresses, address groups, or EDLs. Defaults to any.
      default:
        - any
    destination:
      type: list[str]
      description: Destination addresses, address groups, or EDLs. Defaults to any.
      default:
        - any
    source_user:
      type: list[str]
      description: Source users or groups. Defaults to any.
      default:
        - any
    application:
      type: list[str]
      description: Applications. Defaults to any.
      default:
        - any
    service:
      type: list[str]
      description: Services, e.g. application-default or any. Defaults to any.
      default:
        - any
    category:
      type: list[str]
      description: URL categories. Defaults to any.
      default:
        - any
    description:
      type: str | None
      description: Rule description.
      default: null
    tags:
      type: list[str] | None
      description: Tags to apply to the rule.
      default: null
    disabled:
      type: bool
      description: Create the rule disabled.
      default: false
    log_setting:
      type: str | None
      description: Log forwarding profile.
      default: null
    profile_group:
      type: str | None
      description: Security profile group to attach.
      default: null
    extra_fields:
      type: dict[str, Any] | None
      description: 'Additional API-native entry fields, e.g. {"negate-source": "yes"}.'
      default: null
    rulebase:
      type: enum["security", "pre", "post"]
      description: Rulebase. Use security on firewalls, pre or post on Panorama.
      default: security
    location:
      type: enum["vsys", "shared", "device-group"]
      description: Configuration location. Use vsys on firewalls, device-group or shared on Panorama.
      default: vsys
    vsys:
      type: str
      description: Virtual system when location is vsys.
      default: vsys1
    device_group:
      type: str | None
      description: Panorama device group when location is device-group.
      default: null
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable paloalto_panos.base_url.
      default: null
    api_version:
      type: str | None
      description: PAN-OS REST API version, e.g. v11.1 or v10.2. Falls back to the workspace variable paloalto_panos.api_version, then v11.1.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          name: ${{ inputs.name }}
          action: ${{ inputs.action }}
          from_zones: ${{ inputs.from_zones }}
          to_zones: ${{ inputs.to_zones }}
          source: ${{ inputs.source }}
          destination: ${{ inputs.destination }}
          source_user: ${{ inputs.source_user }}
          application: ${{ inputs.application }}
          service: ${{ inputs.service }}
          category: ${{ inputs.category }}
          description: ${{ inputs.description }}
          tags: ${{ inputs.tags }}
          disabled: ${{ inputs.disabled }}
          log_setting: ${{ inputs.log_setting }}
          profile_group: ${{ inputs.profile_group }}
          extra_fields: ${{ inputs.extra_fields }}
        script: |
          def main(name, action, from_zones, to_zones, source, destination, source_user, application, service, category, description, tags, disabled, log_setting, profile_group, extra_fields):
              entry = {"@name": name, "action": action}
              for key, value in (("from", from_zones), ("to", to_zones), ("source", source), ("destination", destination), ("source-user", source_user), ("application", application), ("service", service), ("category", category)):
                  entry[key] = {"member": value or ["any"]}
              if description is not None:
                  entry["description"] = description
              if tags:
                  entry["tag"] = {"member": tags}
              if disabled:
                  entry["disabled"] = "yes"
              if log_setting is not None:
                  entry["log-setting"] = log_setting
              if profile_group is not None:
                  entry["profile-setting"] = {"group": {"member": [profile_group]}}
              entry.update(extra_fields or {})
              return {"entry": entry}
    - ref: create
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_panos.base_url }}/restapi/${{ inputs.api_version || VARS.paloalto_panos.api_version || "v11.1" }}/Policies/${{ "SecurityPreRules" if inputs.rulebase == "pre" else ("SecurityPostRules" if inputs.rulebase == "post" else "SecurityRules") }}
        method: POST
        headers:
          X-PAN-KEY: ${{ SECRETS.paloalto_panos.PANOS_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys if inputs.location == "vsys" else None }}
          device-group: ${{ inputs.device_group if inputs.location == "device-group" else None }}
          name: ${{ inputs.name }}
        verify_ssl: ${{ inputs.verify_ssl }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.create.result.data }}
