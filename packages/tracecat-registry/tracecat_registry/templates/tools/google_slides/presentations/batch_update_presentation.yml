type: action
definition:
  title: Batch update presentation
  description: Applies one or more updates to the presentation.
  display_group: Google Slides
  doc_url: https://developers.google.com/workspace/slides/api/reference/rest/v1/presentations/batchUpdate
  namespace: tools.google_slides
  name: batch_update_presentation
  secrets:
    - type: oauth
      provider_id: google_slides
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_slides
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    presentation_id:
      type: str
      description: The presentation to apply the updates to.
    requests:
      # Generic: the vendor documents each Request as a union where exactly one field
      # is required, so there is no single field set to name.
      type: list[dict[str, Any]]
      description: >-
        A list of updates to apply to the presentation. Each Request sets exactly one
        of the union fields documented at
        https://developers.google.com/workspace/slides/api/reference/rest/v1/presentations/request
        (createSlide, createShape, createTable, insertText, replaceAllText, deleteObject,
        updatePageElementTransform, updateTextStyle, duplicateObject, and so on).
    write_control:
      # Generic: the vendor documents WriteControl as a free-form object whose fields are
      # mutually exclusive revision selectors.
      type: dict[str, Any] | None
      description: >-
        Provides control over how write requests are executed. Documented fields:
        requiredRevisionId, targetRevisionId.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          presentation_id: ${{ inputs.presentation_id }}
          requests: ${{ inputs.requests }}
          write_control: ${{ inputs.write_control }}
        script: |
          def main(presentation_id, requests, write_control):
              # Values inside `body` are not pruned, and Slides rejects a null writeControl.
              body = {"requests": requests}
              if write_control is not None:
                  body["writeControl"] = write_control
              return {"presentationId": presentation_id, "body": body}
    - ref: batch_update_presentation
      action: tools.google_api.call_api
      args:
        service_name: slides
        version: v1
        resource: presentations
        method_name: batchUpdate
        access_token: ${{ SECRETS.google_slides_oauth.GOOGLE_SLIDES_USER_TOKEN || SECRETS.google_slides_oauth.GOOGLE_SLIDES_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/presentations"]
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.batch_update_presentation.result }}
