type: action
definition:
  title: Remove page label
  description: >-
    Removes a label from a page. Uses the v1 API because the v2 API has no label write endpoints.
  display_group: Confluence
  doc_url: https://developer.atlassian.com/cloud/confluence/rest/v1/api-group-content-labels/#api-wiki-rest-api-content-id-label-label-delete
  namespace: tools.confluence
  name: remove_page_label
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    page_id:
      type: str
      description: >-
        The ID of the page that the label will be removed from.
    label:
      type: str
      description: >-
        The name of the label to be removed.
    base_url:
      type: str | None
      description: >-
        Confluence base URL. With an API token, use your site URL (e.g.
        https://example.atlassian.net/wiki). With Atlassian OAuth, use the
        Atlassian API gateway URL for your site (e.g.
        https://api.atlassian.com/ex/confluence/{cloudId}). See
        https://developer.atlassian.com/cloud/confluence/oauth-2-3lo-apps/ for
        how to find your cloudId and build OAuth request URLs.
      default: null
  steps:
    - ref: remove_page_label
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/rest/api/content/${{ FN.url_encode(inputs.page_id) }}/label/${{ FN.url_encode(inputs.label) }}
        method: DELETE
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
  returns: ${{ steps.remove_page_label.result }}
