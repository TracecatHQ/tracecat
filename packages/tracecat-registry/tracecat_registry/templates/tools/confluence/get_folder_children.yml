type: action
definition:
  title: Get folder children
  description: >-
    Returns all direct children (pages, folders, whiteboards, databases, and embeds) of a folder.
  display_group: Confluence
  doc_url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-children/#api-folders-id-direct-children-get
  namespace: tools.confluence
  name: get_folder_children
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    folder_id:
      type: str
      description: >-
        The ID of the parent folder.
    cursor:
      type: str | None
      description: >-
        Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header and in `_links.next`. Use the relevant `cursor` value from that URL to fetch the next page of children.
      default: null
    limit:
      type: int | None
      description: >-
        Maximum number of items per result to return. If more results exist, use the `Link` header or `_links.next` to retrieve a relative URL that will return the next set of results. Maximum 250.
      default: null
    sort:
      type: str | None
      description: >-
        Used to sort the result by a particular field. One of: created-date, -created-date, id, -id, modified-date, -modified-date, child-position, -child-position, title, -title.
      default: null
    base_url:
      type: str | None
      description: >-
        Confluence site base URL (e.g. https://example.atlassian.net/wiki). With
        Atlassian OAuth, use https://api.atlassian.com/ex/confluence/{cloudId}/wiki.
        Do not append /api/v2 or /rest/api.
      default: null
  steps:
    - ref: get_folder_children
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/api/v2/folders/${{ FN.url_encode(inputs.folder_id) }}/direct-children
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
        params:
          cursor: ${{ inputs.cursor }}
          limit: ${{ inputs.limit }}
          sort: ${{ inputs.sort }}
  returns: ${{ steps.get_folder_children.result }}
