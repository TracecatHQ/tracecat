type: action
definition:
  title: Get attachment
  description: >-
    Returns a specific attachment's metadata, including its `downloadLink`.
  display_group: Confluence
  doc_url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-attachment/#api-attachments-id-get
  namespace: tools.confluence
  name: get_attachment
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    attachment_id:
      type: str
      description: >-
        The ID of the attachment to be returned (e.g. att123456).
    version:
      type: int | None
      description: >-
        Allows you to retrieve a previously published version. Specify the previous version's number to retrieve its details.
      default: null
    include_labels:
      type: bool | None
      description: >-
        Includes labels associated with this attachment in the response. The number of results will be limited to 50.
      default: null
    include_properties:
      type: bool | None
      description: >-
        Includes content properties associated with this attachment in the response. The number of results will be limited to 50.
      default: null
    include_versions:
      type: bool | None
      description: >-
        Includes versions associated with this attachment in the response. The number of results will be limited to 50.
      default: null
    base_url:
      type: str | None
      description: >-
        Confluence base URL. With an API token, use your site URL (e.g.
        https://example.atlassian.net/wiki). With Atlassian OAuth, use the
        Atlassian API gateway URL for your site (e.g.
        https://api.atlassian.com/ex/confluence/{cloudId}). See
        https://developer.atlassian.com/cloud/confluence/oauth-2-3lo-apps/ for
        how to find your cloudId and build OAuth request URLs.
      default: null
  steps:
    - ref: get_attachment
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/api/v2/attachments/${{ FN.url_encode(inputs.attachment_id) }}
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
        params:
          version: ${{ inputs.version }}
          include-labels: ${{ inputs.include_labels }}
          include-properties: ${{ inputs.include_properties }}
          include-versions: ${{ inputs.include_versions }}
  returns: ${{ steps.get_attachment.result }}
