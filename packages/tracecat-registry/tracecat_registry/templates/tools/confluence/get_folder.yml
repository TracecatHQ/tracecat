type: action
definition:
  title: Get folder
  description: >-
    Returns a specific folder by its ID. Folders organize pages in a space's content tree.
  display_group: Confluence
  doc_url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-folder/#api-folders-id-get
  namespace: tools.confluence
  name: get_folder
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    folder_id:
      type: str
      description: >-
        The ID of the folder to be returned.
    include_direct_children:
      type: bool | None
      description: >-
        Includes direct children of the folder.
      default: null
    include_properties:
      type: bool | None
      description: >-
        Includes content properties associated with this folder in the response. The number of results will be limited to 50.
      default: null
    base_url:
      type: str | None
      description: >-
        Confluence site base URL (e.g. https://example.atlassian.net/wiki). With
        Atlassian OAuth, use https://api.atlassian.com/ex/confluence/{cloudId}.
        Do not append /api/v2 or /rest/api.
      default: null
  steps:
    - ref: get_folder
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/api/v2/folders/${{ FN.url_encode(inputs.folder_id) }}
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
        params:
          include-direct-children: ${{ inputs.include_direct_children }}
          include-properties: ${{ inputs.include_properties }}
  returns: ${{ steps.get_folder.result }}
