type: action
definition:
  title: List pages
  description: >-
    Returns all pages the caller can view, optionally filtered by page IDs, space IDs, title, or status.
  display_group: Confluence
  doc_url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-page/#api-pages-get
  namespace: tools.confluence
  name: list_pages
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    id:
      type: str | None
      description: >-
        Filter the results based on page IDs. Multiple page IDs can be specified as a comma-separated list.
      default: null
    space_id:
      type: str | None
      description: >-
        Filter the results based on space IDs. Multiple space IDs can be specified as a comma-separated list.
      default: null
    sort:
      type: str | None
      description: >-
        Used to sort the result by a particular field. One of: id, -id, created-date, -created-date, modified-date, -modified-date, title, -title.
      default: null
    status:
      type: str | None
      description: >-
        Filter the results to pages based on their status. Multiple statuses can be specified as a comma-separated list. One of: current, archived, deleted, trashed. By default, `current` and `archived` are used.
      default: null
    title:
      type: str | None
      description: >-
        Filter the results to pages based on their title.
      default: null
    body_format:
      type: str | None
      description: >-
        The content format types to be returned in the `body` field of the response. If available, the representation will be available under a response field of the same name under the `body` field. One of: storage, atlas_doc_format.
      default: null
    subtype:
      type: str | None
      description: >-
        Filter the results to pages based on their subtype. One of: live, page.
      default: null
    cursor:
      type: str | None
      description: >-
        Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header and in `_links.next`. Use the relevant `cursor` value from that URL to fetch the next page of pages.
      default: null
    limit:
      type: int | None
      description: >-
        Maximum number of pages per result to return. If more results exist, use the `Link` header or `_links.next` to retrieve a relative URL that will return the next set of results. Maximum 250.
      default: null
    base_url:
      type: str | None
      description: >-
        Confluence site base URL (e.g. https://example.atlassian.net/wiki). With
        Atlassian OAuth, use https://api.atlassian.com/ex/confluence/{cloudId}/wiki.
        Do not append /api/v2 or /rest/api.
      default: null
  steps:
    - ref: list_pages
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/api/v2/pages
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
        params:
          id: ${{ inputs.id }}
          space-id: ${{ inputs.space_id }}
          sort: ${{ inputs.sort }}
          status: ${{ inputs.status }}
          title: ${{ inputs.title }}
          body-format: ${{ inputs.body_format }}
          subtype: ${{ inputs.subtype }}
          cursor: ${{ inputs.cursor }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.list_pages.result }}
