type: action
definition:
  title: Get page by title
  description: Find a Confluence page by title within a space.
  display_group: Confluence
  doc_url: https://docs.atlassian.com/atlassian-confluence/REST/6.6.0/#content-getContent
  namespace: tools.confluence
  name: get_page_by_title
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    space_key:
      type: str
      description: Space key containing the page (e.g., DEV, TEAM).
    title:
      type: str
      description: Exact page title to retrieve.
    expand:
      type: str
      description: >
        Comma-separated fields to expand (e.g., body.storage, body.view, version, space, ancestors,
        children.attachment).
      default: body.storage,version,space
    base_url:
      type: str | None
      description: >-
        Confluence site base URL (e.g. https://example.atlassian.net/wiki). With
        Atlassian OAuth, use https://api.atlassian.com/ex/confluence/{cloudId}.
        Do not append /rest/api.
      default: null
  steps:
    - ref: lookup_page
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/rest/api/content
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
        params:
          title: ${{ inputs.title }}
          spaceKey: ${{ inputs.space_key }}
          type: page
          expand: ${{ inputs.expand }}
          limit: 1
    - ref: first_result
      action: core.script.run_python
      args:
        inputs:
          results: ${{ steps.lookup_page.result.data.results }}
        script: |
          def main(results):
              return results[0] if results else None
  returns: ${{ steps.first_result.result }}
