type: action
definition:
  title: List pages in space
  description: >-
    Returns all pages in a space, either at the root level of the space or at every depth.
  display_group: Confluence
  doc_url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-page/#api-spaces-id-pages-get
  namespace: tools.confluence
  name: list_space_pages
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    space_id:
      type: str
      description: >-
        The ID of the space for which pages should be returned. Use list_spaces with `keys` to look up a space ID from its key.
    depth:
      type: str | None
      description: >-
        Filter the results to pages at the root level of the space or to all pages in the space. One of: all, root.
      default: null
    sort:
      type: str | None
      description: >-
        Used to sort the result by a particular field. One of: id, -id, created-date, -created-date, modified-date, -modified-date, title, -title.
      default: null
    status:
      type: str | None
      description: >-
        Filter the results to pages based on their status. Multiple statuses can be specified as a comma-separated list. One of: current, archived, deleted, trashed. By default, `current` and `archived` are used.
      default: null
    title:
      type: str | None
      description: >-
        Filter the results to pages based on their title.
      default: null
    body_format:
      type: str | None
      description: >-
        The content format types to be returned in the `body` field of the response. If available, the representation will be available under a response field of the same name under the `body` field. One of: storage, atlas_doc_format.
      default: null
    cursor:
      type: str | None
      description: >-
        Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header and in `_links.next`. Use the relevant `cursor` value from that URL to fetch the next page of pages.
      default: null
    limit:
      type: int | None
      description: >-
        Maximum number of pages per result to return. If more results exist, use the `Link` header or `_links.next` to retrieve a relative URL that will return the next set of results. Maximum 250.
      default: null
    base_url:
      type: str | None
      description: >-
        Confluence base URL. With an API token, use your site URL (e.g.
        https://example.atlassian.net/wiki). With Atlassian OAuth, use the
        Atlassian API gateway URL for your site (e.g.
        https://api.atlassian.com/ex/confluence/{cloudId}). See
        https://developer.atlassian.com/cloud/confluence/oauth-2-3lo-apps/ for
        how to find your cloudId and build OAuth request URLs.
      default: null
  steps:
    - ref: list_space_pages
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/api/v2/spaces/${{ FN.url_encode(inputs.space_id) }}/pages
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
        params:
          depth: ${{ inputs.depth }}
          sort: ${{ inputs.sort }}
          status: ${{ inputs.status }}
          title: ${{ inputs.title }}
          body-format: ${{ inputs.body_format }}
          cursor: ${{ inputs.cursor }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.list_space_pages.result }}
