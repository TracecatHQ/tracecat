type: action
definition:
  title: Update page
  description: >-
    Update an existing Confluence page's title and body, incrementing the version automatically.
  display_group: Confluence
  doc_url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-page/#api-pages-id-put
  namespace: tools.confluence
  name: update_page
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    page_id:
      type: str
      description: >-
        The ID of the page to be updated.
    title:
      type: str
      description: >-
        Title of the page.
    content:
      type: str
      description: >-
        Updated page body in the selected representation. Convert Markdown to Confluence storage (XHTML) before sending if needed.
    content_representation:
      type: str
      description: >-
        The representation of the body content. One of: storage (Confluence XHTML), wiki (wiki markup), atlas_doc_format (ADF JSON string).
      default: storage
    version_comment:
      type: str | None
      description: >-
        Optional message to record with the new version.
      default: null
    parent_id:
      type: str | None
      description: >-
        ID of the parent content. This allows the page to be moved under a different parent within the same space.
      default: null
    status:
      type: str
      description: >-
        The updated status of the page. One of: current, draft.
      default: current
    base_url:
      type: str | None
      description: >-
        Confluence site base URL (e.g. https://example.atlassian.net/wiki). With
        Atlassian OAuth, use https://api.atlassian.com/ex/confluence/{cloudId}.
        Do not append /api/v2 or /rest/api.
      default: null
  steps:
    - ref: fetch_page
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/api/v2/pages/${{ FN.url_encode(inputs.page_id) }}
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          page: ${{ steps.fetch_page.result.data }}
          title: ${{ inputs.title }}
          content: ${{ inputs.content }}
          representation: ${{ inputs.content_representation }}
          version_comment: ${{ inputs.version_comment }}
          parent_id: ${{ inputs.parent_id }}
          status: ${{ inputs.status }}
        script: |
          def main(page, title, content, representation, version_comment, parent_id, status):
              version = {"number": int(page["version"]["number"]) + 1}
              if version_comment:
                  version["message"] = version_comment
              payload = {
                  "id": str(page["id"]),
                  "status": status,
                  "title": title,
                  "body": {"representation": representation, "value": content},
                  "version": version,
              }
              if parent_id:
                  payload["parentId"] = str(parent_id)
              return payload
    - ref: update_page
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/api/v2/pages/${{ FN.url_encode(inputs.page_id) }}
        method: PUT
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
          Content-Type: application/json
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.update_page.result.data }}
