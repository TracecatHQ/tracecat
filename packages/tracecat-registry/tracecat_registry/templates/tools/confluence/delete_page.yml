type: action
definition:
  title: Delete page
  description: Delete a Confluence page by ID.
  display_group: Confluence
  doc_url: https://docs.atlassian.com/atlassian-confluence/REST/6.6.0/#content-delete
  namespace: tools.confluence
  name: delete_page
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    page_id:
      type: str
      description: The ID of the page to delete.
    base_url:
      type: str | None
      description: >-
        Confluence site base URL (e.g. https://example.atlassian.net/wiki). With
        Atlassian OAuth, use https://api.atlassian.com/ex/confluence/{cloudId}.
        Do not append /rest/api.
      default: null
  steps:
    - ref: delete_page
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/rest/api/content/${{ FN.url_encode(inputs.page_id) }}
        method: DELETE
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
  returns: ${{ steps.delete_page.result.data }}
