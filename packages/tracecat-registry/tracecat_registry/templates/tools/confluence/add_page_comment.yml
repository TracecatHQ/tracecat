type: action
definition:
  title: Add comment
  description: >-
    Create a footer comment on a Confluence page, or reply to an existing footer comment.
  display_group: Confluence
  doc_url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-comment/#api-footer-comments-post
  namespace: tools.confluence
  name: add_page_comment
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    page_id:
      type: str
      description: >-
        ID of the containing page. Ignored when replying to a comment with `parent_comment_id`.
    content:
      type: str
      description: >-
        Comment body in the selected representation. Convert Markdown to Confluence storage (XHTML) before sending if needed.
    content_representation:
      type: str
      description: >-
        The representation of the body content. One of: storage (Confluence XHTML), wiki (wiki markup), atlas_doc_format (ADF JSON string).
      default: storage
    parent_comment_id:
      type: str | None
      description: >-
        ID of the parent comment, if intending to create a reply.
      default: null
    base_url:
      type: str | None
      description: >-
        Confluence site base URL (e.g. https://example.atlassian.net/wiki). With
        Atlassian OAuth, use https://api.atlassian.com/ex/confluence/{cloudId}/wiki.
        Do not append /api/v2 or /rest/api.
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          page_id: ${{ inputs.page_id }}
          content: ${{ inputs.content }}
          representation: ${{ inputs.content_representation }}
          parent_comment_id: ${{ inputs.parent_comment_id }}
        script: |
          def main(page_id, content, representation, parent_comment_id):
              payload = {"body": {"representation": representation, "value": content}}
              # Confluence rejects pageId on replies; a reply only names its parent comment.
              if parent_comment_id:
                  payload["parentCommentId"] = str(parent_comment_id)
              else:
                  payload["pageId"] = str(page_id)
              return payload
    - ref: add_comment
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/api/v2/footer-comments
        method: POST
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
          Content-Type: application/json
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.add_comment.result.data }}
