type: action
definition:
  title: Upload attachment
  description: >-
    Upload a file as an attachment to a Confluence page. Uses the v1 API because the v2 API has no attachment upload endpoint.
  display_group: Confluence
  doc_url: https://developer.atlassian.com/cloud/confluence/rest/v1/api-group-content---attachments/#api-wiki-rest-api-content-id-child-attachment-post
  namespace: tools.confluence
  name: upload_attachment
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: confluence
      keys: ["CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]
      optional: true
  expects:
    page_id:
      type: str
      description: >-
        The ID of the content to add the attachment to.
    filename:
      type: str
      description: >-
        Name of the file to upload (e.g., runbook.pdf).
    base64_content:
      type: str
      description: >-
        Base64-encoded file content.
    content_type:
      type: str
      description: >-
        MIME type of the file (e.g., "application/pdf", "image/png", "text/plain").
    minorEdit:
      type: bool
      description: >-
        If `minorEdit` is set to true, no notification email or activity stream will be generated when the attachment is added to the content.
    status:
      type: str | None
      description: >-
        The status of the content that the attachment is being added to. One of: current, draft.
      default: null
    base_url:
      type: str | None
      description: >-
        Confluence site base URL (e.g. https://example.atlassian.net/wiki). With
        Atlassian OAuth, use https://api.atlassian.com/ex/confluence/{cloudId}.
        Do not append /api/v2 or /rest/api.
      default: null
  steps:
    - ref: upload_attachment
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.confluence.base_url }}/rest/api/content/${{ FN.url_encode(inputs.page_id) }}/child/attachment
        method: POST
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.confluence.CONFLUENCE_USERNAME, SECRETS.confluence.CONFLUENCE_API_TOKEN))) }}
          X-Atlassian-Token: nocheck
        params:
          status: ${{ inputs.status }}
        form_data:
          minorEdit: ${{ "true" if inputs.minorEdit else "false" }}
        files:
          file:
            filename: ${{ inputs.filename }}
            content_base64: ${{ inputs.base64_content }}
            content_type: ${{ inputs.content_type }}
  returns: ${{ steps.upload_attachment.result }}
