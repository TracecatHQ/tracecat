type: action
definition:
  title: Query vulnerabilities
  description: >-
    Query vulnerabilities. Calls POST /v1/query directly with an OSV API-native payload.
  display_group: OSV.dev
  doc_url: https://google.github.io/osv.dev/post-v1-query/
  namespace: tools.osv
  name: query_vulnerabilities
  expects:
    payload:
      type: dict[str, Any] | None
      description: OSV API-native vulnerability query.
      default: null
    base_url:
      type: str | None
      description: Base URL of the OSV.dev API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.osv.base_url || "https://api.osv.dev" }}/v1/query
        method: POST
        headers:
          Accept: application/json
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
