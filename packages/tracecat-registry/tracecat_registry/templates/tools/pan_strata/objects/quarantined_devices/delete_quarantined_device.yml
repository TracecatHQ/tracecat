type: action
definition:
  title: Remove device from quarantine
  description: Remove a GlobalProtect device from the quarantine list with DELETE /config/objects/v1/quarantined-devices?host_id=.
  display_group: Palo Alto Networks (Strata Cloud Manager)
  doc_url: https://pan.dev/scm/api/config/ngfw/objects/delete-quarantined-devices/
  namespace: tools.pan_strata
  name: delete_quarantined_device
  secrets:
    - type: oauth
      provider_id: pan_strata
      grant_type: client_credentials
  expects:
    host_id:
      type: str
      description: Device host ID.
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable pan_strata.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: delete
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/quarantined-devices
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.pan_strata_oauth.PAN_STRATA_SERVICE_TOKEN }}
          Accept: application/json
        params:
          host_id: ${{ inputs.host_id }}
  returns: ${{ steps.delete.result }}
