type: action
definition:
  title: Create tag
  description: Create a tag in the candidate configuration with POST /config/objects/v1/tags. Tags drive dynamic address group membership. Push the candidate configuration to apply the change.
  display_group: Palo Alto Networks (Strata Cloud Manager)
  doc_url: https://pan.dev/scm/api/config/ngfw/objects/create-tags/
  namespace: tools.pan_strata
  name: create_tag
  secrets:
    - type: oauth
      provider_id: pan_strata
      grant_type: client_credentials
  expects:
    name:
      type: str
      description: Tag name (max 127 characters).
    folder:
      type: str | None
      description: Folder that contains the configuration, e.g. Shared or All Firewalls. Provide exactly one of folder, snippet, or device.
      default: null
    snippet:
      type: str | None
      description: Snippet that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    device:
      type: str | None
      description: Device (serial number) that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    color:
      type: str | None
      description: Tag color name, e.g. Red or Orange.
      default: null
    comments:
      type: str | None
      description: Tag comments.
      default: null
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable pan_strata.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          name: ${{ inputs.name }}
          folder: ${{ inputs.folder }}
          snippet: ${{ inputs.snippet }}
          device: ${{ inputs.device }}
          color: ${{ inputs.color }}
          comments: ${{ inputs.comments }}
        script: |
          def _container(folder, snippet, device):
              container = {
                  key: value
                  for key, value in (("folder", folder), ("snippet", snippet), ("device", device))
                  if value
              }
              if len(container) != 1:
                  raise ValueError("Provide exactly one of folder, snippet, or device.")
              return container


          def main(name, folder, snippet, device, color, comments):
              payload = {"name": name, **_container(folder, snippet, device)}
              if color is not None:
                  payload["color"] = color
              if comments is not None:
                  payload["comments"] = comments
              return payload
    - ref: create
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/tags
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.pan_strata_oauth.PAN_STRATA_SERVICE_TOKEN }}
          Accept: application/json
          Content-Type: application/json
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.create.result.data }}
