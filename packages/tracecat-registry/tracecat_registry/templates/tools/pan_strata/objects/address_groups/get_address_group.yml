type: action
definition:
  title: Get address group
  description: Get a address group by ID with GET /config/objects/v1/address-groups/{id}, or by name and container with GET /config/objects/v1/address-groups?name=.
  display_group: Palo Alto Networks (Strata Cloud Manager)
  doc_url: https://pan.dev/scm/api/config/ngfw/objects/get-address-groups-by-id/
  namespace: tools.pan_strata
  name: get_address_group
  secrets:
    - type: oauth
      provider_id: pan_strata
      grant_type: client_credentials
  expects:
    address_group_id:
      type: str | None
      description: Address group UUID.
      default: null
    name:
      type: str | None
      description: Name of the address group. Requires exactly one of folder, snippet, or device. Ignored when the ID is set.
      default: null
    folder:
      type: str | None
      description: Folder that contains the configuration, e.g. Shared or All Firewalls. Provide exactly one of folder, snippet, or device.
      default: null
    snippet:
      type: str | None
      description: Snippet that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    device:
      type: str | None
      description: Device (serial number) that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable pan_strata.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: build_request
      action: core.script.run_python
      args:
        inputs:
          object_id: ${{ inputs.address_group_id }}
          name: ${{ inputs.name }}
          folder: ${{ inputs.folder }}
          snippet: ${{ inputs.snippet }}
          device: ${{ inputs.device }}
        script: |
          from urllib.parse import quote

          def _container(folder, snippet, device):
              container = {
                  key: value
                  for key, value in (("folder", folder), ("snippet", snippet), ("device", device))
                  if value
              }
              if len(container) != 1:
                  raise ValueError("Provide exactly one of folder, snippet, or device.")
              return container


          def main(object_id, name, folder, snippet, device):
              params = {}
              if object_id:
                  return {"path": "/config/objects/v1/address-groups/" + quote(str(object_id), safe=""), "params": params}
              if not name:
                  raise ValueError("Provide either the object ID or a name with its container.")
              params.update(_container(folder, snippet, device))
              params["name"] = name
              return {"path": "/config/objects/v1/address-groups", "params": params}
    - ref: get
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}${{ steps.build_request.result.path }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.pan_strata_oauth.PAN_STRATA_SERVICE_TOKEN }}
          Accept: application/json
        params: ${{ steps.build_request.result.params }}
  returns: ${{ steps.get.result }}
