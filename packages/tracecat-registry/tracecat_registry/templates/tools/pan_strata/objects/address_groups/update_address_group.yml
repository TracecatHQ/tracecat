type: action
definition:
  title: Update address group
  description: Update an address group in the candidate configuration. Reads it with GET /config/objects/v1/address-groups/{id}, applies only the provided fields, and writes it with PUT /config/objects/v1/address-groups/{id}. static_members replaces the whole member list; use add_address_group_members or remove_address_group_members for incremental changes.
  display_group: Palo Alto Networks (Strata Cloud Manager)
  doc_url: https://pan.dev/scm/api/config/ngfw/objects/update-address-groups-by-id/
  namespace: tools.pan_strata
  name: update_address_group
  secrets:
    - type: oauth
      provider_id: pan_strata
      grant_type: client_credentials
  expects:
    address_group_id:
      type: str
      description: Address group UUID.
    name:
      type: str | None
      description: New name.
      default: null
    static_members:
      type: list[str] | None
      description: Names of address objects or groups for a static group.
      default: null
    dynamic_filter:
      type: str | None
      description: Tag filter for a dynamic group, e.g. 'quarantine' or 'malicious' and 'external'.
      default: null
    description:
      type: str | None
      description: New description.
      default: null
    tags:
      type: list[str] | None
      description: Replacement tag list.
      default: null
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable pan_strata.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: get
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/address-groups/${{ FN.url_encode(inputs.address_group_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.pan_strata_oauth.PAN_STRATA_SERVICE_TOKEN }}
          Accept: application/json
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          current: ${{ steps.get.result.data }}
          name: ${{ inputs.name }}
          static_members: ${{ inputs.static_members }}
          dynamic_filter: ${{ inputs.dynamic_filter }}
          description: ${{ inputs.description }}
          tags: ${{ inputs.tags }}
        script: |
          def main(current, name, static_members, dynamic_filter, description, tags):
              if static_members and dynamic_filter:
                  raise ValueError("Provide at most one of static_members or dynamic_filter.")
              body = {key: value for key, value in current.items() if key != "id"}
              if static_members:
                  body.pop("dynamic", None)
                  body["static"] = static_members
              if dynamic_filter:
                  body.pop("static", None)
                  body["dynamic"] = {"filter": dynamic_filter}
              if name is not None:
                  body["name"] = name
              if description is not None:
                  body["description"] = description
              if tags is not None:
                  body["tag"] = tags
              return body
    - ref: update
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/address-groups/${{ FN.url_encode(inputs.address_group_id) }}
        method: PUT
        headers:
          Authorization: Bearer ${{ SECRETS.pan_strata_oauth.PAN_STRATA_SERVICE_TOKEN }}
          Accept: application/json
          Content-Type: application/json
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.update.result }}
