type: action
definition:
  title: Unblock IP
  description: Unblock an IP address or CIDR range blocked with the matching block action. Removes the address object from the static address group with PUT /config/objects/v1/address-groups/{id} if it is a member, then deletes the address object with DELETE /config/objects/v1/addresses/{id} if it exists. Repeated calls are no-ops. Changes stay in the candidate configuration; run push_candidate_config to enforce them.
  display_group: Palo Alto Networks (Strata Cloud Manager)
  doc_url: https://pan.dev/scm/api/config/ngfw/objects/update-address-groups-by-id/
  namespace: tools.pan_strata
  name: unblock_ip
  secrets:
    - type: oauth
      provider_id: pan_strata
      grant_type: client_credentials
  expects:
    value:
      type: str
      description: IPv4 or IPv6 address, or CIDR range, to unblock.
    address_group:
      type: str
      description: Static address group that a deny rule references, e.g. tracecat-blocklist.
    folder:
      type: str | None
      description: Folder that contains the configuration, e.g. Shared or All Firewalls. Provide exactly one of folder, snippet, or device.
      default: null
    snippet:
      type: str | None
      description: Snippet that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    device:
      type: str | None
      description: Device (serial number) that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    name_prefix:
      type: str
      description: Prefix for generated address object names.
      default: tc-block-
    address_name:
      type: str | None
      description: Address object name to use instead of the generated name.
      default: null
    delete_address:
      type: bool
      description: Delete the address object after removing it from the group. Fails if other rules or groups still reference it.
      default: true
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable pan_strata.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: plan
      action: core.script.run_python
      args:
        inputs:
          kind: ip_or_cidr
          value: ${{ inputs.value }}
          name_prefix: ${{ inputs.name_prefix }}
          address_name: ${{ inputs.address_name }}
          folder: ${{ inputs.folder }}
          snippet: ${{ inputs.snippet }}
          device: ${{ inputs.device }}
        script: |
          import ipaddress
          import re

          FQDN_RE = re.compile(r"^(?=.{1,253}$)(\*\.)?([A-Za-z0-9_](?:[A-Za-z0-9_-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}\.?$")

          def _indicator(kind, value, name_prefix, address_name):
              value = value.strip()
              if kind == "ip":
                  ip = ipaddress.ip_address(value)
                  field, normalized = "ip_netmask", f"{ip}/{ip.max_prefixlen}"
                  label = str(ip)
              elif kind == "cidr":
                  net = ipaddress.ip_network(value, strict=False)
                  field, normalized = "ip_netmask", str(net)
                  label = str(net) if net.prefixlen != net.max_prefixlen else str(net.network_address)
              elif kind == "ip_or_cidr":
                  return _indicator("cidr" if "/" in value else "ip", value, name_prefix, address_name)
              else:
                  if not FQDN_RE.match(value):
                      raise ValueError(f"Invalid FQDN: {value}")
                  field, normalized = "fqdn", value.rstrip(".").lower()
                  label = normalized
              name = address_name or name_prefix + label.replace(":", "-").replace("/", "_").replace("*", "wildcard")
              if len(name) > 63:
                  raise ValueError(f"Address name {name} exceeds 63 characters; set address_name.")
              return {"field": field, "value": normalized, "name": name}

          def _container(folder, snippet, device):
              container = {
                  key: value
                  for key, value in (("folder", folder), ("snippet", snippet), ("device", device))
                  if value
              }
              if len(container) != 1:
                  raise ValueError("Provide exactly one of folder, snippet, or device.")
              return container


          def main(kind, value, name_prefix, address_name, folder, snippet, device):
              container = _container(folder, snippet, device)
              indicator = _indicator(kind, value, name_prefix, address_name)
              return {"indicator": indicator, "container": container, "address_params": {**container, "name": indicator["name"]}}
    - ref: lookup_group
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/address-groups
        method: GET
        headers: &id001
          Authorization: Bearer ${{ SECRETS.pan_strata_oauth.PAN_STRATA_SERVICE_TOKEN }}
          Accept: application/json
        params: '${{ FN.merge([steps.plan.result.container, {"name": inputs.address_group}]) }}'
        ignore_status_codes:
          - 404
    - ref: plan_group
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.lookup_group.result }}
          group_name: ${{ inputs.address_group }}
          address_name: ${{ steps.plan.result.indicator.name }}
        script: |
          def _first(response):
              if response.get("status_code") == 404:
                  return None
              data = response.get("data")
              if isinstance(data, dict) and isinstance(data.get("data"), list):
                  data = data["data"][0] if data["data"] else None
              if isinstance(data, dict) and data.get("id"):
                  return data
              return None


          def main(response, group_name, address_name):
              group = _first(response)
              if group is None:
                  raise ValueError(f"Address group {group_name} not found: {response.get('data')}")
              if "static" not in group:
                  raise ValueError(f"Address group {group_name} is dynamic; use a static address group.")
              members = list(group.get("static") or [])
              path = "/" + group["id"]
              if address_name not in members:
                  return {"method": "GET", "path": path, "payload": None, "changed": False}
              remaining = [member for member in members if member != address_name]
              if not remaining:
                  raise ValueError(
                      f"Removing {address_name} would leave static address group {group_name} empty, "
                      "which SCM rejects. Keep a placeholder member in the group."
                  )
              body = {key: value for key, value in group.items() if key != "id"}
              body["static"] = remaining
              return {"method": "PUT", "path": path, "payload": body, "changed": True}
    - ref: update_group
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/address-groups${{ steps.plan_group.result.path }}
        method: ${{ steps.plan_group.result.method }}
        headers:
          Authorization: Bearer ${{ SECRETS.pan_strata_oauth.PAN_STRATA_SERVICE_TOKEN }}
          Accept: application/json
          Content-Type: application/json
        payload: ${{ steps.plan_group.result.payload }}
    - ref: lookup_address
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/addresses
        method: GET
        headers: *id001
        params: ${{ steps.plan.result.address_params }}
        ignore_status_codes:
          - 404
    - ref: plan_delete
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.lookup_address.result }}
          delete_address: ${{ inputs.delete_address }}
          group_path: ${{ steps.plan_group.result.path }}
        script: |
          def _first(response):
              if response.get("status_code") == 404:
                  return None
              data = response.get("data")
              if isinstance(data, dict) and isinstance(data.get("data"), list):
                  data = data["data"][0] if data["data"] else None
              if isinstance(data, dict) and data.get("id"):
                  return data
              return None


          def main(response, delete_address, group_path):
              existing = _first(response)
              if not delete_address or existing is None:
                  # Nothing to delete: re-read the group instead.
                  return {"method": "GET", "url_path": "/address-groups" + group_path, "deleted": False}
              return {"method": "DELETE", "url_path": "/addresses/" + existing["id"], "deleted": True}
    - ref: delete_address
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1${{ steps.plan_delete.result.url_path }}
        method: ${{ steps.plan_delete.result.method }}
        headers: *id001
  returns:
    value: ${{ steps.plan.result.indicator.value }}
    address_name: ${{ steps.plan.result.indicator.name }}
    group_updated: ${{ steps.plan_group.result.changed }}
    address_deleted: ${{ steps.plan_delete.result.deleted }}
