type: action
definition:
  title: Wait for job
  description: Poll GET /config/operations/v1/jobs/{id} until the job finishes, then return the final response. Check status_str and result_str for the outcome. Fails when the job does not finish within poll_max_attempts.
  display_group: Palo Alto Networks (Strata Cloud Manager)
  doc_url: https://pan.dev/scm/api/config/ngfw/operations/get-jobs-by-id/
  namespace: tools.pan_strata
  name: wait_for_job
  secrets:
    - type: oauth
      provider_id: pan_strata
      grant_type: client_credentials
  expects:
    job_id:
      type: str
      description: Job ID, e.g. the job_id returned by push_candidate_config.
    poll_interval:
      type: float
      description: Seconds between polls.
      default: 10
    poll_max_attempts:
      type: int
      description: Maximum number of polls.
      default: 60
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable pan_strata.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: poll
      action: core.http_poll
      args:
        url: ${{ inputs.base_url || VARS.pan_strata.base_url || "https://api.strata.paloaltonetworks.com" }}/config/operations/v1/jobs/${{ FN.url_encode(inputs.job_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.pan_strata_oauth.PAN_STRATA_SERVICE_TOKEN }}
          Accept: application/json
        poll_condition: 'lambda r: bool((r.get("data") or {}).get("data")) and (r["data"]["data"][0].get("status_str") in ["FIN", "PUSHFAIL", "PUSHABORT", "PUSHTIMEOUT"] or r["data"]["data"][0].get("result_str") in ["OK", "FAIL", "CANCELLED", "TIMEOUT"])'
        poll_interval: ${{ inputs.poll_interval }}
        poll_max_attempts: ${{ inputs.poll_max_attempts }}
  returns: ${{ steps.poll.result }}
