type: action
definition:
  title: Exclude endpoints from response actions
  description: >-
    Exclude endpoints from response actions. Configures exclusions to prevent specific response
    actions from affecting selected endpoints. Note: Each exclusion supports a maximum of 2000
    endpoints. Calls POST /v3.0/response/endpointActionExceptions/register.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Endpoint/paths/~1v3.0~1response~1endpointActionExceptions~1register/post
  namespace: tools.trend_vision_one
  name: add_response_action_exclusions
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    exclusions:
      # Generic: the request body is a top-level JSON array, and each item's
      # endpoints list is a oneOf union (agentGuid or endpointName).
      type: list[dict[str, Any]]
      description: >-
        JSON array sent as the request body. Documented item fields: action (required),
        endpoints (required).
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/response/endpointActionExceptions/register
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
        payload: ${{ inputs.exclusions }}
  returns: ${{ steps.request.result }}
