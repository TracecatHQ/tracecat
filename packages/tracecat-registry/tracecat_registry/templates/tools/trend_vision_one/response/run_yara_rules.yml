type: action
definition:
  title: Run YARA rules on endpoints
  description: >-
    Run YARA rules. Run custom YARA rules on the specified endpoints. Calls POST
    /v3.0/response/endpoints/runYaraRules.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/YARA-Rule/paths/~1v3.0~1response~1endpoints~1runYaraRules/post
  namespace: tools.trend_vision_one
  name: run_yara_rules
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    endpoints:
      # Generic: the request body is a JSON array of per-target objects whose
      # documented shape is a oneOf union, so no single named field set applies.
      type: list[dict[str, Any]]
      description: >-
        JSON array sent as the request body. Documented item fields: exactly one of
        agentGuid | endpointName; exactly one of yaraRuleFileContent | yaraRuleFileId |
        yaraRuleFileName; target (required; file targets also require targetFileLocation and
        accept targetFileSize, targetFileOption; process targets accept targetProcessName);
        description.
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/response/endpoints/runYaraRules
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
        payload: ${{ inputs.endpoints }}
  returns: ${{ steps.request.result }}
