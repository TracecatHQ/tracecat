type: action
definition:
  title: List response action exclusions
  description: >-
    Get endpoint response action exclusion list. Retrieves all exclusions including response
    actions and excluded endpoints in a paginated list. Calls GET
    /v3.0/response/endpointActionExceptions.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Endpoint/paths/~1v3.0~1response~1endpointActionExceptions/get
  namespace: tools.trend_vision_one
  name: list_response_action_exclusions
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    tmv1_filter:
      type: str | None
      description: >-
        Filter for retrieving a subset of the endpoint response action exclusion list.
        Supported fields: action, endpointName, endpointAgentGuid. Sent as the TMV1-Filter
        header.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/response/endpointActionExceptions
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          TMV1-Filter: ${{ inputs.tmv1_filter }}
  returns: ${{ steps.request.result }}
