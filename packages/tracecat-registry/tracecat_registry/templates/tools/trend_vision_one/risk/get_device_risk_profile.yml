type: action
definition:
  title: Get device risk profile
  description: >-
    Get device risk profile. Displays the risk profile of the specified device. Calls GET
    /v3.0/asrm/highRiskDevices/{id}.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Device-Risk-Profile/paths/~1v3.0~1asrm~1highRiskDevices~1{id}/get
  namespace: tools.trend_vision_one
  name: get_device_risk_profile
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    id:
      type: str
      description: >-
        The ID of the device on the Trend Vision One platform.
    riskyEventScore:
      type: int | None
      description: >-
        The minimum risk score of the risk events this API endpoint returns. Provider
        default: 70.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/asrm/highRiskDevices/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
        params:
          riskyEventScore: ${{ inputs.riskyEventScore }}
  returns: ${{ steps.request.result }}
