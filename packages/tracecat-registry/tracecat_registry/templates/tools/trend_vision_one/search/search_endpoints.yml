type: action
definition:
  title: Search endpoint inventory
  description: >-
    Get detailed endpoint list. Displays detailed information about your endpoints in a
    paginated list. Calls GET /v3.0/eiqs/endpoints.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Search/paths/~1v3.0~1eiqs~1endpoints/get
  namespace: tools.trend_vision_one
  name: search_endpoints
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    tmv1_query:
      type: str
      description: >-
        The filter for retrieving a subset of the collected endpoint information data.
        Supported fields: agentGuid, loginAccount, endpointName, macAddress, ip,
        protectionManager, policyName, componentUpdatePolicy, componentUpdateStatus,
        componentVersion, osName, osVersion, productCode, installedProductCodes. Sent as the
        TMV1-Query header.
    top:
      type: int | None
      description: >-
        The number of records displayed on a page. Allowed values: 50, 100, 200. Provider
        default: 50.
      default: null
    skipToken:
      type: str | None
      description: >-
        Pagination token from the skipToken query parameter of the nextLink returned by the
        previous page. Reuse the same filters when requesting the next page.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/eiqs/endpoints
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          TMV1-Query: ${{ inputs.tmv1_query }}
        params:
          top: ${{ inputs.top }}
          skipToken: ${{ inputs.skipToken }}
  returns: ${{ steps.request.result }}
