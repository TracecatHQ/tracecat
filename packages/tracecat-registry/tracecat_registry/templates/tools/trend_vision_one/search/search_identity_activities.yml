type: action
definition:
  title: Search identity activities
  description: >-
    Get Identity and Access Activity Data. Displays search results from the Identity and Access
    Activity Data source in a paginated list. Calls GET /v3.0/search/identityActivities.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Search/paths/~1v3.0~1search~1identityActivities/get
  namespace: tools.trend_vision_one
  name: search_identity_activities
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    tmv1_query:
      type: str
      description: >-
        The statement that allows you to retrieve a subset of the collected Identity and
        Access Activity Data. Sent as the TMV1-Query header.
    top:
      type: int | None
      description: >-
        The number of records displayed on a page in default mode. Allowed values: 50, 100,
        500, 1000, 5000. Provider default: 500.
      default: null
    startDateTime:
      type: str | None
      description: >-
        The start of the data retrieval range in ISO 8601 format. Default: startDateTime
        defaults to 24 hours before the request is made.
      default: null
    endDateTime:
      type: str | None
      description: >-
        Timestamp in ISO 8601 format that indicates the end of the data retrieval time
        range. If no value is specified, 'endDateTime' defaults to the time the request is
        made.
      default: null
    mode:
      type: str | None
      description: >-
        The type of data returned by the query results ("default" displays all data returned
        by the query, "countOnly" displays the number of records returned, and "performance"
        limits the returned records to 500.). Allowed values: default, countOnly,
        performance. Provider default: default.
      default: null
    select:
      type: str | None
      description: >-
        The list of fields to include in the search results. Default: The query returns all
        supported fields if no fields are specified.
      default: null
    skipToken:
      type: str | None
      description: >-
        Pagination token from the skipToken query parameter of the nextLink returned by the
        previous page. Reuse the same filters when requesting the next page.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/search/identityActivities
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          TMV1-Query: ${{ inputs.tmv1_query }}
        params:
          top: ${{ inputs.top }}
          startDateTime: ${{ inputs.startDateTime }}
          endDateTime: ${{ inputs.endDateTime }}
          mode: ${{ inputs.mode }}
          select: ${{ inputs.select }}
          skipToken: ${{ inputs.skipToken }}
  returns: ${{ steps.request.result }}
