type: action
definition:
  title: Update Workbench alert status
  description: >-
    Modify alert status. Modifies the status of an alert or investigation triggered in
    Workbench. Calls PATCH /v3.0/workbench/alerts/{id}.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Workbench/paths/~1v3.0~1workbench~1alerts~1{id}/patch
  namespace: tools.trend_vision_one
  name: update_alert
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    id:
      type: str
      description: >-
        The unique identifier of a Workbench alert.
    if_match:
      type: str | None
      description: >-
        The ETag of the resource you want to update. Sent as the If-Match header.
      default: null
    payload:
      # Generic: a literal payload map would send null for unset optional fields,
      # which this partial-update style body does not document as accepted.
      type: dict[str, Any]
      description: >-
        API-native JSON request body. Documented fields for PATCH
        /v3.0/workbench/alerts/{id}: investigationStatus, status, investigationResult.
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/workbench/alerts/${{ FN.url_encode(inputs.id) }}
        method: PATCH
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          If-Match: ${{ inputs.if_match }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
