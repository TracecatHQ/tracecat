type: action
definition:
  title: List Observed Attack Techniques events
  description: >-
    Get Observed Attack Techniques events. Displays a list of Observed Attack Techniques events
    that match the specified criteria. Calls GET /v3.0/oat/detections.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Observed-Attack-Techniques/paths/~1v3.0~1oat~1detections/get
  namespace: tools.trend_vision_one
  name: list_oat_detections
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    tmv1_filter:
      type: str | None
      description: >-
        Filter for retrieving a subset of the collected Observed Attack Techniques events.
        Include this parameter in every request that generates paginated output. Supported
        fields: uuid, riskLevel, filterName, filterMitreTacticId, filterMitreTechniqueId,
        endpointName, agentGuid, endpointIp, productCode, containerName,
        detailCustomAssetTagKey, detailCustomAssetTagValuesOf, detailPlatformAssetTagKey,
        detailPlatformAssetTagValuesOf, groupId. Sent as the TMV1-Filter header.
      default: null
    detectedStartDateTime:
      type: str | None
      description: >-
        The start of the event detection data retrieval time range, in ISO 8601 format.
      default: null
    detectedEndDateTime:
      type: str | None
      description: >-
        The end of the event detection data retrieval time range, in ISO 8601 format.
        Default: The time you make the request.
      default: null
    ingestedStartDateTime:
      type: str | None
      description: >-
        The beginning of the data ingestion time range, in ISO 8601 format.
      default: null
    ingestedEndDateTime:
      type: str | None
      description: >-
        The end of the data ingestion time range, in ISO 8601 format.
      default: null
    top:
      type: int | None
      description: >-
        Number of records displayed on a page. Allowed values: 50, 100, 200. Provider
        default: 50.
      default: null
    skipToken:
      type: str | None
      description: >-
        Pagination token from the skipToken query parameter of the nextLink returned by the
        previous page. Reuse the same filters when requesting the next page.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/oat/detections
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          TMV1-Filter: ${{ inputs.tmv1_filter }}
        params:
          detectedStartDateTime: ${{ inputs.detectedStartDateTime }}
          detectedEndDateTime: ${{ inputs.detectedEndDateTime }}
          ingestedStartDateTime: ${{ inputs.ingestedStartDateTime }}
          ingestedEndDateTime: ${{ inputs.ingestedEndDateTime }}
          top: ${{ inputs.top }}
          skipToken: ${{ inputs.skipToken }}
  returns: ${{ steps.request.result }}
