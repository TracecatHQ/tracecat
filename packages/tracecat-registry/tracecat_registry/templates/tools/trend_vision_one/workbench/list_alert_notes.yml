type: action
definition:
  title: List alert notes
  description: >-
    Get alert notes. Displays the notes of the specified Workbench alert in a paginated list.
    Calls GET /v3.0/workbench/alerts/{alertId}/notes.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Workbench-notes/paths/~1v3.0~1workbench~1alerts~1{alertId}~1notes/get
  namespace: tools.trend_vision_one
  name: list_alert_notes
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    tmv1_filter:
      type: str | None
      description: >-
        Filter for retrieving a subset of Workbench alert notes. Sent as the TMV1-Filter
        header.
      default: null
    alertId:
      type: str
      description: >-
        Unique alphanumeric string that identifies a Workbench alert.
    startDateTime:
      type: str | None
      description: >-
        Timestamp in ISO 8601 format that indicates the start of the data retrieval time
        range. Provider default: 1970-01-01T00:00:00Z.
      default: null
    endDateTime:
      type: str | None
      description: >-
        Timestamp in ISO 8601 format that indicates the end of the data retrieval time
        range. Provider default: Current date time.
      default: null
    dateTimeTarget:
      type: str | None
      description: >-
        Parameter that allows you to filter the retrieved Workbench alert notes. Allowed
        values: createdDateTime, lastUpdatedDateTime. Provider default: createdDateTime.
      default: null
    orderBy:
      type: str | None
      description: >-
        Parameter to be used for sorting records. Records are returned in descending order
        by default. To return records in ascending order, add a phrase "asc" after the
        parameter name. Sub-sorts can be specified by a comma-separated list of property
        names. Sortable fields are as follows. Provider default: createdDateTime desc.
      default: null
    top:
      type: int | None
      description: >-
        Number of records displayed on a page. Allowed values: 50, 100, 200. Provider
        default: 50.
      default: null
    skipToken:
      type: str | None
      description: >-
        Pagination token from the skipToken query parameter of the nextLink returned by the
        previous page. Reuse the same filters when requesting the next page.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/workbench/alerts/${{ FN.url_encode(inputs.alertId) }}/notes
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          TMV1-Filter: ${{ inputs.tmv1_filter }}
        params:
          startDateTime: ${{ inputs.startDateTime }}
          endDateTime: ${{ inputs.endDateTime }}
          dateTimeTarget: ${{ inputs.dateTimeTarget }}
          orderBy: ${{ inputs.orderBy }}
          top: ${{ inputs.top }}
          skipToken: ${{ inputs.skipToken }}
  returns: ${{ steps.request.result }}
