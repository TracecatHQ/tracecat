type: action
definition:
  title: List Workbench insights
  description: >-
    Get insights list. Displays information about Workbench insights that match the specified
    criteria in a paginated list. Calls GET /v3.0/workbench/insights.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Insight/paths/~1v3.0~1workbench~1insights/get
  namespace: tools.trend_vision_one
  name: list_insights
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    tmv1_filter:
      type: str | None
      description: >-
        The filter for retrieving a subset of the insight list. Supported fields: id,
        caseId, inProcess, createdDateTime, updatedDateTime. Sent as the TMV1-Filter header.
      default: null
    orderBy:
      type: str | None
      description: >-
        The field that specifies the order in which the results are sorted. Provider
        default: updatedDateTime desc.
      default: null
    top:
      type: int | None
      description: >-
        The number of records displayed on a page. Allowed values: 50. Provider default: 50.
      default: null
    skipToken:
      type: str | None
      description: >-
        Pagination token from the skipToken query parameter of the nextLink returned by the
        previous page. Reuse the same filters when requesting the next page.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/workbench/insights
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          TMV1-Filter: ${{ inputs.tmv1_filter }}
        params:
          orderBy: ${{ inputs.orderBy }}
          top: ${{ inputs.top }}
          skipToken: ${{ inputs.skipToken }}
  returns: ${{ steps.request.result }}
