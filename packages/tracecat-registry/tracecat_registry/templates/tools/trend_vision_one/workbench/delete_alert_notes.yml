type: action
definition:
  title: Delete alert notes
  description: >-
    Delete alert notes. Deletes the specified notes from a Workbench alert. Calls POST
    /v3.0/workbench/alerts/{alertId}/notes/delete.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Workbench-notes/paths/~1v3.0~1workbench~1alerts~1{alertId}~1notes~1delete/post
  namespace: tools.trend_vision_one
  name: delete_alert_notes
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    alertId:
      type: str
      description: >-
        Unique alphanumeric string that identifies a Workbench alert.
    notes:
      # Generic: the request body is a top-level JSON array of note objects,
      # so it cannot be expressed as named body fields.
      type: list[dict[str, Any]]
      description: >-
        JSON array sent as the request body. Documented item fields: id (required).
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/workbench/alerts/${{ FN.url_encode(inputs.alertId) }}/notes/delete
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
        payload: ${{ inputs.notes }}
  returns: ${{ steps.request.result }}
