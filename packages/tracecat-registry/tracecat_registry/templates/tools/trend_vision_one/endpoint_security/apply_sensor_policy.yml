type: action
definition:
  title: Override endpoint sensor policy
  description: >-
    Override endpoint sensor policy. Overrides endpoint sensor policy settings for multiple
    endpoints. Calls POST /v3.0/endpointSecurity/endpoints/applySensorPolicy.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Endpoint-Security/paths/~1v3.0~1endpointSecurity~1endpoints~1applySensorPolicy/post
  namespace: tools.trend_vision_one
  name: apply_sensor_policy
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    payload:
      # Generic: the documented request body is a oneOf union, so there is no
      # single named field set.
      type: dict[str, Any]
      description: >-
        API-native JSON request body. Documented fields for POST
        /v3.0/endpointSecurity/endpoints/applySensorPolicy: agentGuids (required),
        sensorDetectionAndResponse (required), advancedRiskTelemetry (required).
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/endpointSecurity/endpoints/applySensorPolicy
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
