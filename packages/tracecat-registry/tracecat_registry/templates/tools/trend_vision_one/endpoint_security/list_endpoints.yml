type: action
definition:
  title: List endpoints
  description: >-
    Get endpoint list. Displays a detailed list of your endpoints. Calls GET
    /v3.0/endpointSecurity/endpoints.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Endpoint-Security/paths/~1v3.0~1endpointSecurity~1endpoints/get
  namespace: tools.trend_vision_one
  name: list_endpoints
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    tmv1_filter:
      type: str | None
      description: >-
        Filter for retrieving a subset of the endpoint information list. Supported fields:
        endpointName, agentGuid, type, edrSensorAdvancedRiskTelemetryStatus,
        edrSensorConnectivity, eppAgentProtectionManager, eppAgentEndpointGroup, osName,
        osPlatform, serviceGatewayOrProxy, osArchitecture, versionControlPolicy,
        agentUpdateStatus, agentUpdatePolicy, creditAllocatedLicenses, securityPolicy,
        securityPolicyOverriddenStatus, edrSensorStatus, edrSensorComponentUpdatePolicy,
        edrSensorComponentUpdateStatus, eppAgentStatus, eppAgentPolicyName, isolationStatus,
        eppAgentComponentVersion, eppAgentComponentUpdatePolicy,
        eppAgentComponentUpdateStatus, availableActions, securityDeployment,
        eppAgentVirtualMachineDetailsCloudInstanceId,
        eppAgentVirtualMachineDetailsCloudProvider,
        eppAgentVirtualMachineDetailsCloudAccountId,
        eppAgentVirtualMachineDetailsPowerState. Sent as the TMV1-Filter header.
      default: null
    orderBy:
      type: str | None
      description: >-
        The field by which the results are sorted. Provider default: agentGuid.
      default: null
    top:
      type: int | None
      description: >-
        Number of records displayed on a page. Allowed values: 10, 50, 100, 200, 500, 1000.
        Provider default: 100.
      default: null
    select:
      type: str | None
      description: >-
        The endpoint information to include in the response. Allowed values: endpointName,
        osName, type, ipAddresses, isolationStatus, osPlatform, osVersion, osKernelVersion,
        osArchitecture, cpuArchitecture, displayName, agentGuid, lastLoggedOnUser,
        lastUsedIp, serviceGatewayOrProxy, serialNumber, versionControlPolicy,
        agentUpdatePolicy, agentUpdateStatus, creditAllocatedLicenses, securityPolicy,
        securityPolicyOverriddenStatus, eppAgentComponentVersion,
        eppAgentComponentUpdatePolicy, eppAgentComponentUpdateStatus,
        eppAgentKernelSupportPackageVersion, eppAgentProtectionManager,
        eppAgentProductNames, eppAgentEndpointGroup, eppAgentStatus, eppAgentPolicyName,
        eppAgentVersion, eppAgentLastConnectedDateTime, eppAgentLastScannedDateTime,
        eppAgentInstalledComponentIds, eppAgentPatterns, edrSensorEndpointGroup,
        edrSensorProductNames, edrSensorVersion, edrSensorComponentUpdatePolicy,
        edrSensorComponentUpdateStatus, edrSensorKernelSupportPackageVersion,
        edrSensorConnectivity, edrSensorLastConnectedDateTime, edrSensorStatus,
        edrSensorAdvancedRiskTelemetryStatus, edrSensorPatterns,
        eppAgentVirtualMachineDetailsCloudInstanceId,
        eppAgentVirtualMachineDetailsCloudProvider,
        eppAgentVirtualMachineDetailsCloudAccountId,
        eppAgentVirtualMachineDetailsPowerState.
      default: null
    skipToken:
      type: str | None
      description: >-
        Pagination token from the skipToken query parameter of the nextLink returned by the
        previous page. Reuse the same filters when requesting the next page.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/endpointSecurity/endpoints
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          TMV1-Filter: ${{ inputs.tmv1_filter }}
        params:
          orderBy: ${{ inputs.orderBy }}
          top: ${{ inputs.top }}
          select: ${{ inputs.select }}
          skipToken: ${{ inputs.skipToken }}
  returns: ${{ steps.request.result }}
