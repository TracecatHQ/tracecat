type: action
definition:
  title: List case risk events
  description: >-
    Get risk indicators in specified case. Displays the risk indicators associated to a case ID.
    Calls GET /v3.0/caseManagement/cases/{id}/riskIndicatorEvents.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Case/paths/~1v3.0~1caseManagement~1cases~1{id}~1riskIndicatorEvents/get
  namespace: tools.trend_vision_one
  name: list_case_risk_events
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    id:
      type: str
      description: >-
        The ID of the case on the Trend Vision One platform.
    top:
      type: int | None
      description: >-
        The number of records displayed on a page. Allowed values: 10, 50, 100, 200, 500,
        1000. Provider default: 100.
      default: null
    orderBy:
      type: str | None
      description: >-
        The field by which the results are sorted. Provider default: detectedDateTime desc.
      default: null
    tmv1_filter:
      type: str | None
      description: >-
        The filter for retrieving a subset of the cloud asset information list. Supported
        fields: id, riskLevel, riskFactor, status, detectedDateTime. Sent as the TMV1-Filter
        header.
      default: null
    skipToken:
      type: str | None
      description: >-
        Pagination token from the skipToken query parameter of the nextLink returned by the
        previous page. Reuse the same filters when requesting the next page.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/caseManagement/cases/${{ FN.url_encode(inputs.id) }}/riskIndicatorEvents
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          TMV1-Filter: ${{ inputs.tmv1_filter }}
        params:
          top: ${{ inputs.top }}
          orderBy: ${{ inputs.orderBy }}
          skipToken: ${{ inputs.skipToken }}
  returns: ${{ steps.request.result }}
