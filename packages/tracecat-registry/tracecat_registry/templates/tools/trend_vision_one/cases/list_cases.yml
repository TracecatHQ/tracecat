type: action
definition:
  title: List cases
  description: >-
    Get all cases. Allows supported ticketing systems to get case info from Case Management.
    Calls GET /v3.0/caseManagement/cases.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Case/paths/~1v3.0~1caseManagement~1cases/get
  namespace: tools.trend_vision_one
  name: list_cases
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    tmv1_filter:
      type: str | None
      description: >-
        Filter for retrieving a subset of cases. Supported fields: type, priority, status.
        Sent as the TMV1-Filter header.
      default: null
    top:
      type: int | None
      description: >-
        The number of cases retrieved. If no value is specified, the request retrieves
        records for the top 50 cases. Allowed values: 10, 50, 100. Provider default: 50.
      default: null
    startDateTime:
      type: str | None
      description: >-
        The date and time of the start of data retrieval in ISO 8601 format. Provider
        default: 1970-01-01T00:00:00Z.
      default: null
    endDateTime:
      type: str | None
      description: >-
        The date and time of the end of data retrieval in ISO 8601 format retrieval time
        range. Provider default: Current date time.
      default: null
    dateTimeTarget:
      type: str | None
      description: >-
        A parameter that allows you to sort by either created date or updated date. Allowed
        values: createdDateTime, updatedDateTime. Provider default: createdDateTime.
      default: null
    orderBy:
      type: str | None
      description: >-
        A parameter to be used for sorting records. Records are returned in descending order
        by default. To return records in ascending order, add a phrase "asc" after the
        parameter name. Sub-sorts can be specified by a comma-separated list of property
        names. Provider default: createdDateTime desc.
      default: null
    skipToken:
      type: str | None
      description: >-
        Pagination token from the skipToken query parameter of the nextLink returned by the
        previous page. Reuse the same filters when requesting the next page.
      default: null
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/caseManagement/cases
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
          TMV1-Filter: ${{ inputs.tmv1_filter }}
        params:
          top: ${{ inputs.top }}
          startDateTime: ${{ inputs.startDateTime }}
          endDateTime: ${{ inputs.endDateTime }}
          dateTimeTarget: ${{ inputs.dateTimeTarget }}
          orderBy: ${{ inputs.orderBy }}
          skipToken: ${{ inputs.skipToken }}
  returns: ${{ steps.request.result }}
