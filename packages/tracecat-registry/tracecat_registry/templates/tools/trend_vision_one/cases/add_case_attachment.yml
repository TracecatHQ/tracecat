type: action
definition:
  title: Add case attachment
  description: >-
    Add an attachment. Allows supported ticketing systems to add attachments to a case in Case
    Management. Calls POST /v3.0/caseManagement/cases/{id}/attachments.
  display_group: Trend Micro (Vision One)
  doc_url: https://automation.trendmicro.com/xdr/api-v3/#tag/Case/paths/~1v3.0~1caseManagement~1cases~1{id}~1attachments/post
  namespace: tools.trend_vision_one
  name: add_case_attachment
  secrets:
    - name: trend_vision_one
      keys: ["TREND_VISION_ONE_API_KEY"]
  expects:
    id:
      type: str
      description: >-
        The case ID.
    externalAttachmentId:
      type: str | None
      description: >-
        The attachment ID in the third-party ticketing system
      default: null
    file:
      type: str
      description: >-
        Base64-encoded file content to upload.
    filename:
      type: str
      description: Name of the uploaded file, including its extension.
    base_url:
      type: str | None
      description: >-
        Trend Vision One regional API base URL. Defaults to https://api.xdr.trendmicro.com
        (United States). Other regions: https://api.eu.xdr.trendmicro.com,
        https://api.sg.xdr.trendmicro.com, https://api.au.xdr.trendmicro.com,
        https://api.in.xdr.trendmicro.com, https://api.xdr.trendmicro.co.jp,
        https://api.mea.xdr.trendmicro.com, https://api.uk.xdr.trendmicro.com,
        https://api.ca.xdr.trendmicro.com, and https://api.usgov.xdr.trendmicro.com
        (FedRAMP).
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.trend_vision_one.base_url || "https://api.xdr.trendmicro.com" }}/v3.0/caseManagement/cases/${{ FN.url_encode(inputs.id) }}/attachments
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.trend_vision_one.TREND_VISION_ONE_API_KEY }}
        files:
          file:
            filename: ${{ inputs.filename }}
            content_base64: ${{ inputs.file }}
        form_data:
          externalAttachmentId: ${{ inputs.externalAttachmentId }}
  returns: ${{ steps.request.result }}
