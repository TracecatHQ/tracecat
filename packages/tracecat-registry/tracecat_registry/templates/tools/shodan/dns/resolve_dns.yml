type: action
definition:
  title: Resolve DNS
  description: >-
    Resolve hostnames to IP addresses. Calls GET /dns/resolve directly.
  display_group: Shodan
  doc_url: https://developer.shodan.io/api#dns-resolve
  namespace: tools.shodan
  name: resolve_dns
  secrets:
    - name: shodan
      keys: ["SHODAN_API_KEY"]
  expects:
    hostnames:
      type: str
      description: Comma-separated list of hostnames; example "google.com,bing.com"
    base_url:
      type: str | None
      description: Shodan REST API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.shodan.base_url || "https://api.shodan.io" }}/dns/resolve
        method: GET
        params:
          key: ${{ SECRETS.shodan.SHODAN_API_KEY }}
          hostnames: ${{ inputs.hostnames }}
  returns: ${{ steps.request.result }}
