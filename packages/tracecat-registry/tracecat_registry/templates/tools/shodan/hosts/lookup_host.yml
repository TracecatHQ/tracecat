type: action
definition:
  title: Lookup host
  description: >-
    Look up Shodan host information. Calls GET /shodan/host/{ip} directly.
  display_group: Shodan
  doc_url: https://developer.shodan.io/api#shodan-host-details
  namespace: tools.shodan
  name: lookup_host
  secrets:
    - name: shodan
      keys: ["SHODAN_API_KEY"]
  expects:
    ip:
      type: str
      description: Host IP address.
    history:
      type: bool | None
      description: "True if all historical banners should be returned (default: False)"
      default: null
    minify:
      type: bool | None
      description: "True to only return the list of ports and the general host information, no banners. (default: False)"
      default: null
    base_url:
      type: str | None
      description: Shodan REST API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.shodan.base_url || "https://api.shodan.io" }}/shodan/host/${{ FN.url_encode(inputs.ip) }}
        method: GET
        params:
          key: ${{ SECRETS.shodan.SHODAN_API_KEY }}
          history: ${{ inputs.history }}
          minify: ${{ inputs.minify }}
  returns: ${{ steps.request.result }}
