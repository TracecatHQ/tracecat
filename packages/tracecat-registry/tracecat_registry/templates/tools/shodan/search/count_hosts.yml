type: action
definition:
  title: Count hosts
  description: >-
    Count Shodan host search matches. Calls GET /shodan/host/count directly.
  display_group: Shodan
  doc_url: https://developer.shodan.io/api#shodan-host-count
  namespace: tools.shodan
  name: count_hosts
  secrets:
    - name: shodan
      keys: ["SHODAN_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: Shodan REST API base URL.
      default: null
    query:
      type: str
      description: Shodan host search query. Use this count action as a preflight before broad searches.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.shodan.base_url || "https://api.shodan.io" }}/shodan/host/count
        method: GET
        params: '${{ FN.merge([{"key": SECRETS.shodan.SHODAN_API_KEY, "query": inputs.query}, inputs.params || {}]) }}'
  returns: ${{ steps.request.result }}
