type: action
definition:
  title: Search hosts
  description: >-
    Search Shodan host banners. Calls GET /shodan/host/search directly.
  display_group: Shodan
  doc_url: https://developer.shodan.io/api#shodan-host-search
  namespace: tools.shodan
  name: search_hosts
  secrets:
    - name: shodan
      keys: ["SHODAN_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: Shodan REST API base URL.
      default: null
    query:
      type: str
      description: Shodan host search query.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.shodan.base_url || "https://api.shodan.io" }}/shodan/host/search
        method: GET
        params: '${{ FN.merge([{"key": SECRETS.shodan.SHODAN_API_KEY, "query": inputs.query}, inputs.params || {}]) }}'
  returns: ${{ steps.request.result }}
