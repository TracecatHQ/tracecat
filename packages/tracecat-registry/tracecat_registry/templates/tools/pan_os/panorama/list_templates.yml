type: action
definition:
  title: List templates
  description: List Panorama templates with the XML API (type=config, action=get) for /config/devices/entry[@name='localhost.localdomain']/template. Returns each name, description, member templates (stacks only), and assigned firewall serial numbers.
  display_group: Palo Alto Networks (PAN-OS)
  doc_url: https://docs.paloaltonetworks.com/ngfw/api/pan-os-xml-api-request-types-and-actions/configuration-api
  namespace: tools.pan_os
  name: list_templates
  secrets:
    - name: pan_os
      keys:
        - PANOS_API_KEY
  expects:
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable pan_os.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: list
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/api/
        method: POST
        headers:
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
        form_data:
          type: config
          action: get
          xpath: /config/devices/entry[@name='localhost.localdomain']/template
        verify_ssl: ${{ inputs.verify_ssl }}
    - ref: parse
      action: core.script.run_python
      args:
        inputs:
          text: ${{ steps.list.result.data }}
          tag: template
        script: |
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape, quoteattr

          def _to_dict(element):
              node = {f"@{key}": value for key, value in element.attrib.items()}
              children = list(element)
              text = (element.text or "").strip()
              if not children:
                  if not node:
                      return text
                  if text:
                      node["#text"] = text
                  return node
              for child in children:
                  value = _to_dict(child)
                  if child.tag in node:
                      if not isinstance(node[child.tag], list):
                          node[child.tag] = [node[child.tag]]
                      node[child.tag].append(value)
                  else:
                      node[child.tag] = value
              return node

          def _parse(text):
              root = ET.fromstring(text)
              if root.get("status") != "success":
                  detail = ET.tostring(root, encoding="unicode")[:2000]
                  raise ValueError(f"PAN-OS XML API error (code {root.get('code')}): {detail}")
              return root

          def _lines(element):
              if element is None:
                  return []
              return [line.strip() for line in element.itertext() if line.strip()]


          def main(text, tag):
              root = _parse(text)
              result = []
              for entry in root.findall(f"./result/{tag}/entry"):
                  result.append({
                      "name": entry.get("name"),
                      "description": entry.findtext("description"),
                      "templates": [m.text for m in entry.findall("./templates/member")],
                      "devices": [d.get("name") for d in entry.findall("./devices/entry")],
                  })
              return result
  returns: ${{ steps.parse.result }}
