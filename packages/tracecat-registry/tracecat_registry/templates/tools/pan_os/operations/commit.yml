type: action
definition:
  title: Commit
  description: Commit the candidate configuration on a firewall or Panorama with the XML API (type=commit). Optionally commit only changes made by specific administrators. Returns the job ID, or no job ID when there is nothing to commit; use wait_for_job to wait for completion.
  display_group: Palo Alto Networks (PAN-OS)
  doc_url: https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-panorama-api/pan-os-xml-api-request-types/commit-configuration-api
  namespace: tools.pan_os
  name: commit
  secrets:
    - name: pan_os
      keys:
        - PANOS_API_KEY
  expects:
    description:
      type: str | None
      description: Commit description, e.g. the case or incident ID.
      default: null
    admins:
      type: list[str] | None
      description: Commit only changes made by these administrators (partial commit).
      default: null
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable pan_os.base_url.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: build_command
      action: core.script.run_python
      args:
        inputs:
          description: ${{ inputs.description }}
          admins: ${{ inputs.admins }}
        script: |
          from xml.sax.saxutils import escape

          def main(description, admins):
              parts = []
              if admins:
                  members = "".join(f"<member>{escape(admin)}</member>" for admin in admins)
                  parts.append(f"<partial><admin>{members}</admin></partial>")
              if description:
                  parts.append(f"<description>{escape(description)}</description>")
              return {"type": "commit", "cmd": f"<commit>{''.join(parts)}</commit>"}
    - ref: commit
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/api/
        method: POST
        headers:
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
        form_data: ${{ steps.build_command.result }}
        verify_ssl: ${{ inputs.verify_ssl }}
        timeout: 60
    - ref: parse
      action: core.script.run_python
      args:
        inputs:
          text: ${{ steps.commit.result.data }}
        script: |
          import xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape, quoteattr

          def _to_dict(element):
              node = {f"@{key}": value for key, value in element.attrib.items()}
              children = list(element)
              text = (element.text or "").strip()
              if not children:
                  if not node:
                      return text
                  if text:
                      node["#text"] = text
                  return node
              for child in children:
                  value = _to_dict(child)
                  if child.tag in node:
                      if not isinstance(node[child.tag], list):
                          node[child.tag] = [node[child.tag]]
                      node[child.tag].append(value)
                  else:
                      node[child.tag] = value
              return node

          def _parse(text):
              root = ET.fromstring(text)
              if root.get("status") != "success":
                  detail = ET.tostring(root, encoding="unicode")[:2000]
                  raise ValueError(f"PAN-OS XML API error (code {root.get('code')}): {detail}")
              return root

          def _lines(element):
              if element is None:
                  return []
              return [line.strip() for line in element.itertext() if line.strip()]


          def main(text):
              root = _parse(text)
              return {
                  "job_id": root.findtext("./result/job"),
                  "message": " ".join(_lines(root.find("./result/msg")) or _lines(root.find("./msg"))),
                  "response": _to_dict(root),
              }
  returns: ${{ steps.parse.result }}
