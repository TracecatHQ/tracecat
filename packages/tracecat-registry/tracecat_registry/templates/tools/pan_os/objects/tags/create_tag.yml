type: action
definition:
  title: Create tag
  description: Create a tag in the candidate configuration with POST /restapi/{version}/Objects/Tags?name=. Commit to apply the change.
  display_group: Palo Alto Networks (PAN-OS)
  doc_url: https://pan.dev/panos/docs/restapi/
  namespace: tools.pan_os
  name: create_tag
  secrets:
    - name: pan_os
      keys:
        - PANOS_API_KEY
  expects:
    name:
      type: str
      description: Tag name.
    color:
      type: str | None
      description: Tag color ID, e.g. color1 (red).
      default: null
    comments:
      type: str | None
      description: Tag comments.
      default: null
    location:
      type: enum["vsys", "shared", "device-group"]
      description: Configuration location. Use vsys on firewalls, device-group or shared on Panorama.
      default: vsys
    vsys:
      type: str
      description: Virtual system when location is vsys.
      default: vsys1
    device_group:
      type: str | None
      description: Panorama device group when location is device-group.
      default: null
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable pan_os.base_url.
      default: null
    api_version:
      type: str | None
      description: PAN-OS REST API version, e.g. v11.1 or v10.2. Falls back to the workspace variable pan_os.api_version, then v11.1.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          name: ${{ inputs.name }}
          color: ${{ inputs.color }}
          comments: ${{ inputs.comments }}
        script: |
          def main(name, color, comments):
              entry = {"@name": name}
              if color is not None:
                  entry["color"] = color
              if comments is not None:
                  entry["comments"] = comments
              return {"entry": entry}
    - ref: create
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/Objects/Tags
        method: POST
        headers:
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys if inputs.location == "vsys" else None }}
          device-group: ${{ inputs.device_group if inputs.location == "device-group" else None }}
          name: ${{ inputs.name }}
        verify_ssl: ${{ inputs.verify_ssl }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.create.result.data }}
