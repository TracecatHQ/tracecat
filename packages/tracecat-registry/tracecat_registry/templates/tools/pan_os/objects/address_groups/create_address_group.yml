type: action
definition:
  title: Create address group
  description: Create a static or dynamic address group in the candidate configuration with POST /restapi/{version}/Objects/AddressGroups?name=. Provide exactly one of static_members or dynamic_filter. Commit to apply the change.
  display_group: Palo Alto Networks (PAN-OS)
  doc_url: https://pan.dev/panos/docs/restapi/
  namespace: tools.pan_os
  name: create_address_group
  secrets:
    - name: pan_os
      keys:
        - PANOS_API_KEY
  expects:
    name:
      type: str
      description: Address group name (max 63 characters).
    static_members:
      type: list[str] | None
      description: Address objects or groups for a static group.
      default: null
    dynamic_filter:
      type: str | None
      description: Tag filter for a dynamic address group, e.g. 'tracecat-block'.
      default: null
    description:
      type: str | None
      description: Address group description.
      default: null
    tags:
      type: list[str] | None
      description: Tags to apply to the group.
      default: null
    location:
      type: enum["vsys", "shared", "device-group"]
      description: Configuration location. Use vsys on firewalls, device-group or shared on Panorama.
      default: vsys
    vsys:
      type: str
      description: Virtual system when location is vsys.
      default: vsys1
    device_group:
      type: str | None
      description: Panorama device group when location is device-group.
      default: null
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable pan_os.base_url.
      default: null
    api_version:
      type: str | None
      description: PAN-OS REST API version, e.g. v11.1 or v10.2. Falls back to the workspace variable pan_os.api_version, then v11.1.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          name: ${{ inputs.name }}
          static_members: ${{ inputs.static_members }}
          dynamic_filter: ${{ inputs.dynamic_filter }}
          description: ${{ inputs.description }}
          tags: ${{ inputs.tags }}
        script: |
          def main(name, static_members, dynamic_filter, description, tags):
              if bool(static_members) == bool(dynamic_filter):
                  raise ValueError("Provide exactly one of static_members or dynamic_filter.")
              entry = {"@name": name}
              if static_members:
                  entry["static"] = {"member": static_members}
              else:
                  entry["dynamic"] = {"filter": dynamic_filter}
              if description is not None:
                  entry["description"] = description
              if tags:
                  entry["tag"] = {"member": tags}
              return {"entry": entry}
    - ref: create
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/Objects/AddressGroups
        method: POST
        headers:
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys if inputs.location == "vsys" else None }}
          device-group: ${{ inputs.device_group if inputs.location == "device-group" else None }}
          name: ${{ inputs.name }}
        verify_ssl: ${{ inputs.verify_ssl }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.create.result.data }}
