type: action
definition:
  title: Remove address group members
  description: Remove members of a static address group in the candidate configuration. Reads the group with GET /restapi/{version}/Objects/AddressGroups?name= and writes it with PUT only when membership changes, so repeated calls are idempotent. Commit to apply the change.
  display_group: Palo Alto Networks (PAN-OS)
  doc_url: https://pan.dev/panos/docs/restapi/
  namespace: tools.pan_os
  name: remove_address_group_members
  secrets:
    - name: pan_os
      keys:
        - PANOS_API_KEY
  expects:
    name:
      type: str
      description: Address group name.
    members:
      type: list[str]
      description: Address objects or address groups.
    location:
      type: enum["vsys", "shared", "device-group"]
      description: Configuration location. Use vsys on firewalls, device-group or shared on Panorama.
      default: vsys
    vsys:
      type: str
      description: Virtual system when location is vsys.
      default: vsys1
    device_group:
      type: str | None
      description: Panorama device group when location is device-group.
      default: null
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable pan_os.base_url.
      default: null
    api_version:
      type: str | None
      description: PAN-OS REST API version, e.g. v11.1 or v10.2. Falls back to the workspace variable pan_os.api_version, then v11.1.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: get
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/Objects/AddressGroups
        method: GET
        headers:
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
          Accept: application/json
        params:
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys if inputs.location == "vsys" else None }}
          device-group: ${{ inputs.device_group if inputs.location == "device-group" else None }}
          name: ${{ inputs.name }}
        verify_ssl: ${{ inputs.verify_ssl }}
    - ref: plan
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.get.result }}
          name: ${{ inputs.name }}
          members: ${{ inputs.members }}
          mode: remove
        script: |
          def _entries(response):
              data = response.get("data") if isinstance(response, dict) else None
              if not isinstance(data, dict) or response.get("status_code") == 404:
                  return []
              entries = (data.get("result") or {}).get("entry") or []
              return entries if isinstance(entries, list) else [entries]

          def _sanitize(entry):
              # PAN-OS REST docs build PUT bodies from the GET entry, including the
              # @name/@location/@vsys/@device-group attributes that match the query.
              return dict(entry)

          def _members(entry):
              members = (entry.get("static") or {}).get("member") or []
              return members if isinstance(members, list) else [members]


          def main(response, name, members, mode):
              entries = _entries(response)
              if not entries:
                  raise ValueError(f"Address group {name} not found: {response.get('data')}")
              group = entries[0]
              if "static" not in group:
                  raise ValueError(f"Address group {name} is dynamic; tag the address objects instead.")
              current = _members(group)
              if mode == "add":
                  changed = [m for m in dict.fromkeys(members) if m not in current]
                  updated = current + changed
              else:
                  changed = [m for m in current if m in set(members)]
                  updated = [m for m in current if m not in set(members)]
                  if not updated and changed:
                      raise ValueError(
                          f"Removing {changed} would leave static address group {name} empty, which "
                          "PAN-OS rejects. Keep a placeholder member in the group."
                      )
              if not changed:
                  # Nothing to change: re-read the group instead of writing it.
                  return {"method": "GET", "payload": None, "changed": []}
              body = _sanitize(group)
              body["static"] = {"member": updated}
              return {"method": "PUT", "payload": {"entry": body}, "changed": changed}
    - ref: apply
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/Objects/AddressGroups
        method: ${{ steps.plan.result.method }}
        headers:
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys if inputs.location == "vsys" else None }}
          device-group: ${{ inputs.device_group if inputs.location == "device-group" else None }}
          name: ${{ inputs.name }}
        payload: ${{ steps.plan.result.payload }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns:
    response: ${{ steps.apply.result.data }}
    removed: ${{ steps.plan.result.changed }}
