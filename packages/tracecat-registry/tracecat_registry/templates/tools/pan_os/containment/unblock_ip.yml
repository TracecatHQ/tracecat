type: action
definition:
  title: Unblock IP
  description: Unblock an IP address or CIDR range blocked with the matching block action. Removes the address object from the static address group with PUT /restapi/{version}/Objects/AddressGroups if it is a member, then deletes the address object with DELETE /restapi/{version}/Objects/Addresses if it exists. Repeated calls are no-ops. Changes stay in the candidate configuration; run commit (and commit_all on Panorama) to enforce them.
  display_group: Palo Alto Networks (PAN-OS)
  doc_url: https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-panorama-api/get-started-with-the-pan-os-rest-api/work-with-address-objects-rest-api
  namespace: tools.pan_os
  name: unblock_ip
  secrets:
    - name: pan_os
      keys:
        - PANOS_API_KEY
  expects:
    value:
      type: str
      description: IPv4 or IPv6 address, or CIDR range, to unblock.
    address_group:
      type: str
      description: Static address group that a deny rule references, e.g. tracecat-blocklist.
    name_prefix:
      type: str
      description: Prefix for generated address object names.
      default: tc-block-
    address_name:
      type: str | None
      description: Address object name to use instead of the generated name.
      default: null
    location:
      type: str
      description: 'Configuration location. Use vsys on firewalls, device-group or shared on Panorama. Allowed values: vsys, shared, device-group.'
      default: vsys
    vsys:
      type: str
      description: Virtual system when location is vsys.
      default: vsys1
    device_group:
      type: str | None
      description: Panorama device group when location is device-group.
      default: null
    delete_address:
      type: bool
      description: Delete the address object after removing it from the group. Fails if other rules or groups still reference it.
      default: true
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable pan_os.base_url.
      default: null
    api_version:
      type: str | None
      description: PAN-OS REST API version, e.g. v11.1 or v10.2. Falls back to the workspace variable pan_os.api_version, then v11.1.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: plan
      action: core.script.run_python
      args:
        inputs:
          kind: ip_or_cidr
          value: ${{ inputs.value }}
          name_prefix: ${{ inputs.name_prefix }}
          address_name: ${{ inputs.address_name }}
          address_group: ${{ inputs.address_group }}
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys }}
          device_group: ${{ inputs.device_group }}
        script: |
          import ipaddress
          import re

          FQDN_RE = re.compile(r"^(?=.{1,253}$)(\*\.)?([A-Za-z0-9_](?:[A-Za-z0-9_-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}\.?$")

          def _indicator(kind, value, name_prefix, address_name):
              value = value.strip()
              if kind == "ip":
                  ip = ipaddress.ip_address(value)
                  field, normalized = "ip_netmask", f"{ip}/{ip.max_prefixlen}"
                  label = str(ip)
              elif kind == "cidr":
                  net = ipaddress.ip_network(value, strict=False)
                  field, normalized = "ip_netmask", str(net)
                  label = str(net) if net.prefixlen != net.max_prefixlen else str(net.network_address)
              elif kind == "ip_or_cidr":
                  return _indicator("cidr" if "/" in value else "ip", value, name_prefix, address_name)
              else:
                  if not FQDN_RE.match(value):
                      raise ValueError(f"Invalid FQDN: {value}")
                  field, normalized = "fqdn", value.rstrip(".").lower()
                  label = normalized
              name = address_name or name_prefix + label.replace(":", "-").replace("/", "_").replace("*", "wildcard")
              if len(name) > 63:
                  raise ValueError(f"Address name {name} exceeds 63 characters; set address_name.")
              return {"field": field, "value": normalized, "name": name}

          def _location(location, vsys, device_group):
              if location == "vsys":
                  return {"location": "vsys", "vsys": vsys or "vsys1"}
              if location == "device-group":
                  if not device_group:
                      raise ValueError("device_group is required when location is device-group.")
                  return {"location": "device-group", "device-group": device_group}
              if location == "shared":
                  return {"location": "shared"}
              raise ValueError(f"Unsupported location: {location}")


          FIELDS = {"ip_netmask": "ip-netmask", "fqdn": "fqdn"}

          def main(kind, value, name_prefix, address_name, address_group, location, vsys, device_group):
              loc = _location(location, vsys, device_group)
              indicator = _indicator(kind, value, name_prefix, address_name)
              indicator["field"] = FIELDS[indicator["field"]]
              return {
                  "indicator": indicator,
                  "address_params": {**loc, "name": indicator["name"]},
                  "group_params": {**loc, "name": address_group},
              }
    - ref: lookup_group
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/Objects/AddressGroups
        method: GET
        headers: &id001
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
          Accept: application/json
        params: ${{ steps.plan.result.group_params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        ignore_status_codes:
          - 404
    - ref: plan_group
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.lookup_group.result }}
          group_name: ${{ inputs.address_group }}
          address_name: ${{ steps.plan.result.indicator.name }}
        script: |
          def _entries(response):
              data = response.get("data") if isinstance(response, dict) else None
              if not isinstance(data, dict) or response.get("status_code") == 404:
                  return []
              entries = (data.get("result") or {}).get("entry") or []
              return entries if isinstance(entries, list) else [entries]

          def _sanitize(entry):
              # PAN-OS REST docs build PUT bodies from the GET entry, including the
              # @name/@location/@vsys/@device-group attributes that match the query.
              return dict(entry)

          def _members(entry):
              members = (entry.get("static") or {}).get("member") or []
              return members if isinstance(members, list) else [members]


          def main(response, group_name, address_name):
              entries = _entries(response)
              if not entries:
                  raise ValueError(f"Address group {group_name} not found: {response.get('data')}")
              group = entries[0]
              if "static" not in group:
                  raise ValueError(f"Address group {group_name} is dynamic; use a static address group.")
              members = _members(group)
              if address_name not in members:
                  return {"method": "GET", "payload": None, "changed": False}
              remaining = [member for member in members if member != address_name]
              if not remaining:
                  raise ValueError(
                      f"Removing {address_name} would leave static address group {group_name} empty, "
                      "which PAN-OS rejects. Keep a placeholder member in the group."
                  )
              body = _sanitize(group)
              body["static"] = {"member": remaining}
              return {"method": "PUT", "payload": {"entry": body}, "changed": True}
    - ref: update_group
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/Objects/AddressGroups
        method: ${{ steps.plan_group.result.method }}
        headers: &id002
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params: ${{ steps.plan.result.group_params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        payload: ${{ steps.plan_group.result.payload }}
    - ref: lookup_address
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/Objects/Addresses
        method: GET
        headers: *id001
        params: ${{ steps.plan.result.address_params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        ignore_status_codes:
          - 404
    - ref: plan_delete
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.lookup_address.result }}
          delete_address: ${{ inputs.delete_address }}
          address_params: ${{ steps.plan.result.address_params }}
          group_params: ${{ steps.plan.result.group_params }}
        script: |
          def _entries(response):
              data = response.get("data") if isinstance(response, dict) else None
              if not isinstance(data, dict) or response.get("status_code") == 404:
                  return []
              entries = (data.get("result") or {}).get("entry") or []
              return entries if isinstance(entries, list) else [entries]


          def main(response, delete_address, address_params, group_params):
              if not delete_address or not _entries(response):
                  # Nothing to delete: re-read the group instead.
                  return {"method": "GET", "resource": "Objects/AddressGroups", "params": group_params, "deleted": False}
              return {"method": "DELETE", "resource": "Objects/Addresses", "params": address_params, "deleted": True}
    - ref: delete_address
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/${{ steps.plan_delete.result.resource }}
        method: ${{ steps.plan_delete.result.method }}
        headers: *id002
        params: ${{ steps.plan_delete.result.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns:
    value: ${{ steps.plan.result.indicator.value }}
    address_name: ${{ steps.plan.result.indicator.name }}
    group_updated: ${{ steps.plan_group.result.changed }}
    address_deleted: ${{ steps.plan_delete.result.deleted }}
