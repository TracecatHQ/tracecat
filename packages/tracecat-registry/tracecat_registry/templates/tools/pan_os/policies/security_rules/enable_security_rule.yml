type: action
definition:
  title: Enable security rule
  description: Enable a security rule in the candidate configuration. Reads it with GET /restapi/{version}/Policies/SecurityRules?name= and writes it with PUT only when the state changes, so repeated calls are idempotent. Commit to apply the change.
  display_group: Palo Alto Networks (PAN-OS)
  doc_url: https://pan.dev/panos/docs/restapi/
  namespace: tools.pan_os
  name: enable_security_rule
  secrets:
    - name: pan_os
      keys:
        - PANOS_API_KEY
  expects:
    name:
      type: str
      description: Security rule name.
    rulebase:
      type: enum["security", "pre", "post"]
      description: Rulebase. Use security on firewalls; pre or post on Panorama, with location shared or device-group.
      default: security
    location:
      type: enum["vsys", "shared", "device-group"]
      description: Configuration location. Use vsys on firewalls, device-group or shared on Panorama.
      default: vsys
    vsys:
      type: str
      description: Virtual system when location is vsys.
      default: vsys1
    device_group:
      type: str | None
      description: Panorama device group when location is device-group.
      default: null
    base_url:
      type: str | None
      description: Firewall or Panorama management URL, e.g. https://fw.example.com. Falls back to the workspace variable pan_os.base_url.
      default: null
    api_version:
      type: str | None
      description: PAN-OS REST API version, e.g. v11.1 or v10.2. Falls back to the workspace variable pan_os.api_version, then v11.1.
      default: null
    verify_ssl:
      type: bool
      description: Verify the management TLS certificate. Prefer adding a CA_CERTIFICATE secret over disabling this.
      default: true
  steps:
    - ref: get
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/Policies/${{ "SecurityPreRules" if inputs.rulebase == "pre" else ("SecurityPostRules" if inputs.rulebase == "post" else "SecurityRules") }}
        method: GET
        headers:
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
          Accept: application/json
        params:
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys if inputs.location == "vsys" else None }}
          device-group: ${{ inputs.device_group if inputs.location == "device-group" else None }}
          name: ${{ inputs.name }}
        verify_ssl: ${{ inputs.verify_ssl }}
    - ref: plan
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.get.result }}
          disabled: false
        script: |
          def _entries(response):
              data = response.get("data") if isinstance(response, dict) else None
              if not isinstance(data, dict) or response.get("status_code") == 404:
                  return []
              entries = (data.get("result") or {}).get("entry") or []
              return entries if isinstance(entries, list) else [entries]

          def _sanitize(entry):
              # PAN-OS REST docs build PUT bodies from the GET entry, including the
              # @name/@location/@vsys/@device-group attributes that match the query.
              return dict(entry)


          def main(response, disabled):
              entries = _entries(response)
              if not entries:
                  raise ValueError(f"Security rule not found: {response.get('data')}")
              rule = entries[0]
              if (rule.get("disabled") == "yes") == disabled:
                  # Already in the requested state: re-read the rule instead of writing it.
                  return {"method": "GET", "payload": None, "changed": False}
              body = _sanitize(rule)
              body["disabled"] = "yes" if disabled else "no"
              return {"method": "PUT", "payload": {"entry": body}, "changed": True}
    - ref: apply
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.pan_os.base_url }}/restapi/${{ inputs.api_version || VARS.pan_os.api_version || "v11.1" }}/Policies/${{ "SecurityPreRules" if inputs.rulebase == "pre" else ("SecurityPostRules" if inputs.rulebase == "post" else "SecurityRules") }}
        method: ${{ steps.plan.result.method }}
        headers:
          X-PAN-KEY: ${{ SECRETS.pan_os.PANOS_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          location: ${{ inputs.location }}
          vsys: ${{ inputs.vsys if inputs.location == "vsys" else None }}
          device-group: ${{ inputs.device_group if inputs.location == "device-group" else None }}
          name: ${{ inputs.name }}
        payload: ${{ steps.plan.result.payload }}
        verify_ssl: ${{ inputs.verify_ssl }}
  returns:
    response: ${{ steps.apply.result.data }}
    changed: ${{ steps.plan.result.changed }}
