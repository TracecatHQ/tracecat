type: action
definition:
  title: Cancel SQL statement
  description: Cancel execution of a Snowflake SQL statement.
  display_group: Snowflake
  doc_url: https://docs.snowflake.com/en/developer-guide/sql-api/reference#post-apiv2statementsstatementhandlecancel
  namespace: tools.snowflake
  name: cancel_statement
  expects:
    statementHandle:
      type: str
      description: Handle of the statement to cancel.
    requestId:
      type: str | None
      description: Unique UUID for the API request.
      default: null
    base_url:
      type: str | None
      description: Snowflake account URL, for example https://org-account.snowflakecomputing.com.
      default: null
  steps:
    - ref: request
      action: tools.snowflake.call_api
      args:
        url: ${{ inputs.base_url || VARS.snowflake.base_url }}/api/v2/statements/${{ FN.url_encode(inputs.statementHandle) }}/cancel
        method: POST
        params:
          requestId: ${{ inputs.requestId }}
  returns: ${{ steps.request.result }}
