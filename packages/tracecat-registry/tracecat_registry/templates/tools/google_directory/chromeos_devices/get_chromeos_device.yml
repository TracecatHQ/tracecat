type: action
definition:
  title: Get ChromeOS device
  description: Retrieves a Chrome OS device's properties.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/chromeosdevices/get
  namespace: tools.google_directory
  name: get_chromeos_device
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer_id:
      type: str
      description: >-
        The unique ID for the customer's Google Workspace account. As an account
        administrator, you can also use the `my_customer` alias to represent
        your account's `customerId`.
      default: my_customer
    device_id:
      type: str
      description: >-
        The unique ID of the device. The `deviceId`s are returned in the
        response from the `chromeosdevices.list` method.
    projection:
      type: str | None
      description: >-
        Determines whether the response contains the full list of properties or
        only a subset. Acceptable values are `BASIC` (includes only the basic
        metadata fields, e.g. `deviceId`, `serialNumber`, `status` and `user`)
        and `FULL` (includes all metadata fields).
      default: null
  steps:
    - ref: get_chromeos_device
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: chromeosdevices
        method_name: get
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.device.chromeos.readonly"]
        params:
          customerId: ${{ inputs.customer_id }}
          deviceId: ${{ inputs.device_id }}
          projection: ${{ inputs.projection }}
  returns: ${{ steps.get_chromeos_device.result }}
