type: action
definition:
  title: Move ChromeOS devices to organizational unit
  description: Moves or inserts multiple Chrome OS devices to an organizational unit. You can move up to 50 devices at once.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/chromeosdevices/moveDevicesToOu
  namespace: tools.google_directory
  name: move_chromeos_devices_to_ou
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer_id:
      type: str
      description: Immutable. ID of the Google Workspace account.
      default: my_customer
    org_unit_path:
      type: str
      description: Full path of the target organizational unit or its ID.
    device_ids:
      type: list[str]
      description: Chrome OS devices to be moved to OU. You can move up to 50 devices at once.
  steps:
    - ref: move_chromeos_devices_to_ou
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: chromeosdevices
        method_name: moveDevicesToOu
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.device.chromeos"]
        params:
          customerId: ${{ inputs.customer_id }}
          orgUnitPath: ${{ inputs.org_unit_path }}
          body:
            deviceIds: ${{ inputs.device_ids }}
  returns: ${{ steps.move_chromeos_devices_to_ou.result }}
