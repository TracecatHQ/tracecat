type: action
definition:
  title: Issue ChromeOS device command
  description: Issues a command for the device to execute.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/customer.devices.chromeos/issueCommand
  namespace: tools.google_directory
  name: issue_chromeos_device_command
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer_id:
      type: str
      description: Immutable. ID of the Google Workspace account.
      default: my_customer
    device_id:
      type: str
      description: Immutable. ID of Chrome OS Device.
    command_type:
      type: str
      description: >-
        The type of command. Acceptable values are `REBOOT`,
        `TAKE_A_SCREENSHOT`, `SET_VOLUME`, `WIPE_USERS`, `REMOTE_POWERWASH`,
        `DEVICE_START_CRD_SESSION`, `CAPTURE_LOGS`,
        `FETCH_CRD_AVAILABILITY_INFO` and `FETCH_SUPPORT_PACKET`.
    payload:
      type: str | None
      description: >-
        The payload for the command, provide it only if command supports it. The
        following commands support adding payload: `SET_VOLUME` (payload is a
        stringified JSON object in the form `{ "volume": 50 }`, where the volume
        has to be an integer in the range [0,100]); `DEVICE_START_CRD_SESSION`
        (payload is optionally a stringified JSON object in the form
        `{ "ackedUserPresence": true, "crdSessionType": string }`); `REBOOT`
        (payload is a stringified JSON object in the form
        `{ "user_session_delay_seconds": 300 }`, where the delay has to be an
        integer in the range [0,300]); and `FETCH_SUPPORT_PACKET` (payload is
        optionally a stringified JSON object in the form
        `{"supportPacketDetails":{"issueCaseId": optional_support_case_id_string,
        "issueDescription": optional_issue_description_string,
        "requestedDataCollectors": []}}`).
      default: null
  steps:
    - ref: build_body
      action: core.script.run_python
      args:
        inputs:
          command_type: ${{ inputs.command_type }}
          payload: ${{ inputs.payload }}
        script: |
          def main(command_type, payload):
              # Values nested inside `body` are not pruned, and the Directory API
              # rejects an explicit null for `payload`.
              body = {"commandType": command_type}
              if payload is not None:
                  body["payload"] = payload
              return body
    - ref: issue_command
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: customer.devices.chromeos
        method_name: issueCommand
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.device.chromeos"]
        params:
          customerId: ${{ inputs.customer_id }}
          deviceId: ${{ inputs.device_id }}
          body: ${{ steps.build_body.result }}
  returns: ${{ steps.issue_command.result }}
