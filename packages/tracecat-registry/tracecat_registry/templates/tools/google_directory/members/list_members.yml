type: action
definition:
  title: List members
  description: >-
    Retrieves a paginated list of all members in a group. This method times out after 60 minutes.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/members/list
  namespace: tools.google_directory
  name: list_members
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    group_key:
      type: str
      description: >-
        Identifies the group in the API request. The value can be the group's email address,
        group alias, or the unique group ID.
    include_derived_membership:
      type: bool | None
      description: 'Whether to list indirect memberships. Default: false.'
      default: null
    max_results:
      type: int | None
      description: Maximum number of results to return. Max allowed value is 200.
      default: null
    page_token:
      type: str | None
      description: Token to specify next page in the list.
      default: null
    roles:
      type: str | None
      description: >-
        The `roles` query parameter allows you to retrieve group members by role. Allowed values
        are `OWNER`, `MANAGER`, and `MEMBER`.
      default: null
  steps:
    - ref: list_members
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: members
        method_name: list
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.group.member.readonly"]
        params:
          groupKey: ${{ inputs.group_key }}
          includeDerivedMembership: ${{ inputs.include_derived_membership }}
          maxResults: ${{ inputs.max_results }}
          pageToken: ${{ inputs.page_token }}
          roles: ${{ inputs.roles }}
  returns: ${{ steps.list_members.result }}
