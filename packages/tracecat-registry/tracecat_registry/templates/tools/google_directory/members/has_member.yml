type: action
definition:
  title: Check group membership
  description: >-
    Checks whether the given user is a member of the group. Membership can be direct or nested,
    but if nested, the `memberKey` and `groupKey` must be entities in the same domain or an
    `Invalid input` error is returned.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/members/hasMember
  namespace: tools.google_directory
  name: has_member
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    group_key:
      type: str
      description: >-
        Identifies the group in the API request. The value can be the group's email address,
        group alias, or the unique group ID.
    member_key:
      type: str
      description: >-
        Identifies the user member in the API request. The value can be the user's primary email
        address, alias, or unique ID.
  steps:
    - ref: has_member
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: members
        method_name: hasMember
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.group.member.readonly"]
        params:
          groupKey: ${{ inputs.group_key }}
          memberKey: ${{ inputs.member_key }}
  returns: ${{ steps.has_member.result }}
