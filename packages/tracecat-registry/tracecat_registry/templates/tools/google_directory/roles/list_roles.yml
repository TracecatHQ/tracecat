type: action
definition:
  title: List roles
  description: Retrieves a paginated list of all the roles in a domain.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/roles/list
  namespace: tools.google_directory
  name: list_roles
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer:
      type: str
      description: >-
        The unique ID for the customer's Google Workspace account. In case of a
        multi-domain account, to fetch all groups for a customer, use this field
        instead of `domain`. You can also use the `my_customer` alias to
        represent your account's `customerId`.
      default: my_customer
    max_results:
      type: int | None
      description: Maximum number of results to return.
      default: null
    page_token:
      type: str | None
      description: Token to specify the next page in the list.
      default: null
  steps:
    - ref: list_roles
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: roles
        method_name: list
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.rolemanagement.readonly"]
        params:
          customer: ${{ inputs.customer }}
          maxResults: ${{ inputs.max_results }}
          pageToken: ${{ inputs.page_token }}
  returns: ${{ steps.list_roles.result }}
