type: action
definition:
  title: Turn off two-step verification
  description: Turns off 2-Step Verification for user.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/twoStepVerification/turnOff
  namespace: tools.google_directory
  name: turn_off_two_step_verification
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    user_key:
      type: str
      description: >-
        Identifies the user in the API request. The value can be the user's primary email address, alias email address, or unique user ID.
  steps:
    - ref: turn_off_two_step_verification
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: twoStepVerification
        method_name: turnOff
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.user.security"]
        params:
          userKey: ${{ inputs.user_key }}
  returns: ${{ steps.turn_off_two_step_verification.result }}
