type: action
definition:
  title: Get organizational unit
  description: Retrieves an organizational unit.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/orgunits/get
  namespace: tools.google_directory
  name: get_orgunit
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer_id:
      type: str
      description: >-
        The unique ID for the customer's Google Workspace account. As an account administrator,
        you can also use the `my_customer` alias to represent your account's `customerId`.
      default: my_customer
    org_unit_path:
      type: str
      description: >-
        The full path of the organizational unit (minus the leading `/`) or its unique ID. For
        example, pass `corp/sales` rather than `/corp/sales`.
  steps:
    - ref: get_orgunit
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: orgunits
        method_name: get
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.orgunit.readonly"]
        params:
          customerId: ${{ inputs.customer_id }}
          orgUnitPath: ${{ inputs.org_unit_path }}
  returns: ${{ steps.get_orgunit.result }}
