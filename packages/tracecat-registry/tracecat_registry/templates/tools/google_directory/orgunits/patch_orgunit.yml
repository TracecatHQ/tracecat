type: action
definition:
  title: Patch organizational unit
  description: Updates an organizational unit. This method supports patch semantics.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/orgunits/patch
  namespace: tools.google_directory
  name: patch_orgunit
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer_id:
      type: str
      description: >-
        The unique ID for the customer's Google Workspace account. As an account administrator,
        you can also use the `my_customer` alias to represent your account's `customerId`.
      default: my_customer
    org_unit_path:
      type: str
      description: >-
        The full path of the organizational unit (minus the leading `/`) or its unique ID. For
        example, pass `corp/sales` rather than `/corp/sales`.
    body:
      # Generic: the vendor rejects `null` on optional body fields, and a literal map cannot omit
      # an unset optional because values inside a request body are not null-pruned.
      type: dict[str, Any]
      description: >-
        OrgUnit fields to update. See
        https://developers.google.com/workspace/admin/directory/reference/rest/v1/orgunits for
        the full field list. Writable fields: `name`, `parentOrgUnitPath`, `parentOrgUnitId`,
        `description`.
  steps:
    - ref: patch_orgunit
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: orgunits
        method_name: patch
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.orgunit"]
        params:
          customerId: ${{ inputs.customer_id }}
          orgUnitPath: ${{ inputs.org_unit_path }}
          body: ${{ inputs.body }}
  returns: ${{ steps.patch_orgunit.result }}
