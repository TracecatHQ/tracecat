type: action
definition:
  title: Patch user
  description: Updates a user using patch semantics.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/users/patch
  namespace: tools.google_directory
  name: patch_user
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    user_key:
      type: str
      description: >-
        Identifies the user in the API request. The value can be the user's primary email
        address, alias email address, or unique user ID.
    body:
      # Generic: the vendor rejects `null` on optional body fields and the User resource is a
      # deeply nested free-form object (`name`, `emails`, `phones`, `customSchemas`), so a
      # literal map cannot omit an unset optional.
      type: dict[str, Any]
      description: >-
        User fields to update. See
        https://developers.google.com/workspace/admin/directory/reference/rest/v1/users for the
        full field list. Most-used fields: `primaryEmail`, `name.givenName`, `name.familyName`,
        `password`, `changePasswordAtNextLogin`, `orgUnitPath`, `suspended`. This method is
        unable to clear fields that contain repeated objects (`addresses`, `phones`, etc).
  steps:
    - ref: patch_user
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: users
        method_name: patch
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.user"]
        params:
          userKey: ${{ inputs.user_key }}
          body: ${{ inputs.body }}
  returns: ${{ steps.patch_user.result }}
