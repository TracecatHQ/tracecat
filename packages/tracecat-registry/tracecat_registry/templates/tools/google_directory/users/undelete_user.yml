type: action
definition:
  title: Undelete user
  description: Undeletes a deleted user.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/users/undelete
  namespace: tools.google_directory
  name: undelete_user
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    user_key:
      type: str
      description: The immutable id of the user.
    org_unit_path:
      type: str
      description: OrgUnit of User.
  steps:
    - ref: undelete_user
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: users
        method_name: undelete
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.user"]
        params:
          userKey: ${{ inputs.user_key }}
          body:
            orgUnitPath: ${{ inputs.org_unit_path }}
  returns: ${{ steps.undelete_user.result }}
