type: action
definition:
  title: Invalidate verification codes
  description: Invalidates the current backup verification codes for the user.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/verificationCodes/invalidate
  namespace: tools.google_directory
  name: invalidate_verification_codes
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    user_key:
      type: str
      description: >-
        Email or immutable ID of the user.
  steps:
    - ref: invalidate_verification_codes
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: verificationCodes
        method_name: invalidate
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.user.security"]
        params:
          userKey: ${{ inputs.user_key }}
  returns: ${{ steps.invalidate_verification_codes.result }}
