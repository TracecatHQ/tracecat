type: action
definition:
  title: Get OAuth token
  description: Gets information about an access token issued by a user.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/tokens/get
  namespace: tools.google_directory
  name: get_token
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    user_key:
      type: str
      description: >-
        Identifies the user in the API request. The value can be the user's
        primary email address, alias email address, or unique user ID.
    client_id:
      type: str
      description: The Client ID of the application the token is issued to.
  steps:
    - ref: get_token
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: tokens
        method_name: get
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.user.security"]
        params:
          userKey: ${{ inputs.user_key }}
          clientId: ${{ inputs.client_id }}
  returns: ${{ steps.get_token.result }}
