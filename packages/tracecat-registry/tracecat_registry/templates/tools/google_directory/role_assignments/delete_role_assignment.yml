type: action
definition:
  title: Delete role assignment
  description: Deletes a role assignment.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/roleAssignments/delete
  namespace: tools.google_directory
  name: delete_role_assignment
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer:
      type: str
      description: Immutable ID of the Google Workspace account.
      default: my_customer
    role_assignment_id:
      type: str
      description: Immutable ID of the role assignment.
  steps:
    - ref: delete_role_assignment
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: roleAssignments
        method_name: delete
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.rolemanagement"]
        params:
          customer: ${{ inputs.customer }}
          roleAssignmentId: ${{ inputs.role_assignment_id }}
  returns: ${{ steps.delete_role_assignment.result }}
