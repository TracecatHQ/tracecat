type: action
definition:
  title: List groups
  description: Retrieves all groups of a domain or of a user given a userKey (paginated).
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/groups/list
  namespace: tools.google_directory
  name: list_groups
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer:
      type: str | None
      description: >-
        The unique ID for the customer's Google Workspace account. In case of a multi-domain
        account, to fetch all groups for a customer, use this field instead of `domain`. You can
        also use the `my_customer` alias to represent your account's `customerId`. Set this to
        null when scoping the request with `domain` or `user_key`.
      default: my_customer
    domain:
      type: str | None
      description: >-
        The domain name. Use this field to get groups from only one domain. To return all domains
        for a customer account, use the `customer` query parameter instead.
      default: null
    user_key:
      type: str | None
      description: >-
        Email or immutable ID of the user if only those groups are to be listed, the given user is
        a member of. If it's an ID, it should match with the ID of the user object. Cannot be used
        with the `customer` parameter.
      default: null
    query:
      type: str | None
      description: >-
        Query string search. Contains one or more search clauses, each with a field, operator, and
        value. For complete documentation, go to
        https://developers.google.com/workspace/admin/directory/v1/guides/search-groups.
      default: null
    max_results:
      type: int | None
      description: Maximum number of results to return. Max allowed value is 200.
      default: null
    page_token:
      type: str | None
      description: Token to specify next page in the list.
      default: null
    order_by:
      type: str | None
      description: Column to use for sorting results. The only allowed value is `email`.
      default: null
    sort_order:
      type: str | None
      description: >-
        Whether to return results in ascending or descending order. Only of use when orderBy is
        also used. Allowed values are `ASCENDING` and `DESCENDING`.
      default: null
  steps:
    - ref: list_groups
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: groups
        method_name: list
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.group.readonly"]
        params:
          customer: ${{ inputs.customer }}
          domain: ${{ inputs.domain }}
          userKey: ${{ inputs.user_key }}
          query: ${{ inputs.query }}
          maxResults: ${{ inputs.max_results }}
          pageToken: ${{ inputs.page_token }}
          orderBy: ${{ inputs.order_by }}
          sortOrder: ${{ inputs.sort_order }}
  returns: ${{ steps.list_groups.result }}
