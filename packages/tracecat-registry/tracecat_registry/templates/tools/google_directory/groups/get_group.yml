type: action
definition:
  title: Get group
  description: Retrieves a group's properties.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/groups/get
  namespace: tools.google_directory
  name: get_group
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    group_key:
      type: str
      description: >-
        Identifies the group in the API request. The value can be the group's email address,
        group alias, or the unique group ID.
  steps:
    - ref: get_group
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: groups
        method_name: get
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.group.readonly"]
        params:
          groupKey: ${{ inputs.group_key }}
  returns: ${{ steps.get_group.result }}
