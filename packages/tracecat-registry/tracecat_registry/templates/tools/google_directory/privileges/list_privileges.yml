type: action
definition:
  title: List privileges
  description: Retrieves a paginated list of all privileges for a customer.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/privileges/list
  namespace: tools.google_directory
  name: list_privileges
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer:
      type: str
      description: >-
        The unique ID for the customer's Google Workspace account. In case of a
        multi-domain account, to fetch all privileges for a customer, use this
        field instead of `domain`. You can also use the `my_customer` alias to
        represent your account's `customerId`.
      default: my_customer
  steps:
    - ref: list_privileges
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: privileges
        method_name: list
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.rolemanagement.readonly"]
        params:
          customer: ${{ inputs.customer }}
  returns: ${{ steps.list_privileges.result }}
