type: action
definition:
  title: Perform mobile device action
  description: Takes an action that affects a mobile device. For example, remotely wiping a device.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/mobiledevices/action
  namespace: tools.google_directory
  name: action_mobile_device
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer_id:
      type: str
      description: >-
        The unique ID for the customer's Google Workspace account. As an account
        administrator, you can also use the `my_customer` alias to represent
        your account's `customerId`.
      default: my_customer
    resource_id:
      type: str
      description: The unique ID the API service uses to identify the mobile device.
    action:
      type: str
      description: >-
        The action to be performed on the device. Acceptable values are
        `admin_account_wipe`, `admin_remote_wipe`, `approve`, `block`,
        `cancel_remote_wipe_then_activate` and `cancel_remote_wipe_then_block`.
  steps:
    - ref: action_mobile_device
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: mobiledevices
        method_name: action
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.device.mobile.action"]
        params:
          customerId: ${{ inputs.customer_id }}
          resourceId: ${{ inputs.resource_id }}
          body:
            action: ${{ inputs.action }}
  returns: ${{ steps.action_mobile_device.result }}
