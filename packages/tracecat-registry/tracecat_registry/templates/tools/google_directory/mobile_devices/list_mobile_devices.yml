type: action
definition:
  title: List mobile devices
  description: Retrieves a paginated list of all user-owned mobile devices for an account.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/mobiledevices/list
  namespace: tools.google_directory
  name: list_mobile_devices
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer_id:
      type: str
      description: >-
        The unique ID for the customer's Google Workspace account. As an account
        administrator, you can also use the `my_customer` alias to represent
        your account's `customerId`.
      default: my_customer
    max_results:
      type: int | None
      description: Maximum number of results to return. Max allowed value is 100.
      default: null
    page_token:
      type: str | None
      description: Token to specify next page in the list.
      default: null
    order_by:
      type: str | None
      description: >-
        Device property to use for sorting results. Acceptable values are
        `DEVICE_ID`, `EMAIL`, `LAST_SYNC`, `MODEL`, `NAME`, `OS`, `STATUS` and
        `TYPE`; the API's discovery document declares the equivalent `deviceId`,
        `email`, `lastSync`, `model`, `name`, `os`, `status` and `type`.
      default: null
    sort_order:
      type: str | None
      description: >-
        Whether to return results in ascending or descending order. Must be used
        with the `orderBy` parameter. Acceptable values are `ASCENDING` and
        `DESCENDING`.
      default: null
    projection:
      type: str | None
      description: >-
        Restrict information returned to a set of selected fields. Acceptable
        values are `BASIC` (includes only the basic metadata fields, e.g.
        `deviceId`, `model`, `status`, `type` and `status`) and `FULL` (includes
        all metadata fields).
      default: null
    query:
      type: str | None
      description: >-
        Search string in the format given at
        https://developers.google.com/workspace/admin/directory/v1/search-operators
      default: null
  steps:
    - ref: list_mobile_devices
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: mobiledevices
        method_name: list
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.device.mobile.readonly"]
        params:
          customerId: ${{ inputs.customer_id }}
          maxResults: ${{ inputs.max_results }}
          pageToken: ${{ inputs.page_token }}
          orderBy: ${{ inputs.order_by }}
          sortOrder: ${{ inputs.sort_order }}
          projection: ${{ inputs.projection }}
          query: ${{ inputs.query }}
  returns: ${{ steps.list_mobile_devices.result }}
