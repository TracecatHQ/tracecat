type: action
definition:
  title: Delete mobile device
  description: Removes a mobile device.
  display_group: Google Workspace Directory
  doc_url: https://developers.google.com/workspace/admin/directory/reference/rest/v1/mobiledevices/delete
  namespace: tools.google_directory
  name: delete_mobile_device
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer_id:
      type: str
      description: >-
        The unique ID for the customer's Google Workspace account. As an account
        administrator, you can also use the `my_customer` alias to represent
        your account's `customerId`.
      default: my_customer
    resource_id:
      type: str
      description: The unique ID the API service uses to identify the mobile device.
  steps:
    - ref: delete_mobile_device
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: directory_v1
        resource: mobiledevices
        method_name: delete
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.directory.device.mobile"]
        params:
          customerId: ${{ inputs.customer_id }}
          resourceId: ${{ inputs.resource_id }}
  returns: ${{ steps.delete_mobile_device.result }}
