type: action
definition:
  title: Update Drive permission
  description: Modify an existing permission
  display_group: Google Drive
  doc_url: https://developers.google.com/workspace/drive/api/reference/rest/v3/permissions/update
  namespace: tools.google_drive
  name: update_permission
  secrets:
    - type: oauth
      provider_id: google_drive
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_drive
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  # Legacy: ported from the tools.google_drive Python UDF. Inputs and output shape are a
  # published contract; do not rename or reshape them. Not a pattern for new actions.
  expects:
    file_id:
      type: str
      description: The file or folder ID
    permission_id:
      type: str
      description: The permission ID to update
    role:
      type: str
      description: "New role: reader, writer, commenter"
    fields:
      type: str
      description: 'Fields to return (''*'' for all)'
      default: "*"
  steps:
    - ref: update_permission
      action: tools.google_api.call_api
      args:
        service_name: drive
        version: v3
        resource: permissions
        method_name: update
        access_token: ${{ SECRETS.google_drive_oauth.GOOGLE_DRIVE_USER_TOKEN || SECRETS.google_drive_oauth.GOOGLE_DRIVE_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/drive"]
        params:
          fileId: ${{ inputs.file_id }}
          permissionId: ${{ inputs.permission_id }}
          fields: ${{ inputs.fields }}
          supportsAllDrives: true
          body:
            role: ${{ inputs.role }}
  returns: ${{ steps.update_permission.result }}
