type: action
definition:
  title: Get Drive file permissions
  description: List all permissions for a file
  display_group: Google Drive
  doc_url: https://developers.google.com/workspace/drive/api/reference/rest/v3/permissions/list
  namespace: tools.google_drive
  name: get_file_permissions
  secrets:
    - type: oauth
      provider_id: google_drive
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_drive
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    file_id:
      type: str
      description: The file ID
    fields:
      type: str
      description: 'Fields to return (''*'' for all)'
      default: "*"
    page_size:
      type: int | None
      description: The maximum number of permissions to return per page. When not set for files in a shared drive, at most 100 results will be returned. When not set for files that are not in a shared drive, the entire list will be returned.
      default: null
    page_token:
      type: str | None
      description: The token for continuing a previous list request on the next page. This should be set to the value of nextPageToken from the previous response.
      default: null
  steps:
    - ref: list_permissions
      action: tools.google_api.call_api
      args:
        service_name: drive
        version: v3
        resource: permissions
        method_name: list
        access_token: ${{ SECRETS.google_drive_oauth.GOOGLE_DRIVE_USER_TOKEN || SECRETS.google_drive_oauth.GOOGLE_DRIVE_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/drive.readonly"]
        params:
          fileId: ${{ inputs.file_id }}
          fields: ${{ inputs.fields }}
          pageSize: ${{ inputs.page_size }}
          pageToken: ${{ inputs.page_token }}
          supportsAllDrives: true
  returns: ${{ steps.list_permissions.result }}
