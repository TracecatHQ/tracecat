type: action
definition:
  title: Permanently delete Drive file
  description: Permanently delete a file (bypass trash)
  display_group: Google Drive
  doc_url: https://developers.google.com/workspace/drive/api/reference/rest/v3/files/delete
  namespace: tools.google_drive
  name: permanently_delete_file
  secrets:
    - type: oauth
      provider_id: google_drive
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_drive
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  # Legacy: ported from the tools.google_drive Python UDF. Inputs and output shape are a
  # published contract; do not rename or reshape them. Not a pattern for new actions.
  expects:
    file_id:
      type: str
      description: The file or folder ID to permanently delete
  steps:
    - ref: delete_file
      action: tools.google_api.call_api
      args:
        service_name: drive
        version: v3
        resource: files
        method_name: delete
        access_token: ${{ SECRETS.google_drive_oauth.GOOGLE_DRIVE_USER_TOKEN || SECRETS.google_drive_oauth.GOOGLE_DRIVE_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/drive"]
        params:
          fileId: ${{ inputs.file_id }}
          supportsAllDrives: true
    # Legacy: the Python UDF returned {"status_code": 204} on an empty response.
    # Other delete actions in this PR return the SDK's empty body as-is.
    - ref: mark_deleted
      action: core.script.run_python
      args:
        inputs:
          result: ${{ steps.delete_file.result }}
        script: |
          def main(result):
              return result or {"status_code": 204}
  returns: ${{ steps.mark_deleted.result }}
