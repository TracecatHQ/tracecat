type: action
definition:
  title: Upload Drive file
  description: Upload a file to Google Drive
  display_group: Google Drive
  doc_url: https://developers.google.com/workspace/drive/api/reference/rest/v3/files/create
  namespace: tools.google_drive
  name: upload_file
  secrets:
    - type: oauth
      provider_id: google_drive
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_drive
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    file_name:
      type: str
      description: Name for the uploaded file
    file_content:
      type: str
      description: Base64-encoded file content
    mime_type:
      type: str
      description: MIME type of file
      default: application/octet-stream
    parent_folder_id:
      type: str
      description: Parent folder ID (empty = root)
      default: ""
    fields:
      type: str
      description: 'Fields to return (''*'' for all)'
      default: "*"
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          file_name: ${{ inputs.file_name }}
          mime_type: ${{ inputs.mime_type }}
          parent_folder_id: ${{ inputs.parent_folder_id }}
          fields: ${{ inputs.fields }}
        script: |
          def main(file_name, mime_type, parent_folder_id, fields):
              body = {"name": file_name, "mimeType": mime_type}
              if parent_folder_id:
                  body["parents"] = [parent_folder_id]
              return {
                  "fields": fields,
                  "supportsAllDrives": True,
                  "body": body,
              }
    - ref: upload_file
      action: tools.google_api.call_api
      args:
        service_name: drive
        version: v3
        resource: files
        method_name: create
        access_token: ${{ SECRETS.google_drive_oauth.GOOGLE_DRIVE_USER_TOKEN || SECRETS.google_drive_oauth.GOOGLE_DRIVE_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/drive"]
        params: ${{ steps.build_params.result }}
        media:
          content_base64: ${{ inputs.file_content }}
          mime_type: ${{ inputs.mime_type }}
  returns: ${{ steps.upload_file.result }}
