type: action
definition:
  title: Get Drive file
  description: Get metadata for a specific file
  display_group: Google Drive
  doc_url: https://developers.google.com/workspace/drive/api/reference/rest/v3/files/get
  namespace: tools.google_drive
  name: get_file
  secrets:
    - type: oauth
      provider_id: google_drive
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_drive
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  # Legacy: ported from the tools.google_drive Python UDF. Inputs and output shape are a
  # published contract; do not rename or reshape them. Not a pattern for new actions.
  expects:
    file_id:
      type: str
      description: The file ID
    fields:
      type: str
      description: 'Fields to return (''*'' for all)'
      default: "*"
  steps:
    - ref: get_file
      action: tools.google_api.call_api
      args:
        service_name: drive
        version: v3
        resource: files
        method_name: get
        access_token: ${{ SECRETS.google_drive_oauth.GOOGLE_DRIVE_USER_TOKEN || SECRETS.google_drive_oauth.GOOGLE_DRIVE_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/drive.readonly"]
        params:
          fileId: ${{ inputs.file_id }}
          fields: ${{ inputs.fields }}
          supportsAllDrives: true
  returns: ${{ steps.get_file.result }}
