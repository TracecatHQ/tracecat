type: action
definition:
  title: List full scans
  description: >-
    List full scans. Calls GET /v0/orgs/{org_slug}/full-scans directly.
  display_group: Socket
  doc_url: https://docs.socket.dev/reference/getorgfullscanlist
  namespace: tools.socket
  name: list_full_scans
  secrets:
    - name: socket
      keys: ["SOCKET_API_TOKEN"]
  expects:
    org_slug:
      type: str
      description: Socket organization slug.
    sort:
      type: str | None
      description: >-
        Specify Sort order. Supported values are name and created_at. Socket defaults to
        created_at.
      default: null
    direction:
      type: str | None
      description: Specify sort direction. Supported values are asc and desc. Socket defaults to desc.
      default: null
    per_page:
      type: int | None
      description: >-
        Specify the maximum number of results to return per page. Socket defaults to 30.
      default: null
    page:
      type: int | None
      description: >-
        The page number to return when using offset-style pagination. Ignored when cursor
        pagination is used. Socket defaults to 1.
      default: null
    startAfterCursor:
      type: str | None
      description: >-
        Cursor token for pagination. Pass the returned nextPageCursor from previous responses to
        fetch the next set of results.
      default: null
    use_cursor:
      type: bool | None
      description: Set to true on the first request to opt into cursor-based pagination.
      default: null
    from:
      type: str | None
      description: A Unix timestamp in seconds that filters full-scans prior to the date.
      default: null
    workspace:
      type: str | None
      description: A repository workspace to filter full-scans by.
      default: null
    repo:
      type: str | None
      description: A repository slug to filter full-scans by.
      default: null
    branch:
      type: str | None
      description: A branch name to filter full-scans by.
      default: null
    pull_request:
      type: str | None
      description: A PR number to filter full-scans by.
      default: null
    commit_hash:
      type: str | None
      description: A commit hash to filter full-scans by.
      default: null
    scan_type:
      type: str | None
      description: >-
        A scan type to filter full-scans by (e.g. socket, socket_tier1, socket_basics).
      default: null
    base_url:
      type: str | None
      description: Base URL of the Socket API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.socket.base_url || "https://api.socket.dev" }}/v0/orgs/${{ FN.url_encode(inputs.org_slug) }}/full-scans
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.socket.SOCKET_API_TOKEN }}
        params:
          sort: ${{ inputs.sort }}
          direction: ${{ inputs.direction }}
          per_page: ${{ inputs.per_page }}
          page: ${{ inputs.page }}
          startAfterCursor: ${{ inputs.startAfterCursor }}
          use_cursor: ${{ inputs.use_cursor }}
          from: ${{ inputs.from }}
          workspace: ${{ inputs.workspace }}
          repo: ${{ inputs.repo }}
          branch: ${{ inputs.branch }}
          pull_request: ${{ inputs.pull_request }}
          commit_hash: ${{ inputs.commit_hash }}
          scan_type: ${{ inputs.scan_type }}
  returns: ${{ steps.request.result }}
