type: action
definition:
  title: Create full scan from archive
  description: >-
    Create a full scan from an archive. Calls POST /v0/orgs/{org_slug}/full-scans/archive
    directly with multipart files.
  display_group: Socket
  doc_url: https://docs.socket.dev/reference/createorgfullscanarchive
  namespace: tools.socket
  name: create_full_scan_from_archive
  secrets:
    - name: socket
      keys: ["SOCKET_API_TOKEN"]
  expects:
    org_slug:
      type: str
      description: Socket organization slug.
    files:
      type: dict[str, Any]
      description: Multipart archive files map accepted by core.http_request.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Socket API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.socket.base_url || "https://api.socket.dev" }}/v0/orgs/${{ FN.url_encode(inputs.org_slug) }}/full-scans/archive
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.socket.SOCKET_API_TOKEN }}
        params: ${{ inputs.params }}
        files: ${{ inputs.files }}
  returns: ${{ steps.request.result }}
