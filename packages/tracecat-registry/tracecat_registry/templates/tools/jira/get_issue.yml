type: action
definition:
  title: Get issue
  description: Get an issue from Jira by ID or key.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issues/#api-rest-api-3-issue-issueidorkey-get
  namespace: tools.jira
  name: get_issue
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    issue_id_or_key:
      type: str
      description: ID or key of the issue to get.
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
    fields:
      type: str
      description: >
        A list of fields to return for each issue, use it to retrieve a subset of fields.
        This parameter accepts a comma-separated list of strings. Expand options include:
        *all, *navigable, summary, comment,-description, -comment (defaults to *all).
      default: "*all"
  steps:
    - ref: resolve_auth
      action: tools.jira.resolve_auth_type
      args: {}
    - ref: get_issue
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/${{ inputs.issue_id_or_key }}
        method: GET
        params:
          fields: ${{ inputs.fields }}
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if steps.resolve_auth.result == "oauth" else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
  returns: ${{ steps.get_issue.result.data }}
