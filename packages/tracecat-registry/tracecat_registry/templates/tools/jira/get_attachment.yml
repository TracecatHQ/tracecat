type: action
definition:
  title: Get attachment metadata
  description: Get the metadata for a Jira attachment. Attachment IDs are listed in the issue's attachment field (get_issue).
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-attachments/#api-rest-api-3-attachment-id-get
  namespace: tools.jira
  name: get_attachment
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    id:
      type: str
      description: >-
        The ID of the attachment.
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
  steps:
    - ref: get_attachment
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/attachment/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
  returns: ${{ steps.get_attachment.result }}
