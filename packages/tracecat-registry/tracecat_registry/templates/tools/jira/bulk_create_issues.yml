type: action
definition:
  title: Bulk create issues
  description: Create up to 50 Jira issues in one request.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issues/#api-rest-api-3-issue-bulk-post
  namespace: tools.jira
  name: bulk_create_issues
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    issueUpdates:
      type: list[dict[str, Any]]
      description: >-
        Issues to create. Each item has the same shape as the create issue body
        (e.g. {"fields": {...}}). Rich-text fields must be Atlassian Document
        Format. Maximum 50.
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
  steps:
    - ref: bulk_create_issues
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/bulk
        method: POST
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
        payload:
          issueUpdates: ${{ inputs.issueUpdates }}
  returns: ${{ steps.bulk_create_issues.result }}
