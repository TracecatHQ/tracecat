type: action
definition:
  title: Delete issue comment
  description: Delete a comment from a Jira issue.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-comments/#api-rest-api-3-issue-issueidorkey-comment-id-delete
  namespace: tools.jira
  name: delete_issue_comment
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    issueIdOrKey:
      type: str
      description: >-
        The ID or key of the issue.
    id:
      type: str
      description: >-
        The ID of the comment.
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
  steps:
    - ref: delete_issue_comment
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/${{ FN.url_encode(inputs.issueIdOrKey) }}/comment/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
  returns: ${{ steps.delete_issue_comment.result }}
