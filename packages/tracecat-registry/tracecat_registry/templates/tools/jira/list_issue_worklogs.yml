type: action
definition:
  title: List issue worklogs
  description: Get the worklogs for a Jira issue, one page at a time.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-worklogs/#api-rest-api-3-issue-issueidorkey-worklog-get
  namespace: tools.jira
  name: list_issue_worklogs
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    issueIdOrKey:
      type: str
      description: >-
        The ID or key of the issue.
    startAt:
      type: int | None
      description: >-
        The index of the first item to return in a page of results (page
        offset).
      default: null
    maxResults:
      type: int | None
      description: >-
        The maximum number of items to return per page.
      default: null
    startedAfter:
      type: int | None
      description: >-
        The worklog start date and time, as a UNIX timestamp in milliseconds,
        after which worklogs are returned.
      default: null
    startedBefore:
      type: int | None
      description: >-
        The worklog start date and time, as a UNIX timestamp in milliseconds,
        before which worklogs are returned.
      default: null
    expand:
      type: str | None
      description: >-
        Use expand to include additional information about worklogs in the
        response. This parameter accepts`properties`, which returns worklog
        properties.
      default: null
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
  steps:
    - ref: list_issue_worklogs
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/${{ FN.url_encode(inputs.issueIdOrKey) }}/worklog
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
        params:
          startAt: ${{ inputs.startAt }}
          maxResults: ${{ inputs.maxResults }}
          startedAfter: ${{ inputs.startedAfter }}
          startedBefore: ${{ inputs.startedBefore }}
          expand: ${{ inputs.expand }}
  returns: ${{ steps.list_issue_worklogs.result }}
