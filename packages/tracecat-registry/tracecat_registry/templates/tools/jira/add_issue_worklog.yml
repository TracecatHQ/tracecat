type: action
definition:
  title: Add issue worklog
  description: Add a worklog to a Jira issue.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-worklogs/#api-rest-api-3-issue-issueidorkey-worklog-post
  namespace: tools.jira
  name: add_issue_worklog
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    issueIdOrKey:
      type: str
      description: >-
        The ID or key the issue.
    notifyUsers:
      type: bool | None
      description: >-
        Whether users watching the issue are notified by email.
      default: null
    adjustEstimate:
      type: str | None
      description: >-
        Defines how to update the issue's time estimate, the options are: `new`
        Sets the estimate to a specific value, defined in `newEstimate`. `leave`
        Leaves the estimate unchanged. `manual` Reduces the estimate by amount
        specified in `reduceBy`. `auto` Reduces the estimate by the value of
        `timeSpent` in the worklog.
      default: null
    newEstimate:
      type: str | None
      description: >-
        The value to set as the issue's remaining time estimate, as days (#d),
        hours (#h), or minutes (#m or #). For example, 2d. Required when
        `adjustEstimate` is `new`.
      default: null
    reduceBy:
      type: str | None
      description: >-
        The amount to reduce the issue's remaining estimate by, as days (#d),
        hours (#h), or minutes (#m). For example, 2d. Required when
        `adjustEstimate` is `manual`.
      default: null
    expand:
      type: str | None
      description: >-
        Use expand to include additional information about work logs in the
        response. This parameter accepts `properties`, which returns worklog
        properties.
      default: null
    started:
      type: str
      description: >-
        The datetime on which the worklog effort was started (e.g.
        2021-01-17T12:34:00.000+0000).
    timeSpent:
      type: str | None
      description: >-
        The time spent working on the issue as days (#d), hours (#h), or minutes
        (#m or #). Required if timeSpentSeconds isn't provided.
      default: null
    timeSpentSeconds:
      type: int | None
      description: >-
        The time in seconds spent working on the issue. Required if timeSpent
        isn't provided.
      default: null
    comment:
      type: str | dict[str, Any] | None
      description: >-
        A comment about the worklog in Atlassian Document Format. Plain strings
        are wrapped as ADF text paragraphs.
      default: null
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          started: ${{ inputs.started }}
          timeSpent: ${{ inputs.timeSpent }}
          timeSpentSeconds: ${{ inputs.timeSpentSeconds }}
          comment: ${{ inputs.comment }}
        script: |
          import json

          def adf(value):
              if value is None or isinstance(value, dict):
                  return value
              try:
                  parsed = json.loads(value)
              except (TypeError, ValueError):
                  parsed = None
              if isinstance(parsed, dict):
                  return parsed
              return {
                  "version": 1,
                  "type": "doc",
                  "content": [
                      {"type": "paragraph", "content": [{"type": "text", "text": value}]}
                  ],
              }

          def main(started, timeSpent, timeSpentSeconds, comment):
              payload = {"started": started}
              if timeSpent is not None:
                  payload["timeSpent"] = timeSpent
              if timeSpentSeconds is not None:
                  payload["timeSpentSeconds"] = timeSpentSeconds
              if comment is not None:
                  payload["comment"] = adf(comment)
              return payload
    - ref: add_issue_worklog
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/${{ FN.url_encode(inputs.issueIdOrKey) }}/worklog
        method: POST
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
        params:
          notifyUsers: ${{ inputs.notifyUsers }}
          adjustEstimate: ${{ inputs.adjustEstimate }}
          newEstimate: ${{ inputs.newEstimate }}
          reduceBy: ${{ inputs.reduceBy }}
          expand: ${{ inputs.expand }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.add_issue_worklog.result }}
