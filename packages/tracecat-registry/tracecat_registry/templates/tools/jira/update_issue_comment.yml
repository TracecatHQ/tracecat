type: action
definition:
  title: Update issue comment
  description: Update a comment on a Jira issue.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-comments/#api-rest-api-3-issue-issueidorkey-comment-id-put
  namespace: tools.jira
  name: update_issue_comment
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    issueIdOrKey:
      type: str
      description: >-
        The ID or key of the issue.
    id:
      type: str
      description: >-
        The ID of the comment.
    notifyUsers:
      type: bool | None
      description: >-
        Whether users are notified when a comment is updated.
      default: null
    expand:
      type: str | None
      description: >-
        Use expand to include additional information about comments in the
        response. This parameter accepts `renderedBody`, which returns the
        comment body rendered in HTML.
      default: null
    body:
      type: str | dict[str, Any]
      description: >-
        The comment text in Atlassian Document Format. Plain strings are wrapped
        as ADF text paragraphs. JSON object strings are deserialized.
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          body: ${{ inputs.body }}
        script: |
          import json

                    def adf(value):
                        if value is None or isinstance(value, dict):
                            return value
                        try:
                            parsed = json.loads(value)
                        except (TypeError, ValueError):
                            parsed = None
                        if isinstance(parsed, dict):
                            return parsed
                        return {
                            "version": 1,
                            "type": "doc",
                            "content": [
                                {"type": "paragraph", "content": [{"type": "text", "text": value}]}
                            ],
                        }

          def main(body):
              return {"body": adf(body)}
    - ref: update_issue_comment
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/${{ FN.url_encode(inputs.issueIdOrKey) }}/comment/${{ FN.url_encode(inputs.id) }}
        method: PUT
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
        params:
          notifyUsers: ${{ inputs.notifyUsers }}
          expand: ${{ inputs.expand }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.update_issue_comment.result }}
