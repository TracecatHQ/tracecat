type: action
definition:
  title: Upload attachment
  description: Upload an attachment to a Jira issue.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-attachments/#api-rest-api-3-issue-issueidorkey-attachments-post
  namespace: tools.jira
  name: upload_attachment
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    base64_content:
      type: str
      description: Base64 encoded content of the file to upload.
    filename:
      type: str
      description: Name of the file to upload.
    content_type:
      type: str
      description: MIME type of the file (e.g., "application/pdf", "image/png", "text/plain").
    ticket:
      type: str
      description: Jira issue key or ID to upload the attachment to (e.g., "PROJ-123").
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
  steps:
    - ref: resolve_auth
      action: tools.jira.resolve_auth_type
      args: {}
    - ref: upload_attachment
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/${{ inputs.ticket }}/attachments
        method: POST
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if steps.resolve_auth.result == "oauth" else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
          X-Atlassian-Token: nocheck
        files:
          file:
            filename: ${{ inputs.filename }}
            content_base64: ${{ inputs.base64_content }}
            content_type: ${{ inputs.content_type }}
  returns: ${{ steps.upload_attachment.result.data }}
