type: action
definition:
  title: Search issues
  description: Search for issues in Jira using JQL.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-search/#api-rest-api-3-search-jql-get
  namespace: tools.jira
  name: search_issues
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    jql:
      type: str
      description: JQL query to search for issues.
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
    next_page:
      type: str
      description: Next page token to get the next page of results. If not provided, the first page of results will be returned.
      default: null
    max_results:
      type: int
      description: Maximum number of results to return.
      default: 100
    fields:
      type: str
      description: >
        A list of fields to return for each issue, use it to retrieve a subset of fields.
        This parameter accepts a comma-separated list. Expand options include: *all, *navigable, summary, comment, -description, -comment (defaults to id).
      default: "id"
  steps:
    - ref: resolve_auth
      action: tools.jira.resolve_auth_type
      args: {}
    - ref: search_issues
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/search/jql
        method: GET
        params:
          fields: ${{ inputs.fields }}
          jql: ${{ inputs.jql }}
          maxResults: ${{ inputs.max_results }}
          nextPageToken: ${{ inputs.next_page }}
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if steps.resolve_auth.result == "oauth" else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
  returns: ${{ steps.search_issues.result.data }}
