type: action
definition:
  title: Assign issue
  description: Assign an issue to a user.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issues/#api-rest-api-3-issue-issueidorkey-assignee-put
  namespace: tools.jira
  name: assign_issue
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
    issue_key:
      type: str
      description: Jira issue key (e.g. TC-123)
    user_id:
      type: str
      description: Jira user ID (e.g. 1234567890)
  steps:
    - ref: resolve_auth
      action: tools.jira.resolve_auth_type
      args: {}
    - ref: assign_issue
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/${{ inputs.issue_key }}/assignee
        method: PUT
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if steps.resolve_auth.result == "oauth" else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
        payload:
          accountId: ${{ inputs.user_id }}
  returns: ${{ steps.assign_issue.result.data }}
