type: action
definition:
  title: Get priorities by scheme
  description: Get a list of priorities from Jira for a given priority scheme.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-priority-schemes/#api-rest-api-3-priorityscheme-schemeid-priorities-get
  namespace: tools.jira
  name: get_priorities
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    priority_scheme_id:
      type: str
      description: Jira priority scheme ID.
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
    limit:
      type: int
      description: Maximum number of priorities to return.
      default: 50
  steps:
    - ref: resolve_auth
      action: tools.jira.resolve_auth_type
      args: {}
    - ref: get_priorities
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/priorityscheme/${{ inputs.priority_scheme_id }}/priorities
        method: GET
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if steps.resolve_auth.result == "oauth" else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
        params:
          maxResults: ${{ inputs.limit }}
  returns: ${{ steps.get_priorities.result.data.values }}
