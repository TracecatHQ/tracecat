type: action
definition:
  title: Remove issue watcher
  description: Remove a user as a watcher of a Jira issue.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issue-watchers/#api-rest-api-3-issue-issueidorkey-watchers-delete
  namespace: tools.jira
  name: remove_issue_watcher
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    issueIdOrKey:
      type: str
      description: >-
        The ID or key of the issue.
    accountId:
      type: str
      description: >-
        The account ID of the user, which uniquely identifies the user across
        all Atlassian products. For example, 5b10ac8d82e05b22cc7d4ef5.
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
  steps:
    - ref: remove_issue_watcher
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/${{ FN.url_encode(inputs.issueIdOrKey) }}/watchers
        method: DELETE
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
        params:
          accountId: ${{ inputs.accountId }}
  returns: ${{ steps.remove_issue_watcher.result }}
