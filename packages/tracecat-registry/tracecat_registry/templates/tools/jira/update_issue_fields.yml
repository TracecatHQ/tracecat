type: action
definition:
  title: Update issue fields
  description: Update the fields of an existing issue in Jira.
  display_group: Jira
  doc_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/api-group-issues/#api-rest-api-3-issue-issueidorkey-put
  namespace: tools.jira
  name: update_issue_fields
  secrets:
    - type: oauth
      provider_id: atlassian
      grant_type: authorization_code
      optional: true
    - name: jira
      keys: ["JIRA_USEREMAIL", "JIRA_API_TOKEN"]
      optional: true
  expects:
    issue_id_or_key:
      type: str
      description: ID or key of the issue to update.
    fields:
      type: list[dict[str, Any]]
      description: >-
        List of fields to update in the issue. ADF values can be passed as objects.

        For example usage:
        ```
        [
          {"customfield_10000": "New value"},
          {"customfield_10001": {"version": 1, "type": "doc", "content": []}}
        ]
        ```
    base_url:
      type: str | None
      description: >-
        Jira tenant URL (e.g. https://your-domain.atlassian.net). With Atlassian
        OAuth, use https://api.atlassian.com/ex/jira/{cloudId}.
      default: null
  steps:
    - ref: resolve_auth
      action: tools.jira.resolve_auth_type
      args: {}
    - ref: update_issue
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.jira.base_url }}/rest/api/3/issue/${{ inputs.issue_id_or_key }}
        method: PUT
        headers:
          Authorization: ${{ FN.format("Bearer {}", SECRETS.atlassian_oauth.ATLASSIAN_USER_TOKEN) if steps.resolve_auth.result == "oauth" else FN.format("Basic {}", FN.to_base64(FN.format("{}:{}", SECRETS.jira.JIRA_USEREMAIL, SECRETS.jira.JIRA_API_TOKEN))) }}
        payload:
          fields: ${{ FN.merge(inputs.fields) }}
  returns: ${{ steps.update_issue.result.data }}
