type: action
definition:
  title: Update pull request
  description: 'Update pull request. Calls PATCH /repos/{owner}/{repo}/pulls/{pull_number} directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: update_pull_request
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    pull_number:
      type: int
      description: GitHub API path value for pull_number.
    payload:
      # Generic: this endpoint rejects an explicit null on optional body fields, and a
      # literal payload map cannot omit an unset optional. Fields are in the description.
      type: dict[str, Any] | None
      description: 'API-native request body passed through without validation. Body fields documented for PATCH /repos/{owner}/{repo}/pulls/{pull_number}: title, body, state, base, maintainer_can_modify.'
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/pulls/${{ FN.url_encode(inputs.pull_number) }}
      method: PATCH
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
