type: action
definition:
  title: Get workflow run
  description: 'Get workflow run. Calls GET /repos/{owner}/{repo}/actions/runs/{run_id} directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: get_workflow_run
  secrets:
  - type: oauth
    provider_id: github_app
    grant_type: client_credentials
    optional: true
  - type: oauth
    provider_id: github_app
    grant_type: authorization_code
    optional: true
  - type: oauth
    provider_id: github
    grant_type: authorization_code
    optional: true
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    run_id:
      type: int
      description: GitHub API path value for run_id.
    exclude_pull_requests:
      type: bool | None
      description: If `true` pull requests are omitted from the response (empty array).
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
    auth_mode:
      type: enum["auto", "delegated", "application"]
      description: >-
        OAuth connection to use. `delegated` uses the user token, `application`
        uses the service token, and `auto` uses whichever is connected, trying
        application first, then delegated.
      default: auto
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/actions/runs/${{ FN.url_encode(inputs.run_id) }}
      method: GET
      headers:
        Authorization: Bearer ${{ (SECRETS.github_app_oauth.GITHUB_APP_USER_TOKEN || SECRETS.github_oauth.GITHUB_USER_TOKEN) if inputs.auth_mode == "delegated" else SECRETS.github_app_oauth.GITHUB_APP_SERVICE_TOKEN if inputs.auth_mode == "application" else SECRETS.github_app_oauth.GITHUB_APP_SERVICE_TOKEN || SECRETS.github_app_oauth.GITHUB_APP_USER_TOKEN || SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params:
        exclude_pull_requests: ${{ inputs.exclude_pull_requests }}
  returns: ${{ steps.request.result }}
