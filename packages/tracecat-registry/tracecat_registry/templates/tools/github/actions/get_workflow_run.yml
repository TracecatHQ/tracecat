type: action
definition:
  title: Get workflow run
  description: 'Get workflow run. Calls GET /repos/{owner}/{repo}/actions/runs/{run_id} directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: get_workflow_run
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    run_id:
      type: int
      description: GitHub API path value for run_id.
    exclude_pull_requests:
      type: bool | None
      description: If `true` pull requests are omitted from the response (empty array).
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/actions/runs/${{ FN.url_encode(inputs.run_id) }}
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params:
        exclude_pull_requests: ${{ inputs.exclude_pull_requests }}
  returns: ${{ steps.request.result }}
