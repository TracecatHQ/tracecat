type: action
definition:
  title: List workflow run jobs
  description: 'List workflow run jobs. Calls GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: list_workflow_run_jobs
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    run_id:
      type: int
      description: GitHub API path value for run_id.
    filter:
      type: str | None
      description: 'Filters jobs by their `completed_at` timestamp. `latest` returns jobs from the most recent execution of the workflow run. `all` returns all jobs for a workflow run, including from old executions of the workflow run. Can be one of: `latest`, `all`.'
      default: null
    per_page:
      type: int | None
      description: The number of results per page (max 100).
      default: null
    page:
      type: int | None
      description: The page number of the results to fetch.
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/actions/runs/${{ FN.url_encode(inputs.run_id) }}/jobs
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params:
        filter: ${{ inputs.filter }}
        per_page: ${{ inputs.per_page }}
        page: ${{ inputs.page }}
  returns: ${{ steps.request.result }}
