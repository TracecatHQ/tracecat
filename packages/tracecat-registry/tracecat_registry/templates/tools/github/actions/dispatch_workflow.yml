type: action
definition:
  title: Dispatch workflow
  description: 'Dispatch workflow. Calls POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: dispatch_workflow
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    workflow_id:
      type: str | int
      description: GitHub API path value for workflow_id.
    payload:
      # Free-form: the vendor documents this body as carrying an `inputs` map with `additionalProperties: true`, i.e. keys defined per workflow, so there is
      # no single field set to enumerate.
      type: dict[str, Any] | None
      description: 'API-native request body passed through without validation. Body fields documented for POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches: ref (required), inputs, return_run_details.'
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/actions/workflows/${{ FN.url_encode(inputs.workflow_id) }}/dispatches
      method: POST
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
