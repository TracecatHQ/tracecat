type: action
definition:
  title: Download artifact
  description: 'Download artifact. Calls GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}/{archive_format} directly. Accepted OAuth scopes: repo (default; omit only for public repository data). GitHub Enterprise Server availability depends on the installed GHES version.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: download_artifact
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    artifact_id:
      type: str
      description: GitHub API path value for artifact_id.
    archive_format:
      type: str
      description: GitHub API path value for archive_format.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    base_url:
      type: str
      description: GitHub REST API base URL. `VARS.github.base_url` overrides this value.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ VARS.github.base_url || inputs.base_url }}/repos/${{ FN.url_encode_component(inputs.owner) }}/${{ FN.url_encode_component(inputs.repo) }}/actions/artifacts/${{ FN.url_encode_component(inputs.artifact_id) }}/${{ FN.url_encode_component(inputs.archive_format) }}
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params: ${{ inputs.params }}
      follow_redirects: true
      base64_encode_data: true
  returns: ${{ steps.request.result }}
