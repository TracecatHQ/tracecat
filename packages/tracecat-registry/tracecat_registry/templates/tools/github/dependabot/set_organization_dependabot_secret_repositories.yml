type: action
definition:
  title: Set Organization Dependabot Secret Repositories
  description: 'Set organization dependabot secret repositories. Calls PUT /orgs/{org}/dependabot/secrets/{secret_name}/repositories directly. Accepted OAuth scopes: admin:org. GitHub Enterprise Server availability depends on the installed GHES version. The repository assignment payload replaces the complete selected set.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: set_organization_dependabot_secret_repositories
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    org:
      type: str
      description: GitHub API path value for org.
    secret_name:
      type: str
      description: GitHub API path value for secret_name.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    payload:
      type: dict[str, Any] | None
      description: API-native request body passed through without validation.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ SECRETS.github_oauth.GITHUB_API_BASE_URL }}/orgs/${{ FN.url_encode_component(inputs.org) }}/dependabot/secrets/${{ FN.url_encode_component(inputs.secret_name) }}/repositories
      method: PUT
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params: ${{ inputs.params }}
      payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
