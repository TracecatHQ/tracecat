type: action
definition:
  title: Delete organization dependabot secret
  description: 'Delete organization dependabot secret. Calls DELETE /orgs/{org}/dependabot/secrets/{secret_name} directly. Accepted OAuth scopes: admin:org.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: delete_organization_dependabot_secret
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    org:
      type: str
      description: GitHub API path value for org.
    secret_name:
      type: str
      description: GitHub API path value for secret_name.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    payload:
      type: dict[str, Any] | None
      description: API-native request body passed through without validation.
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/orgs/${{ FN.url_encode(inputs.org) }}/dependabot/secrets/${{ FN.url_encode(inputs.secret_name) }}
      method: DELETE
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params: ${{ inputs.params }}
      payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
