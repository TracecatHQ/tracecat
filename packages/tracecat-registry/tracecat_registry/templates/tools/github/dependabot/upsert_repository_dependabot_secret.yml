type: action
definition:
  title: Upsert repository dependabot secret
  description: 'Upsert repository dependabot secret. Calls PUT /repos/{owner}/{repo}/dependabot/secrets/{secret_name} directly. Accepted OAuth scopes: repo (default; omit only for public repository data). GitHub Enterprise Server availability depends on the installed GHES version.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: upsert_repository_dependabot_secret
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    secret_name:
      type: str
      description: GitHub API path value for secret_name.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    payload:
      type: dict[str, Any] | None
      description: API-native request body passed through without validation.
      default: null
    base_url:
      type: str
      description: GitHub REST API base URL. `VARS.github.base_url` overrides this value.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ VARS.github.base_url || inputs.base_url }}/repos/${{ FN.url_encode_component(inputs.owner) }}/${{ FN.url_encode_component(inputs.repo) }}/dependabot/secrets/${{ FN.url_encode_component(inputs.secret_name) }}
      method: PUT
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params: ${{ inputs.params }}
      payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
