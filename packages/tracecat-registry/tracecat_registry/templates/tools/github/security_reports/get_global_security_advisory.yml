type: action
definition:
  title: Get global security advisory
  description: 'Get global security advisory. Calls GET /advisories/{ghsa_id} directly. Accepted OAuth scope: repo (default).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: get_global_security_advisory
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    ghsa_id:
      type: str
      description: GitHub API path value for ghsa_id.
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/advisories/${{ FN.url_encode(inputs.ghsa_id) }}
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
  returns: ${{ steps.request.result }}
