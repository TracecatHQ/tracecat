type: action
definition:
  title: Update Branch Protection
  description: 'Update branch protection. Calls PUT /repos/{owner}/{repo}/branches/{branch}/protection directly. Accepted OAuth scopes: repo (default; omit only for public repository data). GitHub Enterprise Server availability depends on the installed GHES version.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: update_branch_protection
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    branch:
      type: str
      description: GitHub API path value for branch.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    payload:
      type: dict[str, Any] | None
      description: API-native request body passed through without validation.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ SECRETS.github_oauth.GITHUB_API_BASE_URL }}/repos/${{ FN.url_encode_component(inputs.owner) }}/${{ FN.url_encode_component(inputs.repo) }}/branches/${{ FN.url_encode_component(inputs.branch) }}/protection
      method: PUT
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params: ${{ inputs.params }}
      payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
