type: action
definition:
  title: Get Repository Collaborator Permission
  description: 'Get repository collaborator permission. Calls GET /repos/{owner}/{repo}/collaborators/{username}/permission directly. Accepted OAuth scopes: repo (default; omit only for public repository data). GitHub Enterprise Server availability depends on the installed GHES version.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: get_repository_collaborator_permission
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    username:
      type: str
      description: GitHub API path value for username.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ SECRETS.github_oauth.GITHUB_API_BASE_URL }}/repos/${{ FN.url_encode_component(inputs.owner) }}/${{ FN.url_encode_component(inputs.repo) }}/collaborators/${{ FN.url_encode_component(inputs.username) }}/permission
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
