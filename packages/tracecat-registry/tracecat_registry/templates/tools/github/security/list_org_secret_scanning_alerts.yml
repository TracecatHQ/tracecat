type: action
definition:
  title: List organization secret scanning alerts
  description: 'List organization secret scanning alerts. Calls GET /orgs/{org}/secret-scanning/alerts directly. Accepted OAuth scopes: security_events plus repo for private repository access.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: list_org_secret_scanning_alerts
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    org:
      type: str
      description: GitHub API path value for org.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters. hide_secret defaults to true so plaintext secret values are not returned; pass hide_secret false to override.
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/orgs/${{ FN.url_encode(inputs.org) }}/secret-scanning/alerts
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params: '${{ FN.merge([{"hide_secret": True}, inputs.params || {"hide_secret": True}]) }}'
  returns: ${{ steps.request.result }}
