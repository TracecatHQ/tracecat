type: action
definition:
  title: Update code scanning default setup
  description: 'Update code scanning default setup. Calls PATCH /repos/{owner}/{repo}/code-scanning/default-setup directly. Accepted OAuth scopes: security_events plus repo for private repository access.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: update_code_scanning_default_setup
  secrets:
  - type: oauth
    provider_id: github_app
    grant_type: client_credentials
    optional: true
  - type: oauth
    provider_id: github_app
    grant_type: authorization_code
    optional: true
  - type: oauth
    provider_id: github
    grant_type: authorization_code
    optional: true
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    payload:
      # Generic: this endpoint rejects an explicit null on optional body fields,
      # and a literal payload map cannot omit an unset optional.
      type: dict[str, Any] | None
      description: >-
        API-native request body. Documented fields: languages, query_suite, runner_label, runner_type, state, threat_model.
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
    auth_mode:
      type: enum["auto", "delegated", "application"]
      description: >-
        OAuth connection to use. `delegated` uses the user token, `application`
        uses the service token, and `auto` uses whichever is connected, trying
        application first, then delegated.
      default: auto
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/code-scanning/default-setup
      method: PATCH
      headers:
        Authorization: Bearer ${{ (SECRETS.github_app_oauth.GITHUB_APP_USER_TOKEN || SECRETS.github_oauth.GITHUB_USER_TOKEN) if inputs.auth_mode == "delegated" else SECRETS.github_app_oauth.GITHUB_APP_SERVICE_TOKEN if inputs.auth_mode == "application" else SECRETS.github_app_oauth.GITHUB_APP_SERVICE_TOKEN || SECRETS.github_app_oauth.GITHUB_APP_USER_TOKEN || SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
