type: action
definition:
  title: Create Code Scanning Autofix And Wait
  description: 'Create code scanning autofix and wait. Calls POST /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/autofix directly. Accepted OAuth scopes: security_events plus repo for private repository access. GitHub Enterprise Server availability depends on the installed GHES version.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: create_code_scanning_autofix_and_wait
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    alert_number:
      type: str
      description: GitHub API path value for alert_number.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    payload:
      type: dict[str, Any] | None
      description: API-native request body passed through without validation.
      default: null
    poll_interval:
      type: float | None
      description: Seconds between polling attempts; exponential backoff when omitted.
      default: null
    poll_max_attempts:
      type: int
      description: Maximum polling attempts.
      default: 10
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ SECRETS.github_oauth.GITHUB_API_BASE_URL }}/repos/${{ FN.url_encode_component(inputs.owner) }}/${{ FN.url_encode_component(inputs.repo) }}/code-scanning/alerts/${{ FN.url_encode_component(inputs.alert_number) }}/autofix
      method: POST
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params: ${{ inputs.params }}
      payload: ${{ inputs.payload }}
  - ref: poll
    action: core.http_poll
    args:
      url: ${{ SECRETS.github_oauth.GITHUB_API_BASE_URL }}/repos/${{ FN.url_encode_component(inputs.owner) }}/${{ FN.url_encode_component(inputs.repo) }}/code-scanning/alerts/${{ FN.url_encode_component(inputs.alert_number) }}/autofix
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      poll_condition: 'lambda response: response.get(''status_code'') == 200 and (response.get(''data'') or {}).get(''status'') not in (None, ''pending'')'
      poll_interval: ${{ inputs.poll_interval }}
      poll_max_attempts: ${{ inputs.poll_max_attempts }}
  returns: ${{ steps.poll.result }}
