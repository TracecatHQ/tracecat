type: action
definition:
  title: Get repository sbom
  description: 'Get repository sbom. Calls GET /repos/{owner}/{repo}/dependency-graph/sbom directly. Accepted OAuth scopes: security_events plus repo for private repository access.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: get_repository_sbom
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/dependency-graph/sbom
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
  returns: ${{ steps.request.result }}
