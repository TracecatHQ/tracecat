type: action
definition:
  title: List code scanning alert instances
  description: 'List code scanning alert instances. Calls GET /repos/{owner}/{repo}/code-scanning/alerts/{alert_number}/instances directly. Accepted OAuth scopes: security_events plus repo for private repository access.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: list_code_scanning_alert_instances
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    alert_number:
      type: int
      description: GitHub API path value for alert_number.
    page:
      type: int | None
      description: "The page number of the results to fetch. Default: `1`."
      default: null
    per_page:
      type: int | None
      description: "The number of results per page (max 100). Default: `30`."
      default: null
    ref:
      type: str | None
      description: The Git reference for the results you want to list. The `ref` for a branch can be formatted either as `refs/heads/<branch name>` or simply `<branch name>`. To reference a pull request use `refs/pull/<number>/merge`.
      default: null
    pr:
      type: int | None
      description: The number of the pull request for the results you want to list.
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/code-scanning/alerts/${{ FN.url_encode(inputs.alert_number) }}/instances
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params:
        page: ${{ inputs.page }}
        per_page: ${{ inputs.per_page }}
        ref: ${{ inputs.ref }}
        pr: ${{ inputs.pr }}
  returns: ${{ steps.request.result }}
