type: action
definition:
  title: List secret scanning alert locations
  description: 'List secret scanning alert locations. Calls GET /repos/{owner}/{repo}/secret-scanning/alerts/{alert_number}/locations directly. Accepted OAuth scopes: security_events plus repo for private repository access.'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: list_secret_scanning_alert_locations
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    alert_number:
      type: int
      description: GitHub API path value for alert_number.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters, including pagination and filters.
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/secret-scanning/alerts/${{ FN.url_encode(inputs.alert_number) }}/locations
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
