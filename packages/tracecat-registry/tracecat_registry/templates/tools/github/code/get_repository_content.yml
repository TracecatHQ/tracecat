type: action
definition:
  title: Get repository content
  description: 'Get repository content. Calls GET /repos/{owner}/{repo}/contents/{path} directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: get_repository_content
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    path:
      type: str
      description: Nested repository content path.
    ref:
      type: str | None
      description: "The name of the commit/branch/tag. Default: the repository’s default branch."
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/contents/${{ FN.url_encode(inputs.path, "/") }}
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params:
        ref: ${{ inputs.ref }}
  returns: ${{ steps.request.result }}
