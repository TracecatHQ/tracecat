type: action
definition:
  title: Create git ref
  description: 'Create git ref. IMPORTANT: `ref` must be the full name `refs/heads/my-branch`, but `branch` in create_or_update_repository_content and `head` in create_pull_request take the bare `my-branch`. Fails if GitHub returns 422 (for example, the ref already exists or `ref` is malformed), so a retry or repeat run with the same `ref` fails. Calls POST /repos/{owner}/{repo}/git/refs directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: create_git_ref
  secrets:
  - type: oauth
    provider_id: github_app
    grant_type: client_credentials
    optional: true
  - type: oauth
    provider_id: github_app
    grant_type: authorization_code
    optional: true
  - type: oauth
    provider_id: github
    grant_type: authorization_code
    optional: true
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    ref:
      type: str
      description: "The name of the fully qualified reference (ie: `refs/heads/master`). If it doesn't start with 'refs' and have at least two slashes, it will be rejected. Use `refs/heads/my-branch` here; other GitHub actions take the bare `my-branch`."
    sha:
      type: str
      description: The SHA1 value for this reference.
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/git/refs
      method: POST
      headers:
        Authorization: Bearer ${{ SECRETS.github_app_oauth.GITHUB_APP_SERVICE_TOKEN || SECRETS.github_app_oauth.GITHUB_APP_USER_TOKEN || SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      payload:
        ref: ${{ inputs.ref }}
        sha: ${{ inputs.sha }}
  returns: ${{ steps.request.result }}
