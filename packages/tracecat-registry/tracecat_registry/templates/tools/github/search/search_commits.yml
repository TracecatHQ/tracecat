type: action
definition:
  title: Search commits
  description: 'Search commits. Calls GET /search/commits directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: search_commits
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    q:
      type: str
      description: The query contains one or more search keywords and qualifiers. Qualifiers allow you to limit your search to specific areas of GitHub. The REST API supports the same qualifiers as the web interface for GitHub. See Searching commits for a detailed list of qualifiers.
    sort:
      type: str | None
      description: "Sorts the results of your query by author-date or committer-date. Default: best match"
      default: null
    order:
      type: str | None
      description: Determines whether the first search result returned is the highest number of matches (desc) or lowest number of matches (asc). This parameter is ignored unless you provide sort.
      default: null
    per_page:
      type: int | None
      description: The number of results per page (max 100).
      default: null
    page:
      type: int | None
      description: The page number of the results to fetch.
      default: null
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/search/commits
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      params:
        q: ${{ inputs.q }}
        sort: ${{ inputs.sort }}
        order: ${{ inputs.order }}
        per_page: ${{ inputs.per_page }}
        page: ${{ inputs.page }}
  returns: ${{ steps.request.result }}
