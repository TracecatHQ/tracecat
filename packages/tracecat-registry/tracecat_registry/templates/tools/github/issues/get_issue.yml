type: action
definition:
  title: Get issue
  description: 'Get issue. Calls GET /repos/{owner}/{repo}/issues/{issue_number} directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: get_issue
  secrets:
  - type: oauth
    provider_id: github_app
    grant_type: client_credentials
    optional: true
  - type: oauth
    provider_id: github_app
    grant_type: authorization_code
    optional: true
  - type: oauth
    provider_id: github
    grant_type: authorization_code
    optional: true
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    issue_number:
      type: int
      description: GitHub API path value for issue_number.
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/issues/${{ FN.url_encode(inputs.issue_number) }}
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.github_app_oauth.GITHUB_APP_SERVICE_TOKEN || SECRETS.github_app_oauth.GITHUB_APP_USER_TOKEN || SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
  returns: ${{ steps.request.result }}
