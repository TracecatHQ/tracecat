type: action
definition:
  title: Create issue comment
  description: 'Create issue comment. Calls POST /repos/{owner}/{repo}/issues/{issue_number}/comments directly. Accepted OAuth scopes: repo (default; omit only for public repository data).'
  display_group: GitHub
  doc_url: https://docs.github.com/en/rest
  namespace: tools.github
  name: create_issue_comment
  secrets:
  - type: oauth
    provider_id: github
    grant_type: authorization_code
  expects:
    owner:
      type: str
      description: GitHub API path value for owner.
    repo:
      type: str
      description: GitHub API path value for repo.
    issue_number:
      type: int
      description: GitHub API path value for issue_number.
    body:
      type: str
      description: The contents of the comment.
    base_url:
      type: str
      description: GitHub.com REST API base URL.
      default: https://api.github.com
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url }}/repos/${{ FN.url_encode(inputs.owner) }}/${{ FN.url_encode(inputs.repo) }}/issues/${{ FN.url_encode(inputs.issue_number) }}/comments
      method: POST
      headers:
        Authorization: Bearer ${{ SECRETS.github_oauth.GITHUB_USER_TOKEN }}
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: '2022-11-28'
      payload:
        body: ${{ inputs.body }}
  returns: ${{ steps.request.result }}
