type: action
definition:
  title: Get domain leak stats
  description: >-
    Get public domain leak statistics. Calls GET /v1/leaks/stats/domain directly. No API key
    is required.
  display_group: ProjectDiscovery
  doc_url: https://docs.projectdiscovery.io/api-reference/leaks/get-domain-stats
  namespace: tools.project_discovery
  name: get_domain_leak_stats
  expects:
    base_url:
      type: str | None
      description: ProjectDiscovery Cloud API base URL.
      default: null
    domain:
      type: str
      description: Domain to get leak statistics for.
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.project_discovery.base_url || "https://api.projectdiscovery.io" }}/v1/leaks/stats/domain
        method: GET
        params:
          domain: ${{ inputs.domain }}
  returns: ${{ steps.request.result }}
