type: action
definition:
  title: List scans
  description: >-
    List vulnerability scans. Calls GET /v1/scans directly.
  display_group: ProjectDiscovery
  doc_url: https://docs.projectdiscovery.io/api-reference/scans/get-scan-list
  namespace: tools.project_discovery
  name: list_scans
  secrets:
    - name: project_discovery
      keys: ["PDCP_API_KEY"]
  expects:
    offset:
      type: int | None
      description: number of scan-status results to skip
      default: null
    limit:
      type: int | None
      description: number of scan-status results to fetch
      default: null
    search:
      type: str | None
      description: search term for running scans
      default: null
    status:
      type: str | None
      description: filter by status (failed, finished, queued, running, starting, uploaded, scheduled)
      default: null
    sort_asc:
      type: str | None
      description: comma separated ascending sorting e.g sort_asc=created_at,severity
      default: null
    sort_desc:
      type: str | None
      description: comma separated descending sorting e.g sort_desc=created_at,severity
      default: null
    is_internal:
      type: bool | None
      description: filter by internal scans
      default: null
    team_id:
      type: str | None
      description: "Retrieve the Team ID from: https://cloud.projectdiscovery.io/settings/team"
      default: null
    base_url:
      type: str | None
      description: ProjectDiscovery Cloud API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.project_discovery.base_url || "https://api.projectdiscovery.io" }}/v1/scans
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.project_discovery.PDCP_API_KEY }}
          X-Team-Id: ${{ inputs.team_id }}
        params:
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
          search: ${{ inputs.search }}
          status: ${{ inputs.status }}
          sort_asc: ${{ inputs.sort_asc }}
          sort_desc: ${{ inputs.sort_desc }}
          is_internal: ${{ inputs.is_internal }}
  returns: ${{ steps.request.result }}
