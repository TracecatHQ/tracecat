type: action
definition:
  title: Rescan scan
  description: >-
    Rescan a vulnerability scan. Calls POST /v1/scans/{scan_id}/rescan directly.
  display_group: ProjectDiscovery
  doc_url: https://docs.projectdiscovery.io/api-reference/scans/rescan-scan
  namespace: tools.project_discovery
  name: rescan_scan
  secrets:
    - name: project_discovery
      keys: ["PDCP_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: ProjectDiscovery Cloud API base URL.
      default: null
    scan_id:
      type: str
      description: Scan ID to rescan.
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.project_discovery.base_url || "https://api.projectdiscovery.io" }}/v1/scans/${{ FN.url_encode(inputs.scan_id) }}/rescan
        method: POST
        headers:
          X-Api-Key: ${{ SECRETS.project_discovery.PDCP_API_KEY }}
  returns: ${{ steps.request.result }}
