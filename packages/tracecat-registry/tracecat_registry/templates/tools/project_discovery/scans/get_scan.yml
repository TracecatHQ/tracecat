type: action
definition:
  title: Get scan
  description: >-
    Get a scan. Calls GET /v1/scans/{scan_id} directly.
  display_group: ProjectDiscovery
  doc_url: https://docs.projectdiscovery.io/api-reference/scans/get-scan
  namespace: tools.project_discovery
  name: get_scan
  secrets:
    - name: project_discovery
      keys: ["PDCP_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: ProjectDiscovery Cloud API base URL.
      default: null
    scan_id:
      type: str
      description: Scan ID.
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.project_discovery.base_url || "https://api.projectdiscovery.io" }}/v1/scans/${{ FN.url_encode(inputs.scan_id) }}
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.project_discovery.PDCP_API_KEY }}
  returns: ${{ steps.request.result }}
