type: action
definition:
  title: Get enumeration
  description: >-
    Get an enumeration. Calls GET /v1/asset/enumerate/{enumerate_id} directly.
  display_group: ProjectDiscovery
  doc_url: https://docs.projectdiscovery.io/api-reference/enumerations/get-enumeration
  namespace: tools.project_discovery
  name: get_enumeration
  secrets:
    - name: project_discovery
      keys: ["PDCP_API_KEY"]
  expects:
    enumerate_id:
      type: str
      description: Enumeration ID.
    team_id:
      type: str | None
      description: "Retrieve the Team ID from: https://cloud.projectdiscovery.io/settings/team"
      default: null
    base_url:
      type: str | None
      description: ProjectDiscovery Cloud API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.project_discovery.base_url || "https://api.projectdiscovery.io" }}/v1/asset/enumerate/${{ FN.url_encode(inputs.enumerate_id) }}
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.project_discovery.PDCP_API_KEY }}
          X-Team-Id: ${{ inputs.team_id }}
  returns: ${{ steps.request.result }}
