type: action
definition:
  title: Get associated domains
  description: >-
    Get associated domains. Calls GET /v1/domain/associated directly.
  display_group: ProjectDiscovery
  doc_url: https://docs.projectdiscovery.io/api-reference/enumerations/get-associated-domains
  namespace: tools.project_discovery
  name: get_associated_domains
  secrets:
    - name: project_discovery
      keys: ["PDCP_API_KEY"]
  expects:
    domain:
      type: str | None
      description: Domain name to fetch associated domains. If omitted, returns associated domains for all your verified domains.
      default: null
    source:
      type: str | None
      description: Comma-separated source filter (acquisition_history, certificate_history, whois_history).
      default: null
    active:
      type: bool | None
      description: Filter by liveness (true=alive, false=unreachable).
      default: null
    sort:
      type: str | None
      description: Sort results (active, domain, source, subdomain_count, update_date).
      default: null
    limit:
      type: int | None
      description: Maximum results per page (pagination). If omitted, returns all.
      default: null
    page:
      type: int | None
      description: Page number (pagination, starts at 1).
      default: null
    raw:
      type: bool | None
      description: If true, returns plain text list (one domain per line).
      default: null
    team_id:
      type: str | None
      description: "Retrieve the Team ID from: https://cloud.projectdiscovery.io/settings/team"
      default: null
    base_url:
      type: str | None
      description: ProjectDiscovery Cloud API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.project_discovery.base_url || "https://api.projectdiscovery.io" }}/v1/domain/associated
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.project_discovery.PDCP_API_KEY }}
          X-Team-Id: ${{ inputs.team_id }}
        params:
          domain: ${{ inputs.domain }}
          source: ${{ inputs.source }}
          active: ${{ inputs.active }}
          sort: ${{ inputs.sort }}
          limit: ${{ inputs.limit }}
          page: ${{ inputs.page }}
          raw: ${{ inputs.raw }}
  returns: ${{ steps.request.result }}
