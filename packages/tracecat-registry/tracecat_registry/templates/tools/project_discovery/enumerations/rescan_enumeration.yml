type: action
definition:
  title: Rescan enumeration
  description: >-
    Rescan an enumeration. Calls POST /v1/asset/enumerate/{enumerate_id}/rescan directly.
  display_group: ProjectDiscovery
  doc_url: https://docs.projectdiscovery.io/api-reference/enumerations/rescan-enumeration
  namespace: tools.project_discovery
  name: rescan_enumeration
  secrets:
    - name: project_discovery
      keys: ["PDCP_API_KEY"]
  expects:
    enumerate_id:
      type: str
      description: Enumeration ID to rescan.
    team_id:
      type: str | None
      description: "Retrieve the Team ID from: https://cloud.projectdiscovery.io/settings/team"
      default: null
    base_url:
      type: str | None
      description: ProjectDiscovery Cloud API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.project_discovery.base_url || "https://api.projectdiscovery.io" }}/v1/asset/enumerate/${{ FN.url_encode(inputs.enumerate_id) }}/rescan
        method: POST
        headers:
          X-Api-Key: ${{ SECRETS.project_discovery.PDCP_API_KEY }}
          X-Team-Id: ${{ inputs.team_id }}
  returns: ${{ steps.request.result }}
