type: action
definition:
  title: List enumerations
  description: >-
    List asset enumerations. Calls GET /v1/asset/enumerate directly.
  display_group: ProjectDiscovery
  doc_url: https://docs.projectdiscovery.io/api-reference/enumerations/get-enumeration-list
  namespace: tools.project_discovery
  name: list_enumerations
  secrets:
    - name: project_discovery
      keys: ["PDCP_API_KEY"]
  expects:
    offset:
      type: int | None
      description: The number of items to skip before starting to collect the result set.
      default: null
    limit:
      type: int | None
      description: The numbers of items to return.
      default: null
    search:
      type: str | None
      description: search keyword in enumeration list
      default: null
    enum_type:
      type: str | None
      description: types of enumeration list (comma seperated)
      default: null
    sort_asc:
      type: str | None
      description: comma separated ascending sorting e.g sort_asc=created_at,name
      default: null
    sort_desc:
      type: str | None
      description: comma separated descending sorting e.g sort_desc=created_at,name
      default: null
    status:
      type: str | None
      description: comma separated filter enumeration result by status
      default: null
    time:
      type: str | None
      description: time range to get enumerations from (last_day, last_week, last_month, last_3_months, last_6_months, last_12_months, all_time). Defaults to all_time.
      default: null
    start_date:
      type: str | None
      description: time filter start date (YYYY-MM-DD).
      default: null
    end_date:
      type: str | None
      description: time filter end date (YYYY-MM-DD).
      default: null
    custom_filter:
      type: str | None
      description: custom query to filter. double encode the query string.
      default: null
    is_internal:
      type: bool | None
      description: filter by internal enumerations
      default: null
    team_id:
      type: str | None
      description: "Retrieve the Team ID from: https://cloud.projectdiscovery.io/settings/team"
      default: null
    base_url:
      type: str | None
      description: ProjectDiscovery Cloud API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.project_discovery.base_url || "https://api.projectdiscovery.io" }}/v1/asset/enumerate
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.project_discovery.PDCP_API_KEY }}
          X-Team-Id: ${{ inputs.team_id }}
        params:
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
          search: ${{ inputs.search }}
          enum_type: ${{ inputs.enum_type }}
          sort_asc: ${{ inputs.sort_asc }}
          sort_desc: ${{ inputs.sort_desc }}
          status: ${{ inputs.status }}
          time: ${{ inputs.time }}
          start_date: ${{ inputs.start_date }}
          end_date: ${{ inputs.end_date }}
          custom_filter: ${{ inputs.custom_filter }}
          is_internal: ${{ inputs.is_internal }}
  returns: ${{ steps.request.result }}
