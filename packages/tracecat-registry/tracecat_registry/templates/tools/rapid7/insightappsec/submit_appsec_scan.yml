type: action
definition:
  title: Submit InsightAppSec scan
  description: "Submit scan. Calls POST /ias/v1/scans directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightappsec/en-us/api/v1/docs.html#operation/submit-scan
  namespace: tools.rapid7
  name: submit_appsec_scan
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    scan_config_id:
      type: str
      description: "The ID of the scan configuration."
    scan_type:
      type: str | None
      description: "The type of Scan."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/ias/v1/scans
        method: POST
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        payload:
          scan_config:
            id: ${{ inputs.scan_config_id }}
          scan_type: ${{ inputs.scan_type }}
  returns: ${{ steps.request.result }}
