type: action
definition:
  title: Get scan execution details
  description: "Get scan execution details. Calls GET /ias/v1/scans/{scan_id}/execution-details directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightappsec/en-us/api/v1/docs.html#operation/get-scan-execution-details
  namespace: tools.rapid7
  name: get_scan_execution_details
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    scan_id:
      type: str
      description: "The identifier of the scan."
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/ias/v1/scans/${{ FN.url_encode(inputs.scan_id) }}/execution-details
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
  returns: ${{ steps.request.result }}
