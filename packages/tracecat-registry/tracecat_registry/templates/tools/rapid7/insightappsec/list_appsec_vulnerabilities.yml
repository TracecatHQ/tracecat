type: action
definition:
  title: List InsightAppSec vulnerabilities
  description: "List vulnerabilities. Calls GET /ias/v1/vulnerabilities directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightappsec/en-us/api/v1/docs.html#operation/get-vulnerabilities
  namespace: tools.rapid7
  name: list_appsec_vulnerabilities
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    index:
      type: int | None
      description: "The page index."
      default: null
    size:
      type: int | None
      description: "The page size."
      default: null
    sort:
      type: str | None
      description: "The sort criteria."
      default: null
    page_token:
      type: str | None
      description: "The token to retrieve the next page."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/ias/v1/vulnerabilities
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
        params:
          index: ${{ inputs.index }}
          size: ${{ inputs.size }}
          sort: ${{ inputs.sort }}
          "page-token": ${{ inputs.page_token }}
  returns: ${{ steps.request.result }}
