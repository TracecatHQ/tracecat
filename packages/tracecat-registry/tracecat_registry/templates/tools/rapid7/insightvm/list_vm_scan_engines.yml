type: action
definition:
  title: List InsightVM scan engines
  description: "List scan engines. Calls GET /vm/v4/integration/scan/engine directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightvm/en-us/api/integrations.html#operation/getScanEngines
  namespace: tools.rapid7
  name: list_vm_scan_engines
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    page:
      type: int | None
      description: "The zero-based page index."
      default: null
    size:
      type: int | None
      description: "The number of records per page."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/vm/v4/integration/scan/engine
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
        params:
          page: ${{ inputs.page }}
          size: ${{ inputs.size }}
  returns: ${{ steps.request.result }}
