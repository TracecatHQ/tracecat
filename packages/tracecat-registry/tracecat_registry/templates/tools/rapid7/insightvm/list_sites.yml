type: action
definition:
  title: List sites
  description: "List sites. Calls POST /vm/v4/integration/sites directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightvm/en-us/api/integrations.html#operation/getSites
  namespace: tools.rapid7
  name: list_sites
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    cursor:
      type: str | None
      description: "The stateless cursor."
      default: null
    page:
      type: int | None
      description: "The zero-based page index."
      default: null
    size:
      type: int | None
      description: "The number of records per page."
      default: null
    sort:
      type: str | None
      description: "The sort criteria."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/vm/v4/integration/sites
        method: POST
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
        params:
          cursor: ${{ inputs.cursor }}
          page: ${{ inputs.page }}
          size: ${{ inputs.size }}
          sort: ${{ inputs.sort }}
  returns: ${{ steps.request.result }}
