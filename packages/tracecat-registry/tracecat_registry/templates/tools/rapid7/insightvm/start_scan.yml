type: action
definition:
  title: Start scan
  description: "Start scan. Calls POST /vm/v4/integration/scan directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightvm/en-us/api/integrations.html#operation/startScan
  namespace: tools.rapid7
  name: start_scan
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    payload:
      # Generic: ScanForm has only optional fields and the vendor's null handling is undocumented
      type: dict[str, Any]
      description: "API-native ScanForm body. Fields include asset_ids, credential_sources, engine_ids, name, result_consumer, solution_ids, start_time, and vulnerability_ids."
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/vm/v4/integration/scan
        method: POST
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
