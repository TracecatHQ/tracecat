type: action
definition:
  title: Get scan
  description: "Get scan. Calls GET /vm/v4/integration/scan/{id} directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightvm/en-us/api/integrations.html#operation/getScan
  namespace: tools.rapid7
  name: get_scan
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    id:
      type: str
      description: "The identifier of the scan."
    includeDetails:
      type: bool | None
      description: "Include additional scan details."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/vm/v4/integration/scan/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
        params:
          includeDetails: ${{ inputs.includeDetails }}
  returns: ${{ steps.request.result }}
