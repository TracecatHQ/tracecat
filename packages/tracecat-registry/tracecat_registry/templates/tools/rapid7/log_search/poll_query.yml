type: action
definition:
  title: Poll query
  description: "Poll query. Calls GET /log_search/query/{id} directly."
  display_group: Rapid7
  doc_url: https://docs.rapid7.com/insightidr/log-search-api/#operation/pollQuery
  namespace: tools.rapid7
  name: poll_query
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    id:
      type: str
      description: "The continuation id generated when the query started."
    time_range:
      type: str | None
      description: "An alternative relative time range."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/log_search/query/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
        params:
          time_range: ${{ inputs.time_range }}
  returns: ${{ steps.request.result }}
