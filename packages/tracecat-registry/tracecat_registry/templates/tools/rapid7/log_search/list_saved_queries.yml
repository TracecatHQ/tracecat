type: action
definition:
  title: List saved queries
  description: "List saved queries. Calls GET /log_search/query/saved_queries directly."
  display_group: Rapid7
  doc_url: https://docs.rapid7.com/insightidr/log-search-api/#operation/listSavedQueries
  namespace: tools.rapid7
  name: list_saved_queries
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/log_search/query/saved_queries
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
  returns: ${{ steps.request.result }}
