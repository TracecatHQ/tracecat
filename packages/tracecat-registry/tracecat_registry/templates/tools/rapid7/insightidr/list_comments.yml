type: action
definition:
  title: List comments
  description: "List comments. Calls GET /idr/v1/comments directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v1/docs.html#operation/listComments
  namespace: tools.rapid7
  name: list_comments
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    target:
      type: str
      description: "Return comments with this target."
    index:
      type: int | None
      description: "The optional 0-based page index."
      default: null
    size:
      type: int | None
      description: "The optional page size."
      default: null
    sortDirection:
      type: str | None
      description: "The direction in which comments should be sorted."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v1/comments
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
        params:
          target: ${{ inputs.target }}
          index: ${{ inputs.index }}
          size: ${{ inputs.size }}
          sortDirection: ${{ inputs.sortDirection }}
  returns: ${{ steps.request.result }}
