type: action
definition:
  title: Search assets
  description: "Search assets. Calls POST /idr/v1/assets/_search directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v1/docs.html#operation/searchAssets
  namespace: tools.rapid7
  name: search_assets
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    index:
      type: int | None
      description: "The optional 0-based page index."
      default: null
    size:
      type: int | None
      description: "The optional page size."
      default: null
    search:
      type: list[dict[str, Any]] | None
      description: "Search criteria with field, operator, and value."
      default: null
    sort:
      type: list[dict[str, Any]] | None
      description: "Sorting information with field and order."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v1/assets/_search
        method: POST
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          index: ${{ inputs.index }}
          size: ${{ inputs.size }}
        payload:
          search: ${{ inputs.search }}
          sort: ${{ inputs.sort }}
  returns: ${{ steps.request.result }}
