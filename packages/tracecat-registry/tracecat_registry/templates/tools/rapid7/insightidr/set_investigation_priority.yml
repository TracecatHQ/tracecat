type: action
definition:
  title: Set investigation priority
  description: "Set investigation priority. Calls PUT /idr/v2/investigations/{id}/priority/{priority} directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v2/docs.html#operation/setPriority
  namespace: tools.rapid7
  name: set_investigation_priority
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    id:
      type: str
      description: "The id or rrn of the investigation."
    priority:
      type: str
      description: "The new value for the investigation."
    multi_customer:
      type: bool | None
      description: "Indicates whether the requester has multi-customer access. If set to true, a user API key must be provided."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v2/investigations/${{ FN.url_encode(inputs.id) }}/priority/${{ FN.url_encode(inputs.priority) }}
        method: PUT
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
        params:
          "multi-customer": ${{ inputs.multi_customer }}
  returns: ${{ steps.request.result }}
