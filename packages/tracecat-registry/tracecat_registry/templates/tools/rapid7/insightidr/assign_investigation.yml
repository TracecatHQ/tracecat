type: action
definition:
  title: Assign user to investigation
  description: "Assign user to investigation. Calls PUT /idr/v2/investigations/{id}/assignee directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v2/docs.html#operation/assignUserToInvestigation
  namespace: tools.rapid7
  name: assign_investigation
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    id:
      type: str
      description: "The id or rrn of the investigation."
    multi_customer:
      type: bool | None
      description: "Indicates whether the requester has multi-customer access. If set to true, a user API key must be provided."
      default: null
    user_email_address:
      type: str
      description: "The email address of the user to assign to this investigation."
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v2/investigations/${{ FN.url_encode(inputs.id) }}/assignee
        method: PUT
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          "multi-customer": ${{ inputs.multi_customer }}
        payload:
          user_email_address: ${{ inputs.user_email_address }}
  returns: ${{ steps.request.result }}
