type: action
definition:
  title: Get asset by RRN
  description: "Get asset by RRN. Calls GET /idr/v1/assets/{rrn} directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v1/docs.html#operation/findAssetByRrn
  namespace: tools.rapid7
  name: get_asset
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    rrn:
      type: str
      description: "The RRN of the asset."
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v1/assets/${{ FN.url_encode(inputs.rrn) }}
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
  returns: ${{ steps.request.result }}
