type: action
definition:
  title: Get attachment metadata
  description: "Get attachment metadata. Calls GET /idr/v1/attachments/{rrn}/metadata directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v1/docs.html#operation/getAttachment
  namespace: tools.rapid7
  name: get_attachment_metadata
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    rrn:
      type: str
      description: "The RRN of the attachment."
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v1/attachments/${{ FN.url_encode(inputs.rrn) }}/metadata
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
  returns: ${{ steps.request.result }}
