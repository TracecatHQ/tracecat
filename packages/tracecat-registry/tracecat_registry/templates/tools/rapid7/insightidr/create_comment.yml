type: action
definition:
  title: Create comment
  description: "Create comment. Calls POST /idr/v1/comments directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v1/docs.html#operation/createComment
  namespace: tools.rapid7
  name: create_comment
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    target:
      type: str
      description: "The target of the comment."
    body:
      type: str | None
      description: "The body of the comment."
      default: null
    attachments:
      type: list[str] | None
      description: "Attachment RRNs to associate."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v1/comments
        method: POST
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        payload:
          target: ${{ inputs.target }}
          body: ${{ inputs.body }}
          attachments: ${{ inputs.attachments }}
  returns: ${{ steps.request.result }}
