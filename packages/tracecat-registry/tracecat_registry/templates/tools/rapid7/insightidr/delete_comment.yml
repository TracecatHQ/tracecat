type: action
definition:
  title: Delete comment
  description: "Delete comment. Calls DELETE /idr/v1/comments/{rrn} directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v1/docs.html#operation/deleteComment
  namespace: tools.rapid7
  name: delete_comment
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    rrn:
      type: str
      description: "The RRN of the comment."
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v1/comments/${{ FN.url_encode(inputs.rrn) }}
        method: DELETE
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
  returns: ${{ steps.request.result }}
