type: action
definition:
  title: Close investigations in bulk
  description: "Close investigations in bulk. Calls POST /idr/v2/investigations/bulk_close directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v2/docs.html#operation/bulkCloseInvestigations
  namespace: tools.rapid7
  name: bulk_close_investigations
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    source:
      type: str
      description: "The investigation source: ALERT, MANUAL, or HUNT."
    from:
      type: str
      description: "The time investigations are to be closed from."
    to:
      type: str
      description: "The time investigations are to be closed by."
    alert_type:
      type: str | None
      description: "The category of alert types to close."
      default: null
    disposition:
      type: str | None
      description: "A disposition to set."
      default: null
    detection_rule_rrn:
      type: str | None
      description: "The detection rule RRN."
      default: null
    max_investigations_to_close:
      type: int | None
      description: "An optional maximum number to close."
      default: null
    multi_customer:
      type: bool | None
      description: "Indicates whether the requester has multi-customer access. If set to true, a user API key must be provided."
      default: null
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v2/investigations/bulk_close
        method: POST
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          "multi-customer": ${{ inputs.multi_customer }}
        payload:
          source: ${{ inputs.source }}
          from: ${{ inputs.from }}
          to: ${{ inputs.to }}
          alert_type: ${{ inputs.alert_type }}
          disposition: ${{ inputs.disposition }}
          detection_rule_rrn: ${{ inputs.detection_rule_rrn }}
          max_investigations_to_close: ${{ inputs.max_investigations_to_close }}
  returns: ${{ steps.request.result }}
