type: action
definition:
  title: Create Community Threat
  description: "Create Community Threat. Calls POST /idr/v1/customthreats directly."
  display_group: Rapid7
  doc_url: https://help.rapid7.com/insightidr/en-us/api/v1/docs.html#operation/createCommunityThreat
  namespace: tools.rapid7
  name: create_community_threat
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    threat:
      type: str
      description: "The Community Threat name."
    note:
      type: str | None
      description: "The note."
      default: null
    indicators:
      # Vendor documents a free-form indicator object (ips, hashes, domain_names, urls lists).
      type: dict[str, Any]
      description: "Free-form documented indicator object containing IP addresses, process hashes, domains, or URLs."
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/v1/customthreats
        method: POST
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        payload:
          threat: ${{ inputs.threat }}
          note: ${{ inputs.note }}
          indicators: ${{ inputs.indicators }}
  returns: ${{ steps.request.result }}
