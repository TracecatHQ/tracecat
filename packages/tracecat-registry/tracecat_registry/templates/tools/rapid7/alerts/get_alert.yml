type: action
definition:
  title: Get alert
  description: "Get alert. Calls GET /idr/at/alerts/{alert_rrn} directly."
  display_group: Rapid7
  doc_url: https://docs.rapid7.com/insightidr/api/alert-triage/#operation/getAlert
  namespace: tools.rapid7
  name: get_alert
  secrets:
    - name: rapid7
      keys: ["RAPID7_API_KEY"]
  expects:
    alert_rrn:
      type: str
      description: "The unique identifier of the alert."
    base_url:
      type: str | None
      description: "Regional Insight Platform API base URL (e.g. https://eu.api.insight.rapid7.com). Regions: us, us2, us3, eu, ca, au, ap, aps2, me1."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.rapid7.base_url || "https://us.api.insight.rapid7.com" }}/idr/at/alerts/${{ FN.url_encode(inputs.alert_rrn) }}
        method: GET
        headers:
          X-Api-Key: ${{ SECRETS.rapid7.RAPID7_API_KEY }}
          Accept: application/json
  returns: ${{ steps.request.result }}
