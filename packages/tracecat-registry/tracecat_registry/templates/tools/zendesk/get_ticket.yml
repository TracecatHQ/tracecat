type: action
definition:
  title: Get ticket
  description: Retrieve a specific ticket by ID from Zendesk.
  display_group: Zendesk
  doc_url: https://developer.zendesk.com/api-reference/ticketing/tickets/tickets/#show-ticket
  namespace: tools.zendesk
  name: get_ticket
  secrets:
    - type: oauth
      provider_id: zendesk
      grant_type: client_credentials
      optional: true
    - name: zendesk
      keys: ["ZENDESK_EMAIL", "ZENDESK_API_TOKEN"]
      optional: true
  expects:
    subdomain:
      type: str
      description: Your Zendesk subdomain (e.g., 'company' for company.zendesk.com)
    ticket_id:
      type: int
      description: The ID of the ticket to retrieve
  steps:
    - ref: resolve_auth
      action: core.transform.reshape
      args:
        value: ${{ (SECRETS.zendesk_oauth.ZENDESK_SERVICE_TOKEN && FN.format("Bearer {}", SECRETS.zendesk_oauth.ZENDESK_SERVICE_TOKEN)) || FN.format("Basic {}", FN.to_base64(FN.format("{}/token:{}", SECRETS.zendesk.ZENDESK_EMAIL, SECRETS.zendesk.ZENDESK_API_TOKEN))) }}
    - ref: call_api
      action: core.http_request
      args:
        url: https://${{ inputs.subdomain }}.zendesk.com/api/v2/tickets/${{ inputs.ticket_id }}.json
        method: GET
        headers:
          Authorization: ${{ steps.resolve_auth.result }}
          Content-Type: application/json
          Accept: application/json
  returns: ${{ steps.call_api.result.data }}
