type: action
definition:
  title: Get ticket comments
  description: Retrieve all comments for a specific ticket.
  display_group: Zendesk
  doc_url: https://developer.zendesk.com/api-reference/ticketing/tickets/ticket_comments/
  namespace: tools.zendesk
  name: get_ticket_comments
  secrets:
    - type: oauth
      provider_id: zendesk
      grant_type: client_credentials
      optional: true
    - name: zendesk
      keys: ["ZENDESK_EMAIL", "ZENDESK_API_TOKEN"]
      optional: true
  expects:
    subdomain:
      type: str
      description: Your Zendesk subdomain (e.g., 'company' for company.zendesk.com)
    ticket_id:
      type: int
      description: The ID of the ticket
    page:
      type: int | None
      description: Page number for pagination (1-based)
      default: null
    per_page:
      type: int
      description: Number of comments per page (max 100)
      default: 100
  steps:
    - ref: resolve_auth
      action: core.transform.reshape
      args:
        value: ${{ (SECRETS.zendesk_oauth.ZENDESK_SERVICE_TOKEN && FN.format("Bearer {}", SECRETS.zendesk_oauth.ZENDESK_SERVICE_TOKEN)) || FN.format("Basic {}", FN.to_base64(FN.format("{}/token:{}", SECRETS.zendesk.ZENDESK_EMAIL, SECRETS.zendesk.ZENDESK_API_TOKEN))) }}
    - ref: build_params
      action: core.transform.reshape
      args:
        value:
          per_page: ${{ FN.min(inputs.per_page, 100) }}
          page: ${{ inputs.page }}
    - ref: call_api
      action: core.http_request
      args:
        url: https://${{ inputs.subdomain }}.zendesk.com/api/v2/tickets/${{ inputs.ticket_id }}/comments.json
        method: GET
        headers:
          Authorization: ${{ steps.resolve_auth.result }}
          Content-Type: application/json
          Accept: application/json
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.call_api.result.data }}
