type: action
definition:
  title: Get group users
  description: Retrieve all users in a specific group.
  display_group: Zendesk
  doc_url: https://developer.zendesk.com/api-reference/ticketing/groups/groups/
  namespace: tools.zendesk
  name: get_group_users
  secrets:
    - type: oauth
      provider_id: zendesk
      grant_type: client_credentials
      optional: true
    - name: zendesk
      keys: ["ZENDESK_EMAIL", "ZENDESK_API_TOKEN"]
      optional: true
  expects:
    subdomain:
      type: str
      description: Your Zendesk subdomain (e.g., 'company' for company.zendesk.com)
    group_id:
      type: int
      description: The ID of the group
    page:
      type: int | None
      description: Page number for pagination (1-based)
      default: null
    per_page:
      type: int
      description: Number of users per page (max 100)
      default: 100
  steps:
    - ref: resolve_auth
      action: core.transform.reshape
      args:
        value: ${{ (SECRETS.zendesk_oauth.ZENDESK_SERVICE_TOKEN && FN.format("Bearer {}", SECRETS.zendesk_oauth.ZENDESK_SERVICE_TOKEN)) || FN.format("Basic {}", FN.to_base64(FN.format("{}/token:{}", SECRETS.zendesk.ZENDESK_EMAIL, SECRETS.zendesk.ZENDESK_API_TOKEN))) }}
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          per_page: ${{ FN.min(inputs.per_page, 100) }}
          page: ${{ inputs.page }}
        script: |
          def main(per_page, page):
              params = {"per_page": per_page}
              if page is not None:
                  params["page"] = page
              return params
    - ref: call_api
      action: core.http_request
      args:
        url: https://${{ inputs.subdomain }}.zendesk.com/api/v2/groups/${{ inputs.group_id }}/users.json
        method: GET
        headers:
          Authorization: ${{ steps.resolve_auth.result }}
          Accept: application/json
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.call_api.result.data }}
