type: action
definition:
  title: Search scans
  description: >-
    Search urlscan scans. Calls GET /api/v1/search/ directly.
  display_group: URLScan
  doc_url: https://docs.urlscan.io/apis/urlscan-openapi/search/searchdatasource
  namespace: tools.urlscan
  name: search_scans
  secrets:
    - name: urlscan
      keys: ["URLSCAN_API_KEY"]
  expects:
    query:
      type: str
      description: Search Query (Elasticsearch Query String). Maps to q.
      default: "*"
    size:
      type: int | None
      description: Number of results to return.
      default: null
    search_after:
      type: str | None
      description: >-
        For retrieving the next batch of results, send the value of the sort attribute of the
        last (oldest) result you received (comma-separated) from the previous call.
      default: null
    datasource:
      type: str | None
      description: >-
        Datasources to search - scans (urlscan.io), hostnames, incidents, notifications,
        certificates (urlscan Pro).
      default: null
    base_url:
      type: str | None
      description: urlscan base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.urlscan.base_url || "https://urlscan.io" }}/api/v1/search/
        method: GET
        headers:
          API-Key: ${{ SECRETS.urlscan.URLSCAN_API_KEY }}
          Accept: application/json
        params:
          q: ${{ inputs.query }}
          size: ${{ inputs.size }}
          search_after: ${{ inputs.search_after }}
          datasource: ${{ inputs.datasource }}
  returns: ${{ steps.request.result }}
