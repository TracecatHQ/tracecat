type: action
definition:
  title: Clear values
  description: >-
    Clears values from a spreadsheet. The caller must specify the spreadsheet ID and range. Only
    values are cleared -- all other properties of the cell (such as formatting, data validation,
    etc.) are kept.
  display_group: Google Sheets
  doc_url: https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets.values/clear
  namespace: tools.google_sheets
  name: clear_values
  secrets:
    - type: oauth
      provider_id: google_sheets
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_sheets
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    spreadsheet_id:
      type: str
      description: The ID of the spreadsheet to update.
    range:
      type: str
      description: The A1 notation or R1C1 notation of the values to clear.
    auth_mode:
      type: enum["auto", "delegated", "application"]
      description: >-
        OAuth connection to use. `delegated` uses the user token, `application`
        uses the service token, and `auto` uses whichever is connected, trying
        delegated first, then application.
      default: auto
  steps:
    - ref: clear_values
      action: tools.google_api.call_api
      args:
        service_name: sheets
        version: v4
        resource: spreadsheets.values
        method_name: clear
        access_token: ${{ SECRETS.google_sheets_oauth.GOOGLE_SHEETS_USER_TOKEN if inputs.auth_mode == "delegated" else SECRETS.google_sheets_oauth.GOOGLE_SHEETS_SERVICE_TOKEN if inputs.auth_mode == "application" else SECRETS.google_sheets_oauth.GOOGLE_SHEETS_USER_TOKEN || SECRETS.google_sheets_oauth.GOOGLE_SHEETS_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/spreadsheets"]
        params:
          spreadsheetId: ${{ inputs.spreadsheet_id }}
          range: ${{ inputs.range }}
          # The vendor documents this request body as empty.
          body: {}
  returns: ${{ steps.clear_values.result }}
