type: action
definition:
  title: Batch update values by data filter
  description: >-
    Sets values in one or more ranges of a spreadsheet. The caller must specify the spreadsheet ID,
    a valueInputOption, and one or more DataFilterValueRanges.
  display_group: Google Sheets
  doc_url: https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets.values/batchUpdateByDataFilter
  namespace: tools.google_sheets
  name: batch_update_values_by_data_filter
  secrets:
    - type: oauth
      provider_id: google_sheets
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_sheets
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    spreadsheet_id:
      type: str
      description: The ID of the spreadsheet to update.
    data:
      # Generic: each `DataFilterValueRange` embeds a `DataFilter`, a discriminated union that sets
      # exactly one of `a1Range`, `gridRange` or `developerMetadataLookup`.
      type: list[dict[str, Any]]
      description: >-
        The new values to apply to the spreadsheet. If more than one range is matched by the
        specified DataFilter the specified values are applied to all of those ranges. Each
        `DataFilterValueRange` entry has `dataFilter`, `values` and an optional `majorDimension`.
        See
        https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets.values/batchUpdateByDataFilter#DataFilterValueRange
    value_input_option:
      type: str
      description: >-
        How the input data should be interpreted. `RAW` stores the values as-is; `USER_ENTERED`
        parses the values as if the user typed them into the UI.
    include_values_in_response:
      type: bool | None
      description: >-
        Determines if the update response should include the values of the cells that were updated.
        By default, responses do not include the updated values. The `updatedData` field within
        each of the BatchUpdateValuesResponse.responses contains the updated values.
      default: null
    response_value_render_option:
      type: str | None
      description: >-
        Determines how values in the response should be rendered. One of `FORMATTED_VALUE`,
        `UNFORMATTED_VALUE` or `FORMULA`. The default render option is `FORMATTED_VALUE`.
      default: null
    response_date_time_render_option:
      type: str | None
      description: >-
        Determines how dates, times, and durations in the response should be rendered. One of
        `SERIAL_NUMBER` or `FORMATTED_STRING`. This is ignored if response_value_render_option is
        `FORMATTED_VALUE`. The default dateTime render option is `SERIAL_NUMBER`.
      default: null
  steps:
    - ref: build_body
      action: core.script.run_python
      args:
        inputs:
          data: ${{ inputs.data }}
          value_input_option: ${{ inputs.value_input_option }}
          include_values_in_response: ${{ inputs.include_values_in_response }}
          response_value_render_option: ${{ inputs.response_value_render_option }}
          response_date_time_render_option: ${{ inputs.response_date_time_render_option }}
        script: |
          def main(
              data,
              value_input_option,
              include_values_in_response,
              response_value_render_option,
              response_date_time_render_option,
          ):
              body = {"data": data, "valueInputOption": value_input_option}
              if include_values_in_response is not None:
                  body["includeValuesInResponse"] = include_values_in_response
              if response_value_render_option is not None:
                  body["responseValueRenderOption"] = response_value_render_option
              if response_date_time_render_option is not None:
                  body["responseDateTimeRenderOption"] = response_date_time_render_option
              return body
    - ref: batch_update_values_by_data_filter
      action: tools.google_api.call_api
      args:
        service_name: sheets
        version: v4
        resource: spreadsheets.values
        method_name: batchUpdateByDataFilter
        access_token: ${{ SECRETS.google_sheets_oauth.GOOGLE_SHEETS_USER_TOKEN || SECRETS.google_sheets_oauth.GOOGLE_SHEETS_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/spreadsheets"]
        params:
          spreadsheetId: ${{ inputs.spreadsheet_id }}
          body: ${{ steps.build_body.result }}
  returns: ${{ steps.batch_update_values_by_data_filter.result }}
