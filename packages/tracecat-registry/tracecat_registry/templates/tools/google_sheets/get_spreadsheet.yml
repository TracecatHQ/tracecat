type: action
definition:
  title: Get spreadsheet
  description: Retrieve spreadsheet metadata and optional grid data.
  display_group: Google Sheets
  doc_url: https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets/get
  namespace: tools.google_sheets
  name: get_spreadsheet
  secrets:
    - type: oauth
      provider_id: google_sheets
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_sheets
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    spreadsheet_id:
      type: str
      description: Spreadsheet ID to fetch.
    ranges:
      type: list[str] | None
      description: Optional A1 notation ranges to include.
      default: null
    include_grid_data:
      type: bool
      description: Return grid data along with metadata.
      default: false
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          spreadsheet_id: ${{ inputs.spreadsheet_id }}
          ranges: ${{ inputs.ranges }}
          include_grid_data: ${{ inputs.include_grid_data }}
        script: |
          def main(spreadsheet_id, ranges, include_grid_data):
              params = {"spreadsheetId": spreadsheet_id}
              if ranges:
                  params["ranges"] = ranges
              if include_grid_data:
                  params["includeGridData"] = True
              return params
    - ref: get_spreadsheet
      action: tools.google_api.call_api
      args:
        service_name: sheets
        version: v4
        resource: spreadsheets
        method_name: get
        access_token: ${{ SECRETS.google_sheets_oauth.GOOGLE_SHEETS_USER_TOKEN || SECRETS.google_sheets_oauth.GOOGLE_SHEETS_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/spreadsheets.readonly"]
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.get_spreadsheet.result }}
