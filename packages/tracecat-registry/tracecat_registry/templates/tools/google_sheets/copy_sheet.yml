type: action
definition:
  title: Copy sheet
  description: Copy a sheet to another spreadsheet.
  display_group: Google Sheets
  doc_url: https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets.sheets/copyTo
  namespace: tools.google_sheets
  name: copy_sheet
  secrets:
    - type: oauth
      provider_id: google_sheets
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_sheets
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    spreadsheet_id:
      type: str
      description: Source spreadsheet ID.
    sheet_id:
      type: int
      description: ID of the sheet to copy.
    destination_spreadsheet_id:
      type: str
      description: Destination spreadsheet ID.
  steps:
    - ref: copy_sheet
      action: tools.google_api.call_api
      args:
        service_name: sheets
        version: v4
        resource: spreadsheets.sheets
        method_name: copyTo
        access_token: ${{ SECRETS.google_sheets_oauth.GOOGLE_SHEETS_USER_TOKEN || SECRETS.google_sheets_oauth.GOOGLE_SHEETS_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/spreadsheets"]
        params:
          spreadsheetId: ${{ inputs.spreadsheet_id }}
          sheetId: ${{ inputs.sheet_id }}
          body:
            destinationSpreadsheetId: ${{ inputs.destination_spreadsheet_id }}
  returns: ${{ steps.copy_sheet.result }}
