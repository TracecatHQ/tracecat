type: action
definition:
  title: Get developer metadata
  description: >-
    Returns the developer metadata with the specified ID. The caller must specify the spreadsheet ID
    and the developer metadata's unique metadataId.
  display_group: Google Sheets
  doc_url: https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets.developerMetadata/get
  namespace: tools.google_sheets
  name: get_developer_metadata
  secrets:
    - type: oauth
      provider_id: google_sheets
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_sheets
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    spreadsheet_id:
      type: str
      description: The ID of the spreadsheet to retrieve metadata from.
    metadata_id:
      type: int
      description: The ID of the developer metadata to retrieve.
  steps:
    - ref: get_developer_metadata
      action: tools.google_api.call_api
      args:
        service_name: sheets
        version: v4
        resource: spreadsheets.developerMetadata
        method_name: get
        access_token: ${{ SECRETS.google_sheets_oauth.GOOGLE_SHEETS_USER_TOKEN || SECRETS.google_sheets_oauth.GOOGLE_SHEETS_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/spreadsheets"]
        params:
          spreadsheetId: ${{ inputs.spreadsheet_id }}
          metadataId: ${{ inputs.metadata_id }}
  returns: ${{ steps.get_developer_metadata.result }}
