type: action
definition:
  title: Append values
  description: Append rows to a Google Sheets range.
  display_group: Google Sheets
  doc_url: https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets.values/append
  namespace: tools.google_sheets
  name: append_values
  secrets:
    - type: oauth
      provider_id: google_sheets
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_sheets
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    spreadsheet_id:
      type: str
      description: Target spreadsheet ID.
    range:
      type: str
      description: A1 notation range to append to.
    values:
      type: list[list[str | int | float | bool | None]]
      description: Two-dimensional array of values to append.
    value_input_option:
      type: enum["RAW", "USER_ENTERED"]
      description: How input data should be interpreted.
      default: USER_ENTERED
    insert_data_option:
      type: enum["OVERWRITE", "INSERT_ROWS"]
      description: How the input data should be inserted.
      default: INSERT_ROWS
    include_values_in_response:
      type: bool
      description: Include the appended values in the response payload.
      default: false
    major_dimension:
      type: enum["ROWS", "COLUMNS"] | None
      description: Orientation of the values array.
      default: null
  steps:
    - ref: build_append_request
      action: core.script.run_python
      args:
        inputs:
          spreadsheet_id: ${{ inputs.spreadsheet_id }}
          value_input_option: ${{ inputs.value_input_option }}
          insert_data_option: ${{ inputs.insert_data_option }}
          include_values_in_response: ${{ inputs.include_values_in_response }}
          major_dimension: ${{ inputs.major_dimension }}
          values: ${{ inputs.values }}
          range: ${{ inputs.range }}
        script: |
          def main(
              spreadsheet_id,
              value_input_option,
              insert_data_option,
              include_values_in_response,
              major_dimension,
              values,
              range,
          ):
              params = {
                  "spreadsheetId": spreadsheet_id,
                  "range": range,
                  "valueInputOption": value_input_option,
              }
              if insert_data_option:
                  params["insertDataOption"] = insert_data_option
              if include_values_in_response:
                  params["includeValuesInResponse"] = True

              body = {"range": range, "values": values}
              if major_dimension:
                  body["majorDimension"] = major_dimension

              params["body"] = body
              return params
    - ref: append_values
      action: tools.google_api.call_api
      args:
        service_name: sheets
        version: v4
        resource: spreadsheets.values
        method_name: append
        access_token: ${{ SECRETS.google_sheets_oauth.GOOGLE_SHEETS_USER_TOKEN || SECRETS.google_sheets_oauth.GOOGLE_SHEETS_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/spreadsheets"]
        params: ${{ steps.build_append_request.result }}
  returns: ${{ steps.append_values.result }}
