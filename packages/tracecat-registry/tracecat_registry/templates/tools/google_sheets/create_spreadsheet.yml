type: action
definition:
  title: Create spreadsheet
  description: Create a new Google Spreadsheet with an optional set of sheets.
  display_group: Google Sheets
  doc_url: https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets/create
  namespace: tools.google_sheets
  name: create_spreadsheet
  secrets:
    - type: oauth
      provider_id: google_sheets
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_sheets
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    title:
      type: str
      description: Spreadsheet title.
    sheet_titles:
      type: list[str] | None
      description: Optional list of sheet titles to create.
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          title: ${{ inputs.title }}
          sheet_titles: ${{ inputs.sheet_titles }}
        script: |
          def main(title, sheet_titles):
              payload = {"properties": {"title": title}}
              if sheet_titles:
                  payload["sheets"] = [
                      {"properties": {"title": sheet_title}} for sheet_title in sheet_titles
                  ]
              return {"body": payload}
    - ref: create_spreadsheet
      action: tools.google_api.call_api
      args:
        service_name: sheets
        version: v4
        resource: spreadsheets
        method_name: create
        access_token: ${{ SECRETS.google_sheets_oauth.GOOGLE_SHEETS_USER_TOKEN || SECRETS.google_sheets_oauth.GOOGLE_SHEETS_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/spreadsheets"]
        params: ${{ steps.build_payload.result }}
  returns: ${{ steps.create_spreadsheet.result }}
