type: action
definition:
  title: Lookup IPs context
  description: >-
    Get full context for multiple IP addresses. Calls POST /v3/ip directly.
  display_group: GreyNoise
  doc_url: https://docs.greynoise.io/reference/v3multiip
  namespace: tools.greynoise
  name: lookup_ips_context
  secrets:
    - name: greynoise
      keys: ["GREYNOISE_API_KEY"]
  expects:
    ips:
      type: list[str]
      description: IPv4 addresses to lookup. GreyNoise supports up to 10000 per request.
    workspace_labels:
      type: str | None
      description: >-
        Comma-separated list of dataset scopes to include in the query. When omitted, only the
        default GreyNoise global dataset is queried. Allowed values are greynoise (GreyNoise's
        global dataset), community (aggregated community-contributed data), and personal (the
        authenticated caller's own workspace data).
      default: null
    base_url:
      type: str | None
      description: GreyNoise API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.greynoise.base_url || "https://api.greynoise.io" }}/v3/ip
        method: POST
        headers:
          key: ${{ SECRETS.greynoise.GREYNOISE_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          workspace_labels: ${{ inputs.workspace_labels }}
        payload:
          ips: ${{ inputs.ips }}
  returns: ${{ steps.request.result }}
