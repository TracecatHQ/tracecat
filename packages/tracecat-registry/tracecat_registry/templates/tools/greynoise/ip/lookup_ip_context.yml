type: action
definition:
  title: Lookup IP context
  description: >-
    Get full context for an IP address. Calls GET /v3/ip/{ip} directly.
  display_group: GreyNoise
  doc_url: https://docs.greynoise.io/reference/v3ip
  namespace: tools.greynoise
  name: lookup_ip_context
  secrets:
    - name: greynoise
      keys: ["GREYNOISE_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: GreyNoise API base URL.
      default: null
    ip:
      type: str
      description: IPv4 address to lookup.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.greynoise.base_url || "https://api.greynoise.io" }}/v3/ip/${{ FN.url_encode(inputs.ip) }}
        method: GET
        headers:
          key: ${{ SECRETS.greynoise.GREYNOISE_API_KEY }}
          Accept: application/json
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
