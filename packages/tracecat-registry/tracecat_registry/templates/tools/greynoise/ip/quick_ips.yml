type: action
definition:
  title: Quick IPs
  description: >-
    Get quick context for multiple IP addresses. Calls POST /v3/ip directly with quick enabled.
  display_group: GreyNoise
  doc_url: https://docs.greynoise.io/reference/v3multiip
  namespace: tools.greynoise
  name: quick_ips
  secrets:
    - name: greynoise
      keys: ["GREYNOISE_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: GreyNoise API base URL.
      default: null
    ips:
      type: list[str]
      description: IPv4 addresses to lookup. GreyNoise supports up to 10000 per request.
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.greynoise.base_url || "https://api.greynoise.io" }}/v3/ip
        method: POST
        headers:
          key: ${{ SECRETS.greynoise.GREYNOISE_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        params:
          quick: true
        payload:
          ips: ${{ inputs.ips }}
  returns: ${{ steps.request.result }}
