type: action
definition:
  title: Get IP timeline
  description: >-
    Get an IP timeline field summary. Calls GET /v3/noise/ips/{ip}/timeline directly.
  display_group: GreyNoise
  doc_url: https://docs.greynoise.io/reference/getiptimelinefieldsummary
  namespace: tools.greynoise
  name: get_ip_timeline
  secrets:
    - name: greynoise
      keys: ["GREYNOISE_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: GreyNoise API base URL.
      default: null
    ip:
      type: str
      description: IPv4 address to lookup.
    field:
      type: str | None
      description: Timeline field to summarize.
      default: "classification"
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.greynoise.base_url || "https://api.greynoise.io" }}/v3/noise/ips/${{ FN.url_encode(inputs.ip) }}/timeline
        method: GET
        headers:
          key: ${{ SECRETS.greynoise.GREYNOISE_API_KEY }}
          Accept: application/json
        params: '${{ FN.merge([{"field": inputs.field}, inputs.params || {}]) }}'
  returns: ${{ steps.request.result }}
