type: action
definition:
  title: Export detection rules
  description: Export Elastic Security detection rules as NDJSON text.
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-exportrules
  namespace: tools.elastic_security
  name: export_detection_rules
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    payload:
      # Generic: this endpoint rejects an explicit null on optional body fields, and a
      # literal payload map cannot omit an unset optional. Fields are in the description.
      type: dict[str, Any]
      description: API-native JSON request body.
    exclude_export_details:
      type: bool | None
      description: Determines whether a summary of the exported rules is returned. Defaults to `false`.
      default: null
    file_name:
      type: str | None
      description: File name for saving the exported rules. Defaults to `export.ndjson`.
      default: null
    base_url:
      type: str | None
      description: Kibana base URL (e.g. https://localhost:5601).
      default: null
    space_id:
      type: str | None
      description: Optional Kibana space ID. Omit for the default space.
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          path: /api/detection_engine/rules/_export
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(path, space_id):
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: POST
        params:
          exclude_export_details: ${{ inputs.exclude_export_details }}
          file_name: ${{ inputs.file_name }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
