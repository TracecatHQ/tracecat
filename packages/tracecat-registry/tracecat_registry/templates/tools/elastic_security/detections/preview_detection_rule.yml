type: action
definition:
  title: Preview detection rule
  description: Preview alerts generated by an Elastic Security detection rule.
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-rulepreview
  namespace: tools.elastic_security
  name: preview_detection_rule
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    payload:
      # Free-form: the vendor documents this body as a discriminated union on `type` across 8 rule kinds, so there is
      # no single field set to enumerate.
      type: dict[str, Any]
      description: API-native JSON request body.
    enable_logged_requests:
      type: bool | None
      description: Enables logging and returning in response ES queries, performed during rule execution.
      default: null
    base_url:
      type: str | None
      description: Kibana base URL (e.g. https://localhost:5601).
      default: null
    space_id:
      type: str | None
      description: Optional Kibana space ID. Omit for the default space.
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          path: /api/detection_engine/rules/preview
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(path, space_id):
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: POST
        params:
          enable_logged_requests: ${{ inputs.enable_logged_requests }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
