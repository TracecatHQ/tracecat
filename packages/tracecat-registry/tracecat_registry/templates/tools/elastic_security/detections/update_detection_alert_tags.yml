type: action
definition:
  title: Update detection alert tags
  description: Add or remove tags on Elastic Security detection alerts.
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-setalerttags
  namespace: tools.elastic_security
  name: update_detection_alert_tags
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    ids:
      type: list[str]
      description: A list of alerts `id`s.
    tags:
      # Documented object shape; the `expects` grammar has no nested-object type,
      # so the vendor's sub-keys are named in the description instead.
      type: dict[str, Any]
      description: Object with list of tags to add and remove. Requires `tags_to_add` and `tags_to_remove`, each a list of keywords to organize related alerts into categories that you can filter and group.
    base_url:
      type: str | None
      description: Kibana base URL (e.g. https://localhost:5601).
      default: null
    space_id:
      type: str | None
      description: Optional Kibana space ID. Omit for the default space.
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          path: /api/detection_engine/signals/tags
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(path, space_id):
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: POST
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
          Content-Type: application/json
        payload:
          ids: ${{ inputs.ids }}
          tags: ${{ inputs.tags }}
  returns: ${{ steps.request.result.data }}
