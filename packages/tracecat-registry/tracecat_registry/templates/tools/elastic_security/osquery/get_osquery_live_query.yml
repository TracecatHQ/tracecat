type: action
definition:
  title: Get osquery live query
  description: "Get an osquery live query's details, including the action ID of each query in the pack, to use with get_osquery_live_query_results."
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-osquerygetlivequerydetails
  namespace: tools.elastic_security
  name: get_osquery_live_query
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    id:
      type: str
      description: "The ID of the live query."
    base_url:
      type: str | None
      description: "Kibana base URL (e.g. https://localhost:5601)."
      default: null
    space_id:
      type: str | None
      description: "Optional Kibana space ID. Omit for the default space."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
          id: ${{ inputs.id }}
        script: |
          from urllib.parse import quote

          def main(space_id, id):
              path = f"/api/osquery/live_queries/{quote(str(id), safe='')}"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: GET
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
  returns: ${{ steps.request.result }}
