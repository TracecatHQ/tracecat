type: action
definition:
  title: Get osquery live query results
  description: "Get the result rows of one query in an osquery live query. One page per call."
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-osquerygetlivequeryresults
  namespace: tools.elastic_security
  name: get_osquery_live_query_results
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    id:
      type: str
      description: "The ID of the live query."
    action_id:
      type: str
      description: "The ID of the query action (`queries[].action_id` from get_osquery_live_query)."
    kuery:
      type: str | None
      description: "A KQL search string to filter results."
      default: null
    page:
      type: int | None
      description: "The page number to return."
      default: null
    page_size:
      type: int | None
      description: "The number of results to return per page."
      default: null
    sort:
      type: str | None
      description: "The field to sort results by."
      default: null
    sort_order:
      type: str | None
      description: "The sort order. Possible values: asc, desc."
      default: null
    base_url:
      type: str | None
      description: "Kibana base URL (e.g. https://localhost:5601)."
      default: null
    space_id:
      type: str | None
      description: "Optional Kibana space ID. Omit for the default space."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
          id: ${{ inputs.id }}
          action_id: ${{ inputs.action_id }}
        script: |
          from urllib.parse import quote

          def main(space_id, id, action_id):
              path = f"/api/osquery/live_queries/{quote(str(id), safe='')}/results/{quote(str(action_id), safe='')}"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: GET
        params:
          kuery: ${{ inputs.kuery }}
          page: ${{ inputs.page }}
          pageSize: ${{ inputs.page_size }}
          sort: ${{ inputs.sort }}
          sortOrder: ${{ inputs.sort_order }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
  returns: ${{ steps.request.result }}
