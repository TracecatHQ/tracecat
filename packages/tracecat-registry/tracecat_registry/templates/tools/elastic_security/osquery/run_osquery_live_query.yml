type: action
definition:
  title: Run Osquery live query
  description: Run an API-native Osquery live query against Elastic Agents for host investigation.
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-osquerycreatelivequery
  namespace: tools.elastic_security
  name: run_osquery_live_query
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    payload:
      type: dict[str, Any]
      description: API-native live query JSON request body, including targets and query or pack details.
    params:
      type: dict[str, Any] | None
      description: Optional native Kibana query parameters.
      default: null
    base_url:
      type: str | None
      description: Kibana base URL (e.g. https://localhost:5601).
      default: null
    space_id:
      type: str | None
      description: Optional Kibana space ID. Omit for the default space.
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = "/api/osquery/live_queries"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: POST
        params: ${{ inputs.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
