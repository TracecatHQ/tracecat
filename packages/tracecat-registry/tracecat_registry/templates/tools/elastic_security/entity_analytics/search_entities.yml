type: action
definition:
  title: Search entities
  description: Search Elastic Entity Store records for investigation context, including entity risk and asset data.
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-get-security-entity-store-entities
  namespace: tools.elastic_security
  name: search_entities
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    filter:
      type: str | None
      description: A Kibana Query Language (KQL) filter for the search-after mode.
      default: null
    size:
      type: int | None
      description: Number of entities to return in search-after mode.
      default: null
    searchAfter:
      type: str | None
      description: JSON-encoded search_after value for cursor-based pagination.
      default: null
    source:
      type: list[str] | None
      description: Fields to include in the response source.
      default: null
    fields:
      type: list[str] | None
      description: Fields to include in the response.
      default: null
    sort_field:
      type: str | None
      description: Field to sort results by in page mode.
      default: null
    sort_order:
      type: str | None
      description: "Sort order in page mode. Possible values: asc, desc."
      default: null
    page:
      type: int | None
      description: Page number to return (1-indexed) in page mode.
      default: null
    per_page:
      type: int | None
      description: Number of entities per page in page mode.
      default: null
    filterQuery:
      type: str | None
      description: An Elasticsearch query string to filter entities in page mode.
      default: null
    entity_types:
      type: list[str] | None
      description: "Entity types to include in the results. Possible values: user, host, service, generic."
      default: null
    base_url:
      type: str | None
      description: Kibana base URL (e.g. https://localhost:5601).
      default: null
    space_id:
      type: str | None
      description: Optional Kibana space ID. Omit for the default space.
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = "/api/security/entity_store/entities"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: GET
        params:
          filter: ${{ inputs.filter }}
          size: ${{ inputs.size }}
          searchAfter: ${{ inputs.searchAfter }}
          source: ${{ inputs.source }}
          fields: ${{ inputs.fields }}
          sort_field: ${{ inputs.sort_field }}
          sort_order: ${{ inputs.sort_order }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          filterQuery: ${{ inputs.filterQuery }}
          entity_types: ${{ inputs.entity_types }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
  returns: ${{ steps.request.result.data }}
