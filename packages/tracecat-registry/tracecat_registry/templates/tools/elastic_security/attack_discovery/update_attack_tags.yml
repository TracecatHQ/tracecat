type: action
definition:
  title: Update attack tags
  description: "Add or remove tags on Attack Discovery attack alerts. Requires Kibana 9.5+."
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-setattackstags
  namespace: tools.elastic_security
  name: update_attack_tags
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    ids:
      type: list[str]
      description: "A list of attack alert `id`s."
    tags:
      # Documented object shape; the `expects` grammar has no nested-object type,
      # so the vendor's sub-keys are named in the description instead.
      type: dict[str, Any]
      description: "Object with `tags_to_add` and `tags_to_remove`, each a list of tags."
    update_related_alerts:
      type: bool
      description: "When `true`, the change is also applied to detection alerts related to the attacks."
      default: false
    base_url:
      type: str | None
      description: "Kibana base URL (e.g. https://localhost:5601)."
      default: null
    space_id:
      type: str | None
      description: "Optional Kibana space ID. Omit for the default space."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = f"/api/detection_engine/attacks/tags"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: POST
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
          Content-Type: application/json
        payload:
          ids: ${{ inputs.ids }}
          tags: ${{ inputs.tags }}
          update_related_alerts: ${{ inputs.update_related_alerts }}
  returns: ${{ steps.request.result }}
