type: action
definition:
  title: Search attack discoveries
  description: Search existing Elastic Attack Discovery results using native filters and pagination.
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-attackdiscoveryfind
  namespace: tools.elastic_security
  name: search_attack_discoveries
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    params:
      type: dict[str, Any] | None
      description: Optional native search, filter, pagination, and sorting parameters.
      default: null
    base_url:
      type: str | None
      description: Kibana base URL (e.g. https://localhost:5601).
      default: null
    space_id:
      type: str | None
      description: Optional Kibana space ID. Omit for the default space.
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = "/api/attack_discovery/_find"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: GET
        params: ${{ inputs.params }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
  returns: ${{ steps.request.result.data }}
