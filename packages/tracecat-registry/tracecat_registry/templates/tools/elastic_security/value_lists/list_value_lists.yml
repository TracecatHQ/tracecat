type: action
definition:
  title: List value lists
  description: "List Elastic Security value lists (used by exceptions and indicator-match rules)."
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-findlists
  namespace: tools.elastic_security
  name: list_value_lists
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    page:
      type: int | None
      description: "The page number to return."
      default: null
    per_page:
      type: int | None
      description: "The number of results to return per page."
      default: null
    sort_field:
      type: str | None
      description: "Determines which field is used to sort the results."
      default: null
    sort_order:
      type: str | None
      description: "Determines the sort order. Possible values: asc, desc."
      default: null
    cursor:
      type: str | None
      description: "Cursor returned by a previous call; pass it to continue listing from the next page."
      default: null
    filter:
      type: str | None
      description: "Filters the returned results according to the value of the specified field, using the `<field name>:<field value>` syntax."
      default: null
    base_url:
      type: str | None
      description: "Kibana base URL (e.g. https://localhost:5601)."
      default: null
    space_id:
      type: str | None
      description: "Optional Kibana space ID. Omit for the default space."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = f"/api/lists/_find"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: GET
        params:
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          sort_field: ${{ inputs.sort_field }}
          sort_order: ${{ inputs.sort_order }}
          cursor: ${{ inputs.cursor }}
          filter: ${{ inputs.filter }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
  returns: ${{ steps.request.result }}
