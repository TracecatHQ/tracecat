type: action
definition:
  title: Delete value list item
  description: "Delete an Elastic Security value list item by `id`, or by `list_id` and `value`."
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-deletelistitem
  namespace: tools.elastic_security
  name: delete_value_list_item
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    id:
      type: str | None
      description: "Value list item identifier. Required if `list_id` and `value` are not specified."
      default: null
    list_id:
      type: str | None
      description: "Value list `id`. Required if `id` is not specified."
      default: null
    value:
      type: str | None
      description: "The item value. Required if `id` is not specified."
      default: null
    refresh:
      type: str | None
      description: "Determines when changes are visible to search. Possible values: true, false, wait_for."
      default: null
    base_url:
      type: str | None
      description: "Kibana base URL (e.g. https://localhost:5601)."
      default: null
    space_id:
      type: str | None
      description: "Optional Kibana space ID. Omit for the default space."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = f"/api/lists/items"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: DELETE
        params:
          id: ${{ inputs.id }}
          list_id: ${{ inputs.list_id }}
          value: ${{ inputs.value }}
          refresh: ${{ inputs.refresh }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
  returns: ${{ steps.request.result }}
