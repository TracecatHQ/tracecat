type: action
definition:
  title: Create value list
  description: "Create an Elastic Security value list, e.g. an IP or keyword blocklist referenced by exception items."
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-createlist
  namespace: tools.elastic_security
  name: create_value_list
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    payload:
      # Generic: this endpoint rejects an explicit null on optional body fields, and a
      # literal payload map cannot omit an unset optional. Fields are in the description.
      type: dict[str, Any]
      description: "API-native JSON request body. Requires `name`, `description`, and `type` (e.g. `ip`, `ip_range`, `keyword`, `text`); optional `id`, `meta`, `version`."
    base_url:
      type: str | None
      description: "Kibana base URL (e.g. https://localhost:5601)."
      default: null
    space_id:
      type: str | None
      description: "Optional Kibana space ID. Omit for the default space."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = f"/api/lists"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: POST
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
          Content-Type: application/json
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result }}
