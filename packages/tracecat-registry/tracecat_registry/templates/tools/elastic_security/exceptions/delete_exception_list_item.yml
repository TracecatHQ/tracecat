type: action
definition:
  title: Delete exception list item
  description: Delete an Elastic Security exception list item.
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-deleteexceptionlistitem
  namespace: tools.elastic_security
  name: delete_exception_list_item
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    id:
      type: str | None
      description: Exception item's identifier. Either `id` or `item_id` must be specified.
      default: null
    item_id:
      type: str | None
      description: Human readable exception item string identifier, e.g. `trusted-linux-processes`. Either `id` or `item_id` must be specified.
      default: null
    namespace_type:
      type: str | None
      description: "`single` deletes the item in the current Kibana space; `agnostic` deletes an item in a space-agnostic list. Must match the list that owns the item. Defaults to single."
      default: null
    base_url:
      type: str | None
      description: Kibana base URL (e.g. https://localhost:5601).
      default: null
    space_id:
      type: str | None
      description: Optional Kibana space ID. Omit for the default space.
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = "/api/exception_lists/items"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: DELETE
        params:
          id: ${{ inputs.id }}
          item_id: ${{ inputs.item_id }}
          namespace_type: ${{ inputs.namespace_type }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
  returns: ${{ steps.request.result.data }}
