type: action
definition:
  title: List timelines
  description: "List Elastic Security Timelines or Timeline templates. One page per call."
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-gettimelines
  namespace: tools.elastic_security
  name: list_timelines
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    only_user_favorite:
      type: bool | None
      description: "If `true`, only Timelines the current user marked as favorite are returned."
      default: null
    timeline_type:
      type: str | None
      description: "Possible values: default, template."
      default: null
    sort_field:
      type: str | None
      description: "Possible values: title, description, updated, created."
      default: null
    sort_order:
      type: str | None
      description: "Possible values: asc, desc."
      default: null
    page_size:
      type: int | None
      description: "How many results to return at once."
      default: null
    page_index:
      type: int | None
      description: "How many pages to skip."
      default: null
    search:
      type: str | None
      description: "Search Timelines by title."
      default: null
    status:
      type: str | None
      description: "Possible values: active, draft, immutable."
      default: null
    base_url:
      type: str | None
      description: "Kibana base URL (e.g. https://localhost:5601)."
      default: null
    space_id:
      type: str | None
      description: "Optional Kibana space ID. Omit for the default space."
      default: null
    verify_ssl:
      type: bool
      description: "Whether to verify SSL certificates."
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = f"/api/timelines"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: GET
        params:
          only_user_favorite: ${{ inputs.only_user_favorite }}
          timeline_type: ${{ inputs.timeline_type }}
          sort_field: ${{ inputs.sort_field }}
          sort_order: ${{ inputs.sort_order }}
          page_size: ${{ inputs.page_size }}
          page_index: ${{ inputs.page_index }}
          search: ${{ inputs.search }}
          status: ${{ inputs.status }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
  returns: ${{ steps.request.result }}
