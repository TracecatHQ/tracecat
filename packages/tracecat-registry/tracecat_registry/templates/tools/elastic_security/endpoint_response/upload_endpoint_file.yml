type: action
definition:
  title: Upload endpoint file
  description: Upload a file to one or more Elastic Endpoints.
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-endpointuploadaction
  namespace: tools.elastic_security
  name: upload_endpoint_file
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    payload:
      # Generic: assembled into multipart form data by the build_form_data step below,
      # which owns this body's field handling.
      type: dict[str, Any]
      description: API-native multipart fields, such as endpoint_ids and parameters.
    base64_content:
      type: str
      description: Base64-encoded file content.
    filename:
      type: str
      description: Filename sent to Elastic.
    content_type:
      type: str
      description: MIME type of the uploaded file.
      default: application/octet-stream
    base_url:
      type: str | None
      description: Kibana base URL (e.g. https://localhost:5601).
      default: null
    space_id:
      type: str | None
      description: Optional Kibana space ID. Omit for the default space.
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_form_data
      action: core.script.run_python
      args:
        inputs:
          payload: ${{ inputs.payload }}
        script: |
          import json

          def main(payload):
              form_data = {}
              for key, value in payload.items():
                  if isinstance(value, list):
                      form_data[key] = value
                  elif isinstance(value, (dict, bool)) or value is None:
                      form_data[key] = json.dumps(value, separators=(",", ":"))
                  else:
                      form_data[key] = value
              return form_data
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(space_id):
              path = "/api/endpoint/action/upload"
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: POST
        form_data: ${{ steps.build_form_data.result }}
        files:
          file:
            filename: ${{ inputs.filename }}
            content_base64: ${{ inputs.base64_content }}
            content_type: ${{ inputs.content_type }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
          kbn-xsrf: tracecat
        verify_ssl: ${{ inputs.verify_ssl }}
  returns: ${{ steps.request.result.data }}
