type: action
definition:
  title: List endpoint scripts
  description: List scripts in the Elastic Endpoint response script library.
  display_group: Elastic Security
  doc_url: https://www.elastic.co/docs/api/doc/kibana/operation/operation-endpointscriptlibrarylistscripts
  namespace: tools.elastic_security
  name: list_endpoint_scripts
  secrets:
    - name: elastic_security
      keys: ["ELASTIC_API_KEY"]
  expects:
    page:
      type: int | None
      description: Page number of the results to return. Defaults to 1.
      default: null
    pageSize:
      type: int | None
      description: Number of results to return per page. Defaults to 10. Max value is 1000.
      default: null
    sortField:
      type: str | None
      description: The field to sort the results by. Defaults to name. Allowed values are `name`, `createdAt`, `createdBy`, `updatedAt`, `updatedBy`, `fileSize`.
      default: null
    sortDirection:
      type: str | None
      description: The direction to sort the results by. Defaults to asc (ascending). Allowed values are `asc`, `desc`.
      default: null
    kuery:
      type: str | None
      description: A KQL query string to filter the list of scripts. Nearly all fields in the script object are searchable.
      default: null
    base_url:
      type: str | None
      description: Kibana base URL (e.g. https://localhost:5601).
      default: null
    space_id:
      type: str | None
      description: Optional Kibana space ID. Omit for the default space.
      default: null
    verify_ssl:
      type: bool
      description: Whether to verify SSL certificates.
      default: true
  steps:
    - ref: build_path
      action: core.script.run_python
      args:
        inputs:
          path: /api/endpoint/scripts_library
          space_id: ${{ inputs.space_id }}
        script: |
          from urllib.parse import quote

          def main(path, space_id):
              if space_id:
                  return f"/s/{quote(space_id, safe='')}{path}"
              return path
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.elastic_security.base_url }}${{ steps.build_path.result }}
        method: GET
        params:
          page: ${{ inputs.page }}
          pageSize: ${{ inputs.pageSize }}
          sortField: ${{ inputs.sortField }}
          sortDirection: ${{ inputs.sortDirection }}
          kuery: ${{ inputs.kuery }}
        verify_ssl: ${{ inputs.verify_ssl }}
        headers:
          Authorization: ApiKey ${{ SECRETS.elastic_security.ELASTIC_API_KEY }}
  returns: ${{ steps.request.result.data }}
