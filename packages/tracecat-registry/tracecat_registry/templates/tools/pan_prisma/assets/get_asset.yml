type: action
definition:
  title: Get asset
  description: Returns details for a unified asset, selected by the type of data to query (e.g. asset, alerts, findings, vulnerabilities, network, timeline, raw_config). Calls POST /uai/v1/asset directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/get-asset-details-by-id/
  namespace: tools.pan_prisma
  name: get_asset
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    assetId:
      type: str
      description: Unified Asset ID or RRN (Restricted Resource Name).
    type:
      type: str
      description: Asset Domain Service query type, e.g. asset, asset_lite, alerts, alert_summary, findings, vulnerabilities, network, timeline, raw_config, relationships, permissions, attack_path.
    limit:
      type: int | None
      description: Limit number of records.
      default: null
    pageToken:
      type: str | None
      description: Next page token.
      default: null
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/uai/v1/asset
      method: POST
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
        Content-Type: application/json
      payload:
        assetId: ${{ inputs.assetId }}
        type: ${{ inputs.type }}
        limit: ${{ inputs.limit }}
        pageToken: ${{ inputs.pageToken }}
  returns: ${{ steps.request.result }}
