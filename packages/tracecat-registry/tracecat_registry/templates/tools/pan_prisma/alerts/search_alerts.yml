type: action
definition:
  title: Search alerts
  description: Returns a paginated list of alerts that matches the constraints specified in the body parameters. Calls POST /v2/alert directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/post-alerts-v-2/
  namespace: tools.pan_prisma
  name: search_alerts
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    timeRange:
      type: dict[str, Any] | None
      description: 'Time range object, see the Prisma Cloud Time Range Model. Examples: {"type": "relative", "value": {"amount": 24, "unit": "hour"}}, {"type": "to_now", "value": "epoch"}, or {"type": "absolute", "value": {"startTime": 1700000000000, "endTime": 1700086400000}}.'
      default: null
    filters:
      type: list[dict[str, Any]] | None
      description: 'Filtering parameters as a list of {"name": ..., "operator": "=", "value": ...} objects. For filter names and values, see the corresponding List Filters and filter suggestion APIs. Common names include alert.status, alert.id, policy.severity, policy.name, cloud.account and resource.id.'
      default: null
    fields:
      type: list[str] | None
      description: Specific fields to return, e.g. alert.id, alert.status, alert.time, cloud.account, cloud.accountId, cloud.region, resource.id, resource.name, policy.name, policy.type, policy.severity.
      default: null
    limit:
      type: int | None
      description: Maximum number of items to return. When data is paginated, maximum number of items per page.
      default: null
    pageToken:
      type: str | None
      description: Set to the nextPageToken from a previous response to return the next page of data.
      default: null
    sortBy:
      type: list[str] | None
      description: Sort properties. Append :asc or :desc to the key, e.g. alertTime:desc. Valid keys are listed in the response's sortAllowedColumns.
      default: null
    detailed:
      type: bool | None
      description: true = Return detailed alert data. Default is false.
      default: null
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/v2/alert
      method: POST
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
        Content-Type: application/json
      params:
        detailed: ${{ inputs.detailed }}
      payload:
        timeRange: ${{ inputs.timeRange }}
        filters: ${{ inputs.filters }}
        fields: ${{ inputs.fields }}
        limit: ${{ inputs.limit }}
        pageToken: ${{ inputs.pageToken }}
        sortBy: ${{ inputs.sortBy }}
  returns: ${{ steps.request.result }}
