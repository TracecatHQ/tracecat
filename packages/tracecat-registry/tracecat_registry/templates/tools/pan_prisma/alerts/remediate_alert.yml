type: action
definition:
  title: Remediate alert
  description: Remediates the alert with the specified ID if that alert is associated with a remediable policy. Calls PATCH /alert/remediation/{id} directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/perform-remediation-for-alert/
  namespace: tools.pan_prisma
  name: remediate_alert
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    id:
      type: str
      description: Alert ID.
    findingId:
      type: str | None
      description: Finding ID.
      default: null
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/alert/remediation/${{ FN.url_encode(inputs.id) }}
      method: PATCH
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
      params:
        findingId: ${{ inputs.findingId }}
  returns: ${{ steps.request.result }}
