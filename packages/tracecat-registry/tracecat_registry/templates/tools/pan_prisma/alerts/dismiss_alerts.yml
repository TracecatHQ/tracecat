type: action
definition:
  title: Dismiss or snooze alerts
  description: Dismisses one or more alerts on the Prisma Cloud platform. If the caller specifies a dismissal time range, then alerts will snooze for that time period rather than be dismissed. Calls POST /alert/dismiss directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/dismiss-alerts/
  namespace: tools.pan_prisma
  name: dismiss_alerts
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    alerts:
      type: list[str] | None
      description: Alert IDs.
      default: null
    policies:
      type: list[str] | None
      description: Policy IDs.
      default: null
    dismissalNote:
      type: str
      description: Reason for dismissal.
    filter:
      type: dict[str, Any]
      description: 'Filter to narrow the alerts. filter.timeRange is required, e.g. {"timeRange": {"type": "to_now", "value": "epoch"}}. Can also include filters, a list of name/operator/value objects.'
    dismissalTimeRange:
      type: dict[str, Any] | None
      description: 'Dismissal time range. Set this to snooze instead of dismiss, e.g. {"type": "relative", "value": {"amount": 7, "unit": "day"}}.'
      default: null
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/alert/dismiss
      method: POST
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
        Content-Type: application/json
      payload:
        alerts: ${{ inputs.alerts }}
        policies: ${{ inputs.policies }}
        dismissalNote: ${{ inputs.dismissalNote }}
        filter: ${{ inputs.filter }}
        dismissalTimeRange: ${{ inputs.dismissalTimeRange }}
  returns: ${{ steps.request.result }}
