type: action
definition:
  title: Reopen alerts
  description: Sets the status of one or more dismissed or snoozed alerts on the Prisma Cloud platform to open. Calls POST /alert/reopen directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/reopen-alerts/
  namespace: tools.pan_prisma
  name: reopen_alerts
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    alerts:
      type: list[str] | None
      description: Alert IDs.
      default: null
    policies:
      type: list[str] | None
      description: Policy IDs.
      default: null
    filter:
      type: dict[str, Any]
      description: 'Filter to narrow the alerts. filter.timeRange is required, e.g. {"timeRange": {"type": "to_now", "value": "epoch"}}. Can also include filters, a list of name/operator/value objects.'
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/alert/reopen
      method: POST
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
        Content-Type: application/json
      payload:
        alerts: ${{ inputs.alerts }}
        policies: ${{ inputs.policies }}
        filter: ${{ inputs.filter }}
  returns: ${{ steps.request.result }}
