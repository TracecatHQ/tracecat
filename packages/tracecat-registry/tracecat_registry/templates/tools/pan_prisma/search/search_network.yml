type: action
definition:
  title: Search network (RQL)
  description: Perform a search against flow logs with an RQL query. Calls POST /search directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/search-network/
  namespace: tools.pan_prisma
  name: search_network
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    query:
      type: str
      description: RQL query, e.g. network from vpc.flow_record where dest.publicnetwork IN ('Suspicious IPs').
    timeRange:
      type: dict[str, Any]
      description: 'Time range object, see the Prisma Cloud Time Range Model. Examples: {"type": "relative", "value": {"amount": 24, "unit": "hour"}}, {"type": "to_now", "value": "epoch"}, or {"type": "absolute", "value": {"startTime": 1700000000000, "endTime": 1700086400000}}.'
    cloudType:
      type: str | None
      description: 'Cloud type: aws, azure, gcp, alibaba_cloud or oci.'
      default: null
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/search
      method: POST
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
        Content-Type: application/json
      payload:
        query: ${{ inputs.query }}
        timeRange: ${{ inputs.timeRange }}
        cloudType: ${{ inputs.cloudType }}
  returns: ${{ steps.request.result }}
