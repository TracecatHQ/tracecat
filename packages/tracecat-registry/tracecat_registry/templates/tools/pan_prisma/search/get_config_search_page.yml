type: action
definition:
  title: Get next config search page
  description: Returns the next page of config search results, using the nextPageToken from the previous page. Calls POST /search/config/page directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/search-config-page/
  namespace: tools.pan_prisma
  name: get_config_search_page
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    pageToken:
      type: str
      description: Page token (nextPageToken from the previous response).
    limit:
      type: int | None
      description: Results per page.
      default: null
    withResourceJson:
      type: bool | None
      description: true = include resource JSON.
      default: null
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/search/config/page
      method: POST
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
        Content-Type: application/json
      payload:
        pageToken: ${{ inputs.pageToken }}
        limit: ${{ inputs.limit }}
        withResourceJson: ${{ inputs.withResourceJson }}
  returns: ${{ steps.request.result }}
