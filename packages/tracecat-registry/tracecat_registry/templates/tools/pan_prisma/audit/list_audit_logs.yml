type: action
definition:
  title: List audit logs
  description: Returns audit logs for events that took place on the Prisma Cloud platform. Calls GET /audit/redlock directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/rl-audit-logs/
  namespace: tools.pan_prisma
  name: list_audit_logs
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    timeType:
      type: str | None
      description: 'Time type: relative.'
      default: null
    timeAmount:
      type: int | None
      description: Time amount.
      default: null
    timeUnit:
      type: str | None
      description: 'Time unit: minute, hour, day, week, month or year.'
      default: null
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/audit/redlock
      method: GET
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
      params:
        timeType: ${{ inputs.timeType }}
        timeAmount: ${{ inputs.timeAmount }}
        timeUnit: ${{ inputs.timeUnit }}
  returns: ${{ steps.request.result }}
