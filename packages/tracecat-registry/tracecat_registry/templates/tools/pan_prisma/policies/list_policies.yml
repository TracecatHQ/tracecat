type: action
definition:
  title: List policies
  description: Returns all available policies, both system default and custom. Apply filters to narrow the returned policy list. Calls GET /v2/policy directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/get-policies-v-2/
  namespace: tools.pan_prisma
  name: list_policies
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    policy_name:
      type: str | None
      description: Policy name (policy.name).
      default: null
    policy_severity:
      type: str | None
      description: 'Policy severity (policy.severity): critical, high, medium, low or informational.'
      default: null
    policy_label:
      type: str | None
      description: Policy label (policy.label).
      default: null
    policy_type:
      type: str | None
      description: 'Policy type (policy.type): config, network or audit_event.'
      default: null
    policy_subtype:
      type: str | None
      description: Policy subtype (policy.subtype), e.g. run, build, audit, network_event, ueba.
      default: null
    policy_enabled:
      type: str | None
      description: 'Policy enabled (policy.enabled): true or false.'
      default: null
    policy_policyMode:
      type: str | None
      description: 'Policy mode (policy.policyMode): custom or redlock_default.'
      default: null
    policy_remediable:
      type: str | None
      description: 'Policy is remediable (policy.remediable): true or false.'
      default: null
    policy_complianceStandard:
      type: str | None
      description: Policy compliance standard name (policy.complianceStandard).
      default: null
    cloud_type:
      type: str | None
      description: Cloud type (cloud.type), e.g. aws, azure, gcp.
      default: null
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/v2/policy
      method: GET
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
      params:
        policy.name: ${{ inputs.policy_name }}
        policy.severity: ${{ inputs.policy_severity }}
        policy.label: ${{ inputs.policy_label }}
        policy.type: ${{ inputs.policy_type }}
        policy.subtype: ${{ inputs.policy_subtype }}
        policy.enabled: ${{ inputs.policy_enabled }}
        policy.policyMode: ${{ inputs.policy_policyMode }}
        policy.remediable: ${{ inputs.policy_remediable }}
        policy.complianceStandard: ${{ inputs.policy_complianceStandard }}
        cloud.type: ${{ inputs.cloud_type }}
  returns: ${{ steps.request.result }}
