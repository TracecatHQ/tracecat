type: action
definition:
  title: List cloud accounts
  description: Get summary details of all the cloud accounts onboarded onto Prisma Cloud. Calls GET /cloud directly.
  display_group: Palo Alto Networks (Prisma Cloud)
  doc_url: https://pan.dev/prisma-cloud/api/cspm/get-cloud-accounts/
  namespace: tools.pan_prisma
  name: list_cloud_accounts
  secrets:
  - name: pan_prisma
    keys:
    - PRISMA_ACCESS_KEY_ID
    - PRISMA_SECRET_KEY
  expects:
    excludeAccountGroupDetails:
      type: bool | None
      description: true = Exclude account group details. Default is false.
      default: null
    includePendingAccounts:
      type: bool | None
      description: Include pending accounts.
      default: null
    base_url:
      type: str | None
      description: Prisma Cloud API URL for your tenant's stack, e.g. https://api.prismacloud.io, https://api2.prismacloud.io or https://api.eu.prismacloud.io. Falls back to the workspace variable pan_prisma.base_url.
      default: null
  steps:
  - ref: login
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/login
      method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      payload:
        username: ${{ SECRETS.pan_prisma.PRISMA_ACCESS_KEY_ID }}
        password: ${{ SECRETS.pan_prisma.PRISMA_SECRET_KEY }}
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.pan_prisma.base_url }}/cloud
      method: GET
      headers:
        x-redlock-auth: ${{ steps.login.result.data.token }}
        Accept: application/json
      params:
        excludeAccountGroupDetails: ${{ inputs.excludeAccountGroupDetails }}
        includePendingAccounts: ${{ inputs.includePendingAccounts }}
  returns: ${{ steps.request.result }}
