type: action
definition:
  title: Create alert attachment
  description: >-
    Attach a URL to an alert or alert group. Provide exactly one of alert_id or alert_group_id. A
    URL for a ticket or pull request from a connected integration is attached as that ticket or
    pull request. Any other URL is attached as a link. A URL that is already attached returns a
    422. Calls POST /v2/alert_attachments directly. Requires API key scope: alerts.edit.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-attachments-v2/create
  namespace: tools.incident_io
  name: create_alert_attachment
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    alert_group_id:
      type: str | None
      description: >-
        ID of the alert group to attach to. Provide exactly one of alert_id or alert_group_id.
      default: null
    alert_id:
      type: str | None
      description: ID of the alert to attach to. Provide exactly one of alert_id or alert_group_id.
      default: null
    title:
      type: str | None
      description: >-
        Title for a link. Tickets and pull requests use their own title, so we ignore this for
        them.
      default: null
    url:
      type: str
      description: The URL to attach
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/alert_attachments
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          alert_group_id: ${{ inputs.alert_group_id }}
          alert_id: ${{ inputs.alert_id }}
          title: ${{ inputs.title }}
          url: ${{ inputs.url }}
  returns: ${{ steps.request.result }}
