type: action
definition:
  title: List alert attachments
  description: >-
    List the attachments on an alert or alert group, newest first. Provide exactly one of alert_id
    or alert_group_id. Listing by alert_id returns only what is attached to that alert, not what
    is attached to its alert group. Calls GET /v2/alert_attachments directly. Requires API key
    scope: alerts.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-attachments-v2/list
  namespace: tools.incident_io
  name: list_alert_attachments
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    alert_id:
      type: str | None
      description: >-
        ID of the alert to list attachments for. Provide exactly one of alert_id or
        alert_group_id.
      default: null
    alert_group_id:
      type: str | None
      description: >-
        ID of the alert group to list attachments for. Provide exactly one of alert_id or
        alert_group_id.
      default: null
    page_size:
      type: int | None
      description: Integer number of records to return. Maximum 250.
      default: null
    after:
      type: str | None
      description: >-
        An alert attachment's ID. This endpoint will return the attachments after this one in the
        response order.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/alert_attachments
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          alert_id: ${{ inputs.alert_id }}
          alert_group_id: ${{ inputs.alert_group_id }}
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
  returns: ${{ steps.request.result }}
