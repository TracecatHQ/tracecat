type: action
definition:
  title: Delete alert attachment
  description: >-
    Remove an attachment from its alert or alert group. Calls DELETE /v2/alert_attachments/{id}
    directly. Requires API key scope: alerts.edit.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-attachments-v2/delete
  namespace: tools.incident_io
  name: delete_alert_attachment
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: ID of the alert attachment
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/alert_attachments/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
