type: action
definition:
  title: List alert tags
  description: >-
    List the alert tags in your organisation's vocabulary. Calls GET /v2/alert_tags directly.
    Requires API key scope: alerts.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-tags-v2/list
  namespace: tools.incident_io
  name: list_alert_tags
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    page_size:
      type: int | None
      description: Integer number of records to return. Maximum 250.
      default: null
    after:
      type: str | None
      description: >-
        A tag's ID. This endpoint will return a list of tags after this ID in relation to the API
        response order.
      default: null
    search:
      type: str | None
      description: Filter to tags whose name contains this value (case-insensitive)
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/alert_tags
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
          search: ${{ inputs.search }}
  returns: ${{ steps.request.result }}
