type: action
definition:
  title: Import incident postmortem document
  description: >-
    Import a postmortem document from markdown into an incident. Calls POST
    /v2/incidents/{id}/actions/import_postmortem_document directly. Requires API key scope:
    in_app_postmortems.import.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incidents-v2/import-postmortem-document
  namespace: tools.incident_io
  name: import_incident_postmortem_document
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: The unique identifier of the incident
    content:
      type: str
      description: The document content as GitHub-Flavored Markdown
    title:
      type: str
      description: Title of the postmortem document
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incidents/${{ FN.url_encode(inputs.id) }}/actions/import_postmortem_document
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          content: ${{ inputs.content }}
          title: ${{ inputs.title }}
  returns: ${{ steps.request.result }}
