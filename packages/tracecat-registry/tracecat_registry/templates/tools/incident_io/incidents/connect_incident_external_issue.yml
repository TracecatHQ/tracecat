type: action
definition:
  title: Connect incident external issue
  description: >-
    Connect an existing issue in an issue tracker to an incident, as its external issue. Calls
    POST /v2/incidents/{id}/actions/connect_external_issue directly.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incidents-v2/connect-external-issue
  namespace: tools.incident_io
  name: connect_incident_external_issue
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: The unique identifier of the incident
    issue_template_id:
      type: str
      description: ID of the incident ticket template to sync the issue with
    provider:
      type: str
      description: >-
        The issue tracker provider the issue belongs to. It must match the provider of the
        incident ticket template. Allowed values: `asana`, `azure_devops`, `click_up`,
        `freshservice`, `linear`, `jira`, `salesforce`, `jira_server`, `github`, `gitlab`,
        `service_now`, `shortcut`, `notion`.
    replace:
      type: bool | None
      description: >-
        Whether to replace the incident's current external issue, if it has a different one
      default: null
    url:
      type: str
      description: URL of the issue in the issue tracker
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incidents/${{ FN.url_encode(inputs.id) }}/actions/connect_external_issue
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          issue_template_id: ${{ inputs.issue_template_id }}
          provider: ${{ inputs.provider }}
          replace: ${{ inputs.replace }}
          url: ${{ inputs.url }}
  returns: ${{ steps.request.result }}
