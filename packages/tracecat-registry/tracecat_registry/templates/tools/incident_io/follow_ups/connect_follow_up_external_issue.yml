type: action
definition:
  title: Connect follow-up external issue
  description: >-
    Connect a follow-up to an existing issue in an issue tracker, using the URL of the issue.
    Calls POST /v3/follow_ups/{id}/actions/connect_external_issue directly. Requires API key
    scope: follow_ups.connect_external_issue.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/follow-ups-v3/connect-external-issue
  namespace: tools.incident_io
  name: connect_follow_up_external_issue
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the follow-up
    provider:
      type: str
      description: >-
        The issue tracker provider the issue belongs to. Allowed values: `asana`, `azure_devops`,
        `click_up`, `freshservice`, `linear`, `jira`, `salesforce`, `jira_server`, `github`,
        `gitlab`, `service_now`, `shortcut`, `notion`.
    url:
      type: str
      description: URL of the issue in the external provider
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/follow_ups/${{ FN.url_encode(inputs.id) }}/actions/connect_external_issue
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          provider: ${{ inputs.provider }}
          url: ${{ inputs.url }}
  returns: ${{ steps.request.result }}
