type: action
definition:
  title: Get follow up
  description: >-
    Get a single incident follow-up. Calls GET /v3/follow_ups/{id} directly. Requires API key
    scope: actions.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/follow-ups-v3/show
  namespace: tools.incident_io
  name: get_follow_up
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the follow-up
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/follow_ups/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
