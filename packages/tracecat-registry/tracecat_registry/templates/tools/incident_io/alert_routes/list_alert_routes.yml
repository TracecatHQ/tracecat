type: action
definition:
  title: List alert routes
  description: >-
    List all alert routes in your account. Calls GET /v3/alert_routes directly. Requires API key
    scope: alert_routes.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-routes-v3/list
  namespace: tools.incident_io
  name: list_alert_routes
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    page_size:
      type: int | None
      description: Number of alert routes to return per page. Maximum 50.
      default: null
    after:
      type: str | None
      description: The ID of the last alert route on the previous page
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/alert_routes
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
  returns: ${{ steps.request.result }}
