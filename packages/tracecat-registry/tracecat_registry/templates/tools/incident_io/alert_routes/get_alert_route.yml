type: action
definition:
  title: Get alert route
  description: >-
    Load details about a specific alert route in your account. Calls GET /v3/alert_routes/{id}
    directly. Requires API key scope: alert_routes.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-routes-v3/show
  namespace: tools.incident_io
  name: get_alert_route
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier of the alert route
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/alert_routes/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
