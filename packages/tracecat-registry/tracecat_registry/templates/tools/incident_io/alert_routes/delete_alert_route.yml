type: action
definition:
  title: Delete alert route
  description: >-
    Delete an existing alert route in your account. Calls DELETE /v3/alert_routes/{id} directly.
    Requires API key scope: alert_route.destroy.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-routes-v3/delete
  namespace: tools.incident_io
  name: delete_alert_route
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier of the alert route
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/alert_routes/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
