type: action
definition:
  title: Get incident timestamp
  description: Get a single incident timestamp. Calls GET /v2/incident_timestamps/{id} directly.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-timestamps-v2/show
  namespace: tools.incident_io
  name: get_incident_timestamp
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique ID of this incident timestamp
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incident_timestamps/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
