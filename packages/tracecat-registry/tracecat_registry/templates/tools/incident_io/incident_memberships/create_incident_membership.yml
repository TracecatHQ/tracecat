type: action
definition:
  title: Create incident membership
  description: >-
    Makes a user a member of a private incident. Calls POST /v1/incident_memberships directly.
    Requires API key scope: incident_memberships.grant.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-memberships-v1/create
  namespace: tools.incident_io
  name: create_incident_membership
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    incident_id:
      type: str
      description: The incident to make the user a member of
    user_id:
      type: str
      description: '`user_id` object.'
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_memberships
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          incident_id: ${{ inputs.incident_id }}
          user_id: ${{ inputs.user_id }}
  returns: ${{ steps.request.result }}
