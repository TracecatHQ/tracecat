type: action
definition:
  title: List announcement rules
  description: >-
    List announcement rules for this organisation. Calls GET /v2/announcement_rules directly.
    Requires API key scope: announcement_rules.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/announcement-rules-v2/list
  namespace: tools.incident_io
  name: list_announcement_rules
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    page_size:
      type: int | None
      description: Integer number of records to return. Maximum 250.
      default: null
    after:
      type: str | None
      description: An announcement rule's ID.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/announcement_rules
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
  returns: ${{ steps.request.result }}
