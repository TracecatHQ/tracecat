type: action
definition:
  title: Get alert note
  description: >-
    Get a single alert note. Calls GET /v1/alert_notes/{id} directly. Requires API key scope:
    alerts.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-notes-v1/show
  namespace: tools.incident_io
  name: get_alert_note
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the alert note
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/alert_notes/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
