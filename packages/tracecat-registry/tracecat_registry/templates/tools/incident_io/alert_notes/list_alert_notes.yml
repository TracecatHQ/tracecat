type: action
definition:
  title: List alert notes
  description: >-
    List alert notes attached to an alert. Calls GET /v1/alert_notes directly. Requires API key
    scope: alerts.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-notes-v1/list
  namespace: tools.incident_io
  name: list_alert_notes
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    alert_id:
      type: str | None
      description: >-
        ID of the alert to list notes for. Provide exactly one of alert_id or alert_group_id.
      default: null
    alert_group_id:
      type: str | None
      description: >-
        ID of the alert group to list notes for. Provide exactly one of alert_id or
        alert_group_id.
      default: null
    page_size:
      type: int | None
      description: Integer number of records to return. Maximum 250.
      default: null
    after:
      type: str | None
      description: >-
        An record's ID. This endpoint will return a list of records after this ID in relation to
        the API response order.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/alert_notes
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          alert_id: ${{ inputs.alert_id }}
          alert_group_id: ${{ inputs.alert_group_id }}
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
  returns: ${{ steps.request.result }}
