type: action
definition:
  title: Create alert note
  description: >-
    Add a note to an alert. Calls POST /v1/alert_notes directly. Requires API key scope:
    alerts.edit.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-notes-v1/create
  namespace: tools.incident_io
  name: create_alert_note
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    alert_group_id:
      type: str | None
      description: >-
        ID of the alert group to add the note to. Provide exactly one of alert_id or
        alert_group_id.
      default: null
    alert_id:
      type: str | None
      description: >-
        ID of the alert to add the note to. Provide exactly one of alert_id or alert_group_id.
      default: null
    content:
      type: str
      description: Markdown body of the note
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/alert_notes
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          alert_group_id: ${{ inputs.alert_group_id }}
          alert_id: ${{ inputs.alert_id }}
          content: ${{ inputs.content }}
  returns: ${{ steps.request.result }}
