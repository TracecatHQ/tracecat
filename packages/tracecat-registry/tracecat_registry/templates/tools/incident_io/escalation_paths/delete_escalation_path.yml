type: action
definition:
  title: Delete escalation path
  description: >-
    Archives an escalation path. Calls DELETE /v2/escalation_paths/{id} directly. Requires API key
    scope: escalation_paths.destroy.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/escalation-paths-v2/delete
  namespace: tools.incident_io
  name: delete_escalation_path
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for this escalation path.
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/escalation_paths/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
