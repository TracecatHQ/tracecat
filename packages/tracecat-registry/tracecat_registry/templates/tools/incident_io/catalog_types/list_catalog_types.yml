type: action
definition:
  title: List catalog types
  description: >-
    List all catalog types for an organisation, including those synced from external resources.
    Calls GET /v3/catalog_types directly. Requires API key scope: catalog_types.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/catalog-types-v3/list-types
  namespace: tools.incident_io
  name: list_catalog_types
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/catalog_types
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
