type: action
definition:
  title: Get catalog type
  description: >-
    Show a single catalog type. Calls GET /v3/catalog_types/{id} directly. Requires API key scope:
    catalog_types.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/catalog-types-v3/show-type
  namespace: tools.incident_io
  name: get_catalog_type
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: ID of this catalog type
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/catalog_types/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
