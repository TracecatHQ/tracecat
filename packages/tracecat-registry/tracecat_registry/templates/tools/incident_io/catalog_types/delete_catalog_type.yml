type: action
definition:
  title: Delete catalog type
  description: >-
    Archives a catalog type and associated entries. Calls DELETE /v3/catalog_types/{id} directly.
    Requires API key scope: catalog_types.destroy.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/catalog-types-v3/delete-type
  namespace: tools.incident_io
  name: delete_catalog_type
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: ID of this catalog type
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/catalog_types/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
