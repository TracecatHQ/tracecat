type: action
definition:
  title: Update catalog type
  description: >-
    Updates an existing catalog type. The schema must be updated using the UpdateTypeSchema
    endpoint. Calls PUT /v3/catalog_types/{id} directly. Requires API key scope:
    catalog_types.edit.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/catalog-types-v3/update-type
  namespace: tools.incident_io
  name: update_catalog_type
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: ID of this catalog type
    annotations:
      type: dict[str, Any] | None
      description: Annotations that can track metadata about this type
      default: null
    categories:
      type: list[str] | None
      description: >-
        What categories is this type considered part of. Allowed values: `customer`,
        `issue-tracker`, `product-feature`, `service`, `on-call`, `team`, `user`.
      default: null
    color:
      type: str | None
      description: >-
        Sets the display color of this type in the dashboard. Allowed values: `yellow`, `green`,
        `blue`, `violet`, `pink`, `cyan`, `orange`.
      default: null
    description:
      type: str
      description: Human readble description of this type
    icon:
      type: str | None
      description: >-
        Sets the display icon of this type in the dashboard. Allowed values: `alert`, `bolt`,
        `box`, `briefcase`, `browser`, `bulb`, `calendar`, `clock`, `cog`, `components`,
        `database`, `doc`, `email`, `escalation-path`, `files`, `flag`, `folder`, `globe`,
        `incident-template`, `money`, `server`, `severity`, `status-page`, `store`, `star`, `tag`,
        `user`, `users`.
      default: null
    name:
      type: str
      description: Name is the human readable name of this type
    owning_team_ids:
      type: list[str] | None
      description: IDs of the teams that own this catalog type
      default: null
    ranked:
      type: bool | None
      description: If this type should be ranked
      default: null
    source_repo_url:
      type: str | None
      description: The url of the external repository where this type is managed
      default: null
    use_name_as_identifier:
      type: bool | None
      description: >-
        If enabled, you can refer to entries of this type by their name, as well as their external
        ID and any aliases.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/catalog_types/${{ FN.url_encode(inputs.id) }}
        method: PUT
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          annotations: ${{ inputs.annotations }}
          categories: ${{ inputs.categories }}
          color: ${{ inputs.color }}
          description: ${{ inputs.description }}
          icon: ${{ inputs.icon }}
          name: ${{ inputs.name }}
          owning_team_ids: ${{ inputs.owning_team_ids }}
          ranked: ${{ inputs.ranked }}
          source_repo_url: ${{ inputs.source_repo_url }}
          use_name_as_identifier: ${{ inputs.use_name_as_identifier }}
  returns: ${{ steps.request.result }}
