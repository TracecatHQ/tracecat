type: action
definition:
  title: Create schedule
  description: >-
    Create a new schedule. Calls POST /v2/schedules directly. Requires API key scope:
    schedules.create.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/schedules-v2/create
  namespace: tools.incident_io
  name: create_schedule
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    schedule:
      type: dict[str, Any]
      description: >-
        `schedule` object. Fields: annotations, config, holidays_public_config, name, team_ids,
        timezone.
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/schedules
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          schedule: ${{ inputs.schedule }}
  returns: ${{ steps.request.result }}
