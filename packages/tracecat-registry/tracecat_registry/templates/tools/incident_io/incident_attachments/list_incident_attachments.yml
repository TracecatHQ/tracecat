type: action
definition:
  title: List incident attachments
  description: >-
    List all incident attachments for a given external resource or incident. You must provide
    either a specific incident ID or a specific external resource type and external ID. Calls GET
    /v1/incident_attachments directly. Requires API key scope: attachments.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-attachments-v1/list
  namespace: tools.incident_io
  name: list_incident_attachments
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    incident_id:
      type: str | None
      description: Incident that this attachment is against
      default: null
    external_id:
      type: str | None
      description: ID of the resource in the external system
      default: null
    resource_type:
      type: str | None
      description: >-
        E.g. PagerDuty: the external system that holds the resource. Allowed values:
        `pager_duty_incident`, `opsgenie_alert`, `datadog_monitor_alert`, `github_pull_request`,
        `gitlab_merge_request`, `sentry_issue`, `jira_issue`, `jsm_alert`,
        `atlassian_statuspage_incident`, `zendesk_ticket`, `google_calendar_event`,
        `outlook_calendar_event`, `slack_file`, `salesforce_case`, `pylon_issue`, `arbitrary_url`,
        `scrubbed`, `statuspage_incident`.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_attachments
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          incident_id: ${{ inputs.incident_id }}
          external_id: ${{ inputs.external_id }}
          resource_type: ${{ inputs.resource_type }}
  returns: ${{ steps.request.result }}
