type: action
definition:
  title: Create incident attachment
  description: >-
    Attaches an external resource to an incident. Calls POST /v1/incident_attachments directly.
    Requires API key scope: attachments.create.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-attachments-v1/create
  namespace: tools.incident_io
  name: create_incident_attachment
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    incident_id:
      type: str
      description: ID of the incident to add an attachment to
    resource:
      type: dict[str, Any]
      description: '`resource` object. Fields: emoji, external_id, resource_type, title, url.'
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_attachments
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          incident_id: ${{ inputs.incident_id }}
          resource: ${{ inputs.resource }}
  returns: ${{ steps.request.result }}
