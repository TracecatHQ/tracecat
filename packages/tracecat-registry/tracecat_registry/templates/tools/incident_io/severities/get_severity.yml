type: action
definition:
  title: Get severity
  description: >-
    Get a single incident severity. Calls GET /v1/severities/{id} directly. Requires API key
    scope: severities.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/severities-v1/show
  namespace: tools.incident_io
  name: get_severity
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier of the severity
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/severities/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
