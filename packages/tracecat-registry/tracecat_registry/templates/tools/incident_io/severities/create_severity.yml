type: action
definition:
  title: Create severity
  description: >-
    Create a new severity. Calls POST /v1/severities directly. Requires API key scope:
    organisation_settings.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/severities-v1/create
  namespace: tools.incident_io
  name: create_severity
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    description:
      type: str
      description: Description of the severity
    name:
      type: str
      description: Human readable name of the severity
    rank:
      type: int | None
      description: Rank to help sort severities (lower numbers are less severe)
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/severities
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          description: ${{ inputs.description }}
          name: ${{ inputs.name }}
          rank: ${{ inputs.rank }}
  returns: ${{ steps.request.result }}
