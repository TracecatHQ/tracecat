type: action
definition:
  title: Delete incident template
  description: >-
    Archive an incident template. Fails if the template is still referenced by an alert route.
    Calls DELETE /v1/incident_templates/{id} directly. Requires API key scope:
    incident_template.destroy.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-templates-v1/delete
  namespace: tools.incident_io
  name: delete_incident_template
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: The incident template's ID
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_templates/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
