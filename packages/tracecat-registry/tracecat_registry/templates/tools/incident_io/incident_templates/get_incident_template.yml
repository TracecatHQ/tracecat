type: action
definition:
  title: Get incident template
  description: >-
    Show a single incident template. Calls GET /v1/incident_templates/{id} directly. Requires API
    key scope: incident_templates.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-templates-v1/show
  namespace: tools.incident_io
  name: get_incident_template
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: The incident template's ID
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_templates/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
