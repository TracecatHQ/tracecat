type: action
definition:
  title: Create incident template
  description: >-
    Create an incident template. Calls POST /v1/incident_templates directly. Requires API key
    scope: incident_template.create.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-templates-v1/create
  namespace: tools.incident_io
  name: create_incident_template
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    expressions:
      type: list[dict[str, Any]] | None
      description: The expressions used by bindings in this template
      default: null
    name:
      type: str
      description: The name of this incident template, for the user's reference
    template:
      type: dict[str, Any]
      description: The values an incident template applies to the incidents it creates.
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_templates
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          expressions: ${{ inputs.expressions }}
          name: ${{ inputs.name }}
          template: ${{ inputs.template }}
  returns: ${{ steps.request.result }}
