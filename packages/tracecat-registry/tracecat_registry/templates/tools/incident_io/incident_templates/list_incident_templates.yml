type: action
definition:
  title: List incident templates
  description: >-
    List all incident templates for this organisation. Calls GET /v1/incident_templates directly.
    Requires API key scope: incident_templates.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-templates-v1/list
  namespace: tools.incident_io
  name: list_incident_templates
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    page_size:
      type: int | None
      description: Integer number of records to return. Maximum 250.
      default: null
    after:
      type: str | None
      description: >-
        An incident template's ID. This endpoint returns a list of templates after this ID in
        relation to the API response order.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_templates
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
  returns: ${{ steps.request.result }}
