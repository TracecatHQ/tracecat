type: action
definition:
  title: List custom fields
  description: >-
    List all custom fields for an organisation. Calls GET /v2/custom_fields directly. Requires API
    key scope: custom_fields.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/custom-fields-v2/list
  namespace: tools.incident_io
  name: list_custom_fields
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/custom_fields
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
