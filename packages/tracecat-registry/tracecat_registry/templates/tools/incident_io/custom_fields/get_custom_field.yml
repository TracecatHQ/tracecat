type: action
definition:
  title: Get custom field
  description: >-
    Get a single custom field. Calls GET /v2/custom_fields/{id} directly. Requires API key scope:
    custom_fields.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/custom-fields-v2/show
  namespace: tools.incident_io
  name: get_custom_field
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the custom field
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/custom_fields/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
