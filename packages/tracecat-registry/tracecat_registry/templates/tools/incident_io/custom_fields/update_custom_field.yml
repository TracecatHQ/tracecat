type: action
definition:
  title: Update custom field
  description: >-
    Update the details of a custom field. Calls PUT /v2/custom_fields/{id} directly. Requires API
    key scope: organisation_settings.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/custom-fields-v2/update
  namespace: tools.incident_io
  name: update_custom_field
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the custom field
    description:
      type: str
      description: Description of the custom field
    filter_by:
      type: dict[str, Any] | None
      description: '`filter_by` object. Fields: catalog_attribute_id, custom_field_id.'
      default: null
    fixed_filter:
      type: dict[str, Any] | None
      description: '`fixed_filter` object. Fields: catalog_attribute_id, values.'
      default: null
    group_by_catalog_attribute_id:
      type: str | None
      description: >-
        For catalog fields, the ID of the attribute used to group catalog entries (if applicable)
      default: null
    helptext_catalog_attribute_id:
      type: str | None
      description: Which catalog attribute provides helptext for the options
      default: null
    name:
      type: str
      description: Human readable name for the custom field
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/custom_fields/${{ FN.url_encode(inputs.id) }}
        method: PUT
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          description: ${{ inputs.description }}
          filter_by: ${{ inputs.filter_by }}
          fixed_filter: ${{ inputs.fixed_filter }}
          group_by_catalog_attribute_id: ${{ inputs.group_by_catalog_attribute_id }}
          helptext_catalog_attribute_id: ${{ inputs.helptext_catalog_attribute_id }}
          name: ${{ inputs.name }}
  returns: ${{ steps.request.result }}
