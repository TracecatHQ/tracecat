type: action
definition:
  title: Create incident team membership
  description: >-
    Grants a team access to a private incident. Calls POST /v1/incident_team_memberships directly.
    Requires API key scope: incident_team_memberships.grant.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-team-memberships-v1/create
  namespace: tools.incident_io
  name: create_incident_team_membership
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    incident_id:
      type: str
      description: '`incident_id` object.'
    team_id:
      type: str
      description: '`team_id` object.'
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_team_memberships
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          incident_id: ${{ inputs.incident_id }}
          team_id: ${{ inputs.team_id }}
  returns: ${{ steps.request.result }}
