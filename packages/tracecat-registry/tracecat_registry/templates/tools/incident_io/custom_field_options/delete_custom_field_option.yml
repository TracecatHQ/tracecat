type: action
definition:
  title: Delete custom field option
  description: >-
    Delete a custom field option. Calls DELETE /v1/custom_field_options/{id} directly. Requires
    API key scope: organisation_settings.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/custom-field-options-v1/delete
  namespace: tools.incident_io
  name: delete_custom_field_option
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the custom field option
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/custom_field_options/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
