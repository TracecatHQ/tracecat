type: action
definition:
  title: Create custom field option
  description: >-
    Create a custom field option. If the sort key is not supplied, it'll default to 1000, so the
    option appears near the end of the list. Calls POST /v1/custom_field_options directly.
    Requires API key scope: organisation_settings.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/custom-field-options-v1/create
  namespace: tools.incident_io
  name: create_custom_field_option
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    custom_field_id:
      type: str
      description: ID of the custom field this option belongs to
    sort_key:
      type: int | None
      description: Sort key used to order the custom field options correctly
      default: null
    value:
      type: str
      description: >-
        Human readable name for the custom field option. Values must not start or end with
        whitespace, or contain tabs or newlines.
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/custom_field_options
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          custom_field_id: ${{ inputs.custom_field_id }}
          sort_key: ${{ inputs.sort_key }}
          value: ${{ inputs.value }}
  returns: ${{ steps.request.result }}
