type: action
definition:
  title: List escalations
  description: >-
    List all escalations for your account. Calls GET /v2/escalations directly. Requires API key
    scope: escalations.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/escalations-v2/list
  namespace: tools.incident_io
  name: list_escalations
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    page_size:
      type: int | None
      description: Number of escalations to return per page. Maximum 50.
      default: null
    after:
      type: str | None
      description: >-
        An escalation's ID. This endpoint will return a list of escalations after this ID in
        relation to the API response order.
      default: null
    escalation_path_one_of:
      type: list[str] | None
      description: >-
        Filter on the escalation path for which the escalation was triggered. Accepted operators
        are 'one_of' and 'not_in'. Value for the `one_of` operator.
      default: null
    escalation_path_not_in:
      type: list[str] | None
      description: >-
        Filter on the escalation path for which the escalation was triggered. Accepted operators
        are 'one_of' and 'not_in'. Value for the `not_in` operator.
      default: null
    status_one_of:
      type: list[str] | None
      description: >-
        Filter on the status of the escalation. Accepted operators are 'one_of' and 'not_in'.
        Value for the `one_of` operator.
      default: null
    status_not_in:
      type: list[str] | None
      description: >-
        Filter on the status of the escalation. Accepted operators are 'one_of' and 'not_in'.
        Value for the `not_in` operator.
      default: null
    alert_one_of:
      type: list[str] | None
      description: >-
        Filter on the alert that created an escalation. Accepted operators are 'one_of' and
        'not_in'. Value for the `one_of` operator.
      default: null
    alert_not_in:
      type: list[str] | None
      description: >-
        Filter on the alert that created an escalation. Accepted operators are 'one_of' and
        'not_in'. Value for the `not_in` operator.
      default: null
    incident_one_of:
      type: list[str] | None
      description: >-
        Filter on the incident that the escalation is connected to. Accepted operators are
        'one_of' and 'not_in'. Value for the `one_of` operator.
      default: null
    incident_not_in:
      type: list[str] | None
      description: >-
        Filter on the incident that the escalation is connected to. Accepted operators are
        'one_of' and 'not_in'. Value for the `not_in` operator.
      default: null
    created_at_gte:
      type: str | None
      description: >-
        Filter on the created_at timestamp of the escalation. Accepted operators are 'gte', 'lte'
        and 'date_range'. Value for the `gte` operator.
      default: null
    created_at_lte:
      type: str | None
      description: >-
        Filter on the created_at timestamp of the escalation. Accepted operators are 'gte', 'lte'
        and 'date_range'. Value for the `lte` operator.
      default: null
    created_at_date_range:
      type: str | None
      description: >-
        Filter on the created_at timestamp of the escalation. Accepted operators are 'gte', 'lte'
        and 'date_range'. Value for the `date_range` operator. Two dates joined by `~`, for
        example `2024-12-02~2024-12-08`.
      default: null
    updated_at_gte:
      type: str | None
      description: >-
        Filter on the updated_at timestamp of the escalation. Accepted operators are 'gte', 'lte'
        and 'date_range'. Value for the `gte` operator.
      default: null
    updated_at_lte:
      type: str | None
      description: >-
        Filter on the updated_at timestamp of the escalation. Accepted operators are 'gte', 'lte'
        and 'date_range'. Value for the `lte` operator.
      default: null
    updated_at_date_range:
      type: str | None
      description: >-
        Filter on the updated_at timestamp of the escalation. Accepted operators are 'gte', 'lte'
        and 'date_range'. Value for the `date_range` operator. Two dates joined by `~`, for
        example `2024-12-02~2024-12-08`.
      default: null
    idempotency_key_is:
      type: str | None
      description: >-
        Filter on the idempotency key of the escalation. This is the key set when creating
        escalations via the API, and is distinct from alert deduplication keys. Accepted operators
        are 'is' for exact matches and 'starts_with' for prefix matching. Value for the `is`
        operator.
      default: null
    idempotency_key_starts_with:
      type: str | None
      description: >-
        Filter on the idempotency key of the escalation. This is the key set when creating
        escalations via the API, and is distinct from alert deduplication keys. Accepted operators
        are 'is' for exact matches and 'starts_with' for prefix matching. Value for the
        `starts_with` operator.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/escalations
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
          escalation_path[one_of]: ${{ inputs.escalation_path_one_of }}
          escalation_path[not_in]: ${{ inputs.escalation_path_not_in }}
          status[one_of]: ${{ inputs.status_one_of }}
          status[not_in]: ${{ inputs.status_not_in }}
          alert[one_of]: ${{ inputs.alert_one_of }}
          alert[not_in]: ${{ inputs.alert_not_in }}
          incident[one_of]: ${{ inputs.incident_one_of }}
          incident[not_in]: ${{ inputs.incident_not_in }}
          created_at[gte]: ${{ inputs.created_at_gte }}
          created_at[lte]: ${{ inputs.created_at_lte }}
          created_at[date_range]: ${{ inputs.created_at_date_range }}
          updated_at[gte]: ${{ inputs.updated_at_gte }}
          updated_at[lte]: ${{ inputs.updated_at_lte }}
          updated_at[date_range]: ${{ inputs.updated_at_date_range }}
          idempotency_key[is]: ${{ inputs.idempotency_key_is }}
          idempotency_key[starts_with]: ${{ inputs.idempotency_key_starts_with }}
  returns: ${{ steps.request.result }}
