type: action
definition:
  title: Cancel escalation
  description: >-
    Cancel an escalation. Calls POST /v2/escalations/{id}/actions/cancel directly. Requires API
    key scope: escalations.cancel.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/escalations-v2/cancel
  namespace: tools.incident_io
  name: cancel_escalation
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique ID of the escalation
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/escalations/${{ FN.url_encode(inputs.id) }}/actions/cancel
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
