type: action
definition:
  title: Reassign escalation
  description: >-
    Reassign an escalation to a different escalation path or set of users. Calls POST
    /v2/escalations/{escalation_id}/actions/reassign directly. Requires API key scope:
    escalations.create.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/escalations-v2/reassign
  namespace: tools.incident_io
  name: reassign_escalation
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    escalation_id:
      type: str
      description: The ID of the escalation to reassign
    description:
      type: str | None
      description: >-
        Additional details about the new escalation. Defaults to the original's description.
      default: null
    escalation_path_id:
      type: str | None
      description: ID of the escalation path to reassign to
      default: null
    resolve_original:
      type: bool | None
      description: >-
        Whether to resolve the original escalation, stopping it paging its targets. Defaults to
        true.
      default: null
    title:
      type: str | None
      description: The title of the new escalation. Defaults to the original's title.
      default: null
    user_ids:
      type: list[str] | None
      description: IDs of users to reassign directly to
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/escalations/${{ FN.url_encode(inputs.escalation_id) }}/actions/reassign
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          description: ${{ inputs.description }}
          escalation_path_id: ${{ inputs.escalation_path_id }}
          resolve_original: ${{ inputs.resolve_original }}
          title: ${{ inputs.title }}
          user_ids: ${{ inputs.user_ids }}
  returns: ${{ steps.request.result }}
