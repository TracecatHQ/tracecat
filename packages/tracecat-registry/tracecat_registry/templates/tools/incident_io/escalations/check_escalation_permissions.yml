type: action
definition:
  title: Check escalation permissions
  description: >-
    Check whether the given users can currently acknowledge, decline, or snooze an escalation.
    Calls POST /v2/escalations/{escalation_id}/actions/check_permissions directly. Requires API
    key scope: escalations.view, users.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/escalations-v2/check-permissions
  namespace: tools.incident_io
  name: check_escalation_permissions
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    escalation_id:
      type: str
      description: The ID of the escalation
    user_ids:
      type: list[str]
      description: The IDs of the users to check response options for
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/escalations/${{ FN.url_encode(inputs.escalation_id) }}/actions/check_permissions
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          user_ids: ${{ inputs.user_ids }}
  returns: ${{ steps.request.result }}
