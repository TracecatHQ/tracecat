type: action
definition:
  title: Get escalation
  description: >-
    Show a specific escalation. Calls GET /v2/escalations/{id} directly. Requires API key scope:
    escalations.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/escalations-v2/show
  namespace: tools.incident_io
  name: get_escalation
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique ID of the escalation
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/escalations/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
