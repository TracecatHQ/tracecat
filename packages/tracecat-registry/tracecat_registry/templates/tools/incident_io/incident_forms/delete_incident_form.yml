type: action
definition:
  title: Delete incident form
  description: >-
    Archive an incident form. The organisation's default form of a type cannot be archived. Calls
    DELETE /v3/incident_forms/{id} directly. Requires API key scope: incident_forms.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-forms-v3/delete
  namespace: tools.incident_io
  name: delete_incident_form
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for this incident form
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/incident_forms/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
