type: action
definition:
  title: Update incident form
  description: >-
    Replace an incident form, including its elements and expressions. Calls PUT
    /v3/incident_forms/{id} directly. Requires API key scope: incident_forms.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-forms-v3/update
  namespace: tools.incident_io
  name: update_incident_form
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier of the incident form
    expressions:
      type: list[dict[str, Any]]
      description: >-
        Expressions available to every element's conditions and defaults. Referenced by reference,
        not by ID.
    form_type:
      type: str
      description: >-
        Which form this is. Escalate forms are not part of this API. Allowed values: `declare`,
        `accept`, `update`, `resolve`, `retrospective`, `custom-fields`.
    incident_type_id:
      type: str | None
      description: >-
        The incident type this form belongs to. Leave unset for the organisation's default form of
        this type.
      default: null
    lifecycle_elements:
      type: list[dict[str, Any]] | None
      description: >-
        Elements on this form, in display order. List position is the order: there is no separate
        rank.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/incident_forms/${{ FN.url_encode(inputs.id) }}
        method: PUT
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          expressions: ${{ inputs.expressions }}
          form_type: ${{ inputs.form_type }}
          incident_type_id: ${{ inputs.incident_type_id }}
          lifecycle_elements: ${{ inputs.lifecycle_elements }}
  returns: ${{ steps.request.result }}
