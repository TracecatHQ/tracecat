type: action
definition:
  title: List incident forms
  description: >-
    List incident forms for your account, including their elements and expressions. Calls GET
    /v3/incident_forms directly.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-forms-v3/list
  namespace: tools.incident_io
  name: list_incident_forms
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    page_size:
      type: int | None
      description: Integer number of records to return. Maximum 250.
      default: null
    after:
      type: str | None
      description: >-
        An incident form's ID. This endpoint will return a list of forms after this ID in relation
        to the API response order.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/incident_forms
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
  returns: ${{ steps.request.result }}
