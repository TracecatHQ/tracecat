type: action
definition:
  title: Get incident form
  description: >-
    Get a single incident form, including its elements and expressions. Calls GET
    /v3/incident_forms/{id} directly.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-forms-v3/show
  namespace: tools.incident_io
  name: get_incident_form
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for this incident form
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/incident_forms/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
