type: action
definition:
  title: List alert sources
  description: >-
    List all alert sources in your account. Calls GET /v2/alert_sources directly. Requires API key
    scope: alert_sources.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-sources-v2/list
  namespace: tools.incident_io
  name: list_alert_sources
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/alert_sources
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
