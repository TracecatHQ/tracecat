type: action
definition:
  title: Delete alert attribute
  description: >-
    Destroy an alert attribute. Calls DELETE /v2/alert_attributes/{id} directly. Requires API key
    scope: alert_schema.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alert-attributes-v2/delete
  namespace: tools.incident_io
  name: delete_alert_attribute
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: The ID of this attribute
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/alert_attributes/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
