type: action
definition:
  title: Update action
  description: >-
    Update an existing incident action. Calls PUT /v3/actions/{id} directly. Requires API key
    scope: actions.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/actions-v3/update
  namespace: tools.incident_io
  name: update_action
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the action
    assignee_id:
      type: str | None
      description: ID of the user this action is assigned to. Set to null to unassign.
      default: null
    description:
      type: str
      description: Description of the action. Supports Markdown.
    status:
      type: str
      description: >-
        Status of the action. Setting this to `deleted` is not allowed; use the delete endpoint
        instead. Allowed values: `outstanding`, `completed`, `deleted`, `not_doing`.
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/actions/${{ FN.url_encode(inputs.id) }}
        method: PUT
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          assignee_id: ${{ inputs.assignee_id }}
          description: ${{ inputs.description }}
          status: ${{ inputs.status }}
  returns: ${{ steps.request.result }}
