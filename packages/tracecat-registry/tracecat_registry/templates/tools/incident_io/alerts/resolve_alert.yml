type: action
definition:
  title: Resolve alert
  description: >-
    Resolve a currently firing alert. Calls POST /v2/alerts/{id}/actions/resolve directly.
    Requires API key scope: alerts.resolve.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/alerts-v2/resolve
  namespace: tools.incident_io
  name: resolve_alert
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the alert
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/alerts/${{ FN.url_encode(inputs.id) }}/actions/resolve
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
