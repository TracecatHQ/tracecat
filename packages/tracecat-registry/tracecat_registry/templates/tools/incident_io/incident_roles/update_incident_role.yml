type: action
definition:
  title: Update incident role
  description: >-
    Update an existing incident role. Calls PUT /v2/incident_roles/{id} directly. Requires API key
    scope: organisation_settings.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-roles-v2/update
  namespace: tools.incident_io
  name: update_incident_role
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the role
    description:
      type: str
      description: Describes the purpose of the role
    instructions:
      type: str
      description: >-
        Provided to whoever is nominated for the role. Note that this will be empty for the
        'reporter' role.
    name:
      type: str
      description: Human readable name of the incident role
    shortform:
      type: str
      description: >-
        Short human readable name for Slack. Note that this will be empty for the 'reporter' role.
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incident_roles/${{ FN.url_encode(inputs.id) }}
        method: PUT
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          description: ${{ inputs.description }}
          instructions: ${{ inputs.instructions }}
          name: ${{ inputs.name }}
          shortform: ${{ inputs.shortform }}
  returns: ${{ steps.request.result }}
