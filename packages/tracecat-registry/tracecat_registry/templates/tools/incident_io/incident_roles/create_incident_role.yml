type: action
definition:
  title: Create incident role
  description: >-
    Create a new incident role. Calls POST /v2/incident_roles directly. Requires API key scope:
    organisation_settings.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-roles-v2/create
  namespace: tools.incident_io
  name: create_incident_role
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    description:
      type: str
      description: Describes the purpose of the role
    instructions:
      type: str
      description: >-
        Provided to whoever is nominated for the role. Note that this will be empty for the
        'reporter' role.
    name:
      type: str
      description: Human readable name of the incident role
    shortform:
      type: str
      description: >-
        Short human readable name for Slack. Note that this will be empty for the 'reporter' role.
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incident_roles
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          description: ${{ inputs.description }}
          instructions: ${{ inputs.instructions }}
          name: ${{ inputs.name }}
          shortform: ${{ inputs.shortform }}
  returns: ${{ steps.request.result }}
