type: action
definition:
  title: Delete incident role
  description: >-
    Removes an existing role. Calls DELETE /v2/incident_roles/{id} directly. Requires API key
    scope: organisation_settings.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-roles-v2/delete
  namespace: tools.incident_io
  name: delete_incident_role
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for the role
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incident_roles/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
