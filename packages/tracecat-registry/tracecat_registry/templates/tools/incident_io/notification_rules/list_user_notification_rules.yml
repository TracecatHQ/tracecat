type: action
definition:
  title: List user notification rules
  description: >-
    List notification rules for a user. Rules define how and when a user is notified for on-call
    pages. Only includes high_urgency and low_urgency rules; shift_changes rules are not returned.
    Calls GET /v2/users/{user_id}/notification_rules directly. Requires API key scope:
    notification_rules.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/notification-rules-v2/list
  namespace: tools.incident_io
  name: list_user_notification_rules
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    user_id:
      type: str
      description: The ID of the user whose notification rules you want to list.
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/users/${{ FN.url_encode(inputs.user_id) }}/notification_rules
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
