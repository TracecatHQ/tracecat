type: action
definition:
  title: List incident activity log entries
  description: >-
    List the activity log entries for an incident, oldest first. Calls GET
    /v2/incident_activity_log_entries directly. Requires API key scope: incidents.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-activity-log-entries-v2/list
  namespace: tools.incident_io
  name: list_incident_activity_log_entries
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    incident_id:
      type: str | None
      description: Incident whose activity you want to list
      default: null
    id:
      type: list[str] | None
      description: Return only the entries with these IDs
      default: null
    page_size:
      type: int | None
      description: Integer number of records to return. Maximum 250.
      default: null
    after:
      type: str | None
      description: An entry's ID. This endpoint returns the entries that follow it.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incident_activity_log_entries
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          incident_id: ${{ inputs.incident_id }}
          id: ${{ inputs.id }}
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
  returns: ${{ steps.request.result }}
