type: action
definition:
  title: Create incident status
  description: >-
    Create a new incident status. Calls POST /v1/incident_statuses directly. Requires API key
    scope: incident_lifecycles.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-statuses-v1/create
  namespace: tools.incident_io
  name: create_incident_status
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    category:
      type: str
      description: >-
        Whether the status should be considered 'live' (now renamed to active), 'learning' (now
        renamed to post-incident) or 'closed'. The triage and declined statuses cannot be created
        or modified.
    description:
      type: str
      description: Rich text description of the incident status
    name:
      type: str
      description: Unique name of this status
    rank:
      type: int | None
      description: >-
        Where this status sits within its category, lowest rank first. No two statuses in the same
        category can share a rank, but ranks needn't run consecutively — leaving gaps (10, 20, 30)
        means you can later insert a status between two others without renumbering them. Omit it
        to add this status to the end of its category.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_statuses
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          category: ${{ inputs.category }}
          description: ${{ inputs.description }}
          name: ${{ inputs.name }}
          rank: ${{ inputs.rank }}
  returns: ${{ steps.request.result }}
