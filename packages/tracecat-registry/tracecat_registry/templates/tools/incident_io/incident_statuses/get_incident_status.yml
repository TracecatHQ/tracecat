type: action
definition:
  title: Get incident status
  description: >-
    Get a single incident status. Calls GET /v1/incident_statuses/{id} directly. Requires API key
    scope: incident_statuses.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-statuses-v1/show
  namespace: tools.incident_io
  name: get_incident_status
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique ID of this incident status
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v1/incident_statuses/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
