type: action
definition:
  title: Update catalog entry
  description: >-
    Updates an existing catalog entry. Calls PUT /v3/catalog_entries/{id} directly. Requires API
    key scope: catalog_entries.edit.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/catalog-entries-v3/update-entry
  namespace: tools.incident_io
  name: update_catalog_entry
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: ID of this catalog entry
    aliases:
      type: list[str] | None
      description: Optional aliases that can be used to reference this entry
      default: null
    attribute_values:
      type: dict[str, Any]
      description: Values of this entry
    external_id:
      type: str | None
      description: >-
        An optional alternative ID for this entry, which is ensured to be unique for the type
      default: null
    name:
      type: str
      description: Name is the human readable name of this entry
    rank:
      type: int | None
      description: When catalog type is ranked, this is used to help order things
      default: null
    update_attributes:
      type: list[str] | None
      description: |-
        If provided, only update these attribute_values keys. If not provided, update all attribute values.
        If you specify an attribute key that's not in your payload, the associated attribute value will be cleared.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/catalog_entries/${{ FN.url_encode(inputs.id) }}
        method: PUT
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          aliases: ${{ inputs.aliases }}
          attribute_values: ${{ inputs.attribute_values }}
          external_id: ${{ inputs.external_id }}
          name: ${{ inputs.name }}
          rank: ${{ inputs.rank }}
          update_attributes: ${{ inputs.update_attributes }}
  returns: ${{ steps.request.result }}
