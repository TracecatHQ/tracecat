type: action
definition:
  title: Create catalog entry
  description: >-
    Create an entry within the catalog. We support a maximum of 50,000 entries per type. Calls
    POST /v3/catalog_entries directly. Requires API key scope: catalog_entries.create.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/catalog-entries-v3/create-entry
  namespace: tools.incident_io
  name: create_catalog_entry
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    aliases:
      type: list[str] | None
      description: Optional aliases that can be used to reference this entry
      default: null
    attribute_values:
      type: dict[str, Any]
      description: Values of this entry
    catalog_type_id:
      type: str
      description: ID of this catalog type
    external_id:
      type: str | None
      description: >-
        An optional alternative ID for this entry, which is ensured to be unique for the type
      default: null
    name:
      type: str
      description: Name is the human readable name of this entry
    rank:
      type: int | None
      description: When catalog type is ranked, this is used to help order things
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/catalog_entries
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          aliases: ${{ inputs.aliases }}
          attribute_values: ${{ inputs.attribute_values }}
          catalog_type_id: ${{ inputs.catalog_type_id }}
          external_id: ${{ inputs.external_id }}
          name: ${{ inputs.name }}
          rank: ${{ inputs.rank }}
  returns: ${{ steps.request.result }}
