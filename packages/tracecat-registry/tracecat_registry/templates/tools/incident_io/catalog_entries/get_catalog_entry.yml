type: action
definition:
  title: Get catalog entry
  description: >-
    Show a single catalog entry. Calls GET /v3/catalog_entries/{id} directly. Requires API key
    scope: catalog_entries.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/catalog-entries-v3/show-entry
  namespace: tools.incident_io
  name: get_catalog_entry
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    expand:
      type: bool | None
      description: >-
        Whether to include details of all attribute links (forwards and backwards) within the
        response. Default behaviour (no query param) is to include only forward links. When expand
        is false, we only show attributes of the catalog entry itself.When expand is true, we show
        forward and backward links
      default: null
    id:
      type: str
      description: ID of this catalog entry
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v3/catalog_entries/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          expand: ${{ inputs.expand }}
  returns: ${{ steps.request.result }}
