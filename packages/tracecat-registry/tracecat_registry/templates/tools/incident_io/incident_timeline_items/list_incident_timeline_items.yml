type: action
definition:
  title: List incident timeline items
  description: >-
    List the timeline items for an incident, oldest first. Calls GET /v2/incident_timeline_items
    directly. Requires API key scope: incidents.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-timeline-items-v2/list
  namespace: tools.incident_io
  name: list_incident_timeline_items
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    incident_id:
      type: str | None
      description: Incident whose timeline you want to list
      default: null
    page_size:
      type: int | None
      description: Integer number of records to return. Maximum 250.
      default: null
    after:
      type: str | None
      description: A timeline item's ID. This endpoint returns the items that follow it.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incident_timeline_items
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          incident_id: ${{ inputs.incident_id }}
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
  returns: ${{ steps.request.result }}
