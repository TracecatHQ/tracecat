type: action
definition:
  title: List incident alerts
  description: >-
    List the connections between incidents and alerts. Calls GET /v2/incident_alerts directly.
    Requires API key scope: alerts.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-alerts-v2/list
  namespace: tools.incident_io
  name: list_incident_alerts
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    page_size:
      type: int | None
      description: Number of incident alerts to return per page. Maximum 50.
      default: null
    after:
      type: str | None
      description: If provided, pass this as the 'after' param to load the next page
      default: null
    alert_id:
      type: str | None
      description: Alert that this incident alert refers to
      default: null
    incident_id:
      type: str | None
      description: Incident that this incident alert is attached to
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incident_alerts
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
          alert_id: ${{ inputs.alert_id }}
          incident_id: ${{ inputs.incident_id }}
  returns: ${{ steps.request.result }}
