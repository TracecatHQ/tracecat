type: action
definition:
  title: Create incident alert
  description: >-
    Attach an alert to an incident, creating the connection between them. Calls POST
    /v2/incident_alerts directly. Requires API key scope: alerts.attach_to_incident.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/incident-alerts-v2/create
  namespace: tools.incident_io
  name: create_incident_alert
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    alert_id:
      type: str
      description: Alert to attach to the incident
    incident_id:
      type: str
      description: Incident to attach the alert to
    re_relate:
      type: bool | None
      description: >-
        Relate the alert again even though someone previously marked it unrelated to this
        incident. Defaults to false, which preserves that decision and returns a 422
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/incident_alerts
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          alert_id: ${{ inputs.alert_id }}
          incident_id: ${{ inputs.incident_id }}
          re_relate: ${{ inputs.re_relate }}
  returns: ${{ steps.request.result }}
