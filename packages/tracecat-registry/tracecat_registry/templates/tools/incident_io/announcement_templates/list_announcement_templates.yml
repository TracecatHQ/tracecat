type: action
definition:
  title: List announcement templates
  description: >-
    List announcement templates for this organisation. Calls GET /v2/announcement_templates
    directly. Requires API key scope: announcement_templates.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/announcement-templates-v2/list
  namespace: tools.incident_io
  name: list_announcement_templates
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/announcement_templates
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
