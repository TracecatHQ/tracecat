type: action
definition:
  title: Delete announcement template
  description: >-
    Delete an announcement template. The default template, and templates still used by an
    announcement rule or workflow, can't be deleted. Calls DELETE /v2/announcement_templates/{id}
    directly. Requires API key scope: announcement_templates.destroy.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/announcement-templates-v2/destroy
  namespace: tools.incident_io
  name: delete_announcement_template
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for this announcement template
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/announcement_templates/${{ FN.url_encode(inputs.id) }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
