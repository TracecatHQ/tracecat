type: action
definition:
  title: Create announcement template
  description: >-
    Create an announcement template. Calls POST /v2/announcement_templates directly. Requires API
    key scope: announcement_templates.create.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/announcement-templates-v2/create
  namespace: tools.incident_io
  name: create_announcement_template
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    actions:
      type: list[dict[str, Any]] | None
      description: Actions shown on the announcement post
      default: null
    fields:
      type: list[dict[str, Any]] | None
      description: Fields shown on the announcement post
      default: null
    name:
      type: str
      description: Name of this announcement template, unique within the organisation
    owning_team_ids:
      type: list[str] | None
      description: IDs of the teams that own this template
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/announcement_templates
        method: POST
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          actions: ${{ inputs.actions }}
          fields: ${{ inputs.fields }}
          name: ${{ inputs.name }}
          owning_team_ids: ${{ inputs.owning_team_ids }}
  returns: ${{ steps.request.result }}
