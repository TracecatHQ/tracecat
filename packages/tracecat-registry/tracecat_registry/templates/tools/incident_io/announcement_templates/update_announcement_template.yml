type: action
definition:
  title: Update announcement template
  description: >-
    Update an announcement template. Fields and actions are replaced wholesale, so send the full
    set you want. Calls PUT /v2/announcement_templates/{id} directly. Requires API key scope:
    announcement_templates.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/announcement-templates-v2/update
  namespace: tools.incident_io
  name: update_announcement_template
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for this announcement template
    actions:
      type: list[dict[str, Any]]
      description: Actions shown on the announcement post. Send an empty array to remove them all.
    fields:
      type: list[dict[str, Any]]
      description: Fields shown on the announcement post. Send an empty array to remove them all.
    name:
      type: str
      description: Name of this announcement template, unique within the organisation
    owning_team_ids:
      type: list[str] | None
      description: >-
        IDs of the teams that own this template. The existing owning teams are kept when omitted.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/announcement_templates/${{ FN.url_encode(inputs.id) }}
        method: PUT
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          actions: ${{ inputs.actions }}
          fields: ${{ inputs.fields }}
          name: ${{ inputs.name }}
          owning_team_ids: ${{ inputs.owning_team_ids }}
  returns: ${{ steps.request.result }}
