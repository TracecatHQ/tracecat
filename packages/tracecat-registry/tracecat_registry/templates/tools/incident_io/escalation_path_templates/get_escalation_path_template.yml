type: action
definition:
  title: Get escalation path template
  description: >-
    Show a particular escalation path template. Calls GET /v2/escalation_path_templates/{id}
    directly. Requires API key scope: escalation_path_templates.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/escalation-path-templates-v2/show
  namespace: tools.incident_io
  name: get_escalation_path_template
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for this template.
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/escalation_path_templates/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
  returns: ${{ steps.request.result }}
