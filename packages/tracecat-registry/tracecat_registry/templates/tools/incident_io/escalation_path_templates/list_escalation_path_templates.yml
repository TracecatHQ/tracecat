type: action
definition:
  title: List escalation path templates
  description: >-
    List active escalation path templates. Calls GET /v2/escalation_path_templates directly.
    Requires API key scope: escalation_path_templates.view.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/escalation-path-templates-v2/list
  namespace: tools.incident_io
  name: list_escalation_path_templates
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    page_size:
      type: int | None
      description: Integer number of records to return. Maximum 25.
      default: null
    after:
      type: str | None
      description: >-
        An record's ID. This endpoint will return a list of records after this ID in relation to
        the API response order.
      default: null
    search:
      type: str | None
      description: Search query to filter results by name.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/escalation_path_templates
        method: GET
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        params:
          page_size: ${{ inputs.page_size }}
          after: ${{ inputs.after }}
          search: ${{ inputs.search }}
  returns: ${{ steps.request.result }}
