type: action
definition:
  title: Update escalation path template
  description: >-
    Update a particular escalation path template. Calls PUT /v2/escalation_path_templates/{id}
    directly. Requires API key scope: escalation_path_templates.update.
  display_group: incident.io
  doc_url: https://docs.incident.io/api-reference/escalation-path-templates-v2/update
  namespace: tools.incident_io
  name: update_escalation_path_template
  secrets:
    - name: incident_io
      keys: ["INCIDENT_IO_API_KEY"]
  expects:
    id:
      type: str
      description: Unique identifier for this template.
    description:
      type: str | None
      description: A description of what this template is for.
      default: null
    expressions:
      type: list[dict[str, Any]] | None
      description: Expressions backing the template's binding targets.
      default: null
    name:
      type: str
      description: The name of this template, for the user's reference.
    params:
      type: list[dict[str, Any]] | None
      description: The parameters declared by this template, bound per templated path.
      default: null
    path:
      type: list[dict[str, Any]]
      description: The nodes that form the levels and branches of this template.
    repeat_config:
      type: dict[str, Any] | None
      description: '`repeat_config` object. Fields: delay_repeat_on_activity, repeat_after_seconds.'
      default: null
    working_hours:
      type: list[dict[str, Any]] | None
      description: The working hours for this template.
      default: null
    base_url:
      type: str | None
      description: incident.io API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.incident_io.base_url || "https://api.incident.io" }}/v2/escalation_path_templates/${{ FN.url_encode(inputs.id) }}
        method: PUT
        headers:
          Accept: application/json
          Authorization: Bearer ${{ SECRETS.incident_io.INCIDENT_IO_API_KEY }}
        payload:
          description: ${{ inputs.description }}
          expressions: ${{ inputs.expressions }}
          name: ${{ inputs.name }}
          params: ${{ inputs.params }}
          path: ${{ inputs.path }}
          repeat_config: ${{ inputs.repeat_config }}
          working_hours: ${{ inputs.working_hours }}
  returns: ${{ steps.request.result }}
