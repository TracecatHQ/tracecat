type: action
definition:
  title: List case comments
  description: >-
    Lists CaseComments associated with a specific Case. Supports filtering by author,
    creation time and other fields.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.cases.caseComments/list
  namespace: tools.google_chronicle
  name: list_case_comments
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    case:
      type: str
      description: The ID of the Case to list CaseComments for.
    page_size:
      type: int | None
      description: >-
        The maximum number of CaseComments to return. The service may return fewer than
        this value. If unspecified, at most 50 CaseComments will be returned. The
        maximum value is 1000; values above 1000 will be coerced to 1000.
      default: null
    page_token:
      type: str | None
      description: >-
        A page token, received from a previous caseComments.list call. Provide this to
        retrieve the subsequent page. When paginating, all other parameters must match
        the call that provided the page token.
      default: null
    filter:
      type: str | None
      description: >-
        A filter to apply to the list of CaseComments. Supported filter fields:
        createTime, updateTime, user, comment, deletionInvoker, favorite, alert,
        deleted. Example: filter="comment='some_comment'"
      default: null
    order_by:
      type: str | None
      description: >-
        Configures ordering of CaseComments in the response. If not specified,
        CaseComments are returned in descending order of their create time. Supported
        sort fields: createTime, updateTime, user, comment, deletionInvoker, favorite,
        alert, deleted. For example: "comment desc, favorite"
      default: null
    expand:
      type: str | None
      description: >-
        Expand the response to include the full comment object. Supported values:
        caseAttachment
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/cases/${{ inputs.case }}/caseComments
        method: GET
        params:
          pageSize: ${{ inputs.page_size }}
          pageToken: ${{ inputs.page_token }}
          filter: ${{ inputs.filter }}
          orderBy: ${{ inputs.order_by }}
          expand: ${{ inputs.expand }}
  returns: ${{ steps.call_api.result }}
