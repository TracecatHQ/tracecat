type: action
definition:
  title: Bulk assign cases
  description: Assigns multiple cases to a specific analyst or SOC role in bulk.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.cases/executeBulkAssign
  namespace: tools.google_chronicle
  name: bulk_assign_cases
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        The instance to execute bulk assign case on. Format:
        projects/{project}/locations/{location}/instances/{instance}
    cases_ids:
      type: list[int]
      description: Cases to assign.
    user_name:
      type: str
      description: The user name of the new assignee.
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/cases:executeBulkAssign
        method: POST
        payload:
          casesIds: ${{ inputs.cases_ids }}
          userName: ${{ inputs.user_name }}
  returns: ${{ steps.call_api.result }}
