type: action
definition:
  title: Change case priority
  description: Updates the priority of a Case.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.cases/patch
  namespace: tools.google_chronicle
  name: change_case_priority
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    case:
      type: str
      description: The ID of the Case to update.
    priority:
      type: str
      description: >-
        Case priority. For example, "Informative", "Low", "Medium", "High", "Critical".
        The default value is HIGH.
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/cases/${{ FN.url_encode(inputs.case) }}
        method: PATCH
        params:
          updateMask: priority
        payload:
          priority: ${{ inputs.priority }}
  returns: ${{ steps.call_api.result }}
