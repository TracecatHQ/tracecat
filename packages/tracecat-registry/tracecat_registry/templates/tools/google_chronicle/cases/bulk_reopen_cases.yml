type: action
definition:
  title: Bulk reopen cases
  description: >-
    Reopens multiple previously closed cases in a single operation. A comment explaining
    the reason for reopening is required.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.cases/executeBulkReopen
  namespace: tools.google_chronicle
  name: bulk_reopen_cases
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        The instance to execute bulk reopen on. Format:
        projects/{project}/locations/{location}/instances/{instance}
    cases_ids:
      type: list[int]
      description: Cases to reopen.
    reopen_comment:
      type: str
      description: Comment to add to the cases when reopening them.
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/cases:executeBulkReopen
        method: POST
        payload:
          casesIds: ${{ inputs.cases_ids }}
          reopenComment: ${{ inputs.reopen_comment }}
  returns: ${{ steps.call_api.result }}
