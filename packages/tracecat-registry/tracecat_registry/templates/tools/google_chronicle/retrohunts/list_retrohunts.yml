type: action
definition:
  title: List retrohunts
  description: Lists Retrohunts.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.rules.retrohunts/list
  namespace: tools.google_chronicle
  name: list_retrohunts
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    rule:
      type: str
      description: >-
        The rule that the retrohunts belong to. Use "-" to list retrohunts across all
        rules.
    page_size:
      type: int | None
      description: >-
        The maximum number of retrohunt to return. The service may return fewer than
        this value. If unspecified, at most 100 retrohunts will be returned. The maximum
        value is 1000; values above 1000 will be coerced to 1000.
      default: null
    page_token:
      type: str | None
      description: >-
        A page token, received from a previous retrohunts.list call. Provide this to
        retrieve the subsequent page. When paginating, all other parameters provided to
        retrohunts.list must match the call that provided the page token.
      default: null
    filter:
      type: str | None
      description: >-
        A filter that can be used to retrieve specific retrohunts. The following fields
        are filterable: state
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/rules/${{ inputs.rule }}/retrohunts
        method: GET
        params:
          pageSize: ${{ inputs.page_size }}
          pageToken: ${{ inputs.page_token }}
          filter: ${{ inputs.filter }}
  returns: ${{ steps.call_api.result }}
