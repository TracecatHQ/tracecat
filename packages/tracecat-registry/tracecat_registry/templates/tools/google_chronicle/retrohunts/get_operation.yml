type: action
definition:
  title: Get operation
  description: >-
    Gets the latest state of a long-running operation. Clients can use this method to
    poll the operation result at intervals as recommended by the API service.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.operations/get
  namespace: tools.google_chronicle
  name: get_operation
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    operation:
      type: str
      description: The ID of the operation resource.
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/operations/${{ FN.url_encode(inputs.operation) }}
        method: GET
  returns: ${{ steps.call_api.result }}
