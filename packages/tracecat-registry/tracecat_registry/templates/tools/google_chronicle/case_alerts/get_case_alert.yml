type: action
definition:
  title: Get case alert
  description: >-
    Gets a single CaseAlert, including its current status, priority, and associated
    metadata.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.cases.caseAlerts/get
  namespace: tools.google_chronicle
  name: get_case_alert
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    case:
      type: str
      description: The ID of the Case the alert belongs to.
    caseAlert:
      type: str
      description: The ID of the CaseAlert to retrieve.
    expand:
      type: str | None
      description: >-
        Expand the response to include the full alert object. Supported values: sla,
        involvedRelations. Example: "sla, involvedRelations"
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/cases/${{ inputs.case }}/caseAlerts/${{ inputs.caseAlert }}
        method: GET
        params:
          expand: ${{ inputs.expand }}
  returns: ${{ steps.call_api.result }}
