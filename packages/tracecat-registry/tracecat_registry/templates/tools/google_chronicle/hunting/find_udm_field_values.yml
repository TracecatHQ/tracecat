type: action
definition:
  title: Find UDM field values
  description: Finds ingested UDM field values that match a query.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances/findUdmFieldValues
  namespace: tools.google_chronicle
  name: find_udm_field_values
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    query:
      type: str
      description: The partial UDM field value to match.
    limit:
      type: int | None
      description: >-
        The maximum number of value matches to return. The service may return fewer
        matches than this value. If unspecified, defaults to 250. The maximum value is
        1000; values above 1000 will be coerced to 1000.
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}:findUdmFieldValues
        method: GET
        params:
          query: ${{ inputs.query }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.call_api.result }}
