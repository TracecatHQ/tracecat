type: action
definition:
  title: Find entity alerts
  description: >-
    Gets alerts for an entity. The API returns a maximum of 1000 alerts for the
    requested entity.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances/findEntityAlerts
  namespace: tools.google_chronicle
  name: find_entity_alerts
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        The ID of the Instance to summarize entity for. Format:
        projects/{project}/locations/{location}/instances/{instance}
    startTime:
      type: str
      description: >-
        Inclusive start of the time range to retrieve the alerts for, in RFC 3339
        format, e.g. "2014-10-02T15:01:23Z".
    endTime:
      type: str
      description: >-
        Exclusive end of the time range to retrieve the alerts for, in RFC 3339 format.
    entityId:
      type: str | None
      description: >-
        ID of the entity. Use this or the `field_and_value_*` inputs to identify the
        entity.
      default: null
    field_and_value_value:
      type: str | None
      description: Indicator value used to identify the entity.
      default: null
    field_and_value_entity_namespace:
      type: str | None
      description: Entity namespace, applicable to asset entities.
      default: null
    field_and_value_field_path:
      type: str | None
      description: UDM field path identifying the indicator type.
      default: null
    field_and_value_value_type:
      type: str | None
      description: Chronicle value type identifying the indicator type.
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}:findEntityAlerts
        method: GET
        params:
          timeRange.startTime: ${{ inputs.startTime }}
          timeRange.endTime: ${{ inputs.endTime }}
          entityId: ${{ inputs.entityId }}
          fieldAndValue.value: ${{ inputs.field_and_value_value }}
          fieldAndValue.entityNamespace: ${{ inputs.field_and_value_entity_namespace }}
          fieldAndValue.fieldPath: ${{ inputs.field_and_value_field_path }}
          fieldAndValue.valueType: ${{ inputs.field_and_value_value_type }}
  returns: ${{ steps.call_api.result }}
