type: action
definition:
  title: Get alert
  description: RPC for fetching an alert based on its Alert Id.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1alpha/projects.locations.instances.legacy/legacyGetAlert
  namespace: tools.google_chronicle
  name: get_alert
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    alertId:
      type: str
      description: The ID of the collection to return.
    includeDetections:
      type: bool | None
      description: If set to true, response will include non-alerting detections.
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1alpha/${{ inputs.instance }}/legacy:legacyGetAlert
        method: GET
        params:
          alertId: ${{ inputs.alertId }}
          includeDetections: ${{ inputs.includeDetections }}
  returns: ${{ steps.call_api.result }}
