type: action
definition:
  title: Update alert
  description: Legacy endpoint for updating an alert.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1alpha/projects.locations.instances.legacy/legacyUpdateAlert
  namespace: tools.google_chronicle
  name: update_alert
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    alert_id:
      type: str
      description: The id of the alert.
    feedback:
      type: dict[str, Any]
      # Generic: `LegacyFeedback` mixes writable analyst fields with readonly and
      # output-only ones, and the vendor requires the whole message, so a literal
      # map here would send readonly fields the caller never set.
      description: >-
        The analyst-supplied feedback on the alert. Writable fields: verdict,
        reputation, confidenceScore (0-100), riskScore (0-100), disregarded, severity
        (1-100), comment, status, priority, rootCause, reason, severityDisplay.
    case_name:
      type: str | None
      description: The case name that the alert is associated with.
      default: null
    response_platform_info:
      type: dict[str, Any] | None
      # Generic: `ResponsePlatformInfo` is not enumerated on this method page, so
      # there is no documented field set to name.
      description: The response platform info of the alert.
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1alpha/${{ inputs.instance }}/legacy:legacyUpdateAlert
        method: POST
        payload:
          alertId: ${{ inputs.alert_id }}
          feedback: ${{ inputs.feedback }}
          caseName: ${{ inputs.case_name }}
          responsePlatformInfo: ${{ inputs.response_platform_info }}
  returns: ${{ steps.call_api.result }}
