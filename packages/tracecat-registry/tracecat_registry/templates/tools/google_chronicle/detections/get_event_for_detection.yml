type: action
definition:
  title: Get event for detection
  description: Legacy endpoint for getting event for curated detection.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1alpha/projects.locations.instances.legacy/legacyGetEventForDetection
  namespace: tools.google_chronicle
  name: get_event_for_detection
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        The name of the parent resource, which is the SecOps instance this request is
        sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    detection_id:
      type: str
      description: The unique ID of the curated detection, as a base64-encoded string.
    page_size:
      type: int | None
      description: >-
        Number of events to return per page. Default value is 1000 if the pageSize is
        not set in the request.
      default: null
    next_page_token:
      type: dict[str, Any] | None
      # Opaque cursor: the vendor types this query parameter as the `NextPageToken`
      # message and does not enumerate its fields, so it is echoed back from the
      # previous response rather than composed here.
      description: >-
        Page token to support pagination. If no token is supplied, the first page of
        events will be returned.
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1alpha/${{ inputs.instance }}/legacy:legacyGetEventForDetection
        method: GET
        params:
          detectionId: ${{ inputs.detection_id }}
          pageSize: ${{ inputs.page_size }}
          nextPageToken: ${{ inputs.next_page_token }}
  returns: ${{ steps.call_api.result }}
