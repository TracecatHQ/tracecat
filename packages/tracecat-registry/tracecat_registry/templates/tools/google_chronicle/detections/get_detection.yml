type: action
definition:
  title: Get detection
  description: Legacy endpoint for fetching a Detection.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1alpha/projects.locations.instances.legacy/legacyGetDetection
  namespace: tools.google_chronicle
  name: get_detection
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        The name of the parent resource, which is the SecOps instance this request is
        sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    rule_id:
      type: str
      description: >-
        The specific rule revision to get a detection for. There are two acceptable
        formats: "{ruleId}" gets a detection for the latest revision of the Rule, and
        "{ruleId}@{revisionId}" gets a detection for that revision.
    detection_id:
      type: str
      description: The detection to get.
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1alpha/${{ inputs.instance }}/legacy:legacyGetDetection
        method: GET
        params:
          ruleId: ${{ inputs.rule_id }}
          detectionId: ${{ inputs.detection_id }}
  returns: ${{ steps.call_api.result }}
