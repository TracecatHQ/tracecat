type: action
definition:
  title: Delete rule
  description: Deletes a Rule.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.rules/delete
  namespace: tools.google_chronicle
  name: delete_rule
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    rule:
      type: str
      description: >-
        The rule ID of the rule to delete. A rule revision timestamp cannot be specified
        as part of the name, as deleting specific revisions is not supported.
    force:
      type: bool | None
      description: >-
        If set to true, any retrohunts and any detections associated with the rule will
        also be deleted. If set to false, the call will only succeed if the rule has no
        associated retrohunts, including completed retrohunts, and no associated
        detections. Regardless of this field's value, the rule deployment associated
        with this rule will also be deleted.
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/rules/${{ inputs.rule }}
        method: DELETE
        params:
          force: ${{ inputs.force }}
  returns: ${{ steps.call_api.result }}
