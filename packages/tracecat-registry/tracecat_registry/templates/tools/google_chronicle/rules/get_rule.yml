type: action
definition:
  title: Get rule
  description: Gets a Rule.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.rules/get
  namespace: tools.google_chronicle
  name: get_rule
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    rule:
      type: str
      description: >-
        The rule ID of the rule to retrieve, optionally suffixed with `@{revisionId}`
        to pin a revision.
    view:
      type: str | None
      description: >-
        The scope of fields to populate for the Rule being returned. If unspecified,
        defaults to FULL. One of BASIC, FULL, REVISION_METADATA_ONLY.
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/rules/${{ inputs.rule }}
        method: GET
        params:
          view: ${{ inputs.view }}
  returns: ${{ steps.call_api.result }}
