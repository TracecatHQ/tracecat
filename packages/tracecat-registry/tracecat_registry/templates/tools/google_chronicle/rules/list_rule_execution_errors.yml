type: action
definition:
  title: List rule execution errors
  description: Lists rule execution errors.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.ruleExecutionErrors/list
  namespace: tools.google_chronicle
  name: list_rule_execution_errors
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        The instance to list rule execution errors from. Format:
        projects/{project}/locations/{location}/instances/{instance}
    pageSize:
      type: int | None
      description: >-
        The maximum number of rule execution errors to return. The service may return
        fewer than this value. If unspecified, at most 1000 rule execution errors will
        be returned. The maximum value is 10000; values above 10000 will be coerced to
        10000.
      default: null
    pageToken:
      type: str | None
      description: >-
        A page token, received from a previous ruleExecutionErrors.list call. Provide
        this to retrieve the subsequent page. When paginating, all other parameters
        provided to ruleExecutionErrors.list must match the call that provided the page
        token.
      default: null
    filter:
      type: str | None
      description: >-
        A filter that can be used to retrieve specific rule execution errors. Only the
        following filters are allowed: rule = "{Rule.name}", curatedRule =
        "{CuratedRule.name}". For 'rule' an optional revision id may be appended as
        "{Rule.name}@{Rule.revision_id}", or "{Rule.name}@-" to fetch errors across all
        revisions. Revision IDs are not supported for curated rules.
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/ruleExecutionErrors
        method: GET
        params:
          pageSize: ${{ inputs.pageSize }}
          pageToken: ${{ inputs.pageToken }}
          filter: ${{ inputs.filter }}
  returns: ${{ steps.call_api.result }}
