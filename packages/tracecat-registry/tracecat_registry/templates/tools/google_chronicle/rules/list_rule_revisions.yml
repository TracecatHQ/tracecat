type: action
definition:
  title: List rule revisions
  description: Lists all revisions of a rule.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.rules/listRevisions
  namespace: tools.google_chronicle
  name: list_rule_revisions
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}
    rule:
      type: str
      description: The rule ID of the rule to list revisions for.
    pageSize:
      type: int | None
      description: >-
        The maximum number of revisions to return per page. The service may return fewer
        than this value. If unspecified, at most 100 revisions will be returned. The
        maximum value is 1000; values above 1000 will be coerced to 1000.
      default: null
    pageToken:
      type: str | None
      description: >-
        The page token, received from a previous rules.listRevisions call. Provide this
        to retrieve the subsequent page. When paginating, all other parameters provided
        to rules.listRevisions must match the call that provided the page token.
      default: null
    view:
      type: str | None
      description: >-
        The scope of fields to populate for the revision being returned. If unspecified,
        defaults to BASIC. One of BASIC, FULL, REVISION_METADATA_ONLY.
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/rules/${{ inputs.rule }}:listRevisions
        method: GET
        params:
          pageSize: ${{ inputs.pageSize }}
          pageToken: ${{ inputs.pageToken }}
          view: ${{ inputs.view }}
  returns: ${{ steps.call_api.result }}
