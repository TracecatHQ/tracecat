type: action
definition:
  title: List rule deployments
  description: Lists RuleDeployments across all Rules.
  display_group: Google Chronicle
  doc_url: https://docs.cloud.google.com/chronicle/docs/reference/rest/v1/projects.locations.instances.rules.deployments/list
  namespace: tools.google_chronicle
  name: list_rule_deployments
  secrets:
    - type: oauth
      provider_id: google_chronicle
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_chronicle
      grant_type: client_credentials
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Chronicle API base URL. If omitted, uses the workspace variable
        `google_chronicle.base_url`, for example https://us-chronicle.googleapis.com.
      default: null
    instance:
      type: str
      description: >-
        Chronicle instance this request is sent to. Format:
        projects/{project}/locations/{location}/instances/{instance}. The "-" wildcard
        token is used as the rule identifier so deployments across all rules are
        returned.
    page_size:
      type: int | None
      description: >-
        The maximum number of rule deployments to return. The service may return fewer
        than this value. If unspecified, at most 100 rule deployments will be returned.
        The maximum value is 1000; values above 1000 will be coerced to 1000.
      default: null
    page_token:
      type: str | None
      description: >-
        A page token, received from a previous deployments.list call. Provide this to
        retrieve the subsequent page. When paginating, all other parameters provided to
        deployments.list must match the call that provided the page token.
      default: null
    filter:
      type: str | None
      description: >-
        A filter that can be used to retrieve specific rule deployments. The following
        fields are filterable: archived, name
      default: null
  steps:
    - ref: call_api
      action: tools.google_chronicle.call_api
      args:
        url: ${{ inputs.base_url || VARS.google_chronicle.base_url }}/v1/${{ inputs.instance }}/rules/-/deployments
        method: GET
        params:
          pageSize: ${{ inputs.page_size }}
          pageToken: ${{ inputs.page_token }}
          filter: ${{ inputs.filter }}
  returns: ${{ steps.call_api.result }}
