type: action
definition:
  title: Discover assets
  description: >-
    Discover assets. Calls POST /json/v3/search-by-domain/discovery directly.
  display_group: HudsonRock
  doc_url: https://docs.hudsonrock.com/reference/assets-discovery
  namespace: tools.hudsonrock
  name: discover_assets
  secrets:
    - name: hudsonrock
      keys: ["HUDSONROCK_API_KEY"]
  expects:
    domains:
      type: list[str]
      description: List of domains to perform discovery on. Accepts root domains (example.com) and will match all subdomains. Between 1-500 domains can be specified per request.
    types:
      type: list[str] | None
      description: Types of compromises to discover. 'employees' finds corporate email credentials (@company.com), while 'users' finds consumer credentials.
      default: null
    cursor:
      type: str | None
      description: Base64 encoded pagination cursor for retrieving the next set of results. Obtained from the 'nextCursor' field in the previous response.
      default: null
    keywords:
      type: list[str] | None
      description: Optional keywords to narrow discovery results to specific services or applications.
      default: null
    keywords_match:
      type: str | None
      description: Determines how multiple keywords are matched during discovery. 'any' returns results matching at least one keyword (broader discovery), while 'all' requires all keywords to match.
      default: null
    base_url:
      type: str | None
      description: Base URL of the HudsonRock API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.hudsonrock.base_url || "https://api.hudsonrock.com" }}/json/v3/search-by-domain/discovery
        method: POST
        headers:
          Accept: application/json
          Content-Type: application/json
          api-key: ${{ SECRETS.hudsonrock.HUDSONROCK_API_KEY }}
        payload:
          domains: ${{ inputs.domains }}
          types: ${{ inputs.types }}
          cursor: ${{ inputs.cursor }}
          keywords: ${{ inputs.keywords }}
          keywords_match: ${{ inputs.keywords_match }}
  returns: ${{ steps.request.result }}
