type: action
definition:
  title: Get account info
  description: >-
    Get account information. Calls GET /json/v3/my-account directly.
  display_group: HudsonRock
  doc_url: https://docs.hudsonrock.com/reference/getmyaccount
  namespace: tools.hudsonrock
  name: get_account_info
  secrets:
    - name: hudsonrock
      keys: ["HUDSONROCK_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: Base URL of the HudsonRock API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.hudsonrock.base_url || "https://api.hudsonrock.com" }}/json/v3/my-account
        method: GET
        headers:
          Accept: application/json
          api-key: ${{ SECRETS.hudsonrock.HUDSONROCK_API_KEY }}
  returns: ${{ steps.request.result }}
