type: action
definition:
  title: Search username compromises
  description: >-
    Search username compromises. Calls POST /json/v3/search-by-login/usernames directly.
  display_group: HudsonRock
  doc_url: https://docs.hudsonrock.com/reference/search-by-login-usernames
  namespace: tools.hudsonrock
  name: search_username_compromises
  secrets:
    - name: hudsonrock
      keys: ["HUDSONROCK_API_KEY"]
  expects:
    logins:
      type: list[str]
      description: Usernames to search.
    payload:
      type: dict[str, Any] | None
      description: Additional API-native request body fields.
      default: null
    base_url:
      type: str | None
      description: Base URL of the HudsonRock API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.hudsonrock.base_url || "https://api.hudsonrock.com" }}/json/v3/search-by-login/usernames
        method: POST
        headers:
          Accept: application/json
          Content-Type: application/json
          api-key: ${{ SECRETS.hudsonrock.HUDSONROCK_API_KEY }}
        payload: '${{ FN.merge([inputs.payload || {}, {"logins": inputs.logins}]) }}'
  returns: ${{ steps.request.result }}
