type: action
definition:
  title: Lookup URL
  description: >-
    Look up a malware URL. Calls POST /v1/url/ directly.
  display_group: URLhaus
  doc_url: https://urlhaus-api.abuse.ch/#url
  namespace: tools.urlhaus
  name: lookup_url
  secrets:
    - name: abusech
      keys: ["ABUSECH_API_KEY"]
  expects:
    url:
      type: str
      description: URL to lookup.
    base_url:
      type: str | None
      description: URLhaus API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.urlhaus.base_url || "https://urlhaus-api.abuse.ch" }}/v1/url/
        method: POST
        headers:
          Auth-Key: ${{ SECRETS.abusech.ABUSECH_API_KEY }}
        form_data:
          url: ${{ inputs.url }}
  returns: ${{ steps.request.result }}
