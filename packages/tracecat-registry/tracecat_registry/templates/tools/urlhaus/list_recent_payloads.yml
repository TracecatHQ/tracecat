type: action
definition:
  title: List recent payloads
  description: >-
    List recent payloads. Calls GET /v1/payloads/recent/limit/{limit}/ directly.
  display_group: URLhaus
  doc_url: https://urlhaus-api.abuse.ch/#payloads-recent
  namespace: tools.urlhaus
  name: list_recent_payloads
  secrets:
    - name: abusech
      keys: ["ABUSECH_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: URLhaus API base URL.
      default: null
    limit:
      type: int
      description: Maximum number of payloads to return. URLhaus allows up to 1000.
      default: 100
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.urlhaus.base_url || "https://urlhaus-api.abuse.ch" }}/v1/payloads/recent/limit/${{ FN.url_encode(inputs.limit) }}/
        method: GET
        headers:
          Auth-Key: ${{ SECRETS.abusech.ABUSECH_API_KEY }}
  returns: ${{ steps.request.result }}
