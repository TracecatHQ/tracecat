type: action
definition:
  title: Lookup payload
  description: >-
    Look up a payload by file hash. Calls POST /v1/payload/ directly.
  display_group: URLhaus
  doc_url: https://urlhaus-api.abuse.ch/#payload
  namespace: tools.urlhaus
  name: lookup_payload
  secrets:
    - name: abusech
      keys: ["ABUSECH_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: URLhaus API base URL.
      default: null
    file_hash:
      type: str
      description: MD5 or SHA256 hash of the payload to lookup.
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.urlhaus.base_url || "https://urlhaus-api.abuse.ch" }}/v1/payload/
        method: POST
        headers:
          Auth-Key: ${{ SECRETS.abusech.ABUSECH_API_KEY }}
        form_data: '${{ {"md5_hash": inputs.file_hash} if FN.length(inputs.file_hash) == 32 else {"sha256_hash": inputs.file_hash} }}'
  returns: ${{ steps.request.result }}
