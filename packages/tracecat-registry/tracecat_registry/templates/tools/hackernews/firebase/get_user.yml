type: action
definition:
  title: Get user
  description: Get a user. Calls GET /v0/user/{user_id}.json directly.
  display_group: Hacker News
  doc_url: https://github.com/HackerNews/API
  namespace: tools.hackernews
  name: get_user
  secrets: []
  expects:
    user_id:
      type: str
      description: Case-sensitive Hacker News username.
    base_url:
      type: str | None
      description: Base URL of the Hacker News Firebase API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.hackernews.base_url || "https://hacker-news.firebaseio.com" }}/v0/user/${{ FN.url_encode(inputs.user_id) }}.json
        method: GET
        headers:
          Accept: application/json
  returns: ${{ steps.request.result }}
