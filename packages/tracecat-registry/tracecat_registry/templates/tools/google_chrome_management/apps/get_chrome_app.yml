type: action
definition:
  title: Get Chrome app
  description: >-
    Get a specific app for a customer by its resource name, including its permissions, Chrome Web
    Store details, and risk assessment.
  display_group: Google Chrome Management
  doc_url: https://developers.google.com/chrome/management/reference/rest/v1/customers.apps.chrome/get
  namespace: tools.google_chrome_management
  name: get_chrome_app
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    name:
      type: str
      description: >-
        The app for which details are being queried. Examples:
        "customers/my_customer/apps/chrome/gmbmikajjgmnabiglmofipeabaddhgne@2.1.2" for the Save
        to Google Drive Chrome extension version 2.1.2. Omit the `@<version>` suffix for the
        latest version.
  steps:
    - ref: get_chrome_app
      action: tools.google_api.call_api
      args:
        service_name: chromemanagement
        version: v1
        resource: customers.apps.chrome
        method_name: get
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/chrome.management.appdetails.readonly"]
        params:
          name: ${{ inputs.name }}
  returns: ${{ steps.get_chrome_app.result }}
