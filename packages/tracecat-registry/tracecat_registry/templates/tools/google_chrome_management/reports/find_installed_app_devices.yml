type: action
definition:
  title: Find installed app devices
  description: >-
    Generate report of managed Chrome browser devices that have a specified app installed. Covers browsers enrolled in Chrome Enterprise Core only; use `find_installed_app_profiles` for managed profiles.
  display_group: Google Chrome Management
  doc_url: https://developers.google.com/chrome/management/reference/rest/v1/customers.reports/findInstalledAppDevices
  namespace: tools.google_chrome_management
  name: find_installed_app_devices
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer:
      type: str
      description: >-
        Customer id or "my_customer" to use the customer associated to the account making the
        request.
      default: my_customer
    app_id:
      type: str
      description: >-
        Unique identifier of the app. For Chrome apps and extensions, the 32-character id (e.g.
        ehoadneljpdggcbbknedodolkkjodefl). For Android apps, the package name (e.g.
        com.evernote).
    app_type:
      type: str | None
      description: >-
        Type of the app. If not provided, an app type will be inferred from the format of the
        app ID. One of `EXTENSION`, `APP`, `THEME`, `HOSTED_APP`, `ANDROID_APP`.
      default: null
    filter:
      type: str | None
      description: >-
        Query string to filter results, AND-separated fields in EBNF syntax. Note: OR operations
        are not supported in this filter. Supported filter fields: `last_active_date`.
      default: null
    order_by:
      type: str | None
      description: "Field used to order results. Supported order by fields: `machine`, `device_id`."
      default: null
    org_unit_id:
      type: str | None
      description: The ID of the organizational unit.
      default: null
    page_size:
      type: int | None
      description: Maximum number of results to return. Maximum and default are 100.
      default: null
    page_token:
      type: str | None
      description: Token to specify the page of the request to be returned.
      default: null
  steps:
    - ref: find_installed_app_devices
      action: tools.google_api.call_api
      args:
        service_name: chromemanagement
        version: v1
        resource: customers.reports
        method_name: findInstalledAppDevices
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/chrome.management.reports.readonly"]
        params:
          customer: customers/${{ inputs.customer }}
          appId: ${{ inputs.app_id }}
          appType: ${{ inputs.app_type }}
          filter: ${{ inputs.filter }}
          orderBy: ${{ inputs.order_by }}
          orgUnitId: ${{ inputs.org_unit_id }}
          pageSize: ${{ inputs.page_size }}
          pageToken: ${{ inputs.page_token }}
  returns: ${{ steps.find_installed_app_devices.result }}
