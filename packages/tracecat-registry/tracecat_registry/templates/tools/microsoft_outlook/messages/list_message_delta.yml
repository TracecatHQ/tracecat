type: action
definition:
  title: List message delta
  description: >-
    List messages added, deleted or updated in a mail folder. Returns one Graph page
    with `@odata.nextLink` or the terminal `@odata.deltaLink`; pass either opaque URL
    unchanged to `tools.microsoft_outlook_sdk.call_continuation_method`. Do not use
    `call_paginated_method`, which discards the terminal delta link. Least privileged
    permission: Mail.ReadBasic for delegated work or school and personal Microsoft
    accounts, and Mail.ReadBasic.All for application; higher privileged: Mail.Read or
    Mail.ReadWrite. Tracking another user's folder needs application permissions, or
    delegated access to a shared or delegated folder. Available in the global
    service, US Government L4 and US Government L5 (DOD); unavailable in China
    operated by 21Vianet. No separate licensing requirement is documented; the
    mailbox needs Exchange Online or Outlook.com.
  display_group: Microsoft Outlook Mail
  doc_url: https://learn.microsoft.com/en-us/graph/api/message-delta?view=graph-rest-1.0
  namespace: tools.microsoft_outlook
  name: list_message_delta
  secrets:
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: authorization_code
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Microsoft Graph v1.0 API root. If omitted, uses the workspace variable
        `microsoft_outlook.base_url`, then
        `microsoft_graph.base_url`, then https://graph.microsoft.com/v1.0.
        National clouds: https://graph.microsoft.us/v1.0 (US Government L4) and
        https://dod-graph.microsoft.us/v1.0 (US Government L5 DOD).
      default: null
    auth_mode:
      type: enum["application", "delegated", "auto"]
      description: >-
        Credential to use. `application` requires MICROSOFT_OUTLOOK_SERVICE_TOKEN,
        then MICROSOFT_GRAPH_SERVICE_TOKEN; `delegated` requires
        MICROSOFT_OUTLOOK_USER_TOKEN, then MICROSOFT_GRAPH_USER_TOKEN; `auto` tries
        all four in that order.
      default: application
    mailbox_user_id:
      type: str
      description: >-
        Target mailbox, given as a user ID or userPrincipalName and used in the
        `/users/{id | userPrincipalName}` path. Delegated callers may pass their own
        userPrincipalName; application callers must always name the mailbox to act
        on, because an application token has no signed-in user.
    folderId:
      type: str
      description: >-
        The mail folder to track, as a folder ID or a well-known folder name such as
        inbox, sentitems, drafts, deleteditems, junkemail or archive. Delta change
        tracking for messages is scoped to one folder.
      default: inbox
    changeType:
      type: str | None
      description: >-
        Endpoint-native `changeType` filter. The possible values are `created`,
        `updated` and `deleted`.
      default: null
    expand:
      type: str | None
      description: OData `$expand`. Related resources to include in the response.
      default: null
    filter:
      type: str | None
      description: >-
        OData `$filter`. Limited support: only `receivedDateTime` comparisons are
        supported, and it must be specified in the initial request.
      default: null
    orderby:
      type: str | None
      description: >-
        OData `$orderby`. Limited support: only `receivedDateTime desc` is
        supported, and it must be specified in the initial request.
      default: null
    select:
      type: str | None
      description: >-
        OData `$select`. Comma-separated properties to return. It must be specified
        in the initial request.
      default: null
    top:
      type: int | None
      description: >-
        OData `$top`. It must be specified in the initial request.
      default: null
    prefer:
      type: str | None
      description: >-
        `Prefer` request header. `odata.maxpagesize={x}` sets the maximum number of
        messages Microsoft Graph returns per page.
      default: null
  steps:
    - ref: call_graph
      action: tools.microsoft_outlook_sdk.call_method
      args:
        path: /users/${{ FN.url_encode(inputs.mailbox_user_id) }}/mailFolders/${{ FN.url_encode(inputs.folderId) }}/messages/delta
        method: GET
        base_url: ${{ inputs.base_url || VARS.microsoft_outlook.base_url || VARS.microsoft_graph.base_url || "https://graph.microsoft.com/v1.0" }}
        auth_mode: ${{ inputs.auth_mode }}
        headers:
          Prefer: ${{ inputs.prefer }}
        params:
          changeType: ${{ inputs.changeType }}
          $expand: ${{ inputs.expand }}
          $filter: ${{ inputs.filter }}
          $orderby: ${{ inputs.orderby }}
          $select: ${{ inputs.select }}
          $top: ${{ inputs.top }}
  returns: ${{ steps.call_graph.result }}
