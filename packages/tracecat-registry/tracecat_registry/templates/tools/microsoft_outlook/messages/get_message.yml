type: action
definition:
  title: Get message
  description: >-
    Retrieve the properties and relationships of a message object. Least
    privileged permission: Mail.ReadBasic, then Mail.Read, for delegated (work or
    school account) and delegated (personal Microsoft account); Mail.ReadBasic.All,
    then Mail.Read, for application. An app can get a message in another user's
    mail folder if it has application permissions, or if it has delegated
    permissions and that user has shared the mail folder with, or granted delegate
    access to, the signed-in user. Available in the global service, US Government
    L4, US Government L5 (DOD) and China operated by 21Vianet. Microsoft's endpoint
    reference does not state a separate licensing requirement; the mailbox itself
    still needs an Exchange Online or Outlook.com account.
  display_group: Microsoft Outlook Mail
  doc_url: https://learn.microsoft.com/en-us/graph/api/message-get?view=graph-rest-1.0
  namespace: tools.microsoft_outlook
  name: get_message
  secrets:
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: authorization_code
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Microsoft Graph v1.0 API root. If omitted, uses the workspace variable
        `microsoft_outlook.base_url`, then
        `microsoft_graph.base_url`, then https://graph.microsoft.com/v1.0.
        National clouds: https://graph.microsoft.us/v1.0 (US Government L4),
        https://dod-graph.microsoft.us/v1.0 (US Government L5 DOD) and
        https://microsoftgraph.chinacloudapi.cn/v1.0 (China operated by 21Vianet).
      default: null
    auth_mode:
      type: enum["application", "delegated", "auto"]
      description: >-
        Credential to use. `application` requires MICROSOFT_OUTLOOK_SERVICE_TOKEN,
        then MICROSOFT_GRAPH_SERVICE_TOKEN; `delegated` requires
        MICROSOFT_OUTLOOK_USER_TOKEN, then MICROSOFT_GRAPH_USER_TOKEN; `auto` tries
        all four in that order.
      default: application
    mailbox_user_id:
      type: str
      description: >-
        Target mailbox, given as a user ID or userPrincipalName and used in the
        `/users/{id | userPrincipalName}` path. Delegated callers may pass their own
        userPrincipalName; application callers must always name the mailbox to act
        on, because an application token has no signed-in user.
    messageId:
      type: str
      description: The unique identifier of the message.
    expand:
      type: str | None
      description: OData `$expand`. Related resources to include in the response.
      default: null
    select:
      type: str | None
      description: OData `$select`. Comma-separated properties to return.
      default: null
    prefer:
      type: str | None
      description: >-
        `Prefer` request header. `outlook.body-content-type="text"` or
        `outlook.body-content-type="html"` sets the format of the returned `body`
        and `uniqueBody` properties. If omitted, they are returned in HTML format.
      default: null
  steps:
    - ref: call_graph
      action: tools.microsoft_graph_sdk.call_method
      args:
        oauth_provider: microsoft_outlook
        path: /users/${{ FN.url_encode(inputs.mailbox_user_id) }}/messages/${{ FN.url_encode(inputs.messageId) }}
        method: GET
        base_url: ${{ inputs.base_url || VARS.microsoft_outlook.base_url || VARS.microsoft_graph.base_url || "https://graph.microsoft.com/v1.0" }}
        auth_mode: ${{ inputs.auth_mode }}
        headers:
          Prefer: ${{ inputs.prefer }}
        params:
          $expand: ${{ inputs.expand }}
          $select: ${{ inputs.select }}
  returns: ${{ steps.call_graph.result }}
