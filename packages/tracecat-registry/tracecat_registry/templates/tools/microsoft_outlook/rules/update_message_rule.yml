type: action
definition:
  title: Update message rule
  description: >-
    Change writable properties on a message rule and save the changes. Returns
    `200 OK` and the updated message rule. Message rules are exposed only through
    the `messageRules` navigation property of the Inbox folder. Least privileged
    permission: MailboxSettings.ReadWrite for delegated (work or school account),
    delegated (personal Microsoft account) and application; no higher privileged
    permission is available. Available in the global service, US Government L4 and
    US Government L5 (DOD); not available in China operated by 21Vianet.
    Microsoft's endpoint reference does not state a separate licensing requirement;
    the mailbox itself still needs an Exchange Online or Outlook.com account.
  display_group: Microsoft Outlook Mail
  doc_url: https://learn.microsoft.com/en-us/graph/api/messagerule-update?view=graph-rest-1.0
  namespace: tools.microsoft_outlook
  name: update_message_rule
  secrets:
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: authorization_code
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Microsoft Graph v1.0 API root. If omitted, uses the workspace variable
        `microsoft_outlook.base_url`, then
        `microsoft_graph.base_url`, then https://graph.microsoft.com/v1.0.
        National clouds: https://graph.microsoft.us/v1.0 (US Government L4) and
        https://dod-graph.microsoft.us/v1.0 (US Government L5 DOD).
      default: null
    auth_mode:
      type: enum["application", "delegated", "auto"]
      description: >-
        Credential to use. `application` requires MICROSOFT_OUTLOOK_SERVICE_TOKEN,
        then MICROSOFT_GRAPH_SERVICE_TOKEN; `delegated` requires
        MICROSOFT_OUTLOOK_USER_TOKEN, then MICROSOFT_GRAPH_USER_TOKEN; `auto` tries
        all four in that order.
      default: application
    mailbox_user_id:
      type: str
      description: >-
        Target mailbox, given as a user ID or userPrincipalName and used in the
        `/users/{id | userPrincipalName}` path. Delegated callers may pass their own
        userPrincipalName; application callers must always name the mailbox to act
        on, because an application token has no signed-in user.
    ruleId:
      type: str
      description: The unique identifier of the message rule.
    payload:
      # Generic: this is a PATCH over the open-ended messageRuleActions and
      # messageRulePredicates objects, where an omitted property keeps its previous
      # value and an explicit null clears it. A literal map of named inputs cannot
      # express both, so the caller owns the body.
      type: dict[str, Any]
      description: >-
        API-native request body. Supply only the values for properties to update.
        Writable properties for PATCH
        /users/{id}/mailFolders/inbox/messageRules/{ruleId}: actions
        (messageRuleActions), conditions (messageRulePredicates), displayName
        (String), exceptions (messageRulePredicates), isEnabled (Boolean),
        isReadOnly (Boolean, indicates if the rule cannot be modified or deleted by
        the rules REST API) and sequence (Int32).
  steps:
    - ref: call_graph
      action: tools.microsoft_outlook_sdk.call_method
      args:
        path: /users/${{ FN.url_encode(inputs.mailbox_user_id) }}/mailFolders/inbox/messageRules/${{ FN.url_encode(inputs.ruleId) }}
        method: PATCH
        base_url: ${{ inputs.base_url || VARS.microsoft_outlook.base_url || VARS.microsoft_graph.base_url || "https://graph.microsoft.com/v1.0" }}
        auth_mode: ${{ inputs.auth_mode }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.call_graph.result }}
