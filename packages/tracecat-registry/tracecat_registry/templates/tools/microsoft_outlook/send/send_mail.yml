type: action
definition:
  title: Send mail
  description: >-
    Send a message in JSON format from the specified user's mailbox and save it in
    Sent Items. Returns `202 Accepted` with no response body; acceptance does not
    mean processing finished, and delivery is subject to Exchange Online limits and
    throttling. Least privileged permission: Mail.Send for delegated (work or
    school account), delegated (personal Microsoft account) and application; no
    higher privileged permission is available. Sending from another user's mailbox
    with a user token additionally requires Mail.Send.Shared, and the signed-in
    user must hold an Exchange mailbox permission on the from mailbox: Send on
    Behalf, where the recipient sees that the message was sent on behalf of another
    user and `sender` and `from` differ, or Send As, where there is no such
    indication and `sender` and `from` are identical. Users can grant Send on
    Behalf for their own mailbox; only administrators can grant Send As. Addressing
    the mailbox through `/users/{id}`, as this action does, also requires the Full
    Access mailbox permission. Applications that use application tokens and have
    admin-consented Mail.Send can send mail as any user in the organization; scope
    that down with RBAC for Applications in Exchange Online. This action exposes
    the common message fields; for arbitrary Microsoft Graph message shapes,
    attachments inline with the send, or MIME content, call
    `tools.microsoft_outlook_sdk.call_method` directly. Available in the global
    service, US Government L4, US Government L5 (DOD) and China operated by
    21Vianet. Microsoft's endpoint reference does not state a separate licensing
    requirement; the mailbox itself still needs an Exchange Online or Outlook.com
    account.
  display_group: Microsoft Outlook Mail
  doc_url: https://learn.microsoft.com/en-us/graph/api/user-sendmail?view=graph-rest-1.0
  namespace: tools.microsoft_outlook
  name: send_mail
  secrets:
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: authorization_code
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Microsoft Graph v1.0 API root. If omitted, uses the workspace variable
        `microsoft_outlook.base_url`, then https://graph.microsoft.com/v1.0.
        National clouds: https://graph.microsoft.us/v1.0 (US Government L4),
        https://dod-graph.microsoft.us/v1.0 (US Government L5 DOD) and
        https://microsoftgraph.chinacloudapi.cn/v1.0 (China operated by 21Vianet).
      default: null
    auth_mode:
      type: enum["application", "delegated", "auto"]
      description: >-
        Credential to use. `application` requires MICROSOFT_OUTLOOK_SERVICE_TOKEN,
        then MICROSOFT_GRAPH_SERVICE_TOKEN; `delegated` requires
        MICROSOFT_OUTLOOK_USER_TOKEN, then MICROSOFT_GRAPH_USER_TOKEN; `auto` tries
        all four in that order.
      default: application
    mailbox_user_id:
      type: str
      description: >-
        Sending mailbox, given as a user ID or userPrincipalName and used in the
        `/users/{id | userPrincipalName}` path. Delegated callers may pass their own
        userPrincipalName; application callers must always name the mailbox to send
        from, because an application token has no signed-in user.
    subject:
      type: str | None
      description: The subject of the message.
      default: null
    body_content:
      type: str | None
      description: The content of the message body.
      default: null
    body_content_type:
      type: str
      description: >-
        The type of the message body content. The possible values are `Text` and
        `HTML`. Only used when `body_content` is supplied.
      default: Text
    to_recipients:
      type: list[str] | None
      description: >-
        The To recipients, as SMTP addresses. Each address is sent as a Graph
        recipient object.
      default: null
    cc_recipients:
      type: list[str] | None
      description: The Cc recipients, as SMTP addresses.
      default: null
    bcc_recipients:
      type: list[str] | None
      description: The Bcc recipients, as SMTP addresses.
      default: null
    reply_to:
      type: list[str] | None
      description: The email addresses to use when replying, as SMTP addresses.
      default: null
    from_address:
      type: str | None
      description: >-
        The `from` address, that is, the mailbox owner and sender of the message.
        It must correspond to the actual mailbox used. Set it for the send-from-
        another-user scenario, together with the Exchange Send As or Send on Behalf
        permission on that mailbox.
      default: null
    sender_address:
      type: str | None
      description: >-
        The `sender` address, that is, the account actually used to generate the
        message. With Send on Behalf, `sender` is the acting account and `from` is
        the mailbox the message appears to come from; with Send As, the two are
        identical. The value must correspond to the actual mailbox used.
      default: null
    importance:
      type: str | None
      description: >-
        The importance of the message. The possible values are `Low`, `Normal` and
        `High`.
      default: null
    is_read_receipt_requested:
      type: bool | None
      description: Indicates whether a read receipt is requested for the message.
      default: null
    is_delivery_receipt_requested:
      type: bool | None
      description: Indicates whether a delivery receipt is requested for the message.
      default: null
    saveToSentItems:
      type: bool | None
      description: >-
        Indicates whether to save the message in Sent Items. Specify it only if the
        parameter is false; the default is true.
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          bcc_recipients: ${{ inputs.bcc_recipients }}
          body_content: ${{ inputs.body_content }}
          body_content_type: ${{ inputs.body_content_type }}
          cc_recipients: ${{ inputs.cc_recipients }}
          from_address: ${{ inputs.from_address }}
          importance: ${{ inputs.importance }}
          is_delivery_receipt_requested: ${{ inputs.is_delivery_receipt_requested }}
          is_read_receipt_requested: ${{ inputs.is_read_receipt_requested }}
          reply_to: ${{ inputs.reply_to }}
          save_to_sent_items: ${{ inputs.saveToSentItems }}
          sender_address: ${{ inputs.sender_address }}
          subject: ${{ inputs.subject }}
          to_recipients: ${{ inputs.to_recipients }}
        script: |
          def main(
              bcc_recipients,
              body_content,
              body_content_type,
              cc_recipients,
              from_address,
              importance,
              is_delivery_receipt_requested,
              is_read_receipt_requested,
              reply_to,
              save_to_sent_items,
              sender_address,
              subject,
              to_recipients,
          ):
              # Graph rejects an explicit null on most message properties, so unset
              # optionals are omitted rather than serialized.
              def recipients(addresses):
                  return [{"emailAddress": {"address": a}} for a in addresses]

              message = {}
              if subject is not None:
                  message["subject"] = subject
              if body_content is not None:
                  message["body"] = {
                      "contentType": body_content_type,
                      "content": body_content,
                  }
              if to_recipients is not None:
                  message["toRecipients"] = recipients(to_recipients)
              if cc_recipients is not None:
                  message["ccRecipients"] = recipients(cc_recipients)
              if bcc_recipients is not None:
                  message["bccRecipients"] = recipients(bcc_recipients)
              if reply_to is not None:
                  message["replyTo"] = recipients(reply_to)
              if from_address is not None:
                  message["from"] = {"emailAddress": {"address": from_address}}
              if sender_address is not None:
                  message["sender"] = {"emailAddress": {"address": sender_address}}
              if importance is not None:
                  message["importance"] = importance
              if is_read_receipt_requested is not None:
                  message["isReadReceiptRequested"] = is_read_receipt_requested
              if is_delivery_receipt_requested is not None:
                  message["isDeliveryReceiptRequested"] = is_delivery_receipt_requested

              payload = {"message": message}
              if save_to_sent_items is not None:
                  payload["saveToSentItems"] = save_to_sent_items
              return payload
    - ref: call_graph
      action: tools.microsoft_outlook_sdk.call_method
      args:
        path: /users/${{ FN.url_encode(inputs.mailbox_user_id) }}/sendMail
        method: POST
        base_url: ${{ inputs.base_url || VARS.microsoft_outlook.base_url || "https://graph.microsoft.com/v1.0" }}
        auth_mode: ${{ inputs.auth_mode }}
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.call_graph.result }}
