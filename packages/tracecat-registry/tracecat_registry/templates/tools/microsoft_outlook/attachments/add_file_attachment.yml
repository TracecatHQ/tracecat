type: action
definition:
  title: Add file attachment
  description: >-
    Add a `fileAttachment` to a message, normally a draft that has not been sent.
    Returns `201 Created` and the attachment object. This operation limits the size
    of the attachment you can add to under 3 MB; larger files need an upload
    session, which is not covered by this action. Least privileged permission:
    Mail.ReadWrite for delegated (work or school account), delegated (personal
    Microsoft account) and application; no higher privileged permission is
    available. Attaching in another user's mailbox needs application permissions,
    or delegated permissions plus that user sharing the mail folder with, or
    granting delegate access to, the signed-in user. Available in the global
    service, US Government L4, US Government L5 (DOD) and China operated by
    21Vianet. Microsoft's endpoint reference does not state a separate licensing
    requirement; the mailbox itself still needs an Exchange Online or Outlook.com
    account.
  display_group: Microsoft Outlook Mail
  doc_url: https://learn.microsoft.com/en-us/graph/api/message-post-attachments?view=graph-rest-1.0
  namespace: tools.microsoft_outlook
  name: add_file_attachment
  secrets:
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_outlook
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: authorization_code
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Microsoft Graph v1.0 API root. If omitted, uses the workspace variable
        `microsoft_outlook.base_url`, then
        `microsoft_graph.base_url`, then https://graph.microsoft.com/v1.0.
        National clouds: https://graph.microsoft.us/v1.0 (US Government L4),
        https://dod-graph.microsoft.us/v1.0 (US Government L5 DOD) and
        https://microsoftgraph.chinacloudapi.cn/v1.0 (China operated by 21Vianet).
      default: null
    auth_mode:
      type: enum["application", "delegated", "auto"]
      description: >-
        Credential to use. `application` requires MICROSOFT_OUTLOOK_SERVICE_TOKEN,
        then MICROSOFT_GRAPH_SERVICE_TOKEN; `delegated` requires
        MICROSOFT_OUTLOOK_USER_TOKEN, then MICROSOFT_GRAPH_USER_TOKEN; `auto` tries
        all four in that order.
      default: application
    mailbox_user_id:
      type: str
      description: >-
        Target mailbox, given as a user ID or userPrincipalName and used in the
        `/users/{id | userPrincipalName}` path. Delegated callers may pass their own
        userPrincipalName; application callers must always name the mailbox to act
        on, because an application token has no signed-in user.
    messageId:
      type: str
      description: The unique identifier of the message to attach the file to.
    name:
      type: str
      description: >-
        The name representing the text that is displayed below the icon representing
        the embedded attachment.
    contentBytes:
      type: str
      description: The base64-encoded contents of the file.
    contentType:
      type: str | None
      description: The content type of the attachment.
      default: null
    contentId:
      type: str | None
      description: The ID of the attachment in the Exchange store.
      default: null
    isInline:
      type: bool | None
      description: Set to `true` if the attachment is an inline attachment.
      default: null
  steps:
    - ref: call_graph
      action: tools.microsoft_graph_sdk.call_method
      args:
        oauth_provider: microsoft_outlook
        path: /users/${{ FN.url_encode(inputs.mailbox_user_id) }}/messages/${{ FN.url_encode(inputs.messageId) }}/attachments
        method: POST
        base_url: ${{ inputs.base_url || VARS.microsoft_outlook.base_url || VARS.microsoft_graph.base_url || "https://graph.microsoft.com/v1.0" }}
        auth_mode: ${{ inputs.auth_mode }}
        omit_none_payload_fields: true
        payload:
          "@odata.type": "#microsoft.graph.fileAttachment"
          name: ${{ inputs.name }}
          contentBytes: ${{ inputs.contentBytes }}
          contentType: ${{ inputs.contentType }}
          contentId: ${{ inputs.contentId }}
          isInline: ${{ inputs.isInline }}
  returns: ${{ steps.call_graph.result }}
