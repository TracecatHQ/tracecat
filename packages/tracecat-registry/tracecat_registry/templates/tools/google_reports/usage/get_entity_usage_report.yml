type: action
definition:
  title: Get entity usage report
  description: >-
    Retrieves a report which is a collection of properties and statistics for entities used by
    users within the account.
  display_group: Google Workspace Reports
  doc_url: https://developers.google.com/workspace/admin/reports/reference/rest/v1/entityUsageReports/get
  namespace: tools.google_reports
  name: get_entity_usage_report
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    entity_type:
      type: str
      description: >-
        Represents the type of entity for the report. The only allowed value is
        `gplus_communities`, which returns a report on Google+ communities.
    entity_key:
      type: str
      description: >-
        Represents the key of the object to filter the data with. It is a string which can take the
        value `all` to get activity events for all users, or any other value for an app-specific
        entity.
    date:
      type: str
      description: >-
        Represents the date the usage occurred, based on UTC-8:00 (Pacific Standard Time). The
        timestamp is in the ISO 8601 format, `yyyy-mm-dd`.
    customer_id:
      type: str | None
      description: The unique ID of the customer to retrieve data for.
      default: null
    filters:
      type: str | None
      description: >-
        The `filters` query string is a comma-separated list of an application's event parameters
        where the parameter's value is manipulated by a relational operator.
      default: null
    max_results:
      type: int | None
      description: >-
        Determines how many activity records are shown on each response page. The default value is
        1000, which is also the maximum.
      default: null
    page_token:
      type: str | None
      description: >-
        Token to specify next page. A report with multiple pages has a `nextPageToken` property in
        the response.
      default: null
    parameters:
      type: str | None
      description: >-
        The `parameters` query string is a comma-separated list of event parameters that refine a
        report's results, in the form {application name}:{parameter name}.
      default: null
  steps:
    - ref: get_entity_usage_report
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: reports_v1
        resource: entityUsageReports
        method_name: get
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.reports.usage.readonly"]
        params:
          entityType: ${{ inputs.entity_type }}
          entityKey: ${{ inputs.entity_key }}
          date: ${{ inputs.date }}
          customerId: ${{ inputs.customer_id }}
          filters: ${{ inputs.filters }}
          maxResults: ${{ inputs.max_results }}
          pageToken: ${{ inputs.page_token }}
          parameters: ${{ inputs.parameters }}
  returns: ${{ steps.get_entity_usage_report.result }}
