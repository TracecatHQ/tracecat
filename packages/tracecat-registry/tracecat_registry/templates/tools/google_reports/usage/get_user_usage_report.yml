type: action
definition:
  title: Get user usage report
  description: >-
    Retrieves a report which is a collection of properties and statistics for a set of users with
    the account.
  display_group: Google Workspace Reports
  doc_url: https://developers.google.com/workspace/admin/reports/reference/rest/v1/userUsageReport/get
  namespace: tools.google_reports
  name: get_user_usage_report
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    date:
      type: str
      description: >-
        Represents the date the usage occurred, based on UTC-8:00 (Pacific Standard Time). The
        timestamp is in the ISO 8601 format, `yyyy-mm-dd`.
    user_key:
      type: str
      description: >-
        Represents the profile ID or the user email for which the data should be filtered. Can be
        `all` for all information, or `userKey` for a user's unique Google Workspace profile ID or
        their primary email address. Must not be a deleted user.
      default: all
    customer_id:
      type: str | None
      description: The unique ID of the customer to retrieve data for.
      default: null
    filters:
      type: str | None
      description: >-
        The `filters` query string is a comma-separated list of an application's event parameters
        where the parameter's value is manipulated by a relational operator.
      default: null
    group_id_filter:
      type: str | None
      description: >-
        Comma separated group ids (obfuscated) on which user activities are filtered, i.e. the
        response will contain activities for only those users that are a part of at least one of
        the group ids mentioned here. Format: "id:abc123,id:xyz456".
      default: null
    max_results:
      type: int | None
      description: >-
        Determines how many activity records are shown on each response page. The default value is
        1000, which is also the maximum.
      default: null
    org_unit_id:
      type: str | None
      description: >-
        ID of the organizational unit to report on. User activity will be shown only for users who
        belong to the specified organizational unit.
      default: null
    page_token:
      type: str | None
      description: >-
        Token to specify next page. A report with multiple pages has a `nextPageToken` property in
        the response.
      default: null
    parameters:
      type: str | None
      description: >-
        The `parameters` query string is a comma-separated list of event parameters that refine a
        report's results, in the form {application name}:{parameter name}.
      default: null
  steps:
    - ref: get_user_usage_report
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: reports_v1
        resource: userUsageReport
        method_name: get
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.reports.usage.readonly"]
        params:
          userKey: ${{ inputs.user_key }}
          date: ${{ inputs.date }}
          customerId: ${{ inputs.customer_id }}
          filters: ${{ inputs.filters }}
          groupIdFilter: ${{ inputs.group_id_filter }}
          maxResults: ${{ inputs.max_results }}
          orgUnitID: ${{ inputs.org_unit_id }}
          pageToken: ${{ inputs.page_token }}
          parameters: ${{ inputs.parameters }}
  returns: ${{ steps.get_user_usage_report.result }}
