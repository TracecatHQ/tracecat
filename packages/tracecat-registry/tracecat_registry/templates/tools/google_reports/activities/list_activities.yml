type: action
definition:
  title: List activities
  description: >-
    Retrieves a list of activities for a specific customer's account and application such as
    the Admin console application or the Google Drive application. Google is rolling out an
    audit log schema change that renames some event names and types, and after August 2026
    only the updated names are returned; this action returns the events unchanged.
  display_group: Google Workspace Reports
  doc_url: https://developers.google.com/workspace/admin/reports/reference/rest/v1/activities/list
  namespace: tools.google_reports
  name: list_activities
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    application_name:
      type: str
      description: >-
        Application name for which the events are to be retrieved. One of `access_transparency`,
        `admin`, `calendar`, `chat`, `drive`, `gcp`, `gmail`, `gplus`, `groups`,
        `groups_enterprise`, `jamboard`, `login`, `meet`, `mobile`, `rules`, `saml`, `token`,
        `user_accounts`, `context_aware_access`, `chrome`, `data_studio`, `keep`, `vault`,
        `gemini_in_workspace_apps`, `classroom`, `assignments`, `cloud_search`, `tasks`,
        `data_migration`, `meet_hardware`, `directory_sync`, `ldap`, `profile`,
        `access_evaluation`, `admin_data_action`, `contacts`, `takeout`, `graduation`.
    user_key:
      type: str
      description: >-
        Represents the profile ID or the user email for which the data should be filtered. Can be
        `all` for all information, or `userKey` for a user's unique Google Workspace profile ID or
        their primary email address. Must not be a deleted user.
      default: all
    actor_ip_address:
      type: str | None
      description: >-
        The Internet Protocol (IP) Address of host where the event was performed. This parameter
        supports both IPv4 and IPv6 address versions.
      default: null
    customer_id:
      type: str | None
      description: The unique ID of the customer to retrieve data for.
      default: null
    end_time:
      type: str | None
      description: >-
        Sets the end of the range of time shown in the report. The date is in the RFC 3339 format,
        for example 2010-10-28T10:26:35.000Z. The default value is the approximate time of the API
        request. For Gmail requests, `startTime` and `endTime` must be provided and the difference
        must not be greater than 30 days.
      default: null
    event_name:
      type: str | None
      description: >-
        The name of the event being queried by the API. Each `eventName` is related to a specific
        Google Workspace service or feature which the API organizes into types of events.
      default: null
    filters:
      type: str | None
      description: >-
        Comma-separated list composed of event parameters manipulated by relational operators, in
        the form {parameter1 name}{relational operator}{parameter1 value},... These event
        parameters are associated with a specific `eventName`. Supported relational operators are
        `==`, `<>`, `<`, `<=`, `>` and `>=`.
      default: null
    group_id_filter:
      type: str | None
      description: >-
        Comma separated group ids (obfuscated) on which user activities are filtered, i.e. the
        response will contain activities for only those users that are a part of at least one of
        the group ids mentioned here. Format: "id:abc123,id:xyz456". To filter by groups, you must
        explicitly add the groups to your filtering groups allowlist.
      default: null
    max_results:
      type: int | None
      description: >-
        Determines how many activity records are shown on each response page. The default value is
        1000, which is also the maximum.
      default: null
    org_unit_id:
      type: str | None
      description: >-
        ID of the organizational unit to report on. Activity records will be shown only for users
        who belong to the specified organizational unit. Data before Dec 17, 2018 doesn't appear in
        the filtered results.
      default: null
    page_token:
      type: str | None
      description: >-
        The token to specify next page. A report with multiple pages has a `nextPageToken` property
        in the response.
      default: null
    start_time:
      type: str | None
      description: >-
        Sets the beginning of the range of time shown in the report. The date is in the RFC 3339
        format, for example 2010-10-28T10:26:35.000Z. The `startTime` must be before the `endTime`
        (if specified) and the current time when the request is made. For Gmail requests,
        `startTime` and `endTime` must be provided and the difference must not be greater than
        30 days.
      default: null
  steps:
    - ref: list_activities
      action: tools.google_api.call_api
      args:
        service_name: admin
        version: reports_v1
        resource: activities
        method_name: list
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/admin.reports.audit.readonly"]
        params:
          userKey: ${{ inputs.user_key }}
          applicationName: ${{ inputs.application_name }}
          actorIpAddress: ${{ inputs.actor_ip_address }}
          customerId: ${{ inputs.customer_id }}
          endTime: ${{ inputs.end_time }}
          eventName: ${{ inputs.event_name }}
          filters: ${{ inputs.filters }}
          groupIdFilter: ${{ inputs.group_id_filter }}
          maxResults: ${{ inputs.max_results }}
          orgUnitID: ${{ inputs.org_unit_id }}
          pageToken: ${{ inputs.page_token }}
          startTime: ${{ inputs.start_time }}
  returns: ${{ steps.list_activities.result }}
