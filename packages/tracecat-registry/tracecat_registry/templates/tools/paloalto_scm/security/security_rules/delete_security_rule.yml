type: action
definition:
  title: Delete security rule
  description: Delete a security rule from the candidate configuration with DELETE /config/security/v1/security-rules/{id}. Push the candidate configuration to apply the change.
  display_group: Palo Alto Strata Cloud Manager (SCM)
  doc_url: https://pan.dev/scm/api/config/ngfw/security/delete-security-rules-by-id/
  namespace: tools.paloalto_scm
  name: delete_security_rule
  secrets:
    - type: oauth
      provider_id: paloalto_scm
      grant_type: client_credentials
  expects:
    rule_id:
      type: str
      description: Security rule UUID.
    position:
      type: enum["pre", "post"]
      description: Rulebase position of the rule.
      default: pre
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable paloalto_scm.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: delete
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/security/v1/security-rules/${{ FN.url_encode(inputs.rule_id) }}
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.paloalto_scm_oauth.PALOALTO_SCM_SERVICE_TOKEN }}
          Accept: application/json
        params:
          position: ${{ inputs.position }}
  returns: ${{ steps.delete.result.data }}
