type: action
definition:
  title: Block IP
  description: Block an IP address by adding an address object to a static address group referenced by a deny rule. Looks up the address object by name, creates it with POST /config/objects/v1/addresses if missing, then adds it to the group with PUT /config/objects/v1/address-groups/{id} if it is not already a member, so repeated calls do not create duplicates. Changes stay in the candidate configuration; run push_candidate_config to enforce them.
  display_group: Palo Alto Strata Cloud Manager (SCM)
  doc_url: https://pan.dev/scm/api/config/ngfw/objects/create-addresses/
  namespace: tools.paloalto_scm
  name: block_ip
  secrets:
    - type: oauth
      provider_id: paloalto_scm
      grant_type: client_credentials
  expects:
    value:
      type: str
      description: IPv4 or IPv6 address to block.
    address_group:
      type: str
      description: Static address group that a deny rule references, e.g. tracecat-blocklist.
    folder:
      type: str | None
      description: Folder that contains the configuration, e.g. Shared or All Firewalls. Provide exactly one of folder, snippet, or device.
      default: null
    snippet:
      type: str | None
      description: Snippet that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    device:
      type: str | None
      description: Device (serial number) that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    name_prefix:
      type: str
      description: Prefix for generated address object names.
      default: tc-block-
    address_name:
      type: str | None
      description: Address object name to use instead of the generated name.
      default: null
    description:
      type: str | None
      description: Description for a newly created address object, e.g. the case ID.
      default: null
    tags:
      type: list[str] | None
      description: Tags for a newly created address object.
      default: null
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable paloalto_scm.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: plan
      action: core.script.run_python
      args:
        inputs:
          kind: ip
          value: ${{ inputs.value }}
          name_prefix: ${{ inputs.name_prefix }}
          address_name: ${{ inputs.address_name }}
          folder: ${{ inputs.folder }}
          snippet: ${{ inputs.snippet }}
          device: ${{ inputs.device }}
        script: |
          import ipaddress
          import re

          FQDN_RE = re.compile(r"^(?=.{1,253}$)(\*\.)?([A-Za-z0-9_](?:[A-Za-z0-9_-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}\.?$")

          def _indicator(kind, value, name_prefix, address_name):
              value = value.strip()
              if kind == "ip":
                  ip = ipaddress.ip_address(value)
                  field, normalized = "ip_netmask", f"{ip}/{ip.max_prefixlen}"
                  label = str(ip)
              elif kind == "cidr":
                  net = ipaddress.ip_network(value, strict=False)
                  field, normalized = "ip_netmask", str(net)
                  label = str(net) if net.prefixlen != net.max_prefixlen else str(net.network_address)
              elif kind == "ip_or_cidr":
                  return _indicator("cidr" if "/" in value else "ip", value, name_prefix, address_name)
              else:
                  if not FQDN_RE.match(value):
                      raise ValueError(f"Invalid FQDN: {value}")
                  field, normalized = "fqdn", value.rstrip(".").lower()
                  label = normalized
              name = address_name or name_prefix + label.replace(":", "-").replace("/", "_").replace("*", "wildcard")
              if len(name) > 63:
                  raise ValueError(f"Address name {name} exceeds 63 characters; set address_name.")
              return {"field": field, "value": normalized, "name": name}

          def _container(folder, snippet, device):
              container = {
                  key: value
                  for key, value in (("folder", folder), ("snippet", snippet), ("device", device))
                  if value
              }
              if len(container) != 1:
                  raise ValueError("Provide exactly one of folder, snippet, or device.")
              return container


          def main(kind, value, name_prefix, address_name, folder, snippet, device):
              container = _container(folder, snippet, device)
              indicator = _indicator(kind, value, name_prefix, address_name)
              return {"indicator": indicator, "container": container, "address_params": {**container, "name": indicator["name"]}}
    - ref: lookup_address
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/addresses
        method: GET
        headers: &id001
          Authorization: Bearer ${{ SECRETS.paloalto_scm_oauth.PALOALTO_SCM_SERVICE_TOKEN }}
          Accept: application/json
        params: ${{ steps.plan.result.address_params }}
        ignore_status_codes:
          - 404
    - ref: plan_address
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.lookup_address.result }}
          indicator: ${{ steps.plan.result.indicator }}
          container: ${{ steps.plan.result.container }}
          description: ${{ inputs.description }}
          tags: ${{ inputs.tags }}
        script: |
          def _first(response):
              if response.get("status_code") == 404:
                  return None
              data = response.get("data")
              if isinstance(data, dict) and isinstance(data.get("data"), list):
                  data = data["data"][0] if data["data"] else None
              if isinstance(data, dict) and data.get("id"):
                  return data
              return None


          def main(response, indicator, container, description, tags):
              existing = _first(response)
              if existing is not None:
                  current = existing.get(indicator["field"])
                  if current not in (indicator["value"], indicator["value"].split("/")[0]):
                      raise ValueError(
                          f"Address {indicator['name']} already exists with {indicator['field']}={current}, "
                          f"not {indicator['value']}. Set address_name to use a different object."
                      )
                  return {"method": "GET", "path": "/" + existing["id"], "payload": None, "created": False}
              payload = {"name": indicator["name"], indicator["field"]: indicator["value"], **container}
              if description:
                  payload["description"] = description
              if tags:
                  payload["tag"] = tags
              return {"method": "POST", "path": "", "payload": payload, "created": True}
    - ref: upsert_address
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/addresses${{ steps.plan_address.result.path }}
        method: ${{ steps.plan_address.result.method }}
        headers: &id002
          Authorization: Bearer ${{ SECRETS.paloalto_scm_oauth.PALOALTO_SCM_SERVICE_TOKEN }}
          Accept: application/json
          Content-Type: application/json
        payload: ${{ steps.plan_address.result.payload }}
    - ref: lookup_group
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/address-groups
        method: GET
        headers: *id001
        params: '${{ FN.merge([steps.plan.result.container, {"name": inputs.address_group}]) }}'
        ignore_status_codes:
          - 404
    - ref: plan_group
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.lookup_group.result }}
          group_name: ${{ inputs.address_group }}
          address_name: ${{ steps.plan.result.indicator.name }}
          address_created: ${{ steps.plan_address.result.created }}
        script: |
          def _first(response):
              if response.get("status_code") == 404:
                  return None
              data = response.get("data")
              if isinstance(data, dict) and isinstance(data.get("data"), list):
                  data = data["data"][0] if data["data"] else None
              if isinstance(data, dict) and data.get("id"):
                  return data
              return None


          def main(response, group_name, address_name, address_created):
              group = _first(response)
              if group is None:
                  raise ValueError(
                      f"Address group {group_name} not found: {response.get('data')}. Create a static "
                      "address group that is referenced by a deny rule before using it for containment."
                  )
              if "static" not in group:
                  raise ValueError(f"Address group {group_name} is dynamic; use a static address group.")
              members = list(group.get("static") or [])
              path = "/" + group["id"]
              if address_name in members:
                  return {
                      "method": "GET", "path": path, "payload": None, "changed": False,
                      "already_blocked": not address_created,
                  }
              body = {key: value for key, value in group.items() if key != "id"}
              body["static"] = members + [address_name]
              return {"method": "PUT", "path": path, "payload": body, "changed": True, "already_blocked": False}
    - ref: update_group
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/address-groups${{ steps.plan_group.result.path }}
        method: ${{ steps.plan_group.result.method }}
        headers: *id002
        payload: ${{ steps.plan_group.result.payload }}
  returns:
    value: ${{ steps.plan.result.indicator.value }}
    address: ${{ steps.upsert_address.result.data }}
    address_group: ${{ steps.update_group.result.data }}
    address_created: ${{ steps.plan_address.result.created }}
    group_updated: ${{ steps.plan_group.result.changed }}
    already_blocked: ${{ steps.plan_group.result.already_blocked }}
