type: action
definition:
  title: Get device
  description: Get a device onboarded to Strata Cloud Manager with GET /config/setup/v1/devices/{id}.
  display_group: Palo Alto Strata Cloud Manager (SCM)
  doc_url: https://pan.dev/scm/api/config/ngfw/setup/get-device-by-id/
  namespace: tools.paloalto_scm
  name: get_device
  secrets:
    - type: oauth
      provider_id: paloalto_scm
      grant_type: client_credentials
  expects:
    device_id:
      type: str
      description: Device ID (serial number).
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable paloalto_scm.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: get
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/setup/v1/devices/${{ FN.url_encode(inputs.device_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.paloalto_scm_oauth.PALOALTO_SCM_SERVICE_TOKEN }}
          Accept: application/json
  returns: ${{ steps.get.result.data }}
