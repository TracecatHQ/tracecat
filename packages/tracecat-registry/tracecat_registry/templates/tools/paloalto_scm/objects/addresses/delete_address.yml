type: action
definition:
  title: Delete address
  description: Delete a address object from the candidate configuration with DELETE /config/objects/v1/addresses/{id}. Push the candidate configuration to apply the change.
  display_group: Palo Alto Strata Cloud Manager (SCM)
  doc_url: https://pan.dev/scm/api/config/ngfw/objects/delete-addresses-by-id/
  namespace: tools.paloalto_scm
  name: delete_address
  secrets:
    - type: oauth
      provider_id: paloalto_scm
      grant_type: client_credentials
  expects:
    address_id:
      type: str
      description: Address object UUID.
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable paloalto_scm.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: delete
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/addresses/${{ FN.url_encode(inputs.address_id) }}
        method: DELETE
        headers:
          Authorization: Bearer ${{ SECRETS.paloalto_scm_oauth.PALOALTO_SCM_SERVICE_TOKEN }}
          Accept: application/json
  returns: ${{ steps.delete.result.data }}
