type: action
definition:
  title: Create address
  description: Create an address object in the candidate configuration with POST /config/objects/v1/addresses. Provide exactly one of ip_netmask, ip_range, ip_wildcard, or fqdn. Push the candidate configuration to apply the change.
  display_group: Palo Alto Strata Cloud Manager (SCM)
  doc_url: https://pan.dev/scm/api/config/ngfw/objects/create-addresses/
  namespace: tools.paloalto_scm
  name: create_address
  secrets:
    - type: oauth
      provider_id: paloalto_scm
      grant_type: client_credentials
  expects:
    name:
      type: str
      description: Address object name (max 63 characters).
    folder:
      type: str | None
      description: Folder that contains the configuration, e.g. Shared or All Firewalls. Provide exactly one of folder, snippet, or device.
      default: null
    snippet:
      type: str | None
      description: Snippet that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    device:
      type: str | None
      description: Device (serial number) that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    ip_netmask:
      type: str | None
      description: IP address with or without CIDR mask, e.g. 203.0.113.10 or 10.0.0.0/24.
      default: null
    ip_range:
      type: str | None
      description: IP range, e.g. 10.0.0.1-10.0.0.20.
      default: null
    ip_wildcard:
      type: str | None
      description: IP wildcard mask, e.g. 10.20.1.0/0.0.248.255.
      default: null
    fqdn:
      type: str | None
      description: Fully qualified domain name, e.g. malicious.example.com.
      default: null
    description:
      type: str | None
      description: Address object description.
      default: null
    tags:
      type: list[str] | None
      description: Tags to apply. Tags must already exist in the container.
      default: null
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable paloalto_scm.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          name: ${{ inputs.name }}
          folder: ${{ inputs.folder }}
          snippet: ${{ inputs.snippet }}
          device: ${{ inputs.device }}
          ip_netmask: ${{ inputs.ip_netmask }}
          ip_range: ${{ inputs.ip_range }}
          ip_wildcard: ${{ inputs.ip_wildcard }}
          fqdn: ${{ inputs.fqdn }}
          description: ${{ inputs.description }}
          tags: ${{ inputs.tags }}
        script: |
          def _container(folder, snippet, device):
              container = {
                  key: value
                  for key, value in (("folder", folder), ("snippet", snippet), ("device", device))
                  if value
              }
              if len(container) != 1:
                  raise ValueError("Provide exactly one of folder, snippet, or device.")
              return container


          def main(name, folder, snippet, device, ip_netmask, ip_range, ip_wildcard, fqdn, description, tags):
              values = {
                  key: value
                  for key, value in (
                      ("ip_netmask", ip_netmask),
                      ("ip_range", ip_range),
                      ("ip_wildcard", ip_wildcard),
                      ("fqdn", fqdn),
                  )
                  if value
              }
              if len(values) != 1:
                  raise ValueError("Provide exactly one of ip_netmask, ip_range, ip_wildcard, or fqdn.")
              payload = {"name": name, **_container(folder, snippet, device), **values}
              if description is not None:
                  payload["description"] = description
              if tags:
                  payload["tag"] = tags
              return payload
    - ref: create
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/addresses
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.paloalto_scm_oauth.PALOALTO_SCM_SERVICE_TOKEN }}
          Accept: application/json
          Content-Type: application/json
        payload: ${{ steps.build_payload.result }}
  returns: ${{ steps.create.result.data }}
