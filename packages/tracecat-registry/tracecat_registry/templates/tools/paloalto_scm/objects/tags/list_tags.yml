type: action
definition:
  title: List tags
  description: List tags with GET /config/objects/v1/tags, following offset pagination until the limit is reached.
  display_group: Palo Alto Strata Cloud Manager (SCM)
  doc_url: https://pan.dev/scm/api/config/ngfw/objects/list-tags/
  namespace: tools.paloalto_scm
  name: list_tags
  secrets:
    - type: oauth
      provider_id: paloalto_scm
      grant_type: client_credentials
  expects:
    folder:
      type: str | None
      description: Folder that contains the configuration, e.g. Shared or All Firewalls. Provide exactly one of folder, snippet, or device.
      default: null
    snippet:
      type: str | None
      description: Snippet that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    device:
      type: str | None
      description: Device (serial number) that contains the configuration. Provide exactly one of folder, snippet, or device.
      default: null
    limit:
      type: int
      description: Maximum number of items to return across all pages.
      default: 1000
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable paloalto_scm.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: build_query
      action: core.script.run_python
      args:
        inputs:
          folder: ${{ inputs.folder }}
          snippet: ${{ inputs.snippet }}
          device: ${{ inputs.device }}
        script: |
          def _container(folder, snippet, device):
              container = {
                  key: value
                  for key, value in (("folder", folder), ("snippet", snippet), ("device", device))
                  if value
              }
              if len(container) != 1:
                  raise ValueError("Provide exactly one of folder, snippet, or device.")
              return container


          def main(folder, snippet, device):
              query = _container(folder, snippet, device)
              fixed = ", ".join(f"{key!r}: {value!r}" for key, value in query.items())
              next_offset = 'r["data"].get("offset", 0) + len(r["data"].get("data") or [])'
              return {
                  "params": {**query, "limit": 200, "offset": 0},
                  "next_request": f"lambda r: {{'params': {{{fixed}, 'limit': 200, 'offset': {next_offset}}}}}",
              }
    - ref: list
      action: core.http_paginate
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/objects/v1/tags
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.paloalto_scm_oauth.PALOALTO_SCM_SERVICE_TOKEN }}
          Accept: application/json
        params: ${{ steps.build_query.result.params }}
        items_jsonpath: $.data
        stop_condition: 'lambda r: len(r["data"].get("data") or []) == 0 or r["data"].get("offset", 0) + len(r["data"].get("data") or []) >= r["data"].get("total", 0)'
        next_request: ${{ steps.build_query.result.next_request }}
        limit: ${{ inputs.limit }}
  returns: ${{ steps.list.result }}
