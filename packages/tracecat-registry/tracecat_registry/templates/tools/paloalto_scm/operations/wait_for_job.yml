type: action
definition:
  title: Wait for job
  description: Poll GET /config/operations/v1/jobs/{id} until the job finishes, then return normalized status, result, done, and succeeded fields. Fails when the job fails, unless raise_on_failure is false, or when it does not finish within poll_max_attempts.
  display_group: Palo Alto Strata Cloud Manager (SCM)
  doc_url: https://pan.dev/scm/api/config/ngfw/operations/get-jobs-by-id/
  namespace: tools.paloalto_scm
  name: wait_for_job
  secrets:
    - type: oauth
      provider_id: paloalto_scm
      grant_type: client_credentials
  expects:
    job_id:
      type: str
      description: Job ID, e.g. the job_id returned by push_candidate_config.
    poll_interval:
      type: float
      description: Seconds between polls.
      default: 10
    poll_max_attempts:
      type: int
      description: Maximum number of polls.
      default: 60
    raise_on_failure:
      type: bool
      description: Fail the action when the job finishes unsuccessfully.
      default: true
    base_url:
      type: str | None
      description: SCM API base URL. Falls back to the workspace variable paloalto_scm.base_url, then https://api.strata.paloaltonetworks.com. Set this for FedRAMP tenants.
      default: null
  steps:
    - ref: poll
      action: core.http_poll
      args:
        url: ${{ inputs.base_url || VARS.paloalto_scm.base_url || "https://api.strata.paloaltonetworks.com" }}/config/operations/v1/jobs/${{ FN.url_encode(inputs.job_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.paloalto_scm_oauth.PALOALTO_SCM_SERVICE_TOKEN }}
          Accept: application/json
        poll_condition: 'lambda r: bool((r.get("data") or {}).get("data")) and (r["data"]["data"][0].get("status_str") in ["FIN", "PUSHFAIL", "PUSHABORT", "PUSHTIMEOUT"] or r["data"]["data"][0].get("result_str") in ["OK", "FAIL", "CANCELLED", "TIMEOUT"])'
        poll_interval: ${{ inputs.poll_interval }}
        poll_max_attempts: ${{ inputs.poll_max_attempts }}
    - ref: normalize
      action: core.script.run_python
      args:
        inputs:
          response: ${{ steps.poll.result }}
          job_id: ${{ inputs.job_id }}
          raise_on_failure: ${{ inputs.raise_on_failure }}
        script: |
          TERMINAL_STATUS = {"FIN", "PUSHFAIL", "PUSHABORT", "PUSHTIMEOUT"}
          TERMINAL_RESULT = {"OK", "FAIL", "CANCELLED", "TIMEOUT"}
          FAILED_STATUS = {"PUSHFAIL", "PUSHABORT", "PUSHTIMEOUT"}

          def main(response, job_id, raise_on_failure):
              jobs = (response.get("data") or {}).get("data") or []
              if not jobs:
                  raise ValueError(f"SCM job {job_id} not found: {response.get('data')}")
              job = jobs[0]
              status = job.get("status_str")
              result = job.get("result_str")
              done = status in TERMINAL_STATUS or result in TERMINAL_RESULT
              succeeded = done and result == "OK" and status not in FAILED_STATUS
              if raise_on_failure and done and not succeeded:
                  raise ValueError(
                      f"SCM job {job_id} ({job.get('type_str')}) finished with status {status} "
                      f"and result {result}: {job.get('summary') or ''} {job.get('details') or ''}".strip()
                  )
              return {
                  "job_id": job.get("id", job_id),
                  "type": job.get("type_str"),
                  "status": status,
                  "result": result,
                  "percent": job.get("percent"),
                  "summary": job.get("summary"),
                  "details": job.get("details"),
                  "done": done,
                  "succeeded": succeeded,
                  "job": job,
              }
  returns: ${{ steps.normalize.result }}
