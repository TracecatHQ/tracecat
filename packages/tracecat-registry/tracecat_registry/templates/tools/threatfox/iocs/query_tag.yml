type: action
definition:
  title: Query tag
  description: >-
    Query indicators by tag. Calls POST /api/v1/ directly with query taginfo.
  display_group: ThreatFox
  doc_url: https://threatfox.abuse.ch/api/#taginfo
  namespace: tools.threatfox
  name: query_tag
  secrets:
    - name: abusech
      keys: ["ABUSECH_API_KEY"]
  expects:
    tag:
      type: str
      description: ThreatFox tag to query.
    limit:
      type: int | None
      description: Maximum number of results. ThreatFox defaults to 100 and allows up to 1000.
      default: 100
    base_url:
      type: str | None
      description: Base URL of the ThreatFox API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.threatfox.base_url || "https://threatfox-api.abuse.ch" }}/api/v1/
        method: POST
        headers:
          Auth-Key: ${{ SECRETS.abusech.ABUSECH_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        payload:
          query: taginfo
          tag: ${{ inputs.tag }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.request.result }}
