type: action
definition:
  title: Get IOC
  description: >-
    Get a ThreatFox indicator by IOC ID. Calls POST /api/v1/ directly with query ioc.
  display_group: ThreatFox
  doc_url: https://threatfox.abuse.ch/api/#query-id
  namespace: tools.threatfox
  name: get_ioc
  secrets:
    - name: abusech
      keys: ["ABUSECH_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: Base URL of the ThreatFox API.
      default: null
    ioc_id:
      type: str
      description: ThreatFox IOC ID.
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.threatfox.base_url || "https://threatfox-api.abuse.ch" }}/api/v1/
        method: POST
        headers:
          Auth-Key: ${{ SECRETS.abusech.ABUSECH_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        payload:
          query: ioc
          id: ${{ inputs.ioc_id }}
  returns: ${{ steps.request.result }}
