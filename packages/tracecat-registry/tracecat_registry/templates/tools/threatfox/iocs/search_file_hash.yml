type: action
definition:
  title: Search file hash
  description: >-
    Search indicators by file hash. Calls POST /api/v1/ directly with query search_hash.
  display_group: ThreatFox
  doc_url: https://threatfox.abuse.ch/api/#search-by-hash
  namespace: tools.threatfox
  name: search_file_hash
  secrets:
    - name: abusech
      keys: ["ABUSECH_API_KEY"]
  expects:
    file_hash:
      type: str
      description: MD5 or SHA256 file hash.
    base_url:
      type: str | None
      description: Base URL of the ThreatFox API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.threatfox.base_url || "https://threatfox-api.abuse.ch" }}/api/v1/
        method: POST
        headers:
          Auth-Key: ${{ SECRETS.abusech.ABUSECH_API_KEY }}
          Accept: application/json
          Content-Type: application/json
        payload:
          query: search_hash
          hash: ${{ inputs.file_hash }}
  returns: ${{ steps.request.result }}
