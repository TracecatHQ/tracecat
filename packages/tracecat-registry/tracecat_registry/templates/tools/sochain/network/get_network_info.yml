type: action
definition:
  title: Get network info
  description: >-
    Network state and mempool: newest block, hashrate, mempool size and the next six projected blocks with their fee rates. Calls GET /network_info/{network}.
  display_group: SoChain
  doc_url: https://sochain.com/docs/network_info
  namespace: tools.sochain
  name: get_network_info
  secrets:
    - name: sochain
      keys: ["SOCHAIN_API_KEY"]
      # Optional: SoChain answers lookups without a key, up to 2,500 a day per IP.
      # A key from https://sochain.com/dashboard raises the limit to the plan's.
      optional: true
  expects:
    network:
      type: str
      description: "Network code (any case): BTC, LTC, DOGE, ZEC, BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST or ZECTEST."
    base_url:
      type: str | None
      description: SoChain API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sochain.base_url || "https://sochain.com/api/v3" }}/network_info/${{ FN.url_encode(inputs.network) }}
        method: GET
        headers:
          Accept: application/json
          API-KEY: ${{ SECRETS.sochain.SOCHAIN_API_KEY }}
  returns: ${{ steps.request.result }}
