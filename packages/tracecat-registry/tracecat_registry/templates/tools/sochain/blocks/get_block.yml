type: action
definition:
  title: Get block
  description: >-
    One block, by height or hash: header, subsidy (reward), fees, value out and every transaction ID. Calls GET /block/{network}/{hash_or_height}.
  display_group: SoChain
  doc_url: https://sochain.com/docs/block
  namespace: tools.sochain
  name: get_block
  secrets:
    - name: sochain
      keys: ["SOCHAIN_API_KEY"]
      # Optional: SoChain answers lookups without a key, up to 2,500 a day per IP.
      # A key from https://sochain.com/dashboard raises the limit to the plan's.
      optional: true
  expects:
    network:
      type: str
      description: "Network code (any case): BTC, LTC, DOGE, ZEC, BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST or ZECTEST."
    hash_or_height:
      type: str
      description: A block height (up to 8 digits) or block hash (64 hex characters, any case).
    currency:
      type: str | None
      description: >-
        Prices in this currency instead of US dollars (any case). One of AUD, BRL,
        CAD, CHF, CNY, CZK, DKK, EUR, GBP, HKD, HUF, IDR, ILS, INR, ISK, JPY, KRW,
        MXN, MYR, NOK, NZD, PHP, PLN, RON, SEK, SGD, THB, TRY, USD or ZAR.
      default: null
    base_url:
      type: str | None
      description: SoChain API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sochain.base_url || "https://sochain.com/api/v3" }}/block/${{ FN.url_encode(inputs.network) }}/${{ FN.url_encode(inputs.hash_or_height) }}
        method: GET
        headers:
          Accept: application/json
          API-KEY: ${{ SECRETS.sochain.SOCHAIN_API_KEY }}
        params:
          currency: ${{ inputs.currency }}
  returns: ${{ steps.request.result }}
