type: action
definition:
  title: Get address summary
  description: >-
    Transaction counts in each direction, balances, everything ever received, and the blocks of the first and latest transactions. Calls GET /address_summary/{network}/{address}.
  display_group: SoChain
  doc_url: https://sochain.com/docs/address_summary
  namespace: tools.sochain
  name: get_address_summary
  secrets:
    - name: sochain
      keys: ["SOCHAIN_API_KEY"]
      # Optional: SoChain answers lookups without a key, up to 2,500 a day per IP.
      # A key from https://sochain.com/dashboard raises the limit to the plan's.
      optional: true
  expects:
    network:
      type: str
      description: "Network code (any case): BTC, LTC, DOGE, ZEC, BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST or ZECTEST."
    address:
      type: str
      description: An address (letters and digits).
    base_url:
      type: str | None
      description: SoChain API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sochain.base_url || "https://sochain.com/api/v3" }}/address_summary/${{ FN.url_encode(inputs.network) }}/${{ FN.url_encode(inputs.address) }}
        method: GET
        headers:
          Accept: application/json
          API-KEY: ${{ SECRETS.sochain.SOCHAIN_API_KEY }}
  returns: ${{ steps.request.result }}
