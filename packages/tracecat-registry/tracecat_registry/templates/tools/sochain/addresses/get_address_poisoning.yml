type: action
definition:
  title: Get address poisoning
  description: >-
    Whether an address was targeted by address poisoning: look-alike addresses that sent it dust, imitating an address it really paid or was paid by. Calls GET /address_poisoning/{network}/{address}.
  display_group: SoChain
  doc_url: https://sochain.com/docs/address_poisoning
  namespace: tools.sochain
  name: get_address_poisoning
  secrets:
    - name: sochain
      keys: ["SOCHAIN_API_KEY"]
      # Optional: SoChain answers lookups without a key, up to 2,500 a day per IP.
      # A key from https://sochain.com/dashboard raises the limit to the plan's.
      optional: true
  expects:
    network:
      type: str
      description: "Network code (any case): BTC, LTC, DOGE, ZEC, BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST or ZECTEST."
    address:
      type: str
      description: An address (letters and digits).
    limit:
      type: int | None
      description: "Rows: 1 to 100, default 50, newest first."
      default: null
    base_url:
      type: str | None
      description: SoChain API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sochain.base_url || "https://sochain.com/api/v3" }}/address_poisoning/${{ FN.url_encode(inputs.network) }}/${{ FN.url_encode(inputs.address) }}
        method: GET
        headers:
          Accept: application/json
          API-KEY: ${{ SECRETS.sochain.SOCHAIN_API_KEY }}
        params:
          limit: ${{ inputs.limit }}
  returns: ${{ steps.request.result }}
