type: action
definition:
  title: Get transaction status
  description: >-
    Whether a transaction is pending, mined, replaced or dropped. Calls GET /transaction_status/{network}/{hash}.
  display_group: SoChain
  doc_url: https://sochain.com/docs/transaction_status
  namespace: tools.sochain
  name: get_transaction_status
  secrets:
    - name: sochain
      keys: ["SOCHAIN_API_KEY"]
      # Optional: SoChain answers lookups without a key, up to 2,500 a day per IP.
      # A key from https://sochain.com/dashboard raises the limit to the plan's.
      optional: true
  expects:
    network:
      type: str
      description: "Network code (any case): BTC, LTC, DOGE, ZEC, BTCTEST (Bitcoin testnet4), LTCTEST, DOGETEST or ZECTEST."
    hash:
      type: str
      description: "Transaction ID: 64 hex characters (any case)."
    base_url:
      type: str | None
      description: SoChain API base URL.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sochain.base_url || "https://sochain.com/api/v3" }}/transaction_status/${{ FN.url_encode(inputs.network) }}/${{ FN.url_encode(inputs.hash) }}
        method: GET
        headers:
          Accept: application/json
          API-KEY: ${{ SECRETS.sochain.SOCHAIN_API_KEY }}
  returns: ${{ steps.request.result }}
