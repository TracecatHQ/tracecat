type: action
definition:
  title: List browsers
  description: >-
    List browsers with the Push extension installed. Calls GET /v1/browsers.
  display_group: Push Security
  doc_url: https://developer.pushsecurity.com/rest-v1/browsers/get-browsers
  namespace: tools.push_security
  name: list_browsers
  secrets:
    - name: push_security
      keys: ["PUSH_SECURITY_API_KEY"]
  expects:
    email:
      type: str | None
      description: "Filter by employee email address."
      default: null
    employeeId:
      type: str | None
      description: "Filter by employee ID."
      default: null
    browser:
      type: str | None
      description: "Filter by browser type."
      enum: [CHROME, FIREFOX, EDGE, SAFARI, OPERA, BRAVE, ARC, ISLAND, PRISMA_ACCESS, ATLAS, COMET, DIA, UNKNOWN]
      default: null
    os:
      type: str | None
      description: "Filter by operating system."
      enum: [MACOS, WINDOWS, LINUX, CHROME_OS, IOS, ANDROID, UNKNOWN]
      default: null
    lastOnlineTimestampAfter:
      type: int | None
      description: "Only include browsers last online after this timestamp (Unix epoch seconds)."
      default: null
    lastOnlineTimestampBefore:
      type: int | None
      description: "Only include browsers last online before this timestamp (Unix epoch seconds)."
      default: null
    limit:
      type: int | None
      description: "Used for pagination. Number of objects to return. Maximum 500, provider default 500."
      default: null
    nextToken:
      type: str | None
      description: "Used for pagination. Token to be used for the next request, from paging.nextToken in the previous response."
      default: null
    base_url:
      type: str | None
      description: "Push Security regional API base URL: https://us1.api.pushsecurity.com (US) or https://eu1.api.pushsecurity.com (EU). Falls back to the workspace variable push_security.base_url."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.push_security.base_url }}/v1/browsers
        method: GET
        headers:
          x-api-key: ${{ SECRETS.push_security.PUSH_SECURITY_API_KEY }}
        params:
          email: ${{ inputs.email }}
          employeeId: ${{ inputs.employeeId }}
          browser: ${{ inputs.browser }}
          os: ${{ inputs.os }}
          lastOnlineTimestampAfter: ${{ inputs.lastOnlineTimestampAfter }}
          lastOnlineTimestampBefore: ${{ inputs.lastOnlineTimestampBefore }}
          limit: ${{ inputs.limit }}
          nextToken: ${{ inputs.nextToken }}
  returns: ${{ steps.request.result }}
