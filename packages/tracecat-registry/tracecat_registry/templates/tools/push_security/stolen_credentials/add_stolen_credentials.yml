type: action
definition:
  title: Add stolen credentials
  description: >-
    Add stolen credentials sourced from other threat intelligence feeds within your
    organization. Calls POST /v1/controls/stolenCredentials.
  display_group: Push Security
  doc_url: https://developer.pushsecurity.com/rest-v1/stolen-credential-detection/post-controls-stolencredentials
  namespace: tools.push_security
  name: add_stolen_credentials
  secrets:
    - name: push_security
      keys: ["PUSH_SECURITY_API_KEY"]
  expects:
    credentials:
      type: list[dict[str, Any]]
      description: "A list of 1 to 500 stolen credentials. Each has email (email address of employee), password (plain text password; hashes will never match) and optional metadata (an object from the TI provider about where the credentials were found, attached to any matching Stolen Credentials finding)."
    base_url:
      type: str | None
      description: "Push Security regional API base URL: https://us1.api.pushsecurity.com (US) or https://eu1.api.pushsecurity.com (EU). Falls back to the workspace variable push_security.base_url."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.push_security.base_url }}/v1/controls/stolenCredentials
        method: POST
        headers:
          x-api-key: ${{ SECRETS.push_security.PUSH_SECURITY_API_KEY }}
          Content-Type: application/json
        payload: ${{ inputs.credentials }}
  returns: ${{ steps.request.result }}
