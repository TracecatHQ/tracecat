type: action
definition:
  title: Remove control rule
  description: >-
    Remove one rule from a browser control by its id. Calls GET then PUT
    /v1/controls/{control}/configuration. The PUT replaces the whole configuration, so this
    action reads the current configuration first and sends it back with only this change.
    Rules are evaluated in order and the first match wins. Edits made to the same control
    between the read and the write are lost.
  display_group: Push Security
  doc_url: https://developer.pushsecurity.com/rest-v1
  namespace: tools.push_security
  name: remove_control_rule
  secrets:
    - name: push_security
      keys: ["PUSH_SECURITY_API_KEY"]
  expects:
    control:
      type: str
      description: "The control's name in the API path. One of: accountConditionEnforcement, appBanner, appBannerUrlPattern, browserExtensionBlocking, clipboardBlocking, clonedLoginPageDetection, domainCategoryBlocking, fileDownloadBlocking, fileUploadBlocking, mfaEnforcement, maliciousBrowserExtensionDetection, maliciousCopyPasteDetection, passwordLoggingPrevention, phishingToolDetection, strongPasswordEnforcement."
      enum: [accountConditionEnforcement, appBanner, appBannerUrlPattern, browserExtensionBlocking, clipboardBlocking, clonedLoginPageDetection, domainCategoryBlocking, fileDownloadBlocking, fileUploadBlocking, mfaEnforcement, maliciousBrowserExtensionDetection, maliciousCopyPasteDetection, passwordLoggingPrevention, phishingToolDetection, strongPasswordEnforcement]
    rule_id:
      type: str
      description: "The rule's unique identifier, from get_control_configuration."
    base_url:
      type: str | None
      description: "Push Security regional API base URL: https://us1.api.pushsecurity.com (US) or https://eu1.api.pushsecurity.com (EU). Falls back to the workspace variable push_security.base_url."
      default: null
  steps:
    - ref: get_configuration
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.push_security.base_url }}/v1/controls/${{ FN.url_encode(inputs.control) }}/configuration
        method: GET
        headers:
          x-api-key: ${{ SECRETS.push_security.PUSH_SECURITY_API_KEY }}
    - ref: build_configuration
      action: core.script.run_python
      args:
        inputs:
          current: ${{ steps.get_configuration.result.data }}
          rule_id: ${{ inputs.rule_id }}
        script: |
          def find_rule(rules, rule_id):
              for index, rule in enumerate(rules):
                  if rule.get("id") == rule_id:
                      return index
              raise ValueError(f"No rule with id {rule_id!r} in this control's configuration")

          def main(current, rule_id):
              rules = list(current.get("rules") or [])
              rules.pop(find_rule(rules, rule_id))
              return {**current, "rules": rules}
    - ref: update_configuration
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.push_security.base_url }}/v1/controls/${{ FN.url_encode(inputs.control) }}/configuration
        method: PUT
        headers:
          x-api-key: ${{ SECRETS.push_security.PUSH_SECURITY_API_KEY }}
          Content-Type: application/json
        payload: ${{ steps.build_configuration.result }}
  returns: ${{ steps.update_configuration.result }}
