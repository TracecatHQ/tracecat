type: action
definition:
  title: Get detection
  description: >-
    Retrieve a detection. Calls GET /v1/detections/{id}.
  display_group: Push Security
  doc_url: https://developer.pushsecurity.com/rest-v1/detections/get-detections-id
  namespace: tools.push_security
  name: get_detection
  secrets:
    - name: push_security
      keys: ["PUSH_SECURITY_API_KEY"]
  expects:
    id:
      type: str
      description: "Unique identifier for this object."
    base_url:
      type: str | None
      description: "Push Security regional API base URL: https://us1.api.pushsecurity.com (US) or https://eu1.api.pushsecurity.com (EU). Falls back to the workspace variable push_security.base_url."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.push_security.base_url }}/v1/detections/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          x-api-key: ${{ SECRETS.push_security.PUSH_SECURITY_API_KEY }}
  returns: ${{ steps.request.result }}
