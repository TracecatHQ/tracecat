type: action
definition:
  title: List browser extensions
  description: >-
    List browser extensions installed in your environment. Calls GET /v1/browserExtensions.
  display_group: Push Security
  doc_url: https://developer.pushsecurity.com/rest-v1/browser-extensions/get-browser-extensions
  namespace: tools.push_security
  name: list_browser_extensions
  secrets:
    - name: push_security
      keys: ["PUSH_SECURITY_API_KEY"]
  expects:
    extensionId:
      type: str | None
      description: "Filter by extension ID."
      default: null
    employeeId:
      type: str | None
      description: "Filter by employee ID."
      default: null
    browserId:
      type: str | None
      description: "Filter by browser ID."
      default: null
    deploymentMode:
      type: str | None
      description: "Filter by deployment mode."
      enum: [MANAGED, DEVELOPMENT, MANUAL, SIDELOAD, OTHER]
      default: null
    permissions:
      type: list[str] | None
      description: "Filter by browser permissions requested by the extension."
      default: null
    hostPermissions:
      type: list[str] | None
      description: "Filter by host permissions requested by the extension."
      default: null
    enabled:
      type: bool | None
      description: "Filter by whether the extension is enabled."
      default: null
    limit:
      type: int | None
      description: "Used for pagination. Number of objects to return. Maximum 500, provider default 500."
      default: null
    nextToken:
      type: str | None
      description: "Used for pagination. Token to be used for the next request, from paging.nextToken in the previous response."
      default: null
    base_url:
      type: str | None
      description: "Push Security regional API base URL: https://us1.api.pushsecurity.com (US) or https://eu1.api.pushsecurity.com (EU). Falls back to the workspace variable push_security.base_url."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.push_security.base_url }}/v1/browserExtensions
        method: GET
        headers:
          x-api-key: ${{ SECRETS.push_security.PUSH_SECURITY_API_KEY }}
        params:
          extensionId: ${{ inputs.extensionId }}
          employeeId: ${{ inputs.employeeId }}
          browserId: ${{ inputs.browserId }}
          deploymentMode: ${{ inputs.deploymentMode }}
          permissions: ${{ inputs.permissions }}
          hostPermissions: ${{ inputs.hostPermissions }}
          enabled: ${{ inputs.enabled }}
          limit: ${{ inputs.limit }}
          nextToken: ${{ inputs.nextToken }}
  returns: ${{ steps.request.result }}
