type: action
definition:
  title: List blocked URLs
  description: >-
    List the URL patterns blocked by URL blocking. Calls GET /v1/controls/blockedUrls.
  display_group: Push Security
  doc_url: https://developer.pushsecurity.com/rest-v1/url-blocking/get-controls-blockedurls
  namespace: tools.push_security
  name: list_blocked_urls
  secrets:
    - name: push_security
      keys: ["PUSH_SECURITY_API_KEY"]
  expects:
    base_url:
      type: str | None
      description: "Push Security regional API base URL: https://us1.api.pushsecurity.com (US) or https://eu1.api.pushsecurity.com (EU). Falls back to the workspace variable push_security.base_url."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.push_security.base_url }}/v1/controls/blockedUrls
        method: GET
        headers:
          x-api-key: ${{ SECRETS.push_security.PUSH_SECURITY_API_KEY }}
  returns: ${{ steps.request.result }}
