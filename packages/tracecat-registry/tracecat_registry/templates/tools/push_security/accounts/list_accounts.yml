type: action
definition:
  title: List accounts
  description: >-
    List accounts. Calls GET /v1/accounts.
  display_group: Push Security
  doc_url: https://developer.pushsecurity.com/rest-v1/accounts/get-accounts
  namespace: tools.push_security
  name: list_accounts
  secrets:
    - name: push_security
      keys: ["PUSH_SECURITY_API_KEY"]
  expects:
    email:
      type: str | None
      description: "Filter by account email address."
      default: null
    appType:
      type: str | None
      description: "Filter by app type."
      default: null
    employeeId:
      type: str | None
      description: "Filter by employee ID."
      default: null
    passwordId:
      type: str | None
      description: "Filter by password ID."
      default: null
    lastUsedTimestampAfter:
      type: int | None
      description: "Only include accounts last used after this timestamp (Unix epoch seconds)."
      default: null
    lastUsedTimestampBefore:
      type: int | None
      description: "Only include accounts last used before this timestamp (Unix epoch seconds)."
      default: null
    limit:
      type: int | None
      description: "Used for pagination. Number of objects to return. Maximum 500, provider default 500."
      default: null
    nextToken:
      type: str | None
      description: "Used for pagination. Token to be used for the next request, from paging.nextToken in the previous response."
      default: null
    base_url:
      type: str | None
      description: "Push Security regional API base URL: https://us1.api.pushsecurity.com (US) or https://eu1.api.pushsecurity.com (EU). Falls back to the workspace variable push_security.base_url."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.push_security.base_url }}/v1/accounts
        method: GET
        headers:
          x-api-key: ${{ SECRETS.push_security.PUSH_SECURITY_API_KEY }}
        params:
          email: ${{ inputs.email }}
          appType: ${{ inputs.appType }}
          employeeId: ${{ inputs.employeeId }}
          passwordId: ${{ inputs.passwordId }}
          lastUsedTimestampAfter: ${{ inputs.lastUsedTimestampAfter }}
          lastUsedTimestampBefore: ${{ inputs.lastUsedTimestampBefore }}
          limit: ${{ inputs.limit }}
          nextToken: ${{ inputs.nextToken }}
  returns: ${{ steps.request.result }}
