type: action
definition:
  title: "List actors"
  description: "Get a paginated and sorted list of top threat actors for the specified time range. Calls GET /api/v1/dash/reports/actor-reports/actors."
  display_group: Proofpoint Threat Protection
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  namespace: tools.proofpoint_threat_protection
  name: list_actors
  secrets:
    - type: oauth
      provider_id: proofpoint_threat_protection
      grant_type: client_credentials
  expects:
    start:
      type: str
      description: "Start time for the reporting period in ISO 8601 UTC format."
    end:
      type: str
      description: "End time for the reporting period in ISO 8601 UTC format."
    page:
      type: int | None
      description: "Page number for pagination. Non-negative integer. Defaults to 0."
      default: null
    size:
      type: int | None
      description: "Number of results per page. Positive integer. Defaults to 10."
      default: null
    sortBy:
      type: str | None
      description: "Field to sort by. Valid values: ATTACK_INDEX, DISTINCT_THREATS. Defaults to ATTACK_INDEX."
      default: null
    sortOrder:
      type: str | None
      description: "Sort order. Valid values: ASC, DESC. Defaults to DESC."
      default: null
    base_url:
      type: str | None
      description: "Proofpoint Threat Protection API base URL. Defaults to https://threatprotection-api.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_threat_protection.base_url || "https://threatprotection-api.proofpoint.com" }}/api/v1/dash/reports/actor-reports/actors
        method: GET
        params:
          start: ${{ inputs.start }}
          end: ${{ inputs.end }}
          page: ${{ inputs.page }}
          size: ${{ inputs.size }}
          sortBy: ${{ inputs.sortBy }}
          sortOrder: ${{ inputs.sortOrder }}
        headers:
          Authorization: Bearer ${{ SECRETS.proofpoint_threat_protection_oauth.PROOFPOINT_THREAT_PROTECTION_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
