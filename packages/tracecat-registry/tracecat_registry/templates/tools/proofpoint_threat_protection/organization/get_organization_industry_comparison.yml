type: action
definition:
  title: "Get organization industry comparison"
  description: "Compares organization's threat metrics against selected industry verticals over a specified interval. Calls GET /api/v1/dash/reports/organization-reports/industry-comparison."
  display_group: Proofpoint Threat Protection
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  namespace: tools.proofpoint_threat_protection
  name: get_organization_industry_comparison
  secrets:
    - type: oauth
      provider_id: proofpoint_threat_protection
      grant_type: client_credentials
  expects:
    startMonth:
      type: str
      description: "Start month in YYYY-MM format. Must be valid YYYY-MM format within allowed range: from last 13 months to current month minus interval value (MONTH=1, QUARTER=3)."
    interval:
      type: str
      description: "Time interval for comparison. Valid values: MONTH, QUARTER."
    industries:
      type: list[str] | None
      description: "List of industry verticals. Maximum 3 allowed. Valid industry names. Defaults to Customer's default."
      default: null
    base_url:
      type: str | None
      description: "Proofpoint Threat Protection API base URL. Defaults to https://threatprotection-api.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_threat_protection.base_url || "https://threatprotection-api.proofpoint.com" }}/api/v1/dash/reports/organization-reports/industry-comparison
        method: GET
        params:
          startMonth: ${{ inputs.startMonth }}
          interval: ${{ inputs.interval }}
          industries: ${{ inputs.industries }}
        headers:
          Authorization: Bearer ${{ SECRETS.proofpoint_threat_protection_oauth.PROOFPOINT_THREAT_PROTECTION_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
