type: action
definition:
  title: "Get executive summary inbound email protection breakdown"
  description: "Get breakdown of inbound email protection metrics for the specified cluster and time range. This endpoint mirrors the Dashboard \u203a Executive Summary \u203a Inbound Email Protection Breakdown card. Calls GET /api/v1/dash/reports/executive-summary/inbound-email-protection-breakdown."
  display_group: Proofpoint Threat Protection
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  namespace: tools.proofpoint_threat_protection
  name: get_executive_summary_inbound_email_protection_breakdown
  secrets:
    - type: oauth
      provider_id: proofpoint_threat_protection
      grant_type: client_credentials
  expects:
    start:
      type: str
      description: "Start time for the reporting period in ISO 8601 UTC format (e.g., 2024-01-01T00:00:00.000Z)."
    end:
      type: str
      description: "End time for the reporting period in ISO 8601 UTC format (e.g., 2024-01-31T23:59:59.000Z)."
    clusterId:
      type: str
      description: "Cluster ID for the request."
    base_url:
      type: str | None
      description: "Proofpoint Threat Protection API base URL. Defaults to https://threatprotection-api.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_threat_protection.base_url || "https://threatprotection-api.proofpoint.com" }}/api/v1/dash/reports/executive-summary/inbound-email-protection-breakdown
        method: GET
        params:
          start: ${{ inputs.start }}
          end: ${{ inputs.end }}
          clusterId: ${{ inputs.clusterId }}
        headers:
          Authorization: Bearer ${{ SECRETS.proofpoint_threat_protection_oauth.PROOFPOINT_THREAT_PROTECTION_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
