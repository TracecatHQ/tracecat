type: action
definition:
  title: "Get executive summary threat landscape effectiveness"
  description: "Get threat landscape and effectiveness metrics with various breakdown options. Calls GET /api/v1/dash/reports/executive-summary/threat-landscape-effectiveness."
  display_group: Proofpoint Threat Protection
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  namespace: tools.proofpoint_threat_protection
  name: get_executive_summary_threat_landscape_effectiveness
  secrets:
    - type: oauth
      provider_id: proofpoint_threat_protection
      grant_type: client_credentials
  expects:
    start:
      type: str
      description: "Start time for the reporting period in ISO 8601 UTC format."
    end:
      type: str
      description: "End time for the reporting period in ISO 8601 UTC format."
    breakDownBy:
      type: str | None
      description: "Breakdown dimension. Valid values: actors, malware, families, techniques, threat-objectives. Defaults to threat-objectives."
      default: null
    messageStatus:
      type: str | None
      description: "Message status filter. Valid values: volume, delivered, clicks. Defaults to volume."
      default: null
    count:
      type: str | None
      description: "Number of results to return. Valid values: top5, top10. Defaults to top5."
      default: null
    base_url:
      type: str | None
      description: "Proofpoint Threat Protection API base URL. Defaults to https://threatprotection-api.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_threat_protection.base_url || "https://threatprotection-api.proofpoint.com" }}/api/v1/dash/reports/executive-summary/threat-landscape-effectiveness
        method: GET
        params:
          start: ${{ inputs.start }}
          end: ${{ inputs.end }}
          breakDownBy: ${{ inputs.breakDownBy }}
          messageStatus: ${{ inputs.messageStatus }}
          count: ${{ inputs.count }}
        headers:
          Authorization: Bearer ${{ SECRETS.proofpoint_threat_protection_oauth.PROOFPOINT_THREAT_PROTECTION_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
