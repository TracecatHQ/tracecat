type: action
definition:
  title: "Get executive summary industry comparison"
  description: "Get industry comparison metrics to compare your company's data (quarterly) with up to 3 industries. Calls GET /api/v1/dash/reports/executive-summary/industry-comparison."
  display_group: Proofpoint Threat Protection
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  namespace: tools.proofpoint_threat_protection
  name: get_executive_summary_industry_comparison
  secrets:
    - type: oauth
      provider_id: proofpoint_threat_protection
      grant_type: client_credentials
  expects:
    startMonth:
      type: str
      description: "Starting month for the comparison period in ISO 8601 format (e.g., 2026-01)."
    industries:
      type: list[str] | None
      description: "List of industry verticals to compare against. Maximum 3 verticals allowed. Use key values from list_industries. Defaults to Customer's default."
      default: null
    base_url:
      type: str | None
      description: "Proofpoint Threat Protection API base URL. Defaults to https://threatprotection-api.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_threat_protection.base_url || "https://threatprotection-api.proofpoint.com" }}/api/v1/dash/reports/executive-summary/industry-comparison
        method: GET
        params:
          startMonth: ${{ inputs.startMonth }}
          industries: ${{ inputs.industries }}
        headers:
          Authorization: Bearer ${{ SECRETS.proofpoint_threat_protection_oauth.PROOFPOINT_THREAT_PROTECTION_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
