type: action
definition:
  title: "Get executive summary inbound protection overview"
  description: "Get an overview of inbound protection metrics including messages processed, threats detected, and protection effectiveness. Calls GET /api/v1/dash/reports/executive-summary/inbound-protection-overview."
  display_group: Proofpoint Threat Protection
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  namespace: tools.proofpoint_threat_protection
  name: get_executive_summary_inbound_protection_overview
  secrets:
    - type: oauth
      provider_id: proofpoint_threat_protection
      grant_type: client_credentials
  expects:
    start:
      type: str
      description: "Start time for the reporting period in ISO 8601 UTC format (e.g., 2024-01-01T00:00:00Z)."
    end:
      type: str
      description: "End time for the reporting period in ISO 8601 UTC format (e.g., 2024-01-31T23:59:59Z)."
    base_url:
      type: str | None
      description: "Proofpoint Threat Protection API base URL. Defaults to https://threatprotection-api.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_threat_protection.base_url || "https://threatprotection-api.proofpoint.com" }}/api/v1/dash/reports/executive-summary/inbound-protection-overview
        method: GET
        params:
          start: ${{ inputs.start }}
          end: ${{ inputs.end }}
        headers:
          Authorization: Bearer ${{ SECRETS.proofpoint_threat_protection_oauth.PROOFPOINT_THREAT_PROTECTION_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
