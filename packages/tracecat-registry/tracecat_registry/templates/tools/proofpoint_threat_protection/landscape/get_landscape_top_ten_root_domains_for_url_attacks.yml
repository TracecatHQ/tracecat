type: action
definition:
  title: "Get threat landscape top 10 root domains for URL attacks"
  description: "Get top 10 root domains used in URL-based attacks. Calls GET /api/v1/dash/reports/landscape-reports/top-ten-root-domains-for-url-attacks."
  display_group: Proofpoint Threat Protection
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  namespace: tools.proofpoint_threat_protection
  name: get_landscape_top_ten_root_domains_for_url_attacks
  secrets:
    - type: oauth
      provider_id: proofpoint_threat_protection
      grant_type: client_credentials
  expects:
    start:
      type: str
      description: "Start time in ISO 8601 UTC format."
    end:
      type: str
      description: "End time in ISO 8601 UTC format."
    queryType:
      type: str | None
      description: "Query type. Valid values: by-volume, by-delivered, by-clicks. Defaults to by-volume."
      default: null
    base_url:
      type: str | None
      description: "Proofpoint Threat Protection API base URL. Defaults to https://threatprotection-api.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_threat_protection.base_url || "https://threatprotection-api.proofpoint.com" }}/api/v1/dash/reports/landscape-reports/top-ten-root-domains-for-url-attacks
        method: GET
        params:
          start: ${{ inputs.start }}
          end: ${{ inputs.end }}
          queryType: ${{ inputs.queryType }}
        headers:
          Authorization: Bearer ${{ SECRETS.proofpoint_threat_protection_oauth.PROOFPOINT_THREAT_PROTECTION_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
