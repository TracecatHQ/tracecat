type: action
definition:
  title: "Get effectiveness threat response quarantines"
  description: "Get metrics about messages quarantined by Threat Response actions. Calls GET /api/v1/dash/reports/effectiveness-reports/threat-response-quarantines."
  display_group: Proofpoint Threat Protection
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  namespace: tools.proofpoint_threat_protection
  name: get_effectiveness_threat_response_quarantines
  secrets:
    - type: oauth
      provider_id: proofpoint_threat_protection
      grant_type: client_credentials
  expects:
    start:
      type: str
      description: "Start time for the reporting period in ISO 8601 UTC format."
    end:
      type: str
      description: "End time for the reporting period in ISO 8601 UTC format."
    groupBy:
      type: str | None
      description: "Time grouping for results. Valid values: DAY, WEEK, MONTH. Defaults to WEEK."
      default: null
    base_url:
      type: str | None
      description: "Proofpoint Threat Protection API base URL. Defaults to https://threatprotection-api.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_threat_protection.base_url || "https://threatprotection-api.proofpoint.com" }}/api/v1/dash/reports/effectiveness-reports/threat-response-quarantines
        method: GET
        params:
          start: ${{ inputs.start }}
          end: ${{ inputs.end }}
          groupBy: ${{ inputs.groupBy }}
        headers:
          Authorization: Bearer ${{ SECRETS.proofpoint_threat_protection_oauth.PROOFPOINT_THREAT_PROTECTION_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
