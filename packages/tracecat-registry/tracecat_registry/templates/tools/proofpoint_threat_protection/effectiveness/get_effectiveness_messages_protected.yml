type: action
definition:
  title: "Get effectiveness messages protected"
  description: "Get metrics about messages protected with optional breakdown by threat type or other dimensions. Calls GET /api/v1/dash/reports/effectiveness-reports/messages-protected."
  display_group: Proofpoint Threat Protection
  doc_url: https://help.proofpoint.com/Threat_Insight_Dashboard/API_Documentation/Reports_API
  namespace: tools.proofpoint_threat_protection
  name: get_effectiveness_messages_protected
  secrets:
    - type: oauth
      provider_id: proofpoint_threat_protection
      grant_type: client_credentials
  expects:
    start:
      type: str
      description: "Start time for the reporting period in ISO 8601 UTC format."
    end:
      type: str
      description: "End time for the reporting period in ISO 8601 UTC format."
    breakdown:
      type: str | None
      description: "Breakdown dimension for the data. Valid values: by-threat-type, by-threat-category. Defaults to by-threat-type."
      default: null
    base_url:
      type: str | None
      description: "Proofpoint Threat Protection API base URL. Defaults to https://threatprotection-api.proofpoint.com."
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.proofpoint_threat_protection.base_url || "https://threatprotection-api.proofpoint.com" }}/api/v1/dash/reports/effectiveness-reports/messages-protected
        method: GET
        params:
          start: ${{ inputs.start }}
          end: ${{ inputs.end }}
          breakdown: ${{ inputs.breakdown }}
        headers:
          Authorization: Bearer ${{ SECRETS.proofpoint_threat_protection_oauth.PROOFPOINT_THREAT_PROTECTION_SERVICE_TOKEN }}
  returns: ${{ steps.request.result }}
