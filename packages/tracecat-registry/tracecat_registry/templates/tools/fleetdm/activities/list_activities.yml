type: action
definition:
  title: List activities
  description: List the global audit log of actions performed in Fleet.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#list-activities
  namespace: tools.fleetdm
  name: list_activities
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str
      description: Fleet server base URL (e.g. https://fleet.example.com).
    query:
      type: str | None
      description: Search string matched against actor name and email.
      default: null
    order_key:
      type: str | None
      description: Field to order by (e.g. created_at).
      default: null
    order_direction:
      type: str | None
      description: Sort direction (asc or desc).
      default: null
    page:
      type: int
      description: Page number to retrieve (0-indexed).
      default: 0
    per_page:
      type: int
      description: Results per page. Maximum is 10,000 records.
      default: 50
    after:
      type: str | None
      description: The value to get results after. This needs `order_key` defined, as that's the column
        that would be used.
      default: null
    end_created_at:
      type: str | None
      description: Filters to include only activities that happened before this date. If not specified,
        set to now.
      default: null
    activity_type:
      type: str | None
      description: Indicates the activity type to filter by. See the available types in Fleet's audit logs documentation.
      default: null
    start_created_at:
      type: str | None
      description: Filters to include only activities that happened after this date. If not specified, set to the earliest possible date.
      default: null
  steps:
    - ref: list_activities
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/api/v1/fleet/activities
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          query: ${{ inputs.query }}
          order_key: ${{ inputs.order_key }}
          order_direction: ${{ inputs.order_direction }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          after: ${{ inputs.after }}
          end_created_at: ${{ inputs.end_created_at }}
          activity_type: ${{ inputs.activity_type }}
          start_created_at: ${{ inputs.start_created_at }}
  returns: ${{ steps.list_activities.result.data }}
