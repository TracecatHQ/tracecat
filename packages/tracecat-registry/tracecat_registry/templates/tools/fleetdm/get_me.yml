type: action
definition:
  title: Get current user
  description: Get the authenticated Fleet user and its roles and accessible fleets.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#me
  namespace: tools.fleetdm
  name: get_me
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Fleet server base URL. Uses VARS.fleetdm.base_url when omitted.
      default: null
    include_ui_settings:
      type: bool | None
      description: 'If set to true, includes the columns the user hides on the **Hosts** page (default: `false`).'
      default: null
  steps:
    - ref: get_me
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fleetdm.base_url }}/api/v1/fleet/me
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          include_ui_settings: ${{ inputs.include_ui_settings }}
  returns: ${{ steps.get_me.result }}
