type: action
definition:
  title: Get software version
  description: Get a software version with its vulnerabilities and host counts.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#get-software-version
  namespace: tools.fleetdm
  name: get_software_version
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Fleet server base URL. Uses VARS.fleetdm.base_url when omitted.
      default: null
    id:
      type: int
      description: The software version's ID.
    fleet_id:
      type: int | None
      description: _Available in Fleet Premium_. Filters response data to the specified fleet. Use `0` to filter by "Unassigned" hosts.
      default: null
  steps:
    - ref: get_software_version
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fleetdm.base_url }}/api/v1/fleet/software/versions/${{ inputs.id }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          fleet_id: ${{ inputs.fleet_id }}
  returns: ${{ steps.get_software_version.result }}
