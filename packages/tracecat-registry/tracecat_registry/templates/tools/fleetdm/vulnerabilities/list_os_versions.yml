type: action
definition:
  title: List OS versions
  description: List operating system versions across hosts with detected vulnerabilities.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#list-operating-systems
  namespace: tools.fleetdm
  name: list_os_versions
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str
      description: Fleet server base URL (e.g. https://fleet.example.com).
    fleet_id:
      type: int | None
      description: Scope results to a fleet (team) ID.
      default: null
    platform:
      type: str | None
      description: Platform filter (darwin, windows, linux, chrome).
      default: null
    page:
      type: int
      description: Page number to retrieve (0-indexed).
      default: 0
    per_page:
      type: int
      description: OS versions per page.
      default: 50
    os_name:
      type: str | None
      description: The name of the operating system to filter hosts by. `os_version` must also be specified
        with `os_name`
      default: null
    os_version:
      type: str | None
      description: The version of the operating system to filter hosts by. `os_name` must also be specified
        with `os_version`
      default: null
    max_vulnerabilities:
      type: int | None
      description: Limits the number of `vulnerabilities` returned per OS version. (If omitted, returns
        all vulnerabilities.)
      default: null
    order_key:
      type: str | None
      description: 'What to order results by. Allowed fields are: `hosts_count`. Default is `hosts_count`
        (descending).'
      default: null
    order_direction:
      type: str | None
      description: '**Requires `order_key`**. The direction of the order given the order key. Options
        include `"asc"` and `"desc"`. Default is `"asc"`.'
      default: null
  steps:
    - ref: os_versions
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/api/v1/fleet/os_versions
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          fleet_id: ${{ inputs.fleet_id }}
          platform: ${{ inputs.platform }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          os_name: ${{ inputs.os_name }}
          os_version: ${{ inputs.os_version }}
          max_vulnerabilities: ${{ inputs.max_vulnerabilities }}
          order_key: ${{ inputs.order_key }}
          order_direction: ${{ inputs.order_direction }}
  returns: ${{ steps.os_versions.result.data }}
