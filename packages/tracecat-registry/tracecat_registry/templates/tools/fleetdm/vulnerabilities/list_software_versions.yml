type: action
definition:
  title: List software versions
  description: List software versions across the fleet with their associated CVEs.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#list-software-versions
  namespace: tools.fleetdm
  name: list_software_versions
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str
      description: Fleet server base URL (e.g. https://fleet.example.com).
    query:
      type: str | None
      description: Search string matched against software name and CVE.
      default: null
    vulnerable:
      type: bool | None
      description: Only include versions with known vulnerabilities.
      default: null
    min_cvss_score:
      type: float | None
      description: Only include versions with a vulnerability at or above this CVSS score.
      default: null
    max_cvss_score:
      type: float | None
      description: Only include versions with a vulnerability at or below this CVSS score.
      default: null
    exploit:
      type: bool | None
      description: Only include versions with a CISA known-exploited vulnerability.
      default: null
    fleet_id:
      type: int | None
      description: Scope results to a fleet (team) ID.
      default: null
    page:
      type: int
      description: Page number to retrieve (0-indexed).
      default: 0
    per_page:
      type: int
      description: Software versions per page.
      default: 50
    order_key:
      type: str | None
      description: What to order results by. Allowed fields are `name`, `hosts_count`, `cve_published`,
        `cvss_score`, `epss_probability` and `cisa_known_exploit`. Default is `hosts_count` (descending).
      default: null
    order_direction:
      type: str | None
      description: '**Requires `order_key`**. The direction of the order given the order key. Options
        include `"asc"` and `"desc"`. Default is `"asc"`.'
      default: null
    without_vulnerability_details:
      type: bool | None
      description: _Available in Fleet Premium_. If `true` only vulnerability name is included in response.
        If `false` (or omitted), adds vulnerability description, CVSS score, and other details available
        in Fleet Premium. See note above on performance.
      default: null
    after:
      type: str | None
      description: The value to get results after. This needs `order_key` defined, as that's the column
        that would be used.
      default: null
    source:
      type: str | None
      description: Filter by the osquery software source (for example, apps, npm_packages, chrome_extensions,
        ai_clis, mcp_servers, or ai_skills). Requires server support for software type filters; unavailable
        in Fleet 4.93.0. Older servers can ignore this filter.
      default: null
    extension_for:
      type: str | None
      description: Filter extensions by their browser or IDE. Requires source and server support for
        software type filters; unavailable in Fleet 4.93.0. Older servers can ignore this filter.
      default: null
    ai_tool:
      type: bool | None
      description: If true, only include AI tools. Requires Fleet Premium and server support for AI tools
        inventory; unavailable in Fleet 4.93.0. Older servers can ignore this filter.
      default: null
  steps:
    - ref: software_versions
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/api/v1/fleet/software/versions
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          query: ${{ inputs.query }}
          vulnerable: ${{ inputs.vulnerable }}
          min_cvss_score: ${{ inputs.min_cvss_score }}
          max_cvss_score: ${{ inputs.max_cvss_score }}
          exploit: ${{ inputs.exploit }}
          fleet_id: ${{ inputs.fleet_id }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          order_key: ${{ inputs.order_key }}
          order_direction: ${{ inputs.order_direction }}
          without_vulnerability_details: ${{ inputs.without_vulnerability_details }}
          after: ${{ inputs.after }}
          source: ${{ inputs.source }}
          extension_for: ${{ inputs.extension_for }}
          ai_tool: ${{ inputs.ai_tool }}
  returns: ${{ steps.software_versions.result.data }}
