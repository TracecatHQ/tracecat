type: action
definition:
  title: Get fleet policy
  description: Get a fleet-level policy with its passing and failing host counts.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#get-fleet-level-policy
  namespace: tools.fleetdm
  name: get_fleet_policy
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Fleet server base URL. Uses VARS.fleetdm.base_url when omitted.
      default: null
    fleet_id:
      type: int
      description: Defines what fleet ID to operate on
    policy_id:
      type: int
      description: The policy's ID.
  steps:
    - ref: get_fleet_policy
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fleetdm.base_url }}/api/v1/fleet/fleets/${{ inputs.fleet_id }}/policies/${{ inputs.policy_id }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
  returns: ${{ steps.get_fleet_policy.result }}
