type: action
definition:
  title: List policy hosts
  description: List the hosts that pass or fail a given policy.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#list-hosts
  namespace: tools.fleetdm
  name: list_policy_hosts
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str
      description: Fleet server base URL (e.g. https://fleet.example.com).
    policy_id:
      type: int
      description: Numeric Fleet policy ID.
    policy_response:
      type: str
      description: Compliance filter (passing or failing).
      default: failing
    fleet_id:
      type: int | None
      description: Scope results to a fleet (team) ID.
      default: null
    page:
      type: int
      description: Page number to retrieve (0-indexed).
      default: 0
    per_page:
      type: int
      description: Hosts per page.
      default: 50
    order_key:
      type: str | None
      description: What to order results by. Can be any column in the hosts table.
      default: null
    order_direction:
      type: str | None
      description: '**Requires `order_key`**. The direction of the order given the order key. Options
        include `"asc"` and `"desc"`. Default is `"asc"`.'
      default: null
    status:
      type: str | None
      description: Indicates the status of the hosts to return. Can either be 'new', 'online', 'offline',
        'mia', 'missing' or 'enrolled'. 'enrolled' returns every host except those pending MDM enrollment.
      default: null
    query:
      type: str | None
      description: Search query keywords. Searchable fields include `hostname`, `hardware_serial`, `uuid`,
        `ipv4`, and end user email addresses.
      default: null
    os_name:
      type: str | None
      description: The name of the operating system to filter hosts by. `os_version` must also be specified
        with `os_name`. See note below for filtering Windows hosts.
      default: null
    os_version:
      type: str | None
      description: The version of the operating system to filter hosts by. `os_name` must also be specified
        with `os_version`. See note below for filtering Windows hosts.
      default: null
    vulnerability:
      type: str | None
      description: The cve to filter hosts by (including "cve-" prefix, case-insensitive).
      default: null
    low_disk_space:
      type: int | None
      description: _Available in Fleet Premium_. Filters the hosts to only include hosts with less GB
        of disk space available than this value. Must be a number between 1-100.
      default: null
    populate_policies:
      type: bool | None
      description: If `true`, the response will include policy data for each host, including Fleet-maintained
        policies.
      default: null
    populate_users:
      type: bool | None
      description: If `true`, the response will include user data for each host.
      default: null
    populate_labels:
      type: bool | None
      description: If `true`, the response will include labels for each host.
      default: null
  steps:
    - ref: policy_hosts
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/api/v1/fleet/hosts
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          policy_id: ${{ inputs.policy_id }}
          policy_response: ${{ inputs.policy_response }}
          fleet_id: ${{ inputs.fleet_id }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          order_key: ${{ inputs.order_key }}
          order_direction: ${{ inputs.order_direction }}
          status: ${{ inputs.status }}
          query: ${{ inputs.query }}
          os_name: ${{ inputs.os_name }}
          os_version: ${{ inputs.os_version }}
          vulnerability: ${{ inputs.vulnerability }}
          low_disk_space: ${{ inputs.low_disk_space }}
          populate_policies: ${{ inputs.populate_policies }}
          populate_users: ${{ inputs.populate_users }}
          populate_labels: ${{ inputs.populate_labels }}
  returns: ${{ steps.policy_hosts.result.data }}
