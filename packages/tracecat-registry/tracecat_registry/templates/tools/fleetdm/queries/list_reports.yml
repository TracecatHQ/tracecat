type: action
definition:
  title: List reports
  description: List the saved reports (saved queries) defined in Fleet.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#list-reports
  namespace: tools.fleetdm
  name: list_reports
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str
      description: Fleet server base URL (e.g. https://fleet.example.com).
    fleet_id:
      type: int | None
      description: Scope reports to a fleet (team) ID.
      default: null
    query:
      type: str | None
      description: Search string matched against report name.
      default: null
    platform:
      type: str | None
      description: Platform filter (macos, windows, linux, chrome).
      default: null
    page:
      type: int
      description: Page number to retrieve (0-indexed).
      default: 0
    per_page:
      type: int
      description: Reports per page.
      default: 50
    order_key:
      type: str | None
      description: What to order results by. Can be any column in the reports table.
      default: null
    order_direction:
      type: str | None
      description: '**Requires `order_key`**. The direction of the order given the order key. Options
        include `"asc"` and `"desc"`. Default is `"asc"`.'
      default: null
    merge_inherited:
      type: bool | None
      description: _Available in Fleet Premium_. If `true`, will include global reports in addition to
        fleet-level reports when filtering by `fleet_id`. (If no `fleet_id` is provided, this parameter
        is ignored.)
      default: null
    after:
      type: str | None
      description: The value to get results after. This needs `order_key` defined, as that's the column
        that would be used.
      default: null
  steps:
    - ref: list_reports
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/api/v1/fleet/reports
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          fleet_id: ${{ inputs.fleet_id }}
          query: ${{ inputs.query }}
          platform: ${{ inputs.platform }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          order_key: ${{ inputs.order_key }}
          order_direction: ${{ inputs.order_direction }}
          merge_inherited: ${{ inputs.merge_inherited }}
          after: ${{ inputs.after }}
  returns: ${{ steps.list_reports.result.data }}
