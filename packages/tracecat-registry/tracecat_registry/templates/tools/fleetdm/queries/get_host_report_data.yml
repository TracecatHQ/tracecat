type: action
definition:
  title: Get host report data
  description: Get a specific report's saved data for a single host.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#get-hosts-report-data
  namespace: tools.fleetdm
  name: get_host_report_data
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Fleet server base URL. Uses VARS.fleetdm.base_url when omitted.
      default: null
    id:
      type: int
      description: The ID of the desired host.
    report_id:
      type: int
      description: The ID of the desired report.
  steps:
    - ref: get_host_report_data
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fleetdm.base_url }}/api/v1/fleet/hosts/${{ inputs.id }}/reports/${{ inputs.report_id }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
  returns: ${{ steps.get_host_report_data.result }}
