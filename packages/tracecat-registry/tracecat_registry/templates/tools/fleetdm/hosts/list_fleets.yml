type: action
definition:
  title: List fleets
  description: List fleets (teams) used to scope hosts, policies, and queries.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#list-fleets
  namespace: tools.fleetdm
  name: list_fleets
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str
      description: Fleet server base URL (e.g. https://fleet.example.com).
    query:
      type: str | None
      description: Search string matched against fleet name.
      default: null
    page:
      type: int
      description: Page number to retrieve (0-indexed).
      default: 0
    per_page:
      type: int
      description: Fleets per page.
      default: 50
    order_key:
      type: str | None
      description: What to order results by. Can be any column in the `fleets` table.
      default: null
    order_direction:
      type: str | None
      description: '**Requires `order_key`**. The direction of the order given the order key. Options
        include `"asc"` and `"desc"`. Default is `"asc"`.'
      default: null
    after:
      type: str | None
      description: The value to get results after. This needs `order_key` defined, as that's the column
        that would be used.
      default: null
  steps:
    - ref: list_fleets
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/api/v1/fleet/fleets
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          query: ${{ inputs.query }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          order_key: ${{ inputs.order_key }}
          order_direction: ${{ inputs.order_direction }}
          after: ${{ inputs.after }}
  returns: ${{ steps.list_fleets.result.data }}
