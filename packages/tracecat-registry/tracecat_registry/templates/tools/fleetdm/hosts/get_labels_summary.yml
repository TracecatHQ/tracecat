type: action
definition:
  title: Get labels summary
  description: Get basic information for global and accessible fleet labels.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#get-labels-summary
  namespace: tools.fleetdm
  name: get_labels_summary
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Fleet server base URL. Uses VARS.fleetdm.base_url when omitted.
      default: null
    fleet_id:
      type: str | None
      description: _Available in Fleet Premium._  Filters to labels belonging to the specified fleet, plus global labels. Specify `"global"` to show only globally-available labels. If omitted, Fleet returns all global labels, plus all labels for fleets to which the requestor has access.
      default: null
  steps:
    - ref: get_labels_summary
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fleetdm.base_url }}/api/v1/fleet/labels/summary
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          fleet_id: ${{ inputs.fleet_id }}
  returns: ${{ steps.get_labels_summary.result }}
