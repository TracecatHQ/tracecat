type: action
definition:
  title: List hosts
  description: List and search hosts enrolled in Fleet with server-side filters.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#list-hosts
  namespace: tools.fleetdm
  name: list_hosts
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str
      description: Fleet server base URL (e.g. https://fleet.example.com).
    status:
      type: str | None
      description: Host status filter (online, offline, new, mia, missing).
      default: null
    query:
      type: str | None
      description: Search string matched against hostname, IP, serial, and UUID.
      default: null
    fleet_id:
      type: int | None
      description: Scope results to a fleet (team) ID.
      default: null
    policy_id:
      type: int | None
      description: Filter by hosts evaluated against this policy ID (pair with policy_response).
      default: null
    policy_response:
      type: str | None
      description: Policy compliance filter for policy_id (passing or failing).
      default: null
    software_version_id:
      type: int | None
      description: Only include hosts that have this software version installed.
      default: null
    vulnerability:
      type: str | None
      description: Only include hosts affected by this CVE (e.g. CVE-2024-1234).
      default: null
    mdm_enrollment_status:
      type: str | None
      description: MDM enrollment filter (manual, automatic, enrolled, pending, unenrolled).
      default: null
    os_settings_disk_encryption:
      type: str | None
      description: Disk encryption status filter (verified, verifying, action_required, enforcing, failed, removing_enforcement).
      default: null
    os_name:
      type: str | None
      description: Operating system name filter (must be paired with os_version).
      default: null
    os_version:
      type: str | None
      description: Operating system version filter (must be paired with os_name).
      default: null
    low_disk_space:
      type: int | None
      description: Only include hosts with less than this many GB of disk space.
      default: null
    populate_software:
      type: bool | None
      description: Include each host's installed software in the response.
      default: null
    populate_policies:
      type: bool | None
      description: Include each host's policy compliance in the response.
      default: null
    order_key:
      type: str | None
      description: Column to sort hosts by.
      default: null
    order_direction:
      type: str | None
      description: Sort direction (asc or desc); requires order_key.
      default: null
    page:
      type: int
      description: Page number to retrieve (0-indexed).
      default: 0
    per_page:
      type: int
      description: Hosts per page.
      default: 50
    after:
      type: str | None
      description: The value to get results after. This needs `order_key` defined, as that's the column
        that would be used. **Note:** Use `page` instead of `after`
      default: null
    additional_info_filters:
      type: str | None
      description: A comma-delimited list of fields to include in each host's `additional` object. This
        query is populated by the `additional_queries` in the `features` section of the configuration
        YAML.
      default: null
    software_title_id:
      type: int | None
      description: The ID of the software title to filter hosts by.
      default: null
    software_status:
      type: str | None
      description: 'The status of the software install to filter hosts by. One of: `pending_install`,
        `failed_install`, `installed`, `pending_uninstall`, `failed_uninstall`, `pending`, or `failed`.
        Mutually exclusive with `software_version_id`, and must be supplied if `software_title_id` is
        set.'
      default: null
    os_version_id:
      type: int | None
      description: The ID of the operating system version to filter hosts by.
      default: null
    device_mapping:
      type: bool | None
      description: Indicates whether `device_mapping` should be included for each host.
      default: null
    mdm_id:
      type: int | None
      description: The ID of the _mobile device management_ (MDM) solution to filter hosts by (that is,
        filter hosts that use a specific MDM provider and URL).
      default: null
    mdm_name:
      type: str | None
      description: The name of the _mobile device management_ (MDM) solution to filter hosts by (that
        is, filter hosts that use a specific MDM provider).
      default: null
    connected_to_fleet:
      type: bool | None
      description: Filter hosts that are talking to this Fleet server for MDM features. In rare cases,
        hosts can be enrolled to one Fleet server but talk to a different Fleet server for MDM features.
        In this case, the value would be `false`. Always `false` for Linux hosts.
      default: null
    munki_issue_id:
      type: int | None
      description: The ID of the _munki issue_ (a Munki-reported error or warning message) to filter
        hosts by (that is, filter hosts that are affected by that corresponding error or warning message).
      default: null
    disable_failing_policies:
      type: bool | None
      description: If `true`, hosts will return failing policies as 0 regardless of whether there are
        any that failed for the host. This is meant to be used when increased performance is needed in
        exchange for the extra information.
      default: null
    bootstrap_package:
      type: str | None
      description: _Available in Fleet Premium_. Filters the hosts by the status of the MDM bootstrap
        package on the host. Valid options are 'installed', 'pending', or 'failed'.
      default: null
    os_settings:
      type: str | None
      description: 'Filters the hosts by the status of the operating system settings applied to the hosts.
        Valid options are ''verified'', ''verifying'', ''pending'', or ''failed''. **Note: If this filter
        is used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.**'
      default: null
    populate_users:
      type: bool | None
      description: If `true`, the response will include user data for each host.
      default: null
    populate_end_users:
      type: bool | None
      description: If `true`, the response will include end user data for each host, including identity
        provider (IdP) details and other emails.
      default: null
    populate_labels:
      type: bool | None
      description: If `true`, the response will include labels for each host.
      default: null
    include_device_status:
      type: bool | None
      description: If `true`, the response will include lock and wipe status (`mdm.device_status`) and
        `mdm.pending_action` information for each host.
      default: null
    profile_uuid:
      type: str | None
      description: '**Requires `profile_status`**. The UUID of the profile to download.'
      default: null
    profile_status:
      type: str | None
      description: '**Requires `profile_uuid`**. Valid options are ''verified'', ''verifying'', ''pending'',
        or ''failed''.'
      default: null
    dep_profile_error:
      type: bool | None
      description: 'If `true`, the response will only include Apple MDM hosts with DEP profile assignment
        errors(`mdm.dep_profile_error: true`).'
      default: null
    dep_assign_profile_response:
      type: str | None
      description: Filters the hosts by DEP profile assignment status. Valid options are 'SUCCESS', 'FAILED',
        'THROTTLED' or 'NOT_ACCESSIBLE'. Only Apple hosts which are, or were assigned to Fleet in ABM
        will be returned.
      default: null
  steps:
    - ref: list_hosts
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/api/v1/fleet/hosts
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          status: ${{ inputs.status }}
          query: ${{ inputs.query }}
          fleet_id: ${{ inputs.fleet_id }}
          policy_id: ${{ inputs.policy_id }}
          policy_response: ${{ inputs.policy_response }}
          software_version_id: ${{ inputs.software_version_id }}
          vulnerability: ${{ inputs.vulnerability }}
          mdm_enrollment_status: ${{ inputs.mdm_enrollment_status }}
          os_settings_disk_encryption: ${{ inputs.os_settings_disk_encryption }}
          os_name: ${{ inputs.os_name }}
          os_version: ${{ inputs.os_version }}
          low_disk_space: ${{ inputs.low_disk_space }}
          populate_software: ${{ inputs.populate_software }}
          populate_policies: ${{ inputs.populate_policies }}
          order_key: ${{ inputs.order_key }}
          order_direction: ${{ inputs.order_direction }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          after: ${{ inputs.after }}
          additional_info_filters: ${{ inputs.additional_info_filters }}
          software_title_id: ${{ inputs.software_title_id }}
          software_status: ${{ inputs.software_status }}
          os_version_id: ${{ inputs.os_version_id }}
          device_mapping: ${{ inputs.device_mapping }}
          mdm_id: ${{ inputs.mdm_id }}
          mdm_name: ${{ inputs.mdm_name }}
          connected_to_fleet: ${{ inputs.connected_to_fleet }}
          munki_issue_id: ${{ inputs.munki_issue_id }}
          disable_failing_policies: ${{ inputs.disable_failing_policies }}
          bootstrap_package: ${{ inputs.bootstrap_package }}
          os_settings: ${{ inputs.os_settings }}
          populate_users: ${{ inputs.populate_users }}
          populate_end_users: ${{ inputs.populate_end_users }}
          populate_labels: ${{ inputs.populate_labels }}
          include_device_status: ${{ inputs.include_device_status }}
          profile_uuid: ${{ inputs.profile_uuid }}
          profile_status: ${{ inputs.profile_status }}
          dep_profile_error: ${{ inputs.dep_profile_error }}
          dep_assign_profile_response: ${{ inputs.dep_assign_profile_response }}
  returns: ${{ steps.list_hosts.result.data }}
