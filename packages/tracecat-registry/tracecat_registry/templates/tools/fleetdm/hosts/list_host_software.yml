type: action
definition:
  title: List host software
  description: List the software installed on a host along with detected vulnerabilities.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#get-hosts-software
  namespace: tools.fleetdm
  name: list_host_software
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str
      description: Fleet server base URL (e.g. https://fleet.example.com).
    host_id:
      type: int
      description: Numeric Fleet host ID.
    query:
      type: str | None
      description: Search string matched against software name.
      default: null
    vulnerable:
      type: bool | None
      description: Only include software with known vulnerabilities.
      default: null
    min_cvss_score:
      type: float | None
      description: Only include software with a vulnerability at or above this CVSS score.
      default: null
    max_cvss_score:
      type: float | None
      description: Only include software with a vulnerability at or below this CVSS score.
      default: null
    exploit:
      type: bool | None
      description: Only include software with a CISA known-exploited vulnerability.
      default: null
    page:
      type: int
      description: Page number to retrieve (0-indexed).
      default: 0
    per_page:
      type: int
      description: Software entries per page.
      default: 50
    available_for_install:
      type: bool | None
      description: If `true` or `1`, only list software that is available for install (added by the user).
        Default is `false`.
      default: null
    self_service:
      type: bool | None
      description: If `true` or `1`, only lists self-service software. Default is `false`.
      default: null
    order_key:
      type: str | None
      description: What to order results by. Options include `"name"`. Default is `"name"`.
      default: null
    order_direction:
      type: str | None
      description: '**Requires `order_key`**. The direction of the order given the order key. Options
        include `"asc"` and `"desc"`. Default is `"asc"`.'
      default: null
    macos_applications:
      type: bool | None
      description: If `true`, filters to only include software at the top level of the `/Applications`
        folder. This parameter applies only to macOS hosts, and is ignored for hosts on other platforms.
        Default is `false`.
      default: null
    source:
      type: str | None
      description: Filter by the osquery software source (for example, apps, npm_packages, chrome_extensions,
        ai_clis, mcp_servers, or ai_skills). Requires server support for software type filters; unavailable
        in Fleet 4.93.0. Older servers can ignore this filter.
      default: null
    extension_for:
      type: str | None
      description: Filter extensions by their browser or IDE. Requires source and server support for
        software type filters; unavailable in Fleet 4.93.0. Older servers can ignore this filter.
      default: null
    ai_tool:
      type: bool | None
      description: If true, only include AI tools. Requires Fleet Premium and server support for AI tools
        inventory; unavailable in Fleet 4.93.0. Older servers can ignore this filter.
      default: null
  steps:
    - ref: host_software
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/api/v1/fleet/hosts/${{ inputs.host_id }}/software
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          query: ${{ inputs.query }}
          vulnerable: ${{ inputs.vulnerable }}
          min_cvss_score: ${{ inputs.min_cvss_score }}
          max_cvss_score: ${{ inputs.max_cvss_score }}
          exploit: ${{ inputs.exploit }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          available_for_install: ${{ inputs.available_for_install }}
          self_service: ${{ inputs.self_service }}
          order_key: ${{ inputs.order_key }}
          order_direction: ${{ inputs.order_direction }}
          macos_applications: ${{ inputs.macos_applications }}
          source: ${{ inputs.source }}
          extension_for: ${{ inputs.extension_for }}
          ai_tool: ${{ inputs.ai_tool }}
  returns: ${{ steps.host_software.result.data }}
