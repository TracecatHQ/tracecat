type: action
definition:
  title: Get label
  description: Get the specified label.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#get-label
  namespace: tools.fleetdm
  name: get_label
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str | None
      description: Fleet server base URL. Uses VARS.fleetdm.base_url when omitted.
      default: null
    id:
      type: int
      description: The label's id.
  steps:
    - ref: get_label
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.fleetdm.base_url }}/api/v1/fleet/labels/${{ inputs.id }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
  returns: ${{ steps.get_label.result }}
