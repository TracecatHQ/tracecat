type: action
definition:
  title: List labels
  description: List all labels defined in Fleet, including built-in platform labels.
  display_group: Fleet
  doc_url: https://fleetdm.com/docs/rest-api/rest-api#list-labels
  namespace: tools.fleetdm
  name: list_labels
  secrets:
    - name: fleetdm
      keys: ["FLEETDM_API_TOKEN"]
  expects:
    base_url:
      type: str
      description: Fleet server base URL (e.g. https://fleet.example.com).
    order_key:
      type: str | None
      description: Field to order labels by (e.g. name, created_at).
      default: null
    include_host_counts:
      type: bool | None
      description: Whether or not to calculate host counts for each label. Default is `true`. See "additional
        notes" for more information.
      default: null
    order_direction:
      type: str | None
      description: '**Requires `order_key`**. The direction of the order given the order key. Options
        include `"asc"` and `"desc"`. Default is `"asc"`.'
      default: null
    after:
      type: str | None
      description: The value to get results after. This needs `order_key` defined, as that's the column
        that would be used.
      default: null
    fleet_id:
      type: str | None
      description: _Available in Fleet Premium._  Filters to labels belonging to the specified fleet,
        plus global labels. Specify `"global"` to show only globally-available labels. If omitted, Fleet
        returns all global labels, plus all labels for fleets to which the requestor has access.
      default: null
  steps:
    - ref: list_labels
      action: core.http_request
      args:
        url: ${{ inputs.base_url }}/api/v1/fleet/labels
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.fleetdm.FLEETDM_API_TOKEN }}
        params:
          order_key: ${{ inputs.order_key }}
          include_host_counts: ${{ inputs.include_host_counts }}
          order_direction: ${{ inputs.order_direction }}
          after: ${{ inputs.after }}
          fleet_id: ${{ inputs.fleet_id }}
  returns: ${{ steps.list_labels.result.data }}
