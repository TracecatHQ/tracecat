type: action
definition:
  title: Search breaches
  description: >-
    Search breaches. Calls POST /v2/search directly with a DeHashed API-native payload.
  display_group: DeHashed
  doc_url: https://app.dehashed.com/documentation/api
  namespace: tools.dehashed
  name: search_breaches
  secrets:
    - name: dehashed
      keys: ["DEHASHED_API_KEY"]
  expects:
    query:
      type: str
      description: DeHashed search query. Use DeHashed search syntax, such as email:"user@example.com", username:"someuser", or a bare quoted value to match across fields.
    page:
      type: int
      description: Result page number. Must be 1 or greater.
      default: 1
    size:
      type: int
      description: Results per page. Must be between 1 and 10000.
      default: 100
    regex:
      type: bool
      description: Whether to use regex matching. Cannot be true when wildcard is true.
      default: false
    wildcard:
      type: bool
      description: Whether to use wildcard matching. Cannot be true when regex is true.
      default: false
    de_dupe:
      type: bool
      description: Whether DeHashed should remove duplicate results.
      default: false
    base_url:
      type: str | None
      description: Base URL of the DeHashed API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.dehashed.base_url || "https://api.dehashed.com" }}/v2/search
        method: POST
        headers:
          Accept: application/json
          Content-Type: application/json
          DeHashed-Api-Key: ${{ SECRETS.dehashed.DEHASHED_API_KEY }}
        payload:
          query: ${{ inputs.query }}
          page: ${{ inputs.page }}
          size: ${{ inputs.size }}
          regex: ${{ inputs.regex }}
          wildcard: ${{ inputs.wildcard }}
          de_dupe: ${{ inputs.de_dupe }}
  returns: ${{ steps.request.result }}
