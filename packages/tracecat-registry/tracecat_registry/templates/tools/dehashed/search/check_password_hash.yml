type: action
definition:
  title: Check password hash
  description: >-
    Check a password hash. Calls POST /v2/search-password directly with a SHA-256 password hash.
  display_group: DeHashed
  doc_url: https://app.dehashed.com/documentation/api
  namespace: tools.dehashed
  name: check_password_hash
  secrets:
    - name: dehashed
      keys: ["DEHASHED_API_KEY"]
  expects:
    sha256_hashed_password:
      type: str
      description: SHA-256 hash of the password to check.
    base_url:
      type: str | None
      description: Base URL of the DeHashed API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.dehashed.base_url || "https://api.dehashed.com" }}/v2/search-password
        method: POST
        headers:
          Accept: application/json
          Content-Type: application/json
          DeHashed-Api-Key: ${{ SECRETS.dehashed.DEHASHED_API_KEY }}
        payload:
          sha256_hashed_password: ${{ inputs.sha256_hashed_password }}
  returns: ${{ steps.request.result }}
