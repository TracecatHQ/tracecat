type: action
definition:
  title: List data wells
  description: >-
    List data wells. Calls GET /data-wells directly. This endpoint does not require an API key.
  display_group: DeHashed
  doc_url: https://app.dehashed.com/documentation/api
  namespace: tools.dehashed
  name: list_data_wells
  expects:
    count:
      type: int | None
      description: Number of data wells to return. DeHashed supports 20 or 50.
      default: 20
    page:
      type: int | None
      description: Result page number. Must be 1 or greater.
      default: 1
    sort:
      type: str | None
      description: Sort by added, name, date, or records. Append -ASC or -DESC for direction.
      default: null
    base_url:
      type: str | None
      description: Base URL of the DeHashed API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.dehashed.base_url || "https://api.dehashed.com" }}/data-wells
        method: GET
        headers:
          Accept: application/json
        params:
          count: ${{ inputs.count }}
          page: ${{ inputs.page }}
          sort: ${{ inputs.sort }}
  returns: ${{ steps.request.result }}
