type: action
definition:
  title: Revoke user sign-in sessions
  description: >-
    Invalidate all the refresh tokens issued to applications for a user (and
    session cookies in a user's browser) by resetting the
    signInSessionsValidFromDateTime user property to the current date-time. There
    might be a delay of a few minutes before tokens are revoked. Does not revoke
    sessions for external users. Least privileged permission:
    User.RevokeSessions.All (delegated or application); User.ReadWrite.All and
    Directory.ReadWrite.All also work for delegated access.
  display_group: Microsoft Entra
  doc_url: https://learn.microsoft.com/en-us/graph/api/user-revokesigninsessions?view=graph-rest-1.0
  namespace: tools.microsoft_entra
  name: revoke_user_sign_in_sessions
  secrets:
    - type: oauth
      provider_id: microsoft_entra
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_entra
      grant_type: client_credentials
      optional: true
  expects:
    user_id:
      type: str
      description: The user's ID or userPrincipalName.
    base_url:
      type: str | None
      description: >-
        Microsoft Graph host, without the API version. If omitted, uses the
        workspace variable `microsoft_entra.base_url`, then
        https://graph.microsoft.com. National clouds: https://graph.microsoft.us
        (US Government L4) and https://dod-graph.microsoft.us (US Government L5
        DOD).
      default: null
    api_version:
      type: str
      description: Microsoft Graph API version.
      default: "v1.0"
  steps:
    - ref: revoke_sessions
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.microsoft_entra.base_url || "https://graph.microsoft.com" }}/${{ inputs.api_version }}/users/${{ FN.url_encode(inputs.user_id) }}/revokeSignInSessions
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.microsoft_entra_oauth.MICROSOFT_ENTRA_USER_TOKEN || SECRETS.microsoft_entra_oauth.MICROSOFT_ENTRA_SERVICE_TOKEN }}
  returns: ${{ steps.revoke_sessions.result }}
