type: action
definition:
  title: Get user
  description: Retrieve details for a Microsoft Entra ID user.
  display_group: Microsoft Entra
  doc_url: https://learn.microsoft.com/en-us/graph/api/user-get?view=graph-rest-1.0
  namespace: tools.microsoft_entra
  name: get_user
  secrets:
    - type: oauth
      provider_id: microsoft_entra
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_entra
      grant_type: client_credentials
      optional: true
  expects:
    user_id:
      type: str
      description: The unique identifier of the user to retrieve.
    select:
      type: list[str] | None
      description: Optional set of user properties to return.
      default: null
    expand:
      type: list[str] | None
      description: Optional related entities to expand in the response.
      default: null
    base_url:
      type: str | None
      description: >-
        Microsoft Graph host, without the API version. If omitted, uses the
        workspace variable `microsoft_entra.base_url`, then
        https://graph.microsoft.com. National clouds: https://graph.microsoft.us
        (US Government L4) and https://dod-graph.microsoft.us (US Government L5
        DOD).
      default: null
    api_version:
      type: str
      description: Microsoft Graph API version.
      default: "v1.0"
  steps:
    - ref: get_user
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.microsoft_entra.base_url || "https://graph.microsoft.com" }}/${{ inputs.api_version }}/users/${{ FN.url_encode(inputs.user_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.microsoft_entra_oauth.MICROSOFT_ENTRA_USER_TOKEN || SECRETS.microsoft_entra_oauth.MICROSOFT_ENTRA_SERVICE_TOKEN }}
        params:
          $select: ${{ FN.join(inputs.select, ",") if inputs.select else None }}
          $expand: ${{ FN.join(inputs.expand, ",") if inputs.expand else None }}
  returns: ${{ steps.get_user.result.data }}
