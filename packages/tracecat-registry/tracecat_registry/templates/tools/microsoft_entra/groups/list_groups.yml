type: action
definition:
  title: List groups
  description: List Microsoft Entra ID groups with optional OData queries.
  display_group: Microsoft Entra
  doc_url: https://learn.microsoft.com/en-us/graph/api/group-list?view=graph-rest-1.0
  namespace: tools.microsoft_entra
  name: list_groups
  secrets:
    - type: oauth
      provider_id: microsoft_entra
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_entra
      grant_type: client_credentials
      optional: true
  expects:
    filter:
      type: str | None
      description: Optional OData $filter expression.
      default: null
    search:
      type: str | None
      description: Optional search phrase. Use quoted property names as documented, for example "displayName:Engineering".
      default: null
    orderby:
      type: str | None
      description: Optional OData $orderby expression.
      default: null
    select:
      type: list[str] | None
      description: Optional set of group properties to return.
      default: null
    expand:
      type: list[str] | None
      description: Optional related entities to expand in the response.
      default: null
    top:
      type: int | None
      description: Maximum number of results to return in a single page ($top).
      default: null
    skip_token:
      type: str | None
      description: Opaque continuation token from a previous response ($skiptoken).
      default: null
    consistency_level_eventual:
      type: bool
      description: Set ConsistencyLevel=eventual for advanced queries when required by Microsoft Graph.
      default: false
    max_page_size:
      type: int | None
      description: Optional maximum page size to request via Prefer=odata.maxpagesize.
      default: null
    base_url:
      type: str | None
      description: >-
        Microsoft Graph host, without the API version. If omitted, uses the
        workspace variable `microsoft_entra.base_url`, then
        https://graph.microsoft.com. National clouds: https://graph.microsoft.us
        (US Government L4) and https://dod-graph.microsoft.us (US Government L5
        DOD).
      default: null
    api_version:
      type: str
      description: Microsoft Graph API version.
      default: "v1.0"
  steps:
    - ref: list_groups
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.microsoft_entra.base_url || "https://graph.microsoft.com" }}/${{ inputs.api_version }}/groups
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.microsoft_entra_oauth.MICROSOFT_ENTRA_USER_TOKEN || SECRETS.microsoft_entra_oauth.MICROSOFT_ENTRA_SERVICE_TOKEN }}
          ConsistencyLevel: ${{ "eventual" if inputs.search || inputs.consistency_level_eventual else None }}
          Prefer: ${{ FN.format("odata.maxpagesize={}", inputs.max_page_size) if inputs.max_page_size != None else None }}
        params:
          $filter: ${{ inputs.filter if inputs.filter else None }}
          $search: ${{ inputs.search if inputs.search else None }}
          $orderby: ${{ inputs.orderby if inputs.orderby else None }}
          $select: ${{ FN.join(inputs.select, ",") if inputs.select else None }}
          $expand: ${{ FN.join(inputs.expand, ",") if inputs.expand else None }}
          $top: ${{ inputs.top }}
          $skiptoken: ${{ inputs.skip_token if inputs.skip_token else None }}
  returns: ${{ steps.list_groups.result.data }}
