type: action
definition:
  title: Run hunting query
  description: >-
    Queries a specified set of event, activity, or entity data supported by
    Microsoft 365 Defender to proactively look for specific threats in your
    environment. Least privileged permission: ThreatHunting.Read.All for both
    delegated (work or school account) and application; no higher privileged
    permission is available. Delegated access is not supported for personal
    Microsoft accounts. Available in the global service, US Government L4 and US
    Government L5 (DOD); not available in China operated by 21Vianet.
    Microsoft's endpoint reference does not state a separate licensing requirement.
  display_group: Microsoft Graph Security
  doc_url: https://learn.microsoft.com/en-us/graph/api/security-security-runhuntingquery?view=graph-rest-1.0
  namespace: tools.microsoft_graph_security
  name: run_hunting_query
  secrets:
    - type: oauth
      provider_id: microsoft_graph_security
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph_security
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: authorization_code
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Microsoft Graph v1.0 API root. If omitted, uses the workspace variable
        `microsoft_graph_security.base_url`, then
        `microsoft_graph.base_url`, then https://graph.microsoft.com/v1.0.
        National clouds: https://graph.microsoft.us/v1.0 (US Government L4) and
        https://dod-graph.microsoft.us/v1.0 (US Government L5 DOD).
      default: null
    auth_mode:
      type: enum["application", "delegated", "auto"]
      description: >-
        Credential to use. `application` requires
        MICROSOFT_GRAPH_SECURITY_SERVICE_TOKEN, then MICROSOFT_GRAPH_SERVICE_TOKEN;
        `delegated` requires MICROSOFT_GRAPH_SECURITY_USER_TOKEN, then
        MICROSOFT_GRAPH_USER_TOKEN; `auto` tries all four in that order.
      default: application
    Query:
      type: str
      description: >-
        The hunting query in Kusto Query Language (KQL).
    Timespan:
      type: str | None
      description: >-
        The interval of time over which to query data, in ISO 8601 format. The
        default value is 30 days, meaning if no startTime is specified, the query
        looks back 30 days from now. If a time filter is specified in both the
        query and the startTime parameter, the shorter time span is applied.
      default: null
    workspaceId:
      type: str | None
      description: >-
        The GUID of a specific Log Analytics workspace to target. If omitted, the
        service uses the caller's primary workspace. If the workspace isn't found
        or not accessible, the service falls back to the caller's primary
        workspace.
      default: null
  steps:
    - ref: call_graph
      action: tools.microsoft_graph_security_sdk.call_method
      args:
        path: /security/runHuntingQuery
        method: POST
        base_url: ${{ inputs.base_url || VARS.microsoft_graph_security.base_url || VARS.microsoft_graph.base_url || "https://graph.microsoft.com/v1.0" }}
        auth_mode: ${{ inputs.auth_mode }}
        # Microsoft documents `Timespan` and `workspaceId` as optional and never
        # assigns a meaning to an explicit null, so unset fields are omitted.
        omit_none_payload_fields: true
        payload:
          Query: ${{ inputs.Query }}
          Timespan: ${{ inputs.Timespan }}
          workspaceId: ${{ inputs.workspaceId }}
  returns: ${{ steps.call_graph.result }}
