type: action
definition:
  title: Merge incidents
  description: >-
    Merge multiple incident resources into a single incident. Least privileged
    permission: SecurityData.Manage.All for both delegated (work or school
    account) and application; no higher privileged permission is available.
    Delegated access is not supported for personal Microsoft accounts. Delegated
    callers must hold a supported Microsoft Entra role: Security Operator (least
    privileged for this operation) or Security Administrator. Available in the
    global service, US Government L4 and US Government L5 (DOD); not available in
    China operated by 21Vianet.
    Microsoft's endpoint reference does not state a separate licensing requirement.
  display_group: Microsoft Graph Security
  doc_url: https://learn.microsoft.com/en-us/graph/api/security-incident-mergeincidents?view=graph-rest-1.0
  namespace: tools.microsoft_graph_security
  name: merge_incidents
  secrets:
    - type: oauth
      provider_id: microsoft_graph_security
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph_security
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: authorization_code
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Microsoft Graph v1.0 API root. If omitted, uses the workspace variable
        `microsoft_graph_security.base_url`, then
        `microsoft_graph.base_url`, then https://graph.microsoft.com/v1.0.
        National clouds: https://graph.microsoft.us/v1.0 (US Government L4) and
        https://dod-graph.microsoft.us/v1.0 (US Government L5 DOD).
      default: null
    auth_mode:
      type: enum["application", "delegated", "auto"]
      description: >-
        Credential to use. `application` requires
        MICROSOFT_GRAPH_SECURITY_SERVICE_TOKEN, then MICROSOFT_GRAPH_SERVICE_TOKEN;
        `delegated` requires MICROSOFT_GRAPH_SECURITY_USER_TOKEN, then
        MICROSOFT_GRAPH_USER_TOKEN; `auto` tries all four in that order.
      default: application
    incidentIds:
      type: list[str]
      description: The IDs of the incidents to merge.
    incidentComment:
      type: str | None
      description: A comment to add to the merged incident.
      default: null
    mergeReasons:
      type: str | None
      description: >-
        The correlation reasons for merging the incidents. This object is a flags
        enum that allows multiple values to be specified, for example
        "sameCampaign, sameActor".
      default: null
  steps:
    - ref: call_graph
      action: tools.microsoft_graph_sdk.call_method
      args:
        oauth_provider: microsoft_graph_security
        path: /security/incidents/mergeIncidents
        method: POST
        base_url: ${{ inputs.base_url || VARS.microsoft_graph_security.base_url || VARS.microsoft_graph.base_url || "https://graph.microsoft.com/v1.0" }}
        auth_mode: ${{ inputs.auth_mode }}
        # Microsoft documents `incidentComment` and `mergeReasons` as optional and
        # never assigns a meaning to an explicit null, so unset fields are omitted.
        omit_none_payload_fields: true
        payload:
          incidentIds: ${{ inputs.incidentIds }}
          incidentComment: ${{ inputs.incidentComment }}
          mergeReasons: ${{ inputs.mergeReasons }}
  returns: ${{ steps.call_graph.result }}
