type: action
definition:
  title: List incidents
  description: >-
    Get a list of incident objects that Microsoft 365 Defender created to track
    attacks in an organization. Returns the single Microsoft Graph page,
    including `@odata.nextLink`. Least privileged permission:
    SecurityIncident.Read.All for both delegated (work or school account) and
    application; higher privileged: SecurityIncident.ReadWrite.All. Delegated
    access is not supported for personal Microsoft accounts. Delegated callers
    must hold a supported Microsoft Entra role: Security Reader, Global Reader,
    Security Operator or Security Administrator. Available in the global service,
    US Government L4 and US Government L5 (DOD); not available in China operated
    by 21Vianet.
    Microsoft's endpoint reference does not state a separate licensing requirement.
  display_group: Microsoft Graph Security
  doc_url: https://learn.microsoft.com/en-us/graph/api/security-list-incidents?view=graph-rest-1.0
  namespace: tools.microsoft_graph_security
  name: list_incidents
  secrets:
    - type: oauth
      provider_id: microsoft_graph_security
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph_security
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: authorization_code
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Microsoft Graph v1.0 API root. If omitted, uses the workspace variable
        `microsoft_graph_security.base_url`, then
        `microsoft_graph.base_url`, then https://graph.microsoft.com/v1.0.
        National clouds: https://graph.microsoft.us/v1.0 (US Government L4) and
        https://dod-graph.microsoft.us/v1.0 (US Government L5 DOD).
      default: null
    auth_mode:
      type: enum["application", "delegated", "auto"]
      description: >-
        Credential to use. `application` requires
        MICROSOFT_GRAPH_SECURITY_SERVICE_TOKEN, then MICROSOFT_GRAPH_SERVICE_TOKEN;
        `delegated` requires MICROSOFT_GRAPH_SECURITY_USER_TOKEN, then
        MICROSOFT_GRAPH_USER_TOKEN; `auto` tries all four in that order.
      default: application
    count:
      type: bool | None
      description: OData `$count`. Include a count of the matching resources.
      default: null
    filter:
      type: str | None
      description: >-
        OData `$filter`. The following properties support `$filter`: assignedTo,
        classification, createdDateTime, determination, lastUpdateDateTime,
        severity and status.
      default: null
    skip:
      type: int | None
      description: OData `$skip`. Number of incidents to skip.
      default: null
    top:
      type: int | None
      description: OData `$top`. Number of incidents to return.
      default: null
    expand:
      type: str | None
      description: >-
        OData `$expand`. The `alerts` relationship supports `$expand`.
      default: null
  steps:
    - ref: call_graph
      action: tools.microsoft_graph_security_sdk.call_method
      args:
        path: /security/incidents
        method: GET
        base_url: ${{ inputs.base_url || VARS.microsoft_graph_security.base_url || VARS.microsoft_graph.base_url || "https://graph.microsoft.com/v1.0" }}
        auth_mode: ${{ inputs.auth_mode }}
        params:
          $count: ${{ inputs.count }}
          $filter: ${{ inputs.filter }}
          $skip: ${{ inputs.skip }}
          $top: ${{ inputs.top }}
          $expand: ${{ inputs.expand }}
  returns: ${{ steps.call_graph.result }}
