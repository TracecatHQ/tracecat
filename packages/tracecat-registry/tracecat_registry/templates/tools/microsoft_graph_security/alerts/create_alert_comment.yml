type: action
definition:
  title: Create alert comment
  description: >-
    Create a comment for an existing alert based on the specified alert id
    property. Least privileged permission: SecurityAlert.ReadWrite.All for both
    delegated (work or school account) and application; no higher privileged
    permission is available. Delegated access is not supported for personal
    Microsoft accounts. Delegated callers must hold a supported Microsoft Entra
    role: Security Operator or Security Administrator. Available in the global
    service, US Government L4 and US Government L5 (DOD); not available in China
    operated by 21Vianet.
    Microsoft's endpoint reference does not state a separate licensing requirement.
  display_group: Microsoft Graph Security
  doc_url: https://learn.microsoft.com/en-us/graph/api/security-alert-post-comments?view=graph-rest-1.0
  namespace: tools.microsoft_graph_security
  name: create_alert_comment
  secrets:
    - type: oauth
      provider_id: microsoft_graph_security
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph_security
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: microsoft_graph
      grant_type: authorization_code
      optional: true
  expects:
    base_url:
      type: str | None
      description: >-
        Microsoft Graph v1.0 API root. If omitted, uses the workspace variable
        `microsoft_graph_security.base_url`, then
        `microsoft_graph.base_url`, then https://graph.microsoft.com/v1.0.
        National clouds: https://graph.microsoft.us/v1.0 (US Government L4) and
        https://dod-graph.microsoft.us/v1.0 (US Government L5 DOD).
      default: null
    auth_mode:
      type: enum["application", "delegated", "auto"]
      description: >-
        Credential to use. `application` requires
        MICROSOFT_GRAPH_SECURITY_SERVICE_TOKEN, then MICROSOFT_GRAPH_SERVICE_TOKEN;
        `delegated` requires MICROSOFT_GRAPH_SECURITY_USER_TOKEN, then
        MICROSOFT_GRAPH_USER_TOKEN; `auto` tries all four in that order.
      default: application
    alertId:
      type: str
      description: The unique identifier of the alert.
    comment:
      type: str
      description: The comment to be added.
  steps:
    - ref: call_graph
      action: tools.microsoft_graph_security_sdk.call_method
      args:
        path: /security/alerts_v2/${{ FN.url_encode(inputs.alertId) }}/comments
        method: POST
        base_url: ${{ inputs.base_url || VARS.microsoft_graph_security.base_url || VARS.microsoft_graph.base_url || "https://graph.microsoft.com/v1.0" }}
        auth_mode: ${{ inputs.auth_mode }}
        payload:
          "@odata.type": microsoft.graph.security.alertComment
          comment: ${{ inputs.comment }}
  returns: ${{ steps.call_graph.result }}
