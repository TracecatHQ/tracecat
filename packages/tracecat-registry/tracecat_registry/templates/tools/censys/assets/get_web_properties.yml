type: action
definition:
  title: Get web properties
  description: >-
    Get multiple web properties. Calls POST /v3/global/asset/webproperty directly.
  display_group: Censys
  doc_url: https://docs.censys.com/reference/v3-globaldata-asset-webproperty-list-post
  namespace: tools.censys
  name: get_web_properties
  secrets:
    - name: censys
      keys: ["CENSYS_API_TOKEN"]
  expects:
    webproperty_ids:
      type: list[str]
      description: A list of web property identifiers, such as platform.censys.io:80. Up to 100 per call.
    at_time:
      type: str | None
      description: RFC3339 Timestamp to view all requested webproperties at a specific point in time. Must be a valid RFC3339 string. Ensure that you suffix the date with T00:00:00Z or a specific time.
      default: null
    organization_id:
      type: str | None
      description: The ID of a Censys organization to associate the request with. If omitted, the request will be processed using the authenticated user's free wallet where applicable.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Censys Platform API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.censys.base_url || "https://api.platform.censys.io" }}/v3/global/asset/webproperty
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.censys.CENSYS_API_TOKEN }}
          Content-Type: application/json
        params:
          organization_id: ${{ inputs.organization_id }}
        payload:
          webproperty_ids: ${{ inputs.webproperty_ids }}
          at_time: ${{ inputs.at_time }}
  returns: ${{ steps.request.result }}
