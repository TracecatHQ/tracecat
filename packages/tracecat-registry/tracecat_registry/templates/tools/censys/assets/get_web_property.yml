type: action
definition:
  title: Get web property
  description: >-
    Get a web property. Calls GET /v3/global/asset/webproperty/{webproperty_id} directly.
  display_group: Censys
  doc_url: https://docs.censys.com/reference/v3-globaldata-asset-webproperty
  namespace: tools.censys
  name: get_web_property
  secrets:
    - name: censys
      keys: ["CENSYS_API_TOKEN"]
  expects:
    webproperty_id:
      type: str
      description: Web property identifier, usually hostname:port.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Censys Platform API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.censys.base_url || "https://api.platform.censys.io" }}/v3/global/asset/webproperty/${{ FN.url_encode(inputs.webproperty_id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.censys.CENSYS_API_TOKEN }}
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
