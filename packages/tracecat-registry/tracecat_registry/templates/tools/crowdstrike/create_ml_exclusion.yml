type: action
definition:
  title: Create machine learning exclusion
  description: >-
    Create a machine learning exclusion. Requires the Machine Learning Exclusions: Write
    API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/ml-exclusions/#createmlexclusionsv1
  namespace: tools.crowdstrike
  name: create_ml_exclusion
  expects:
    value:
      type: str
      description: "Path or glob pattern to exclude, for example `/Users/*/Downloads/**`."
    groups:
      type: list[str]
      description: >-
        Host group IDs to apply the exclusion to. Use `["all"]` for all hosts.
    excluded_from:
      type: list[str] | None
      description: Exclusion sources to apply.
      default: null
    comment:
      type: str | None
      description: Why the exclusion exists.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: create_ml_exclusion
      action: tools.falconpy.call_command
      args:
        operation_id: createMLExclusionsV1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            value: ${{ inputs.value }}
            groups: ${{ inputs.groups }}
            excluded_from: ${{ inputs.excluded_from }}
            comment: ${{ inputs.comment }}
  returns: ${{ steps.create_ml_exclusion.result }}
