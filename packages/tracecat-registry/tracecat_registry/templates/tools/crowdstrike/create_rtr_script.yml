type: action
definition:
  title: Create RTR script
  description: >-
    Upload a custom script to the RTR script library so `run_rtr_admin_command` can run
    it with `runscript -CloudFile=<name>`. Requires the Real time response (admin):
    Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response-admin/#rtr-createscriptsv2
  namespace: tools.crowdstrike
  name: create_rtr_script
  expects:
    name:
      type: str
      description: "Script name, used with `runscript -CloudFile`."
    description:
      type: str
      description: Script description.
    content:
      type: str
      description: Script content.
    permission_type:
      type: str
      description: >-
        Who can run it: `private`, `group` (RTR admins) or `public` (active responders
        and admins).
    platform:
      type: list[str] | None
      description: "Platforms: `windows`, `mac` and/or `linux`."
      default: null
    comments_for_audit_log:
      type: str | None
      description: Audit log comment.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: create_rtr_script
      action: tools.falconpy.call_command
      args:
        operation_id: RTR_CreateScriptsV2
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          data:
            name: ${{ inputs.name }}
            description: ${{ inputs.description }}
            content: ${{ inputs.content }}
            permission_type: ${{ inputs.permission_type }}
            platform: ${{ inputs.platform }}
            comments_for_audit_log: ${{ inputs.comments_for_audit_log }}
  returns: ${{ steps.create_rtr_script.result }}
