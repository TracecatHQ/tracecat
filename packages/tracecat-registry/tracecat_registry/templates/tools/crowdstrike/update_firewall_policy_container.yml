type: action
definition:
  title: Update firewall policy container
  description: >-
    Set a firewall policy's enforcement, default inbound and outbound behavior, and
    attached rule groups. This replaces the container, so pass every field. Requires the
    Falcon Firewall Management add-on. Requires the Firewall management: Write API
    scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/firewall-management/#update-policy-container
  namespace: tools.crowdstrike
  name: update_firewall_policy_container
  expects:
    policy_id:
      type: str
      description: Firewall policy ID.
    platform_id:
      type: str
      description: "Platform ID: `windows`, `mac` or `linux`."
    enforce:
      type: bool
      description: "Enforce the policy's rules on hosts."
    test_mode:
      type: bool
      description: Monitor rule matches without blocking.
    default_inbound:
      type: str
      description: Default inbound action.
    default_outbound:
      type: str
      description: Default outbound action.
    rule_group_ids:
      type: list[str]
      description: "Rule group IDs to attach, in precedence order."
    local_logging:
      type: bool | None
      description: Log rule matches on the host.
      default: null
    is_default_policy:
      type: bool | None
      description: "Whether this is the platform's default policy."
      default: null
    tracking:
      type: str | None
      description: "Tracking ID from `get_firewall_policy_containers`."
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_firewall_policy_container
      action: tools.falconpy.call_command
      args:
        operation_id: update_policy_container
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            policy_id: ${{ inputs.policy_id }}
            platform_id: ${{ inputs.platform_id }}
            enforce: ${{ inputs.enforce }}
            test_mode: ${{ inputs.test_mode }}
            default_inbound: ${{ inputs.default_inbound }}
            default_outbound: ${{ inputs.default_outbound }}
            rule_group_ids: ${{ inputs.rule_group_ids }}
            local_logging: ${{ inputs.local_logging }}
            is_default_policy: ${{ inputs.is_default_policy }}
            tracking: ${{ inputs.tracking }}
  returns: ${{ steps.update_firewall_policy_container.result }}
