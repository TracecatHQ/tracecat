type: action
definition:
  title: Update IOA exclusion
  description: "Update a IOA exclusion. Requires the IOA Exclusions: Write API scope."
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/ioa-exclusions/#updateioaexclusionsv1
  namespace: tools.crowdstrike
  name: update_ioa_exclusion
  expects:
    id:
      type: str
      description: Exclusion ID.
    name:
      type: str
      description: Exclusion name.
    pattern_id:
      type: str
      description: "IOA pattern ID to exclude, from the detection."
    pattern_name:
      type: str | None
      description: IOA pattern name.
      default: null
    cl_regex:
      type: str
      description: Regex the command line must match.
    ifn_regex:
      type: str
      description: Regex the image file name must match.
    groups:
      type: list[str]
      description: >-
        Host group IDs to apply the exclusion to. Use `["all"]` for all hosts.
    description:
      type: str | None
      description: Exclusion description.
      default: null
    comment:
      type: str | None
      description: Why the exclusion exists.
      default: null
    detection_json:
      type: str | None
      description: Detection JSON the exclusion was created from.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_ioa_exclusion
      action: tools.falconpy.call_command
      args:
        operation_id: updateIOAExclusionsV1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            id: ${{ inputs.id }}
            name: ${{ inputs.name }}
            pattern_id: ${{ inputs.pattern_id }}
            pattern_name: ${{ inputs.pattern_name }}
            cl_regex: ${{ inputs.cl_regex }}
            ifn_regex: ${{ inputs.ifn_regex }}
            groups: ${{ inputs.groups }}
            description: ${{ inputs.description }}
            comment: ${{ inputs.comment }}
            detection_json: ${{ inputs.detection_json }}
  returns: ${{ steps.update_ioa_exclusion.result }}
