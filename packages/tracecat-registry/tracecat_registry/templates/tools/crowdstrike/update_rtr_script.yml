type: action
definition:
  title: Update RTR script
  description: >-
    Update a custom script in the RTR script library. Requires the Real time response
    (admin): Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response-admin/#rtr-updatescriptsv2
  namespace: tools.crowdstrike
  name: update_rtr_script
  expects:
    id:
      type: str
      description: Script ID.
    name:
      type: str | None
      description: "Script name, used with `runscript -CloudFile`."
      default: null
    description:
      type: str | None
      description: Script description.
      default: null
    content:
      type: str | None
      description: Script content.
      default: null
    permission_type:
      type: str | None
      description: >-
        Who can run it: `private`, `group` (RTR admins) or `public` (active responders
        and admins).
      default: null
    platform:
      type: list[str] | None
      description: "Platforms: `windows`, `mac` and/or `linux`."
      default: null
    comments_for_audit_log:
      type: str | None
      description: Audit log comment.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_rtr_script
      action: tools.falconpy.call_command
      args:
        operation_id: RTR_UpdateScriptsV2
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          data:
            id: ${{ inputs.id }}
            name: ${{ inputs.name }}
            description: ${{ inputs.description }}
            content: ${{ inputs.content }}
            permission_type: ${{ inputs.permission_type }}
            platform: ${{ inputs.platform }}
            comments_for_audit_log: ${{ inputs.comments_for_audit_log }}
  returns: ${{ steps.update_rtr_script.result }}
