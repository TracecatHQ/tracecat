type: action
definition:
  title: Create sensor visibility exclusion
  description: >-
    Create a sensor visibility exclusion. The sensor stops recording and preventing
    activity in matching paths, so use it sparingly. Requires the Sensor Visibility
    Exclusions: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/sensor-visibility-exclusions/#createsvexclusionsv1
  namespace: tools.crowdstrike
  name: create_sensor_visibility_exclusion
  expects:
    value:
      type: str
      description: "Path or glob pattern to exclude, for example `/Users/*/Downloads/**`."
    groups:
      type: list[str]
      description: >-
        Host group IDs to apply the exclusion to. Use `["all"]` for all hosts.
    comment:
      type: str | None
      description: Why the exclusion exists.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: create_sensor_visibility_exclusion
      action: tools.falconpy.call_command
      args:
        operation_id: createSVExclusionsV1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            value: ${{ inputs.value }}
            groups: ${{ inputs.groups }}
            comment: ${{ inputs.comment }}
  returns: ${{ steps.create_sensor_visibility_exclusion.result }}
