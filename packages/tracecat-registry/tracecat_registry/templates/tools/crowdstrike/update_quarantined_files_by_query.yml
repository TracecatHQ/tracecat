type: action
definition:
  title: Update quarantined files by query
  description: >-
    Release, unrelease or permanently delete every quarantined file matching a filter,
    for example all copies of a hash. Requires the Quarantined Files: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/quarantine/#updateqfbyquery
  namespace: tools.crowdstrike
  name: update_quarantined_files_by_query
  expects:
    action:
      type: str
      description: "Action: `release`, `unrelease` or `delete`."
    filter:
      type: str | None
      description: FQL filter.
      default: null
    q:
      type: str | None
      description: Free-text search across all indexed fields.
      default: null
    comment:
      type: str | None
      description: Audit log comment.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_quarantined_files_by_query
      action: tools.falconpy.call_command
      args:
        operation_id: UpdateQfByQuery
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            action: ${{ inputs.action }}
            filter: ${{ inputs.filter }}
            q: ${{ inputs.q }}
            comment: ${{ inputs.comment }}
  returns: ${{ steps.update_quarantined_files_by_query.result }}
