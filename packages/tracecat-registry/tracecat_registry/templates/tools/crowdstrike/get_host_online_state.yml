type: action
definition:
  title: Get host online state
  description: >-
    Get the online status of one or more hosts. Requires the Hosts: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/hosts/#getonlinestatev1
  namespace: tools.crowdstrike
  name: get_host_online_state
  expects:
    ids:
      type: list[str]
      description: Host agent IDs (AIDs) to check.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: get_host_online_state
      action: tools.falconpy.call_command
      args:
        operation_id: GetOnlineState_V1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
  returns: ${{ steps.get_host_online_state.result }}
