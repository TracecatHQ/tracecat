type: action
definition:
  title: Create host group
  description: >-
    Create a static or dynamic host group. Policies are assigned to host groups.
    Requires the Host groups: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/host-group/#createhostgroups
  namespace: tools.crowdstrike
  name: create_host_group
  expects:
    name:
      type: str
      description: Host group name.
    group_type:
      type: str
      description: "Group type, for example `static` or `dynamic`."
    description:
      type: str | None
      description: Host group description.
      default: null
    assignment_rule:
      type: str | None
      description: "FQL rule for dynamic groups, for example `platform_name:'Windows'`."
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: create_host_group
      action: tools.falconpy.call_command
      args:
        operation_id: createHostGroups
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            resources:
              - name: ${{ inputs.name }}
                group_type: ${{ inputs.group_type }}
                description: ${{ inputs.description }}
                assignment_rule: ${{ inputs.assignment_rule }}
  returns: ${{ steps.create_host_group.result }}
