type: action
definition:
  title: List RTR session files
  description: >-
    List the files retrieved with `get` in an RTR session, including their SHA256s.
    Requires the Real time response: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response/#rtr-listfilesv2
  namespace: tools.crowdstrike
  name: list_rtr_session_files
  expects:
    session_id:
      type: str
      description: RTR session ID.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: list_rtr_session_files
      action: tools.falconpy.call_command
      args:
        operation_id: RTR_ListFilesV2
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          session_id: ${{ inputs.session_id }}
  returns: ${{ steps.list_rtr_session_files.result }}
