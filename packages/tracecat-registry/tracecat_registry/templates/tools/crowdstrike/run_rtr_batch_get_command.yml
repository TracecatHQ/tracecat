type: action
definition:
  title: Run RTR batch get command
  description: >-
    Retrieve a file from every host in an RTR batch session. Poll
    `get_rtr_batch_get_command_status` for the uploaded file SHA256s. Requires the Real
    time response: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response/#batchgetcmd
  namespace: tools.crowdstrike
  name: run_rtr_batch_get_command
  expects:
    batch_id:
      type: str
      description: "Batch ID from `tools.crowdstrike.start_rtr_batch_session`."
    file_path:
      type: str
      description: Full path of the file to retrieve from each host.
    optional_hosts:
      type: list[str] | None
      description: >-
        Subset of host AIDs in the batch to retrieve from. Defaults to every host.
      default: null
    timeout:
      type: int | None
      description: "Seconds to wait for the request. Defaults to 30, maximum 600."
      default: null
    timeout_duration:
      type: str | None
      description: "Timeout as a duration, for example `30s`. Maximum `10m`."
      default: null
    host_timeout_duration:
      type: str | None
      description: >-
        How long each host has to finish, for example `20s`. Must be less than the
        overall timeout.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: run_rtr_batch_get_command
      action: tools.falconpy.call_command
      args:
        operation_id: BatchGetCmd
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          timeout: ${{ inputs.timeout }}
          timeout_duration: ${{ inputs.timeout_duration }}
          host_timeout_duration: ${{ inputs.host_timeout_duration }}
          body:
            batch_id: ${{ inputs.batch_id }}
            file_path: ${{ inputs.file_path }}
            optional_hosts: ${{ inputs.optional_hosts }}
  returns: ${{ steps.run_rtr_batch_get_command.result }}
