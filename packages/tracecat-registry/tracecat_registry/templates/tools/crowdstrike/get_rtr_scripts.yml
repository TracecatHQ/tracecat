type: action
definition:
  title: Get RTR scripts
  description: >-
    Get custom RTR scripts by ID, including their content. Requires the Real time
    response (admin): Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response-admin/#rtr-getscriptsv2
  namespace: tools.crowdstrike
  name: get_rtr_scripts
  expects:
    ids:
      type: list[str]
      description: Script IDs.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: get_rtr_scripts
      action: tools.falconpy.call_command
      args:
        operation_id: RTR_GetScriptsV2
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
  returns: ${{ steps.get_rtr_scripts.result }}
