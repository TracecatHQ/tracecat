type: action
definition:
  title: Get hosts
  description: >-
    Get details on one or more hosts by host ID. Requires the Hosts: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/hosts/#getdevicedetails
  namespace: tools.crowdstrike
  name: get_hosts
  expects:
    ids:
      type: list[str]
      description: Host agent IDs (AIDs) to retrieve.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: get_hosts
      action: tools.falconpy.call_command
      args:
        operation_id: PostDeviceDetailsV2
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            ids: ${{ inputs.ids }}
  returns: ${{ steps.get_hosts.result }}
