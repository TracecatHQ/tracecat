type: action
definition:
  title: Run RTR batch active responder command
  description: >-
    Run an active responder RTR command on every host in an RTR batch session and return
    each host's output. Requires the Real time response: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response/#batchactiverespondercmd
  namespace: tools.crowdstrike
  name: run_rtr_batch_active_responder_command
  expects:
    batch_id:
      type: str
      description: "Batch ID from `tools.crowdstrike.start_rtr_batch_session`."
    base_command:
      type: str
      description: "Base command to run, for example `kill`."
    command_string:
      type: str
      description: "Full command string, including the base command and its arguments."
    optional_hosts:
      type: list[str] | None
      description: >-
        Subset of host AIDs in the batch to run the command on. Defaults to every host.
      default: null
    persist_all:
      type: bool
      description: Queue the command for hosts that are offline.
      default: false
    timeout:
      type: int | None
      description: "Seconds to wait for the request. Defaults to 30, maximum 600."
      default: null
    timeout_duration:
      type: str | None
      description: "Timeout as a duration, for example `30s`. Maximum `10m`."
      default: null
    host_timeout_duration:
      type: str | None
      description: >-
        How long each host has to finish, for example `20s`. Must be less than the
        overall timeout.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: run_rtr_batch_active_responder_command
      action: tools.falconpy.call_command
      args:
        operation_id: BatchActiveResponderCmd
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          timeout: ${{ inputs.timeout }}
          timeout_duration: ${{ inputs.timeout_duration }}
          host_timeout_duration: ${{ inputs.host_timeout_duration }}
          body:
            batch_id: ${{ inputs.batch_id }}
            base_command: ${{ inputs.base_command }}
            command_string: ${{ inputs.command_string }}
            optional_hosts: ${{ inputs.optional_hosts }}
            persist_all: ${{ inputs.persist_all }}
  returns: ${{ steps.run_rtr_batch_active_responder_command.result }}
