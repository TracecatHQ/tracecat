type: action
definition:
  title: Refresh RTR batch session
  description: >-
    Keep an RTR batch session alive, optionally removing hosts from it. Requires the
    Real time response: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response/#batchrefreshsessions
  namespace: tools.crowdstrike
  name: refresh_rtr_batch_session
  expects:
    batch_id:
      type: str
      description: "Batch ID from `tools.crowdstrike.start_rtr_batch_session`."
    hosts_to_remove:
      type: list[str] | None
      description: Host AIDs to remove from the batch.
      default: null
    timeout:
      type: int | None
      description: "Seconds to wait for the request. Defaults to 30, maximum 600."
      default: null
    timeout_duration:
      type: str | None
      description: "Timeout as a duration, for example `30s`. Maximum `10m`."
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: refresh_rtr_batch_session
      action: tools.falconpy.call_command
      args:
        operation_id: BatchRefreshSessions
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          timeout: ${{ inputs.timeout }}
          timeout_duration: ${{ inputs.timeout_duration }}
          body:
            batch_id: ${{ inputs.batch_id }}
            hosts_to_remove: ${{ inputs.hosts_to_remove }}
  returns: ${{ steps.refresh_rtr_batch_session.result }}
