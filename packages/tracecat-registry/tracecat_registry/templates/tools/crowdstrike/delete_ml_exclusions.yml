type: action
definition:
  title: Delete machine learning exclusions
  description: >-
    Delete machine learning exclusions by ID. Requires the Machine Learning Exclusions:
    Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/ml-exclusions/#deletemlexclusionsv1
  namespace: tools.crowdstrike
  name: delete_ml_exclusions
  expects:
    ids:
      type: list[str]
      description: machine learning exclusion IDs.
    comment:
      type: str | None
      description: Audit log comment.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: delete_ml_exclusions
      action: tools.falconpy.call_command
      args:
        operation_id: deleteMLExclusionsV1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
          comment: ${{ inputs.comment }}
  returns: ${{ steps.delete_ml_exclusions.result }}
