type: action
definition:
  title: Update prevention policy
  description: >-
    Update a prevention policy's name, description or protection settings, such as
    ransomware, script-based execution or exploit mitigation. Requires the Prevention
    policies: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/prevention-policy/#updatepreventionpolicies
  namespace: tools.crowdstrike
  name: update_prevention_policy
  expects:
    id:
      type: str
      description: Prevention policy ID.
    name:
      type: str | None
      description: Policy name.
      default: null
    description:
      type: str | None
      description: Policy description.
      default: null
    settings:
      type: list[dict[str, Any]] | None
      description: "Policy settings, as `{\"id\": ..., \"value\": ...}` objects."
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_prevention_policy
      action: tools.falconpy.call_command
      args:
        operation_id: updatePreventionPolicies
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            resources:
              - id: ${{ inputs.id }}
                name: ${{ inputs.name }}
                description: ${{ inputs.description }}
                settings: ${{ inputs.settings }}
  returns: ${{ steps.update_prevention_policy.result }}
