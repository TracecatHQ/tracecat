type: action
definition:
  title: List child CIDs
  description: >-
    List the child CIDs linked to a Flight Control (MSSP) parent tenant. Pass a child
    CID as `member_cid` on other CrowdStrike actions to act in that tenant. Requires
    Flight Control and the Flight Control: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/mssp/#querychildren
  namespace: tools.crowdstrike
  name: list_child_cids
  expects:
    filter:
      type: str | None
      description: "FQL filter. Supports `cid`, for example `cid:'<child CID>'`."
      default: null
    sort:
      type: str | None
      description: "`last_modified_timestamp|asc` or `last_modified_timestamp|desc`."
      default: null
    offset:
      type: int | None
      description: Offset to start from.
      default: null
    limit:
      type: int | None
      description: Maximum number of results to return.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: list_child_cids
      action: tools.falconpy.call_command
      args:
        operation_id: queryChildren
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          filter: ${{ inputs.filter }}
          sort: ${{ inputs.sort }}
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.list_child_cids.result }}
