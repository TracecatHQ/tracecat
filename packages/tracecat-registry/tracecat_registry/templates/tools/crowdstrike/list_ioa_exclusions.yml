type: action
definition:
  title: List IOA exclusions
  description: >-
    Search IOA exclusions and return their IDs. Use `get_ioa_exclusions` for details.
    Requires the IOA Exclusions: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/ioa-exclusions/#queryioaexclusionsv1
  namespace: tools.crowdstrike
  name: list_ioa_exclusions
  expects:
    filter:
      type: str | None
      description: FQL filter.
      default: null
    ifn_regex:
      type: str | None
      description: Image file name regex to match.
      default: null
    cl_regex:
      type: str | None
      description: Command line regex to match.
      default: null
    offset:
      type: int | None
      description: Offset to start from.
      default: null
    limit:
      type: int | None
      description: Maximum number of results to return.
      default: null
    sort:
      type: str | None
      description: "Property and direction to sort by, for example `name.asc`."
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: list_ioa_exclusions
      action: tools.falconpy.call_command
      args:
        operation_id: queryIOAExclusionsV1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          filter: ${{ inputs.filter }}
          ifn_regex: ${{ inputs.ifn_regex }}
          cl_regex: ${{ inputs.cl_regex }}
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
          sort: ${{ inputs.sort }}
  returns: ${{ steps.list_ioa_exclusions.result }}
