type: action
definition:
  title: List detects
  description: >-
    Deprecated. Query legacy CrowdStrike detects through the Detects API, which
    CrowdStrike has deprecated in favour of Alerts. Use
    `tools.crowdstrike.list_alerts` instead.
  deprecated: Use `tools.crowdstrike.list_alerts` instead.
  display_group: CrowdStrike
  doc_url: https://falconpy.io/Service-Collections/Detects.html
  namespace: tools.crowdstrike
  name: list_detects
  expects:
    start_time:
      type: datetime
      description: Start time for the query (inclusive).
    end_time:
      type: datetime
      description: End time for the query (exclusive).
    query:
      type: str | None
      description: >
        Falcon Query Language (FQL) filter to apply to alerts.
        If specified, overrides `start_time` and `end_time`.
      default: null
    limit:
      type: int
      description: Maximum number of alerts to return.
      default: 100
    member_cid:
      type: str | None
      description: Crowdstrike member CID.
      default: null
  steps:
    - ref: query_detects
      action: tools.falconpy.call_command
      args:
        operation_id: QueryDetects
        member_cid: ${{ inputs.member_cid }}
        params:
          filter: >-
            ${{ inputs.query || FN.format("created_date:>='{}' + created_date:<'{}'",
            FN.format_datetime(FN.to_datetime(inputs.start_time, "UTC"), "%Y-%m-%dT%H:%M:%SZ"),
            FN.format_datetime(FN.to_datetime(inputs.end_time, "UTC"), "%Y-%m-%dT%H:%M:%SZ")) }}
          limit: ${{ inputs.limit }}
    - ref: get_detect_summaries
      action: tools.falconpy.call_command
      args:
        operation_id: GetDetectSummaries
        member_cid: ${{ inputs.member_cid }}
        params:
          body:
            ids: ${{ steps.query_detects.result.body.resources }}
  returns: ${{ steps.get_detect_summaries.result.body }}
