type: action
definition:
  title: Run RTR admin command
  description: >-
    Run a Real Time Response administrator command (for example `runscript`, `put`)
    on a host in an open session. Returns a `cloud_request_id` to poll for output.
    Requires the Real time response (admin): Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response-admin/#rtr-executeadmincommand
  namespace: tools.crowdstrike
  name: run_rtr_admin_command
  expects:
    session_id:
      type: str
      description: RTR session ID from `tools.crowdstrike.start_rtr_session`.
    base_command:
      type: str
      description: Base command to run, for example `runscript`.
    command_string:
      type: str
      description: Full command string, including the base command and its arguments.
    persist:
      type: bool
      description: Run the command when an offline host returns to service.
      default: false
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: run_rtr_admin_command
      action: tools.falconpy.call_command
      args:
        operation_id: RTR_ExecuteAdminCommand
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            session_id: ${{ inputs.session_id }}
            base_command: ${{ inputs.base_command }}
            command_string: ${{ inputs.command_string }}
            persist: ${{ inputs.persist }}
  returns: ${{ steps.run_rtr_admin_command.result }}
