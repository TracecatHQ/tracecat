type: action
definition:
  title: Update device control policy
  description: >-
    Update a device control policy's USB and Bluetooth settings, for example to block
    mass storage. Requires the Falcon Device Control add-on. Requires the Device control
    policies: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/device-control-policies/#patchdevicecontrolpoliciesv2
  namespace: tools.crowdstrike
  name: update_device_control_policy
  expects:
    id:
      type: str
      description: Device control policy ID.
    name:
      type: str | None
      description: Policy name.
      default: null
    description:
      type: str | None
      description: Policy description.
      default: null
    usb_settings:
      type: dict[str, Any] | None
      description: >-
        USB settings, such as `enforcement_mode`, `whitelist_mode` and notifications.
      default: null
    bluetooth_settings:
      type: dict[str, Any] | None
      description: Bluetooth settings.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_device_control_policy
      action: tools.falconpy.call_command
      args:
        operation_id: patchDeviceControlPoliciesV2
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            policies:
              - id: ${{ inputs.id }}
                name: ${{ inputs.name }}
                description: ${{ inputs.description }}
                usb_settings: ${{ inputs.usb_settings }}
                bluetooth_settings: ${{ inputs.bluetooth_settings }}
  returns: ${{ steps.update_device_control_policy.result }}
