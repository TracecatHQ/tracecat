type: action
definition:
  title: List quarantined files
  description: >-
    Search quarantined files and return their IDs. Use `get_quarantined_files` for
    details. Requires the Quarantined Files: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/quarantine/#queryquarantinefiles
  namespace: tools.crowdstrike
  name: list_quarantined_files
  expects:
    filter:
      type: str | None
      description: FQL filter.
      default: null
    q:
      type: str | None
      description: Free-text search across all indexed fields.
      default: null
    sort:
      type: str | None
      description: "Property and direction to sort by, for example `name.asc`."
      default: null
    offset:
      type: str | None
      description: Offset to start from.
      default: null
    limit:
      type: int | None
      description: Maximum number of results to return.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: list_quarantined_files
      action: tools.falconpy.call_command
      args:
        operation_id: QueryQuarantineFiles
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          filter: ${{ inputs.filter }}
          q: ${{ inputs.q }}
          sort: ${{ inputs.sort }}
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.list_quarantined_files.result }}
