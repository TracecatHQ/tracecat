type: action
definition:
  title: Update firewall rule group
  description: >-
    Change a firewall rule group with JSON Patch operations, for example to add, remove
    or edit rules. Requires the Falcon Firewall Management add-on. Requires the Firewall
    management: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/firewall-management/#update-rule-group
  namespace: tools.crowdstrike
  name: update_firewall_rule_group
  expects:
    id:
      type: str
      description: Rule group ID.
    tracking:
      type: str
      description: "Tracking ID from `get_firewall_rule_groups`."
    diff_type:
      type: str
      description: "Diff format. Use `application/json-patch+json`."
      default: application/json-patch+json
    diff_operations:
      type: list[dict[str, Any]]
      description: "JSON Patch operations, as `{\"op\", \"path\", \"value\"}` objects."
    rule_ids:
      type: list[str]
      description: "IDs of the rules in the group, in order."
    rule_versions:
      type: list[int]
      description: "Versions of the rules in `rule_ids`."
    comment:
      type: str | None
      description: Audit log comment.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_firewall_rule_group
      action: tools.falconpy.call_command
      args:
        operation_id: update_rule_group
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          comment: ${{ inputs.comment }}
          body:
            id: ${{ inputs.id }}
            tracking: ${{ inputs.tracking }}
            diff_type: ${{ inputs.diff_type }}
            diff_operations: ${{ inputs.diff_operations }}
            rule_ids: ${{ inputs.rule_ids }}
            rule_versions: ${{ inputs.rule_versions }}
  returns: ${{ steps.update_firewall_rule_group.result }}
