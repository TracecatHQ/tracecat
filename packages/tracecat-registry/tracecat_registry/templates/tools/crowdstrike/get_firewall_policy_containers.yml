type: action
definition:
  title: Get firewall policy containers
  description: >-
    Get the enforcement settings and attached rule groups of firewall policies. Requires
    the Falcon Firewall Management add-on. Requires the Firewall management: Read API
    scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/firewall-management/#get-policy-containers
  namespace: tools.crowdstrike
  name: get_firewall_policy_containers
  expects:
    ids:
      type: list[str]
      description: Firewall policy IDs.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: get_firewall_policy_containers
      action: tools.falconpy.call_command
      args:
        operation_id: get_policy_containers
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
  returns: ${{ steps.get_firewall_policy_containers.result }}
