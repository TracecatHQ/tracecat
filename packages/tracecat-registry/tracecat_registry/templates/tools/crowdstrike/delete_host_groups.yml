type: action
definition:
  title: Delete host groups
  description: "Delete host groups by ID. Requires the Host groups: Write API scope."
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/host-group/#deletehostgroups
  namespace: tools.crowdstrike
  name: delete_host_groups
  expects:
    ids:
      type: list[str]
      description: Host group IDs.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: delete_host_groups
      action: tools.falconpy.call_command
      args:
        operation_id: deleteHostGroups
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
  returns: ${{ steps.delete_host_groups.result }}
