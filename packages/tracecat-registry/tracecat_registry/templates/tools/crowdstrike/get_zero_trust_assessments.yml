type: action
definition:
  title: Get Zero Trust assessments
  description: >-
    Get Zero Trust Assessment (ZTA) posture scores for hosts. Requires Falcon Zero Trust
    Assessment and the Zero Trust Assessment: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/zero-trust-assessment/#getassessmentv1
  namespace: tools.crowdstrike
  name: get_zero_trust_assessments
  expects:
    ids:
      type: list[str]
      description: Host AIDs.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: get_zero_trust_assessments
      action: tools.falconpy.call_command
      args:
        operation_id: getAssessmentV1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
  returns: ${{ steps.get_zero_trust_assessments.result }}
