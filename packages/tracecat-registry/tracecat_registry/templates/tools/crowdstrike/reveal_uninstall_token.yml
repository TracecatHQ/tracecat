type: action
definition:
  title: Reveal uninstall token
  description: >-
    Reveal the token needed to uninstall a sensor protected by uninstall protection. The
    token is sensitive: it lets anyone with host access remove the sensor. Requires the
    Sensor update policies: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/sensor-update-policy/#revealuninstalltoken
  namespace: tools.crowdstrike
  name: reveal_uninstall_token
  expects:
    device_id:
      type: str
      description: "Host AID, or `MAINTENANCE` for the bulk maintenance token."
    audit_message:
      type: str | None
      description: Message to record in the audit log.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: reveal_uninstall_token
      action: tools.falconpy.call_command
      args:
        operation_id: revealUninstallToken
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            device_id: ${{ inputs.device_id }}
            audit_message: ${{ inputs.audit_message }}
  returns: ${{ steps.reveal_uninstall_token.result }}
