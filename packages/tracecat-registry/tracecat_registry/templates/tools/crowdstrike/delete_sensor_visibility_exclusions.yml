type: action
definition:
  title: Delete sensor visibility exclusions
  description: >-
    Delete sensor visibility exclusions by ID. Requires the Sensor Visibility
    Exclusions: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/sensor-visibility-exclusions/#deletesensorvisibilityexclusionsv1
  namespace: tools.crowdstrike
  name: delete_sensor_visibility_exclusions
  expects:
    ids:
      type: list[str]
      description: sensor visibility exclusion IDs.
    comment:
      type: str | None
      description: Audit log comment.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: delete_sensor_visibility_exclusions
      action: tools.falconpy.call_command
      args:
        operation_id: deleteSensorVisibilityExclusionsV1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
          comment: ${{ inputs.comment }}
  returns: ${{ steps.delete_sensor_visibility_exclusions.result }}
