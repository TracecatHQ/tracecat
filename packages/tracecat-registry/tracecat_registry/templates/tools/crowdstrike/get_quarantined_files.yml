type: action
definition:
  title: Get quarantined files
  description: >-
    Get quarantined file metadata by ID. Requires the Quarantined Files: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/quarantine/#getquarantinefiles
  namespace: tools.crowdstrike
  name: get_quarantined_files
  expects:
    ids:
      type: list[str]
      description: Quarantined file IDs.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: get_quarantined_files
      action: tools.falconpy.call_command
      args:
        operation_id: GetQuarantineFiles
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            ids: ${{ inputs.ids }}
  returns: ${{ steps.get_quarantined_files.result }}
