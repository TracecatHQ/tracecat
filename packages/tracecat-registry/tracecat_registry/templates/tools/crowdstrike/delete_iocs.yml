type: action
definition:
  title: Delete IOCs
  description: >-
    Delete custom IOCs by ID or FQL filter. If both are provided, `filter` takes
    precedence and `ids` is ignored. Requires the IOC Management: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/ioc/#indicatordeletev1
  namespace: tools.crowdstrike
  name: delete_iocs
  expects:
    ids:
      type: list[str] | None
      description: Indicator IDs to delete.
      default: null
    filter:
      type: str | None
      description: FQL filter to delete indicators in bulk.
      default: null
    comment:
      type: str | None
      description: Reason the indicators were deleted.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: delete_iocs
      action: tools.falconpy.call_command
      args:
        operation_id: indicator_delete_v1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
          filter: ${{ inputs.filter }}
          comment: ${{ inputs.comment }}
  returns: ${{ steps.delete_iocs.result }}
