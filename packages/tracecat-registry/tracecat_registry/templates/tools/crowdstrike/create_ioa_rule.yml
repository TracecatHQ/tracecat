type: action
definition:
  title: Create custom IOA rule
  description: >-
    Create a custom IOA rule in a rule group, for example to detect or block a process
    and command-line pattern. Requires the Custom IOA rules: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/custom-ioa/#create-rule
  namespace: tools.crowdstrike
  name: create_ioa_rule
  expects:
    rulegroup_id:
      type: str
      description: Rule group ID.
    ruletype_id:
      type: str
      description: "Rule type ID, from `list_ioa_rule_types`."
    name:
      type: str
      description: Rule name.
    description:
      type: str
      description: Rule description.
    pattern_severity:
      type: str
      description: Pattern severity.
    disposition_id:
      type: int
      description: >-
        Disposition ID for the rule type, for example detect or block, from
        `get_ioa_rule_types`.
    field_values:
      type: list[dict[str, Any]]
      description: >-
        Rule field values, as `{"name", "label", "type", "values"}` objects from the
        rule type's fields.
    comment:
      type: str
      description: Audit log comment.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: create_ioa_rule
      action: tools.falconpy.call_command
      args:
        operation_id: create_rule
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            rulegroup_id: ${{ inputs.rulegroup_id }}
            ruletype_id: ${{ inputs.ruletype_id }}
            name: ${{ inputs.name }}
            description: ${{ inputs.description }}
            pattern_severity: ${{ inputs.pattern_severity }}
            disposition_id: ${{ inputs.disposition_id }}
            field_values: ${{ inputs.field_values }}
            comment: ${{ inputs.comment }}
  returns: ${{ steps.create_ioa_rule.result }}
