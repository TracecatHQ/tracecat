type: action
definition:
  title: List Discover assets
  description: >-
    Search assets seen by Falcon Discover, including managed hosts and unmanaged hosts
    without a Falcon sensor. Requires Falcon Discover (Exposure Management) and the
    Assets: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/discover/#combined-hosts
  namespace: tools.crowdstrike
  name: list_discover_assets
  expects:
    filter:
      type: str
      description: FQL filter on asset properties.
    limit:
      type: int | None
      description: Maximum number of results to return.
      default: null
    after:
      type: str | None
      description: "Pagination token from the previous response's `meta.pagination.after`."
      default: null
    sort:
      type: str | None
      description: "Property and direction to sort by, for example `name.asc`."
      default: null
    facet:
      type: list[str] | None
      description: >-
        Extra detail to include: `system_insights`, `third_party` and/or `risk_factors`.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: list_discover_assets
      action: tools.falconpy.call_command
      args:
        operation_id: combined_hosts
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          filter: ${{ inputs.filter }}
          limit: ${{ inputs.limit }}
          after: ${{ inputs.after }}
          sort: ${{ inputs.sort }}
          facet: ${{ inputs.facet }}
  returns: ${{ steps.list_discover_assets.result }}
