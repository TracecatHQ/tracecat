type: action
definition:
  title: Delete RTR script
  description: >-
    Delete a custom script from the RTR script library. Requires the Real time response
    (admin): Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response-admin/#rtr-deletescripts
  namespace: tools.crowdstrike
  name: delete_rtr_script
  expects:
    ids:
      type: str
      description: Script ID.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: delete_rtr_script
      action: tools.falconpy.call_command
      args:
        operation_id: RTR_DeleteScripts
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
  returns: ${{ steps.delete_rtr_script.result }}
