type: action
definition:
  title: Get RTR put files
  description: >-
    Get RTR put-file metadata by ID. Requires the Real time response (admin): Write API
    scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/real-time-response-admin/#rtr-getput-filesv2
  namespace: tools.crowdstrike
  name: get_rtr_put_files
  expects:
    ids:
      type: list[str]
      description: Put-file IDs.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: get_rtr_put_files
      action: tools.falconpy.call_command
      args:
        operation_id: RTR_GetPut_FilesV2
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
  returns: ${{ steps.get_rtr_put_files.result }}
