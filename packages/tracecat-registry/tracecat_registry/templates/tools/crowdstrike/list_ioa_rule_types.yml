type: action
definition:
  title: List custom IOA rule types
  description: >-
    List custom IOA rule type IDs, such as process creation or network connection.
    Requires the Custom IOA rules: Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/custom-ioa/#query-rule-types
  namespace: tools.crowdstrike
  name: list_ioa_rule_types
  expects:
    offset:
      type: str | None
      description: Offset to start from.
      default: null
    limit:
      type: int | None
      description: Maximum number of results to return.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: list_ioa_rule_types
      action: tools.falconpy.call_command
      args:
        operation_id: query_rule_types
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.list_ioa_rule_types.result }}
