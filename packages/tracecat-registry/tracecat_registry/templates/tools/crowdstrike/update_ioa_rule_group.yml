type: action
definition:
  title: Update custom IOA rule group
  description: >-
    Update a custom IOA rule group's name, description or enabled state. Requires the
    Custom IOA rules: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/custom-ioa/#update-rule-groupmixin0
  namespace: tools.crowdstrike
  name: update_ioa_rule_group
  expects:
    id:
      type: str
      description: Rule group ID.
    rulegroup_version:
      type: int
      description: "Current rule group version, from `get_ioa_rule_groups`."
    name:
      type: str
      description: Rule group name.
    description:
      type: str
      description: Rule group description.
    enabled:
      type: bool
      description: Whether the rule group is enabled.
    comment:
      type: str
      description: Audit log comment.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_ioa_rule_group
      action: tools.falconpy.call_command
      args:
        operation_id: update_rule_groupMixin0
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            id: ${{ inputs.id }}
            rulegroup_version: ${{ inputs.rulegroup_version }}
            name: ${{ inputs.name }}
            description: ${{ inputs.description }}
            enabled: ${{ inputs.enabled }}
            comment: ${{ inputs.comment }}
  returns: ${{ steps.update_ioa_rule_group.result }}
