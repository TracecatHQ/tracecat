type: action
definition:
  title: List incidents
  description: >-
    Deprecated. Query legacy CrowdStrike incidents through the Incidents API,
    which CrowdStrike is retiring. Use Case Management actions such as
    `tools.crowdstrike.list_cases` instead; cases use a different data model.
  deprecated: >-
    Use `tools.crowdstrike.list_cases` instead. CrowdStrike is retiring the
    Incidents API; cases are not a drop-in replacement for incidents.
  display_group: CrowdStrike
  doc_url: https://falconpy.io/Service-Collections/Incidents.html
  namespace: tools.crowdstrike
  name: list_incidents
  expects:
    start_time:
      type: datetime
      description: Start time for the query (inclusive).
    end_time:
      type: datetime
      description: End time for the query (exclusive).
    query:
      type: str | None
      description: >
        Falcon Query Language (FQL) filter to apply to cases.
        If specified, overrides `start_time` and `end_time`.
      default: null
    limit:
      type: int
      description: Maximum number of incidents to return.
      default: 100
    member_cid:
      type: str | None
      description: Crowdstrike member CID.
      default: null
  steps:
    - ref: query_incidents
      action: tools.falconpy.call_command
      args:
        operation_id: QueryIncidents
        member_cid: ${{ inputs.member_cid }}
        params:
          filter: >-
            ${{ inputs.query || FN.format("created_date:>='{}' + created_date:<'{}'",
            FN.format_datetime(FN.to_datetime(inputs.start_time, "UTC"), "%Y-%m-%dT%H:%M:%SZ"),
            FN.format_datetime(FN.to_datetime(inputs.end_time, "UTC"), "%Y-%m-%dT%H:%M:%SZ")) }}
          limit: ${{ inputs.limit }}
    - ref: get_incidents
      action: tools.falconpy.call_command
      args:
        operation_id: GetIncidents
        member_cid: ${{ inputs.member_cid }}
        params:
          body:
            ids: ${{ steps.query_incidents.result.body.resources }}
  returns: ${{ steps.get_incidents.result.body }}
