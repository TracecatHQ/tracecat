type: action
definition:
  title: Get sensor visibility exclusions
  description: >-
    Get sensor visibility exclusions by ID. Requires the Sensor Visibility Exclusions:
    Read API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/sensor-visibility-exclusions/#getsensorvisibilityexclusionsv1
  namespace: tools.crowdstrike
  name: get_sensor_visibility_exclusions
  expects:
    ids:
      type: list[str]
      description: sensor visibility exclusion IDs.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: get_sensor_visibility_exclusions
      action: tools.falconpy.call_command
      args:
        operation_id: getSensorVisibilityExclusionsV1
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          ids: ${{ inputs.ids }}
  returns: ${{ steps.get_sensor_visibility_exclusions.result }}
