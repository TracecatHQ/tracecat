type: action
definition:
  title: Update host group members
  description: >-
    Add hosts to, or remove hosts from, static host groups. Requires the Host
    groups: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/host-group/#performgroupaction
  namespace: tools.crowdstrike
  name: update_host_group_members
  expects:
    action_name:
      type: str
      description: "Action to perform: `add-hosts` or `remove-hosts`."
    ids:
      type: list[str]
      description: Host group IDs to update.
    action_parameters:
      type: list[dict[str, str]]
      description: >-
        Action parameters, as `{"name": ..., "value": ...}` objects. Use name `filter`
        with an FQL host filter, for example `{"name": "filter", "value": "(device_id:['<aid>'])"}`.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_host_group_members
      action: tools.falconpy.call_command
      args:
        operation_id: performGroupAction
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          action_name: ${{ inputs.action_name }}
          body:
            ids: ${{ inputs.ids }}
            action_parameters: ${{ inputs.action_parameters }}
  returns: ${{ steps.update_host_group_members.result }}
