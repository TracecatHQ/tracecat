type: action
definition:
  title: Create firewall rule group
  description: >-
    Create a firewall rule group, for example to block traffic to an IP range, then
    attach it with `update_firewall_policy_container`. Requires the Falcon Firewall
    Management add-on. Requires the Firewall management: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/firewall-management/#create-rule-group
  namespace: tools.crowdstrike
  name: create_firewall_rule_group
  expects:
    name:
      type: str
      description: Rule group name.
    platform:
      type: str
      description: "Platform ID: `windows`, `mac` or `linux`."
    enabled:
      type: bool
      description: Whether the rule group is enabled.
      default: true
    description:
      type: str | None
      description: Rule group description.
      default: null
    rules:
      type: list[dict[str, Any]] | None
      description: >-
        Firewall rules. Each has `name`, `action`, `direction`, `address_family`,
        `protocol`, `enabled`, `log`, `fields`, and optional `local_address`,
        `remote_address`, `local_port` and `remote_port`.
      default: null
    clone_id:
      type: str | None
      description: Rule group ID to copy rules from.
      default: null
    library:
      type: str | None
      description: Set to clone from the CrowdStrike rule group library.
      default: null
    comment:
      type: str | None
      description: Audit log comment.
      default: null
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: create_firewall_rule_group
      action: tools.falconpy.call_command
      args:
        operation_id: create_rule_group
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          clone_id: ${{ inputs.clone_id }}
          library: ${{ inputs.library }}
          comment: ${{ inputs.comment }}
          body:
            name: ${{ inputs.name }}
            platform: ${{ inputs.platform }}
            enabled: ${{ inputs.enabled }}
            description: ${{ inputs.description }}
            rules: ${{ inputs.rules }}
  returns: ${{ steps.create_firewall_rule_group.result }}
