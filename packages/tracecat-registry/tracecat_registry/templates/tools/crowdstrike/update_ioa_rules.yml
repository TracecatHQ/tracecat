type: action
definition:
  title: Update custom IOA rules
  description: >-
    Update the name, description, enabled state or field values of rules in a custom IOA
    rule group. Requires the Custom IOA rules: Write API scope.
  display_group: CrowdStrike
  doc_url: https://developer.crowdstrike.com/api-reference/collections/custom-ioa/#update-rules-v2
  namespace: tools.crowdstrike
  name: update_ioa_rules
  expects:
    rulegroup_id:
      type: str
      description: Rule group ID.
    rulegroup_version:
      type: int
      description: "Current rule group version, from `get_ioa_rule_groups`."
    rule_updates:
      type: list[dict[str, Any]]
      description: >-
        Rule updates. Each has `instance_id`, `rulegroup_version`, `name`,
        `description`, `enabled`, `disposition_id`, `pattern_severity` and
        `field_values`.
    comment:
      type: str
      description: Audit log comment.
    member_cid:
      type: str | None
      description: CrowdStrike child CID to act on, for Flight Control (MSSP) parent tenants.
      default: null
    base_url:
      type: str | None
      description: >-
        Falcon API base URL. Defaults to the `crowdstrike.base_url` workspace variable,
        then FalconPy's US-1 default.
      default: null
  steps:
    - ref: update_ioa_rules
      action: tools.falconpy.call_command
      args:
        operation_id: update_rules_v2
        member_cid: ${{ inputs.member_cid }}
        base_url: ${{ inputs.base_url }}
        params:
          body:
            rulegroup_id: ${{ inputs.rulegroup_id }}
            rulegroup_version: ${{ inputs.rulegroup_version }}
            rule_updates: ${{ inputs.rule_updates }}
            comment: ${{ inputs.comment }}
  returns: ${{ steps.update_ioa_rules.result }}
