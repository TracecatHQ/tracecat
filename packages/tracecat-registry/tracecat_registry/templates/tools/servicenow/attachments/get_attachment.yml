type: action
definition:
  title: Get attachment
  description: Get attachment metadata with the Attachment API.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/c_AttachmentAPI.html#attachment-GET-sys_id
  namespace: tools.servicenow
  name: get_attachment
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    sys_id:
      type: str
      description: sys_id of the attachment.
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/now/attachment/${{ FN.url_encode(inputs.sys_id) }}
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
  returns: ${{ steps.request.result }}
