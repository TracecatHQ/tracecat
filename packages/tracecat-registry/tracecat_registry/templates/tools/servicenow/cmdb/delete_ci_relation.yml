type: action
definition:
  title: Delete configuration item relation
  description: Delete a relation from a configuration item with the CMDB Instance API.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/cmdb-instance-api.html#cmdb-DELETE-instance-relation
  namespace: tools.servicenow
  name: delete_ci_relation
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    classname:
      type: str
      description: CMDB class (table) name, e.g. cmdb_ci_linux_server, cmdb_ci_win_server, or cmdb_ci_appl.
    sys_id:
      type: str
      description: sys_id of the configuration item.
    rel_sys_id:
      type: str
      description: sys_id of the relation (cmdb_rel_ci).
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/now/cmdb/instance/${{ FN.url_encode(inputs.classname) }}/${{ FN.url_encode(inputs.sys_id) }}/relation/${{ FN.url_encode(inputs.rel_sys_id) }}
      method: DELETE
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
  returns: ${{ steps.request.result }}
