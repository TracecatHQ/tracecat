type: action
definition:
  title: List journal entries
  description: List comments and work notes for a record from the sys_journal_field table, newest first.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/c_TableAPI.html#table-GET
  namespace: tools.servicenow
  name: list_journal_entries
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    element_id:
      type: str
      description: sys_id of the record whose journal entries to list.
    element:
      type: enum["comments", "work_notes"] | None
      description: Only return comments or only return work notes.
      default: null
    sysparm_limit:
      type: int | None
      description: Maximum number of records to return.
      default: null
    sysparm_offset:
      type: int | None
      description: Number of records to skip, for pagination.
      default: null
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: build_query
    action: core.script.run_python
    args:
      inputs:
        element_id: ${{ inputs.element_id }}
        element: ${{ inputs.element }}
      script: |
        def main(element_id, element):
            query = f"element_id={element_id}"
            if element:
                query += f"^element={element}"
            return query + "^ORDERBYDESCsys_created_on"
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/now/table/sys_journal_field
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
      params:
        sysparm_query: ${{ steps.build_query.result }}
        sysparm_limit: ${{ inputs.sysparm_limit }}
        sysparm_offset: ${{ inputs.sysparm_offset }}
  returns: ${{ steps.request.result }}
