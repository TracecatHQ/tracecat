type: action
definition:
  title: Submit record producer
  description: Submit a record producer form, which creates the target record (e.g. an incident or case) from form variables.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/c_ServiceCatalogAPI.html#servicecat-POST-items-submit_prod
  namespace: tools.servicenow
  name: submit_record_producer
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    sys_id:
      type: str
      description: sys_id of the record producer.
    variables:
      type: dict[str, Any]
      description: Form variable values keyed by variable name. Use get_catalog_item to list the producer's variables.
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/sn_sc/servicecatalog/items/${{ FN.url_encode(inputs.sys_id) }}/submit_producer
      method: POST
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
        Content-Type: application/json
      payload:
        variables: ${{ inputs.variables }}
  returns: ${{ steps.request.result }}
