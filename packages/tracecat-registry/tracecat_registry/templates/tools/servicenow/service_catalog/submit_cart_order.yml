type: action
definition:
  title: Submit cart order
  description: Order all items in the caller's cart, creating a request.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/c_ServiceCatalogAPI.html#servicecat-POST-cart-sub_order
  namespace: tools.servicenow
  name: submit_cart_order
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/sn_sc/servicecatalog/cart/submit_order
      method: POST
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
  returns: ${{ steps.request.result }}
