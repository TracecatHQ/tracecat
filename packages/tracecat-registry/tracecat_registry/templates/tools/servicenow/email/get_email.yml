type: action
definition:
  title: Get email
  description: Get an email record (sys_email) by sys_id with the Email API.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/email-api.html#email-GET
  namespace: tools.servicenow
  name: get_email
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    id:
      type: str
      description: sys_id of the email.
    sysparm_fields:
      type: str | None
      description: Comma-separated list of fields to return.
      default: null
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/now/email/${{ FN.url_encode(inputs.id) }}
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
      params:
        sysparm_fields: ${{ inputs.sysparm_fields }}
  returns: ${{ steps.request.result }}
