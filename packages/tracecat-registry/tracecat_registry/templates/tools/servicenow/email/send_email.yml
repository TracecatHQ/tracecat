type: action
definition:
  title: Send email
  description: Send an email from the instance with the Email API, optionally associating it with a record.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/email-api.html#email-POST
  namespace: tools.servicenow
  name: send_email
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    to:
      type: list[str]
      description: Recipient email addresses.
    cc:
      type: list[str] | None
      description: CC email addresses.
      default: null
    bcc:
      type: list[str] | None
      description: BCC email addresses.
      default: null
    subject:
      type: str
      description: Email subject.
    text:
      type: str | None
      description: Plain-text body.
      default: null
    html:
      type: str | None
      description: HTML body.
      default: null
    table_name:
      type: str | None
      description: Table of a record to associate the email with.
      default: null
    table_record_id:
      type: str | None
      description: sys_id of the record to associate the email with.
      default: null
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: build_body
    action: core.script.run_python
    args:
      inputs:
        fields: null
        values:
          to: ${{ inputs.to }}
          cc: ${{ inputs.cc }}
          bcc: ${{ inputs.bcc }}
          subject: ${{ inputs.subject }}
          text: ${{ inputs.text }}
          html: ${{ inputs.html }}
          table_name: ${{ inputs.table_name }}
          table_record_id: ${{ inputs.table_record_id }}
      script: |
        def main(fields, values):
            body = dict(fields or {})
            body.update({k: v for k, v in values.items() if v is not None})
            return body
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/now/email
      method: POST
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
        Content-Type: application/json
      payload: ${{ steps.build_body.result }}
  returns: ${{ steps.request.result }}
