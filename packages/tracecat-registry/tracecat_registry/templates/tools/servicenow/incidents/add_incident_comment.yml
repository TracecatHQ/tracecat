type: action
definition:
  title: Add incident comment
  description: Add a customer-visible comment (additional comments) to an incident.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/c_TableAPI.html#table-PATCH
  namespace: tools.servicenow
  name: add_incident_comment
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    sys_id:
      type: str
      description: sys_id of the incident.
    comments:
      type: str
      description: Comment text visible to the caller.
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/now/table/incident/${{ FN.url_encode(inputs.sys_id) }}
      method: PATCH
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
        Content-Type: application/json
      payload:
        comments: ${{ inputs.comments }}
  returns: ${{ steps.request.result }}
