type: action
definition:
  title: List incidents
  description: List incidents matching an encoded query with the Table API. Use sysparm_query number=INC0010001 to look up an incident by number.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/c_TableAPI.html#table-GET
  namespace: tools.servicenow
  name: list_incidents
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    sysparm_query:
      type: str | None
      description: Encoded query used to filter the result set, e.g. active=true^priority=1^ORDERBYDESCsys_created_on.
      default: null
    sysparm_fields:
      type: str | None
      description: Comma-separated list of fields to return.
      default: null
    sysparm_limit:
      type: int | None
      description: Maximum number of records to return.
      default: null
    sysparm_offset:
      type: int | None
      description: Number of records to skip, for pagination.
      default: null
    sysparm_display_value:
      type: enum["true", "false", "all"] | None
      description: Return display values (true), actual values (false), or both (all).
      default: null
    sysparm_exclude_reference_link:
      type: bool | None
      description: Exclude Table API links for reference fields.
      default: null
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/now/table/incident
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
      params:
        sysparm_query: ${{ inputs.sysparm_query }}
        sysparm_fields: ${{ inputs.sysparm_fields }}
        sysparm_limit: ${{ inputs.sysparm_limit }}
        sysparm_offset: ${{ inputs.sysparm_offset }}
        sysparm_display_value: ${{ inputs.sysparm_display_value }}
        sysparm_exclude_reference_link: ${{ inputs.sysparm_exclude_reference_link }}
  returns: ${{ steps.request.result }}
