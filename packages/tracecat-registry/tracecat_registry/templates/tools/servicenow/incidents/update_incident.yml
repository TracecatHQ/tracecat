type: action
definition:
  title: Update incident
  description: Update incident fields with the Table API.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/c_TableAPI.html#table-PATCH
  namespace: tools.servicenow
  name: update_incident
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    sys_id:
      type: str
      description: sys_id of the incident.
    fields:
      type: dict[str, Any]
      description: 'Field values to update, keyed by field name, e.g. {"state": "2", "priority": "1"}.'
    sysparm_display_value:
      type: enum["true", "false", "all"] | None
      description: Return display values (true), actual values (false), or both (all).
      default: null
    sysparm_input_display_value:
      type: bool | None
      description: Set field values using display values instead of actual values.
      default: null
    sysparm_fields:
      type: str | None
      description: Comma-separated list of fields to return.
      default: null
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: build_body
    action: core.script.run_python
    args:
      inputs:
        fields: ${{ inputs.fields }}
        values: {}
      script: |
        def main(fields, values):
            body = dict(fields or {})
            body.update({k: v for k, v in values.items() if v is not None})
            return body
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/now/table/incident/${{ FN.url_encode(inputs.sys_id) }}
      method: PATCH
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
        Content-Type: application/json
      params:
        sysparm_display_value: ${{ inputs.sysparm_display_value }}
        sysparm_input_display_value: ${{ inputs.sysparm_input_display_value }}
        sysparm_fields: ${{ inputs.sysparm_fields }}
      payload: ${{ steps.build_body.result }}
  returns: ${{ steps.request.result }}
