type: action
definition:
  title: Get case
  description: Get a Customer Service Management case by sys_id or case number with the Case API.
  display_group: ServiceNow
  doc_url: https://www.servicenow.com/docs/r/api-reference/rest-apis/case-api.html#case-GET-case-id
  namespace: tools.servicenow
  name: get_case
  secrets:
  - type: oauth
    provider_id: servicenow
    grant_type: client_credentials
  expects:
    id:
      type: str
      description: sys_id or case number, e.g. CS0001001.
    sysparm_display_value:
      type: enum["true", "false", "all"] | None
      description: Return display values (true), actual values (false), or both (all).
      default: null
    base_url:
      type: str | None
      description: ServiceNow instance URL, e.g. https://<instance>.service-now.com. Defaults to the `servicenow.base_url` workspace variable.
      default: null
  steps:
  - ref: request
    action: core.http_request
    args:
      url: ${{ inputs.base_url || VARS.servicenow.base_url }}/api/sn_customerservice/case/${{ FN.url_encode(inputs.id) }}
      method: GET
      headers:
        Authorization: Bearer ${{ SECRETS.servicenow_oauth.SERVICENOW_SERVICE_TOKEN }}
        Accept: application/json
      params:
        sysparm_display_value: ${{ inputs.sysparm_display_value }}
  returns: ${{ steps.request.result }}
