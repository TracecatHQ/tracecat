type: action
definition:
  title: Get public secret incident
  description: >-
    Get a public secret incident. Calls GET /v1/public-incidents/secrets/{incident_id} directly.
  display_group: GitGuardian
  doc_url: https://api.gitguardian.com/docs#tag/Public-Secret-Incidents/operation/getPublicIncident
  namespace: tools.gitguardian
  name: get_public_secret_incident
  secrets:
    - name: gitguardian
      keys: ["GITGUARDIAN_API_KEY"]
  expects:
    incident_id:
      type: int
      description: The id of the incident to retrieve.
    privacy_mode:
      type: str | None
      description: "When set to `true`, sensitive values in the response are obfuscated (replaced with `<GG>OBFUSCATED</GG>`). Useful for sharing API responses without exposing sensitive data. Possible values: true, false."
      default: null
    base_url:
      type: str | None
      description: Base URL of the GitGuardian API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.gitguardian.base_url || "https://api.gitguardian.com" }}/v1/public-incidents/secrets/${{ FN.url_encode(inputs.incident_id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Token ${{ SECRETS.gitguardian.GITGUARDIAN_API_KEY }}
          X-Privacy-Mode: ${{ inputs.privacy_mode }}
  returns: ${{ steps.request.result }}
