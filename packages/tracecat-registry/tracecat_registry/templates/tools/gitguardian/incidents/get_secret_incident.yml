type: action
definition:
  title: Get secret incident
  description: >-
    Get a secret incident. Calls GET /v1/incidents/secrets/{incident_id} directly.
  display_group: GitGuardian
  doc_url: https://api.gitguardian.com/docs#tag/Internal-Secret-Incidents/operation/getIncident
  namespace: tools.gitguardian
  name: get_secret_incident
  secrets:
    - name: gitguardian
      keys: ["GITGUARDIAN_API_KEY"]
  expects:
    incident_id:
      type: int
      description: Secret incident ID.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the GitGuardian API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.gitguardian.base_url || "https://api.gitguardian.com" }}/v1/incidents/secrets/${{ FN.url_encode(inputs.incident_id) }}
        method: GET
        headers:
          Accept: application/json
          Authorization: Token ${{ SECRETS.gitguardian.GITGUARDIAN_API_KEY }}
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
