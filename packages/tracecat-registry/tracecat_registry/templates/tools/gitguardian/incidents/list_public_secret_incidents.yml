type: action
definition:
  title: List public secret incidents
  description: >-
    List public secret incidents. Calls GET /v1/public-incidents/secrets directly.
  display_group: GitGuardian
  doc_url: https://api.gitguardian.com/docs#tag/Public-Secret-Incidents/operation/listPublicIncidents
  namespace: tools.gitguardian
  name: list_public_secret_incidents
  secrets:
    - name: gitguardian
      keys: ["GITGUARDIAN_API_KEY"]
  expects:
    privacy_mode:
      type: str | None
      description: "When set to `true`, sensitive values in the response are obfuscated (replaced with `<GG>OBFUSCATED</GG>`). Useful for sharing API responses without exposing sensitive data. Possible values: true, false."
      default: null
    cursor:
      type: str | None
      description: Pagination cursor.
      default: null
    per_page:
      type: int | None
      description: Number of items to list per page.
      default: null
    date_before:
      type: str | None
      description: Entries found before this date.
      default: null
    date_after:
      type: str | None
      description: Entries found after this date.
      default: null
    triggered_at_before:
      type: str | None
      description: Incidents with triggered_at before this date.
      default: null
    triggered_at_after:
      type: str | None
      description: Incidents with triggered_at after this date.
      default: null
    assignee_email:
      type: str | None
      description: Public secret incidents assigned to this email.
      default: null
    assignee_id:
      type: int | None
      description: Public secret incidents assigned to this user id.
      default: null
    status:
      type: str | None
      description: "Public secret incidents with the following status. Possible values: IGNORED, TRIGGERED, ASSIGNED, RESOLVED."
      default: null
    severity:
      type: str | None
      description: "Filter public secret incidents by severity. Possible values: critical, high, medium, low, info, unknown."
      default: null
    validity:
      type: str | None
      description: "Public secret incident with the following validity. Possible values: valid, invalid, failed_to_check, no_checker, unknown."
      default: null
    tags:
      type: str | None
      description: Public secret incidents with one of the following tags. Use `NONE` if you want to filter incidents with no tags.
      default: null
    custom_tags:
      type: str | None
      description: Public secret incidents with one of the following custom tag ids. To retrieve incidents containing several custom tags at once, this query parameter should be used several times to intersect the results.
      default: null
    custom_tag_key:
      type: str | None
      description: Public secret incidents with the given custom tag key.
      default: null
    custom_tag_value:
      type: str | None
      description: Public secret incidents with the given custom tag value.
      default: null
    ordering:
      type: str | None
      description: "Sort the results by their field value. The default sort is ASC, DESC if the field is preceded by a '-'. Possible values: date, -date, resolved_at, -resolved_at, ignored_at, -ignored_at, risk_score, -risk_score."
      default: null
    detector_group_name:
      type: str | None
      description: Public secret incidents belonging to the specified detector group.
      default: null
    ignorer_id:
      type: int | None
      description: Public secret incidents ignored by this user id.
      default: null
    ignorer_api_token_id:
      type: str | None
      description: Public secret incidents ignored by this API token id.
      default: null
    resolver_id:
      type: int | None
      description: Public secret incidents resolved by this user id.
      default: null
    resolver_api_token_id:
      type: str | None
      description: Public secret incidents resolved by this API token id.
      default: null
    feedback:
      type: bool | None
      description: Public secret incidents with or without feedback.
      default: null
    declarative_secret_status:
      type: str | None
      description: "Public secret incidents with the following declarative secret status. Possible values: revoked, active, test_credential, false_positive, low_risk."
      default: null
    risk_score_min:
      type: int | None
      description: Incidents with risk score greater than value.
      default: null
    risk_score_max:
      type: int | None
      description: Incidents with risk score lesser than value.
      default: null
    base_url:
      type: str | None
      description: Base URL of the GitGuardian API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.gitguardian.base_url || "https://api.gitguardian.com" }}/v1/public-incidents/secrets
        method: GET
        headers:
          Accept: application/json
          Authorization: Token ${{ SECRETS.gitguardian.GITGUARDIAN_API_KEY }}
          X-Privacy-Mode: ${{ inputs.privacy_mode }}
        params:
          cursor: ${{ inputs.cursor }}
          per_page: ${{ inputs.per_page }}
          date_before: ${{ inputs.date_before }}
          date_after: ${{ inputs.date_after }}
          triggered_at_before: ${{ inputs.triggered_at_before }}
          triggered_at_after: ${{ inputs.triggered_at_after }}
          assignee_email: ${{ inputs.assignee_email }}
          assignee_id: ${{ inputs.assignee_id }}
          status: ${{ inputs.status }}
          severity: ${{ inputs.severity }}
          validity: ${{ inputs.validity }}
          tags: ${{ inputs.tags }}
          custom_tags: ${{ inputs.custom_tags }}
          custom_tag_key: ${{ inputs.custom_tag_key }}
          custom_tag_value: ${{ inputs.custom_tag_value }}
          ordering: ${{ inputs.ordering }}
          detector_group_name: ${{ inputs.detector_group_name }}
          ignorer_id: ${{ inputs.ignorer_id }}
          ignorer_api_token_id: ${{ inputs.ignorer_api_token_id }}
          resolver_id: ${{ inputs.resolver_id }}
          resolver_api_token_id: ${{ inputs.resolver_api_token_id }}
          feedback: ${{ inputs.feedback }}
          declarative_secret_status: ${{ inputs.declarative_secret_status }}
          risk_score_min: ${{ inputs.risk_score_min }}
          risk_score_max: ${{ inputs.risk_score_max }}
  returns: ${{ steps.request.result }}
