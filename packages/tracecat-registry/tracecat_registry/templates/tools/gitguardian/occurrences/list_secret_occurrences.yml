type: action
definition:
  title: List secret occurrences
  description: >-
    List secret occurrences. Calls GET /v1/occurrences/secrets directly.
  display_group: GitGuardian
  doc_url: https://api.gitguardian.com/docs#tag/Internal-Secret-Occurrences/operation/listOccurrences
  namespace: tools.gitguardian
  name: list_secret_occurrences
  secrets:
    - name: gitguardian
      keys: ["GITGUARDIAN_API_KEY"]
  expects:
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the GitGuardian API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.gitguardian.base_url || "https://api.gitguardian.com" }}/v1/occurrences/secrets
        method: GET
        headers:
          Accept: application/json
          Authorization: Token ${{ SECRETS.gitguardian.GITGUARDIAN_API_KEY }}
        params: ${{ inputs.params }}
  returns: ${{ steps.request.result }}
