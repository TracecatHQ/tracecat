type: action
definition:
  title: List secret occurrences
  description: >-
    List secret occurrences. Calls GET /v1/occurrences/secrets directly.
  display_group: GitGuardian
  doc_url: https://api.gitguardian.com/docs#tag/Internal-Secret-Occurrences/operation/listOccurrences
  namespace: tools.gitguardian
  name: list_secret_occurrences
  secrets:
    - name: gitguardian
      keys: ["GITGUARDIAN_API_KEY"]
  expects:
    cursor:
      type: str | None
      description: Pagination cursor.
      default: null
    page:
      type: int | None
      description: Page number.
      default: null
    per_page:
      type: int | None
      description: Number of items to list per page.
      default: null
    date_before:
      type: str | None
      description: Entries found before this date.
      default: null
    date_after:
      type: str | None
      description: Entries found after this date.
      default: null
    source_id:
      type: int | None
      description: Filter on the source ID.
      default: null
    source_name:
      type: str | None
      description: Entries matching this source name search.
      default: null
    source_type:
      type: str | None
      description: "Filter by source type. Possible values: bitbucket, bitbucket_cloud, github, gitlab, azure_devops, slack, jira_cloud, confluence_cloud, microsoft_teams, confluence_data_center, jira_data_center, aws_ecr, azure_cr, google_artifact, jfrog_artifact, docker_hub, servicenow, sharepoint_online, sharepoint_online_drive, sharepoint_online_pages, microsoft_onedrive, custom_source."
      default: null
    source_monitoring_status:
      type: str | None
      description: Keep only occurrences whose source's real-time monitoring status is one of the given (comma-separated) buckets. Requires the monitoring-status feature to be enabled for the workspace; otherwise the parameter is ignored.
      default: null
    incident_id:
      type: int | None
      description: Filter by incident ID.
      default: null
    incident_assignee_id:
      type: int | None
      description: Filter by incident assignee member ID.
      default: null
    presence:
      type: str | None
      description: "Entries that have the following presence status. Possible values: present, removed."
      default: null
    author_name:
      type: str | None
      description: Entries matching this author name search.
      default: null
    author_info:
      type: str | None
      description: Entries matching this author email search.
      default: null
    sha:
      type: str | None
      description: Entries starting with the commit sha search string.
      default: null
    filepath:
      type: str | None
      description: Entries matching this filepath search.
      default: null
    severity:
      type: str | None
      description: "Filter occurrences by the severity of their related incident. Can specify multiple values separated by commas. Possible values: critical, high, medium, low, info, unknown."
      default: null
    status:
      type: str | None
      description: "Filter occurrences by the status of their related incident. Can specify multiple values separated by commas. Possible values: IGNORED, TRIGGERED, ASSIGNED, RESOLVED."
      default: null
    validity:
      type: str | None
      description: "Filter occurrences by the validity of their related secret. Can specify multiple values separated by commas. Possible values: valid, invalid, failed_to_check, no_checker, unknown."
      default: null
    tags:
      type: str | None
      description: Occurrences with one of the following tags. Use `NONE` if you want to filter occurrences with no tags.
      default: null
    exclude_tags:
      type: str | None
      description: Exclude occurrences with any of the following tags (comma-separated). Use `NONE` to exclude occurrences with no tags.
      default: null
    ordering:
      type: str | None
      description: "Sort the results by their field value. The default sort is ASC, DESC if the field is preceded by a '-'. Possible values: date, -date."
      default: null
    base_url:
      type: str | None
      description: Base URL of the GitGuardian API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.gitguardian.base_url || "https://api.gitguardian.com" }}/v1/occurrences/secrets
        method: GET
        headers:
          Accept: application/json
          Authorization: Token ${{ SECRETS.gitguardian.GITGUARDIAN_API_KEY }}
        params:
          cursor: ${{ inputs.cursor }}
          page: ${{ inputs.page }}
          per_page: ${{ inputs.per_page }}
          date_before: ${{ inputs.date_before }}
          date_after: ${{ inputs.date_after }}
          source_id: ${{ inputs.source_id }}
          source_name: ${{ inputs.source_name }}
          source_type: ${{ inputs.source_type }}
          source_monitoring_status: ${{ inputs.source_monitoring_status }}
          incident_id: ${{ inputs.incident_id }}
          incident_assignee_id: ${{ inputs.incident_assignee_id }}
          presence: ${{ inputs.presence }}
          author_name: ${{ inputs.author_name }}
          author_info: ${{ inputs.author_info }}
          sha: ${{ inputs.sha }}
          filepath: ${{ inputs.filepath }}
          severity: ${{ inputs.severity }}
          status: ${{ inputs.status }}
          validity: ${{ inputs.validity }}
          tags: ${{ inputs.tags }}
          exclude_tags: ${{ inputs.exclude_tags }}
          ordering: ${{ inputs.ordering }}
  returns: ${{ steps.request.result }}
