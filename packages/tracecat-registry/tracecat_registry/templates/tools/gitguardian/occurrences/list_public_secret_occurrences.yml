type: action
definition:
  title: List public secret occurrences
  description: >-
    List public secret occurrences. Calls GET
    /v1/public-incidents/secrets/{incident_id}/occurrences directly.
  display_group: GitGuardian
  doc_url: https://api.gitguardian.com/docs#tag/Public-Secret-Occurrences/operation/listPublicOccurrences
  namespace: tools.gitguardian
  name: list_public_secret_occurrences
  secrets:
    - name: gitguardian
      keys: ["GITGUARDIAN_API_KEY"]
  expects:
    incident_id:
      type: int
      description: The id of the incident to retrieve.
    cursor:
      type: str | None
      description: Pagination cursor.
      default: null
    per_page:
      type: int | None
      description: Number of items to list per page.
      default: null
    date_before:
      type: str | None
      description: Entries found before this date.
      default: null
    date_after:
      type: str | None
      description: Entries found after this date.
      default: null
    source_id:
      type: int | None
      description: Filter on the source ID.
      default: null
    presence:
      type: str | None
      description: "Entries that have the following presence status. Possible values: present, removed, unknown."
      default: null
    sha:
      type: str | None
      description: Entries starting with the commit sha search string.
      default: null
    filepath:
      type: str | None
      description: Entries matching this filepath search.
      default: null
    attachment_reason:
      type: str | None
      description: "Occurrences with one of the following attachment reasons. Possible values: by_dev_from_perimeter, on_github_org_in_perimeter, from_secret_grasper."
      default: null
    severity:
      type: str | None
      description: "Filter occurrences by the severity of their related incident. Can specify multiple values separated by commas. Possible values: critical, high, medium, low, info, unknown."
      default: null
    status:
      type: str | None
      description: "Filter occurrences by the status of their related incident. Can specify multiple values separated by commas. Possible values: IGNORED, TRIGGERED, ASSIGNED, RESOLVED."
      default: null
    validity:
      type: str | None
      description: "Filter occurrences by the validity of their related secret. Can specify multiple values separated by commas. Possible values: valid, invalid, failed_to_check, no_checker, unknown."
      default: null
    tags:
      type: str | None
      description: Public secret incidents with one of the following tags. Use `NONE` if you want to filter incidents with no tags.
      default: null
    ordering:
      type: str | None
      description: "Sort the results by their field value. The default sort is ASC, DESC if the field is preceded by a '-'. Possible values: id, -id, date, -date."
      default: null
    base_url:
      type: str | None
      description: Base URL of the GitGuardian API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.gitguardian.base_url || "https://api.gitguardian.com" }}/v1/public-incidents/secrets/${{ FN.url_encode(inputs.incident_id) }}/occurrences
        method: GET
        headers:
          Accept: application/json
          Authorization: Token ${{ SECRETS.gitguardian.GITGUARDIAN_API_KEY }}
        params:
          cursor: ${{ inputs.cursor }}
          per_page: ${{ inputs.per_page }}
          date_before: ${{ inputs.date_before }}
          date_after: ${{ inputs.date_after }}
          source_id: ${{ inputs.source_id }}
          presence: ${{ inputs.presence }}
          sha: ${{ inputs.sha }}
          filepath: ${{ inputs.filepath }}
          attachment_reason: ${{ inputs.attachment_reason }}
          severity: ${{ inputs.severity }}
          status: ${{ inputs.status }}
          validity: ${{ inputs.validity }}
          tags: ${{ inputs.tags }}
          ordering: ${{ inputs.ordering }}
  returns: ${{ steps.request.result }}
