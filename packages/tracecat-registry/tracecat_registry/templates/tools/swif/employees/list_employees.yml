type: action
definition:
  title: List employees
  description: >-
    List employees (device owners) in the organization, optionally filtered by primary team.
    Calls GET /restful/organization/employees.
  display_group: Swif.ai (UEM)
  doc_url: https://help.swif.ai/en/articles/9341271-public-apis-device-and-evidence-retrieval
  namespace: tools.swif
  name: list_employees
  secrets:
    - name: swif
      keys: ["SWIF_API_KEY"]
  expects:
    q:
      type: str | None
      description: Search query to filter employees.
      default: null
    teamId:
      type: str | None
      description: >-
        Only return employees whose primary team is this team (24-character hexadecimal team
        ID).
      default: null
    offset:
      type: int | None
      description: Number of records to skip. Swif defaults to 0.
      default: null
    limit:
      type: int | None
      description: Maximum number of records to return. Swif defaults to 10.
      default: null
    base_url:
      type: str | None
      description: >-
        Swif API base URL. Defaults to https://api.swifteam.com (global tenants). Use
        https://api.eu.swifteam.com for EU tenants.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.swif.base_url || "https://api.swifteam.com" }}/restful/organization/employees
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.swif.SWIF_API_KEY }}
        params:
          q: ${{ inputs.q }}
          teamId: ${{ inputs.teamId }}
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.request.result }}
