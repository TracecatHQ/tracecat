type: action
definition:
  title: List device extension attributes
  description: >-
    Retrieve custom extension attributes (device metadata such as tags or risk labels) for a
    device. Calls GET /restful/organization/deviceExtensionAttributes.
  display_group: Swif.ai (UEM)
  doc_url: https://help.swif.ai/en/articles/13172920-public-apis-how-to-edit-device-extension-attributes
  namespace: tools.swif
  name: list_device_extension_attributes
  secrets:
    - name: swif
      keys: ["SWIF_API_KEY"]
  expects:
    ids:
      type: str
      description: Swif device ID to retrieve extension attributes for.
    offset:
      type: int | None
      description: Number of records to skip.
      default: null
    limit:
      type: int | None
      description: Maximum number of records to return.
      default: null
    base_url:
      type: str | None
      description: >-
        Swif API base URL. Defaults to https://api.swifteam.com (global tenants). Use
        https://api.eu.swifteam.com for EU tenants.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.swif.base_url || "https://api.swifteam.com" }}/restful/organization/deviceExtensionAttributes
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.swif.SWIF_API_KEY }}
        params:
          ids: ${{ inputs.ids }}
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.request.result }}
