type: action
definition:
  title: List devices
  description: >-
    List managed devices with inventory and security evidence, including Swif's compliance
    verdict (isCompliant, nonComplianceReasons, failingComplianceChecks), osquery device
    information, hardware, network, owner, and policy state. Calls GET
    /restful/organization/devices.
  display_group: Swif.ai (UEM)
  doc_url: https://help.swif.ai/en/articles/9341271-public-apis-device-and-evidence-retrieval
  namespace: tools.swif
  name: list_devices
  secrets:
    - name: swif
      keys: ["SWIF_API_KEY"]
  expects:
    q:
      type: str | None
      description: Search query, for example a device serial number.
      default: null
    teamId:
      type: str | None
      description: >-
        Only return devices in this team (24-character hexadecimal team ID). Use List teams
        to look up team IDs.
      default: null
    offset:
      type: int | None
      description: Number of records to skip. Swif defaults to 0.
      default: null
    limit:
      type: int | None
      description: Maximum number of records to return. Swif defaults to 10.
      default: null
    base_url:
      type: str | None
      description: >-
        Swif API base URL. Defaults to https://api.swifteam.com (global tenants). Use
        https://api.eu.swifteam.com for EU tenants.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.swif.base_url || "https://api.swifteam.com" }}/restful/organization/devices
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.swif.SWIF_API_KEY }}
        params:
          q: ${{ inputs.q }}
          teamId: ${{ inputs.teamId }}
          offset: ${{ inputs.offset }}
          limit: ${{ inputs.limit }}
  returns: ${{ steps.request.result }}
