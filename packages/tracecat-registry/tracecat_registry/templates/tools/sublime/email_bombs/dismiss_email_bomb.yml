type: action
definition:
  title: Dismiss email bomb
  description: Dismiss a Sublime email-bomb incident.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/dismissemailbomb
  namespace: tools.sublime
  name: dismiss_email_bomb
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    id:
      type: str
      description: Email bomb ID.
    payload:
      # Generic: this endpoint rejects an explicit null on optional body fields,
      # and a literal payload map cannot omit an unset optional.
      type: dict[str, Any]
      description: >-
        API-native request body. Documented fields: review_comment.
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/messages/bombs/${{ FN.url_encode(inputs.id) }}/dismiss
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
