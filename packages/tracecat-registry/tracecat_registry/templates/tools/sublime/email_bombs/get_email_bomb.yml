type: action
definition:
  title: Get email bomb
  description: Retrieve a Sublime email-bomb incident.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/getemailbomb
  namespace: tools.sublime
  name: get_email_bomb
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    id:
      type: str
      description: Email bomb ID.
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/messages/bombs/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
