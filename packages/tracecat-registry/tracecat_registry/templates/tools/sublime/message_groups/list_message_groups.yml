type: action
definition:
  title: List message groups
  description: List Sublime message groups using API-native filters.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/listmessagegroups-1
  namespace: tools.sublime
  name: list_message_groups
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/message-groups
        method: GET
        params: ${{ inputs.params }}
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
