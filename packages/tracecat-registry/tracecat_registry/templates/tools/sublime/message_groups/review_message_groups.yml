type: action
definition:
  title: Review message groups
  description: Review, classify, and take actions on Sublime message groups.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/reviewmessagegroups
  namespace: tools.sublime
  name: review_message_groups
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    payload:
      # Generic: this endpoint rejects an explicit null on optional body fields,
      # and a literal payload map cannot omit an unset optional.
      type: dict[str, Any]
      description: >-
        API-native request body. Documented fields: classification (required), message_group_ids (required), action, custom_action_ids, generate_asa_lesson, review_comment, share_with_sublime.
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/message-groups/review
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
