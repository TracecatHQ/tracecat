type: action
definition:
  title: Restore multiple message groups
  description: Restore multiple Sublime message groups.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/restoremultiplemessagegroups-1
  namespace: tools.sublime
  name: restore_multiple_message_groups
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    payload:
      # Generic: this endpoint rejects an explicit null on optional body fields,
      # and a literal payload map cannot omit an unset optional.
      type: dict[str, Any]
      description: >-
        API-native request body. Documented fields: message_group_ids (required), classification, report_label, review_comment.
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/message-groups/restore
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
