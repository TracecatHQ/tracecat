type: action
definition:
  title: Get BinExplode scan
  description: Retrieve the current status and results of a Sublime BinExplode task.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/getscan-1
  namespace: tools.sublime
  name: get_binexplode_scan
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    id:
      type: str
      description: BinExplode task ID.
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/binexplode/scan/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
