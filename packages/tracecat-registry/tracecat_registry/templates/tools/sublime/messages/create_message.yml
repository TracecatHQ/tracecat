type: action
definition:
  title: Create message
  description: Create a Sublime message data model from a raw message.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/createmessage
  namespace: tools.sublime
  name: create_message
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    payload:
      type: dict[str, Any]
      description: API-native JSON request body.
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/messages/create
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
