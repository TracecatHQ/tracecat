type: action
definition:
  title: Render attachment image
  description: Render images from a base64-encoded raw attachment.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/getmessageattachmentimageraw-1
  namespace: tools.sublime
  name: get_message_attachment_image_raw
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    payload:
      type: dict[str, Any]
      description: API-native JSON request body.
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/messages/attachment/image
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
