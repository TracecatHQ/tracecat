type: action
definition:
  title: Get message data model
  description: Retrieve the Message Data Model for a Sublime message.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/getmessagedatamodel-1
  namespace: tools.sublime
  name: get_message_data_model
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    id:
      type: str
      description: Sublime message ID.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/messages/${{ FN.url_encode(inputs.id) }}/message_data_model
        method: GET
        params: ${{ inputs.params }}
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
