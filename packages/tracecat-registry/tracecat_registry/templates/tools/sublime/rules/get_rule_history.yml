type: action
definition:
  title: Get rule history
  description: Retrieve history for a Sublime rule.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/getrulehistory
  namespace: tools.sublime
  name: get_rule_history
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    id:
      type: str
      description: Sublime rule ID.
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/rules/${{ FN.url_encode(inputs.id) }}/rule-history
        method: GET
        params: ${{ inputs.params }}
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
