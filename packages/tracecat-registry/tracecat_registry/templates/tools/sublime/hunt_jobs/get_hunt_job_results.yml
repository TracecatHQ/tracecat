type: action
definition:
  title: Get hunt job results
  description: Retrieve detailed results for a Sublime hunt job.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/gethuntjobresults
  namespace: tools.sublime
  name: get_hunt_job_results
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    id:
      type: str
      description: Hunt job ID.
    limit:
      type: int | None
      description: The maximum number of results to return.
      default: null
    offset:
      type: int | None
      description: The (zero-based) offset of the first hunt job results to return.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/hunt-jobs/${{ FN.url_encode(inputs.id) }}/results
        method: GET
        params:
          limit: ${{ inputs.limit }}
          offset: ${{ inputs.offset }}
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
