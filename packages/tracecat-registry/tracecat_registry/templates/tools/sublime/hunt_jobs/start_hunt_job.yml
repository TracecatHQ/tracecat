type: action
definition:
  title: Start hunt job
  description: Start an asynchronous Sublime hunt job.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/starthuntjob
  namespace: tools.sublime
  name: start_hunt_job
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    payload:
      type: dict[str, Any]
      description: API-native JSON request body.
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/hunt-jobs
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
        payload: ${{ inputs.payload }}
  returns: ${{ steps.request.result.data }}
