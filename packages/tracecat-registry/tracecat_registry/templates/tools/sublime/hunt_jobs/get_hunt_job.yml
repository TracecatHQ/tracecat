type: action
definition:
  title: Get hunt job
  description: Retrieve the current state and summary of a Sublime hunt job.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/gethuntjob
  namespace: tools.sublime
  name: get_hunt_job
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    id:
      type: str
      description: Hunt job ID.
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/hunt-jobs/${{ FN.url_encode(inputs.id) }}
        method: GET
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
