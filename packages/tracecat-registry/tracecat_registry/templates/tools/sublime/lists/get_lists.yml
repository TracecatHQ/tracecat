type: action
definition:
  title: Get lists
  description: Retrieve Sublime lists using API-native filters.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/getlists-1
  namespace: tools.sublime
  name: get_lists
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/lists
        method: GET
        params: ${{ inputs.params }}
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
