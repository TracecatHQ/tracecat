type: action
definition:
  title: Get lists
  description: Retrieve Sublime lists using API-native filters.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/getlists-1
  namespace: tools.sublime
  name: get_lists
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    entry_type:
      type: str
      description: List type to filter by. One of 'string', 'user_group', 'provider_org_unit'.
    id:
      type: str | None
      description: Optional ID (exact match) to filter by
      default: null
    name:
      type: str | None
      description: Optional name (exact match) to filter by
      default: null
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/lists
        method: GET
        params:
          entry_type: ${{ inputs.entry_type }}
          id: ${{ inputs.id }}
          name: ${{ inputs.name }}
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
