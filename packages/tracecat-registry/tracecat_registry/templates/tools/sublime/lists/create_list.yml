type: action
definition:
  title: Create list
  description: Create a Sublime list.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/createlist-1
  namespace: tools.sublime
  name: create_list
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    name:
      type: str
      description: Unique name used to reference the list in MQL
    description:
      type: str
      description: Description of list
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/lists
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
        payload:
          name: ${{ inputs.name }}
          description: ${{ inputs.description }}
  returns: ${{ steps.request.result.data }}
