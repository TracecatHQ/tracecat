type: action
definition:
  title: Set list entries
  description: Replace all entries in a Sublime list.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/setlistentries-1
  namespace: tools.sublime
  name: set_list_entries
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    id:
      type: str
      description: List ID.
    entries:
      type: list[str]
      description: List entries
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/lists/${{ FN.url_encode(inputs.id) }}/entries
        method: PUT
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
        payload:
          entries: ${{ inputs.entries }}
  returns: ${{ steps.request.result.data }}
