type: action
definition:
  title: Delete list entry
  description: Delete an entry from a Sublime list.
  display_group: Sublime
  doc_url: https://docs.sublime.security/reference/deletelistentry-1
  namespace: tools.sublime
  name: delete_list_entry
  secrets:
    - name: sublime
      keys: ["SUBLIME_API_KEY"]
  expects:
    id:
      type: str
      description: List ID.
    string:
      type: str
      description: String list entry
    base_url:
      type: str | None
      description: Base URL of the Sublime API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.sublime.base_url }}/v0/lists/${{ FN.url_encode(inputs.id) }}/entries/entry
        method: DELETE
        params:
          string: ${{ inputs.string }}
        headers:
          Authorization: Bearer ${{ SECRETS.sublime.SUBLIME_API_KEY }}
  returns: ${{ steps.request.result.data }}
