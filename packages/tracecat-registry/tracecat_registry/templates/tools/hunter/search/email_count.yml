type: action
definition:
  title: Email count
  description: Count email addresses. Calls GET /v2/email-count directly.
  display_group: Hunter.io
  doc_url: https://hunter.io/api-documentation#email-count
  namespace: tools.hunter
  name: email_count
  secrets:
    - name: hunter
      keys: ["HUNTER_API_KEY"]
  expects:
    params:
      type: dict[str, Any] | None
      description: API-native query parameters.
      default: null
    base_url:
      type: str | None
      description: Base URL of the Hunter API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.hunter.base_url || "https://api.hunter.io" }}/v2/email-count
        method: GET
        headers:
          Accept: application/json
        params: '${{ FN.merge([{"api_key": SECRETS.hunter.HUNTER_API_KEY}, inputs.params || {}]) }}'
  returns: ${{ steps.request.result }}
