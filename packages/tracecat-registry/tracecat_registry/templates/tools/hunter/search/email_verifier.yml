type: action
definition:
  title: Email verifier
  description: Verify an email address. Calls GET /v2/email-verifier directly.
  display_group: Hunter.io
  doc_url: https://hunter.io/api-documentation#email-verifier
  namespace: tools.hunter
  name: email_verifier
  secrets:
    - name: hunter
      keys: ["HUNTER_API_KEY"]
  expects:
    email:
      type: str
      description: The email address you want to verify.
    base_url:
      type: str | None
      description: Base URL of the Hunter API.
      default: null
  steps:
    - ref: request
      action: core.http_request
      args:
        url: ${{ inputs.base_url || VARS.hunter.base_url || "https://api.hunter.io" }}/v2/email-verifier
        method: GET
        headers:
          Accept: application/json
          X-API-KEY: ${{ SECRETS.hunter.HUNTER_API_KEY }}
        params:
          email: ${{ inputs.email }}
  returns: ${{ steps.request.result }}
