type: action
definition:
  title: Batch update document
  description: Apply multiple updates to a Google Doc in a single request.
  display_group: Google Docs
  doc_url: https://developers.google.com/workspace/docs/api/reference/rest/v1/documents/batchUpdate
  namespace: tools.google_docs
  name: batch_update_document
  secrets:
    - type: oauth
      provider_id: google_docs
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_docs
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    document_id:
      type: str
      description: ID of the document to update.
    requests:
      # Generic: the vendor's Request body is a discriminated union of ~40 request
      # kinds, so there is no single field set to name.
      type: list[dict[str, Any]]
      description: List of Docs API request objects to apply.
    write_control:
      # Generic: WriteControl is a one-of (requiredRevisionId | targetRevisionId) and
      # the vendor rejects an explicit null on either field.
      type: dict[str, Any] | None
      description: Optional write control configuration (e.g., requiredRevisionId).
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          document_id: ${{ inputs.document_id }}
          requests: ${{ inputs.requests }}
          write_control: ${{ inputs.write_control }}
        script: |
          def main(document_id, requests, write_control):
              if not requests:
                  raise ValueError("At least one request is required.")

              body = {"requests": requests}
              if write_control:
                  body["writeControl"] = write_control
              return {"documentId": document_id, "body": body}
    - ref: batch_update_document
      action: tools.google_api.call_api
      args:
        service_name: docs
        version: v1
        resource: documents
        method_name: batchUpdate
        access_token: ${{ SECRETS.google_docs_oauth.GOOGLE_DOCS_USER_TOKEN || SECRETS.google_docs_oauth.GOOGLE_DOCS_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/documents"]
        params: ${{ steps.build_payload.result }}
  returns: ${{ steps.batch_update_document.result }}
