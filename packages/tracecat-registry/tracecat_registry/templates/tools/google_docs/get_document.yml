type: action
definition:
  title: Get document
  description: Retrieve a Google Doc with optional suggestions view mode.
  display_group: Google Docs
  doc_url: https://developers.google.com/workspace/docs/api/reference/rest/v1/documents/get
  namespace: tools.google_docs
  name: get_document
  secrets:
    - type: oauth
      provider_id: google_docs
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_docs
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    document_id:
      type: str
      description: ID of the document to fetch.
    suggestions_view_mode:
      type: enum["DEFAULT_FOR_FIELD", "SUGGESTIONS_INLINE", "PREVIEW_WITHOUT_SUGGESTIONS"] | None
      description: How to display suggestions in the response.
      default: null
  steps:
    - ref: build_params
      action: core.script.run_python
      args:
        inputs:
          document_id: ${{ inputs.document_id }}
          suggestions_view_mode: ${{ inputs.suggestions_view_mode }}
        script: |
          def main(document_id, suggestions_view_mode):
              params = {"documentId": document_id}
              if suggestions_view_mode:
                  params["suggestionsViewMode"] = suggestions_view_mode
              return params
    - ref: get_document
      action: tools.google_api.call_api
      args:
        service_name: docs
        version: v1
        resource: documents
        method_name: get
        access_token: ${{ SECRETS.google_docs_oauth.GOOGLE_DOCS_USER_TOKEN || SECRETS.google_docs_oauth.GOOGLE_DOCS_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/documents.readonly"]
        params: ${{ steps.build_params.result }}
  returns: ${{ steps.get_document.result }}
