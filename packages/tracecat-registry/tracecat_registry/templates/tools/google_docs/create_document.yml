type: action
definition:
  title: Create document
  description: Create a new Google Doc.
  display_group: Google Docs
  doc_url: https://developers.google.com/workspace/docs/api/reference/rest/v1/documents/create
  namespace: tools.google_docs
  name: create_document
  secrets:
    - type: oauth
      provider_id: google_docs
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_docs
      grant_type: client_credentials
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    title:
      type: str | None
      description: Optional document title.
      default: null
  steps:
    - ref: build_payload
      action: core.script.run_python
      args:
        inputs:
          title: ${{ inputs.title }}
        script: |
          def main(title):
              body = {}
              if title:
                  body["title"] = title
              return {"body": body}
    - ref: create_document
      action: tools.google_api.call_api
      args:
        service_name: docs
        version: v1
        resource: documents
        method_name: create
        access_token: ${{ SECRETS.google_docs_oauth.GOOGLE_DOCS_USER_TOKEN || SECRETS.google_docs_oauth.GOOGLE_DOCS_SERVICE_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/documents"]
        params: ${{ steps.build_payload.result }}
  returns: ${{ steps.create_document.result }}
