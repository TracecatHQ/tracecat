type: action
definition:
  title: Create alert feedback
  description: >-
    Creates new feedback for an alert. Attempting to create a feedback for a non-existent alert
    returns `NOT_FOUND` error. Attempting to create a feedback for an alert that is marked for
    deletion returns `FAILED_PRECONDITION` error.
  display_group: Google Workspace Alert Center
  doc_url: https://developers.google.com/workspace/admin/alertcenter/reference/rest/v1beta1/alerts.feedback/create
  namespace: tools.google_alert_center
  name: create_alert_feedback
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    alert_id:
      type: str
      description: The identifier of the alert this feedback belongs to.
    type:
      type: str
      description: >-
        The type of the feedback. One of `NOT_USEFUL` (the alert report is not useful),
        `SOMEWHAT_USEFUL` (the alert report is somewhat useful) or `VERY_USEFUL` (the alert report
        is very useful).
    customer_id:
      type: str | None
      description: >-
        The unique identifier of the Google Workspace account of the customer the alert is
        associated with. The `customerId` must have the initial "C" stripped (for example,
        `046psxkn`). Inferred from the caller identity if not provided.
      default: null
  steps:
    - ref: build_body
      action: core.script.run_python
      args:
        inputs:
          feedback_type: ${{ inputs.type }}
        script: |
          def main(feedback_type):
              # `type` is the only writable field on AlertFeedback; every other
              # field on the resource is output only.
              return {"type": feedback_type}
    - ref: create_alert_feedback
      action: tools.google_api.call_api
      args:
        service_name: alertcenter
        version: v1beta1
        resource: alerts.feedback
        method_name: create
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/apps.alerts"]
        params:
          alertId: ${{ inputs.alert_id }}
          customerId: ${{ inputs.customer_id }}
          body: ${{ steps.build_body.result }}
  returns: ${{ steps.create_alert_feedback.result }}
