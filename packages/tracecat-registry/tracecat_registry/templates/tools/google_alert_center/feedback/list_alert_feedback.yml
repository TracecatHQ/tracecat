type: action
definition:
  title: List alert feedback
  description: >-
    Lists all the feedback for an alert. Attempting to list feedbacks for a non-existent alert
    returns `NOT_FOUND` error.
  display_group: Google Workspace Alert Center
  doc_url: https://developers.google.com/workspace/admin/alertcenter/reference/rest/v1beta1/alerts.feedback/list
  namespace: tools.google_alert_center
  name: list_alert_feedback
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    alert_id:
      type: str
      description: The alert identifier. The "-" wildcard could be used to represent all alerts.
    customer_id:
      type: str | None
      description: >-
        The unique identifier of the Google Workspace account of the customer the alert is
        associated with. The `customerId` must have the initial "C" stripped (for example,
        `046psxkn`). Inferred from the caller identity if not provided.
      default: null
    filter:
      type: str | None
      description: >-
        A query string for filtering alert feedback results. Supported filter fields are `alertId`
        and `feedbackId`, for example `alertId = alertId01 AND feedbackId = feedbackId01`.
      default: null
  steps:
    - ref: list_alert_feedback
      action: tools.google_api.call_api
      args:
        service_name: alertcenter
        version: v1beta1
        resource: alerts.feedback
        method_name: list
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/apps.alerts"]
        params:
          alertId: ${{ inputs.alert_id }}
          customerId: ${{ inputs.customer_id }}
          filter: ${{ inputs.filter }}
  returns: ${{ steps.list_alert_feedback.result }}
