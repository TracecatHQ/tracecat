type: action
definition:
  title: Delete alert
  description: >-
    Marks the specified alert for deletion. An alert that has been marked for deletion is removed
    from Alert Center after 30 days. Marking an alert for deletion has no effect on an alert which
    has already been marked for deletion. Attempting to mark a nonexistent alert for deletion
    results in a `NOT_FOUND` error.
  display_group: Google Workspace Alert Center
  doc_url: https://developers.google.com/workspace/admin/alertcenter/reference/rest/v1beta1/alerts/delete
  namespace: tools.google_alert_center
  name: delete_alert
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    alert_id:
      type: str
      description: The identifier of the alert to delete.
    customer_id:
      type: str | None
      description: >-
        The unique identifier of the Google Workspace account of the customer the alert is
        associated with. The `customerId` must have the initial "C" stripped (for example,
        `046psxkn`). Inferred from the caller identity if not provided.
      default: null
  steps:
    - ref: delete_alert
      action: tools.google_api.call_api
      args:
        service_name: alertcenter
        version: v1beta1
        resource: alerts
        method_name: delete
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/apps.alerts"]
        params:
          alertId: ${{ inputs.alert_id }}
          customerId: ${{ inputs.customer_id }}
  returns: ${{ steps.delete_alert.result }}
