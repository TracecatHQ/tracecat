type: action
definition:
  title: Undelete alert
  description: >-
    Restores, or "undeletes", an alert that was marked for deletion within the past 30 days.
    Attempting to undelete an alert which was marked for deletion over 30 days ago (which has been
    removed from the Alert Center database) or a nonexistent alert returns a `NOT_FOUND` error.
    Attempting to undelete an alert which has not been marked for deletion has no effect.
  display_group: Google Workspace Alert Center
  doc_url: https://developers.google.com/workspace/admin/alertcenter/reference/rest/v1beta1/alerts/undelete
  namespace: tools.google_alert_center
  name: undelete_alert
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    alert_id:
      type: str
      description: The identifier of the alert to undelete.
    customer_id:
      type: str | None
      description: >-
        The unique identifier of the Google Workspace account of the customer the alert is
        associated with. The `customerId` must have the initial "C" stripped (for example,
        `046psxkn`). Inferred from the caller identity if not provided. This method takes the
        customer in the request body, not as a query parameter.
      default: null
  steps:
    - ref: build_body
      action: core.script.run_python
      args:
        inputs:
          customer_id: ${{ inputs.customer_id }}
        script: |
          def main(customer_id):
              # Values nested inside `body` are not null-pruned, so omit an unset
              # `customerId` here rather than sending an explicit null.
              body = {}
              if customer_id is not None:
                  body["customerId"] = customer_id
              return body
    - ref: undelete_alert
      action: tools.google_api.call_api
      args:
        service_name: alertcenter
        version: v1beta1
        resource: alerts
        method_name: undelete
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/apps.alerts"]
        params:
          alertId: ${{ inputs.alert_id }}
          body: ${{ steps.build_body.result }}
  returns: ${{ steps.undelete_alert.result }}
