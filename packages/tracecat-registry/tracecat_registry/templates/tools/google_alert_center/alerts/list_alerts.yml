type: action
definition:
  title: List alerts
  description: Lists the alerts.
  display_group: Google Workspace Alert Center
  doc_url: https://developers.google.com/workspace/admin/alertcenter/reference/rest/v1beta1/alerts/list
  namespace: tools.google_alert_center
  name: list_alerts
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer_id:
      type: str | None
      description: >-
        The unique identifier of the Google Workspace account of the customer the alerts are
        associated with. The `customerId` must have the initial "C" stripped (for example,
        `046psxkn`). Inferred from the caller identity if not provided.
      default: null
    filter:
      type: str | None
      description: >-
        A query string for filtering alert results. Supported filter fields are `alertId`, `type`,
        `source`, `createTime`, `startTime` and `endTime`; the time fields take an RFC 3339
        date-time string, for example `createTime >= "2018-04-05T00:00:00Z"`.
      default: null
    order_by:
      type: str | None
      description: >-
        The sort order of the list results. If not specified results may be returned in arbitrary
        order. Currently supported sorting are `createTime asc`, `createTime desc`,
        `updateTime desc`.
      default: null
    page_size:
      type: int | None
      description: >-
        The requested page size. Server may return fewer items than requested. If unspecified,
        server picks an appropriate default.
      default: null
    page_token:
      type: str | None
      description: >-
        A token identifying a page of results the server should return. If empty, a new iteration
        is started. To continue an iteration, pass in the value from the previous
        ListAlertsResponse's `nextPageToken` field.
      default: null
  steps:
    - ref: list_alerts
      action: tools.google_api.call_api
      args:
        service_name: alertcenter
        version: v1beta1
        resource: alerts
        method_name: list
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/apps.alerts"]
        params:
          customerId: ${{ inputs.customer_id }}
          filter: ${{ inputs.filter }}
          orderBy: ${{ inputs.order_by }}
          pageSize: ${{ inputs.page_size }}
          pageToken: ${{ inputs.page_token }}
  returns: ${{ steps.list_alerts.result }}
