type: action
definition:
  title: Get alert metadata
  description: >-
    Returns the metadata of an alert. Attempting to get metadata for a non-existent alert returns
    `NOT_FOUND` error.
  display_group: Google Workspace Alert Center
  doc_url: https://developers.google.com/workspace/admin/alertcenter/reference/rest/v1beta1/alerts/getMetadata
  namespace: tools.google_alert_center
  name: get_alert_metadata
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    alert_id:
      type: str
      description: The identifier of the alert this metadata belongs to.
    customer_id:
      type: str | None
      description: >-
        The unique identifier of the Google Workspace account of the customer the alert metadata is
        associated with. The `customerId` must have the initial "C" stripped (for example,
        `046psxkn`). Inferred from the caller identity if not provided.
      default: null
  steps:
    - ref: get_alert_metadata
      action: tools.google_api.call_api
      args:
        service_name: alertcenter
        version: v1beta1
        resource: alerts
        method_name: getMetadata
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/apps.alerts"]
        params:
          alertId: ${{ inputs.alert_id }}
          customerId: ${{ inputs.customer_id }}
  returns: ${{ steps.get_alert_metadata.result }}
