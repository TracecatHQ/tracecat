type: action
definition:
  title: Resolve policies
  description: >-
    Gets the resolved policy values for a list of policies that match a search query. Use it to
    check whether an extension is blocked and which org unit the value comes from.
  display_group: Google Chrome Policy
  doc_url: https://developers.google.com/chrome/policy/reference/rest/v1/customers.policies/resolve
  namespace: tools.google_chrome_policy
  name: resolve_policies
  secrets:
    - type: oauth
      provider_id: google_admin
      grant_type: authorization_code
      optional: true
    - type: oauth
      provider_id: google_admin
      grant_type: client_credentials
      optional: true
    - name: google_api
      keys: ["GOOGLE_API_CREDENTIALS"]
      optional_keys: ["GOOGLE_API_SUBJECT"]
      optional: true
  expects:
    customer:
      type: str
      description: >-
        ID of the Google Workspace account or literal "my_customer" for the customer associated to
        the request.
      default: my_customer
    policy_schema_filter:
      type: str
      description: >-
        The schema filter to apply to the resolve request. Specify a schema name to view a
        particular schema, for example `chrome.users.apps.InstallType`. Wildcards are supported,
        but only in the leaf portion of the schema name, for example `chrome.users.apps.*`.
    policy_target_key:
      # Generic: Google documents PolicyTargetKey as an object whose additionalTargetKeys
      # map depends on the schema.
      type: dict[str, Any]
      description: >-
        The key of the target resource on which the policies should be resolved. Has
        `targetResource` (`orgunits/{orgunit_id}` or `groups/{group_id}`) and
        `additionalTargetKeys`, such as `{"app_id": "chrome:<extension_id>"}`.
    page_size:
      type: int | None
      description: The maximum number of policies to return, defaults to 100 and has a maximum of 1000.
      default: null
    page_token:
      type: str | None
      description: The page token used to retrieve a specific page of the request.
      default: null
  steps:
    - ref: build_body
      action: core.script.run_python
      args:
        inputs:
          policy_schema_filter: ${{ inputs.policy_schema_filter }}
          policy_target_key: ${{ inputs.policy_target_key }}
          page_size: ${{ inputs.page_size }}
          page_token: ${{ inputs.page_token }}
        script: |
          def main(policy_schema_filter, policy_target_key, page_size, page_token):
              # Values nested inside `body` are not null-pruned, so omit unset
              # paging fields rather than sending an explicit null.
              body = {
                  "policySchemaFilter": policy_schema_filter,
                  "policyTargetKey": policy_target_key,
              }
              if page_size is not None:
                  body["pageSize"] = page_size
              if page_token is not None:
                  body["pageToken"] = page_token
              return body
    - ref: resolve_policies
      action: tools.google_api.call_api
      args:
        service_name: chromepolicy
        version: v1
        resource: customers.policies
        method_name: resolve
        access_token: ${{ SECRETS.google_admin_oauth.GOOGLE_ADMIN_USER_TOKEN || SECRETS.google_admin_oauth.GOOGLE_ADMIN_SERVICE_TOKEN }}
        scopes: ["https://www.googleapis.com/auth/chrome.management.policy.readonly"]
        params:
          customer: customers/${{ inputs.customer }}
          body: ${{ steps.build_body.result }}
  returns: ${{ steps.resolve_policies.result }}
