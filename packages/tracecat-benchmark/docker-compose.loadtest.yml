# PostgreSQL scatter load-test override.
#
# `just cluster loadtest --matrix <csv>` selects and parameterizes this layer.
# Do not invoke raw Compose or use `cluster up --loadtest` for an ordinary
# experiment; those are low-level implementation and diagnostic interfaces.
#
# By default, this override constrains ONLY `postgres_db`, the application
# database under test. The other resource settings default to 0 (unlimited) but
# can be set independently through the TRACECAT__LOADTEST_*_CPUS and
# TRACECAT__LOADTEST_*_MEMORY variables. Temporal persistence runs on the
# separate `temporal_postgres_db` service and stays unconstrained unless an
# experiment explicitly gives it a limit. Verify at runtime that Temporal still
# points at `temporal_postgres_db`.
#
# See scripts/benchmark/postgres-scatter-load-test-plan.md.

services:
  # === Per-service resource dimensions ======================================
  #
  # `0` means unlimited, preserving the normal dev-stack behavior. The
  # PostgreSQL defaults below remain the one constrained baseline dimension.
  # `memswap_limit` deliberately follows `mem_limit`, so a memory-constrained
  # experiment cannot silently spill into swap.
  caddy:
    cpus: "${TRACECAT__LOADTEST_CADDY_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_CADDY_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_CADDY_MEMORY:-0}

  ui:
    cpus: "${TRACECAT__LOADTEST_UI_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_UI_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_UI_MEMORY:-0}

  # === Database under test ===================================================
  # Controlled test settings. These are NOT a claim that the container
  # resembles a named RDS instance class.
  postgres_db:
    cpus: "${TRACECAT__LOADTEST_POSTGRES_DB_CPUS:-1.0}"
    mem_limit: ${TRACECAT__LOADTEST_POSTGRES_DB_MEMORY:-1g}
    memswap_limit: ${TRACECAT__LOADTEST_POSTGRES_DB_MEMORY:-1g}
    pids_limit: ${TRACECAT__LOADTEST_POSTGRES_DB_PIDS:-256}
    command:
      - postgres
      - -c
      - max_connections=${TRACECAT__LOADTEST_POSTGRES_MAX_CONNECTIONS:-50}
      - -c
      - shared_buffers=${TRACECAT__LOADTEST_POSTGRES_SHARED_BUFFERS:-128MB}

  migrations:
    cpus: "${TRACECAT__LOADTEST_MIGRATIONS_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_MIGRATIONS_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_MIGRATIONS_MEMORY:-0}

  temporal_postgres_db:
    cpus: "${TRACECAT__LOADTEST_TEMPORAL_POSTGRES_DB_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_TEMPORAL_POSTGRES_DB_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_TEMPORAL_POSTGRES_DB_MEMORY:-0}

  temporal:
    cpus: "${TRACECAT__LOADTEST_TEMPORAL_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_TEMPORAL_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_TEMPORAL_MEMORY:-0}
    environment:
      # The auto-setup image otherwise falls back to four history shards, which
      # serializes a 1k workflow burst onto four transfer queues. Match the
      # production deployment default; history shard count is immutable after
      # cluster initialization, and load tests always use a fresh cluster.
      NUM_HISTORY_SHARDS: "${TRACECAT__LOADTEST_TEMPORAL_NUM_HISTORY_SHARDS:-512}"

  temporal_ui:
    cpus: "${TRACECAT__LOADTEST_TEMPORAL_UI_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_TEMPORAL_UI_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_TEMPORAL_UI_MEMORY:-0}

  minio:
    cpus: "${TRACECAT__LOADTEST_MINIO_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_MINIO_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_MINIO_MEMORY:-0}

  redis:
    cpus: "${TRACECAT__LOADTEST_REDIS_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_REDIS_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_REDIS_MEMORY:-0}

  # === Connection budget =====================================================
  #
  # PLACEHOLDER VALUES. Finalize these after the phase 0/1 baseline
  # measurement, then record the measured numbers in the run artifacts.
  #
  # The plan's invariant is:
  #
  #   C_budget     = max_connections - C_admin_reserve - C_nonload_baseline
  #   C_configured = sum(replicas[i] * processes_per_replica[i]
  #                      * sum(pool_size[i, p] + max_overflow[i, p]
  #                            for p in engine_pools[i]))
  #   Required: C_configured <= C_budget
  #
  # We set a pool ceiling on EVERY database-capable service below, so
  # C_nonload_baseline is zero by construction: every long-lived application
  # connection is already inside C_configured. That avoids double-counting the
  # idle connections of the non-load services against the same budget.
  #
  # Reserve arithmetic against max_connections=50:
  #
  #   superuser_reserved_connections (PostgreSQL built-in)          3
  #   operator + metric-collector sessions (psql, pg_stat_activity) 3
  #   `migrations` container burst (alembic, sync psycopg engine)   2
  #   ------------------------------------------------------------ --
  #   C_admin_reserve (INCLUSIVE of the built-in reserve)           8
  #   C_budget = 50 - 8 - 0                                        42
  #
  # CAVEAT: the built-in `superuser_reserved_connections` only withholds slots
  # from NON-superuser roles. The dev stack connects as `postgres`, which is a
  # superuser, so those 3 slots are not actually protected today. Either point
  # TRACECAT__POSTGRES_USER at a non-superuser role for the run, or treat the
  # reserve as advisory and confirm it during the runtime checks.
  #
  # Per-service allocation. Every dev-profile service below is 1 replica
  # running 1 process that can create the shared async SQLAlchemy engines
  # (`api` runs a single uvicorn process with no --workers, and this override
  # pins LiteLLM to 1 worker). Executor sandbox workers use the executor-local
  # Action Gateway over a Unix socket, so they do not multiply the executor's
  # main/auth engine ownership.
  #
  # PR #3141 added one independent authentication pool to every service
  # process. Both pools count toward a direct PostgreSQL ceiling, even though
  # they are created lazily. The one-replica baseline therefore budgets both:
  #
  #   service          main pool  auth pool  ceiling  rationale
  #   api                    5+0        2+0        7  submissions and polling
  #   worker                 5+0        4+0        9  DSL workflow worker
  #   executor               9+0        5+0       14  eight actions + margin
  #   agent-worker           2+0        1+0        3  idle during this test
  #   mcp                    2+0        1+0        3  idle during this test
  #   litellm                2+0        1+0        3  one process in this profile
  #   agent-executor         2+0        1+0        3  idle during this test
  #   -----------------------------------------------------------
  #   C_configured                                42  <= C_budget (42)   OK
  #
  # Executor action-admission budget for the default profile:
  #
  #   C_executor = executor_replicas
  #              * max_concurrent_activities_per_replica
  #              = 1 * 2 = 2
  #
  # Load-test scatter fixtures contain independent static action nodes and do
  # not use `for_each`. Matrix cases may raise admission to eight activities;
  # those eight actions sit one below the executor main pool's 9-connection
  # ceiling. Authentication lookups use the separately budgeted five-connection
  # auth pool. Confirm both pools from runtime metrics before trusting this
  # assumption.
  #
  # TRACECAT__DB_POOL_TIMEOUT is set here so pool exhaustion fails within a
  # known bound rather than waiting indefinitely. It is honored by
  # `tracecat/db/engine.py`, which passes `pool_timeout` to
  # `create_async_engine`; re-confirm that during the phase 2 runtime checks
  # before attributing any unbounded wait to something else.

  api:
    cpus: "${TRACECAT__LOADTEST_API_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_API_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_API_MEMORY:-0}
    ports:
      - "127.0.0.1:${API_DB_POOL_METRICS_PORT:-9480}:9091"
    environment:
      # Internal benchmark bootstrap. This is fixed harness wiring, not an
      # application setting or a user-tunable benchmark dimension.
      PYTHONPATH: /app/packages/tracecat-benchmark/bootstrap:/app/packages/tracecat-benchmark:/home/apiuser/.local:/app/local_registry
      TRACECAT_BENCHMARK_INTERNAL_DB_POOL_METRICS_PORT: 9091
      TRACECAT__DB_POOL_SIZE: ${TRACECAT__LOADTEST_API_DB_POOL_SIZE:-5}
      TRACECAT__DB_MAX_OVERFLOW: ${TRACECAT__LOADTEST_API_DB_MAX_OVERFLOW:-0}
      TRACECAT__DB_AUTH_POOL_SIZE: ${TRACECAT__LOADTEST_API_DB_AUTH_POOL_SIZE:-2}
      TRACECAT__DB_AUTH_MAX_OVERFLOW: ${TRACECAT__LOADTEST_API_DB_AUTH_MAX_OVERFLOW:-0}
      TRACECAT__DB_POOL_TIMEOUT: ${TRACECAT__LOADTEST_DB_POOL_TIMEOUT:-10}
      TRACECAT__DB_POOL_RECYCLE: ${TRACECAT__LOADTEST_DB_POOL_RECYCLE:-600}

  worker:
    cpus: "${TRACECAT__LOADTEST_WORKER_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_WORKER_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_WORKER_MEMORY:-0}
    ports:
      - "127.0.0.1:${TEMPORAL_WORKER_METRICS_PORT:-9464}:9090"
      - "127.0.0.1:${WORKER_DB_POOL_METRICS_PORT:-9481}:9091"
    environment:
      # Internal benchmark bootstrap. This is fixed harness wiring, not an
      # application setting or a user-tunable benchmark dimension.
      PYTHONPATH: /app/packages/tracecat-benchmark/bootstrap:/app/packages/tracecat-benchmark:/home/apiuser/.local:/app/local_registry
      TRACECAT_BENCHMARK_INTERNAL_DB_POOL_METRICS_PORT: 9091
      TRACECAT__DB_POOL_SIZE: ${TRACECAT__LOADTEST_WORKER_DB_POOL_SIZE:-5}
      TRACECAT__DB_MAX_OVERFLOW: ${TRACECAT__LOADTEST_WORKER_DB_MAX_OVERFLOW:-0}
      TRACECAT__DB_AUTH_POOL_SIZE: ${TRACECAT__LOADTEST_WORKER_DB_AUTH_POOL_SIZE:-4}
      TRACECAT__DB_AUTH_MAX_OVERFLOW: ${TRACECAT__LOADTEST_WORKER_DB_AUTH_MAX_OVERFLOW:-0}
      TRACECAT__DB_POOL_TIMEOUT: ${TRACECAT__LOADTEST_DB_POOL_TIMEOUT:-10}
      TRACECAT__DB_POOL_RECYCLE: ${TRACECAT__LOADTEST_DB_POOL_RECYCLE:-600}
      TRACECAT__DSL_SCHEDULER_MAX_PENDING_TASKS: ${TRACECAT__LOADTEST_DSL_SCHEDULER_MAX_PENDING_TASKS:-64}
      TRACECAT__CHILD_WORKFLOW_DISPATCH_WINDOW: ${TRACECAT__LOADTEST_CHILD_WORKFLOW_DISPATCH_WINDOW:-16}
      TEMPORAL__THREADPOOL_MAX_WORKERS: ${TRACECAT__LOADTEST_TEMPORAL_THREADPOOL_MAX_WORKERS:-100}
      TEMPORAL__MAX_CONCURRENT_ACTIVITIES: ${TRACECAT__LOADTEST_TEMPORAL_MAX_CONCURRENT_ACTIVITIES:-100}
      TEMPORAL__MAX_CONCURRENT_WORKFLOW_TASKS: ${TRACECAT__LOADTEST_TEMPORAL_MAX_CONCURRENT_WORKFLOW_TASKS:-100}
      TEMPORAL__METRICS_PORT: 9090

  executor:
    cpus: "${TRACECAT__LOADTEST_EXECUTOR_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_EXECUTOR_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_EXECUTOR_MEMORY:-0}
    volumes:
      # This is a runtime cache, so image copy-up is unnecessary. Disabling it
      # also prevents scaled executors from racing to populate the new volume.
      - type: volume
        source: sandbox-cache
        target: /var/lib/tracecat/sandbox-cache
        volume:
          nocopy: true
    ports:
      # Compose assigns one port from this range to each scaled executor.
      # The matrix resolves every mapping with `docker compose port --index`.
      - "127.0.0.1:${TEMPORAL_EXECUTOR_METRICS_PORT:-9465}-${TEMPORAL_EXECUTOR_METRICS_PORT_END:-9474}:9090"
      - "127.0.0.1:${EXECUTOR_DB_POOL_METRICS_PORT:-9482}-${EXECUTOR_DB_POOL_METRICS_PORT_END:-9491}:9091"
    environment:
      # Internal benchmark bootstrap. This is fixed harness wiring, not an
      # application setting or a user-tunable benchmark dimension.
      PYTHONPATH: /app/packages/tracecat-benchmark/bootstrap:/app/packages/tracecat-benchmark:/home/apiuser/.local:/app/local_registry
      TRACECAT_BENCHMARK_INTERNAL_DB_POOL_METRICS_PORT: 9091
      TRACECAT__DB_POOL_SIZE: ${TRACECAT__LOADTEST_EXECUTOR_DB_POOL_SIZE:-9}
      TRACECAT__DB_MAX_OVERFLOW: ${TRACECAT__LOADTEST_EXECUTOR_DB_MAX_OVERFLOW:-0}
      TRACECAT__DB_AUTH_POOL_SIZE: ${TRACECAT__LOADTEST_EXECUTOR_DB_AUTH_POOL_SIZE:-5}
      TRACECAT__DB_AUTH_MAX_OVERFLOW: ${TRACECAT__LOADTEST_EXECUTOR_DB_AUTH_MAX_OVERFLOW:-0}
      TRACECAT__DB_POOL_TIMEOUT: ${TRACECAT__LOADTEST_DB_POOL_TIMEOUT:-10}
      TRACECAT__DB_POOL_RECYCLE: ${TRACECAT__LOADTEST_DB_POOL_RECYCLE:-600}
      TRACECAT__EXECUTOR_MAX_CONCURRENT_ACTIVITIES: ${TRACECAT__LOADTEST_EXECUTOR_MAX_CONCURRENT_ACTIVITIES:-8}
      TRACECAT__EXECUTOR_FOR_EACH_MAX_CONCURRENCY: ${TRACECAT__LOADTEST_EXECUTOR_FOR_EACH_MAX_CONCURRENCY:-4}
      TRACECAT__EXECUTOR_THREADPOOL_MAX_WORKERS: ${TRACECAT__LOADTEST_EXECUTOR_THREADPOOL_MAX_WORKERS:-}
      TEMPORAL__METRICS_PORT: 9090

  agent-worker:
    cpus: "${TRACECAT__LOADTEST_AGENT_WORKER_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_AGENT_WORKER_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_AGENT_WORKER_MEMORY:-0}
    environment:
      TRACECAT__DB_POOL_SIZE: ${TRACECAT__LOADTEST_AGENT_WORKER_DB_POOL_SIZE:-2}
      TRACECAT__DB_MAX_OVERFLOW: ${TRACECAT__LOADTEST_AGENT_WORKER_DB_MAX_OVERFLOW:-0}
      TRACECAT__DB_AUTH_POOL_SIZE: ${TRACECAT__LOADTEST_AGENT_WORKER_DB_AUTH_POOL_SIZE:-1}
      TRACECAT__DB_AUTH_MAX_OVERFLOW: ${TRACECAT__LOADTEST_AGENT_WORKER_DB_AUTH_MAX_OVERFLOW:-0}
      TRACECAT__DB_POOL_TIMEOUT: ${TRACECAT__LOADTEST_DB_POOL_TIMEOUT:-10}
      TRACECAT__DB_POOL_RECYCLE: ${TRACECAT__LOADTEST_DB_POOL_RECYCLE:-600}

  mcp:
    cpus: "${TRACECAT__LOADTEST_MCP_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_MCP_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_MCP_MEMORY:-0}
    environment:
      TRACECAT__DB_POOL_SIZE: ${TRACECAT__LOADTEST_MCP_DB_POOL_SIZE:-2}
      TRACECAT__DB_MAX_OVERFLOW: ${TRACECAT__LOADTEST_MCP_DB_MAX_OVERFLOW:-0}
      TRACECAT__DB_AUTH_POOL_SIZE: ${TRACECAT__LOADTEST_MCP_DB_AUTH_POOL_SIZE:-1}
      TRACECAT__DB_AUTH_MAX_OVERFLOW: ${TRACECAT__LOADTEST_MCP_DB_AUTH_MAX_OVERFLOW:-0}
      TRACECAT__DB_POOL_TIMEOUT: ${TRACECAT__LOADTEST_DB_POOL_TIMEOUT:-10}
      TRACECAT__DB_POOL_RECYCLE: ${TRACECAT__LOADTEST_DB_POOL_RECYCLE:-600}

  litellm:
    cpus: "${TRACECAT__LOADTEST_LITELLM_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_LITELLM_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_LITELLM_MEMORY:-0}
    environment:
      TRACECAT__LITELLM_NUM_WORKERS: ${TRACECAT__LOADTEST_LITELLM_NUM_WORKERS:-1}
      TRACECAT__DB_POOL_SIZE: ${TRACECAT__LOADTEST_LITELLM_DB_POOL_SIZE:-2}
      TRACECAT__DB_MAX_OVERFLOW: ${TRACECAT__LOADTEST_LITELLM_DB_MAX_OVERFLOW:-0}
      TRACECAT__DB_AUTH_POOL_SIZE: ${TRACECAT__LOADTEST_LITELLM_DB_AUTH_POOL_SIZE:-1}
      TRACECAT__DB_AUTH_MAX_OVERFLOW: ${TRACECAT__LOADTEST_LITELLM_DB_AUTH_MAX_OVERFLOW:-0}
      TRACECAT__DB_POOL_TIMEOUT: ${TRACECAT__LOADTEST_DB_POOL_TIMEOUT:-10}
      TRACECAT__DB_POOL_RECYCLE: ${TRACECAT__LOADTEST_DB_POOL_RECYCLE:-600}

  agent-executor:
    cpus: "${TRACECAT__LOADTEST_AGENT_EXECUTOR_CPUS:-0}"
    mem_limit: ${TRACECAT__LOADTEST_AGENT_EXECUTOR_MEMORY:-0}
    memswap_limit: ${TRACECAT__LOADTEST_AGENT_EXECUTOR_MEMORY:-0}
    volumes:
      - type: volume
        source: sandbox-cache
        target: /var/lib/tracecat/sandbox-cache
        volume:
          nocopy: true
    environment:
      TRACECAT__DB_POOL_SIZE: ${TRACECAT__LOADTEST_AGENT_EXECUTOR_DB_POOL_SIZE:-2}
      TRACECAT__DB_MAX_OVERFLOW: ${TRACECAT__LOADTEST_AGENT_EXECUTOR_DB_MAX_OVERFLOW:-0}
      TRACECAT__DB_AUTH_POOL_SIZE: ${TRACECAT__LOADTEST_AGENT_EXECUTOR_DB_AUTH_POOL_SIZE:-1}
      TRACECAT__DB_AUTH_MAX_OVERFLOW: ${TRACECAT__LOADTEST_AGENT_EXECUTOR_DB_AUTH_MAX_OVERFLOW:-0}
      TRACECAT__DB_POOL_TIMEOUT: ${TRACECAT__LOADTEST_DB_POOL_TIMEOUT:-10}
      TRACECAT__DB_POOL_RECYCLE: ${TRACECAT__LOADTEST_DB_POOL_RECYCLE:-600}
