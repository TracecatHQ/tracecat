version = 1
name = "tracecat"

[setup]
script = "bash .codex/environments/setup.sh"

[[actions]]
name = "Install dependencies"
icon = "run"
command = "bash .codex/environments/setup.sh"

[[actions]]
name = "Start cluster"
icon = "run"
command = '''
set -euo pipefail
if ! docker compose ls --filter 'name=^tracecat$' --format json | jq -e 'length == 0' >/dev/null; then
  echo "Check the existing tracecat Compose stack before starting a worktree cluster." >&2
  exit 1
fi
just cluster up -d
'''

[[actions]]
name = "Cluster status"
icon = "run"
command = "just cluster ps"

[[actions]]
name = "Cluster URLs"
icon = "run"
command = "just cluster ports"
